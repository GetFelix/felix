[package]
name = "felix-controlplane-service"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Felix control-plane HTTP service binary"
repository.workspace = true
homepage.workspace = true
readme.workspace = true
# Not a library anyone consumes from a registry: service binaries and a
# dev/CI tool with hard AGPL-3.0 dependencies.
publish = false

[[bin]]
name = "felix-controlplane"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
axum = { workspace = true }
felix-common = { path = "../../crates/server/felix-common", version = "0.8.0-preview.0", features = ["hasher", "lifecycle", "openapi", "tls", "yaml"] }
felix-router = { path = "../../crates/server/felix-router", version = "0.8.0-preview.0" }
# The name grammar and lease templates, shared with the brokers that expand them.
felix-authz = { path = "../../crates/server/felix-authz", version = "0.8.0-preview.0" }
metrics = { workspace = true }
metrics-exporter-prometheus = { workspace = true }
opentelemetry = { workspace = true }
opentelemetry-otlp = { workspace = true }
opentelemetry_sdk = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
# `CancellationToken` coordinates the graceful drain in `src/server/drain.rs`.
tokio-util = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-opentelemetry = { workspace = true }
tower-http = { version = "0.7", features = ["trace"] }
utoipa = { workspace = true, features = ["axum_extras"] }
async-trait = { workspace = true }
thiserror = { workspace = true }
chrono = { version = "0.4", features = ["serde"] }
casbin = { workspace = true }
dashmap = { workspace = true }
base64 = { workspace = true }
ed25519-dalek = { workspace = true }
hex = "0.4"
jsonwebtoken = { version = "11", default-features = false, features = ["aws_lc_rs", "use_pem"] }
reqwest = { workspace = true, features = ["stream"] }
sha2 = "0.11"
rand = "0.10"
# The bootstrap listener's optional mTLS termination (`src/server/tls.rs`). PEM
# loading comes from pki-types' own "pem" feature, not rustls-pemfile, which
# is unmaintained (RUSTSEC-2025-0134).
rustls = { workspace = true }
tokio-rustls = "0.26"
hyper-util = { version = "0.1", features = ["server-auto", "http1", "http2", "tokio", "service"] }
# The metadata Raft core (`src/raft/`), per docs/metadata-raft-design.md.
# openraft types stay inside `src/raft/`; that containment is the seam.
openraft = { workspace = true, features = ["serde", "tokio-rt"] }
futures-util = { version = "0.3", default-features = false }
uuid = { workspace = true }
# The Raft log, vote, snapshot and member file (`src/raft/store.rs`): the
# same storage engine the broker uses (docs/metadata-raft-design.md).
felix-storage = { path = "../../crates/server/felix-storage", version = "0.8.0-preview.0", features = ["raft"] }
bytes = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tower = "0.5"
tempfile = { workspace = true }
serial_test = { workspace = true }
base64 = { workspace = true }
# Certificate fixtures for the bootstrap mTLS tests.
rcgen = { workspace = true }

[lib]
path = "src/lib.rs"

[lints]
workspace = true
