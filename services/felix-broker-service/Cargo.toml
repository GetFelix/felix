[package]
name = "felix-broker-service"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Felix broker service binary"
repository.workspace = true
homepage.workspace = true
readme.workspace = true
# Not a library anyone consumes from a registry: service binaries and a
# dev/CI tool with hard AGPL-3.0 dependencies.
publish = false
# Eight of the nine binaries here are demos, so `cargo run -p felix-broker-service` asked
# which one rather than running the broker.
default-run = "felix-broker"

[[bin]]
name = "felix-broker"
path = "src/main.rs"

[[bin]]
name = "pubsub-demo-simple"
path = "../../demos/broker/simple_pubsub_demo.rs"
required-features = ["demo"]

[[bin]]
name = "cache-demo"
path = "../../demos/broker/cache_demo.rs"
required-features = ["demo"]

[[bin]]
name = "latency-demo"
path = "../../demos/broker/latency_demo.rs"
required-features = ["demo"]

[[bin]]
name = "pubsub-demo-notifications"
path = "../../demos/broker/notifications_demo.rs"

[[bin]]
name = "pubsub-demo-orders"
path = "../../demos/broker/orders_demo.rs"

[[bin]]
name = "durable-restart-demo"
path = "../../demos/broker/durable_restart_demo.rs"

[[bin]]
name = "queue-semantics-demo"
path = "../../demos/broker/queue_semantics_demo.rs"

# Soak and resource-leak harness (#154). Not a demo: it exits non-zero on a
# finding so CI can gate on it.
[[bin]]
name = "soak"
path = "src/bin/soak/main.rs"

[dependencies]
anyhow = { workspace = true }
# The shard lifecycle drives local state through a trait object, so its two
# async methods need boxing.
async-trait = { workspace = true }
felix-router = { path = "../../crates/server/felix-router", version = "0.8.0-preview.2" }
arc-swap = { workspace = true }
base64 = { workspace = true }
felix-broker = { path = "../../crates/server/felix-broker", version = "0.8.0-preview.2" }
felix-common = { path = "../../crates/server/felix-common", version = "0.8.0-preview.2", features = ["blocking", "hasher", "lifecycle", "logging", "tls", "yaml"] }
felix-client = { path = "../../crates/sdk/felix-client", version = "0.8.0-preview.2" }
felix-authz = { path = "../../crates/server/felix-authz", version = "0.8.0-preview.2" }
felix-kafka = { path = "../../crates/server/felix-kafka", version = "0.8.0-preview.2" }
felix-mqtt = { path = "../../crates/server/felix-mqtt", version = "0.8.0-preview.2" }
felix-transport = { path = "../../crates/protocol/felix-transport", version = "0.8.0-preview.2" }
felix-wire = { path = "../../crates/protocol/felix-wire", version = "0.8.0-preview.2" }
felix-storage = { path = "../../crates/server/felix-storage", version = "0.8.0-preview.2" }
felix-replication = { path = "../../crates/server/felix-replication", version = "0.8.0-preview.2" }
bytes = { workspace = true }
dashmap = { workspace = true }
ed25519-dalek = { workspace = true }
futures = "0.3"
axum = { workspace = true }
metrics = { workspace = true }
parking_lot = { workspace = true }
metrics-exporter-prometheus = { workspace = true }
opentelemetry = { workspace = true }
opentelemetry-otlp = { workspace = true }
opentelemetry_sdk = { workspace = true }
jsonwebtoken = { workspace = true }
quinn = { workspace = true }
rcgen = { workspace = true }
rustls = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
serde_json = { workspace = true }
serde-saphyr = { workspace = true, features = ["serialize"] }
tokio = { workspace = true, features = ["fs"] }
# TLS on the Kafka listener, which is plain TCP rather than QUIC.
tokio-rustls = { workspace = true }
# `TaskTracker` and `CancellationToken` back the graceful drain in `node/shutdown.rs`.
tokio-util = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-opentelemetry = { workspace = true }
# The node id a broker without `FELIX_NODE_ID` offloads under.
uuid = { workspace = true }

# Linux-only core pinning (`serving::core_shards`) and Unix-wide SIGTERM delivery in the
# soak harness both need libc; the pinning call site stays `target_os = "linux"`
# gated in code.
[target.'cfg(unix)'.dependencies]
libc = { workspace = true }
# Used by the durable-restart and queue-semantics demo binaries to stage a
# throwaway storage root.
tempfile = { workspace = true }

[dev-dependencies]
# The MQTT tests speak to the listener with the real codec.
felix-mqtt-wire = { path = "../../crates/protocol/felix-mqtt-wire", version = "0.8.0-preview.2" }
# An independent WebSocket client, so the listener is checked against another
# implementation of the protocol and not only its own.
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "handshake"] }
# A third-party MQTT client (Apache-2.0) for the publish conformance tests.
rumqttc = { version = "0.25.1", default-features = false }
tempfile = { workspace = true }
# The Kafka tests run kcat in a container.
tokio = { workspace = true, features = ["process", "test-util"] }
serial_test = { workspace = true }
rcgen = { workspace = true }
rustls = { workspace = true }
# The tests use the demo signing key; see the `demo` feature. The broker a
# `cargo test` builds is the one the cluster harness spawns, so it gets the
# fault hooks in every profile, not only through `debug_assertions`.
felix-broker-service = { path = ".", version = "0.8.0-preview.2", features = ["demo", "raft", "fault-injection"] }
felix-broker = { path = "../../crates/server/felix-broker", version = "0.8.0-preview.2", features = ["fault-injection", "test-support"] }
# Some unit tests slow the fsync through `felix_storage::fault`, which a
# release build (`cargo bench`) only has with this feature.
felix-storage = { path = "../../crates/server/felix-storage", version = "0.8.0-preview.2", features = ["fault-injection"] }
# The Raft tests write a batch cut partway, which no proposal can.
felix-replication = { path = "../../crates/server/felix-replication", version = "0.8.0-preview.2", features = ["testing"] }
# The membership integration test drives the real control-plane router rather
# than a stub, so a mismatch in the HTTP contract between the two services fails
# here instead of in a cluster.
felix-controlplane-service = { path = "../felix-controlplane-service", version = "0.8.0-preview.2" }

# The Kafka and MQTT client matrices run each test a second time against a
# one-node Raft cluster this harness starts. Not published, so no version.
felix-cluster = { path = "../../crates/testing/felix-cluster" }

# The fire-and-forget ingest test runs the load generator against an
# in-process broker.
felix-loadgen = { path = "../../crates/testing/felix-loadgen", version = "0.8.0-preview.2" }

[features]
default = ["raft"]
# `serving::auth::demo`: a fixed signing key and a token minted with it, so a
# demo broker needs no control plane. Never for a deployed broker.
demo = []
# The per-shard Raft engine, the default shard engine; see
# docs/per-shard-raft.md. A build without it runs every shard on the
# deprecated hybrid engine.
raft = ["felix-replication/raft"]
telemetry = ["felix-client/telemetry", "felix-broker/telemetry"]
perf_debug = ["felix-broker/perf_debug"]
# Peer-partition, storage and clock fault injection in an optimised broker, for
# the cluster harness. Debug builds have them regardless. Never in a release
# artifact: `scripts/check_no_fault_injection.sh` refuses one that has them.
fault-injection = ["felix-replication/fault-injection", "felix-storage/fault-injection", "felix-common/fault-injection"]

[lints]
workspace = true
