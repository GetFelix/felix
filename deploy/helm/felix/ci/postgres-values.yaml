# A production-shaped release: two stateless control-plane instances over an
# operator-provided Postgres, three brokers, one broker at a time.
controlplane:
  replicas: 2
  storage:
    backend: postgres
    postgres:
      existingSecret: felix-postgres
broker:
  replicas: 3
  credential:
    existingSecret: felix-broker-credential
  peerTls:
    allowUnauthenticated: true
  storage:
    storageClassName: fast-ssd
  config:
    event_batch_max_events: 64
    event_batch_max_delay_us: 250
serviceMonitor:
  enabled: true
