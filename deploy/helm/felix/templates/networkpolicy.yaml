{{- if and .Values.broker.enabled .Values.broker.networkPolicy.enabled }}
{{- $b := .Values.broker }}
{{- $np := $b.networkPolicy }}
# The internal port is for brokers. Without peer mTLS anything that reaches
# it is a broker, so reachability is the boundary; with it, this is the
# second fence. Either way it is never a Service port.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "felix.broker.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "felix.labels" . | nindent 4 }}
    app.kubernetes.io/component: broker
spec:
  podSelector:
    matchLabels:
      {{- include "felix.broker.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    # Brokers, to each other.
    - from:
        - podSelector:
            matchLabels:
              {{- include "felix.broker.selectorLabels" . | nindent 14 }}
      ports:
        - protocol: UDP
          port: {{ int $b.ports.internal }}
    # Clients.
    - {{- if $np.clientNamespaceSelectors }}
      from:
        {{- range $np.clientNamespaceSelectors }}
        - namespaceSelector:
            {{- toYaml . | nindent 12 }}
        {{- end }}
      {{- end }}
      ports:
        {{- range $offset := until (int (default 1 $b.ports.listeners)) }}
        - protocol: UDP
          port: {{ add (int $b.ports.client) $offset }}
        {{- end }}
    # Scrapers and probes.
    - {{- if $np.metricsNamespaceSelectors }}
      from:
        {{- range $np.metricsNamespaceSelectors }}
        - namespaceSelector:
            {{- toYaml . | nindent 12 }}
        {{- end }}
      {{- end }}
      ports:
        - protocol: TCP
          port: {{ int $b.ports.metrics }}
{{- end }}
{{- $cp := .Values.controlplane }}
{{- if and $cp.enabled (eq $cp.storage.backend "raft") $cp.networkPolicy.enabled }}
---
# The Raft peer port can replace the whole metadata store, so only members
# (and whatever raftPeerFrom names) reach it; the peer token, and peer mTLS
# when it is on, are the fences behind this one. The other ports stay open
# to the cluster, as they are with no policy at all.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "felix.controlplane.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "felix.labels" . | nindent 4 }}
    app.kubernetes.io/component: controlplane
spec:
  podSelector:
    matchLabels:
      {{- include "felix.controlplane.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "felix.controlplane.selectorLabels" . | nindent 14 }}
        {{- with $cp.networkPolicy.raftPeerFrom }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ int $cp.storage.raft.peerPort }}
    - ports:
        - protocol: TCP
          port: {{ int $cp.service.port }}
        - protocol: TCP
          port: {{ int $cp.metrics.port }}
        {{- if $cp.bootstrap.enabled }}
        - protocol: TCP
          port: {{ int $cp.bootstrap.port }}
        {{- end }}
{{- end }}
