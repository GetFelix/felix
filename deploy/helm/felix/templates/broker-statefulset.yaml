{{- include "felix.validate" . -}}
{{- if .Values.broker.enabled }}
{{- $b := .Values.broker }}
{{- $name := include "felix.broker.fullname" . }}
{{- $headless := include "felix.broker.headless" . }}
{{- $image := include "felix.image" (dict "root" . "image" $b.image) }}
{{- $clientPort := int $b.ports.client }}
{{- $internalPort := int $b.ports.internal }}
{{- $listeners := int (default 1 $b.ports.listeners) }}
{{- if lt $listeners 1 }}
  {{- fail "broker.ports.listeners must be at least 1" }}
{{- end }}
{{- $lastClientPort := add $clientPort $listeners -1 }}
{{- if and (ge $internalPort $clientPort) (le $internalPort $lastClientPort) }}
  {{- fail (printf "broker.ports.internal (%d) falls inside the client listener range %d-%d; move it outside" $internalPort $clientPort $lastClientPort) }}
{{- end }}
{{- $metricsPort := int $b.ports.metrics }}
{{- /*
With `zones` set, one StatefulSet per zone, each pinned to its zone's nodes
and telling its brokers which zone they are in. A pod cannot read its node's
labels, so the zone is known per StatefulSet instead. Without it, one
StatefulSet with the selector it always had, so an upgrade does not trip over
the selector being immutable.
*/}}
{{- $zones := $b.zones | default (list "") }}
{{- /*
A broker's pod name is its node id: the identity it registers with, the name
its shards are assigned to, and under peer mTLS the DNS name its certificate
must carry. Replacing the pod keeps all three, and the volume behind it, which
is what makes a replacement a rejoin rather than a new member.
*/}}
{{- range $i, $zone := $zones }}
{{- if $i }}
---
{{- end }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ if $zone }}{{ printf "%s-%s" $name $zone }}{{ else }}{{ $name }}{{ end }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "felix.labels" $ | nindent 4 }}
    app.kubernetes.io/component: broker
spec:
  serviceName: {{ $headless }}
  replicas: {{ int $b.replicas }}
  # One broker at a time, each back in its replica sets before the next goes.
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      {{- include "felix.broker.selectorLabels" $ | nindent 6 }}
      {{- if $zone }}
      felix/zone: {{ $zone | quote }}
      {{- end }}
  template:
    metadata:
      labels:
        {{- include "felix.broker.selectorLabels" $ | nindent 8 }}
        {{- if $zone }}
        felix/zone: {{ $zone | quote }}
        {{- end }}
        {{- with $b.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ $metricsPort | quote }}
        prometheus.io/path: /metrics
        # A config change rolls the brokers.
        checksum/config: {{ include (print $.Template.BasePath "/broker-configmap.yaml") $ | sha256sum }}
        {{- with $b.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "felix.serviceAccountName" $ }}
      automountServiceAccountToken: false
      {{- with $.Values.image.pullSecrets }}
      imagePullSecrets:
        {{- range . }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
      securityContext:
        {{- include "felix.podSecurityContext" $ | nindent 8 }}
      terminationGracePeriodSeconds: {{ include "felix.broker.terminationGracePeriodSeconds" $ }}
      {{- $workload := $b }}
      {{- if $zone }}
      {{- $workload = merge (dict "nodeSelector" (merge (dict "topology.kubernetes.io/zone" $zone) ($b.nodeSelector | default dict))) $b }}
      {{- end }}
      {{- include "felix.scheduling" (dict "workload" $workload "selectorLabels" (include "felix.broker.selectorLabels" $)) | nindent 6 }}
      containers:
        - name: broker
          image: {{ $image | quote }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          ports:
            {{- range $offset := until $listeners }}
            - name: {{ if eq $offset 0 }}quic{{ else }}quic-{{ $offset }}{{ end }}
              containerPort: {{ add $clientPort $offset }}
              protocol: UDP
            {{- end }}
            - name: internal
              containerPort: {{ $internalPort }}
              protocol: UDP
            - name: metrics
              containerPort: {{ $metricsPort }}
              protocol: TCP
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: FELIX_NODE_ID
              value: "$(POD_NAME)"
            - name: FELIX_REGION_ID
              value: {{ $b.region | quote }}
            {{- if $zone }}
            - name: FELIX_NODE_ZONE
              value: {{ $zone | quote }}
            {{- end }}
            - name: FELIX_QUIC_BIND
              value: "0.0.0.0:{{ $clientPort }}"
            - name: FELIX_QUIC_LISTENERS
              value: {{ $listeners | quote }}
            - name: FELIX_INTERNAL_BIND
              value: "0.0.0.0:{{ $internalPort }}"
            # Peers are told an IP: the broker requires one, and a replaced
            # pod re-registers its new one on its first heartbeat.
            - name: FELIX_NODE_ADVERTISE_ADDR
              value: "$(POD_IP):{{ $internalPort }}"
            # Clients are told a name, which survives the pod being replaced.
            - name: FELIX_CLIENT_ADVERTISE_ADDR
              value: {{ include "felix.broker.clientAdvertiseAddr" $ | quote }}
            - name: FELIX_BROKER_METRICS_BIND
              value: "0.0.0.0:{{ $metricsPort }}"
            - name: FELIX_CONTROLPLANE_URL
              value: {{ include "felix.controlplane.url" $ | quote }}
            - name: FELIX_NODE_TOKEN_FILE
              value: {{ printf "/etc/felix/credential/%s" (ternary "$(POD_NAME)" $b.credential.tokenKey $b.credential.perBroker) | quote }}
            {{- if $b.credential.refreshTokenKey }}
            - name: FELIX_NODE_REFRESH_TOKEN_FILE
              value: {{ printf "/etc/felix/credential/%s" $b.credential.refreshTokenKey | quote }}
            {{- end }}
            - name: FELIX_DURABLE_STORAGE_DIR
              value: /var/lib/felix/data
            {{- if $b.clientTls.enabled }}
            - name: FELIX_TLS_CERT
              value: /etc/felix/client-tls/tls.crt
            - name: FELIX_TLS_KEY
              value: /etc/felix/client-tls/tls.key
            {{- if $b.clientTls.clientCaKey }}
            - name: FELIX_TLS_CLIENT_CA
              value: {{ printf "/etc/felix/client-tls/%s" $b.clientTls.clientCaKey | quote }}
            {{- end }}
            # A broker that lost its Secret mount must not quietly fall back
            # to a generated certificate.
            - name: FELIX_TLS_REQUIRE_CERT
              value: "true"
            {{- else }}
            # The broker's client-facing certificate is generated at start;
            # this is where clients read it from.
            - name: FELIX_TLS_CERT_EXPORT
              value: /var/lib/felix/export/broker-cert.pem
            {{- end }}
            {{- if and $.Values.controlplane.tls.enabled $.Values.controlplane.tls.caKey }}
            - name: FELIX_CONTROLPLANE_CA
              value: /etc/felix/controlplane-ca/ca.crt
            {{- end }}
            {{- if not $b.peerTls.enabled }}
            - name: FELIX_INTERNAL_ALLOW_UNAUTHENTICATED
              value: "true"
            {{- end }}
            {{- if $b.peerTls.enabled }}
            - name: FELIX_INTERNAL_TLS_CERT
              value: /etc/felix/peer/tls.crt
            - name: FELIX_INTERNAL_TLS_KEY
              value: /etc/felix/peer/tls.key
            - name: FELIX_INTERNAL_TLS_CA
              value: /etc/felix/peer/ca.crt
            {{- end }}
            {{- if $b.config }}
            - name: FELIX_BROKER_CONFIG
              value: /etc/felix/config/broker.yml
            {{- end }}
            - name: FELIX_SHUTDOWN_HANDOFF_TIMEOUT_MS
              value: {{ $b.shutdown.handoffTimeoutMs | quote }}
            - name: FELIX_SHUTDOWN_DRAIN_TIMEOUT_MS
              value: {{ $b.shutdown.drainTimeoutMs | quote }}
            - name: RUST_LOG
              value: {{ $b.logLevel | quote }}
            {{- with $b.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          # Ready only once the catalog is seeded from the control plane, so a
          # broker is not routed traffic for streams it does not know yet. On
          # SIGTERM readiness turns 503 first, then the drain runs; liveness
          # holds throughout, so a pod shutting down correctly is not restarted.
          readinessProbe:
            httpGet:
              path: /ready
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /live
              port: metrics
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                # Time for the endpoints controller to take this pod out of
                # rotation before SIGTERM starts the drain.
                command: ["/bin/sh", "-c", "sleep {{ int $b.shutdown.preStopSeconds }}"]
          resources:
            {{- toYaml $b.resources | nindent 12 }}
          securityContext:
            {{- include "felix.containerSecurityContext" $ | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/felix/data
            - name: export
              mountPath: /var/lib/felix/export
            - name: credential
              mountPath: /etc/felix/credential
              readOnly: true
            {{- if $b.peerTls.enabled }}
            - name: peer-tls
              mountPath: /etc/felix/peer
              readOnly: true
            {{- end }}
            {{- if $b.clientTls.enabled }}
            # A directory mount, not subPath, so a renewed Secret reaches the
            # files the broker re-reads.
            - name: client-tls
              mountPath: /etc/felix/client-tls
              readOnly: true
            {{- end }}
            {{- if and $.Values.controlplane.tls.enabled $.Values.controlplane.tls.caKey }}
            - name: controlplane-ca
              mountPath: /etc/felix/controlplane-ca
              readOnly: true
            {{- end }}
            {{- if $b.config }}
            - name: config
              mountPath: /etc/felix/config
              readOnly: true
            {{- end }}
      volumes:
        - name: export
          emptyDir: {}
        - name: credential
          secret:
            secretName: {{ $b.credential.existingSecret }}
        {{- if $b.peerTls.enabled }}
        # One certificate per pod, issued to the pod's own name, which is its
        # node id. cert-manager's CSI driver is what can vary a volume per pod
        # of one StatefulSet; a Secret cannot.
        - name: peer-tls
          csi:
            driver: csi.cert-manager.io
            readOnly: true
            volumeAttributes:
              csi.cert-manager.io/issuer-name: {{ $b.peerTls.issuerName }}
              csi.cert-manager.io/issuer-kind: {{ $b.peerTls.issuerKind }}
              csi.cert-manager.io/dns-names: "${POD_NAME}"
              csi.cert-manager.io/duration: {{ $b.peerTls.duration }}
              csi.cert-manager.io/renew-before: {{ $b.peerTls.renewBefore }}
              csi.cert-manager.io/fs-group: "65532"
        {{- end }}
        {{- if $b.clientTls.enabled }}
        - name: client-tls
          secret:
            secretName: {{ $b.clientTls.existingSecret }}
        {{- end }}
        {{- if and $.Values.controlplane.tls.enabled $.Values.controlplane.tls.caKey }}
        - name: controlplane-ca
          secret:
            secretName: {{ $.Values.controlplane.tls.existingSecret }}
            items:
              - key: {{ $.Values.controlplane.tls.caKey }}
                path: ca.crt
        {{- end }}
        {{- if $b.config }}
        - name: config
          configMap:
            name: {{ $name }}
        {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with $b.storage.storageClassName }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ $b.storage.size }}
{{- end }}
{{- end }}
