# Default values for the felix chart.
#
# Every environment variable named here is real and documented in the
# environment reference; the chart wires them, it does not invent any. Values
# that are wrong together (a budget wider than the replica count, a drain that
# outlives the grace period, a backend without its store) fail at render time
# rather than at 3am.

# Kubernetes cluster DNS suffix, used to build the addresses brokers advertise.
clusterDomain: cluster.local

image:
  # Prepended to every image repository below.
  registry: ghcr.io
  pullPolicy: IfNotPresent
  # Secrets for a private registry, by name only; the chart creates none.
  pullSecrets: []

# One service account for both workloads. Neither talks to the Kubernetes API,
# so it carries no RBAC and its token is not mounted.
serviceAccount:
  create: true
  name: ""
  annotations: {}

controlplane:
  enabled: true
  image:
    repository: gabloe/felix-controlplane
    # Defaults to the chart's appVersion.
    tag: ""
    # Pin by digest in production: images are signed by digest, and a tag can
    # be moved. When set, the tag is ignored.
    digest: ""
  # Instances. Under the postgres backend this is a Deployment that rolls one
  # at a time with none unavailable; under raft it is a StatefulSet whose
  # members must be an odd number, three or more.
  replicas: 2
  storage:
    # memory | postgres | raft
    #
    # `memory` keeps nothing across a restart and is for trying the chart out.
    # `postgres` is stateless instances over one HA database the platform
    # provides. `raft` keeps the metadata in the instances themselves.
    backend: postgres
    postgres:
      # A Secret holding the connection URL, e.g. created with
      #   kubectl create secret generic felix-postgres --from-literal=url=postgres://...
      # The chart never renders the URL into a ConfigMap.
      existingSecret: ""
      urlKey: url
      maxConnections: 10
    raft:
      volume:
        size: 1Gi
        storageClassName: ""
      # The members' Raft peer listener. Only the other members need to reach
      # it; it is on the headless Service and never on the API Service.
      peerPort: 8444
      # Names the group; recorded in each member's volume, which then refuses
      # to start under another id. Defaults to the control plane's full name.
      clusterId: ""
      # A Secret holding the shared peer token (32+ characters) under
      # `tokenKey`, e.g.
      #   kubectl create secret generic felix-raft-peer \
      #     --from-literal=token="$(openssl rand -hex 32)"
      # Every Raft request carries it, and whoever holds it can replace the
      # metadata store: give it to the members and the migration tool only.
      peerToken:
        existingSecret: ""
        tokenKey: token
      # Run without a peer token. For a throwaway cluster only.
      insecurePeers: false
      # `new` lets empty members form a brand-new group; `existing` never
      # does, so members that lost their volumes wait instead of starting an
      # empty control plane. Empty means `new` until the group has formed
      # once and `existing` from then on: a post-install hook waits for the
      # API to be ready and then creates the <fullname>-controlplane-raft-formed
      # ConfigMap, which members read at every start. Deleting that
      # ConfigMap lets empty members form a group again.
      initialClusterState: ""
      # How long the bootstrap hook waits for the group to form. Keep helm's
      # --timeout above it.
      bootstrapTimeoutSeconds: 270
      # Mutual TLS on the peer port (FELIX_RAFT_TLS_*). Off, the peer token
      # and every Raft entry cross the pod network in cleartext, and the
      # NetworkPolicy is the only fence around the port. One Secret for every
      # member, holding tls.crt and tls.key (cert-manager's Certificate writes
      # them) and the CA under `caKey`. Each member presents the certificate
      # as both server and client, so it needs both usages, and it must name
      # every member as the peers map does,
      # <fullname>-controlplane-<n>.<fullname>-controlplane-headless, which
      # a `*.<fullname>-controlplane-headless` DNS name covers. The migration
      # tool needs a certificate from the same CA.
      tls:
        enabled: false
        existingSecret: ""
        caKey: ca.crt
      # Tuning; empty means the control plane's own defaults.
      heartbeatMs: ""
      electionTimeoutMinMs: ""
      electionTimeoutMaxMs: ""
  # Under the raft backend, keeps the Raft peer port to the members
  # themselves and to `raftPeerFrom` (NetworkPolicyPeer entries, e.g. the
  # migration tool's pods). The API, metrics and bootstrap ports stay open to
  # the cluster as they are without a policy.
  networkPolicy:
    enabled: true
    raftPeerFrom: []
  # The day-0 listener that creates the first tenant and the first cluster
  # credential. Off by default; turn it on for the initial setup, use it, and
  # turn it off again. It is reachable only inside the cluster, through its own
  # Service, and never through the API Service.
  bootstrap:
    enabled: false
    # A Secret holding the bootstrap token under `tokenKey`, and optionally
    # the previous token under `previousTokenKey` while it is being rotated.
    existingSecret: ""
    tokenKey: token
    previousTokenKey: ""
    port: 9095
  service:
    type: ClusterIP
    port: 8443
    annotations: {}
  # TLS on the API port (FELIX_CONTROLPLANE_TLS_*). Off, the API is plain
  # HTTP: node credentials, token exchange and tenant JWKS cross the network
  # unencrypted. The Secret is a kubernetes.io/tls one, as cert-manager's
  # Certificate writes it; its certificate must name the API Service
  # (<release>-controlplane.<namespace>.svc). The files are re-read on
  # renewal. It does not cover the Raft peer port (storage.raft.peerPort).
  tls:
    enabled: false
    existingSecret: ""
    # Key in that Secret brokers trust the certificate through. Empty means
    # the public roots only.
    caKey: ca.crt
  metrics:
    port: 8080
  # How long a broker heartbeat may go unanswered before the control plane
  # expires the broker. Keep this above a database failover plus one heartbeat
  # interval, or a failover alone expires brokers that were serving fine.
  liveness:
    nodeExpiryTimeoutMs: ""
    nodeHeartbeatIntervalMs: ""
  shutdown:
    # Readiness fails, then the instance keeps serving this long so load
    # balancers can act on it, then it drains for at most drainTimeoutMs.
    predrainMs: 2000
    drainTimeoutMs: 10000
    # Defaults to (predrainMs + drainTimeoutMs) / 1000 + 5.
    terminationGracePeriodSeconds: ""
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      memory: 512Mi
  podDisruptionBudget:
    enabled: true
    # Voluntary disruption may take instances down to this many.
    minAvailable: 1
  # Spread instances across nodes, and zones where the cluster has them.
  antiAffinity: soft   # soft | hard | none
  topologySpread:
    enabled: true
    topologyKey: topology.kubernetes.io/zone
    maxSkew: 1
    whenUnsatisfiable: ScheduleAnyway
  logLevel: info
  extraEnv: []
  nodeSelector: {}
  tolerations: []
  podAnnotations: {}
  podLabels: {}
  priorityClassName: ""

broker:
  enabled: true
  image:
    repository: gabloe/felix-broker
    tag: ""
    digest: ""
  # Brokers. Each is a StatefulSet member with a stable name that is its node
  # id, and its own volume.
  replicas: 3
  # Reported to the control plane; placement keeps a shard's replicas within it.
  region: local
  ports:
    # Clients connect here (QUIC).
    client: 5000
    # How many client listeners each broker binds, on consecutive ports from
    # `client`. One socket is one QUIC endpoint driver, and that driver is a
    # single task that cannot use more than one core -- it is the per-broker
    # throughput ceiling. More listeners spread inbound datagrams across more
    # drivers; the broker advertises the set and clients spread across it.
    #
    # Raising this claims ports `client` .. `client + listeners - 1`, so
    # `internal` has to move out of the way. Startup fails loudly if it does
    # not, rather than putting peer and client traffic on one listener.
    listeners: 1
    # Brokers forward and replicate to each other here (QUIC). Never exposed
    # outside the cluster: see networkPolicy and peerTls.
    internal: 5001
    metrics: 8080
  # The credential the broker presents to the control plane. Required: a
  # broker with a node id refuses to start without one. It must carry
  # `node.manage:node:<pod name>` (or `node.manage:cluster:*`) and
  # `node.view:cluster:*`; see the README for minting it out of bootstrap.
  credential:
    # A Secret the operator created. Empty is a render error while brokers are
    # enabled: install with `broker.enabled=false`, bootstrap, then upgrade.
    existingSecret: ""
    # One token shared by every broker, under this key ...
    tokenKey: token
    # ... or one per broker, under a key named after the pod
    # (felix-broker-0, felix-broker-1, ...). Per-broker tokens let each carry
    # `node.manage:node:<its own id>` and nothing wider.
    perBroker: false
    # An IdP refresh token for re-minting the Felix token before it expires,
    # under this key; empty means none.
    refreshTokenKey: ""
  # Where the control plane is. Empty means this release's own control plane,
  # over https when controlplane.tls is enabled.
  controlplaneUrl: ""
  storage:
    size: 50Gi
    storageClassName: ""
  # Mutual TLS between brokers on the internal port (FELIX_INTERNAL_TLS_*).
  # Each broker needs a certificate issued to its own node id, which is a
  # per-pod identity, so this uses cert-manager's CSI driver to issue one into
  # each pod at start. Requires cert-manager and cert-manager-csi-driver, and
  # an Issuer for the peer CA in this namespace. Off, the port is encrypted
  # but unauthenticated, and a broker refuses to start that way unless
  # allowUnauthenticated says the NetworkPolicy alone is the boundary.
  peerTls:
    enabled: false
    issuerName: felix-peer-ca
    issuerKind: Issuer
    duration: 24h
    renewBefore: 8h
    # Run without peer mTLS (FELIX_INTERNAL_ALLOW_UNAUTHENTICATED). Anything
    # that reaches the internal port is then a broker. One of this or
    # `enabled` is required; neither refuses to render.
    allowUnauthenticated: false
  # The certificate clients verify brokers with (FELIX_TLS_*). Off, each
  # broker generates a self-signed `localhost` certificate at every start,
  # which clients cannot use to tell one broker from another. One Secret for
  # every broker, a kubernetes.io/tls one as cert-manager writes it: its
  # certificate must name the client Service and each broker's advertised
  # name (a wildcard over the headless Service covers the in-cluster ones).
  # Renewals are picked up without a restart.
  clientTls:
    enabled: false
    existingSecret: ""
    # Key in that Secret holding a CA bundle every client must present a
    # certificate from (FELIX_TLS_CLIENT_CA). Empty asks clients for none.
    clientCaKey: ""
  # What discovery hands clients for each broker. Defaults to the pod's
  # in-cluster DNS name on the client port; set it when clients come from
  # outside the cluster and reach brokers some other way. `$(POD_NAME)` and
  # `$(POD_NAMESPACE)` are expanded per pod.
  clientAdvertiseAddr: ""
  clientService:
    # A Service in front of every broker's client port, for the first
    # connection; the client then follows discovery to the broker that owns a
    # shard. ClusterIP for in-cluster clients; LoadBalancer needs a provider
    # that balances UDP.
    enabled: true
    type: ClusterIP
    port: 5000
    annotations: {}
  shutdown:
    # preStop sleep, so the endpoints controller removes the pod before
    # SIGTERM starts the drain.
    preStopSeconds: 15
    # How long a stopping broker waits for its shards to move to the others
    # before it drains, so a rolling restart moves shards instead of failing
    # them over. 0 turns the handoff off.
    handoffTimeoutMs: 30000
    drainTimeoutMs: 40000
    # Defaults to preStopSeconds + (handoffTimeoutMs + drainTimeoutMs) / 1000
    # + 5. Setting it below what those need is a render error: SIGKILL would
    # arrive mid-handoff or mid-drain.
    terminationGracePeriodSeconds: ""
  resources:
    requests:
      cpu: "1"
      memory: 2Gi
    limits:
      memory: 4Gi
  podDisruptionBudget:
    enabled: true
    # Voluntary disruption may take at most this many brokers at once. One is
    # what keeps a replication-factor-three shard's quorum through node
    # maintenance; a larger budget is a render error unless replicas allow it.
    maxUnavailable: 1
  antiAffinity: soft   # soft | hard | none
  topologySpread:
    enabled: true
    topologyKey: topology.kubernetes.io/zone
    maxSkew: 1
    whenUnsatisfiable: ScheduleAnyway
  # Restrict the internal port to the brokers themselves, the client port to
  # the namespaces listed (all, when empty), and metrics to the namespaces
  # listed (all, when empty). Needs a CNI that enforces NetworkPolicy.
  networkPolicy:
    enabled: true
    clientNamespaceSelectors: []
    metricsNamespaceSelectors: []
  # Rendered to a ConfigMap as the broker's config file. Keys are the
  # broker's YAML settings; values here override the environment, so leave
  # bind addresses to the chart.
  config: {}
  logLevel: info
  extraEnv: []
  nodeSelector: {}
  tolerations: []
  podAnnotations: {}
  podLabels: {}
  priorityClassName: ""

# Prometheus Operator objects, when it is installed.
serviceMonitor:
  enabled: false
  interval: 15s
  labels: {}
