version: "3"

tasks:
  fmt:
    cmds: ["cargo fmt --all"]
  lint:
    cmds:
      - "cargo fmt -- --check"
      - "cargo clippy --workspace --all-targets --all-features -- -D warnings"
      # Each crate with optional features, alone and on its defaults — which
      # is how a consumer takes it off crates.io.
      #
      # Per package, not `--workspace`: within the workspace cargo unifies
      # features across members, so the broker asking for `lifecycle` switches
      # it on for everyone and a wrong gate compiles anyway. That is how a
      # misplaced `#[cfg]` on felix-common's modules reached main past a lint
      # that only ever ran `--all-features`.
      - "cargo check -p felix-common"


  clippy:
    cmds: ["cargo clippy --workspace --all-targets --all-features -- -D warnings"]
  test:
    cmds:
      # felix-cluster's loadgen integration test shells out to a prebuilt
      # `target/debug/felix-loadgen`. `cargo test` only builds a bin's runnable
      # executable when that bin's own package has integration tests, and
      # felix-loadgen's only consumer is a test in *another* crate — so the
      # workspace test run never produces it, and those cases fail "not found".
      # Build it up front (the felix-broker bin needs no such help: services/felix-broker-service
      # has its own integration tests, so cargo builds it).
      - "cargo build -p felix-loadgen"
      # One managed Postgres, torn down afterwards. Without it the Postgres
      # tests start their own through testcontainers, and pg_store_e2e holds
      # that one in a `static` — which never drops, so every run of the suite
      # leaves a container and its volume behind.
      - |
        if [ -z "${CI:-}" ]; then
          task pg:up
        fi
      - |
        # With a database, the store's Postgres tests run too; they are behind
        # a feature so a plain `cargo test` never needs one.
        if [ -n "${FELIX_TEST_DATABASE_URL:-}" ]; then
          cargo test --workspace --features felix-controlplane-service/pg-tests
        elif docker version >/dev/null 2>&1; then
          FELIX_TEST_DATABASE_URL="postgres://postgres:postgres@127.0.0.1:55432/postgres" cargo test --workspace --features felix-controlplane-service/pg-tests
        else
          cargo test --workspace
        fi
      - |
        if [ -z "${CI:-}" ]; then
          task pg:down
        fi
  # A test that has failed under load and passed alone, run hundreds of
  # times with every core busy. CI runs it after the suite.
  test:stress:
    cmds:
      - "scripts/stress_test.sh felix-storage cache::log_cache::tests::concurrency::a_cancelled_put_is_still_applied 200"

  pg:up:
    cmds:
      - |
        if docker version >/dev/null 2>&1; then
          docker inspect felix-pg-tests >/dev/null 2>&1 || docker run -d --rm \
            --name felix-pg-tests -e POSTGRES_PASSWORD=postgres -p 55432:5432 \
            postgres:16-alpine
        else
          echo "task: [pg:up] skipping postgres container (docker unavailable)"
        fi
  pg:down:
    # `-v` so the anonymous data volume goes with it. Without that the volumes
    # accumulate even though the containers do not.
    cmds: ["docker rm -f -v felix-pg-tests >/dev/null 2>&1 || true"]
  pg:sweep:
    desc: Remove Postgres test containers and volumes an interrupted run left behind.
    cmds:
      - |
        # By name, because testcontainers sets no labels — the tests name what
        # they start `felix-test-pg-*` precisely so this can tell them from a
        # Postgres someone is running themselves. `-v` takes the data volume
        # with the container; those are what actually accumulate.
        stray="$(docker ps -aq --filter name=felix-test-pg- 2>/dev/null || true)"
        if [ -n "$stray" ]; then
          echo "removing $(echo "$stray" | wc -l | tr -d ' ') stray test container(s)"
          echo "$stray" | xargs docker rm -f -v >/dev/null 2>&1 || true
        else
          echo "no stray test containers"
        fi
        # Volumes already orphaned by containers removed without -v. Dangling
        # only, so nothing in use is in scope — but this is the one step that
        # can touch a volume Felix did not create, so it is opt-in rather than
        # part of `task test`.
        docker volume ls -qf dangling=true 2>/dev/null | head -100 | xargs -r docker volume rm >/dev/null 2>&1 || true
  coverage:
    cmds:
      # Same reason as `test`: felix-cluster's loadgen integration test shells
      # out to a prebuilt felix-loadgen, which the coverage run (like a plain
      # `cargo test`) does not build on its own. cargo llvm-cov uses
      # target/llvm-cov-target, not target/debug, so build the binary straight
      # into that dir — the exact path the test resolves relative to itself.
      - "cargo build -p felix-loadgen --target-dir target/llvm-cov-target"
      - |
        if [ -z "${CI:-}" ]; then
          task pg:down
          task pg:up
        else
          echo "task: [coverage] skipping pg:down/pg:up (CI detected)"
        fi
      - |
        if [ -n "${FELIX_TEST_DATABASE_URL:-}" ]; then
          FELIX_TEST_DATABASE_URL="$FELIX_TEST_DATABASE_URL" cargo llvm-cov --no-clean --no-cfg-coverage --skip-functions --all-features --workspace --ignore-filename-regex '(^|/)(demos)(/|$)|(^|/)src/bin/' --lcov --output-path lcov.info
        elif docker version >/dev/null 2>&1; then
          FELIX_TEST_DATABASE_URL="postgres://postgres:postgres@127.0.0.1:55432/postgres" cargo llvm-cov --no-clean --no-cfg-coverage --skip-functions --all-features --workspace --ignore-filename-regex '(^|/)(demos)(/|$)|(^|/)src/bin/' --lcov --output-path lcov.info
        else
          cargo llvm-cov --no-clean --no-cfg-coverage --skip-functions --all-features --workspace --ignore-filename-regex '(^|/)(demos)(/|$)|(^|/)src/bin/' --lcov --output-path lcov.info
        fi
      - "cargo llvm-cov report --summary-only --ignore-filename-regex '(^|/)(demos)(/|$)|(^|/)src/bin/'"
      - |
        if [ -z "${CI:-}" ]; then
          task pg:down
        else
          echo "task: [coverage] skipping pg:down (CI detected)"
        fi
  coverage:demos:
    cmds:
      - |
        if [ -z "${CI:-}" ]; then
          task pg:down
          task pg:up
        else
          echo "task: [coverage:demos] skipping pg:down/pg:up (CI detected)"
        fi
      - |
        if [ -n "${FELIX_TEST_DATABASE_URL:-}" ]; then
          FELIX_TEST_DATABASE_URL="$FELIX_TEST_DATABASE_URL" cargo llvm-cov --no-cfg-coverage --skip-functions --all-features --workspace --ignore-filename-regex '^(?!.*?/demos/)' --lcov --output-path lcov-demos.info
        elif docker version >/dev/null 2>&1; then
          FELIX_TEST_DATABASE_URL="postgres://postgres:postgres@127.0.0.1:55432/postgres" cargo llvm-cov --no-cfg-coverage --skip-functions --all-features --workspace --ignore-filename-regex '^(?!.*?/demos/)' --lcov --output-path lcov-demos.info
        else
          cargo llvm-cov --no-cfg-coverage --skip-functions --all-features --workspace --ignore-filename-regex '^(?!.*?/demos/)' --lcov --output-path lcov-demos.info
        fi
      - "cargo llvm-cov report --summary-only"
      - |
        if [ -z "${CI:-}" ]; then
          task pg:down
        else
          echo "task: [coverage:demos] skipping pg:down (CI detected)"
        fi
  build:
    cmds: ["cargo build --workspace --release"]
  clean:
    cmds:
      - "cargo clean"
      - "rm -rf data/raw/stdout data/raw/latency_demo_runs.jsonl"
  clean-all:
    desc: "Remove all build artifacts, including any stale per-demo target dirs"
    cmds:
      - "rm -rf target"
      # Pre-dating the shared target-dir in .cargo/config.toml, each standalone
      # demo crate built its own ~3 GB target/. Remove any left behind.
      - "rm -rf demos/*/target"
  clean:stale:
    desc: "Prune build artifacts cargo will never collect, keeping the current build"
    # Cargo keys artifacts by package + features + flags and never garbage-collects
    # the losers, so every distinct build multiplies the directory: default vs
    # --all-features, the four standalone demo crates that
    # resolve features independently, plus release. Measured at 41 GB against a
    # 4.2 GB single clean build — roughly sevenfold duplication, none of it reachable.
    #
    # Unlike `clean-all` this keeps what you are currently working with, so the next
    # build is incremental rather than from scratch.
    cmds:
      - "cargo install cargo-sweep --version 0.8.0 --locked"
      # Artifacts built by toolchains rustup no longer has are dead weight.
      - "cargo sweep --installed"
      # Then anything untouched for a week: old feature combinations, abandoned
      # branches' dependency graphs, superseded incremental caches.
      - "cargo sweep --time 7"
  deny:
    cmds:
      - "cargo install cargo-deny --version 0.19.0 --locked"
      - "cargo-deny check"
      # Vendored crates are path crates, which cargo-deny never matches against
      # advisories; check the upstream versions they were taken from instead.
      - "python3 scripts/check_vendored.py --advisory-crate target/vendored-advisories"
      - "cargo-deny --manifest-path target/vendored-advisories/Cargo.toml check --config deny.toml -A advisory-not-detected advisories"
  publish:check:
    desc: "Assert the LICENSING.md licence split (labels and dependency graph) and crates.io publish-readiness"
    cmds:
      - "python3 scripts/check_publish_metadata.py"
      - "python3 scripts/check_license_graph.py"
  ci:toolchains:
    desc: "Assert every workflow's Rust setup matches rust-toolchain.toml"
    cmds:
      - "python3 scripts/check_workflow_toolchains.py"
  ci:timeouts:
    desc: "Assert every workflow job sets timeout-minutes"
    cmds:
      - "python3 scripts/check_workflow_timeouts.py"
  ts:packages:
    desc: "Assert the Node client's platform packages match what the release builds"
    cmds:
      - "python3 scripts/check_npm_packages.py"
  docs:evidence:
    desc: "Assert the docs' claims and reference tables still match the code"
    # Python and git only, no Node and no node_modules, because this has to run
    # in the Rust CI job: a citation goes stale when someone renames a *test*,
    # which is a Rust change. The mermaid and diagram checks need docs-site's
    # dependencies and stay in its build, where a diagram change is made.
    cmds:
      - "python3 scripts/check_doc_evidence.py"
      - "python3 scripts/check_env_reference.py"
      # And that the *runtime* knows them, so a mistyped name is reported
      # rather than quietly taking a default.
      - "python3 scripts/check_env_registry.py"
      # Belongs here for the same reason: a feature bit or a message variant is
      # added in Rust, and that is the moment the docs fall behind.
      - "python3 scripts/check_capability_docs.py"
      # The spec's configurations are claims about how the code behaves, and
      # nothing else connects the two artifacts. A cited test that no longer
      # exists is how that drift starts showing (#598).
      - "python3 scripts/check_spec_evidence.py"
      # A milestone label in a published page is wrong the day it is written —
      # it names a project-board row the reader has never seen — so unlike the
      # status-claim report this one can fail.
      - "python3 scripts/check_public_docs_refs.py"
  tla:check:
    desc: "Model-check the lease, replication and promotion protocol (docs/formal) with TLC"
    # Java or Docker; the TLA+ tools are fetched once, pinned, into target/tla.
    # Each configuration declares whether it must pass or which invariant it
    # must violate, so a finding cannot quietly turn into a pass.
    cmds:
      - "scripts/check_tla.sh"
  tla:pairing:
    desc: "Assert a change to the code docs/formal models also touches the spec, or says why not"
    # Diffs BASE...HEAD, so it needs history back to BASE.
    vars:
      BASE: '{{.BASE | default "origin/main"}}'
    cmds:
      - "python3 scripts/check_spec_pairing.py --base {{.BASE}}"

  chart:check:
    desc: "Lint and render the Helm chart every way ci/ describes, and check the result keeps its promises"
    # helm and PyYAML; no cluster. The refusals are checked too, so a value
    # combination the templates are meant to reject cannot quietly start
    # rendering again.
    cmds:
      - "python3 scripts/check_chart.py"

  docs:status:
    desc: "List the docs' claims that something is not built — read these when closing a milestone"
    # Not in docs:evidence, because it cannot fail on its own: a claim that
    # something is unbuilt is correct until the day it ships, and no check can
    # see that day from the prose alone. It is a report to read at the moment
    # those claims go stale, which is a milestone closing. Metadata Raft shipped
    # and five pages went on saying it "is not started"; this is what finds that.
    cmds:
      - "python3 scripts/check_status_claims.py --report"
      # Automatic where it can be: a claim citing an issue that is now closed is
      # drift with no judgement required. Skips without `gh`.
      - "python3 scripts/check_status_claims.py --check-issues"
  deny:rsa:default:
    cmds:
      - |
        for pkg in broker felix-authz felix-client felix-broker felix-transport felix-wire; do
          set +e
          tree=$(cargo tree -i rsa -p "$pkg" 2>/dev/null)
          status=$?
          set -e
          if [ $status -eq 0 ] && echo "$tree" | rg -q "rsa v"; then
            echo "$tree"
            echo "rsa crate detected in $pkg dependency tree"
            exit 1
          fi
        done
  demo:cache:
    cmds: ["cargo run --release -p felix-broker-service --features demo --bin cache-demo -- {{.CLI_ARGS}}"]
  demo:latency:
    cmds: ["cargo run --release -p felix-broker-service --bin latency-demo --all-features -- {{.CLI_ARGS}}"]
  demo:notifications:
    cmds: ["cargo run --release -p felix-broker-service --bin pubsub-demo-notifications -- {{.CLI_ARGS}}"]
  demo:orders:
    cmds: ["cargo run --release -p felix-broker-service --bin pubsub-demo-orders -- {{.CLI_ARGS}}"]
  demo:pubsub:
    cmds: ["cargo run --release -p felix-broker-service --features demo --bin pubsub-demo-simple -- {{.CLI_ARGS}}"]
  demo:queues:
    desc: "Queue semantics: distribution, redelivery, dead letters, and their cost"
    cmds: ["cargo run --release -p felix-broker-service --bin queue-semantics-demo -- {{.CLI_ARGS}}"]
  demo:check:
    desc: "Build the standalone demo crates and run their behavioural tests"
    cmds:
      - "cargo fmt --manifest-path demos/slow-consumer/Cargo.toml -- --check"
      - "cargo fmt --manifest-path demos/state-divergence/Cargo.toml -- --check"
      - "cargo clippy --manifest-path demos/slow-consumer/Cargo.toml --all-targets -- -D warnings"
      - "cargo clippy --manifest-path demos/state-divergence/Cargo.toml --all-targets -- -D warnings"
      - "cargo build --manifest-path demos/slow-consumer/Cargo.toml"
      - "cargo build --manifest-path demos/state-divergence/Cargo.toml"
      - "cargo build --manifest-path demos/rbac-live/Cargo.toml"
      - "cargo build --manifest-path demos/cross_tenant_isolation/Cargo.toml"
      - "cargo test --manifest-path demos/slow-consumer/Cargo.toml"
      - "cargo test --manifest-path demos/state-divergence/Cargo.toml"
      # The queue demo asserts every guarantee it narrates and bails on any
      # violation, so running it is the behavioural test. It is deterministic:
      # it drives the visibility timeout itself rather than sleeping.
      - "cargo run -q -p felix-broker-service --bin queue-semantics-demo"
  demo:state-divergence:
    desc: "Counterpart demo: what at-most-once costs a consumer holding local state"
    cmds:
      - "cargo run --release --manifest-path demos/state-divergence/Cargo.toml -- {{.CLI_ARGS}}"
  demo:slow-consumer:
    desc: "Flagship demo: one slow consumer does not degrade the healthy ones"
    cmds:
      - "cargo run --release --manifest-path demos/slow-consumer/Cargo.toml -- {{.CLI_ARGS}}"
  demo:rbac-live:
    cmds:
      - "cargo run --manifest-path demos/rbac-live/Cargo.toml -- {{.CLI_ARGS}}"
  demo:cross-tenant-isolation:
    cmds:
      - "task pg:down"
      - "task pg:up"
      - "cargo run --manifest-path demos/cross_tenant_isolation/Cargo.toml -- {{.CLI_ARGS}}"
      - "task pg:down"
  perf:deps:
    desc: "Create .venv-perf and install the Python deps the charting pipeline needs"
    cmds:
      # A virtualenv rather than a bare `pip install`: Homebrew and most distro
      # Pythons are marked externally managed (PEP 668), so installing into them
      # fails outright. Everything below prefers this venv when it exists and
      # falls back to system python3 otherwise, so nothing is required of a
      # machine where the deps happen to be installed already.
      - "python3 -m venv .venv-perf"
      - ".venv-perf/bin/python -m pip install --quiet --upgrade pip"
      - ".venv-perf/bin/python -m pip install --quiet -r scripts/perf/requirements.txt"
      - '.venv-perf/bin/python -c "import matplotlib; print(f\"matplotlib {matplotlib.__version__} ready in .venv-perf\")"'
  perf:charts:
    desc: "Re-render charts from data already in data/derived (no benchmark run)"
    cmds:
      - |
        PY=$([ -x .venv-perf/bin/python ] && echo .venv-perf/bin/python || echo python3)
        "$PY" scripts/perf/make_charts.py
        "$PY" scripts/perf/render_markdown_snippets.py
  perf:latency-matrix:
    cmds:
      - |
        PY=$([ -x .venv-perf/bin/python ] && echo .venv-perf/bin/python || echo python3)
        "$PY" scripts/perf/run_latency_matrix.py
        "$PY" scripts/perf/normalize_and_aggregate.py
        "$PY" scripts/perf/make_charts.py
        "$PY" scripts/perf/render_markdown_snippets.py
  perf:fast:
    desc: "Fast chart pass (~15-20 min vs hours): one profile, 5 presets, 3 trials; only the two chart-bearing shapes (acked-latency json batch=1, sustained-throughput binary batch=64)"
    cmds:
      - |
        PY=$([ -x .venv-perf/bin/python ] && echo .venv-perf/bin/python || echo python3)
        # One shared session id so both filtered halves aggregate together;
        # normalize_and_aggregate keeps only the latest session by default.
        export FELIX_PERF_SESSION_ID=$(uuidgen | tr 'A-Z' 'a-z')
        "$PY" scripts/perf/run_latency_matrix.py --config scripts/perf/fast.yml --filter 'batch=1,binary=False'
        "$PY" scripts/perf/run_latency_matrix.py --config scripts/perf/fast.yml --filter 'batch=64,binary=True'
        "$PY" scripts/perf/normalize_and_aggregate.py
        "$PY" scripts/perf/make_charts.py --config scripts/perf/fast.yml
        "$PY" scripts/perf/render_markdown_snippets.py --config scripts/perf/fast.yml
  cluster:up:
    desc: Start a local three-node cluster and hold it until Ctrl-C.
    cmds:
      - cargo build -p felix-broker-service --bin felix-broker
      - cargo run -p felix-cluster -- up {{.CLI_ARGS}}
  cluster:status:
    desc: Start a cluster, print membership and shard ownership, then tear it down.
    cmds:
      - cargo build -p felix-broker-service --bin felix-broker
      - cargo run -p felix-cluster -- status {{.CLI_ARGS}}
  cluster:smoke:
    desc: Publish through a non-owner and receive from the owner.
    cmds:
      - cargo build -p felix-broker-service --bin felix-broker
      - cargo run -p felix-cluster -- smoke {{.CLI_ARGS}}
  cluster:subscribe:
    desc: Stream events from a running cluster (start one with cluster:up).
    cmds: ["cargo run -q -p felix-cluster -- subscribe {{.CLI_ARGS}}"]
  cluster:publish:
    desc: Publish to a running cluster, through a broker that does not own the shard.
    cmds: ["cargo run -q -p felix-cluster -- publish {{.CLI_ARGS}}"]
  cluster:demo:
    desc: "Cross-broker demo in ONE pane, start to finish (see cluster:demo:tmux for three)."
    cmds:
      - cargo build -p felix-broker-service --bin felix-broker
      - cargo run -q -p felix-cluster -- demo {{.CLI_ARGS}}
  cluster:failover:
    desc: "Replication, quorum acks and failover: kill the leader, keep publishing."
    cmds:
      - cargo run -q -p felix-cluster --bin felix-cluster -- failover {{.CLI_ARGS}}

  cluster:consistency:
    desc: "What Quorum buys and what Leader costs, under one fault"
    cmds:
      - cargo build -p felix-broker-service --bin felix-broker
      - cargo run -q -p felix-cluster --bin felix-cluster -- consistency {{.CLI_ARGS}}

  cluster:demo:tmux:
    desc: The same demo across THREE tmux panes - cluster, subscriber, publisher.
    cmds:
      - cargo build -p felix-broker-service --bin felix-broker
      - cargo build -p felix-cluster
      - scripts/cluster-demo-tmux.sh
  cluster:burst:
    desc: Publish a burst of messages to a running cluster, across every broker.
    cmds: ["scripts/cluster-publish-loop.sh"]
  cluster:owners:
    desc: Who leads each shard of a running cluster.
    cmds: ["cargo run -q -p felix-cluster -- owners"]
  cluster:test:
    desc: Cross-broker integration tests against a real three-node cluster.
    cmds: ["cargo test -p felix-cluster"]
  conformance:
    cmds: ["cargo run -p felix-conformance"]

  fuzz:
    desc: >
      Run every libFuzzer target on a short budget. Needs nightly and
      cargo-fuzz; `FUZZ_SECONDS` sets the per-target budget (default 60).
    vars:
      SECONDS: '{{.FUZZ_SECONDS | default "60"}}'
    cmds:
      # The wire decoders first: these bytes come from whoever connects,
      # where the segment format is written by Felix itself.
      #
      # `seeds` is the curated set that ships; `corpus` is libFuzzer's own
      # working directory and is git-ignored. Passing corpus first makes it
      # the one that grows, so a run never writes into the committed seeds.
      - for: ["frame", "internal_message", "binary_payload", "client_message"]
        cmd: >
          cd crates/protocol/felix-wire/fuzz &&
          mkdir -p corpus/{{.ITEM}} &&
          cargo +nightly fuzz run {{.ITEM}} corpus/{{.ITEM}} seeds/{{.ITEM}}
          -- -max_total_time={{.SECONDS}}
      # The Kafka listener's record-batch decoder: bytes from any Kafka client.
      - for: ["kafka_records", "kafka_request"]
        cmd: >
          cd crates/server/felix-kafka/fuzz &&
          mkdir -p corpus/{{.ITEM}} &&
          cargo +nightly fuzz run {{.ITEM}} corpus/{{.ITEM}} seeds/{{.ITEM}}
          -- -max_total_time={{.SECONDS}}
      - for: ["segment_record", "segment_recovery", "sparse_index",
              "cache_record", "counter_record", "sidecar_state"]
        cmd: >
          cd crates/server/felix-storage/fuzz &&
          cargo +nightly fuzz run {{.ITEM}}
          -- -max_total_time={{.SECONDS}}

  python:check:
    desc: Build and lint the Python binding (its own workspace, like the demos).
    dir: crates/sdk/felix-python
    cmds:
      - cargo fmt -- --check
      - cargo clippy --all-targets -- -D warnings
      - cargo build
  python:build:
    desc: Build the Python wheel with maturin (needs `pip install maturin`).
    dir: crates/sdk/felix-python
    cmds:
      - maturin build --release {{.CLI_ARGS}}
  python:develop:
    desc: Install the Python binding into the active virtualenv, in place.
    dir: crates/sdk/felix-python
    cmds:
      - maturin develop {{.CLI_ARGS}}
  lock:refresh:
    desc: >
      Re-lock every crate that declares its own [workspace]. The repository
      workspace does not reach them, so a version bump or a new dependency
      never lands in their Cargo.lock until someone builds them -- which is
      how both demo locks sat at 0.4.0-preview through two releases. CI fails
      if a build changes one, and this is the fix for that failure.
    cmds:
      - for:
          - demos/cross_tenant_isolation
          - demos/rbac-live
          - demos/slow-consumer
          - demos/state-divergence
          - crates/sdk/felix-python
          - crates/sdk/felix-typescript
        cmd: test -d {{.ITEM}} && cd {{.ITEM}} && cargo update -q --workspace || true

  python:test:
    desc: Run the Python suite against a conformance fixture (needs python:develop first).
    dir: crates/sdk/felix-python
    cmds:
      - pytest -q {{.CLI_ARGS}}
  ts:check:
    desc: Build and lint the Node/TypeScript binding (its own workspace, like felix-python).
    dir: crates/sdk/felix-typescript
    cmds:
      - cargo fmt -- --check
      - cargo clippy --all-targets -- -D warnings
      - cargo build
  ts:build:
    desc: Build the Node addon with napi (needs `npm i -g @napi-rs/cli@2`).
    dir: crates/sdk/felix-typescript
    cmds:
      - napi build --platform --release {{.CLI_ARGS}}
  ts:test:
    desc: Run the Node conformance suite against a fixture cluster it starts itself.
    dir: crates/sdk/felix-typescript
    cmds:
      - node --test test/errors.test.mjs
      - node --test test/conformance.test.mjs {{.CLI_ARGS}}
  ts:conformance:
    desc: Build what the Node suite needs, run it, and check the verdict against the catalogue.
    cmds:
      # The suite spawns these; `cargo build` does not do it on its behalf.
      - cargo build -p felix-broker-service --bin felix-broker
      - cargo build -p felix-cluster --bin felix-cluster
      - cd crates/sdk/felix-typescript && cargo build
      - cd crates/sdk/felix-typescript && FELIX_CONFORMANCE_RESULTS={{.RESULTS}} node --test test/conformance.test.mjs
      # The verdict, not the exit code: a suite that passed while skipping a
      # required scenario is not conformance.
      - cargo run -q -p felix-conformance -- verify {{.RESULTS}}
    vars:
      # Absolute, because the suite runs from the crate directory and the
      # verifier runs from the repository root.
      RESULTS: '{{.ROOT_DIR}}/ts-conformance.json'
  release:check:
    desc: >
      Assert every version field agrees, and matches a tag if one is given.
      The wheel, the npm package and the Helm chart each carry a version of
      their own, so bumping the workspace is not enough -- and a tag is
      permanent by the time the release job would notice.
    cmds:
      - "python3 scripts/check_release_version.py {{.CLI_ARGS}}"

  conformance:scenarios:
    desc: Print the client conformance catalogue — what a client in any language must implement.
    cmds: ["cargo run -q -p felix-conformance -- scenarios"]
  conformance:verify:
    desc: Check a client's conformance results against the catalogue.
    cmds: ["cargo run -q -p felix-conformance -- verify {{.CLI_ARGS}}"]
  conformance:fixture:
    desc: Hold a cluster for a client conformance suite to run against.
    cmds:
      - cargo build -p felix-broker-service --bin felix-broker
      - cargo run -q -p felix-cluster -- client-fixture {{.CLI_ARGS}}
