[package]
name = "demo-rbac-live"
version = "0.1.1"
edition = "2024"
license = "Apache-2.0"

[dependencies]
anyhow = "1"
axum = "0.8"
base64 = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
jsonwebtoken = { version = "11", default-features = false, features = ["aws_lc_rs"] }
rcgen = "0.14"
rustls = "0.23"
quinn = "0.11"

felix-controlplane-service = { path = "../../services/felix-controlplane-service" }
felix-broker-service = { path = "../../services/felix-broker-service" }
felix-broker = { path = "../../crates/server/felix-broker" }
felix-client = { path = "../../crates/sdk/felix-client" }
felix-storage = { path = "../../crates/server/felix-storage" }
felix-transport = { path = "../../crates/protocol/felix-transport" }
felix-wire = { path = "../../crates/protocol/felix-wire" }

[workspace]

# Each demo declares its own [workspace], so the root workspace's [profile.dev]
# does not reach it — these have to be repeated here or the demos rebuild the
# whole dependency tree with full debuginfo into the shared target dir, undoing
# the saving. See the root Cargo.toml for the reasoning.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# The root workspace's [patch] does not reach a separate workspace. Without
# this, the vendored kafka-protocol's decoder bounds are not what gets built.
[patch.crates-io]
kafka-protocol = { path = "../../vendor/kafka-protocol" }
