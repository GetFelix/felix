\* FelixShardFencedCrash.cfg with placement naming a replica the report left
\* unnamed by the storage identity it is registered under, while it is at the
\* incarnation the report carries for it (`NameByRegistration`). A rule
\* considered for #1335 and not taken. The leader reports before it has asked
\* one follower who it is, so the control plane stamps that follower's
\* incarnation as the report arrives. Before it does, the leader asks,
\* ships the follower a record and acknowledges it on the two of them, and
\* the follower crashes, loses it and registers again under a new identity.
\* The stamp is the new incarnation, the follower is named by its new
\* identity, and the successor's fence counts the short copy.
\*
\* Expected to violate AckedHeldByLeader.
\*
\* Evidence: none, this models an alternative the implementation does not use.

