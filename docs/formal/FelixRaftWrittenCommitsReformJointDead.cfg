\* The vouch rule across a joint change, {a, b, c} to {a, b, d}, with two
\* brokers declared dead (#2661). When the dead are a majority of the target,
\* the target is still a voter set (the control plane ordered it), so the
\* group is marked and no stale tail is vouched for. A dead majority can lose
\* what it committed alone, so the check is that no base entry differs from
\* the committed one at its index.
\*
\* Evidence: none, this models the design for #2250, which is not built.

