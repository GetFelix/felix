\* FelixShardElect.cfg with a planned move and a cancel. The control plane
\* fences the leader toward a follower, then cuts over to it or hands the
\* shard back, at a generation it picks without knowing of an election
\* held meanwhile. With `FenceEveryChange` the leader it names fences and
\* catches up before it serves, as the broker does, and the ballot refuses
\* it at a generation a candidate already took: one leader opens per
\* generation, and every acknowledged record survives every change.
\*
\* Reports flow (`Promotion = "leader-report"`) because a move waits for
\* one. Time does not move, so the control plane never promotes, and one
\* generation of elections past its own is enough to collide with a move.
\* FelixShardElectHandoffUnfenced.cfg is the cut-over without the fence.
\* About an hour on a four-core CI runner (48.7M distinct states), so it runs
\* nightly (tla-walk.yml); FelixShardElectHandoffLeaders.cfg is the per-PR version.
\*
\* Evidence: `after_a_cut_over_the_drained_leader_is_refused`,
\* `after_a_hand_back_an_older_leader_is_refused` and
\* `after_a_failover_to_the_destination_the_old_leader_is_refused`
\* (services/felix-broker-service/src/shards/lifecycle/tests/every_change.rs).

