\* Two control-plane instances moving a shard at once, writing unconditionally:
\* one reads and writes in a single step, the other acts on a read it took
\* earlier.
\*
\* Expected to violate AtMostOneServing. The held read sees the leader with
\* both followers caught up. The other instance fences towards one follower,
\* the leader drains, and it cuts over. The held read's fence then lands,
\* naming the old leader again at a new generation with the other follower as
\* successor; that leader reports drained, and the cut-over to the second
\* follower lands while the first still holds a live lease.
\* Evidence: this configuration REMOVES a comparison the implementation has,
\* so the citation is what proves the comparison is there to remove.
\* `a_fence_planned_before_a_cut_over_is_not_written_after_it` -- placement
\*   writes every step conditional on the generation it planned from.

