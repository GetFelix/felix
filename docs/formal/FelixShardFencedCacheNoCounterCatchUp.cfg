\* FelixShardFencedCache.cfg with a fence that takes no counter log: the
\* promoted leader fences both logs but catches up only the cache log.
\* `check_tla.sh` expects TLC to lose an acknowledged counter update: the
\* old leader acknowledges it on itself and one follower, the other follower
\* is promoted, fences that follower and opens without the update
\* (CountersHeldByLeader).
\*
\* Evidence: none, this drops the counter log's catch-up that
\* `fence_shard` does for every log a cache shard has.

