\* Adoption beside promotion, sized for every pull request: FelixShardElect.cfg
\* with one write, one generation of elections, the set check, the control
\* plane adopting an elected leader up to generation 2 (`Adopt = 2`), and
\* placement promoting on the followers' word up to generation 2
\* (`Suspicions = 2`), on any read. The control plane then names leaders
\* above a generation it adopted, or races a candidate for the next one, and
\* one leader opens per generation with every acknowledged record kept.
\* Replacements under an adopted leader are in FelixShardElectAdopt.cfg,
\* which needs a spare.
\*
\* Evidence: none yet, nothing in the code elects a leader.

SPECIFICATION Spec

CONSTANTS
    Brokers = {a, b, c}
    L = 4
    Margin = 0
    Eps = 0
    Drift = 0
    MaxTime = 0
    MaxWrites = 1
    CheckAtCommit = FALSE
    Quorum = TRUE
    Promotion = "log-order"
    ReportBeforeAck = FALSE
    Handoff = FALSE
    WaitForDrained = TRUE
    FenceAtClaim = TRUE
    AckOnAdmit = FALSE
    FenceFromAdmit = FALSE
    MaxMoves = 0
    Planners = {}
    CasWrites = TRUE
    StageMove = FALSE
    LearnerVotes = FALSE
    Resends = FALSE
    SequencesInLog = TRUE
    Cancel = FALSE
    CancelCas = TRUE
    ReportBound = "acknowledged"
    AckChecksLease = FALSE
    AckOnResponse = FALSE
    AckByFollowers = TRUE
    FenceOnPromote = TRUE
    LabelOnReceipt = FALSE
    StartRecord = TRUE
    ReportFromAnswers = FALSE
    ReportFloor = FALSE
    Spares = {}
    ReplaceOnPromote = FALSE
    SeatHoldsCopy = TRUE
    Grow = FALSE
    PromoteDestination = FALSE
    Counters = FALSE
    CounterCatchUp = FALSE
    Ballots = TRUE
    Elections = 1
    FenceEveryChange = FALSE

    Suspicions = 2
    SetCheck = TRUE
    JointFence = TRUE
    Adopt = 2
    AdoptMatch = TRUE
    Swaps = 0
    PreVote = FALSE
SYMMETRY Symm

INVARIANTS
    TypeOK
    OneLeaderPerGeneration
    AckedHeldByLeader
    AckedAgree
    AckedOnMajority
    NoTruncationBelowHwm
