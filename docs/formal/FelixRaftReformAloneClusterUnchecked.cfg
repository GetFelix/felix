\* FelixRaftReformAloneCluster.cfg with the aloneness check dropped: the
\* broker plans from its own copy alone and the control plane writes the epoch
\* although a second broker is placed (`ReformBeforeAll` stands for a command
\* that does not check placement in the step that writes the epoch). The
\* learner d holds a record a's power-cut copy lost, and the base leaves it
\* out. Must violate LossNeedsLostDisk.
\*
\* No flag reads placement from the plan's snapshot instead: the stop holds
\* the copy still from the plan to the write, so a record only a later
\* placement could bring in cannot reach a disk in between, and the config
\* above already covers a broker placed before the plan.
\*
\* Evidence: none, this models an alternative the implementation must not use.
\* Dropping the placed check fails `another_placed_broker_is_refused`.

