\* FelixRaftReformAloneCluster.cfg with no aloneness check at all: the
\* broker plans from its own copy alone and the control plane writes the epoch
\* although a second broker is placed. `ReformBeforeAll` drops the placement
\* check from both the plan and the write, so this models a command that
\* never checks placement, not one that checks it outside the
\* compare-and-swap. The learner d holds a record a's power-cut copy lost, and
\* the base leaves it out. Must violate LossNeedsLostDisk.
\*
\* A check made only at the plan, from the plan's snapshot, is not modelled.
\* The stop holds the copy still from the plan to the write, so a record only
\* a later placement could bring in cannot reach a disk in between, and the
\* config above already covers a broker placed before the plan.
\*
\* Evidence: none, this models an alternative the implementation must not use.
\* Dropping the placed check fails `another_placed_broker_is_refused`.

