\* An RF 1 shard moves: one voter a, a spare b, two terms, one write. No voter
\* is common to {a} and {b}, so a grows to {a, b}, transfers to b, and b
\* shrinks to {b}. Three calls: the learner, the grow and the shrink.
\*
\* Evidence: none, the engine's membership loop and copy ids are not built yet (issue 2198).

SPECIFICATION Spec

CONSTANTS
    Brokers = {a, b}
    Nobody = Nobody
    InitBrokers = {a}
    MaxTerm = 2
    MaxWrites = 1
    MaxCalls = 3
    MaxTargets = 1
    MaxWipes = 0
    MinVoters = 1
    Rotate = TRUE
