\* FelixAtomicCommit.cfg with each part of a commit written as its own
\* record. The leader's mark stops only at the end of a commit, but
\* replication ships by bytes, so a follower may hold the event and not the
\* state. Promoted, it keeps that half, writes a commit of its own after it,
\* and its mark covers both. TLC finds a view showing part of a commit. This
\* is why a commit is one record.
\*
\* Evidence: none. It models a design the code does not use, to show why.

SPECIFICATION Spec

CONSTANTS
    Brokers = {a, b, c}
    MaxCommits = 2
    MaxGen = 3
    SplitRecords = TRUE
    PartialApply = FALSE

INVARIANTS
    NoPartialCommit
    CommitSurvives
