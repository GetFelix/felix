\* FelixShardCpDown.cfg held to a leader with every live member of its set
\* behind it (`CpDownFullyBacked`). Not owed: placement names one broker at
\* the generation another is elected and opens at, then stops. The elected
\* leader serves on a majority while the named one fences at that generation
\* for good, one copy short. It never stands, with its own round in flight;
\* if it did, every other member hears the leader and refuses its pre-vote.

SPECIFICATION CpDownSpec

CONSTANTS
    Brokers = {a, b, c}
    L = 2
    Margin = 0
    Eps = 0
    Drift = 0
    MaxTime = 0
    MaxWrites = 0
    CheckAtCommit = FALSE
    Quorum = TRUE
    Promotion = "log-order"
    ReportBeforeAck = FALSE
    Handoff = FALSE
    WaitForDrained = TRUE
    FenceAtClaim = TRUE
    AckOnAdmit = FALSE
    FenceFromAdmit = FALSE
    MaxMoves = 0
    Planners = {}
    CasWrites = TRUE
    StageMove = FALSE
    LearnerVotes = FALSE
    Resends = FALSE
    SequencesInLog = TRUE
    Cancel = FALSE
    CancelCas = TRUE
    ReportBound = "acknowledged"
    AckChecksLease = FALSE
    AckOnResponse = FALSE
    AckByFollowers = TRUE
    FenceOnPromote = TRUE
    LabelOnReceipt = FALSE
    StartRecord = TRUE
    ReportFromAnswers = FALSE
    ReportFloor = FALSE
    Spares = {}
    ReplaceOnPromote = FALSE
    SeatHoldsCopy = TRUE
    Grow = FALSE
    PromoteDestination = FALSE
    Counters = FALSE
    CounterCatchUp = FALSE
    Ballots = TRUE
    Elections = 4
    FenceEveryChange = FALSE

    Suspicions = 0
    SetCheck = TRUE
    JointFence = TRUE
    Adopt = 4
    AdoptMatch = TRUE
    Swaps = 0
    PreVote = TRUE
    Wipes = 0
    StorageIds = FALSE
    FailStops <- One
    Restarts <- Yes
    Withdraws <- Yes
    Renames <- Yes
    OwnBallotRefused <- Yes
    OverlayRefused <- Yes
    HaltReported <- Yes
    DeposeOnAssigned <- Yes
    StandBehindBallot <- Yes
    PreVoteAsked <- Yes
    CpStops <- Yes
    WithdrawsStuck <- Yes
    BrokerSuspicion <- Yes
    ShardSuspicion <- Yes
    PreVoteBounded <- Yes
    StandBehindBounded <- Yes

PROPERTIES
    CpDownFullyBacked

INVARIANTS
    TypeOK
    OneLeaderPerGeneration
    AckedHeldByLeader
    AckedAgree
    AckedOnMajority
    NoTruncationBelowHwm
    AdoptedMatchesOpened
    SetChangesJoint
