\* FelixRaftPlacementStaleWipe.cfg with NoVersion: a leader acts on a target
\* older than the membership in its log. It gives a copy the control plane
\* told to delete its vote back, a write is acknowledged with it, the other
\* copy's disk is lost, and the deletion takes the last one. Issue 2385.
\*
\* Evidence: none, this models an alternative the implementation does not use.

