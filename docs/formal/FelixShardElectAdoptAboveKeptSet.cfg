\* FelixShardElectReissueReplace.cfg with adoption up to generation 4
\* (`Adopt = 4`), no writes, candidates standing no lower than the
\* generation of the set they keep (`StandsAboveKeptSet`), and a refused
\* candidate keeping no set from the refusal (`RefusalLearnsSet <- No`, as
\* the code does). A leader elected on a set other than the recorded one is
\* then adopted onto it with the recorded set pending, and the control
\* plane's own leader elected past a pending change drops it (CpAdopt). The
\* control plane's leader is always the one that opened at its generation
\* (`AdoptedMatchesOpened`). With generation-only adoption this broke: a
\* pending change older than the adopted generation was left that no leader
\* could complete. Not registered: run by hand (not finished; no violation
\* through depth 19, 6.1M distinct states).
\*
\* Evidence: `an_elected_set_at_the_window_edge_is_reissued_one_past_it`
\*   -- adopting a leader elected on another set writes the next generation
\*   in one conditional write, the elected set being left and the recorded
\*   one pending.

