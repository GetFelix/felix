\* FelixRaftReformBatchAloneIndexOne.cfg with two records per entry: the
\* step 4 rule once a batch holds more than one record. Two batches of two
\* end at index 3 and offset 5, and a reservation kept as index 3 covers
\* offsets only to 4.
\*
\* Evidence: none, this pins why raft-reserved moves to offsets before batches.

