\* The earlier rule: apply drops an entry whose tracker hydrated before the
\* shard's last delete. Deleting another group then silences this group's
\* live tracker: its finish of a redriven record is dropped, so the record
\* stays redriven and no tracker owes it.
\*
\* Evidence: none, Raft shards refuse group operations until the design this
\* models is built (#2446).

SPECIFICATION Spec

CONSTANTS
    Members = {a, b}
    N = 2
    SeekTo = {1, 3}
    MaxChanges = 1
    MaxLog = 4
    CreationCheck = TRUE
    DeleteWatermark = TRUE
    IfNewChecksTracker = TRUE
    TermBoundTrackers = TRUE
    HydrateFromApplied = TRUE
    WaitOwnProposals = TRUE
    StaleByHyd = TRUE
    DeadBeforeAdvance = TRUE
    KeepRedriven = TRUE

SYMMETRY Symm

INVARIANTS
    RedrivenOwed
