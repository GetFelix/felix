\* FelixShardElectSwapFlipJoinLags.cfg with the flip taking the
\* generation's first start record, as the code does today, once a majority
\* of both sets holds it. A destination elected past the old leader
\* acknowledges a write on the old set; the cut-over names it again at that
\* generation, and the copy joining holds that start but not the write. The
\* flip follows the elected stint's start, so the new set becomes the control
\* plane's with the write on one of its three copies (AckedOnMajority).
\* About 100K distinct states, depth 16, a few seconds locally.
\*
\* Evidence: `retaking_the_same_generation_does_not_move_its_start`
\* (services/felix-broker-service/src/shards/lifecycle/tests.rs) and
\* `own_start` (crates/server/felix-replication/src/driver/shard.rs) for the
\* generation's first start; `a_cut_over_records_the_new_set_as_pending_and_takes_it_only_on_the_report`
\* (services/felix-controlplane-service/src/cluster/placement/tests/pending_set.rs)
\* for the flip. Nothing in the code elects a leader yet.

