\* FelixShardElectWipeWaitsFloorDeep.cfg with a bound no broker can know
\* (`WipeBoundOracle`): the wiped replica waits until the control plane's
\* generation is past the newest generation it had promised, not past the
\* control plane's own at the wipe. Then it passes. It shows the floor and
\* refusing every leader while waiting are enough once the bound is right,
\* so what the deep run found is the bound; and it is the base the questions
\* about what a waiting replica may still do are checked on
\* (FelixShardElectWipeOracleBatches.cfg, FelixShardElectWipeOracleLearnsSet.cfg).
\*
\* Evidence: none yet, nothing in the code elects a leader.

