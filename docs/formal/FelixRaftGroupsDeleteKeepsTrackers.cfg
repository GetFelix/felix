\* Deleting another group leaves this group's tracker serving: its finish
\* of a redriven record lands below the delete watermark and is dropped, so
\* the record stays redriven and no tracker owes it.
\*
\* Evidence: none, Raft shards refuse group operations until the design this
\* models is built (#2446).

