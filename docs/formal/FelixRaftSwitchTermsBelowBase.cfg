\* FelixRaftSwitchDiffers.cfg with one rule dropped: no copy purges or starts
\* empty, so the hybrid log is the Raft log and its generations are terms. b
\* holds a different record below N under the same generation. Raft's log
\* matching takes it as level, it is promoted and elected, and it leads
\* without the record a and c acknowledged.
\*
\* Evidence: none, this models an alternative the design does not use.

