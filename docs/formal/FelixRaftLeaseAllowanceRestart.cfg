\* A timing check of the lease allowance across a restart: the
\* FelixRaftLeaseAllowance.cfg bounds with one restart. The stored allowance
\* survives it, and a restarted leader is let through by the voters holding
\* its allowance while its hold and window run. It is already at the
\* smallest bounds that keep a write answered on the lease, a failover and
\* a restart (one allowance, one write, two terms), and passes in about an
\* hour (21.6M distinct states), so it runs in a job of its own. More
\* allowances with a restart are FelixRaftLeaseAllowanceUntimed.cfg's.
\*
\* Evidence: none, this models the design for #3103, which is not built.

