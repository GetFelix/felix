\* FelixGroups.cfg with dead letters shipped before they are synced. The
\* leader ships one, crashes and loses it, and at the same generation
\* writes another group's dead letter at that offset, then a cursor that
\* needs it. Promoted, the follower holding the first takes that cursor: its
\* dead-letter log has the length and the generation the cursor names, and
\* the wrong entry. TLC finds the skip. This is why dead letters are synced
\* before they are shipped.
\*
\* Evidence: none, this models shipping unsynced dead letters.

SPECIFICATION Spec

CONSTANTS
    Replicas = {a, b, c}
    G = 2
    N = 1
    MaxGen = 3
    MaxCrashes = 1
    MaxCursors = 2
    CheckCursors = TRUE
    DependencyGen = TRUE
    KeepGroups = TRUE
    SplitSources = FALSE
    SyncBeforeShip = FALSE

SYMMETRY Symmetry

INVARIANT NoSkip
