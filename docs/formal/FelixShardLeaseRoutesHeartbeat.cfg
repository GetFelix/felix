\* FelixShardLease.cfg with the heartbeat renewed the way the code renews
\* it: per broker, but a broker the control plane marked down counts a
\* renewal only once its routes reach the assignment feed's head as of the
\* accept, which name its successor, so it steps down instead.
\*
\* Evidence: `routes_short_of_the_renewals_feed_head_confirm_nothing`,
\* `a_renewal_after_a_surrender_waits_for_the_feed_head_it_was_accepted_at`,
\* `a_published_watch_answer_at_the_renewals_head_confirms_the_lease`.

SPECIFICATION Spec

CONSTANTS
    Brokers = {a, b, c}
    L = 4
    Margin = 2
    Eps = 1
    Drift = 1
    MaxTime = 8
    MaxWrites = 0
    CheckAtCommit = TRUE
    Quorum = TRUE
    Promotion = "log-order"
    ReportBeforeAck = TRUE
    Handoff = FALSE
    WaitForDrained = TRUE
    FenceAtClaim = TRUE
    AckOnAdmit = FALSE
    FenceFromAdmit = FALSE
    MaxMoves = 0
    Planners = {}
    CasWrites = TRUE
    StageMove = FALSE
    LearnerVotes = FALSE
    Resends = FALSE
    SequencesInLog = TRUE
    Cancel = FALSE
    CancelCas = TRUE
    ReportBound = "acknowledged"
    AckChecksLease = TRUE
    AckOnResponse = FALSE
    AckByFollowers = FALSE
    FenceOnPromote = FALSE
    LabelOnReceipt = FALSE
    StartRecord = FALSE
    ReportFromAnswers = FALSE
    ReportFloor = FALSE
    Spares = {}
    ReplaceOnPromote = FALSE
    SeatHoldsCopy = TRUE
    Grow = FALSE
    PromoteDestination = FALSE
    Counters = FALSE
    CounterCatchUp = FALSE
    Ballots = FALSE
    Elections = 0
    FenceEveryChange = FALSE

    Suspicions = 0
    SetCheck = FALSE
    JointFence = FALSE
    Adopt = 0
    AdoptMatch = TRUE
    Swaps = 0
    PreVote = FALSE
    Wipes = 0
    StorageIds = FALSE
    AcceptHeartbeat <- AcceptHeartbeatOnRoutes
SYMMETRY Symm

INVARIANTS
    TypeOK
    AtMostOneServing
    NoStaleCommit
