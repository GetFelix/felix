\* FelixShardFigure8CutOver.cfg without the start record: Raft's Figure 8
\* reached through a move. After the cut-over, a counts x, which it
\* inherited, once a and c hold it, and acknowledges it. Its lease lapses,
\* c is promoted from a's report, and c's fence finds b's log ahead by
\* generation, so c takes y in place of x (AckedOnMajority). Cancel is off so
\* the trace has to go through the cut-over.
\*
\* This is why the record is written on every leadership change, not only
\* on a promotion.
\*
\* Evidence: none, this models a cut-over that writes no start record and
\* counts inherited records, which the broker no longer does once the fleet
\* finalized `generation_start`.


SPECIFICATION SeededCutOverSpec

CONSTANTS
    a = a
    b = b
    c = c
    Brokers = {a, b, c}
    L = 2
    Margin = 1
    Eps = 1
    Drift = 0
    MaxTime = 3
    MaxWrites = 2
    CheckAtCommit = TRUE
    Quorum = TRUE
    Promotion = "leader-report"
    ReportBeforeAck = TRUE
    Handoff = TRUE
    WaitForDrained = TRUE
    FenceAtClaim = TRUE
    AckOnAdmit = FALSE
    FenceFromAdmit = FALSE
    MaxMoves = 1
    Planners = {}
    CasWrites = TRUE
    StageMove = FALSE
    LearnerVotes = FALSE
    Resends = FALSE
    SequencesInLog = TRUE
    Cancel = FALSE
    CancelCas = TRUE
    ReportBound = "acknowledged"
    AckChecksLease = TRUE
    AckOnResponse = TRUE
    AckByFollowers = FALSE
    FenceOnPromote = TRUE
    LabelOnReceipt = FALSE
    StartRecord = FALSE
    ReportFromAnswers = FALSE
    ReportFloor = FALSE
    Spares = {}
    ReplaceOnPromote = FALSE
    SeatHoldsCopy = TRUE
    PromoteDestination = FALSE


INVARIANTS
    TypeOK
    AckedHeldByLeader
    AckedAgree
    AckedOnMajority
    NoTruncationBelowHwm
    AckedSurvive
