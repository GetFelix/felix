\* FelixShardElectWipe.cfg with the guard as #1331 words it
\* (`WipedWaitsForAdopt`): the wiped replica answers no candidate's fence,
\* and does not stand, until the control plane's generation, read
\* linearizably, is past the one it had at the wipe. That is the bound of
\* open question 1's first variant: the control plane's generation when the
\* new storage id registered, which the model takes at the wipe, the oldest
\* it can be.
\*
\* It still answers the leader the control plane names, and TLC finds that
\* leader already deposed by an election the control plane has not heard of:
\* c promises generation 2 to b, which opens on {b, c} without a's write; c
\* is wiped; a, still the control plane's leader at 1, ships its write to c
\* and acknowledges it on {a, c} (AckedHeldByLeader).
\* FelixShardElectWipeWaitsAll.cfg refuses that leader too. The control
\* plane adopts nobody here (`Adopt = 0`), so the wait never ends and this
\* is the only way the guard can fail.
\*
\* Evidence: none yet, nothing in the code elects a leader.

