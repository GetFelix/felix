\* FelixRaftMembership.cfg with one rule dropped. A learner's copy counts
\* toward a majority. A record is acknowledged on the leader and the learner
\* alone, and the other two voters can elect a leader without it.
\*
\* Evidence: none, this models an alternative the implementation does not use.

SPECIFICATION Spec

CONSTANTS
    Servers = {a, b, c, d}
    Nobody = Nobody
    InitVoters = {a, b, c}
    InitLearners = {d}
    MaxTerm = 1
    MaxWrites = 1
    MaxCalls = 0
    SkipJoint = FALSE
    ChangeBeforeCommit = FALSE
    LearnerCounts = TRUE
    ClaimRacesMembership = FALSE
    ReopenOnReturn = FALSE

SYMMETRY Symm

INVARIANTS
    AckedSurvive
