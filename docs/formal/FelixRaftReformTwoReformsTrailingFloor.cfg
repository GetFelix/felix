\* Two re-forms with kept copies (Kept). Epoch 0 closes empty. In epoch 1
\* a record is committed by a written majority, a leader and one follower,
\* and a power cut takes it from both before it was synced. The floor trails
\* it, and the leader is declared dead. The follower's kept copy carries its
\* reservation, so the second re-form starts epoch 2 above the record and no
\* offset is given out with two records.
\*
\* Evidence: none, this models the design for #2250, which is not built.

