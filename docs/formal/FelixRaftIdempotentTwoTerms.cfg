\* FelixRaftIdempotent.cfg with two terms, a faster check of the same rules:
\* one change of leader, which can cut a batch or leave it unanswered.
\*
\* Evidence: `a_batch_resent_to_the_next_leader_is_not_written_again` (a
\*   re-send to a new leader is answered from its log),
\*   `a_batch_cut_by_a_leader_change_is_finished_by_its_resend` (a cut batch
\*   is finished, not written again) and
\*   `a_resend_of_an_uncommitted_batch_waits_for_its_commit` (held is
\*   answered at the commit).

SPECIFICATION Spec

CONSTANTS
    Servers = {a, b, c}
    Nobody = Nobody
    MaxTerm = 2
    MaxLog = 5
    MaxSeq = 2
    Lens = {1, 2}
    TableFromLog = TRUE
    FinishFromHeld = TRUE

SYMMETRY Symm

INVARIANTS
    TypeOK
    NoDuplicate
    AckedWhole
    InOrder
    MembersAgree
