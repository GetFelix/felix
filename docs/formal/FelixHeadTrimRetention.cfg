\* FelixHeadTrim.cfg with retention deleting past the floor, up to the commit
\* offset. With no trim at all, retention deletes the new holder's fenced
\* write; the stale holder is refused as too old with no tag, resumes at the
\* oldest record, sees no newer epoch and writes after it. This is why a
\* stream fenced by its tail, as felixd's are, runs with retention off.
\* NothingLostAboveFloor is left out: retention deletes acknowledged records
\* by design.
\*
\* Evidence: none, this models an alternative the design does not use.

SPECIFICATION Spec

CONSTANTS
    Brokers = {a, b, c}
    MaxWrites = 2
    MaxTrims = 3
    MaxGen = 3
    MaxCrashes = 0
    Local = FALSE
    FloorFromBase = FALSE
    ApplyOnStore = FALSE
    DeleteAboveCommit = FALSE
    Unconditional = FALSE
    Untagged = FALSE
    NoOpUnchecked = FALSE
    Retention = TRUE

SYMMETRY Symm

INVARIANTS
    NoReadBelowAckedTrim
    NeverMoreThanAsked
    StaleTrimRefused
