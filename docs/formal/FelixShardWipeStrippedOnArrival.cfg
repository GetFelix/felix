\* FelixShardWipeStripped.cfg with the report's incarnations stamped by the
\* control plane as it takes the report, rather than measured by the leader
\* on its connections. The code still does this for a follower that predates
\* the handshake's incarnation, so only while a roll is under way
\* (docs/replication-design.md, "Who may be promoted").
\*
\* Expected to violate AckedSurvive: the leader, still on the follower's old
\* connection, reports it under its old identity after it registered again,
\* the stamp is its current incarnation, and placement promotes the empty
\* follower. FelixShardWipeStripped.cfg is the fix.
\*
\* Evidence: this configuration REMOVES the measured incarnation.
\* `a_follower_measured_at_another_incarnation_is_not_counted` -- drop it
\*   and the stamp counts the follower, which is the trace TLC finds.

SPECIFICATION Spec

CONSTANTS
    Brokers = {a, b, c}
    L = 2
    Margin = 1
    Eps = 1
    Drift = 0
    MaxTime = 3
    MaxWrites = 1
    CheckAtCommit = TRUE
    Quorum = TRUE
    Promotion = "leader-report"
    ReportBeforeAck = TRUE
    Handoff = FALSE
    WaitForDrained = TRUE
    FenceAtClaim = TRUE
    AckOnAdmit = FALSE
    FenceFromAdmit = FALSE
    MaxMoves = 0
    Planners = {}
    CasWrites = TRUE
    StageMove = FALSE
    LearnerVotes = FALSE
    Resends = FALSE
    SequencesInLog = TRUE
    Cancel = FALSE
    CancelCas = TRUE
    ReportBound = "acknowledged"
    AckChecksLease = TRUE
    AckOnResponse = TRUE
    AckByFollowers = FALSE
    FenceOnPromote = FALSE
    LabelOnReceipt = FALSE
    StartRecord = FALSE
    ReportFromAnswers = TRUE
    ReportFloor = TRUE
    PromoteDestination = FALSE
    Counters = FALSE
    CounterCatchUp = FALSE
    Ballots = FALSE
    Elections = 0
    FenceEveryChange = FALSE
    Suspicions = 0
    SetCheck = FALSE
    JointFence = FALSE
    Adopt = 0
    AdoptMatch = TRUE
    Swaps = 0
    PreVote = FALSE
    Wipes = 1
    StorageIds = TRUE
    Grow = FALSE
    Spares = {}
    ReplaceOnPromote = FALSE
    SeatHoldsCopy = TRUE
    StripIds <- Yes
    StampOnArrival <- Yes

SYMMETRY Symm

INVARIANTS
    TypeOK
    AtMostOneServing
    AckedSurvive
    AckedAgree
    NoTruncationBelowHwm
    NoStaleCommit
