\* Replication factor 3 with a move's destination staged as a fourth copy,
\* two writes, and every exit of the move dropping the destination
\* (`DropsDestination`, `UnstageDrops`). A majority of four is the leader and
\* two followers, so one that stays holds every acknowledged record, and TLC
\* finds none lost.
\*
\* Evidence: the implementation behaviours this configuration asserts.
\* `a_lost_destination_the_move_added_leaves_the_set` -- a set of four drops
\*   the destination.

SPECIFICATION Spec

CONSTANTS
    Nodes = {a, b, c, d}
    First = a
    NoNode = NoNode
    MaxGen = 4
    MaxWrites = 2
    MaxCrashes = 1
    MaxMoves = 1
    Replication <- Three
    DropsDestination <- Yes
    UnstageDrops <- Yes

SYMMETRY Seats

INVARIANTS
    OneLeaderPerGeneration
    AckedHeldByLeader
    AtMostOneServing

CHECK_DEADLOCK FALSE
