\* FelixRaftReformBatchAbandon.cfg with an epoch's start not held above
\* every earlier epoch's first index and first offset. a commits its blank
\* entry, a record is appended and the group re-forms with it in the base;
\* then a's copy rotates to just the blank and the group starts by itself
\* from it. With Batch the blank takes no offset, so the new epoch's first
\* offset is the floor's, below the record epoch 1 served, and the next write
\* gives that offset out again.
\*
\* Evidence: none, this pins why the earlier epochs bound has an offset form.

SPECIFICATION Spec

CONSTANTS
    Brokers = {a, b}
    InitBrokers = {a}
    None = None
    MaxEpoch = 2
    MaxTerm = 2
    MaxWrites = 2
    MaxChangeSteps = 0
    ChangeOut = None
    ChangeIn = None
    MaxPlace = 0
    MaxRotations = 1
    MaxRejoins = 0
    MaxRestarts = 0
    MaxMsgs = 0
    MaxPlans = 1
    MaxDead = 1
    DeadRuns = FALSE
    WaitPlaced = TRUE
    Floor = "exact"
    ReformBeforeAll = FALSE
    EpochNotChecked = FALSE
    ReportNotPromise = FALSE
    PlanNotRechecked = FALSE
    RotatedNotWaited = FALSE
    RetireNotDurable = FALSE
    VoteByBroker = FALSE
    BaseNotHighest = FALSE
    NoCas = FALSE
    SoloPlacedTwo = FALSE
    StopNotRechecked = FALSE
    PlacedForgotten = FALSE
    FloorIndexOnly = FALSE
    CutToCommit = FALSE
    Kept = FALSE
    Alone = "off"
    Reserve = "none"
    MaxCuts = 0
    MaxReturns = 1
    Abandon = "on"
    Batch <- BatchOn
    MaxBatch <- MaxBatchTwo
    EarlierNotBound <- Yes

SYMMETRY Symm

INVARIANTS
    TypeOK
    BootIsRecorded
    PlacedIsRecorded
    OneLeaderPerTerm
    AbandonedNotLed
    AckedSurvive
    StateMachineSafety
    OffsetNeverReused
    LossReported
