\* FelixShardElectWipeNonVoter.cfg with the replica voting again as soon as
\* the re-admitting leader opens, caught up or not (`ReadmitBeforeCatchUp`).
\* TLC loses an acknowledged write: write 1 is acknowledged on {a, b}; b is
\* wiped; a re-admits b at 2 with only c answering; b votes with an empty log;
\* c stands at 3, b answers, and c opens without write 1 (AckedHeldByLeader).
\* AckedOnMajority breaks a step earlier, at the re-admission itself, and is
\* left out here so the trace reaches the lost write. The catch-up is what
\* makes the rule safe.
\*
\* Evidence: none yet; the code lands in #1009 S8 (non-voting rejoin), which must cite tests here.

SPECIFICATION Spec

CONSTANTS
    Brokers = {a, b, c}
    L = 4
    Margin = 0
