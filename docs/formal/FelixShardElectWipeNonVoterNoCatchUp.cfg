\* FelixShardElectWipeNonVoter.cfg with the replica voting again as soon as
\* the confirmed leader is open at its set's generation or a later one,
\* caught up or not (`ReadmitBeforeCatchUp`). TLC finds two leaders at one
\* generation: c promises 3 to candidate b, which opens on {b, c}; c is wiped
\* and forgets it; the control plane re-admits c at 2 through a, which then
\* stands at 3, and adopts b at 3; c votes again without having taken a
\* batch from b, so it holds no ballot for 3, answers a, and a opens at 3 on
\* {a, c} (OneLeaderPerGeneration). The catch-up is what makes the rule
\* safe: it brings the leader's records and takes its ballot. AckedOnMajority
\* is left out, as it breaks at the re-admission itself, and so is
\* AckedHeldByLeader, which breaks about as early: with several TLC workers
\* either could be reported first;
\* FelixShardElectWipeNonVoterNoCatchUpFailover.cfg pins it.
\*
\* Evidence: `a_readmitted_copy_keeps_the_ballot_its_catch_up_took` in
\* crates/server/felix-replication/src/replica/tests/non_voting.rs.

SPECIFICATION Spec

CONSTANTS
    Brokers = {a, b, c}
    L = 4
    Margin = 0
    Eps = 0
    Drift = 0
    MaxTime = 0
    MaxWrites = 1
    CheckAtCommit = FALSE
    Quorum = TRUE
    Promotion = "log-order"
    ReportBeforeAck = FALSE
    Handoff = FALSE
    WaitForDrained = TRUE
    FenceAtClaim = TRUE
    AckOnAdmit = FALSE
    FenceFromAdmit = FALSE
    MaxMoves = 0
    Planners = {}
    CasWrites = TRUE
    StageMove = FALSE
    LearnerVotes = FALSE
    Resends = FALSE
    SequencesInLog = TRUE
    Cancel = FALSE
    CancelCas = TRUE
    ReportBound = "acknowledged"
    AckChecksLease = FALSE
    AckOnResponse = FALSE
    AckByFollowers = TRUE
    FenceOnPromote = TRUE
    LabelOnReceipt = FALSE
    StartRecord = TRUE
    ReportFromAnswers = FALSE
    ReportFloor = FALSE
    Spares = {}
    ReplaceOnPromote = FALSE
    SeatHoldsCopy = TRUE
    Grow = FALSE
    PromoteDestination = FALSE
    Counters = FALSE
    CounterCatchUp = FALSE
    Ballots = TRUE
    Elections = 2
    FenceEveryChange = FALSE

    Suspicions = 0
