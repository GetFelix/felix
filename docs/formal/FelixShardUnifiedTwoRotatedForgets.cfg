\* FelixShardUnifiedTwoRotated.cfg with a rotated copy that lost its ballot
\* still answering as the voter its old id named. It can then promise the
\* generation to the second leader too, and two leaders open it. Expected to
\* violate OneLeaderPerGeneration.
\*
\* Evidence: `only_a_crash_that_keeps_every_ballot_records_the_id_it_rotated`.

