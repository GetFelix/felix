\* FelixRaftLeaseTransferStepDown.cfg with both restart fast paths on
\* (RestoreOwnLead, HoldExemptsNamed), one restart, two terms and no write:
\* a leader that authorized a transfer restarts with its own vote stored and
\* its transfer wiped, and campaigns at once in the term the transfer target
\* runs in. Two terms and no write keep the run small enough for CI, and a
\* restart after a void needs a third term (RestoreStepDown). A restart with
\* a write and a step-down or transfer, and a restart with a transfer in three
\* terms, are not checked (issue 2471). ElectionTimeoutMin is 1 where the
\* parent has 0: a stepped-down leader campaigning in the same tick is not
\* checked with a restart.
\*
\* Evidence: none, the restart fast path (pull request 2445) is not built.

