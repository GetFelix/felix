\* Every rule on: two members, two records, one change of leader, four entries.
\*
\* Evidence: `an_ack_above_a_gap_survives_a_change_of_leader` -- an ack above
\*   a gap is a durable entry the next leader applies.

SPECIFICATION Spec

CONSTANTS
    Members = {a, b}
    N = 2
    SeekTo = {1, 3}
    MaxChanges = 1
    MaxLog = 4
    CreationCheck = TRUE
    DeleteWatermark = TRUE
    IfNewChecksTracker = TRUE
    TermBoundTrackers = TRUE
    HydrateFromApplied = TRUE
    WaitOwnProposals = TRUE
    StaleByHyd = FALSE
    RefreshOnDrop = TRUE
    DeadBeforeAdvance = TRUE
    KeepRedriven = TRUE
    DurableAckAhead = TRUE

SYMMETRY Symm

INVARIANTS
    NoSkip
    RedrivenOwed
    IfNewKeepsServed
    TrackerHeard
    AckedStaysSettled
