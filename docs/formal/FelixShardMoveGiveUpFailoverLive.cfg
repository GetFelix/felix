\* FelixShardMoveGiveUpFailoverStall.cfg with the failover keeping the
\* destination in a set of three (`keep_replicas` in plan.rs). TLC finds the
\* shard served again, and every leader holding every acknowledged record.
\*
\* Evidence: the implementation behaviours this configuration asserts.
\* `a_failover_keeps_a_destination_staged_on_a_set_of_two` -- CpDeadFailover
\*   keeps the set.

SPECIFICATION LiveSpec

CONSTANTS
    Nodes = {a, b, c}
    First = a
    NoNode = NoNode
    MaxGen = 6
    MaxWrites = 1
    MaxCrashes = 1
    MaxMoves = 0
    Replication <- Two
    DeadFailover <- Yes
    CrashesAboveFactor <- Yes

INVARIANTS
    OneLeaderPerGeneration
    AckedHeldByLeader
    AtMostOneServing

PROPERTY
    EventuallyServes

CHECK_DEADLOCK FALSE
