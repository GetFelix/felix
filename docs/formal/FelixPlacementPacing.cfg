\* Moves and follower replacements under a limit of two copies cluster-wide
\* and one per node, with every copy counted.
\*
\* Expected to pass.
\* Evidence: `a_follower_replacement_holds_a_move_slot` -- a replacement names
\*   its copy and holds a slot until it is seated.
\* `copies_into_or_out_of_one_node_are_bounded` -- the per-node limit counts
\*   both ends of every copy in flight.
\* `a_fenced_move_past_its_timeout_is_finished` -- only a move before its
\*   fence times out.

SPECIFICATION Spec

CONSTANTS
    Shards = {s1, s2, s3, s4}
    Nodes = {n1, n2, n3, n4}
    MaxConcurrent = 2
    MaxPerNode = 1
    CountReplacements = TRUE
    Planners = {p1}
    Operators = {}
    Fenced = TRUE

SYMMETRY Symm

INVARIANTS
    TypeOK
    CopiesWithinLimit
    FencedOnlyInAMove
