\* A group that exists, two terms, one write, and one volume that may be
\* lost at any time, also before the group has committed anything (issue
\* 2374). Every log is then still empty, but the other members hold a record
\* that the wiped member set out to form, so it does not form again: it
\* votes only after catching up with a confirmed leader.
\* FelixRaftPlacementFormEarlyWipeUnrecorded.cfg is this without the record.
\*
\* Evidence: `a_member_wiped_before_the_first_entry_does_not_form_again`.

