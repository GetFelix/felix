\* A witness for FelixRaft.cfg, to show its checks do not pass for want of
\* behaviour. `NeverSkipsBetweenRecords` says this never happens, and TLC
\* must find that it does: a blank entry sits between two delivered records,
\* so the second one's batch reports a skipped offset.
\*
\* Evidence: the raft_log adapter tests in felix-storage:
\*   `blank_and_membership_entries_are_records_clients_skip`.

SPECIFICATION Spec

CONSTANTS
    Servers = {a, b, c}
    Nobody = Nobody
    MaxTerm = 2
    MaxWrites = 2
    MaxMembers = 0
    MaxCrashes = 0
    MaxSnapshots = 0
    Consumer = TRUE
    AckBeforeFlush = FALSE
    VoteNotDurable = FALSE
    LeaderResumes = FALSE
    TornTailKept = FALSE
    TruncateNotDurable = FALSE
    RecoveredTailUnsynced = FALSE
    SaveCommittedUnflushed = FALSE
    PurgeBeforeSnapshot = FALSE
    SnapshotTwoRenames = FALSE
    CommitPriorTerm = FALSE
    DeliverUncommitted = FALSE
    SkipsNotCounted = FALSE

SYMMETRY Symm

INVARIANTS
    NeverSkipsBetweenRecords
