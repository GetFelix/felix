\* FelixShardReplacedPendingLeftKept.cfg with promotion on suspicion up to
\* generation 3, so two failovers in a row can fail to open, and a member
\* answering a fence keeping only one of the sets it leaves
\* (`OneLeavingSet`), as the broker's kept set does.
\*
\* Expected to violate AckedHeldByLeader (#1881): two failovers in a row
\* whose fences never open, and the oldest set is overwritten.
\* A failover fences the control plane's set from the generation before
\* beside its own (`FenceRecordedSet`), as `set_before` and `logged_besides`
\* in promotion/joint.rs do; under Promotion "any" the two can differ.
\*
\* Evidence: none yet (#1880, #1881).

SPECIFICATION Spec

CONSTANTS
    OneLeavingSet <- Yes
    KeepsUnopened <- Yes
    FenceRecordedSet <- Yes
    Brokers = {a, b, c, d}
    L = 4
    Margin = 0
    Eps = 0
    Drift = 0
    MaxTime = 4
    MaxWrites = 2
    CheckAtCommit = FALSE
    Quorum = TRUE
    Promotion = "any"
    ReportBeforeAck = FALSE
    Handoff = FALSE
    WaitForDrained = TRUE
    FenceAtClaim = TRUE
    AckOnAdmit = FALSE
    FenceFromAdmit = FALSE
    MaxMoves = 0
    Planners = {}
    CasWrites = TRUE
    StageMove = FALSE
    LearnerVotes = FALSE
    Resends = FALSE
    SequencesInLog = TRUE
    Cancel = FALSE
    CancelCas = TRUE
    ReportBound = "acknowledged"
    AckChecksLease = FALSE
    AckOnResponse = FALSE
    AckByFollowers = TRUE
    FenceOnPromote = TRUE
    LabelOnReceipt = FALSE
    StartRecord = TRUE
    ReportFromAnswers = FALSE
    ReportFloor = FALSE
    Spares = {d}
    ReplaceOnPromote = TRUE
    SeatHoldsCopy = TRUE
    Grow = FALSE
    PromoteDestination = FALSE
    Counters = FALSE
    CounterCatchUp = FALSE
    Ballots = FALSE
    Elections = 0
    FenceEveryChange = FALSE

    Suspicions = 3
    SetCheck = TRUE
    JointFence = TRUE
    Adopt = 0
    AdoptMatch = TRUE
    Swaps = 0
    PreVote = FALSE
    Wipes = 0
    StorageIds = FALSE
SYMMETRY Symm

INVARIANTS
    TypeOK
    AckedHeldByLeader
    AckedAgree
    NoTruncationBelowHwm
