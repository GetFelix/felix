\* FelixRaftRestoreRepeatedBatchSkew.cfg with a bucket of four, twice the
\* largest entry, so the bucket's part of the burst counts. Epoch 0 starts
\* with a full bucket, which it can bank and spend at once. Apart = 12 is
\* 2 * (Capacity + MaxBatch), the spacing that covers that burst with the
\* planning clocks up to two ticks apart. The bucket never sinks below one
\* maximum entry in debt.
\*
\* Evidence: none, batch entries are not built yet (#3359).

