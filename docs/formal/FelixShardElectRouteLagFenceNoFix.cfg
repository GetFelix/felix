\* #1940 without its fix (`RenameSpec`): FelixShardElectRouteLagNoFix.cfg
\* with #1936's report on (`OwnBallotReported`) and its candidate rule off,
\* so the round on the stale route still stands. A member may answer that
\* round's fence (`StaleFenceAnswered`), and a leader the control plane named
\* opens only once its own copy takes its generation's ballot
\* (`OpenChecksOwnBallot`, `keep_own_set` in the code). A fencing leader
\* below its own ballot reports nothing (`OwnBallotFenceRefused` off). It
\* violates `OwnBallotFenceCaughtUp`: the round stands one generation above
\* the leader's while it is still fencing, and the leader never opens and
\* never reports.
\*
\* Evidence: `a_fence_below_its_own_ballot_reports_the_refusal`
\*   -- the report this configuration leaves out.

SPECIFICATION RenameSpec

CONSTANTS
    Brokers = {a, b, c}
    L = 2
    Margin = 0
    Eps = 0
    Drift = 0
    MaxTime = 0
    MaxWrites = 0
    CheckAtCommit = FALSE
    Quorum = TRUE
    Promotion = "log-order"
    ReportBeforeAck = FALSE
    Handoff = FALSE
    WaitForDrained = TRUE
    FenceAtClaim = TRUE
    AckOnAdmit = FALSE
    FenceFromAdmit = FALSE
    MaxMoves = 0
    Planners = {}
    CasWrites = TRUE
    StageMove = FALSE
    LearnerVotes = FALSE
    Resends = FALSE
    SequencesInLog = TRUE
    Cancel = FALSE
    CancelCas = TRUE
    ReportBound = "acknowledged"
    AckChecksLease = FALSE
    AckOnResponse = FALSE
    AckByFollowers = TRUE
    FenceOnPromote = TRUE
    LabelOnReceipt = FALSE
    StartRecord = TRUE
    ReportFromAnswers = FALSE
    ReportFloor = FALSE
    Spares = {}
    ReplaceOnPromote = FALSE
    SeatHoldsCopy = TRUE
    Grow = FALSE
    PromoteDestination = FALSE
    Counters = FALSE
    CounterCatchUp = FALSE
    Ballots = TRUE
    Elections = 1
    FenceEveryChange = FALSE

    Suspicions = 1
    SetCheck = TRUE
    JointFence = TRUE
    Adopt = 3
    AdoptMatch = TRUE
    Swaps = 0
    PreVote = TRUE
    Wipes = 0
    StorageIds = FALSE
    PreVoteAsked <- Yes
    FailStops <- One
    Renames <- Yes
    RouteLags <- Yes
    NamedHereWaits <- No
    StaleFenceAnswered <- Yes
    OpenChecksOwnBallot <- Yes

PROPERTIES
    OwnBallotCaughtUp
    OwnBallotFenceCaughtUp

INVARIANTS
    TypeOK
    OneLeaderPerGeneration
    AckedHeldByLeader
    AckedAgree
    AckedOnMajority
    NoTruncationBelowHwm
    AdoptedMatchesOpened
    SetChangesJoint
