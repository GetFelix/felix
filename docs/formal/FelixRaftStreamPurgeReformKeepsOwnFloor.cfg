\* One rule dropped: a re-form keeps each read copy's own floor. The trim
\* that set the highest floor read can be in no read copy's log, so the new
\* leader serves records below a floor another copy installed. That copy is
\* a learner: with three voters, a voter that installed past the trim and a
\* read copy without it cannot both miss the quorum that committed it.
\*
\* Evidence: none, purging a Raft stream shard is not built yet (issue 2602).

SPECIFICATION Spec

CONSTANTS
    Members = {a, b, c, d}
    Voters = {a, b, c}
    MaxIndex = 5
    MaxTrims = 2
    MaxChanges = 0
    MaxRestarts = 0
    MaxReforms = 1
    PurgeBelowFloorRule = TRUE
    InstallRule = TRUE
    LeaderCaps = FALSE
    SnapAtApplied = FALSE
    TablesAtApplied = FALSE
    ReformReads = "full"
    ReformCarriesFloor = FALSE

SYMMETRY Symm

INVARIANTS
    NoReadBelowFloor
