\* FelixRaftLease.cfg with the role read late (RoleSync off), one leader
\* stepping down on a higher term without a transfer (openraft's HigherVote:
\* it adopts the candidate's vote and grants it), and openraft's grant to the
\* leader a voter follows (LeaderBypass), which the stepped-down leader uses
\* when it campaigns ElectionTimeoutMin = 1 later, before the lease of 2 ends.
\* The node layer voids every term below the one a message names, before
\* openraft sees it. Three terms: the leader, its campaign, a third broker.
\* No drift (clocks gain 1 a tick), so a lease of 2 against an election
\* timeout of 2 meets the inequality and spans two ticks; drift is in the
\* Drift version.
\*
\* Evidence: none, `admit_local_ack` always refuses until issue 2249 builds this rule.

