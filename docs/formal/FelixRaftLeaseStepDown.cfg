\* FelixRaftLease.cfg with Felix reading the role late (RoleSync off), one
\* leader stepping down without a transfer, and openraft's grant to the
\* leader a voter follows (LeaderBypass). The stepped-down leader campaigns
\* ElectionTimeoutMin = 2 later and its followers grant it inside their
\* window, so a third broker can then win. The lease of 2 is no longer than
\* that wait, so the late role cannot carry it past the new leader's
\* election. Three terms: the leader, its campaign, the third broker.
\*
\* Evidence: none, `admit_local_ack` always refuses until issue 2249 builds this rule.

