\* FelixRaftReformAlone.cfg with batch entries (docs/raft-batch-entries-design.md):
\* a write is one entry of one or two records, each election appends a
\* blank entry that takes no offset, and the floor and the reservation
\* carry offsets. A relaxed crash takes counted batches, and the group
\* re-forms at a first index and a first offset, each the highest of its own
\* bounds. No offset is given out twice, the jump is reported whole, and
\* every counted offset was reserved first.
\*
\* Evidence: none, batch entries are not built yet (#3359).

SPECIFICATION Spec

CONSTANTS
    Brokers = {a}
    InitBrokers = {a}
    None = None
    MaxEpoch = 1
    MaxTerm = 2
    MaxWrites = 3
    MaxChangeSteps = 0
    ChangeOut = None
    ChangeIn = None
    MaxPlace = 0
    MaxRotations = 0
    MaxRejoins = 0
    MaxRestarts = 0
    MaxMsgs = 0
    MaxPlans = 1
    MaxDead = 0
    DeadRuns = FALSE
    WaitPlaced = TRUE
    Floor = "trailing"
    ReformBeforeAll = FALSE
    EpochNotChecked = FALSE
    ReportNotPromise = FALSE
    PlanNotRechecked = FALSE
    RotatedNotWaited = FALSE
    RetireNotDurable = FALSE
    VoteByBroker = FALSE
    BaseNotHighest = FALSE
    NoCas = FALSE
    SoloPlacedTwo = FALSE
    StopNotRechecked = FALSE
    PlacedForgotten = FALSE
    FloorIndexOnly = FALSE
    CutToCommit = FALSE
    Kept = TRUE
    Alone = "whole"
    Reserve = "every"
    MaxCuts = 1
    MaxReturns = 0
    Abandon = "off"
    Batch <- BatchOn
    MaxBatch <- MaxBatchTwo


SYMMETRY Symm
INVARIANTS
    TypeOK
    BootIsRecorded
    PlacedIsRecorded
    OneLeaderPerTerm
    AckedSurvive
    StateMachineSafety
    OffsetNeverReused
    LossReported

PROPERTIES
    KeptLossBound
    ReservedCovers
