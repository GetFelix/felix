\* FelixRaftLeaseAck.cfg with the lease allowance of issue 3103: the leader
\* names an end up to one past its log, three allowances in all, so it can
\* raise, lower and raise again. A write is answered on the lease only below
\* an end a majority holds, and a voter holding an allowance votes only for a
\* candidate past it or for the leader that named it.

SPECIFICATION Spec

CONSTANTS
    Servers = {a, b, c}
    Nobody = Nobody
    MaxTerm = 2
    MaxWrites = 1
    MaxRestarts = 0
    RateLo = 1
    RateHi = 2
    DriftLo = 1
    DriftHi = 2
    Lease = 1
    ElectionTimeout = 2
    Consumer = FALSE
    LeaseTooLong = FALSE
    DriftBeyondBound = FALSE
    LeaseFromAck = FALSE
    VoteInWindow = FALSE
    RestartForgetsWindow = FALSE
    RestartRenewsFollowed = FALSE
    DeliverUncommitted = FALSE
    StoreLeases = FALSE
    SupportTime = 0
    MaxEpoch = 1
    MaxBeats = 0
    MaxStalls = 0
    SupportNotDurable = FALSE
    VoteWhileSupported = FALSE
    LeaseKeptAcrossRestart = FALSE
    ResupportWithdrawn = FALSE
    WithdrawEarly = FALSE
    StalledKeepsAsking = FALSE
    ElectionTimeoutMin = 2
    RoleSync = TRUE
    LeaderBypass = FALSE
    MaxStepDowns = 0
    VoidOnHigherTerm = FALSE
    VoidEquality = FALSE
    MaxTransfers = 0
    TransferVoids = TRUE
    VoidBeforeSend = TRUE
    MaxSuspends = 0
    SuspendCheck = TRUE
    WakeCheckLate = FALSE
    RestoreOwnLead = FALSE
    RestoreAnyVote = FALSE
    HoldExemptsNamed = FALSE
    HoldExemptsAny = FALSE
    MaxWakes = 0
    HoldEndClearsWindow = FALSE
    SleepAnswerRenews = FALSE
    Allowances = TRUE
    Budget = 1
    MaxNames = 3
    VoteIgnoresAllowance = FALSE
    AckIgnoresAllowance = FALSE
    AllowanceNotDurable = FALSE
    EchoBeforeLowering = FALSE

SYMMETRY Symm

INVARIANTS
    TypeOK LeaseExclusive NoAckBehindNewLeader OneLeaderPerTerm AckedSurvive LeaseAckedSurvive StateMachineSafety LeaseNoNewerLeader
