\* A timing check of the lease allowance of issue 3103, at small bounds:
\* FelixRaftLeaseAck.cfg with one allowance, an end up to one past the
\* leader's log. A write is answered on the lease only while the lease holds
\* and below an end a majority holds, and a voter holding an allowance votes
\* only for a candidate past it or for the leader that named it. Clocks do
\* not drift. It checks that the Part 1 timing checks still pass with the
\* allowance on. It gave up a second allowance (raise then lower, or one per
\* term) to finish in CI; the safety proof for the allowance at the wider
\* bounds is FelixRaftLeaseAllowanceUntimed.cfg, which has every timed
\* behaviour here.
\*
\* Evidence: none, this models the design for #3103, which is not built.

SPECIFICATION Spec

