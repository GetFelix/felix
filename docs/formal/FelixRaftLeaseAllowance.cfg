\* FelixRaftLeaseAck.cfg with the lease allowance of issue 3103: the leader
\* names an end up to one past its log, two allowances in all, so it can
\* raise and lower, or name one in each term. A write is answered on the
\* lease only below an end a majority holds, and a voter holding an
\* allowance votes only for a candidate past it or for the leader that named
\* it. Clocks do not drift here: the allowance reads no clock, and drift
\* against the lease alone is FelixRaftLeaseAck.cfg's. A third allowance
\* (raise, lower, raise) is checked in FelixRaftLeaseAllowanceUntimed.cfg.
\*
\* Evidence: none, this models the design for #3103, which is not built.

