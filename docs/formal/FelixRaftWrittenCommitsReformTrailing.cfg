\* FelixRaftWrittenCommitsReform.cfg without the reservation: the re-form
\* pads only up to the floor the control plane last stored, which trails
\* the commit. A record committed on a written majority after the last
\* report, and delivered, is lost with the two cut tails, and its offset is
\* given out again.
\*
\* PowerCut only cuts a copy that loses an entry, so a synced or empty copy
\* never rotates here. That is harmless at one term: such a copy loses
\* nothing a re-form could read.
\*
\* Evidence: none, this models an alternative the implementation must not use.

