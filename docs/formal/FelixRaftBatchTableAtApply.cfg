\* One rule dropped: the leader's table reads committed entries only. A send
\* that arrives while the first is still in flight is placed as new as well,
\* and the batch is in the log twice. No change of leader is needed. The
\* model also lets a new leader place a re-send before the pieces it took
\* over commit, which the code never does, since it serves a term only once
\* every earlier entry is applied.
\*
\* Evidence: none, this models an alternative the design does not use.

