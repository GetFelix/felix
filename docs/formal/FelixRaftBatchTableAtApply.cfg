\* One rule dropped: the leader's table reads committed entries only. A send
\* that arrives while the first is still in flight is placed as new as well,
\* and the batch is in the log twice. No change of leader is needed; a new
\* leader that places a re-send before the pieces it took over commit does the
\* same.
\*
\* Evidence: none, this models an alternative the design does not use.

