\* One broker is declared dead and takes no step again. The command does not
\* wait for it, and re-forms from the two it reaches. One more disk may be
\* lost. A record that only the dead broker's disk holds is the documented
\* loss.
\* 
\* Evidence: none, re-forming is not built yet (track 4 of issue 2244).

