\* FelixRaftSleepFalseAlarm with a hold shorter than the ask's round trip.
\* The follower asks, the hold ends before the leader's heartbeat can arrive,
\* and the follower campaigns and deposes a healthy leader. Asking is not
\* enough: the hold has to outlast the answer. The harm is availability, not
\* safety.
\* Evidence: none, this models an alternative the implementation does not use.

