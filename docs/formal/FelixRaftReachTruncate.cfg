\* A witness for FelixRaft.cfg, to show its checks do not pass for want of
\* behaviour. `NeverTruncates` says this never happens, and TLC must find
\* that it does: a follower cuts off a tail that conflicts with its leader's
\* log.
\*
\* Evidence: the raft_log adapter tests in felix-storage:
\*   `a_cut_at_each_step_of_a_truncation_leaves_no_gap`,
\*   `a_cut_after_a_truncation_keeps_the_new_entries`.

