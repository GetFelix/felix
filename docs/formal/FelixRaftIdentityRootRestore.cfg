\* FelixRaftIdentity.cfg with the fault a whole data root going back to a
\* backup from an earlier run. The root's incarnation is behind the control
\* plane's, so the gate in front of Raft gives it a new storage id and every
\* copy in it rotates.
\*
\* Evidence: gate comparison only; control-plane side not built (#2441).
\* `a_root_behind_the_incarnation_is_behind` (the incarnation verdict is an
\* input to the gate), `a_copy_minted_under_another_storage_id_rotates` and
\* `a_root_ahead_of_its_copies_passes`.

