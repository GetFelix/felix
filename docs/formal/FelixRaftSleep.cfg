\* Sleep and wake for one Raft group, as docs/per-shard-raft.md describes them:
\* three brokers, the handshake with every rule on, one write, one audit, one
\* lost sleep request or answer, one restart and one false alarm about a
\* leader's broker.
\* Evidence: none, sleep is not built yet (issue 2244).

SPECIFICATION Spec

CONSTANTS
    Servers = {a, b, c}
    Nobody = Nobody
    MaxTerm = 2
    MaxWrites = 1
    MaxSleeps = 2
    MaxAudits = 1
    MaxDeaths = 0
    MaxRestarts = 1
    MaxAlarms = 1
    MaxLost = 1
    MaxDozes = 0
    LivenessMisses = FALSE
    AlarmsOnFollowers = FALSE
    NoLivenessWake = FALSE
    NoAudit = FALSE
    AcceptUnchecked = FALSE
    CampaignOnWake = FALSE
    LeaderSleepsFirst = FALSE
    RestartNoHold = FALSE
    HeartbeatKeepsProposal = FALSE
    SleepUnsupported = FALSE

SYMMETRY Symm

INVARIANTS
    TypeOK
    OneLeaderPerTerm
    LogMatching
    LeaderCompleteness
    StateMachineSafety
    AckedSurvive
    AsleepIsLevel
    NoNeedlessDeposal
    QuiescentLed
    QuiescentLevel
