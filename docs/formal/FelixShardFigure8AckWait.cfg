\* FelixShardFigure8FollowerAcks.cfg with the clients of x and y still
\* waiting (`AckWaits`), each on the broker that wrote it, keyed by the
\* generation and offset it landed at. A wait follows its broker into any
\* generation it is promoted to, so a's wait for x is answered by a's mark at
\* a later generation, after a's fence may have taken b's log in place of its
\* own. It is acknowledged only if a's log still holds a record of
\* generation 1 at x's offset. FelixShardFigure8AckWaitByOffset.cfg is this without
\* that check.
\*
\* Evidence: `still_holds` in crates/server/felix-replication/src/quorum.rs,
\* and `a_wait_across_a_promotion_does_not_acknowledge_a_dropped_write`
\* (crates/server/felix-replication/src/promotion/tests.rs).

