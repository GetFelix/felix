\* FelixRaftSleep without a rule the model needs: a heartbeat sent while a
\* sleep proposal is open leaves it open. The heartbeat wakes a follower that
\* already answered, the last answer arrives, the leader sleeps, and the awake
\* follower times out and deposes it. No fault is needed. The harm is
\* availability, not safety.
\* Evidence: none, sleep is not built yet (issue 2244). The design page does not
\* state this rule yet.

