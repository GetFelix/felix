\* The same with one replica the stream asked for, which is where counting
\* the destination hurt most: the leader alone is the majority, and a
\* failover can only promote the destination once a report names it caught
\* up.
\* Evidence: `a_destination_still_copying_does_not_hold_the_quorum_mark` --
\*   one replica plus a staged destination: the mark does not wait for it.
\* `a_quorum_publish_during_a_copy_is_not_held_by_it` -- the same, against a
\*   real cluster.

