\* Two terms and two writes with no crash: a deposed leader's log can end
\* in an entry of its own term at or past the new leader's record. Its
\* report does not count, and nothing acknowledged is lost.
\*
\* Evidence: `a_report_from_another_term_does_not_make_a_majority`,
\*   `a_report_at_another_term_is_not_counted` -- a log id of another term
\*   at or past the record does not count.
\*   `a_deposed_leader_acknowledges_nothing_on_reports` -- a member that no
\*   longer leads the record's term acknowledges nothing on the count.

