\* Consumer-group commits without the lease: a commit is written to the
\* coordinator's own log, then confirmed by the same round of fences a
\* `Quorum` read uses, at the commit's generation, before it is
\* acknowledged. Writes and clocks as in FelixShardReadsRound.cfg. A
\* coordinator deposed by a promotion it has not heard of cannot confirm:
\* its successor fenced a majority before it opened, and that majority
\* shares a replica with any the round reaches (NoStaleGroupCommit).
\* FelixShardSessionsGroupNoRound.cfg skips the round, and
\* FelixShardSessionsGroupLease.cfg puts the lease in its place.
\*
\* Bounds: one write, one group commit, time to 2 with L = 2.
\*
\* Evidence: `ReadIndex` (felix-replication leadership.rs), which the
\* group path confirms with once the fleet reads without the lease;
\* `readers_and_groups_survive_a_control_plane_partition` acks through it
\* with the lease lapsed.

SPECIFICATION SessionsSpec

CONSTANTS
    Brokers = {a, b, c}
    L = 2
    Margin = 0
    Eps = 0
    Drift = 1
    MaxTime = 2
    MaxWrites = 1
    CheckAtCommit = FALSE
    Quorum = TRUE
    Promotion = "log-order"
    ReportBeforeAck = FALSE
