\* The Raft leader lease for one shard group: three brokers, two terms, clocks
\* that gain 1 or 2 units a tick, lease 2 against an election timeout of 4
\* (the inequality holds with nothing to spare), no bound on time and no
\* write. Every rule is on.
\*
\* No broker restarts here. FelixRaftLeaseRestart.cfg adds one, and passes
\* on the node layer's vote hold, which is not built (issue 2307). So this
\* passing does not yet gate the pull request that turns on `admit_local_ack`.
\*
\* Evidence: none, `admit_local_ack` always refuses until these configs pass
\* and the restart rule of issue 2307 is built.

