\* One rule dropped: a re-form reads a copy's last entry and purged id, not
\* its floor. A copy that installed a snapshot holds a floor above its log,
\* and the new epoch gives out offsets below that floor again: its new
\* records are below the floor and nobody can read them. The leader purges
\* past a member's match, so that member is sent the snapshot.
\*
\* Evidence: none, purging a Raft stream shard is not built yet (issue 2602).

SPECIFICATION Spec

CONSTANTS
    Members = {a, b, c}
    Voters = {a, b, c}
    MaxIndex = 5
    MaxTrims = 2
    MaxChanges = 0
    MaxRestarts = 0
    MaxReforms = 1
    PurgeBelowFloorRule = TRUE
    InstallRule = TRUE
    InstallFloor = "max"
    LeaderCaps = FALSE
    SnapAtApplied = FALSE
    TablesAtApplied = FALSE
    SnapFloorAtP = TRUE
    SnapCarriesHeaders = TRUE
    DropFirst = FALSE
    ReformReads = "purged"
    ReformCarriesFloor = TRUE
    ReformStoresFloor = TRUE

SYMMETRY Symm

INVARIANTS
    OffsetNeverReused
