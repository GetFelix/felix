\* The design in issue 1662: a trim is a record, appended at the tail its
\* holder expects, applied by each broker when its commit offset passes it,
\* and deleted below on each broker only up to min(floor, commit offset).
\* CursorTooOld carries the tag of the trim that set the floor, and readers
\* skip trim records. Two holders, two writes and three trims or no-ops
\* across one promotion, with the deposed leader still taking writes and
\* trims and followers rebuilt at the leader's base. Crashes are in
\* FelixHeadTrimCrash.cfg and a second promotion in
\* FelixHeadTrimTwoPromotions.cfg; checking all of them at once does not
\* finish in an hour.
\*
\* Evidence: none, the design is not built yet (issue 1662).

SPECIFICATION Spec

