    Brokers = {a, b, c}
    MaxWrites = 2
    MaxTrims = 3
    MaxGen = 2
    MaxCrashes = 0
    Local = FALSE
    FloorFromBase = FALSE
    ApplyOnStore = FALSE
    DeleteAboveCommit = FALSE
    Unconditional = FALSE
    Untagged = FALSE
    NoOpUnchecked = FALSE
    Retention = FALSE

SYMMETRY Symm

INVARIANTS
    TypeOK
    NoReadBelowAckedTrim
    NothingLostAboveFloor
