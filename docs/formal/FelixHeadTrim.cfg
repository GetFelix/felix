\* The design in issue 1662: a trim is a record, appended at the tail its
\* holder expects, applied by each broker when its commit offset passes it,
\* and deleted below on each broker only up to min(floor, commit offset).
\* Readers see trim records and the holder epoch on them. Two holders, two
\* writes and two trims, across two promotions, with followers that fall
\* behind and start again at the leader's base.
\*
\* Evidence: none, the design is not built yet (issue 1662).

SPECIFICATION Spec

CONSTANTS
    Brokers = {a, b, c}
    MaxWrites = 2
    MaxTrims = 2
    MaxGen = 3
    Local = FALSE
    FloorFromBase = FALSE
    ApplyOnStore = FALSE
    DeleteAboveCommit = FALSE
    Unconditional = FALSE
    HiddenTrims = FALSE

SYMMETRY Symm

INVARIANTS
    TypeOK
    NoReadBelowAckedTrim
    NothingLostAboveFloor
    NeverMoreThanAsked
    StaleTrimRefused
