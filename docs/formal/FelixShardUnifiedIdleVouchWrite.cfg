\* FelixShardUnifiedIdleVouch with one client write, which may or may not
\* be made: an idle shard, empty or not. A follower back from an unclean
\* crash with its log whole is level with its leader, so only a batch sent
\* anyway vouches for it, through the mark or, with no write, `VouchEmpty`.
\* Every fair run trusts it again while that leader serves it. Expected to
\* pass.
\*
\* Evidence: `an_idle_follower_is_sent_the_mark_once_per_process` (the
\* leader's side) and
\* `an_unclean_copy_level_with_an_idle_leader_is_trusted_by_its_last_record_again`
\* (the replica's side).

SPECIFICATION ShipSpec

CONSTANTS
    Nodes = {a, b, c}
    First = a
    NoNode = NoNode
    MaxGen = 3
    MaxWrites = 1
    MaxStarts = 1
    MaxUnclean = 2
    MaxWipes = 0
    MaxRestores = 0
    MaxRetries = 0
    SetChoices = {{a, b, c}}
    OldPeers = {}

PROPERTY
    FollowerTrusted

INVARIANTS
    OneLeaderPerGeneration
    AckedHeldByLeader
