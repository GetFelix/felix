\* FelixRaftRestoreRepeatedBatch.cfg with the cap on entries per tick, one,
\* and not on offsets: the entry rate assumed before batch entries. An entry
\* of two offsets a tick keeps pace with the line, and a restore planned on
\* a slow clock starts below an offset the shard gave out.
\*
\* Evidence: none, this pins why the rate is enforced in offsets.

SPECIFICATION Spec

CONSTANTS
    Rate = 1
    TimeRate = 2
    Gap = 10
    Skew = 1
    MinApart = 8
    MaxTime = 16
    MaxBackups = 1
    MaxRestores = 2
    Line = TRUE
    EndGap = FALSE
    Batch = TRUE
    MaxBatch = 2
    Capacity = 1
    Step = 1
    MaxCuts = 1
    MaxLeaders = 0
    NoBucket = TRUE
    BucketStartsFull = FALSE
    RaiseFromNext = FALSE

INVARIANTS
    OffsetNeverReused
