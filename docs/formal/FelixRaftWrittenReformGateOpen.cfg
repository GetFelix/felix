\* FelixRaftWrittenReformGate with the gate forced open (#2661): c vouches
\* for its whole term-1 tail, and TLC must find a base entry that differs
\* from the committed one.
\*
\* Scope (#2729): one crash and no records, so the tail is c's term-1 blank;
\* c leads term 1 alone and the crash is what lets it step down with that
\* tail. No written reports (GateScope): the commit counts fsynced copies
\* here, so reports only release early acknowledgements.
\*
\* Evidence: none, this models the design for #2250, which is not built.

