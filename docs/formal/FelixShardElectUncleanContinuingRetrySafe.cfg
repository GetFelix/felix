\* FelixShardElectUncleanContinuingRetry.cfg without its canary: the same
\* retried continuing fence, with attestation at the generation before or at
\* the fence's own, checked exhaustively against every safety invariant
\* ElectUncleanContinuing checks. No two leaders open at one generation and
\* the leader keeps every acknowledged record.
\*
\* Twin: FelixShardElectUncleanContinuingRetryBelowOnly.cfg.
\*
\* Evidence: `a_retried_continuing_fence_counts_copies_whose_ballot_names_it_already`
\* and `a_continuing_joint_fence_counts_followers_answering_from_new_copies`
\* (felix-replication, `promotion::tests::joint`).

SPECIFICATION Spec

CONSTANTS
    Brokers = {a, b, c}
    L = 4
    Margin = 0
    Eps = 0
    Drift = 0
    MaxTime = 0
    MaxWrites = 1
    CheckAtCommit = FALSE
    Quorum = TRUE
    Promotion = "log-order"
    ReportBeforeAck = FALSE
    Handoff = FALSE
    WaitForDrained = TRUE
    FenceAtClaim = TRUE
    AckOnAdmit = FALSE
    FenceFromAdmit = FALSE
    MaxMoves = 0
    Planners = {}
    CasWrites = TRUE
    StageMove = FALSE
    LearnerVotes = FALSE
    Resends = FALSE
    SequencesInLog = TRUE
    Cancel = FALSE
    CancelCas = TRUE
    ReportBound = "acknowledged"
    AckChecksLease = FALSE
    AckOnResponse = FALSE
    AckByFollowers = TRUE
    FenceOnPromote = TRUE
    LabelOnReceipt = FALSE
    StartRecord = TRUE
    ReportFromAnswers = FALSE
    ReportFloor = FALSE
    Spares = {}
    ReplaceOnPromote = FALSE
    SeatHoldsCopy = TRUE
    Grow = FALSE
    PromoteDestination = FALSE
    Counters = FALSE
    CounterCatchUp = FALSE
    Ballots = TRUE
    Elections = 2
    FenceEveryChange = FALSE

    Suspicions = 0
    SetCheck = TRUE
    JointFence = TRUE
    Adopt = 2
    AdoptMatch = TRUE
    Swaps = 0
    PreVote = FALSE
    Wipes = 0
    StorageIds = FALSE
    LosePromises <- Yes
    WipedNonVoter <- Yes
    WipedLearnsSet <- Yes
    Forgets <- Two
    WipeLeads <- Yes
    ContinuingTrustsBallot <- Yes
    ContinuingKeptBallot <- Yes
    ContinuingForgottenAnswers <- Yes
    ContinuingRetries <- Yes
    ContinuingCopiesNew <- Yes
SYMMETRY Symm

INVARIANTS
    TypeOK
    OneLeaderPerGeneration
    AckedHeldByLeader
    AckedAgree
    NoTruncationBelowHwm
    AdoptedMatchesOpened
    NeverContinuingCountsNonVoter
