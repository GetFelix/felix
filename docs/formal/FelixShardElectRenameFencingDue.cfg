\* A witness for FelixShardElectRename.cfg: the same configuration, checking
\* that the control plane never names again a leader that took its
\* generation and is still fencing there (NeverRenameWhileFencing). TLC finds
\* one: the leader fences jointly while a set change is pending, and a
\* replica on the set being left stood at that generation and won another's
\* promise, so the old set's majority is out of reach.
\*
\* Evidence: none yet; no test covers a joint fence refused on the set
\* being left (issue 1856).

SPECIFICATION Spec

CONSTANTS
    Brokers = {a, b, c, d}
    L = 2
    Margin = 0
    Eps = 0
    Drift = 0
    MaxTime = 0
    MaxWrites = 1
    CheckAtCommit = FALSE
    Quorum = TRUE
    Promotion = "any"
    ReportBeforeAck = FALSE
    Handoff = FALSE
    WaitForDrained = TRUE
    FenceAtClaim = TRUE
    AckOnAdmit = FALSE
    FenceFromAdmit = FALSE
    MaxMoves = 0
    Planners = {}
    CasWrites = TRUE
    StageMove = FALSE
    LearnerVotes = FALSE
    Resends = FALSE
    SequencesInLog = TRUE
    Cancel = FALSE
    CancelCas = TRUE
    ReportBound = "acknowledged"
    AckChecksLease = FALSE
    AckOnResponse = FALSE
    AckByFollowers = TRUE
    FenceOnPromote = TRUE
    LabelOnReceipt = FALSE
    StartRecord = TRUE
    ReportFromAnswers = FALSE
    ReportFloor = FALSE
    Spares = {d}
    ReplaceOnPromote = FALSE
    SeatHoldsCopy = TRUE
    Grow = FALSE
    PromoteDestination = FALSE
    Counters = FALSE
    CounterCatchUp = FALSE
    Ballots = TRUE
    Elections = 1
    FenceEveryChange = TRUE

    Suspicions = 0
    SetCheck = TRUE
    JointFence = TRUE
    Adopt = 3
    AdoptMatch = TRUE
    Swaps = 1
    PreVote = FALSE
    Wipes = 0
    StorageIds = FALSE
    Renames <- Yes
SYMMETRY Symm

INVARIANTS
    NeverRenameWhileFencing
