\* FelixShardSwapCounters.cfg with the control plane taking the new set once
\* the cache log's start record is held, whatever the counter log holds. A
\* counter update acknowledged on {a, b} of {a, b, c}; the cut-over to b on
\* {b, c, d}; the cache log's start reaches c, and the counter log does not.
\* After the flip only b holds the update (`CountersOnSetMajority` violated,
\* 23K distinct states, a second). This is #1830 before its fix.
\*
\* Evidence: `a_flip_waits_for_the_counter_log_on_both_majorities`.

