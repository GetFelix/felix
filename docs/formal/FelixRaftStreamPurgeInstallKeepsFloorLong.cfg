\* InstallKeepsFloorSmall.cfg with a learner, five entries and two changes of
\* leader, steered by LowerFloorPath: after a member installs a snapshot
\* carrying a floor below its own, it can lead, take a write, purge, and send
\* the snapshot the install rewrote to a member behind it
\* (ReachRewrittenInstall.cfg). Expected to pass.
\*
\* Evidence: none, purging a Raft stream shard is not built yet (issue 2602).

SPECIFICATION Spec

CONSTANTS
    Members = {a, b, c, d}
    Voters = {a, b, c}
    MaxIndex = 5
    MaxTrims = 2
    MaxChanges = 2
    MaxRestarts = 1
    MaxReforms = 1
    PurgeBelowFloorRule = TRUE
    InstallRule = TRUE
    InstallFloor = "max"
    LeaderCaps = FALSE
    SnapAtApplied = FALSE
    TablesAtApplied = FALSE
    SnapFloorAtP = TRUE
    SnapCarriesHeaders = TRUE
    DropFirst = FALSE
    ReformReads = "full"
    ReformCarriesFloor = TRUE
    ReformStoresFloor = TRUE

CONSTRAINT LowerFloorPath
SYMMETRY Symm

INVARIANTS
    TypeOK
    NoReadBelowFloor
    NoAckedLoss
    PurgeBelowFloor
    AppliedCoversPurge
    TablesAgree
    HeadersAgree
    OffsetNeverReused
    CatchUpPossible
