\* A subscriber on a Raft shard: three brokers, two terms, two writes and
\* one crash, reading from any broker that believes it leads, up to what it
\* applied, and resuming by offset when it moves.
\*
\* Evidence: `the_read_bound_never_passes_the_commit_index`,
\*   `an_entry_cut_from_a_deposed_leaders_log_reaches_no_subscriber`,
\*   `a_reader_resumes_on_another_member_by_offset`.

SPECIFICATION SessionsSpec

CONSTANTS
    Servers = {a, b, c}
    Nobody = Nobody
    MaxTerm = 2
    MaxWrites = 2
    MaxMembers = 0
    MaxCrashes = 1
    MaxSnapshots = 0
    Consumer = TRUE
    AckBeforeFlush = FALSE
    VoteNotDurable = FALSE
    LeaderResumes = FALSE
    TornTailKept = FALSE
    TruncateNotDurable = FALSE
    RecoveredTailUnsynced = FALSE
    SaveCommittedUnflushed = FALSE
    PurgeBeforeSnapshot = FALSE
    SnapshotTwoRenames = FALSE
    CommitPriorTerm = FALSE
    DeliverUncommitted = FALSE
    SkipsNotCounted = FALSE
    MaxReads = 0
    AckWritten = FALSE
    NoRound = FALSE
    NoBlankBarrier = FALSE
    SkipsAnswered = FALSE
    MaxCommits = 0
    GroupAckOnWrite = FALSE
    CommitIgnoresTerm = FALSE

SYMMETRY Symm

INVARIANTS
    TypeOK
    SessionsTypeOK
    OneLeaderPerTerm
    LeaderCompleteness
    StateMachineSafety
    OffsetNeverReused
    NoLostDelivery
    NoStaleGroupCommit
