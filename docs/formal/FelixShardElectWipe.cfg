\* A follower loses its data directory, and with it its ballot and its set
\* (`LosePromises`, `Forget`), while replicas elect themselves and the
\* control plane adopts them (#1331). Without a guard the wiped replica
\* answers as if it had never promised, and TLC finds two leaders at one
\* generation: a promises generation 2 to b, which opens on {a, b}; a is
\* wiped; c stands at 2, a answers it, and c opens at 2 too
\* (OneLeaderPerGeneration).
\*
\* FelixShardElect.cfg's shard with no write, which the trace does not need,
\* the set check and adoption up to generation 2. With a write TLC can also
\* find the record lost first (AckedHeldByLeader).
\* The FelixShardElectWipeWaits*.cfg configurations add the
\* guard in its variants; docs/formal/README.md, "A wiped voter in an
\* election", lists them.
\*
\* Evidence: none yet, nothing in the code elects a leader.

SPECIFICATION Spec

CONSTANTS
    Brokers = {a, b, c}
    L = 4
    Margin = 0
    Eps = 0
    Drift = 0
    MaxTime = 0
    MaxWrites = 0
    CheckAtCommit = FALSE
    Quorum = TRUE
    Promotion = "log-order"
    ReportBeforeAck = FALSE
    Handoff = FALSE
    WaitForDrained = TRUE
    FenceAtClaim = TRUE
    AckOnAdmit = FALSE
    FenceFromAdmit = FALSE
    MaxMoves = 0
    Planners = {}
    CasWrites = TRUE
    StageMove = FALSE
    LearnerVotes = FALSE
    Resends = FALSE
    SequencesInLog = TRUE
    Cancel = FALSE
    CancelCas = TRUE
    ReportBound = "acknowledged"
    AckChecksLease = FALSE
    AckOnResponse = FALSE
    AckByFollowers = TRUE
    FenceOnPromote = TRUE
    LabelOnReceipt = FALSE
    StartRecord = TRUE
    ReportFromAnswers = FALSE
    ReportFloor = FALSE
    Spares = {}
    ReplaceOnPromote = FALSE
    SeatHoldsCopy = TRUE
    Grow = FALSE
    PromoteDestination = FALSE
    Counters = FALSE
    CounterCatchUp = FALSE
    Ballots = TRUE
    Elections = 2
    FenceEveryChange = FALSE

    Suspicions = 0
    SetCheck = TRUE
    JointFence = TRUE
    Adopt = 2
    AdoptMatch = TRUE
    Swaps = 0
    PreVote = FALSE
    Wipes = 0
    StorageIds = FALSE
    LosePromises <- Yes
SYMMETRY Symm

INVARIANTS
    TypeOK
    OneLeaderPerGeneration
    AckedHeldByLeader
    AckedAgree
    AckedOnMajority
    NoTruncationBelowHwm
    AdoptedMatchesOpened
    SetChangesJoint
