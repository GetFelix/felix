\* Purging a Raft stream shard below its head trim, every rule on: three
\* voters, four entries, two trims, one change of leader, one restart and one
\* re-form. A purge writes the stream snapshot at the purge point, below the
\* floor, with the floor and the tables as of that point; the leader purges
\* no further than its slowest member's match.
\*
\* Evidence: none, purging a Raft stream shard is not built yet (issue 2602).

SPECIFICATION Spec

CONSTANTS
    Members = {a, b, c}
    Voters = {a, b, c}
    MaxIndex = 4
    MaxTrims = 2
    MaxChanges = 1
    MaxRestarts = 1
    MaxReforms = 1
    PurgeBelowFloorRule = TRUE
    InstallRule = TRUE
    LeaderCaps = TRUE
    SnapAtApplied = FALSE
    TablesAtApplied = FALSE
    SnapFloorAtP = TRUE
    SnapCarriesHeaders = TRUE
    DropFirst = FALSE
    ReformReads = "full"
    ReformCarriesFloor = TRUE
    ReformStoresFloor = TRUE

SYMMETRY Symm

INVARIANTS
    TypeOK
    NoReadBelowFloor
    NoAckedLoss
    PurgeBelowFloor
    AppliedCoversPurge
    TablesAgree
    HeadersAgree
    OffsetNeverReused
    CatchUpPossible
