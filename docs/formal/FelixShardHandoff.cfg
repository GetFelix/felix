\* The design as implemented, with the control plane free to move the shard
\* off a live leader: fence, wait for the leader's drained report, cut over.
\* Synchronised clocks, since nothing about the handoff depends on drift.
\*
\* `WaitForDrained = FALSE` is the same design cutting over as soon as the
\* fence is written, in FelixShardHandoffNoWait.cfg, and it commits a write
\* at a superseded generation. `FenceAtClaim = FALSE`, with leader
\* acknowledgement, is FelixShardHandoffNoClaimFence.cfg.
\* Evidence: the implementation behaviours this configuration asserts.
\* `a_draining_assignment_stops_serving_and_stays_stopped` -- ObserveFence: a
\*   broker never serves a draining assignment, however often it is delivered.
\* `the_fence_is_open_only_while_active` -- ObserveFence closes the write
\*   fence, however the move arrives.
\* `a_durable_publish_claimed_after_the_fence_is_refused` -- FenceAtClaim: a
\*   write admitted before the fence and claimed after it is refused.
\* `a_shard_that_is_not_moving_is_dispatched_at_once` -- FenceFromAdmit: a
\*   local write is routed holding its place in the fence.
\* `a_write_that_meets_a_closed_fence_waits_for_the_new_routes` -- and one
\*   routed as the fence closes is held rather than admitted.
\* `a_draining_shard_reports_drained_once_its_fence_is_quiet` -- the drained
\*   report: sent only once the fence is closed with no claimed write inside.
\* `a_fenced_shard_waits_for_the_leader_to_report_drained` -- WaitForDrained:
\*   placement does not cut over on a report from before the fence, or on none.
\* `a_drained_report_cuts_over_to_the_successor` -- CutOver: the successor is
\*   named only from a drained report that lists it caught up.
\* `records_acknowledged_during_a_move_survive_it` -- AckedSurvive across a
\*   move, against a real cluster, with the old owner refusing to write
\*   locally once the successor is named.
\* Planners = {}: every decision reads and writes in one step, so CasWrites
\*   has nothing to compare. The StalePlanner and StalePromotion
\*   configurations are where a read is held across another write.

SPECIFICATION Spec

CONSTANTS
    Brokers = {a, b, c}
    L = 4
    Margin = 2
    Eps = 1
    Drift = 0
    MaxTime = 5
    MaxWrites = 1
    CheckAtCommit = TRUE
    Quorum = TRUE
    Promotion = "leader-report"
    ReportBeforeAck = TRUE
    Handoff = TRUE
    WaitForDrained = TRUE
    FenceAtClaim = TRUE
    AckOnAdmit = FALSE
    FenceFromAdmit = TRUE
    MaxMoves = 1
    Planners = {}
    CasWrites = TRUE
    StageMove = FALSE
    LearnerVotes = FALSE
    Resends = FALSE
    SequencesInLog = TRUE
    Cancel = FALSE
    CancelCas = TRUE
    ReportBound = "acknowledged"
    AckChecksLease = TRUE
    AckOnResponse = FALSE
    AckByFollowers = FALSE
    FenceOnPromote = FALSE
    LabelOnReceipt = FALSE
    StartRecord = FALSE

SYMMETRY Symm

INVARIANTS
    TypeOK
    AtMostOneServing
    AckedSurvive
    AckedAgree
    NoTruncationBelowHwm
    NoStaleCommit
    AckedOnMajority
