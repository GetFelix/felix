\* FelixRaftPlacementPlacedTarget without the client write: a placed transfer
\* racing a target change (AddLearner, then Change, two calls). The write
\* doubles a space that does not finish in a CI runner's six hours, so here
\* the ack invariants hold trivially and the membership ones carry the check.
\* FelixRaftPlacementReachPlacedTargetNoWrite shows the race is reached.
\*
\* Evidence: `a_placement_change_moves_the_leader`, which runs `placed_step` (crates/server/felix-replication/src/raft/group/placed.rs).

