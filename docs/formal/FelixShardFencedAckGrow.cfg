\* FelixShardFencedAckSeat.cfg with a set a failover left short of the
\* replication factor: two brokers hold the shard and a third is a spare
\* (`Spares = {c}`). `Grow` lets placement add the spare with nobody leaving,
\* as a restore does, and `Seat` makes it a member once it holds what a
\* majority of the set held. One move, so the spare either joins that way or
\* replaces a follower (`Reseat`), and a promotion of any replica afterwards
\* still fences a majority that holds every acknowledged record.
\*
\* Evidence: `a_set_short_of_the_factor_is_topped_up` and
\* `a_quorum_restore_waits_for_what_the_old_set_holds` (placement), and
\* `a_lost_follower_is_restored_even_when_its_first_replacement_dies` (the
\* cluster keeps every acknowledged record through a restore).

SPECIFICATION Spec

CONSTANTS
    Brokers = {a, b, c}
    L = 2
    Margin = 0
    Eps = 0
    Drift = 0
    MaxTime = 3
    MaxWrites = 1
    CheckAtCommit = FALSE
    Quorum = TRUE
    Promotion = "any"
    ReportBeforeAck = FALSE
    Handoff = FALSE
    WaitForDrained = TRUE
    FenceAtClaim = TRUE
    AckOnAdmit = FALSE
    FenceFromAdmit = FALSE
    MaxMoves = 1
    Planners = {}
    CasWrites = TRUE
    StageMove = FALSE
    LearnerVotes = FALSE
    Resends = FALSE
    SequencesInLog = TRUE
    Cancel = FALSE
    CancelCas = TRUE
    ReportBound = "acknowledged"
    AckChecksLease = FALSE
    AckOnResponse = FALSE
    AckByFollowers = TRUE
    FenceOnPromote = TRUE
    LabelOnReceipt = FALSE
    StartRecord = FALSE
    Spares = {c}
    ReplaceOnPromote = FALSE
    SeatHoldsCopy = TRUE
    Grow = TRUE
    PromoteDestination = FALSE

SYMMETRY Symm

INVARIANTS
    TypeOK
    AckedHeldByLeader
    AckedAgree
    AckedOnMajority
    NoTruncationBelowHwm
