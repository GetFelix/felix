\* A follower that took the successor's fence loses its data directory, and
\* with it the promise (#1267). FelixShardSuspicion.cfg with one write and
\* `LosePromises`: the old leader, deposed on suspicion and still serving,
\* ships its write to the wiped follower, which no longer refuses it, and
\* acknowledges it on the two of them. The successor opened without it.
\*
\* Without the wipe FelixShardSuspicion.cfg passes, so the violation runs
\* through `Forget`. FelixShardSuspicionWipeRoutes.cfg is the fix.
\*
\* Evidence: none, this models the broker before the fix, which answered a
\* fence for a shard its routing view did not have yet whatever its directory.

SPECIFICATION Spec

CONSTANTS
    Brokers = {a, b, c}
    L = 4
    Margin = 0
    Eps = 0
    Drift = 0
    MaxTime = 0
    MaxWrites = 1
    CheckAtCommit = FALSE
    Quorum = TRUE
    Promotion = "leader-report"
    ReportBeforeAck = FALSE
    Handoff = FALSE
    WaitForDrained = TRUE
    FenceAtClaim = TRUE
    AckOnAdmit = FALSE
    FenceFromAdmit = FALSE
    MaxMoves = 0
    Planners = {}
    CasWrites = TRUE
    StageMove = FALSE
    LearnerVotes = FALSE
    Resends = FALSE
    SequencesInLog = TRUE
    Cancel = FALSE
    CancelCas = TRUE
    ReportBound = "acknowledged"
    AckChecksLease = FALSE
    AckOnResponse = FALSE
    AckByFollowers = TRUE
    FenceOnPromote = TRUE
    LabelOnReceipt = FALSE
    StartRecord = TRUE
    ReportFromAnswers = FALSE
    ReportFloor = FALSE
    Spares = {}
    ReplaceOnPromote = FALSE
    SeatHoldsCopy = TRUE
    Grow = FALSE
    PromoteDestination = FALSE
    Counters = FALSE
    CounterCatchUp = FALSE
    Ballots = TRUE
    Elections = 0
    FenceEveryChange = TRUE

    Suspicions = 1
    SetCheck = FALSE
    JointFence = FALSE
    Adopt = 0
    AdoptMatch = TRUE
    Swaps = 0
    PreVote = FALSE
    Wipes = 0
    StorageIds = FALSE
    LosePromises <- Yes
SYMMETRY Symm

INVARIANTS
    TypeOK
    OneLeaderPerGeneration
    AckedHeldByLeader
    AckedAgree
    AckedOnMajority
    NoTruncationBelowHwm
