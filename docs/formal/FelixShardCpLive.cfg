\* Liveness with the control plane up (`CpLiveSpec`, #1917): three brokers,
\* no writes, no symmetry (unsound for liveness). A standing may be withdrawn
\* and keeps its ballot (`Withdraws`), placement may name a leader below a
\* ballot and renames it on the refusal (`Renames`, #1916, with
\* `OwnBallotRefused`, #1919, and `AboveReported` with a rename past the
\* ballot the leader lost to, `RenamePastBallot`, #1951), and one broker at a
\* time may stop and come back with what it persisted (`Restarts`). The
\* leader the control plane names ends up serving (`CpLeaderServes`). A
\* restarted adopted leader whose log keeps its set two generations back
\* learns the set before from its snapshot (#1989, #2024). That liveness
\* assumes the control plane's change log still holds the change before the
\* restarted leader's assignment (`PriorMayBeUnknown` off); once it is
\* evicted, the fence waits as #1989 describes.
\* Not registered: a 5 h run timed out at 40M distinct states with no violation.
\* FelixShardCpLiveSkippedGeneration.cfg checks the #2024 part in a smaller bound,
\* and its UnknownPrior twin shows that check can fail.
\* Evidence: the #2024 part is driven by `a_rename_past_a_ballot_takes_the_set_before_from_the_watch` (promotion/tests/joint.rs); the other fixes it turns on are proposals from #1914 and #1951 that no test drives a shard through.

