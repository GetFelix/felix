\* FelixRaftReformReplacedDisk.cfg with the disk lost outright, so the
\* reservation goes with it (LostReserve), and one term. A commits x at
\* offset 1 with b, A's disk is lost, b is declared dead, and the re-form
\* reads A's empty copy and C, which never counted x: the group is marked,
\* the base is empty and no reservation read covers offset 1, so epoch 1
\* gives it to another record. Every copy that counted x is gone, the
\* residual docs/per-shard-raft.md ("Keeping the re-form floor") documents.
\* Violates OffsetNeverReused.
\*
\* Evidence: none, this models the documented loss for #2250.

