\* Hydrate, redrive and seek decide from the applied table without waiting
\* for the leader's own entries in flight: a seek's tracker misses a redrive
\* the leader proposed just before it.
\*
\* Evidence: none, Raft shards refuse group operations until the design this
\* models is built (#2446).

SPECIFICATION Spec

CONSTANTS
    Members = {a, b}
    N = 2
    SeekTo = {1, 3}
    MaxChanges = 1
    MaxLog = 4
    CreationCheck = TRUE
    DeleteWatermark = TRUE
    IfNewChecksTracker = TRUE
    TermBoundTrackers = TRUE
    HydrateFromApplied = TRUE
    WaitOwnProposals = FALSE
    StaleByHyd = FALSE
    RefreshOnDrop = TRUE
    DeadBeforeAdvance = TRUE
    KeepRedriven = TRUE

SYMMETRY Symm

INVARIANTS
    RedrivenOwed
