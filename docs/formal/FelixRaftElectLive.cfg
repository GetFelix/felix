\* Election liveness (temporal, no symmetry): three voters, one fault (a
\* crash or a cut, of the leader or not, with or without a restart or heal
\* after it), one timeout while a round is open, five terms. Once a majority
\* stays up and connected, a leader among them is elected and stays
\* (ElectionSettles), and opens with every one of them following it
\* (EventuallyServes).
\*
\* Evidence: the rules are openraft's config in felix-replication's
\* raft/runtime.rs (`enable_pre_vote`, `enable_leader_restore`) and the
\* per-member jitter in raft/group.rs. The felix-replication raft tests
\*   `members_told_together_elect_one_leader`,
\*   `a_leader_that_loses_its_appends_does_not_stall_the_next_election`,
\*   `a_pre_vote_refusal_names_its_vote_uncommitted`
\* exercise them; none checks the bound on splits, which is an assumption.

SPECIFICATION LiveSpec

CONSTANTS
    Servers = {a, b, c}
    Nobody = Nobody
    MaxTerm = 5
    MaxFaults = 1
    Splits = 1
    Staggered = TRUE

INVARIANTS
    TypeOK
    OneLeaderPerTerm

PROPERTIES
    ElectionSettles
    EventuallyServes
