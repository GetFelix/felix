\* FelixShardElectAdopt.cfg taken to a failover after a recorded-only
\* adoption: replicas stand up to generation 3 (`Adopt = 3`, `Elections = 2`)
\* and placement promotes on suspicion up to generation 4 (`Suspicions = 4`).
\* The control plane can then take an elected leader's generation without its
\* set, so its recorded set and the set in the promoted broker's log differ,
\* and a failover's fence takes a majority of the new set, of the recorded set
\* and of the log's set (`FenceRecordedSet` beside `FenceOwnSet`).
\* FelixShardElectAdoptFailover{OwnSet,RecordedSet}.cfg fence one of the two.
\* (not yet measured)
\*
\* Evidence: `set_before` in promotion/joint.rs (#1806); the failover case
\* is not built yet.

SPECIFICATION Spec

CONSTANTS
    FenceRecordedSet <- Yes
    Brokers = {a, b, c, d}
    L = 2
    Margin = 0
    Eps = 0
    Drift = 0
    MaxTime = 0
    MaxWrites = 1
    CheckAtCommit = FALSE
    Quorum = TRUE
    Promotion = "any"
    ReportBeforeAck = FALSE
    Handoff = FALSE
    WaitForDrained = TRUE
    FenceAtClaim = TRUE
    AckOnAdmit = FALSE
    FenceFromAdmit = FALSE
    MaxMoves = 1
    Planners = {}
    CasWrites = TRUE
    StageMove = FALSE
    LearnerVotes = FALSE
    Resends = FALSE
    SequencesInLog = TRUE
    Cancel = FALSE
    CancelCas = TRUE
    ReportBound = "acknowledged"
    AckChecksLease = FALSE
    AckOnResponse = FALSE
    AckByFollowers = TRUE
    FenceOnPromote = TRUE
    LabelOnReceipt = FALSE
    StartRecord = TRUE
    ReportFromAnswers = FALSE
    ReportFloor = FALSE
    Spares = {d}
    ReplaceOnPromote = FALSE
    SeatHoldsCopy = TRUE
    Grow = FALSE
    PromoteDestination = FALSE
    Counters = FALSE
    CounterCatchUp = FALSE
    Ballots = TRUE
    Elections = 2
    FenceEveryChange = FALSE

    Suspicions = 4
    SetCheck = TRUE
    JointFence = TRUE
    Adopt = 3
    AdoptMatch = TRUE
    Swaps = 0
    PreVote = FALSE
    Wipes = 0
    StorageIds = FALSE
SYMMETRY Symm

INVARIANTS
    TypeOK
    OneLeaderPerGeneration
    AckedHeldByLeader
    AckedAgree
    AckedOnMajority
    NoTruncationBelowHwm
    AdoptedMatchesOpened
    SetChangesJoint
