\* FelixShardElectAdopt.cfg taken to a failover after a recorded-only
\* adoption: replicas stand up to generation 2 (`Adopt = 2`, `Elections = 1`)
\* and placement promotes on suspicion up to generation 3 (`Suspicions = 3`).
\* The control plane can then take an elected leader's generation without its
\* set, so its recorded set and the set in the promoted broker's log differ,
\* and a failover's fence takes a majority of the new set, of the recorded set
\* and of the log's set (`FenceRecordedSet` beside `FenceOwnSet`).
\* Not registered: it did not finish in six hours (192.5M distinct states at
\* depth 20, 85.8M queued, no violation). It is checked in pieces split at
\* the first failover, FelixShardElectAdoptFailover{Same,Apart}{0,1}{,Stood}Gen{2,3,4}.cfg.
\* A first failover takes generation 2 or later (the model starts at 1), and
\* the Gen4 pieces take 4 and everything above it.
\*
\* Evidence: `a_failover_fences_both_the_recorded_set_and_the_logs` and
\*   `a_log_set_naming_another_copy_is_fenced_beside_the_one_before`
\*   (crates/server/felix-replication/src/promotion/tests/joint.rs).

