\* FelixShardElectRenameDrop1StoodOneOther.cfg with the control plane renaming on the
\* refusal its stored report carries (`ReportStore`, `RefusalRepeats`), which
\* can outlast the state that caused it. Checks the same invariants.
\*
\* Evidence: `a_refusal_is_carried_until_a_later_generation`
\*   (crates/server/felix-replication/src/reporter/tests.rs) -- the reporter
\*   repeats the refusal; `supersedes` in
\*   services/felix-controlplane-service/src/model/shard.rs -- the store keeps
\*   the last report at a generation.

SPECIFICATION Spec

CONSTANTS
    Brokers = {a, b, c, d}
    L = 2
    Margin = 0
    Eps = 0
    Drift = 0
    MaxTime = 0
    MaxWrites = 1
    CheckAtCommit = FALSE
    Quorum = TRUE
    Promotion = "any"
    ReportBeforeAck = FALSE
    Handoff = FALSE
    WaitForDrained = TRUE
    FenceAtClaim = TRUE
    AckOnAdmit = FALSE
    FenceFromAdmit = FALSE
    MaxMoves = 0
    Planners = {}
    CasWrites = TRUE
    StageMove = FALSE
    LearnerVotes = FALSE
    Resends = FALSE
    SequencesInLog = TRUE
    Cancel = FALSE
    CancelCas = TRUE
    ReportBound = "acknowledged"
    AckChecksLease = FALSE
    AckOnResponse = FALSE
    AckByFollowers = TRUE
    FenceOnPromote = TRUE
    LabelOnReceipt = FALSE
    StartRecord = TRUE
    ReportFromAnswers = FALSE
    ReportFloor = FALSE
    Spares = {d}
    ReplaceOnPromote = FALSE
    SeatHoldsCopy = TRUE
    Grow = FALSE
    PromoteDestination = FALSE
    Counters = FALSE
    CounterCatchUp = FALSE
    Ballots = TRUE
    Elections = 1
    FenceEveryChange = TRUE

    Suspicions = 0
    SetCheck = TRUE
    JointFence = TRUE
    Adopt = 3
    AdoptMatch = TRUE
    Swaps = 1
    PreVote = FALSE
    Wipes = 0
    StorageIds = FALSE
    Renames <- Yes
    SplitAtCutOver <- Yes
    PieceKeeps <- No
    PieceWrites <- One
    PieceStood <- Yes
    PieceStoodCounts <- OneStood
    PieceDestStood <- JustNo
    ReportStore <- Yes
SYMMETRY Symm
VIEW QuietView
CONSTRAINT CutOverPiece

INVARIANTS
    TypeOK
    OneLeaderPerGeneration
    AckedHeldByLeader
    AckedAgree
    AckedOnMajority
    NoTruncationBelowHwm
    AdoptedMatchesOpened
    SetChangesJoint
