\* FelixShardElectRefusals.cfg with a rename dropping the pins
\* (`PinsKeptOnRename` off), as the code did. TLC finds a lost record: one
\* write acknowledged on a and b; b stands and withdraws, then its copy
\* changes and loses the write; placement fails over to c, whose pins leave
\* b's new copy out. b's promise away and a's silence get c's fence refused,
\* the rename drops the pins, and c opens at 3 on b's empty copy. Keeping
\* the other-copies exclusion does not help: no other copy has answered yet
\* when the refusal is reported.
\* Evidence: none, the twin of FelixShardElectRefusals.cfg.

