\* The read bound stops before an unfinished batch, but a kept piece below
\* it is read whether or not its batch's last piece is there. Once a change
\* of leader commits a cut batch and its blank, the bound passes the cut and
\* readers see it.
\*
\* Evidence: none, this models half of the rule.

SPECIFICATION Spec

CONSTANTS
    Servers = {a, b, c}
    Nobody = Nobody
    MaxTerm = 2
    MaxLog = 5
    MaxPlain = 0
    MaxMembers = 0
    Expected <- TwoAtTwo
    CondLen <- BatchLens
    LeaderDecides = FALSE
    Hide = "bound"

SYMMETRY Symm

INVARIANTS
    WholeBatchesOnly
