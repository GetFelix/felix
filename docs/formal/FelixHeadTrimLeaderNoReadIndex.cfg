\* FelixHeadTrim.cfg with a leader serving a read that could start below a
\* floor from its own state, without a read-index round. A leader cut off
\* from the others still leads in its own view; a successor elected without
\* it trims, and the trim is acknowledged; the deposed leader then serves a
\* resume from below the floor. This is why a leader runs a read-index
\* round first (issue 2603).
\*
\* Evidence: none, this models an alternative the design does not use.

SPECIFICATION Spec

CONSTANTS
    Brokers = {a, b, c}
    MaxWrites = 2
    MaxTrims = 3
    MaxGen = 2
    MaxCrashes = 0
    Local = FALSE
    FloorFromBase = FALSE
    ApplyOnStore = FALSE
    DeleteAboveCommit = FALSE
    Unconditional = FALSE
    Untagged = FALSE
    NoOpUnchecked = FALSE
    Retention = FALSE
    FollowerNoReadIndex = FALSE
    LeaderNoReadIndex = TRUE
    TailNoReadIndex = FALSE

SYMMETRY Symm

INVARIANTS
    NoReadBelowAckedTrim
    NothingLostAboveFloor
    NeverMoreThanAsked
    StaleTrimRefused
