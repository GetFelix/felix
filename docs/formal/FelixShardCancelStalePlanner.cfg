\* FelixShardCancelStalePlannerCas.cfg with the cancel written whatever the
\* shard's generation is now; every other write is still conditional. A
\* cancel read while the move was fenced lands after the cut-over and hands
\* the shard back to the old leader while the new one still serves.
\*
\* Expected to violate AtMostOneServing.
\* Evidence: none, this models a cancel without the conditional write the
\* implementation makes.

