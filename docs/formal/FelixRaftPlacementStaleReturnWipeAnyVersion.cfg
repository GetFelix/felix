\* FelixRaftPlacementStaleReturnWipe.cfg with DoomAnyVersion: the doom looks
\* only at the committed membership. A leader on the target that placed the
\* copy back gives it its vote again, and the deletion takes a copy that holds
\* an acknowledged write.
\*
\* Evidence: none, this models an alternative the implementation does not use.

