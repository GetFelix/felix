\* FelixShardElectStaleSet.cfg with the set check: a fence and a batch carry
\* the generation of the set they count, a replica that knows a newer set
\* refuses them and says which, and a set change fences a majority of the
\* new set before it serves (`SetCheck`). The replica that left
\* stands on the set it started in and is refused by the follower that took
\* the change's fence, learns the set it is no longer in, and stops
\* standing. Every acknowledged record survives every election, and one
\* leader opens per generation.
\*
\* Also checks AdoptedMatchesOpened, which holds trivially here: the control
\* plane adopts nothing (`Adopt = 0`). FelixShardElectAdopt.cfg turns it on.
\* No joint fence: a set changes one replica at a time, so majorities of
\* consecutive sets meet. 235.7M distinct states, 3 h 27 min on a four-core
\* CI runner, so it runs nightly. With `JointFence = TRUE`, which also asks
\* a majority of the old set, it passes too (146.6M states, 2 h 44 min).
\*
\* Evidence: none yet, nothing in the code elects a leader.

