\* FelixRaftLeaseStepDown.cfg with two terms, two step-downs and one write,
\* so the write properties and the vote's log check have something to say.
\* Lease and election timeout of 1 tick, no drift, so the run finishes; a
\* lease that spans ticks is in the configs without this dimension.
\*
\* Evidence: none, `admit_local_ack` always refuses until issue 2249 builds this rule.

