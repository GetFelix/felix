\* FelixRaftPlacementDirectTerms.cfg with NoBarrier: a leader proposes a
\* membership before its blank entry commits. a appends {a, b, c} on itself
\* only, c is elected and commits {b, c, d} on c and d, then a wins term 3
\* with b and overwrites a committed entry.
\*
\* Evidence: none, this models an alternative the implementation does not use.

