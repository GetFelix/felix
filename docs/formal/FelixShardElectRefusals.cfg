\* The refusal rules adopted for #2046, for safety. Three brokers, one write,
\* elections to generation 2 with no pre-vote, one failover on the
\* followers' word (`Suspicions = 1`, `Promotion = "any"`), and one copy
\* that changes, losing what it had not synced (`CopyPins`, `ChangeCopy`).
\* The failover's pins name the copies placement admitted; a rename keeps
\* them (`PinsKeptOnRename`) until the leader's first fenced open
\* (`PinsDropAtOpen`), and a copy's pin drops once it is admitted again
\* (`PinsDropOnAdmit`). A fence with one promise away and the rest silent is
\* refused even when another copy answered (`OtherCopiesExcluded` off). A
\* refusal for a lost set or a member ahead carries the ballot and placement
\* renames above it; candidates stand above the control plane's generation.
\* Twin: FelixShardElectRefusalsPinsCleared.cfg.
\* Evidence: `a_refusal_rename_keeps_the_pins_until_the_leader_opens` and
\*   `an_admitted_member_loses_its_pin`
\*   (services/felix-controlplane-service/src/cluster/placement/tests/copy_pins.rs);
\*   `a_promise_away_beside_a_pinned_out_copy_is_refused`
\*   (crates/server/felix-replication/src/promotion/tests/identity.rs);
\*   `a_set_unknown_carries_the_newest_ballot_past_the_generation`
\*   (crates/server/felix-replication/src/promotion/tests/joint.rs);
\*   `a_replica_ahead_has_the_fence_refused_with_its_ballot`
\*   (crates/server/felix-replication/src/promotion/tests.rs);
\*   `a_candidate_stands_above_a_ballot_a_withdrawn_standing_left`
\*   (crates/server/felix-replication/src/election/candidate/tests.rs).

