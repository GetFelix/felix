\* FelixShardProcessCrashKeepsId.cfg without the sync on the keep path
\* (`SyncOnKeep` off). The follower answers for a record, its process is
\* killed, and it starts again under the same identity with the record only
\* in the page cache. It then stops cleanly, which records a clean stop
\* without syncing what the crashed process wrote, and the power goes while
\* it is down. The next start finds a clean stop and keeps the identity,
\* and placement promotes it without the record.
\*
\* Expected to violate AckedSurvive. TLC stops at the first counterexample.
\*
\* Evidence: this configuration REMOVES the sync.
\* `keeping_the_id_after_a_crash_syncs_the_filesystem_first` -- drop
\*   `synced_after_crash` from `run_state::begin` and the keep path no
\*   longer syncs, which is the trace TLC finds.
\* AckedOnLiveMajority is left out, as in FelixShardCrashKeepsId.cfg.

