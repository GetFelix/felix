\* The metadata group's rule for a lost volume
\* (docs/metadata-raft-design.md, "Rejoining after a lost volume"), with the
\* rule issue 2365 adds: the member keeps its id, withholds its vote,
\* is not counted by any leader while it does, and votes again once it has
\* applied up to an index a confirmed leader gave it. Three members, three
\* terms, one write, one wipe.
\*
\* Evidence: none, the rule that no leader counts a withheld member is not built yet (issue 2365).

