\* The metadata group's rule for a lost volume
\* (docs/metadata-raft-design.md, "Rejoining after a lost volume"): the
\* member keeps its id and withholds its vote, answers no leader until every
\* other member has given its term, and then only a leader at or above the
\* highest; it votes again once it has applied up to an index a confirmed
\* leader gave it. Leaders count what it answers. Three members, three
\* terms, one write, one wipe.
\*
\* Evidence: `a_wiped_member_is_counted_by_no_leader_until_every_peer_reports_its_term`
\*   -- the wiped member answers no leader before every peer gives its term, and none
\*   below the highest. `the_floor_waits_for_every_member_and_takes_the_highest_term`
\*   -- the floor is the highest term, and a member that gives none leaves it unknown.

