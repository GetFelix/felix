\* Two control-plane instances failing a shard over at once, writing
\* unconditionally.
\*
\* Expected to violate AtMostOneServing. Both read the leader lapsed and the
\* same report listing both followers caught up. One promotes a follower; the
\* other, from its older read, promotes the other follower while the first
\* one's fresh lease is live.
\* Evidence: this configuration REMOVES a comparison the implementation has,
\* so the citation is what proves the comparison is there to remove.
\* `a_promotion_planned_from_an_old_read_is_not_written_later` -- placement
\*   writes every promotion conditional on the generation it planned from.

