\* A wiped follower re-admitted as a learner, its leader crashing and giving
\* its copy up (FelixShardFencedLeaderCrash.cfg with the reclaim and
\* FelixShardElectWipeNonVoter.cfg's re-admission, no elections). Placement
\* stops holding the learner only on a report from that generation's leader
\* (`AdmitOnReport`), and the given-up leader's probe names the followers
\* that hold the generation's start record (`ProbeHoldsStart`). The probe
\* may then promote the learner (ByProbe), and TLC finds no acknowledged
\* record lost. Liveness is FelixShardElectWipeNonVoterReclaimLive.cfg.
\*
\* Evidence: the implementation behaviours this configuration asserts.
\* `the_probe_names_a_follower_holding_the_generation_it_gave_up` --
\*   `holds_start` in the given-up report.
\* `a_follower_behind_the_generation_on_one_log_is_not_named_holding_it` --
\*   every log of the shard.
\* `a_given_up_leaders_probe_admits_a_learner_holding_the_start` (placement
\*   tests/readmit.rs) -- CpAdmit on the probe's report, then ByProbe.
\*
\* What it does not check: `CpAdmit` reads the copy's log for the start
\* record, not the probe's fence answers, so the rule that turns those into
\* `holds_start` (last generation, every log, no learner attestation) is
\* pinned by the unit tests above, not here. There is no counter log
\* (`Counters` needs no wipes) and no election, so neither the counter half
\* of the rule nor an elected stint's second start record is covered. Nor
\* is a fleet that may elect, where a re-admitted copy attests no kept
\* promise and the probe leaves it out, which stalls as before.
\*
\* One write, one wipe, one leader crash. The crash comes after the wipe,
\* once the wiped copy votes again: earlier the two are two lost copies,
\* past the failure budget.

