\* FelixShardElectSwap.cfg without the joint configuration: the cut-over
\* fences, ships and acknowledges on a majority of the new set alone. A replica of the old set that never heard of the new one
\* stands at the new leader's generation and fences a majority of the old
\* set, which the new leader's fence never reached. Both open, the elected
\* one acknowledges on the old set, and the new leader does not hold that
\* record (AckedHeldByLeader). This is why a set change under self-election fences
\* jointly.
\*
\* Evidence: none yet, nothing in the code elects a leader.

