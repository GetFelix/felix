\* FelixRaftIdentityRootRestore.cfg, and the backup may be from the run the
\* restore interrupts. The design says the gate catches a whole-root restore
\* whatever its age. A backup taken in the current run carries the current
\* incarnation and run token, and the marks go back with the root.
\*
\* Evidence: none, copy ids are not built yet (issue 1331).

