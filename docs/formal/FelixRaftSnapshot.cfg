\* FelixRaft.cfg with a snapshot: a broker stores one, purges its log up to
\* it, and a leader that purged brings a follower up by snapshot in three
\* writes, with the crash between any two. No subscriber.
\*
\* Evidence: the raft_log adapter tests in felix-storage:
\*   `a_purge_stays_within_the_stored_snapshot`,
\*   `a_cut_at_each_step_of_a_purge_opens`,
\*   `a_received_snapshot_becomes_the_stored_one`.

SPECIFICATION Spec

CONSTANTS
    Servers = {a, b, c}
    Nobody = Nobody
    MaxTerm = 2
    MaxWrites = 1
    MaxMembers = 0
    MaxCrashes = 1
    MaxSnapshots = 1
    Consumer = FALSE
    AckBeforeFlush = FALSE
    VoteNotDurable = FALSE
    LeaderResumes = FALSE
    TornTailKept = FALSE
    TruncateNotDurable = FALSE
    RecoveredTailUnsynced = FALSE
    SaveCommittedUnflushed = FALSE
    PurgeBeforeSnapshot = FALSE
    SnapshotTwoRenames = FALSE
    CommitPriorTerm = FALSE
    DeliverUncommitted = FALSE
    SkipsNotCounted = FALSE

SYMMETRY Symm

INVARIANTS
    TypeOK
    OneLeaderPerTerm
    LogMatching
    TermsMonotone
    LeaderCompleteness
    StateMachineSafety
    AppliedAgree
    AppliedInLog
    AckedSurvive
    PurgedCoveredBySnapshot
    OffsetsDense
    OffsetNeverReused
    DeliveredInOrder
    QuiescentServed

PROPERTIES
    VoteNeverLowers
