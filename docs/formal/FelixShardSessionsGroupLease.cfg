\* FelixShardSessionsGroupRound.cfg with the lease in place of the round,
\* which is how group state is gated on the lease path. With no margin and a slow
\* clock, the deposed coordinator's lease is still good by its own clock
\* after its successor opened (NoStaleGroupCommit): the lease is only as
\* safe as the clocks and margins.
\*
\* Evidence: none. A test cannot make two brokers' clocks drift past the
\* margin on demand; `a_fast_broker_clock_lapses_its_lease_until_healed`
\* covers the lease's own clock checks.

SPECIFICATION SessionsSpec

CONSTANTS
    Brokers = {a, b, c}
    L = 2
    Margin = 0
    Eps = 0
    Drift = 1
    MaxTime = 2
    MaxWrites = 1
    CheckAtCommit = FALSE
    Quorum = TRUE
    Promotion = "log-order"
    ReportBeforeAck = FALSE
    Handoff = FALSE
    WaitForDrained = TRUE
    FenceAtClaim = TRUE
    AckOnAdmit = FALSE
    FenceFromAdmit = FALSE
    MaxMoves = 0
    Planners = {}
    CasWrites = TRUE
    StageMove = FALSE
    LearnerVotes = FALSE
    Resends = FALSE
    SequencesInLog = TRUE
    Cancel = FALSE
    CancelCas = TRUE
    ReportBound = "acknowledged"
    AckChecksLease = FALSE
    AckOnResponse = FALSE
    AckByFollowers = TRUE
    FenceOnPromote = TRUE
    LabelOnReceipt = FALSE
    StartRecord = TRUE
    Spares = {}
    ReplaceOnPromote = FALSE
    SeatHoldsCopy = TRUE
    PromoteDestination = FALSE
    Grow = FALSE
    ReadConfirm = "lease"
    MaxReads = 0
    DeliverTo = "none"
    MaxCommits = 1

SYMMETRY Symm

INVARIANTS
    SessionsTypeOK
    NoStaleGroupCommit
