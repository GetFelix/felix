\* Replication factor 1 moving between brokers, across a re-form. A one-broker
\* set forms alone, so only the hold keeps a move from forming a second one,
\* and a formed one-broker set is never moved: there is no member to keep.
\* Passes.
\* Evidence: `a_set_holds_until_its_group_forms`,
\* `a_reform_holds_the_new_epochs_first_target` and
\* `a_raft_member_set_keeps_an_internal_node_when_no_replacement_exists`.
CONSTANTS
    Brokers = {1, 2}
    Sets = {{1}, {2}}
    Hold = TRUE
    PerEpoch = TRUE
    MaxEpoch = 1
INIT Init
NEXT Next
INVARIANTS TypeOK OneGroup OneFirstSet
