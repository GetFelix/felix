\* A cancel decided from a read one instance took while the move was fenced,
\* while placement goes on to cut the move over. Every write, the cancel's
\* included, lands only at the generation its read saw, so the late cancel
\* writes nothing and the shard stays with its new leader.
\* Time stops short of any lease lapse, as in FelixShardCancel.cfg.
\*
\* `CancelCas = FALSE`, in FelixShardCancelStalePlanner.cfg, writes the
\* cancel unconditionally, and it serves the shard on two brokers.
\* Evidence: the implementation behaviours this configuration asserts.
\* `a_cancel_decided_before_a_cut_over_is_not_written_after_it` -- the stale
\*   cancel writes nothing, and decided again there is nothing to cancel.
\* `a_fence_planned_before_a_cut_over_is_refused_after_it` -- every store
\*   backend refuses a write planned from an older generation.

SPECIFICATION Spec

CONSTANTS
    Brokers = {a, b, c}
    L = 4
    Margin = 2
    Eps = 1
    Drift = 0
    MaxTime = 2
    MaxWrites = 1
    CheckAtCommit = TRUE
    Quorum = FALSE
    Promotion = "leader-report"
    ReportBeforeAck = TRUE
    Handoff = TRUE
    WaitForDrained = TRUE
    FenceAtClaim = TRUE
    AckOnAdmit = TRUE
    FenceFromAdmit = TRUE
    MaxMoves = 1
    Planners = {p1}
    CasWrites = TRUE
    StageMove = FALSE
    LearnerVotes = FALSE
    Cancel = TRUE
    CancelCas = TRUE
    ReportBound = "acknowledged"
    AckChecksLease = TRUE
    AckOnResponse = FALSE
    AckByFollowers = FALSE
    FenceOnPromote = FALSE
    Resends = FALSE
    SequencesInLog = TRUE

SYMMETRY Symm

INVARIANTS
    TypeOK
    AtMostOneServing
    AckedSurvive
    AckedAgree
    NoTruncationBelowHwm
    NoStaleCommit
    AckedOnMajority
