\* A one-copy shard (replication factor 1) with a move's destination staged as
\* a second copy, and the fence timeout's retake dropping it. TLC finds a
\* record gone (AckedHeldByLeader), and FelixShardMoveGiveUpTwoKeep.cfg finds
\* the same with the destination kept: once the trim takes the set back to
\* one copy, an unclean crash of that copy loses what it lost. A factor of 1
\* keeps one copy, so keeping the destination would buy nothing.
\*
\* Evidence: none, this models the factor's limit, not a rule.

SPECIFICATION Spec

CONSTANTS
    Nodes = {a, b}
    First = a
    NoNode = NoNode
    MaxGen = 5
    MaxWrites = 2
    MaxCrashes = 1
    MaxMoves = 1
    Replication <- One
    DropsDestination <- Yes

INVARIANTS
    OneLeaderPerGeneration
    AckedHeldByLeader
    AtMostOneServing

CHECK_DEADLOCK FALSE
