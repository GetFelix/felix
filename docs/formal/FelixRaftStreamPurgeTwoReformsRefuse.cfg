\* TwoReforms.cfg with the install refusing a snapshot that carries a floor below the
\* member's own (InstallFloor = "refuse"). Safety only: CatchUpPossible is
\* left out because the refusal breaks it (InstallRefusesLowerFloor.cfg).
\*
\* Every rule on with a learner and two re-forms: the floor a re-form
\* carries into a copy is read by the next one. Three entries, one restart.
\*
\* Evidence: none, purging a Raft stream shard is not built yet (issue 2602).

SPECIFICATION Spec

CONSTANTS
    Members = {a, b, c, d}
    Voters = {a, b, c}
    MaxIndex = 3
    MaxTrims = 2
    MaxChanges = 0
    MaxRestarts = 1
    MaxReforms = 2
    PurgeBelowFloorRule = TRUE
    InstallRule = TRUE
    InstallFloor = "refuse"
    LeaderCaps = FALSE
    SnapAtApplied = FALSE
    TablesAtApplied = FALSE
    SnapFloorAtP = TRUE
    SnapCarriesHeaders = TRUE
    DropFirst = FALSE
    ReformReads = "full"
    ReformCarriesFloor = TRUE
    ReformStoresFloor = TRUE

SYMMETRY Symm

INVARIANTS
    TypeOK
    NoReadBelowFloor
    NoAckedLoss
    PurgeBelowFloor
    AppliedCoversPurge
    TablesAgree
    HeadersAgree
    OffsetNeverReused
