\* A generation claimed twice, sized for every pull request:
\* FelixShardElectAdoptPromote.cfg, with promotion on suspicion up to
\* generation 1 (a second adds no states), and the control plane moving past a
\* generation it named one leader at while another was elected and opened
\* there (`Reissues`, CpReissue). Placement promotes on the followers' word
\* while a candidate stands for the same generation, so the two collide; the
\* elected leader is then named at the next generation and fences there.
\* One leader opens per generation with every acknowledged record kept.
\*
\* Evidence: the control plane's half (CpReissue):
\*   `an_elected_leader_reporting_a_collided_generation_moves_the_shard_on`
\*   -- the elected leader's report moves the shard to the next generation
\*   under it, on the control plane's set;
\*   `a_collision_is_left_alone_when_the_elected_leader_is_outside_the_set`
\*   -- only a member of the control plane's set is named. The broker's half:
\*   `under_joint_fence_the_next_generation_is_refused_by_a_replica_that_promised_it`
\*   -- under `joint_fence` the next generation of a shard a broker serves is
\*   fenced; `a_generation_promised_to_another_node_is_not_led` -- a leader
\*   named from an old report does not take a generation it promised away.

SPECIFICATION Spec

