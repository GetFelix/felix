\* FelixShardMoveGiveUpKeep.cfg for liveness: one write, and the unclean
\* crash only while the move from the set of three is fenced
\* (`CrashesInMove`), since in a set of two a leader's unclean crash stalls
\* the shard whatever the move rule.
\*
\* TLC finds the move ending with the leader placement names serving, and
\* the copy kept above the factor trimmed away, as well as the safety
\* properties.
\*
\* A run can stop at the bound on generations with nobody able to act;
\* deadlock is not checked, and a stop before the bound fails the liveness
\* properties instead.
\*
\* Evidence: the implementation behaviours this configuration asserts.
\* `an_abandoned_fence_keeps_the_staged_destination` -- CpTimeout keeps it.
\* `a_set_kept_above_its_factor_is_trimmed` -- CpTrimFence and CpTrim.

SPECIFICATION LiveSpec

CONSTANTS
    Nodes = {a, b, c}
    First = a
    NoNode = NoNode
    MaxGen = 7
    MaxWrites = 1
    MaxCrashes = 1
    MaxMoves = 1
    Replication <- Two
    CrashesInMove <- Yes

INVARIANTS
    OneLeaderPerGeneration
    AckedHeldByLeader
    AtMostOneServing

PROPERTY
    EventuallyServes
    EventuallyAtFactor

CHECK_DEADLOCK FALSE
