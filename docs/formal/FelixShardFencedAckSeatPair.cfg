\* FelixShardFencedAckSeat.cfg with a replication factor of two: a and b hold
\* the shard and c is the spare (`Spares = {c}`). Replacing b seats c into
\* `{a, c}`, and a record acknowledged on a and b at the joining generation
\* may not be on c. A failover then may keep b (`SeatDropped`), so the new
\* leader fences two of `{a, b, c}`, and the set left above the factor is
\* fenced and trimmed back once the leader reports drained and the rest hold
\* its log (`TrimFence`, `TrimSet`). One move, one write, `L = 2`, time to 3.
\*
\* `AckedOnMajority` is left out: right after the seat the record can be on a
\* alone of `{a, c}`, with b outside the set, and the model's failover reaches
\* b only through the keep. FelixShardFencedAckSeatPairOnMajority.cfg pins
\* that (#1616). This one checks that no leader opens without an
\* acknowledged record and that copies never disagree.
\*
\* Evidence: `a_failover_before_the_seat_is_reported_keeps_the_leaving_copy`,
\* `a_set_above_its_factor_drops_the_draining_copy` and
\* `a_trim_waits_for_records_acknowledged_after_its_report` (placement).

SPECIFICATION Spec

CONSTANTS
    Brokers = {a, b, c}
    L = 2
    Margin = 0
    Eps = 0
    Drift = 0
    MaxTime = 3
    MaxWrites = 1
    CheckAtCommit = FALSE
    Quorum = TRUE
    Promotion = "any"
    ReportBeforeAck = FALSE
    Handoff = FALSE
    WaitForDrained = TRUE
    FenceAtClaim = TRUE
    AckOnAdmit = FALSE
    FenceFromAdmit = FALSE
    MaxMoves = 1
    Planners = {}
    CasWrites = TRUE
    StageMove = FALSE
    LearnerVotes = FALSE
    Resends = FALSE
    SequencesInLog = TRUE
    Cancel = FALSE
    CancelCas = TRUE
    ReportBound = "acknowledged"
    AckChecksLease = FALSE
    AckOnResponse = FALSE
    AckByFollowers = TRUE
    FenceOnPromote = TRUE
    LabelOnReceipt = FALSE
    StartRecord = FALSE
    Spares = {c}
    ReplaceOnPromote = FALSE
    SeatHoldsCopy = TRUE
    Grow = FALSE
    PromoteDestination = FALSE
    Counters = FALSE
    CounterCatchUp = FALSE
    Ballots = FALSE
    Elections = 0
    FenceEveryChange = FALSE
    Suspicions = 0
    SetCheck = FALSE
    JointFence = FALSE
    Adopt = 0
