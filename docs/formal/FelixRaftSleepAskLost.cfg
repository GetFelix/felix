\* FelixRaftSleepFalseAlarm with one ask lost. The design as written: the
\* follower asks once and is held for one election timeout. The sleeping
\* leader never hears the ask, the hold runs out, and the follower campaigns
\* and deposes a healthy leader. An expected violation (issue 2320). The
\* harm is availability, not safety.
\* Evidence: none, sleep is not built yet (issue 2244).

