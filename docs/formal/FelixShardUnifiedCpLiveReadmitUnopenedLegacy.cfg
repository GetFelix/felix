\* Shape J under today's rules: the set being left pins the copy the crash
\* replaced. The one start is the readmission (ShapeJ), so the stall goes
\* through it. Expected to violate EventuallyServes.

SPECIFICATION LiveSpec

CONSTANTS
    Nodes = {a, b, c}
    First = a
    NoNode = NoNode
    MaxGen = 4
    MaxWrites = 0
    MaxStarts = 1
    MaxUnclean = 2
    MaxWipes = 0
    MaxRestores = 0
    MaxRetries = 0
    SetChoices = {{a, b, c}}
    OldPeers = {}
    LiveCp <- Yes
    FaultUntil <- Three
    UnifiedFence <- No
    ShapeJ <- Yes

PROPERTY
    EventuallyServes

INVARIANTS
    OneLeaderPerGeneration
    AckedHeldByLeader
