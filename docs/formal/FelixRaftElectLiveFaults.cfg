\* FelixRaftElectLive.cfg with two faults: a second crash or cut can fall
\* during the election the first one started, and both members may come
\* back. Why eight terms are enough: the first election takes one term, the
\* one split one more, and each fault at most three: the election it forces,
\* the term a crashed leader restores itself at, and one stand of a pre-vote
\* that passed while the fault left no round open. Any other timeout falls
\* in an open round (another member's passed pre-vote or live candidacy) and
\* spends the split, so without a new fault no second stale pre-vote can
\* depose a fresh leader. 1 + 1 + 2 * 3 = 8. Six terms ran out on exactly
\* that stale stand. Nine terms give the same verdict.
\* Evidence: the tests FelixRaftElectLive.cfg names,
\*   `members_told_together_elect_one_leader`,
\*   `a_leader_that_loses_its_appends_does_not_stall_the_next_election`.

SPECIFICATION LiveSpec

CONSTANTS
    Servers = {a, b, c}
    Nobody = Nobody
    MaxTerm = 9
    MaxFaults = 2
    Splits = 1
    Staggered = TRUE

INVARIANTS
    TypeOK
    OneLeaderPerTerm

PROPERTIES
    ElectionSettles
    EventuallyServes
