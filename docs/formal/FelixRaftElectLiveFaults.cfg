\* FelixRaftElectLive.cfg with two faults and six terms: a second crash or
\* cut can fall during the election the first one started, and both members
\* may come back.

SPECIFICATION LiveSpec

CONSTANTS
    Servers = {a, b, c}
    Nobody = Nobody
    MaxTerm = 6
    MaxFaults = 2
    Splits = 1
    Staggered = TRUE

INVARIANTS
    TypeOK
    OneLeaderPerTerm

PROPERTIES
    ElectionSettles
    EventuallyServes
