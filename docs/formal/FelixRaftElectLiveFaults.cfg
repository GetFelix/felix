\* FelixRaftElectLive.cfg with two faults and eight terms: a second crash or
\* cut can fall during the election the first one started, and both members
\* may come back. Six terms are not enough: a pre-vote that passed before a
\* new leader's heartbeat reached the member stands anyway and deposes that
\* leader, and with every term spent the one candidate left has the shorter
\* log. A seventh term would elect the longer one, so that trace is the bound.
\* Evidence: the tests FelixRaftElectLive.cfg names,
\*   `members_told_together_elect_one_leader`,
\*   `a_leader_that_loses_its_appends_does_not_stall_the_next_election`.

SPECIFICATION LiveSpec

CONSTANTS
    Servers = {a, b, c}
    Nobody = Nobody
    MaxTerm = 8
    MaxFaults = 2
    Splits = 1
    Staggered = TRUE

INVARIANTS
    TypeOK
    OneLeaderPerTerm

PROPERTIES
    ElectionSettles
    EventuallyServes
