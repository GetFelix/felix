\* FelixCrossShardCommit.cfg with no term or low-water fence: a participant
\* forgets finished ids at will, and a delayed prepare and apply for a blind
\* put write the part a second time.
\* No forger, writer or leader change, so the walks reach it in budget.
\* Expected to violate NoDoubleApply.
\*
\* Evidence: none, this models an alternative the design does not use.

SPECIFICATION Spec

CONSTANTS
    Parts = {p1, p2}
    NTxns = 2
    MaxTerm = 1
    MaxWrites = 0
    Forger = FALSE
    NoFirstWins = FALSE
    ReleaseOnTimeout = FALSE
    TrimUndone = FALSE
    NoFence = TRUE
    WriteCheckEarly = FALSE
    ApplyWithoutLock = FALSE
    NoTokenCheck = FALSE

INVARIANTS
    NoDoubleApply
