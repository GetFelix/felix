\* A cut-over that changes the set by more than one member at once, as
\* `replicas_after_cut_over` in placement/moves.rs can: the leader of {a, b,
\* c} hands the shard to a follower on a set that keeps some of the staying
\* replicas and takes the spare d (`Swaps = 1`). A majority of the new set
\* then need share no replica with a majority of the old. The destination
\* fences jointly, a majority of the new set and of the old (`JointFence`),
\* carrying the new set's generation, before it serves, and acknowledges
\* jointly until the control plane, which keeps the old set until then,
\* takes the new one. Replicas elect themselves one generation past the
\* control plane's, with the set check.
\* Two writes, so two acknowledged records can disagree (AckedAgree).
\* FelixShardElectSwapNoJoint.cfg is the same cut-over fencing the new set
\* alone.
\*
\* Evidence: none yet, nothing in the code elects a leader.

SPECIFICATION Spec

