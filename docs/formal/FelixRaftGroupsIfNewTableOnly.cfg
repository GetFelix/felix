\* if_new checks the table only: a new group with records handed out and
\* nothing committed is moved anyway.
\*
\* Evidence: none, Raft shards refuse group operations until the design this
\* models is built (#2446).

SPECIFICATION Spec

CONSTANTS
    Members = {a, b}
    N = 2
    SeekTo = {1, 3}
    MaxChanges = 1
    MaxLog = 4
    CreationCheck = TRUE
    DeleteWatermark = TRUE
    IfNewChecksTracker = FALSE
    TermBoundTrackers = TRUE
    HydrateFromApplied = TRUE
    WaitOwnProposals = TRUE
    StaleByHyd = FALSE
    RefreshOnDrop = TRUE
    DeadBeforeAdvance = TRUE
    KeepRedriven = TRUE

SYMMETRY Symm

INVARIANTS
    IfNewKeepsServed
