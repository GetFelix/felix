    StageMove = FALSE
    LearnerVotes = FALSE
    Resends = FALSE
    SequencesInLog = TRUE
    Cancel = FALSE
    CancelCas = TRUE
    ReportBound = "acknowledged"
    AckChecksLease = FALSE
    AckOnResponse = FALSE
    AckByFollowers = TRUE
    FenceOnPromote = TRUE
    LabelOnReceipt = FALSE
    StartRecord = TRUE
    ReportFromAnswers = FALSE
    ReportFloor = FALSE
    Spares = {}
    ReplaceOnPromote = FALSE
    SeatHoldsCopy = TRUE
    Grow = FALSE
    PromoteDestination = FALSE
    Counters = FALSE
    CounterCatchUp = FALSE
    Ballots = TRUE
    Elections = 1
    FenceEveryChange = FALSE

    Suspicions = 0
