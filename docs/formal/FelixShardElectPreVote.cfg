\* FelixShardElect.cfg with pre-vote and stickiness (`PreVote`): a replica
\* stands only once a majority of its set, itself included, no longer hears
\* a leader, and a replica that still hears one refuses a candidate's fence.
\* Time runs to 2 with `L = 2`, so a leader whose heartbeats are lost lets
\* its lease lapse and steps down, and elections follow; `Margin = 2` keeps
\* the control plane from promoting in the run. Safety does not rest on the
\* guard (FelixShardElect.cfg holds without it); this checks it breaks
\* nothing.
\*
\* Evidence: none yet, nothing in the code elects a leader.

SPECIFICATION Spec

CONSTANTS
    Brokers = {a, b, c}
    L = 2
    Margin = 2
    Eps = 0
    Drift = 0
    MaxTime = 2
    MaxWrites = 2
