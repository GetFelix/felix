\* Witness for FelixRaftReformAloneTwoCuts.cfg: the group of one re-forms
\* after a power cut, starts epoch 1 and commits there, loses that copy to a
\* second power cut, and re-forms again keeping the epoch-1 record; epoch 2
\* commits a record of its own. Must violate NeverReformsAloneTwice.
\*
\* Evidence: none, this shows the bounds reach the case.

SPECIFICATION Spec

CONSTANTS
    Brokers = {a}
    InitBrokers = {a}
    None = None
    MaxEpoch = 2
    MaxTerm = 2
    MaxWrites = 3
    MaxChangeSteps = 0
    ChangeOut = None
    ChangeIn = None
    MaxPlace = 0
    MaxRotations = 0
    MaxRejoins = 0
    MaxRestarts = 0
    MaxMsgs = 0
    MaxPlans = 3
    MaxDead = 0
    DeadRuns = FALSE
    WaitPlaced = TRUE
    Floor = "trailing"
    ReformBeforeAll = FALSE
    EpochNotChecked = FALSE
    ReportNotPromise = FALSE
    PlanNotRechecked = FALSE
    RotatedNotWaited = FALSE
    RetireNotDurable = FALSE
    VoteByBroker = FALSE
    BaseNotHighest = FALSE
    NoCas = FALSE
    SoloPlacedTwo = FALSE
    StopNotRechecked = FALSE
    PlacedForgotten = FALSE
    FloorIndexOnly = FALSE
    CutToCommit = FALSE
    Kept = TRUE
    Alone = "whole"
    Reserve = "every"
    MaxCuts = 2
