\* FelixShardElectSwapFlip.cfg with a joining copy that holds any prefix of
\* the destination's log (`JoinLags`), and the flip waiting for the start of
\* the destination's named stint (`StintStarts`, #1787). Checked in the one
\* piece where
\* FelixShardElectSwapFlipJoinLagsFirstStart.cfg finds its trace: the
\* cut-overs that keep the old leader, after the one write was admitted, once
\* several replicas had promised past the control plane's generation, the
\* destination among them (`CutOverPiece`).
\* (not yet measured)
\*
\* Evidence: `a_new_stint_at_a_started_generation_writes_its_own_start`
\* (services/felix-broker-service/src/shards/lifecycle/tests/promotion.rs)
\* and `the_joint_start_waits_for_the_current_stints_start`
\* (crates/server/felix-replication/src/driver/tests/joint_acks.rs) for the
\* named stint's start; `a_cut_over_records_the_new_set_as_pending_and_takes_it_only_on_the_report`
\* (services/felix-controlplane-service/src/cluster/placement/tests/pending_set.rs)
\* for the flip. Nothing in the code elects a leader yet.

