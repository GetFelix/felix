\* A planned handoff in which only admission checks the fence. A write
\* admitted just before the fence waits, and is claimed and committed after
\* the leader has reported drained -- the report counts claimed writes only.
\* Under `Leader` consistency the commit is the acknowledgement, and the
\* control plane cuts over on the drained report to a successor that never
\* received the record.
\*
\* Expected to violate AckedSurvive, in eleven steps. With `FenceAtClaim =
\* TRUE` the same configuration is FelixShardHandoffLeaderAck.cfg, which
\* passes: the claim is refused once the leader has seen the fence, so nothing
\* lands after the drained report.
\* Evidence: this configuration REMOVES a check the implementation has, so the
\* citations are what prove the check is there to remove.
\* `a_durable_publish_claimed_after_the_fence_is_refused` -- a publish admitted
\*   before the fence and claimed after it is refused and not written.
\* `an_ephemeral_publish_claimed_after_the_fence_is_refused` -- the same on the
\*   inline publish path.
\* `an_idempotent_publish_claimed_after_the_fence_is_refused` -- and on the
\*   idempotent one.
\* `a_forwarded_publish_after_the_fence_is_refused` -- a publish forwarded to
\*   the old leader is refused the same way.
\* `a_draining_shard_reports_drained_once_its_fence_is_quiet` -- the drained
\*   report counts what is inside the fence, not how still the tail looks.

