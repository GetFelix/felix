\* FelixShardShortCopyStagedVotes.cfg with the fix #1635 proposed: a
\* failover's fence ids name only the set, without its staged copy
\* (`FenceIdsSetOnly <- Yes`). Then the ids name exactly `{a, b}`, a answers
\* b's fence from the copy that lost the write acknowledged on a and c, and
\* b opens without it (AckedHeldByLeader). The fix waits until every leader
\* treats a staged copy the same way.
\*
\* Evidence: `a_leader_that_never_saw_the_set_before_counts_the_successor`
\* (the vote this twin needs).

SPECIFICATION Spec

CONSTANTS
    Brokers = {a, b, c}
    L = 1
    Margin = 0
    Eps = 0
    Drift = 0
    MaxTime = 1
    MaxWrites = 2
    CheckAtCommit = FALSE
    Quorum = TRUE
    Promotion = "leader-report"
    ReportBeforeAck = FALSE
    Handoff = FALSE
    WaitForDrained = TRUE
    FenceAtClaim = TRUE
    AckOnAdmit = FALSE
    FenceFromAdmit = FALSE
    MaxMoves = 0
    Planners = {}
    CasWrites = TRUE
    StageMove = TRUE
    LearnerVotes = TRUE
    Resends = FALSE
    SequencesInLog = TRUE
    Cancel = FALSE
    CancelCas = TRUE
    ReportBound = "acknowledged"
    AckChecksLease = FALSE
    AckOnResponse = FALSE
    AckByFollowers = TRUE
    FenceOnPromote = TRUE
    LabelOnReceipt = FALSE
    StartRecord = TRUE
    Spares = {}
    ReplaceOnPromote = FALSE
    SeatHoldsCopy = TRUE
    Grow = FALSE
    PromoteDestination = FALSE
    Counters = FALSE
    CounterCatchUp = FALSE
    Ballots = FALSE
    Elections = 0
    FenceEveryChange = FALSE
    Suspicions = 0
    SetCheck = FALSE
    JointFence = FALSE
    Adopt = 0
    AdoptMatch = TRUE
    Swaps = 0
    PreVote = FALSE
    Wipes = 1
    StorageIds = FALSE
    ReportFromAnswers = FALSE
    ReportFloor = FALSE

    CrashLoses <- Yes
    CrashLeader <- Yes
    GiveUpOnCrash <- Yes
    RefuseShortCopy <- Yes
    FenceIdsSetOnly <- Yes

SYMMETRY Symm

INVARIANTS
    TypeOK
    AckedHeldByLeader
    AckedAgree
    NoTruncationBelowHwm
