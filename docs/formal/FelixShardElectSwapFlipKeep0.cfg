\* A piece of FelixShardElectSwapFlip.cfg, which did not finish in six hours:
\* the cut-overs whose new set keeps the old leader, after no write was
\* admitted, before any replica stood for a generation past the control
\* plane's. The pieces split every cut-over the way
\* FelixShardElectSwap{Keep,Drop}*.cfg do (`CutOverPiece`), and each also
\* checks everything before its cut-over, so together they reach every state
\* FelixShardElectSwapFlip.cfg does. `QuietView` leaves out what no step reads
\* again here. (not yet measured)
\*
\* Evidence: as FelixShardElectSwapFlip.cfg.

SPECIFICATION Spec

CONSTANTS
    Brokers = {a, b, c, d}
    L = 2
    Margin = 0
    Eps = 0
    Drift = 0
    MaxTime = 0
    MaxWrites = 1
    CheckAtCommit = FALSE
    Quorum = TRUE
    Promotion = "any"
    ReportBeforeAck = FALSE
    Handoff = FALSE
    WaitForDrained = TRUE
    FenceAtClaim = TRUE
    AckOnAdmit = FALSE
    FenceFromAdmit = FALSE
    MaxMoves = 0
    Planners = {}
    CasWrites = TRUE
    StageMove = FALSE
    LearnerVotes = FALSE
    Resends = FALSE
    SequencesInLog = TRUE
    Cancel = FALSE
    CancelCas = TRUE
    ReportBound = "acknowledged"
    AckChecksLease = FALSE
    AckOnResponse = FALSE
    AckByFollowers = TRUE
    FenceOnPromote = TRUE
    LabelOnReceipt = FALSE
    StartRecord = TRUE
    ReportFromAnswers = FALSE
    ReportFloor = FALSE
    Spares = {d}
    ReplaceOnPromote = FALSE
    SeatHoldsCopy = TRUE
    Grow = FALSE
    PromoteDestination = FALSE
    Counters = FALSE
    CounterCatchUp = FALSE
    Ballots = TRUE
    Elections = 1
    FenceEveryChange = TRUE

    Suspicions = 0
    SetCheck = TRUE
    JointFence = TRUE
    Adopt = 0
    AdoptMatch = TRUE
    Swaps = 1
    PreVote = FALSE
    Wipes = 0
    StorageIds = FALSE
    FlipNewGeneration <- Yes
    SplitAtCutOver <- Yes
    PieceKeeps <- Yes
    PieceWrites <- Zero
    PieceStood <- No
SYMMETRY Symm
VIEW QuietView
CONSTRAINT CutOverPiece

INVARIANTS
    TypeOK
    OneLeaderPerGeneration
    AckedHeldByLeader
    AckedAgree
    AckedOnMajority
    NoTruncationBelowHwm
    AdoptedMatchesOpened
    SetChangesJoint
