\* FelixRaft.cfg with one rule dropped. `purge` removes applied entries
\* before the snapshot that covers them is stored. Two brokers do it, and an
\* acknowledged record is left on one disk. openraft also refuses to start a
\* broker whose state machine is behind its purged log.
\*
\* Evidence: none, this models an alternative the implementation does not use.

