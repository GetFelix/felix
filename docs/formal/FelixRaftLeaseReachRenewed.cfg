\* A witness for FelixRaftLeaseAck.cfg. TLC must find three writes in one term:
\* acknowledged locally, then one that waits for commit because the lease
\* lapsed, then one acknowledged locally again because that commit renewed it.
\*
\* Evidence: none, `admit_local_ack` always refuses until these configs pass.

SPECIFICATION Spec

CONSTANTS
    Servers = {a, b, c}
    Nobody = Nobody
    MaxTerm = 1
    MaxWrites = 3
    MaxRestarts = 0
    RateLo = 1
    RateHi = 2
    DriftLo = 1
    DriftHi = 2
    Lease = 1
    ElectionTimeout = 2
    Consumer = FALSE
    LeaseTooLong = FALSE
    DriftBeyondBound = FALSE
    LeaseFromAck = FALSE
    VoteInWindow = FALSE
    RestartForgetsWindow = FALSE
    DeliverUncommitted = FALSE
    StoreLeases = FALSE
    SupportTime = 0
    MaxEpoch = 1
    MaxBeats = 0
    MaxStalls = 0
    SupportNotDurable = FALSE
    VoteWhileSupported = FALSE
    LeaseKeptAcrossRestart = FALSE
    ResupportWithdrawn = FALSE
    WithdrawEarly = FALSE
    StalledKeepsAsking = FALSE

SYMMETRY Symm

INVARIANTS
    NeverLapsedThenRenewed
