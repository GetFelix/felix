\* A shard with one replica on broker a that can both re-form by itself (a
\* group of one after a power cut) and be abandoned by the operator once a is
\* declared dead. The two paths meet only at the epoch compare and swap, and
\* each starts above every offset the earlier epochs reserved or gave out, so
\* an abandon after an alone re-form, or the reverse, never reuses an offset
\* or strands an acknowledged record the copies still hold. a can come back
\* with its copy. Checks OffsetNeverReused, AckedSurvive and
\* AbandonedNotLed.
\*
\* Evidence: `a_group_of_one_starts_its_next_epoch` and
\* `an_abandoned_copy_starts_at_the_first_index`.

