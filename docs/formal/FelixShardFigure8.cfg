\* The broker as built, FelixShardFencedPromotion.cfg, with the generation
\* start record (`StartRecord`), from the seeded history in
\* FelixShardFigure8.tla: a wrote x at 1, b wrote y at 2, neither shipped.
\* Each promoted leader writes a start record at its own generation before
\* any client write, and the report and the quorum mark count only up to a
\* record of the leader's own generation. c, promoted at 3, can acknowledge x
\* only once a majority holds its start record behind it; a promoted at 4
\* then has a newer last generation than b and keeps x. Raft's no-op at the
\* start of a term. FelixShardFigure8NoStartRecord.cfg is this without it.
\*
\* A mark does not move while its leader fences (NoAckWhileFencing), as in
\* the code, where nothing ships until the shard opens.
\*
\* 5.99M distinct states, depth 39, 35 s on sixteen cores. Real time to 4 is
\* the least that fits two more promotions; 5 ran past 35M states unfinished.
\*
\* Evidence: `write_generation_start` -- a promoted leader appends the
\* generation-start record before it serves (lifecycle.rs).
\* `counted_offset` -- the mark only counts past the generation's start record
\* (quorum.rs); `inherited_records_count_only_once_the_start_record_is_on_a_majority`
\* and `an_inherited_record_acknowledged_on_a_majority_survives_the_next_fence`.


