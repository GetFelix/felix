\* The broker as built, FelixShardFencedPromotion.cfg, from a seeded history:
\* a wrote x at 1 and shipped it nowhere; b, promoted at 2, fenced c, wrote y
\* and shipped it nowhere; b's lease has lapsed and its last report names a
\* and c. TLC finds the record lost in fifteen steps (AckedOnMajority): c is
\* promoted at 3 from that report, takes x from a in its fence, opens, and
\* acknowledges x once a and c hold it -- a record it inherited, counted by
\* the report and the lease as any other. Its lease lapses, a is promoted at
\* 4 from c's report, and a's fence finds b's log ahead by generation, so a
\* takes y in place of x.
\*
\* This is Raft's Figure 8. Raft's answer is to count only records of the
\* leader's own generation, which FelixShardFencedAck.cfg's HeldAtGen does;
\* the report does not, and neither does the code's quorum mark. The
\* violation is pinned until the acknowledgement stops counting inherited
\* records.
\*
\* A mark does not move while its leader fences (NoAckWhileFencing), as in
\* the code, where nothing ships until the shard opens.
\*
\* About 1.2M distinct states to the violation, 6 s on ten cores.
\*
\* Evidence: none; this pins a gap.


