\* FelixShardUnifiedCpLiveReplacedLeaving.cfg without `ReplacedBlocking`: a
\* fence leaving a two-seat set one of whose seats lost its directory needs
\* both seats, gets one, and no fair run serves again. Expected to violate
\* EventuallyServes.

SPECIFICATION LiveSpec

CONSTANTS
    Nodes = {a, b, c}
    First = a
    NoNode = NoNode
    MaxGen = 5
    MaxWrites = 0
    MaxStarts = 2
    MaxUnclean = 0
    MaxWipes = 1
    MaxRestores = 0
    MaxRetries = 0
    SetChoices = {{a, b}, {a, b, c}}
    OldPeers = {}
    LiveCp <- Yes
    FaultUntil <- Three
    ReplacedFirst <- Yes

PROPERTY
    EventuallyServes

INVARIANTS
    OneLeaderPerGeneration
    AckedHeldByLeader
