\* FelixRaftReformStaleMembership.cfg with two directories lost. The change
\* to {a, b, d} is committed by a, b and d. Then the shard directories of a
\* and b are lost, or restored to before the change, and both copies rotate
\* with empty logs. No report names d, so the control plane does not wait
\* for it and re-forms {a, b, c} from an empty base while d's disk still
\* holds the acknowledged entry. The design as written: an expected violation
\* (issue 2311). The two rules of issue 2304 are on and do not help.
\* 
\* This is not the relaxed fsync loss. A relaxed crash keeps the synced
\* membership entries, so the reports of a and b name d.
\* FelixRaftReformStaleMembershipRelaxed.cfg checks that case.
\* 
\* Evidence: none, re-forming is not built yet (track 4 of issue 2244).

