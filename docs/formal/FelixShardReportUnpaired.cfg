\* The Quorum bound without its pairing: followers are measured against the
\* offset a majority holds, but the report claims the leader's whole log, so a
\* later mark can release records the named followers were never measured
\* for. A leader that dies then is replaced by one of them, without a record a
\* client was told is on a majority.
\*
\* Expected to violate AckedSurvive.
\* Evidence: this configuration REMOVES a pairing the implementation has.
\* `a_quorum_follower_holding_every_acknowledged_record_can_lead` -- the report
\*   and the mark it releases are computed from the same positions.
\* Planners = {}: every decision reads and writes in one step, so CasWrites
\*   has nothing to compare. The StalePlanner and StalePromotion
\*   configurations are where a read is held across another write.

SPECIFICATION Spec

CONSTANTS
    Brokers = {a, b, c}
    L = 4
    Margin = 2
    Eps = 1
    Drift = 0
    MaxTime = 7
    MaxWrites = 2
