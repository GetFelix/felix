\* FelixShardFencedCrash.cfg with the promoted leader also counting a replica
\* the report named no identity for (`UnnamedCounts`). The leader reports
\* before it has asked one follower who it is, then asks, ships it a record
\* and acknowledges the record on the two of them. The follower crashes and
\* loses it, and placement promotes the third replica from that report. Its
\* fence counts the short copy, which the report could not vouch for.
\*
\* Expected to violate AckedHeldByLeader. The code counts such a replica only
\* when its handshake gives no identity, a build from before identities,
\* where there is no evidence either way.
\*
\* Evidence: this configuration REMOVES the unnamed rule.
\* `a_replica_the_report_did_not_name_does_not_count` -- drop it and the
\*   unnamed copy's answer counts, which is the trace TLC finds.

SPECIFICATION Spec

