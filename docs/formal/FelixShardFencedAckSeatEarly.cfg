\* FelixShardFencedAckSeat.cfg with the seat going ahead however little the
\* newcomer holds, as placement did when a report named it caught up before
\* anything was counted at the joining generation. The leader acknowledges
\* a record on itself and the leaving follower, the newcomer is seated
\* without it, the leader's lease lapses, and the lagging follower is
\* promoted and fences the newcomer: a majority of the new set, neither
\* holding the record (AckedHeldByLeader). AckedOnMajority is left out, as
\* it fails at the seat itself.
\*
\* Evidence: `seating_a_replacement_keeps_what_the_old_set_acknowledged`
\* loses the record this way with the old seat rule.

SPECIFICATION Spec

CONSTANTS
    Brokers = {a, b, c, d}
    L = 2
    Margin = 0
    Eps = 0
    Drift = 0
    MaxTime = 3
    MaxWrites = 1
    CheckAtCommit = FALSE
    Quorum = TRUE
    Promotion = "any"
    ReportBeforeAck = FALSE
    Handoff = FALSE
    WaitForDrained = TRUE
    FenceAtClaim = TRUE
    AckOnAdmit = FALSE
    FenceFromAdmit = FALSE
    MaxMoves = 1
    Planners = {}
    CasWrites = TRUE
    StageMove = FALSE
    LearnerVotes = FALSE
    Resends = FALSE
    SequencesInLog = TRUE
    Cancel = FALSE
    CancelCas = TRUE
    ReportBound = "acknowledged"
    AckChecksLease = FALSE
    AckOnResponse = FALSE
    AckByFollowers = TRUE
    FenceOnPromote = TRUE
    LabelOnReceipt = FALSE
    StartRecord = FALSE
    Spares = {d}
    ReplaceOnPromote = FALSE
    SeatHoldsCopy = FALSE
    Grow = FALSE
    PromoteDestination = FALSE

SYMMETRY Symm

INVARIANTS
    TypeOK
    AckedHeldByLeader
    AckedAgree
    NoTruncationBelowHwm
