\* The history of InstallLowersFloor.cfg, steered the same way, with the install
\* refusing a snapshot that carries a floor below its own. Expected to pass
\* the safety invariants; CatchUpPossible says whether the member can still
\* catch up.
\*
\* Evidence: none, purging a Raft stream shard is not built yet (issue 2602).

SPECIFICATION Spec

CONSTANTS
    Members = {a, b, c}
    Voters = {a, b, c}
    MaxIndex = 4
    MaxTrims = 2
    MaxChanges = 1
    MaxRestarts = 1
    MaxReforms = 1
    PurgeBelowFloorRule = TRUE
    InstallRule = TRUE
    InstallFloor = "refuse"
    LeaderCaps = FALSE
    SnapAtApplied = FALSE
    TablesAtApplied = FALSE
    SnapFloorAtP = TRUE
    SnapCarriesHeaders = TRUE
    DropFirst = FALSE
    ReformReads = "full"
    ReformCarriesFloor = TRUE
    ReformStoresFloor = TRUE

CONSTRAINT FloorDropPath
SYMMETRY Symm

INVARIANTS
    TypeOK
    NoReadBelowFloor
    NoAckedLoss
    PurgeBelowFloor
    AppliedCoversPurge
    TablesAgree
    HeadersAgree
    OffsetNeverReused
    CatchUpPossible
