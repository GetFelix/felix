\* A broker restarts while the group is awake, asleep or mid-handshake. A
\* restarted follower is held until the leader notices its new epoch and
\* heartbeats, so it deposes nobody (NoNeedlessDeposal).
\* What this does not test: the model has no clock, and a hold ends only when
\* no live leader could still answer. So the pass shows the rules leave no
\* other path to a deposal, not that the hold is long enough. A lost ask
\* (FelixRaftSleepAskLost.cfg) and a hold that is too short
\* (FelixRaftSleepHoldTooShort.cfg) each depose the leader. A lost wake
\* heartbeat is not modelled.
\* It passes on two rules the design page does not state yet (issue 2310): a
\* heartbeat sent while a sleep proposal is open closes it, and a follower
\* refuses a sleep request from a leader it does not support or while held.
\* Evidence: none, sleep is not built yet (issue 2244).

