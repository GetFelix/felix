\* A stream shard's consumer-group logs beside its records (`GroupLogs`):
\* the counter log of FelixShardElectWipeNonVoterSetless.cfg stands for them,
\* without the fences that carry no set. Re-admission does not wait for the
\* group log; the copy stays marked wiped until its group log holds a record
\* of its set's generation, refuses group fences meanwhile, and as a leader
\* does not count its own group log. All the safety invariants hold, the
\* counter ones read as the group log's.
\*
\* Twin: FelixShardElectWipeNonVoterGroupsKeepDropsMark.cfg (the leader's set
\* write drops its mark).
\*
\* Evidence: `a_readmitted_copy_answers_group_fences_once_its_group_logs_caught_up`
\* in crates/server/felix-replication/src/replica/tests/non_voting.rs, and
\* `a_wiped_leader_with_no_group_answer_stays_pending` in
\* crates/server/felix-replication/src/promotion/tests/groups.rs.

