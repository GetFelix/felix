\* A subscriber on a `Quorum` stream shard with no lease anywhere on its
\* path: it reads up to the committed mark of whichever broker believes it
\* leads, and resumes at its next offset when it moves. Writes as in
\* FelixShardReadsRound.cfg: follower acks, the promotion fence, the start
\* record, drifting clocks and no margin, so a deposed leader goes on
\* delivering until it learns. What it delivers is below its own mark,
\* which every later leader holds (NoLostDelivery).
\* FelixShardSessionsPastMark.cfg delivers past the mark.
\*
\* Bounds: one write, time to 2 with L = 2, so one promotion.
\*
\* Evidence: `CommitHold` (felix-broker stream/committed.rs) holds a batch
\* until the mark passes it; `committed_bound` (felix-replication quorum.rs)
\* is the bound every reader waits on. Tested by
\* `readers_and_groups_survive_a_control_plane_partition` and
\* `readers_keep_the_mark_without_the_lease_where_followers_decide_it`.

SPECIFICATION SessionsSpec

CONSTANTS
    Brokers = {a, b, c}
    L = 2
    Margin = 0
    Eps = 0
    Drift = 1
    MaxTime = 2
    MaxWrites = 1
    CheckAtCommit = FALSE
    Quorum = TRUE
    Promotion = "log-order"
    ReportBeforeAck = FALSE
    Handoff = FALSE
    WaitForDrained = TRUE
    FenceAtClaim = TRUE
    AckOnAdmit = FALSE
    FenceFromAdmit = FALSE
    MaxMoves = 0
    Planners = {}
    CasWrites = TRUE
    StageMove = FALSE
    LearnerVotes = FALSE
    Resends = FALSE
    SequencesInLog = TRUE
    Cancel = FALSE
    CancelCas = TRUE
    ReportBound = "acknowledged"
    AckChecksLease = FALSE
    AckOnResponse = FALSE
    AckByFollowers = TRUE
    FenceOnPromote = TRUE
    LabelOnReceipt = FALSE
    StartRecord = TRUE
    Spares = {}
    ReplaceOnPromote = FALSE
    SeatHoldsCopy = TRUE
    PromoteDestination = FALSE
    Counters = FALSE
    CounterCatchUp = FALSE
    Ballots = FALSE
    Elections = 0
    FenceEveryChange = FALSE
    Suspicions = 0
    ReportFromAnswers = FALSE
    ReportFloor = FALSE
    Grow = FALSE
    ReadConfirm = "round"
    MaxReads = 0
    DeliverTo = "mark"
    MaxCommits = 0

SYMMETRY Symm

INVARIANTS
    SessionsTypeOK
    NoLostDelivery
    AckedHeldByLeader
    AckedOnMajority
