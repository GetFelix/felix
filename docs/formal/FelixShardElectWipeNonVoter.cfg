\* The direction FelixShardElectWipeWaitsFloorDeep.cfg points to, as
\* evidence and not a decision: a wiped replica is a new member that does not
\* vote (`WipedNonVoter`). It answers no fence, candidate's or named, takes
\* no batch and counts in no majority until the control plane re-admits it:
\* it writes the set again at its next generation, and the leader it names
\* fences jointly, counting the old set's majority without the wiped replica
\* (`Readmit`). Until then the replica may learn a set (`WipedLearnsSet`) and
\* copy an open leader's records (`CatchUp`), none of which counts.
\*
\* FelixShardElectWipe.cfg's shard with one write and elections and
\* adoption up to generation 3, where every bound the control plane holds
\* failed. No oracle. It passes. Any majority that counted the replica before
\* its wipe shares a non-wiped replica with the re-admission's majority, and
\* that replica refuses the re-admission at a generation it promised
\* elsewhere. Three brokers only, so that is the one shape checked.
\* FelixShardElectWipeNonVoterCountsWiped.cfg counts the wiped replica there.
\*
\* Evidence: none yet, nothing in the code elects a leader.

