\* The rule #1331 adopted on 2026-10-31: a wiped replica is a new member that
\* does not vote (`WipedNonVoter`). Its wipe empties its log and its set file.
\* It answers no fence, candidate's or named, takes no batch and counts in no
\* majority until the control plane re-admits it: it writes the set again at
\* its next generation, and the leader it names fences jointly, counting the
\* old set's majority without the wiped replica (`Readmit`). The replica votes
\* again only once it holds that leader's log through the start record at the
\* re-admission's generation (`Readmitted`), as a Raft learner is caught up
\* before it is promoted. Until then it may learn a set (`WipedLearnsSet`) and
\* copy a leader's log (`CatchUp`), none of which counts.
\*
\* FelixShardElectWipe.cfg's shard with one write and elections and adoption
\* up to generation 3, where every bound the control plane holds failed. One
\* follower wiped once; no time, so no control-plane failover (see
\* FelixShardElectWipeNonVoterFailover.cfg). All the safety invariants hold.
\* AckedOnMajority counts a non-voter as holding every record: its wipe is the
\* loss the record already survived (README, "A wiped voter in an election").
\*
\* Twins: FelixShardElectWipeNonVoterNoCatchUp.cfg (re-admitted before it
\* caught up) and FelixShardElectWipeNonVoterCountsWiped.cfg (the old majority
\* counts the wiped replica).
\*
\* Evidence: none yet, nothing in the code elects a leader.

