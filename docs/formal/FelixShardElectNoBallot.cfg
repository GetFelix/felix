\* FelixShardElect.cfg without ballots: a replica answers any fence at the
\* generation it already promised, as `ReplicaHandler::fence` did when it
\* treated an equal generation as a leader confirming it still leads. Two
\* replicas stand at the same generation, each gets the third, and both open
\* (OneLeaderPerGeneration). One generation of elections and no writes are
\* enough.
\*
\* Evidence: none, this models the replica before ballots.

