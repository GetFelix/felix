\* Witness: a new leader finishes a cut batch while the held pieces it took
\* over are still uncommitted. The code never does this: it serves a term
\* only once every earlier entry is applied (raft/deliver.rs). The model
\* allows more than the code, and the passes hold over that too.
\*
\* Evidence: none, idempotent batches of several records on a Raft shard are not
\*   built yet (issue 2524).

