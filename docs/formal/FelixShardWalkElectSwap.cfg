\* A long random walk over cut-overs that change several members of the set
\* at once (`Swaps = 6`), for TLC's simulation mode: FelixShardElectSwap.cfg
\* with time to 40, drifting clocks, six writes, promotion on suspicion up to
\* generation 10, elections two generations past the control plane's,
\* adoption up to generation 10 and a planner acting on a held read. Set
\* changes, control-plane promotions and elections in one behaviour.
\* FelixShardWalkElectSwapNoJoint.cfg is this fencing the new set alone.
\*
\* No SYMMETRY: simulation stores no states. A pass means the walks found
\* nothing.
\*
\* Evidence: the control plane's side of `Swap` and `CpFlip` only:
\* `a_cut_over_records_the_new_set_as_pending_and_takes_it_only_on_the_report`,
\* `a_joint_start_from_an_older_generation_does_not_take_the_set` and
\* `a_failover_abandons_a_pending_change`. Nothing in the broker elects a
\* leader yet. Not checked here: the code writes the flip as a new
\* control-plane generation naming the new leader, while `CpFlip` keeps
\* `gen`, so TLC does not check that bump.

