\* FelixShardSuspicionWipeUnbacked.cfg with the fix (#1267): a follower on a
\* new data directory answers only what its routing view backs. The control
\* plane issued every generation the follower promised before the wipe, so a
\* view seeded since names the newest of them or a later one: the deposed
\* leader's batch is refused there, as it was by the promise the wipe took.
\*
\* FelixShardSuspicion.cfg with one write, which is all the trace needs, and
\* the follower losing its promises once (`LosePromises`). Its log stays,
\* which only helps the deposed leader: in the broker the empty copy would
\* take that leader's log back from its first batch.
\*
\* Evidence: the implementation behaviours this configuration asserts.
\* `a_wiped_copy_takes_no_fence_its_routes_do_not_have` -- Forget under
\*   PromiseFromRoutes: with no route nothing backs the fence, and nothing is
\*   persisted for the refusal.
\* `a_wiped_copy_answers_only_the_routed_leader_at_the_routed_generation` --
\*   at the view's generation only its leader, `Promise(f, leader, gen)`.
\* `a_wiped_copy_with_a_promise_since_answers_by_its_ballot` -- once it has
\*   taken a generation the ballot answers, as MayPromise does.
\* `only_a_directory_without_its_storage_id_starts_fresh` -- only a new or
\*   wiped directory loses its promises: a crash keeps the ballot files.

