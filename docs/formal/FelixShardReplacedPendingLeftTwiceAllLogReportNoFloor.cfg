\* FelixShardReplacedPendingLeftTwiceAllLogReport.cfg without the report floor
\* (`ReportFloor`), as `driver/shard.rs` was under `majority_ack` before #1924.
\* TLC loses an acknowledged write at depth 22 (#1922): d, promoted at 3 on
\* {a,c,d}, reports a caught up before shipping it anything, and a is
\* promoted at 4 with an empty log. Kept so the floor's protection stays
\* checked.
\*
\* Evidence: violates AckedHeldByLeader at depth 22 in about 42 minutes on a
\* four-core runner (run 41950965834).

SPECIFICATION Spec

CONSTANTS
    KeepsUnopened <- Yes
    FenceRecordedSet <- Yes
    LogDropsSets <- Yes
    Brokers = {a, b, c, d}
    L = 4
    Margin = 0
    Eps = 0
    Drift = 0
    MaxTime = 0
    MaxWrites = 2
    CheckAtCommit = FALSE
    Quorum = TRUE
    Promotion = "leader-report"
    ReportBeforeAck = FALSE
    Handoff = FALSE
    WaitForDrained = TRUE
    FenceAtClaim = TRUE
    AckOnAdmit = FALSE
    FenceFromAdmit = FALSE
    MaxMoves = 0
    Planners = {}
    CasWrites = TRUE
    StageMove = FALSE
    LearnerVotes = FALSE
    Resends = FALSE
    SequencesInLog = TRUE
    Cancel = FALSE
    CancelCas = TRUE
    ReportBound = "acknowledged"
    AckChecksLease = FALSE
    AckOnResponse = FALSE
    AckByFollowers = TRUE
    FenceOnPromote = TRUE
    LabelOnReceipt = FALSE
    StartRecord = TRUE
    ReportFromAnswers = FALSE
    ReportFloor = FALSE
    Spares = {d}
    ReplaceOnPromote = TRUE
    SeatHoldsCopy = TRUE
    Grow = FALSE
    PromoteDestination = FALSE
    Counters = FALSE
    CounterCatchUp = FALSE
    Ballots = FALSE
