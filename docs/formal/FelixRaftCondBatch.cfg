\* Conditional batches on a Raft shard: three members, two terms, logs up to
\* five entries, one membership entry, and three conditional publishes: a
\* batch of three naming offsets 2..4, one record naming 2, and a batch of
\* two naming 3..4. One change of leader can commit a strict prefix of a
\* batch, a cut batch, which readers must skip.
\*
\* Evidence: none yet. The code that follows this design (a mark per piece
\*   with its position and the batch length, readers that skip a cut batch,
\*   and a read bound that stops before an unfinished one) lands in later
\*   changes for #2751.

SPECIFICATION Spec

CONSTANTS
    Servers = {a, b, c}
    Nobody = Nobody
    MaxTerm = 2
    MaxLog = 5
    MaxPlain = 0
    MaxMembers = 1
    Expected <- TwoAtTwo
    CondLen <- BatchLens
    LeaderDecides = FALSE
    Hide = "whole"

SYMMETRY Symm

INVARIANTS
    TypeOK
    CondKeptAtExpected
    OneKeptPerOffset
    MembersAgree
    AnswersHold
    WholeBatchesOnly

PROPERTY
    ReadsStable
