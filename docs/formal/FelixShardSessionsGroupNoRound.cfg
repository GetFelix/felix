\* FelixShardSessionsGroupRound.cfg with the round skipped: a coordinator
\* that believes it leads acknowledges the commit. TLC finds the deposed
\* coordinator acknowledging after its successor opened
\* (NoStaleGroupCommit).
\*
\* Evidence: `a_deposed_coordinator_refuses_a_group_ack`, which acknowledges
\* on the deposed coordinator with the round taken out.

SPECIFICATION SessionsSpec

CONSTANTS
    Brokers = {a, b, c}
    L = 2
    Margin = 0
    Eps = 0
    Drift = 1
    MaxTime = 2
    MaxWrites = 1
    CheckAtCommit = FALSE
    Quorum = TRUE
    Promotion = "log-order"
    ReportBeforeAck = FALSE
    Handoff = FALSE
    WaitForDrained = TRUE
    FenceAtClaim = TRUE
    AckOnAdmit = FALSE
    FenceFromAdmit = FALSE
    MaxMoves = 0
    Planners = {}
    CasWrites = TRUE
    StageMove = FALSE
    LearnerVotes = FALSE
    Resends = FALSE
    SequencesInLog = TRUE
    Cancel = FALSE
    CancelCas = TRUE
    ReportBound = "acknowledged"
    AckChecksLease = FALSE
    AckOnResponse = FALSE
    AckByFollowers = TRUE
    FenceOnPromote = TRUE
    LabelOnReceipt = FALSE
    StartRecord = TRUE
    Spares = {}
    ReplaceOnPromote = FALSE
    SeatHoldsCopy = TRUE
    PromoteDestination = FALSE
    Counters = FALSE
    CounterCatchUp = FALSE
    Ballots = FALSE
    Elections = 0
    FenceEveryChange = FALSE
    ReportFromAnswers = FALSE
    ReportFloor = FALSE
    Grow = FALSE
    ReadConfirm = "none"
    MaxReads = 0
    DeliverTo = "none"
    MaxCommits = 1

SYMMETRY Symm

INVARIANTS
    SessionsTypeOK
    NoStaleGroupCommit
