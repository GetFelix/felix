\* No client writes: an idle shard. A follower back from an unclean crash
\* with its log whole is level with its leader, so only a batch sent
\* anyway, carrying the mark, vouches for it. Every fair run trusts it
\* again while that leader serves it. Expected to pass.
\*
\* Evidence: `an_idle_follower_is_sent_the_mark_once_per_process` (the
\* leader's side) and
\* `an_unclean_copy_level_with_an_idle_leader_is_trusted_by_its_last_record_again`
\* (the replica's side).

SPECIFICATION ShipSpec

