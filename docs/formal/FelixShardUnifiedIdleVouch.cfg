\* No client writes: an idle, empty shard. A follower back from an unclean
\* crash with its log whole is level with its leader, so only a batch sent
\* anyway vouches for it, and with no client record that is `VouchEmpty`.
\* Every fair run trusts it again while that leader serves it. Expected to
\* pass.
\*
\* Evidence: `an_empty_shards_follower_is_sent_one_empty_vouch_per_process`
\* (the leader's side) and
\* `an_empty_unclean_copy_is_trusted_by_an_empty_leaders_batch` (the
\* replica's side).

SPECIFICATION ShipSpec

