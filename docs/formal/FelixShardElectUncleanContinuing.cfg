\* The rule adopted for #2047. A continuing open (the leader that served the
\* generation before, in the same process, not draining) counts fence answers
\* without the identity check and takes no answer's log. A copy the
\* short-copy or non-voter refusal would stop answers it, promising and
\* staying doubted, when its durable ballot names that leader at the
\* generation it served (`ContinuingTrustsBallot`) and it never lost its
\* promises to a wipe (`ContinuingKeptBallot`).
\*
\* FelixShardElectWipeNonVoter.cfg at `Adopt = 2` with two wipes, no
\* `OneNonVoter` and `WipeLeads`, the shape of the twins. No two leaders open
\* at one generation and the leader keeps every acknowledged record.
\*
\* No configuration shows a doubted copy served by this rule: here every
\* non-voter is a wiped copy, and `NeverContinuingCountsNonVoter` holds. A
\* short copy (`ShortCopy`) stops being one once it promises a newer leader,
\* so the model never has one whose ballot names that leader; and the
\* short-copy path (`RefuseShortCopy`, `Wipes > 0`) cannot be combined with
\* re-admission (`WipedNonVoter` needs `LosePromises`, which needs `Wipes = 0`).
\* The code's unclean crash makes the copy a learner by evidence; the model's
\* `Crash` does not.
\*
\* Twins: FelixShardElectUncleanContinuingBatchBallot.cfg (without
\* `ContinuingKeptBallot`) and FelixShardElectUncleanContinuingAnyCopy.cfg.
\*
\* Evidence: none yet; the code change for #2047 must cite tests here.

