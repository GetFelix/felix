\* The rule adopted for #2047. A continuing open (the leader that served the
\* generation before, in the same process, not draining) takes no answer's
\* log, and counts an answer from the copy it expects or one that attests a
\* kept ballot naming it at the generation it served. A copy the short-copy
\* or non-voter refusal would stop answers it, promising and staying
\* doubted, when its durable ballot names that leader there
\* (`ContinuingTrustsBallot`) and it never lost its promises to a wipe
\* (`ContinuingKeptBallot`). A copy that lost them still answers, as a
\* restored directory nothing marks does (`ContinuingForgottenAnswers`), and
\* is not counted.
\*
\* FelixShardElectWipeNonVoter.cfg at `Adopt = 2` with two wipes, no
\* `OneNonVoter` and `WipeLeads`, the shape of the twins. No two leaders open
\* at one generation and the leader keeps every acknowledged record.
\*
\* No configuration shows a doubted copy served by this rule: here every
\* non-voter is a wiped copy, and `NeverContinuingCountsNonVoter` holds. A
\* short copy (`ShortCopy`) stops being one once it promises a newer leader,
\* so the model never has one whose ballot names that leader; and the
\* short-copy path (`RefuseShortCopy`, `Wipes > 0`) cannot be combined with
\* re-admission (`WipedNonVoter` needs `LosePromises`, which needs `Wipes = 0`).
\* The code's unclean crash makes the copy a learner by evidence; the model's
\* `Crash` does not.
\*
\* Twins: FelixShardElectUncleanContinuingBatchBallot.cfg (without
\* `ContinuingKeptBallot`), FelixShardElectUncleanContinuingAnyCopy.cfg and
\* FelixShardElectUncleanContinuingCountsForgotten.cfg.
\*
\* Evidence: `a_continuing_joint_fence_counts_followers_answering_from_new_copies`
\* and `a_continuing_joint_fence_does_not_count_new_copies_that_attest_no_kept_ballot`
\* (felix-replication, `promotion::tests::joint`),
\* `a_learner_whose_ballot_names_the_leader_promises_its_next_generation`
\* (felix-replication, `replica::tests::non_voting`), and
\* `only_a_crash_on_a_directory_that_lost_nothing_keeps_its_promises`
\* (felix-broker-service, `node::storage::tests`).

