\* FelixRaftIdentityRootRestoreSameRun.cfg with the machine restarted, so no
\* run witness is left. The root goes back after the control plane heard its
\* last sequence in a heartbeat, and the gate fails a root below that.
\*
\* Evidence: gate comparison only; control-plane side not built (#2441).
\* `a_root_behind_the_control_plane_fails_the_gate` checks the comparison
\* with a sequence passed in, and
\* `a_rebooted_root_with_marks_and_no_copy_of_its_sequence_is_unchecked`
\* holds a root with neither copy until one arrives.

