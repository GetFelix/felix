    Servers = {a, b, c}
    Nobody = Nobody
    MaxTerm = 2
    MaxWrites = 0
    MaxRestarts = 1
    RateLo = 1
    RateHi = 2
    DriftLo = 1
    DriftHi = 2
    Lease = 1
    ElectionTimeout = 0
    Consumer = FALSE
    LeaseTooLong = FALSE
    DriftBeyondBound = FALSE
    LeaseFromAck = FALSE
    VoteInWindow = FALSE
    RestartForgetsWindow = FALSE
    RestartRenewsFollowed = FALSE
    DeliverUncommitted = FALSE
    StoreLeases = TRUE
    SupportTime = 2
    MaxEpoch = 3
    MaxBeats = 4
    MaxStalls = 0
    SupportNotDurable = FALSE
    VoteWhileSupported = FALSE
    LeaseKeptAcrossRestart = FALSE
    ResupportWithdrawn = FALSE
    WithdrawEarly = FALSE
    StalledKeepsAsking = FALSE
    ElectionTimeoutMin = 0
    RoleSync = TRUE
    LeaderBypass = FALSE
    MaxStepDowns = 0
    VoidOnHigherTerm = FALSE
    VoidEquality = FALSE
    MaxTransfers = 0
    TransferVoids = TRUE
    VoidBeforeSend = TRUE
    MaxSuspends = 0
    SuspendCheck = TRUE
    WakeCheckLate = FALSE
    RestoreOwnLead = FALSE
