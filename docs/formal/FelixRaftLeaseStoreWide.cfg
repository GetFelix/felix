\* FelixRaftLeaseStore.cfg with four liveness heartbeats. Not registered, run
\* by dispatch.
\*
\* It passes on two rules the design page states and nobody has built: a withdrawal
\* raises the epoch the supporter accepts, and a vote for another broker
\* waits for the withdrawal. It also passes on a third the page does not
\* state: the expiry is read on a clock that survives a restart.
\*
\* Evidence: none, store-liveness leases are the later design and are not built.

SPECIFICATION Spec

