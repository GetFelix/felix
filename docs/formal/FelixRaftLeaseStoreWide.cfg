\* FelixRaftLeaseStore.cfg with four liveness heartbeats. Not registered, run
\* by dispatch.
\*
\* It passes on rules the design page's paragraph on these leases does not
\* state (issue 2307): a withdrawal raises the epoch the supporter accepts, a
\* vote for another broker waits for the withdrawal, and the expiry is read
\* on a clock that survives a restart.
\*
\* Evidence: none, store-liveness leases are the later design and are not built.

SPECIFICATION Spec

CONSTANTS
    Servers = {a, b, c}
    Nobody = Nobody
    MaxTerm = 2
    MaxWrites = 0
    MaxRestarts = 1
    RateLo = 1
    RateHi = 2
    DriftLo = 1
    DriftHi = 2
    Lease = 1
    ElectionTimeout = 0
    Consumer = FALSE
    LeaseTooLong = FALSE
    DriftBeyondBound = FALSE
    LeaseFromAck = FALSE
    VoteInWindow = FALSE
    RestartForgetsWindow = FALSE
    DeliverUncommitted = FALSE
    StoreLeases = TRUE
    SupportTime = 2
    MaxEpoch = 3
    MaxBeats = 4
    MaxStalls = 0
    SupportNotDurable = FALSE
    VoteWhileSupported = FALSE
    LeaseKeptAcrossRestart = FALSE
    ResupportWithdrawn = FALSE
    WithdrawEarly = FALSE
    StalledKeepsAsking = FALSE

SYMMETRY Symm

INVARIANTS
    TypeOK
    LeaseExclusive
    NoAckBehindNewLeader
    OneLeaderPerTerm
