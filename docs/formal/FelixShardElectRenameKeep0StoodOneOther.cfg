\* A piece of FelixShardElectRename.cfg: the cut-overs whose new set keeps the
\* old leader, after no write was admitted, once one replica other than the
\* destination had promised a generation past the control plane's. The pieces
\* split every cut-over as FelixShardElectSwap{Keep,Drop}*.cfg do
\* (`CutOverPiece`), and each also checks everything before its cut-over. 3.7M
\* distinct states, depth 39, 11 min 00 s on a four-core CI runner.
\*
\* Evidence: `a_refusal_at_the_elected_generation_names_the_leader_again_above_it`
\*   and the other tests in services/felix-controlplane-service/src/cluster/
\*   placement/tests/refused.rs (the step, and when it is skipped);
\*   `a_promised_generation_is_recorded_as_refused`
\*   (services/felix-broker-service/src/shards/lifecycle/tests/refused.rs)
\*   and `a_fence_a_majority_promised_away_is_refused`
\*   (crates/server/felix-replication/src/promotion/tests.rs) for the two
\*   ways the leader cannot serve.

SPECIFICATION Spec

