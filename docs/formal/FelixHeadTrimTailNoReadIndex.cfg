\* FelixHeadTrim.cfg with a follower serving a tail read from its own
\* committed tail, without the leader's read index. A trim commits on the
\* leader and one follower and is acknowledged; the other follower, behind
\* it, starts a tail read below the floor and would deliver the records in
\* between live. This is why a follower's tail read applies the read index
\* too (issue 2603).
\*
\* Evidence: none, this models an alternative the design does not use.

SPECIFICATION Spec

CONSTANTS
    Brokers = {a, b, c}
    MaxWrites = 2
    MaxTrims = 3
    MaxGen = 2
    MaxCrashes = 0
    Local = FALSE
    FloorFromBase = FALSE
    ApplyOnStore = FALSE
    DeleteAboveCommit = FALSE
    Unconditional = FALSE
    Untagged = FALSE
    NoOpUnchecked = FALSE
    Retention = FALSE
    FollowerNoReadIndex = FALSE
    LeaderNoReadIndex = FALSE
    TailNoReadIndex = TRUE

SYMMETRY Symm

INVARIANTS
    NoReadBelowAckedTrim
    NothingLostAboveFloor
    NeverMoreThanAsked
    StaleTrimRefused
