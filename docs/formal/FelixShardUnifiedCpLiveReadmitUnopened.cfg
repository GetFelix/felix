\* Shape J: a copy back from an unclean crash is vouched, a readmission starts,
\* and its leader crashes uncleanly before it opens. Every fair run serves
\* again or has lost its trusted majority. Expected to pass.

SPECIFICATION LiveSpec

CONSTANTS
    Nodes = {a, b, c}
    First = a
    NoNode = NoNode
    MaxGen = 4
    MaxWrites = 0
    MaxStarts = 1
    MaxUnclean = 2
    MaxWipes = 0
    MaxRestores = 0
    MaxRetries = 0
    SetChoices = {{a, b, c}}
    OldPeers = {}
    LiveCp <- Yes
    FaultUntil <- Three

PROPERTY
    EventuallyServes

INVARIANTS
    OneLeaderPerGeneration
    AckedHeldByLeader
