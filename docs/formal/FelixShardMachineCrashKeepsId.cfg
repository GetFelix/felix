\* FelixShardProcessCrashKeepsId.cfg with the boot check taking a machine
\* crash for a process crash (`BootCheckBlind`): the follower's machine
\* crashes, it loses the record it had answered for, and it keeps its
\* identity, so placement promotes it on the report from before the crash.
\*
\* Expected to violate AckedSurvive: only a crash in the boot the run
\* recorded may keep the identity. TLC stops at the first counterexample.
\*
\* Evidence: this configuration REMOVES the boot check.
\* `a_crash_in_another_boot_rotates_the_id` -- keep the identity across a
\*   new boot and the follower comes back under the identity the report
\*   names, which is the trace TLC finds.
\* AckedOnLiveMajority is left out, as in FelixShardCrashKeepsId.cfg.

SPECIFICATION Spec

