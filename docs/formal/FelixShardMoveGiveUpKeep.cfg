\* FelixShardMoveGiveUp.cfg at replication factor 2, with the set one above
\* it from a staged destination, two writes, and every retake keeping the
\* destination. A trim fence drops the extra copy later.
\*
\* TLC finds every leader that opens holding every acknowledged record.
\* Deadlock is not checked: a leader that crashes uncleanly in a set of two
\* stalls it whatever the move rule, as its follower cannot fence a given-up
\* copy. FelixShardMoveGiveUpKeepLive.cfg checks liveness with the crash
\* during the move. FelixShardMoveGiveUpDrop.cfg is the same with the retake dropping the
\* destination.
\*
\* Evidence: the implementation behaviours this configuration asserts.
\* `a_fence_timeout_keeps_the_staged_destination` -- CpTimeout keeps it.
\* `an_abandoned_fence_keeps_the_staged_destination` -- so does Abandon.
\* `a_set_kept_above_its_factor_is_trimmed` -- CpTrimFence and
\*   CpTrim.

SPECIFICATION Spec

CONSTANTS
    Nodes = {a, b, c}
    First = a
    NoNode = NoNode
    MaxGen = 5
    MaxWrites = 2
    MaxCrashes = 1
    MaxMoves = 1
    Replication <- Two

INVARIANTS
    OneLeaderPerGeneration
    AckedHeldByLeader
    AtMostOneServing

CHECK_DEADLOCK FALSE
