\* rotates the cut broker's copy, and a copy counts an entry only below its
\* synced reservation. Three voters, one term, two writes, one process crash
\* and one power cut. No committed or acknowledged record is missing from a
\* broker that could win an election.
\*
\* Evidence: none, this models a proposal that is not built.

