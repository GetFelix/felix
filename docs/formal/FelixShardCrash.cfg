\* A follower crashes under `FsyncMode::Periodic` or `None` and loses a
\* suffix of its log it had answered for, keeping its data directory (#1284).
\* FelixShardWipeFull.cfg with the crash in place of the wipe, and the
\* broker's fix: a start that finds no clean stop recorded, after a run under
\* a relaxed fsync mode, takes a new storage identity before it registers.
\* From there the wipe's checks hold: the leader starts the follower's count
\* over when it learns the new identity, and placement never promotes it on
\* a report from before the crash. FelixShardCrashKeepsId.cfg is the same
\* without the new identity, and loses a record.
\*
\* MaxWrites = 1, so the suffix lost is the whole log, as in a wipe; the
\* action allows any shorter prefix. The clock runs to 3 for a promotion
\* after the crash, as in FelixShardWipeFull.cfg (about 4.5 minutes on a CI
\* runner).
\*
\* Evidence: the implementation behaviours this configuration asserts.
\* `a_crash_under_a_relaxed_fsync_mode_rotates_the_id` -- Crash: a run that
\*   did not record a clean stop, under `Periodic` or `None`, starts under a
\*   new identity.
\* `a_clean_stop_keeps_the_id_under_every_fsync_mode` -- only a crash
\*   changes the identity.
\* `a_crash_after_a_clean_restart_is_still_seen` -- starting a run takes the
\*   clean record away before anything is written.
\* `a_follower_that_crashed_under_periodic_fsync_is_not_counted_on_its_old_position`
\*   -- Probe: the leader stops counting the crashed follower.
\* `a_crashed_follower_is_not_promoted` -- ByLeaderReport: placement does
\*   not promote it on the report from before the crash.

