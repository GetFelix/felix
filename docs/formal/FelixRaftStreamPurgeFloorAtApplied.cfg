\* One rule dropped: the snapshot holds one floor, the member's at the
\* purge, and the tables fold against it. That floor is above the
\* snapshot's index, so a member that installs it or restarts from it does
\* not count a trim it applies again as raising the floor.
\*
\* Evidence: none, purging a Raft stream shard is not built yet (issue 2602).

