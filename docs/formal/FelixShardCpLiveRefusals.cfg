\* The refusal rules adopted for #2046, for liveness with the control plane
\* up (`CpLiveSpec`). FelixShardCpLive.cfg's fixes without restarts, at
\* generation 3, starting with the leader still fencing a failover's
\* assignment whose pins name every copy (`FailoverStart`). Two copies may
\* change one after the other and are admitted again by a joint fence at a
\* new generation (`CopyPins`). The leader may lose the set it leaves once
\* it opened (`SetLossUpTo`, `SetLossAfterOpen`). Candidates stand above the
\* control plane's generation as a route up to one generation old shows it
\* (`StandsAboveCp`, `StaleStandRoute`), at most twice in a behaviour
\* (`MaxStandings`, the backoff). Pins survive renames until the leader's
\* first fenced open and drop for a copy once it is admitted; a fence with
\* one promise away and the rest silent is refused even when another copy
\* answered; refusals for a lost set or a member ahead carry the ballot.
\* Twins, each with one rule off: FelixShardCpLiveRefusalsCopyExcluded.cfg,
\* FelixShardCpLiveRefusalsUnknownNoBallot.cfg,
\* FelixShardCpLiveRefusalsPinsForever.cfg.
\* Evidence: `a_refusal_rename_keeps_the_pins_until_the_leader_opens` and
\*   `an_admitted_member_loses_its_pin`
\*   (services/felix-controlplane-service/src/cluster/placement/tests/copy_pins.rs);
\*   `a_promise_away_beside_a_pinned_out_copy_is_refused`
\*   (crates/server/felix-replication/src/promotion/tests/identity.rs);
\*   `a_set_unknown_carries_the_newest_ballot_past_the_generation`
\*   (crates/server/felix-replication/src/promotion/tests/joint.rs);
\*   `a_replica_ahead_has_the_fence_refused_with_its_ballot`
\*   (crates/server/felix-replication/src/promotion/tests.rs);
\*   `a_candidate_stands_above_a_ballot_a_withdrawn_standing_left`
\*   (crates/server/felix-replication/src/election/candidate/tests.rs).

