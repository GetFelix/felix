\* Two fences at one generation, each leaving a two-seat set one of whose
\* seats lost its directory, with up to two lost directories, so both seats
\* of that set can be replaced while the fences run. A set change may name
\* one seat, so two fences can open apart unless the set they leave keeps
\* them apart. A fence counts half of a set it leaves without the seats it
\* knows were replaced. Expected to pass.
\*
\* Evidence: `a_fence_leaving_a_set_with_a_replaced_copy_opens_on_the_other_half`
\* and `a_replaced_copy_is_not_counted_toward_the_half`.

