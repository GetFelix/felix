\* FelixRaftLeaseStore.cfg with one broker's disk stalling and no restart. A
\* stalled broker sends no liveness heartbeats and grants no support, so its
\* lease runs out.
\*
\* It passes on rules the design page's paragraph on these leases does not
\* state (issue 2307): a withdrawal raises the epoch the supporter accepts, a
\* vote for another broker waits for the withdrawal, and the expiry is read
\* on a clock that survives a restart.
\*
\* Evidence: none, store-liveness leases are the later design and are not built.

