\* The crashed leader's refusal (`RefuseShortCopy`) beside a staged move's
\* destination, the shape of #1635. a and b hold the shard and c is staged
\* and copying, so it counts toward no acknowledgement. Placement keeps a
\* staged copy in the old set, so a failover's fence ids name it, and the
\* code's exception, which wants the ids to name exactly the two, refuses:
\* safe, but the shard stays closed. This drops that comparison
\* (`ShortCopyChecksKeys <- No`), the fix #1635 proposes, and keeps the
\* rest: the fencer's set is the two, the copy's last record is from the
\* generation it led, the fencer leads the next. It passes, so naming only
\* the set that acknowledged is safe here. Two promotions fit (`L = 1`, time
\* to 2), so the crashed leader can be one that opened with a start record.
\* TLC reaches the open on the exception (a temporary invariant saying no
\* leader opens on such an answer fails at depth 12).
\*
\* Identities are left out as in FelixShardShortCopySeat.cfg.
\*
\* A nightly walk: exhaustively it passes 30M distinct states with no end
\* in sight.
\*
\* Invariants: AckedHeldByLeader, AckedAgree, NoTruncationBelowHwm.
\*
\* Evidence: `a_crashed_leader_of_two_copies_takes_the_fence` (the exception)
\* and `a_quorum_failover_does_not_promote_a_move_destination` (a failover
\* drops the staged copy from the set).

