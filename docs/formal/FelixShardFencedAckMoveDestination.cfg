\* FelixShardFencedAckMove.cfg with a failover free to name the move's
\* destination, as placement did. The destination's broker takes that as the
\* cut-over it expected and opens without the fence, from a report that can
\* predate what the old leader acknowledged on its followers since. TLC finds
\* a record acknowledged on the old leader and the other follower missing
\* from the new leader (AckedHeldByLeader).
\*
\* Evidence: none, this models the placement before
\* `a_quorum_failover_does_not_promote_a_move_destination`.

