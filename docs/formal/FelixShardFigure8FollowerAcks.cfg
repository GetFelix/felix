\* FelixShardFencedAck.cfg from the seeded history in FelixShardFigure8.tla,
\* which reaches two more leaderships than the time-bounded runs can: a
\* wrote x at 1, b wrote y at 2, neither shipped. Acknowledgements come from
\* the followers' answers at the leader's generation, with no report and no
\* lease in the condition, and each promoted leader fences a majority and
\* writes its start record. c, promoted at 3, can acknowledge x only once a
\* majority has answered for its start record behind it.
\* FelixShardFigure8FollowerAcksNoStartRecord.cfg is this without it.
\*
\* Promotion still reads the report, which is what placement uses; it no
\* longer gates any acknowledgement, so the leader's view of what landed
\* (`AckOnResponse`) is off. AckedSurvive is not checked: without the lease a
\* deposed leader serves until it hears of its successor.
\*
\* 7.67M distinct states, depth 36, 58 s on sixteen cores.
\*
\* Evidence: `held_at_generation` and `counted_offset` (quorum.rs), and
\* `write_generation_start` (lifecycle.rs).


