\* FelixRaft.cfg with one rule dropped. `truncate_after` returns before the
\* cut is on disk, and the next flush makes it durable. A follower learns the
\* commit of the entry that replaced the cut tail before it flushes. A crash
\* then brings the old tail back under the stored commit index, and the
\* restart applies an entry that was never committed.
