\* FelixRaft.cfg with one rule dropped. `truncate_after` is not on disk
\* before a later append is reported flushed. After a crash the old tail is
\* back behind the new entry, which the open-time scan reads as a log whose
\* terms go down.
\*
\* Evidence: none, this models an alternative the implementation does not use.

