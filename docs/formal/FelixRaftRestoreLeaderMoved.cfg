\* FelixRaftRestore.cfg where the copied copy stops leading after the point
\* and falls behind its reservation before the copy: epoch 0 acknowledges an
\* offset no restored reservation or floor knows of, and the re-form gives it
\* out again although it was acknowledged before the backup was taken.
\*
\* Evidence: `a_leader_that_moved_after_the_point_needs_the_gap` -- with no
\*   gap the first index is an offset acknowledged after the point. The
\*   default gap closes it (FelixRaftRestoreGap.cfg).

SPECIFICATION Spec

CONSTANTS
    MaxWrites = 4
    MaxAfter = 2
    MaxNew = 1
    Step = 2
    Gap = 0
    Rate = 10
    TimeRate = 0
    MaxTime = 0
    MaxRestores = 1
    NoReserve = FALSE
    LeaderMoves = TRUE

INVARIANT
    ReserveCovers
    BaseKept
    BackedUpNeverReused
