\* FelixRaftStreamPurgeTwoReforms.cfg at four entries, three members, no restart.
\*
\* Every rule on with two re-forms: a write and a trim between them, a floor
\* raised above the one the first carried, and a trim entry purged are all
\* reached (the FelixRaftStreamPurgeReachTwoReforms*.cfg witnesses).
\* Evidence: none, purging a Raft stream shard is not built yet (issue 2602).

SPECIFICATION Spec

CONSTANTS
    Members = {a, b, c}
    Voters = {a, b, c}
    MaxIndex = 4
    MaxTrims = 2
    MaxChanges = 0
    MaxRestarts = 0
    MaxReforms = 2
    PurgeBelowFloorRule = TRUE
    InstallRule = TRUE
    InstallFloor = "max"
    LeaderCaps = FALSE
    SnapAtApplied = FALSE
    TablesAtApplied = FALSE
    SnapFloorAtP = TRUE
    SnapCarriesHeaders = TRUE
    DropFirst = FALSE
    ReformReads = "full"
    ReformCarriesFloor = TRUE
    ReformStoresFloor = TRUE

SYMMETRY Symm

INVARIANTS
    TypeOK
    NoReadBelowFloor
    NoAckedLoss
    PurgeBelowFloor
    AppliedCoversPurge
    TablesAgree
    HeadersAgree
    OffsetNeverReused
    CatchUpPossible
