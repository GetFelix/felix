\* The bounds of FelixRaftStreamPurgeTwoReforms.cfg, with two entries, so it finishes in a CI job.
\*
\* Every rule on with a learner and two re-forms: the floor a re-form
\* carries into a copy is read by the next one. Two entries, one restart.
\*
\* Evidence: none, purging a Raft stream shard is not built yet (issue 2602).

SPECIFICATION Spec

CONSTANTS
    Members = {a, b, c, d}
    Voters = {a, b, c}
    MaxIndex = 2
    MaxTrims = 2
    MaxChanges = 0
    MaxRestarts = 1
    MaxReforms = 2
    PurgeBelowFloorRule = TRUE
    InstallRule = TRUE
    InstallFloor = "max"
    LeaderCaps = FALSE
    SnapAtApplied = FALSE
    TablesAtApplied = FALSE
    SnapFloorAtP = TRUE
    SnapCarriesHeaders = TRUE
    DropFirst = FALSE
    ReformReads = "full"
    ReformCarriesFloor = TRUE
    ReformStoresFloor = TRUE

SYMMETRY Symm

INVARIANTS
    TypeOK
    NoReadBelowFloor
    NoAckedLoss
    PurgeBelowFloor
    AppliedCoversPurge
    TablesAgree
    HeadersAgree
    OffsetNeverReused
    CatchUpPossible
