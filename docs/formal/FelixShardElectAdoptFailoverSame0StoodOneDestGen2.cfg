\* A piece of FelixShardElectAdoptFailover.cfg, which did not finish in six
\* hours: the behaviours whose first failover takes generation 2, where the
\* promoted broker's own set is the control plane's, no write was admitted, and
\* exactly one replica had promised past the control plane's
\* generation, the promoted broker itself.
\* FelixShardElectAdoptFailoverSame0StoodGen2 ran out of runner disk, so it is
\* split again by `PieceStoodCounts` and `PieceDestStood`; the four together
\* cover it. Each also checks everything before its failover.
\* Not measured yet.
\*
\* Evidence: as FelixShardElectAdoptFailover.cfg, `a_failover_fences_both_the_recorded_set_and_the_logs`
\*   and `a_log_set_naming_another_copy_is_fenced_beside_the_one_before`
\*   (crates/server/felix-replication/src/promotion/tests/joint.rs).

