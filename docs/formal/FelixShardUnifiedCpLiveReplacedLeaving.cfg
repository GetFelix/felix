\* A set change to two seats opens, one of them loses its directory, and a set
\* change back to three seats leaves the two-seat set. Its fence can never take
\* a majority of that set: the lost copy promises nothing again. With
\* `ReplacedBlocking` the fence counts half of the set without the replaced
\* seat, and every fair run serves again. Expected to pass; without the rule
\* (FelixShardUnifiedCpLiveReplacedLeavingLegacy.cfg) it stalls.
\*
\* Evidence: `a_fence_leaving_a_set_with_a_replaced_copy_opens_on_the_other_half`.

SPECIFICATION LiveSpec

CONSTANTS
    Nodes = {a, b, c}
    First = a
    NoNode = NoNode
    MaxGen = 5
    MaxWrites = 0
    MaxStarts = 2
    MaxUnclean = 0
    MaxWipes = 1
    MaxRestores = 0
    MaxRetries = 0
    SetChoices = {{a, b}, {a, b, c}}
    OldPeers = {}
    LiveCp <- Yes
    FaultUntil <- Three
    ReplacedFirst <- Yes
    ReplacedBlocking <- Yes

PROPERTY
    EventuallyServes

INVARIANTS
    OneLeaderPerGeneration
    AckedHeldByLeader
