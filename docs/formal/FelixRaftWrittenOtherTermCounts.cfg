\* One rule dropped: a report counts by its index, whatever term its log id
\* carries. A deposed leader's unreplicated tail reaches past the new
\* leader's record, the new leader counts it, and the deposed leader can be
\* elected again without the record. No broker loses power.
\*
\* Evidence: none, this models an alternative the implementation does not use.

