\* FelixShardElectUnclean.cfg as the code is today: any batch a newer leader
\* ships vouches for the restarted copy (`unclean.vouch` in replica.rs). A
\* leader that lost a suffix in its crash takes the next leader's batch with
\* only the first lost record back, and then counts again: it stands, the
\* empty third copy votes for it, and it opens without the second record
\* the crashed leader acknowledged.
\*
\* Expected to violate AckedHeldByLeader until the vouch waits for a record
\* of the shipping leader's generation (#2029).
\*
\* Evidence: `a_batch_vouches_for_the_copy_after_an_unclean_start`
\* (replica/tests/fence.rs) in crates/server/felix-replication.

