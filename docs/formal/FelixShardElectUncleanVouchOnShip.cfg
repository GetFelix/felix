\* FelixShardElectUnclean.cfg with the rule before #2029: any batch a newer
\* leader ships vouches for the restarted copy. A
\* leader that lost a suffix in its crash takes the next leader's batch with
\* only the first lost record back, and then counts again: it stands, the
\* empty third copy votes for it, and it opens without the second record
\* the crashed leader acknowledged.
\*
\* Expected to violate AckedHeldByLeader: the vouch has to wait for a record
\* of the shipping leader's generation (#2029).
\*
\* Evidence: this configuration REMOVES that wait.
\* `a_partly_reshipped_copy_is_not_vouched_for_until_it_reaches_the_leaders_generation`
\*   (replica/tests/fence.rs) -- vouch on any batch and the copy answers the
\*   next fence while still short, which is the trace TLC finds.

SPECIFICATION Spec

CONSTANTS
    Brokers = {a, b, c}
    L = 4
    Margin = 0
    Eps = 0
    Drift = 0
    MaxTime = 0
    MaxWrites = 2
    CheckAtCommit = FALSE
    Quorum = TRUE
    Promotion = "log-order"
    ReportBeforeAck = FALSE
    Handoff = FALSE
    WaitForDrained = TRUE
    FenceAtClaim = TRUE
    AckOnAdmit = FALSE
    FenceFromAdmit = FALSE
    MaxMoves = 0
    Planners = {}
    CasWrites = TRUE
    StageMove = FALSE
    LearnerVotes = FALSE
    Resends = FALSE
    SequencesInLog = TRUE
    Cancel = FALSE
    CancelCas = TRUE
    ReportBound = "acknowledged"
    AckChecksLease = FALSE
    AckOnResponse = FALSE
    AckByFollowers = TRUE
    FenceOnPromote = TRUE
    LabelOnReceipt = FALSE
    StartRecord = TRUE
    ReportFromAnswers = FALSE
    ReportFloor = FALSE
    Spares = {}
    ReplaceOnPromote = FALSE
    SeatHoldsCopy = TRUE
    Grow = FALSE
    PromoteDestination = FALSE
    Counters = FALSE
    CounterCatchUp = FALSE
    Ballots = TRUE
    Elections = 2
    FenceEveryChange = FALSE

    Suspicions = 0
    SetCheck = FALSE
    JointFence = FALSE
    Adopt = 0
    AdoptMatch = TRUE
    Swaps = 0
    PreVote = FALSE
    Wipes = 0
    StorageIds = TRUE
    UncleanCrashes <- One
    UncleanLeads <- Yes
SYMMETRY Symm

INVARIANTS
    TypeOK
    OneLeaderPerGeneration
    AckedHeldByLeader
    AckedAgree
    NoTruncationBelowHwm
