\* FelixRaftReformStaleMembership.cfg with relaxed fsync: a and b may both
\* lose power and rotate. Membership entries are synced in every fsync mode,
\* so a rotated copy keeps them, its report names d, and d is waited for. No
\* client write. Not registered, run by dispatch: over 20M distinct states.
\* 
\* It passes on two rules the design page does not have yet (issue 2304): a
\* rotated voter still sends a retire report, and a new copy announces itself
\* so that its old report is dropped. It does not show the design as written
\* is safe.
\* 
\* Evidence: none, re-forming is not built yet (track 4 of issue 2244).

