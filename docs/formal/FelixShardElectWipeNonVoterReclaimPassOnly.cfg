\* FelixShardElectWipeNonVoterReclaim.cfg with the given-up leader's probe
\* naming nobody as holding the start record (`ProbeHoldsStart` off), as
\* the code did before. TLC is expected to find the liveness violation: the learner
\* holds the generation's start record on every log, its leader crashes and
\* gives the copy up before a pass reports it, and from then on no report
\* can admit it (LearnerAdmitted). In the code the shard then waits as
\* `NoCaughtUpReplica` for good: the only copy that holds everything is the
\* learner, which failover never names.
\*
\* Evidence: `the_probe_names_a_follower_holding_the_generation_it_gave_up`
\* in crates/server/felix-replication/src/reclaim/tests.rs fails with the
\* probe's `holds_start` left empty.

