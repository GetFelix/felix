\* Idempotent batches of several records on a Raft shard, every rule on: two
\* members, two producers with two batches each of two or three records, two
\* changes of leader, two purges and any number of snapshot installs. A purge
\* that passes a cut batch keeps its sequence and not its count, so that
\* member refuses the re-send.
\* MaxLog is every piece the producers can send, so it never binds.
\*
\* Evidence: none, idempotent batches of several records on a Raft shard are not
\*   built yet (issue 2524).

SPECIFICATION Spec

CONSTANTS
    Members = {a, b}
    Producers = {p, q}
    MaxSeq = 2
    Lens = {2, 3}
    MaxChanges = 2
    MaxPurges = 2
    MaxLog = 12
    TermBoundBatch = TRUE
    ResendFinishes = TRUE
    AtPurge = "refuse"
    TableAtAppend = TRUE
    HeldAfterCommit = TRUE

SYMMETRY Symm

INVARIANTS
    TypeOK
    BatchExactlyOnce
    BatchInOrder
    ProducerPlaceAgrees
