\* FelixShardElectSet.cfg with the control plane adopting leaders it never
\* named (`Adopt = 2`): a replica that opened above the control plane's
\* generation on the set the control plane records becomes its leader, and
\* the control plane carries on from there, replacing followers with it as
\* leader. A leader on another set only moves the control plane's generation
\* past its own. Checks that the control plane's leader, once open, leads the
\* set the control plane records (AdoptedMatchesOpened), with the record
\* invariants. Its first run found a deposed leader that answered the
\* adopted leader's fence going on leading, counting a majority of the set it
\* had just learned there (AckedOnMajority); a leader that answers a newer
\* fence now stops. Replicas stand only up to generation 2 here (`Adopt`
\* bounds elections too); the control plane's own changes go on past it.
\* 7.90M distinct states, 10.7 min on a four-core CI runner.
\* FelixShardElectAdoptPromote.cfg adds promotion on suspicion, without a
\* spare.
\* FelixShardElectAdoptNoSetCheck.cfg is this without the set check.
\*
\* Evidence: none yet, nothing in the code elects a leader.

