\* FelixRaftStreamPurge.cfg with five entries, so two trims fit with records
\* between them. Not registered: run on a build box. Three voters, five entries, two trims, one change of leader, one restart and one
\* re-form. A purge writes the stream snapshot at the purge point, below the
\* floor, with the floor and the tables as of that point; the leader purges
\* no further than its slowest member's match.
\*
\* Evidence: none, purging a Raft stream shard is not built yet (issue 2602).

SPECIFICATION Spec

CONSTANTS
    Members = {a, b, c}
    Voters = {a, b, c}
    MaxIndex = 5
    MaxTrims = 2
    MaxChanges = 1
    MaxRestarts = 1
    MaxReforms = 1
    PurgeBelowFloorRule = TRUE
    InstallRule = TRUE
    LeaderCaps = TRUE
    SnapAtApplied = FALSE
    TablesAtApplied = FALSE
    ReformReads = "full"
    ReformCarriesFloor = TRUE

SYMMETRY Symm

INVARIANTS
    TypeOK
    NoReadBelowFloor
    NoAckedLoss
    PurgeBelowFloor
    TablesAgree
    OffsetNeverReused
    CatchUpPossible
