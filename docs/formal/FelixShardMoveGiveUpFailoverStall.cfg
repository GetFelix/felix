\* FelixShardMoveGiveUpFailoverDrop.cfg for liveness, one write, the crash
\* while the set is above the factor. TLC finds the promoted follower
\* fencing for good (EventuallyServes): the failover dropped the destination,
\* and the set left needs the dead leader's given-up copy.
\*
\* Evidence: none, this models the rule the implementation had before the fix.

SPECIFICATION LiveSpec

CONSTANTS
    Nodes = {a, b, c}
    First = a
    NoNode = NoNode
    MaxGen = 6
    MaxWrites = 1
    MaxCrashes = 1
    MaxMoves = 0
    Replication <- Two
    DeadFailover <- Yes
    FailoverDrops <- Yes
    CrashesAboveFactor <- Yes

INVARIANTS
    OneLeaderPerGeneration
    AckedHeldByLeader
    AtMostOneServing

PROPERTY
    EventuallyServes

CHECK_DEADLOCK FALSE
