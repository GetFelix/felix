\* FelixShardSessionsSubscriber.cfg with the subscriber reading to the end
\* of the broker's log instead of its mark. TLC finds a record handed out
\* before a majority held it and a successor holding its own generation's
\* start record at that offset (NoLostDelivery).
\*
\* Evidence: `readers_keep_the_mark_without_the_lease_where_followers_decide_it`
\* checks that a reader past the lapse is still bounded by the mark.

