\* FelixHeadTrim.cfg with readers skipping trim records, as issue 1662 first
\* designed them. Holder 1 takes the lease but has not written when it
\* passes to holder 2, which makes its fenced write and trims past it.
\* Holder 1 reads from the floor, finds no newer epoch, writes at the tail
\* and trims after holder 2. This is why a trim record carries its holder's
\* epoch to readers.
\*
\* Evidence: none, this models the design before the model changed it.

SPECIFICATION Spec

CONSTANTS
    Brokers = {a, b, c}
    MaxWrites = 2
    MaxTrims = 2
    MaxGen = 3
    Local = FALSE
    FloorFromBase = FALSE
    ApplyOnStore = FALSE
    DeleteAboveCommit = FALSE
    Unconditional = FALSE
    HiddenTrims = TRUE

SYMMETRY Symm

INVARIANTS
    NoReadBelowAckedTrim
    NothingLostAboveFloor
    NeverMoreThanAsked
    StaleTrimRefused
