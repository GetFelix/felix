\* FelixHeadTrim.cfg as issue 1662 first designed it: readers skip trim
\* records and CursorTooOld carries no tag. Holder 1 takes the lease but has
\* not written when it passes to holder 2, which makes its fenced write and
\* trims past it. Holder 1, refused as too old, resumes at the floor, finds
\* no newer epoch, writes at the tail and trims after holder 2. This is why
\* CursorTooOld carries the tag of the trim that set the floor.
\*
\* Evidence: none, this models the design before the model changed it.

SPECIFICATION Spec

CONSTANTS
    Brokers = {a, b, c}
    MaxWrites = 2
    MaxTrims = 3
    MaxGen = 3
    MaxCrashes = 0
    Local = FALSE
    FloorFromBase = FALSE
    ApplyOnStore = FALSE
    DeleteAboveCommit = FALSE
    Unconditional = FALSE
    Untagged = TRUE
    NoOpUnchecked = FALSE
    Retention = FALSE

SYMMETRY Symm

INVARIANTS
    NoReadBelowAckedTrim
    NothingLostAboveFloor
    NeverMoreThanAsked
    StaleTrimRefused
