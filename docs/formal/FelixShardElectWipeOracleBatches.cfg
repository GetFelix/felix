\* FelixShardElectWipeOracle.cfg with the waiting replica still taking
\* batches, a bootstrap and a fetch from a leader the control plane has not
\* adopted (`WipedTakesBatches`, open question 2). Taking records is not a
\* vote, but acknowledging them is: b opens at 2 on {a, b}; a stands at 3
\* with c's answer and opens; c is wiped; b, deposed but not told, ships its
\* write to c, which takes it while it waits, and b acknowledges it on
\* {b, c}; a, the leader at 3, does not hold it (AckedHeldByLeader).
\*
\* Evidence: none yet, nothing in the code elects a leader.

