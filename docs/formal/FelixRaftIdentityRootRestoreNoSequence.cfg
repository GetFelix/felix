\* FelixRaftIdentityRootRestoreSameRun.cfg with one rule dropped. The gate
\* does not compare the root sequence. A root put back from a backup of the
\* current run reads as a crash, and its copy votes again in a term it already
\* voted in (issue 2303).
\*
\* Evidence: none, this models an alternative the implementation does not use.

