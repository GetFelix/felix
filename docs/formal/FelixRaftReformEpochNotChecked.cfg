\* FelixRaftReform.cfg with one rule dropped: a member takes a late append
\* from the old epoch. It still cannot cut the base out of its log, because
\* a member starting the new epoch saves the end of the base as its commit
\* index before it takes any append (issue 2419), and the log refuses a cut
\* below that. The pass rests on that save alone. The epoch check is a second
\* guard.
\* 
\* Evidence: none, this models an alternative the implementation must not use.

