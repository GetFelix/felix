\* FelixRaftReform.cfg with one rule dropped: a member takes a late append
\* from the old epoch. It still cannot cut the base out of its log, because
\* a member of the new epoch starts with the base as its saved commit index
\* and the log refuses a cut below that (issue 2402). The epoch check is a
\* second guard, and this config shows the first one holds alone.
\* 
\* Evidence: none, this models an alternative the implementation must not use.

SPECIFICATION Spec

CONSTANTS
    Brokers = {a, b, c}
    InitBrokers = {a, b, c}
    None = None
    MaxEpoch = 1
    MaxTerm = 2
    MaxWrites = 2
    MaxChangeSteps = 0
    ChangeOut = None
    ChangeIn = None
    MaxPlace = 0
    MaxRotations = 0
    MaxRejoins = 0
    MaxRestarts = 0
    MaxMsgs = 1
    MaxPlans = 1
    MaxDead = 0
    DeadRuns = FALSE
    WaitPlaced = TRUE
    Floor = "trailing"
    ReformBeforeAll = FALSE
    EpochNotChecked = TRUE
    ReportNotPromise = FALSE
    PlanNotRechecked = FALSE
    RotatedNotWaited = FALSE
    RetireNotDurable = FALSE
    BaseNotHighest = FALSE
    NoCas = FALSE
    SoloPlacedTwo = FALSE
    StopNotRechecked = FALSE
    PlacedForgotten = FALSE
    FloorIndexOnly = FALSE

SYMMETRY Symm

INVARIANTS
    AckedSurvive
