\* The cache shard's state machine, as the second design on issue 2238 has
\* it, with snapshots, restarts and retries: two members, an add and a
\* put-if-absent, three proposals (retries included), one leader change,
\* one crash, two snapshots, one read, no clock. Every rule on.
\* FelixRaftCacheClock.cfg has expiry and clocks.
\* Evidence: none, cache groups on Raft are not built yet (issue 2238).

