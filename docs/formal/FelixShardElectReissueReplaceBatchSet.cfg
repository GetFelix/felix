\* A follower that takes a leader's set during a change without the set being
\* left: FelixShardElectReissueReplace.cfg with one write, adoption up to
\* generation 4, candidates standing no lower than the kept set's generation
\* (`StandsAboveKeptSet`), refusals that teach no set, and `LearnsLeavingSet`
\* off. A follower that learns the reissued leader's set from a batch rather
\* than its fence keeps the wrong set as the one being left, so a later
\* candidate fences no majority of the elected set and opens without the
\* acknowledged write. Violates `AckedHeldByLeader`: a broker must take the
\* set being left from the leader's fence, never from a batch.
\*
\* Evidence: none. It models a design the code must not use, to show why.

