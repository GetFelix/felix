\* FelixHeadTrim.cfg with the trim appended at whatever the tail is. The old
\* holder, not yet told of the takeover, trims after the new holder's
\* fenced write. This is why the trim names the tail it expects.
\*
\* Evidence: none, this models an alternative the design does not use.

SPECIFICATION Spec

CONSTANTS
    Brokers = {a, b, c}
    MaxWrites = 2
    MaxTrims = 2
    MaxGen = 3
    Local = FALSE
    FloorFromBase = FALSE
    ApplyOnStore = FALSE
    DeleteAboveCommit = FALSE
    Unconditional = TRUE
    ResumeAtEarliest = FALSE

SYMMETRY Symm

INVARIANTS
    NoReadBelowAckedTrim
    NothingLostAboveFloor
    NeverMoreThanAsked
    StaleTrimRefused
