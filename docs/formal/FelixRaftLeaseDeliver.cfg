\* FelixRaftLease.cfg for the delivery rule: two writes and the subscriber
\* reading across a change of leader. Clocks do not drift here and the lease
\* and the election timeout are both one tick, which keeps two writes
\* affordable; the lease checks are in FelixRaftLease.cfg.
\*
\* No broker restarts here, as in FelixRaftLease.cfg: see the note there on
\* issue 2307.
\*
\* Evidence: none, `admit_local_ack` always refuses until these configs pass
\* and the restart rule of issue 2307 is built.

SPECIFICATION Spec

