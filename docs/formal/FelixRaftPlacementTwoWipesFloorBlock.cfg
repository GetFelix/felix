\* FelixRaftPlacementTwoWipesFloor.cfg with no waiver. Two of three
\* members lost their volumes, so the members that report a term cannot
\* prove the floor and each wiped member blocks: it answers no leader and
\* never votes again, unless the other catches up first. The group stalls
\* instead of losing an acked write.
\*
\* Evidence: `past_the_failure_tolerance_the_floor_blocks_until_waived`,
\*   `the_block_lifts_once_a_withheld_member_reports_a_term`.

