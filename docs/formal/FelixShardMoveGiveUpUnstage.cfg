\* FelixShardMoveGiveUpDrop.cfg with the drop before the fence instead: a
\* staged move given up drops its destination from the set of three
\* (`UnstageDrops`), as `undo_staged` once did. A leader with no earlier
\* pass counts a staged destination toward the quorum, so a record can be
\* acknowledged on the leader and the destination alone. TLC finds it gone
\* (AckedHeldByLeader): the leader crashes and loses it, the destination
\* leaves, and the leader is reclaimed over the one follower left.
\*
\* Evidence: none, this models the rule the implementation had before the fix.

SPECIFICATION Spec

CONSTANTS
    Nodes = {a, b, c}
    First = a
    NoNode = NoNode
    MaxGen = 5
    MaxWrites = 2
    MaxCrashes = 1
    MaxMoves = 1
    Replication <- Two
    UnstageDrops <- Yes

INVARIANTS
    OneLeaderPerGeneration
    AckedHeldByLeader
    AtMostOneServing

CHECK_DEADLOCK FALSE
