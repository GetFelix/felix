\* FelixRaftReformTwoRotatedOffsets.cfg with two terms (issue 2402). a appends
\* a record in term 1 that reaches nobody. b and c acknowledge another record
\* at the same offset in term 2 and then lose their disks. a's log reaches the
\* floor's offset but does not hold the floor's entry, so the base is cut to
\* the commit index a saved and padded up to the floor. The new epoch never
\* serves a's record under that offset.
\* 
\* Evidence: none, re-forming is not built yet (track 4 of issue 2244).

