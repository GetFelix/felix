\* FelixHeadTrim.cfg with a holder whose read is refused as trimmed resuming
\* at the floor. The new holder trimmed past its own fenced write, so the old
\* holder sees no newer write, takes the tail and trims after it. This is
\* why a holder that has written steps down on a trimmed read instead.
\*
\* Evidence: none, this models a client the design does not allow.

SPECIFICATION Spec

CONSTANTS
    Brokers = {a, b, c}
    MaxWrites = 2
    MaxTrims = 2
    MaxGen = 3
    Local = FALSE
    FloorFromBase = FALSE
    ApplyOnStore = FALSE
    DeleteAboveCommit = FALSE
    Unconditional = FALSE
    ResumeAtEarliest = TRUE

SYMMETRY Symm

INVARIANTS
    NoReadBelowAckedTrim
    NothingLostAboveFloor
    NeverMoreThanAsked
    StaleTrimRefused
