\* FelixShardLeaderCrashGivesUp.cfg with the reclaim (#1295): placement may
\* name the leader that gave its copy up leader again, at the next
\* generation, once no follower's log is ahead of its own. Its crash can
\* lose a record no follower took, which no client was promised, and then
\* it leads again; a record a follower took keeps it from reclaiming.
\*
\* Evidence: the implementation behaviours this configuration asserts.
\* `no_follower_ahead_is_reclaimable` -- the given-up leader's probe of
\*   every follower.
\* `a_follower_not_heard_from_reports_nothing` -- a follower not measured
\*   leaves nothing to reclaim on.
\* `a_leader_that_gave_up_with_no_follower_ahead_is_reclaimed` -- Reclaim.
\* `a_reclaim_needs_every_follower_measured_since_the_crash` -- only on a
\*   fresh measurement of every follower.
\* `a_given_up_copy_no_follower_is_ahead_of_is_reclaimed` -- the broker
\*   leads it again only then.

SPECIFICATION Spec

