\* Two faults on one broker: its shard directory is emptied, and the whole
\* root goes back to a backup taken in the same run, before the wipe or after
\* it. A vote since the backup was a mark write, so the gate fails that
\* backup. The new copy stays a learner here, so its own mark write is not
\* what this shows.
\*
\* Evidence: `a_directory_put_back_after_a_wipe_rotates` and
\* `a_root_behind_the_witness_fails_the_gate_and_rotates`.

