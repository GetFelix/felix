\* Two faults on one broker: its shard directory is emptied, and the whole
\* root goes back to a backup taken in the same run, before the wipe or after
\* it. Every vote since the backup, and the making of the new copy, was a mark
\* write, so the gate fails a backup that is behind either.
\*
\* Evidence: none, copy ids are not built yet (issue 1331).

