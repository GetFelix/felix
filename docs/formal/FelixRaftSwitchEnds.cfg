\* Liveness: under weak fairness on the switch's steps, a switch ends with
\* the control plane's record and every member started. A write in flight,
\* a copy that lags, one wipe of a follower, a follower's power loss. A
\* temporal check, so no symmetry set.
\*
\* Evidence: none, the switch is not built yet.

