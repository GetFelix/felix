\* FelixShardCancelResend.cfg with the sequences in the leader's memory: the
\* retaken leader leads at a new generation, knows none of what it wrote
\* before, and stores a re-sent write a second time.
\* Evidence: none, this models the in-memory table the broker no longer uses
\* for a durable stream. FelixShardCancelResend.cfg cites the tests showing
\* the log is what is consulted.

SPECIFICATION Spec

CONSTANTS
    Brokers = {a, b, c}
    L = 4
    Margin = 2
    Eps = 1
    Drift = 0
    MaxTime = 2
    MaxWrites = 2
    CheckAtCommit = TRUE
    Quorum = FALSE
    Promotion = "leader-report"
    ReportBeforeAck = TRUE
    Handoff = TRUE
    WaitForDrained = TRUE
    FenceAtClaim = TRUE
    AckOnAdmit = TRUE
    FenceFromAdmit = TRUE
    MaxMoves = 2
    Planners = {}
    CasWrites = TRUE
    StageMove = FALSE
    LearnerVotes = FALSE
    Cancel = TRUE
    CancelCas = TRUE
    ReportBound = "acknowledged"
    AckChecksLease = TRUE
    AckOnResponse = FALSE
    AckByFollowers = FALSE
    FenceOnPromote = FALSE
    LabelOnReceipt = FALSE
    StartRecord = FALSE
    Spares = {}
    ReplaceOnPromote = FALSE
    Resends = TRUE
    SequencesInLog = FALSE

SYMMETRY Symm

INVARIANTS
    TypeOK
    AtMostOneServing
    AckedSurvive
    AckedAgree
    NoTruncationBelowHwm
    NoStaleCommit
    AckedOnMajority
    NoDuplicate
