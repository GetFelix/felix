\* Shape P under today's rules: the displaced leader is pinned out and the
\* doubted copy refuses. Expected to violate EventuallyServes.

SPECIFICATION LiveSpec

CONSTANTS
    Nodes = {a, b, c}
    First = a
    NoNode = NoNode
    MaxGen = 4
    MaxWrites = 0
    MaxStarts = 1
    MaxUnclean = 1
    MaxWipes = 0
    MaxRestores = 0
    MaxRetries = 0
    SetChoices = {{a, b, c}}
    OldPeers = {}
    LiveCp <- Yes
    FaultUntil <- Three
    UnifiedFence <- No

PROPERTY
    EventuallyServes

INVARIANTS
    OneLeaderPerGeneration
    AckedHeldByLeader
