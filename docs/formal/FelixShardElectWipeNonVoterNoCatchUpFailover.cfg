\* FelixShardElectWipeNonVoterNoCatchUp.cfg's fault with only the control
\* plane naming leaders (`Elections = 0`): the copy votes again once the
\* confirmed leader is open at its set's generation, caught up or not
\* (`ReadmitBeforeCatchUp`). TLC is expected to find an acknowledged write
\* the next leader does not hold (AckedHeldByLeader): re-admitted with an
\* empty log, the copy answers a failover's fence beside a broker that never
\* held the write. AckedOnMajority is left out, as it breaks at the
\* re-admission itself.
\*
\* Evidence: `a_set_naming_its_storage_id_readmits_it_after_catch_up` in
\* crates/server/felix-replication/src/replica/tests/non_voting.rs.

