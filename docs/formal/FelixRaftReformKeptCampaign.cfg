\* One re-form with kept copies over two terms of epoch 0 and one power
\* cut, where a voter can stand for election and lose (Campaign). A lone
\* candidate's vote then sits above every entry with no leader behind it,
\* and T leaves it out: a vote counts only when a majority of some voter
\* set voted at or above it. Nothing acknowledged that a read copy holds is
\* lost (KeptLossBound), and the base agrees with every committed entry.
\*
\* Evidence: crates/server/felix-storage/src/raft_copy/vouch.rs, plan_reform_as.

