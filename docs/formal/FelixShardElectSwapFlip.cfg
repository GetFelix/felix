\* The control plane's flip as the code writes it (`FlipNewGeneration`): once
\* the cut-over's leader reports its start record acknowledged on both sets,
\* `TakePendingSet` in placement/moves.rs writes the new set at the next
\* generation, naming that leader again, and it fences the new set alone
\* before it serves there. A candidate may have taken that generation already,
\* fencing both sets without the leader; the ballot refuses the second of the
\* two fences. Otherwise as FelixShardElectSwap.cfg, with one write.
\* FelixShardElectSwapFlipSkipsBallot.cfg answers the named leader's fence
\* whatever the ballot.
\*
\* Evidence: `a_cut_over_records_the_new_set_as_pending_and_takes_it_only_on_the_report`
\* (services/felix-controlplane-service/src/cluster/placement/tests/pending_set.rs)
\* for the new generation; `a_fence_from_a_second_leader_at_the_same_generation_is_refused`
\* (crates/server/felix-replication/src/replica/tests/fence.rs) and
\* `a_generation_promised_to_another_node_is_not_led`
\* (services/felix-broker-service/src/shards/lifecycle/tests.rs) for the
\* ballot. Nothing in the code elects a leader yet.

