\* FelixRaftWrittenPowerCut.cfg at failover bounds: two terms, one write,
\* one process crash and two power cuts, each of which rotates the cut
\* broker's copy. Not registered: see docs/formal/README.md for the
\* box run.
\*
\* Evidence: `a_copy_back_from_a_power_cut_does_not_vote_with_the_cut_log` --
\*   the copy that lost R to a power cut comes back under a new copy id and
\*   the other two elect no leader without R.

SPECIFICATION Spec

CONSTANTS
    Servers = {a, b, c}
    Nobody = Nobody
    InitVoters = {a, b, c}
    InitLearners = {}
    NewVoters = {a, b, c}
    MaxTerm = 2
    MaxWrites = 1
    MaxChanges = 0
    MaxCrashes = 1
    MaxPowerCuts = 2
    LearnerCounts = FALSE
    OtherTermCounts = FALSE
    JointOneHalf = FALSE
    WrittenCommits = FALSE
    CutRotates = TRUE
    Reserve = FALSE
    MaxReforms = 0
    MaxDead = 0
    Vouch = FALSE
    FloorHolder = FALSE
    ReplacedCopy = Nobody
    ReplacementCopy = Nobody

SYMMETRY Symm

INVARIANTS
    TypeOK
    OneLeaderPerTerm
    LogMatching
    LeaderCompleteness
    StateMachineSafety
    CommittedHeld
    AckedHeld
    AckedNeverLost
