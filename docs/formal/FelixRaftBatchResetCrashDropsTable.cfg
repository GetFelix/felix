\* One rule dropped: the reset's save does not keep the carried table. An
\* install that crashes between the save and the drop finishes with the base
\* and no table, and the member takes the re-send of a cut batch as new.
\*
\* Evidence: none, this is the order the code no longer takes.

SPECIFICATION Spec

CONSTANTS
    Members = {a, b}
    Producers = {p}
    MaxSeq = 1
    Lens = {3}
    MaxChanges = 1
    MaxPurges = 1
    MaxLog = 6
    TermBoundBatch = TRUE
    ResendFinishes = TRUE
    AtPurge = "refuse"
    TableAtAppend = TRUE
    HeldAfterCommit = TRUE
    InstallKeepsTable = TRUE
    SaveKeepsTable = FALSE
    MaxCrashes = 1

SYMMETRY Symm

INVARIANTS
    BatchExactlyOnce
