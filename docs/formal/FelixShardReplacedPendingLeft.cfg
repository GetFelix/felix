\* FelixShardFencedAckAnyReplaced.cfg with the joint fence (`SetCheck`,
\* `JointFence`) and placement promoting on suspicion up to generation 2.
\* It violates AckedHeldByLeader (#1878): a leads at 1 on {a, b, c} and
\* acknowledges a write on a and b; b is promoted at 2 on {b, c, d} and c
\* answers its joint fence, which never opens; c is promoted at 3 on
\* {a, c, d} and fences that set and {b, c, d}, but not {a, b, c}, which
\* the unopened failover was still leaving. c and d open at 3 without the
\* write. `Promotion = "any"` stands for placement reading a stale report:
\* `is_caught_up` reads a's report from generation 1, made before the write.
\* A failover replaces the pending old set (`Promote`), as `set_before` and
\* `logged_besides` in promotion/joint.rs never read the `leaving` set kept
\* at the generation before.
\*
\* Evidence: none yet (#1878).

