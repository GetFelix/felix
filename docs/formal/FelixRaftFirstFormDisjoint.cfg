\* Sets that share no broker. Before the mark the hold keeps the set, so the
\* two sets never both form. After the mark the model allows no move between
\* them (one-member swaps only); FelixRaftFormedSet.tla checks it. Passes.
\* Evidence: `a_set_holds_until_its_group_forms`,
\* `a_raft_member_set_with_an_internal_node_gets_a_replacement_in_one_pass`,
\* `an_operator_moves_a_raft_leader_only_to_a_member` and
\* `a_broker_placed_on_a_formed_group_does_not_form_it_again`.
CONSTANTS
    Brokers = {1, 2, 3, 4, 5, 6}
    Sets = {{1, 2, 3}, {4, 5, 6}}
    Hold = TRUE
    PerEpoch = TRUE
    MaxEpoch = 0
INIT Init
NEXT Next
INVARIANTS TypeOK OneGroup OneFirstSet
