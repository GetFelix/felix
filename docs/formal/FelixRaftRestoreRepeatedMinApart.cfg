\* FelixRaftRestoreRepeated.cfg with restores only three ticks apart, under
\* a clock skew of one tick. The line's lead over a skewed clock is not
\* closed by then: a later restore, planned on a slow clock, starts below an
\* offset the earlier one gave out. Four times the skew is the boundary the
\* docs state; FelixRaftRestoreRepeated.cfg (five apart) passes.
\*
\* Evidence: none, this pins the boundary of the guarantee.

SPECIFICATION Spec

CONSTANTS
    Rate = 1
    TimeRate = 2
    Gap = 10
    Skew = 1
    MinApart = 3
    MaxTime = 15
    MaxBackups = 2
    MaxRestores = 3
    Line = TRUE
    EndGap = FALSE

INVARIANT
    OffsetNeverReused
