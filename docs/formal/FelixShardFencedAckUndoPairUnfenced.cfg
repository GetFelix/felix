\* FelixShardFencedAckUndoPair.cfg with the undo made while the leader
\* serves, as placement made it before #1628 (`UndoUnfenced`). TLC finds a
\* record acknowledged on a and c alone, c dropped, and `{a, b}` holding it
\* on a only (AckedOnMajority).
\*
\* Evidence: `an_undo_beside_an_even_set_fences_first` (placement) fails the
\* same way with the fence taken out.

