\* The loss the early acknowledgement leaves open if a power cut kept the
\* broker's copy: every rule on and one power cut. The record is written on
\* the leader and one follower and acknowledged. One of the two loses power
\* before its fsync, comes back as the same voter, and it and the third
\* voter can elect without the record while the last copy is not heard.
\* FelixRaftWrittenPowerCut.cfg passes with the cut rotating the copy, as
\* the broker does (#2423).
\*
\* Evidence: `a_quorum_write_is_acknowledged_once_a_majority_has_written_it` --
\*   the record is acknowledged before any follower's fsync, which is the window
\*   a power cut needs. `a_copy_back_from_a_power_cut_does_not_vote_with_the_cut_log`
\*   shows the broker does not keep the copy.

