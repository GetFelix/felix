\* FelixShardElectWipeWaitsAll.cfg with open question 1's second variant:
\* the wiped replica's ballot is seeded from the bound, the control plane's
\* generation and leader at the wipe, as `PromiseFromRoutes` does. The seed
\* is below the generation the replica lost, so it refuses nothing more, and
\* TLC finds the same two leaders at generation 2 (OneLeaderPerGeneration).
\* No write here; with one, TLC can also find the seeded ballot taking the
\* deposed leader's batch at generation 1 once the wait ends
\* (AckedHeldByLeader).
\*
\* Evidence: none yet, nothing in the code elects a leader.

