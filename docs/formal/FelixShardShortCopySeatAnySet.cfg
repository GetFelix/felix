\* FelixShardShortCopySeat.cfg with the exception's set check dropped
\* (`ShortCopyChecksSet <- No`): the crashed leader answers whenever its last
\* record is from the generation it led and the fencer leads the next one.
\* TLC finds a record acknowledged on a and b at the joining generation, a
\* crashing with its start record and without the record, and c, promoted at
\* the next generation on `{a, b, c}`, opening on its own answer and a's
\* without it (AckedHeldByLeader).
\*
\* Dropping only the fence ids' comparison (`ShortCopyChecksKeys`) is not
\* enough (FelixShardShortCopySeatAnyKeys.cfg passes): no failover in the model shrinks the voting set, so the fencer's
\* set of two at the next generation is the two the crashed leader led.
\*
\* Evidence: `a_crashed_leader_of_a_set_that_shrank_to_two_refuses_the_fence`
\* (the check this removes).

SPECIFICATION Spec

CONSTANTS
    Brokers = {a, b, c}
    L = 1
    Margin = 0
    Eps = 0
    Drift = 0
    MaxTime = 1
    MaxWrites = 1
    CheckAtCommit = FALSE
    Quorum = TRUE
    Promotion = "any"
    ReportBeforeAck = FALSE
    Handoff = FALSE
    WaitForDrained = TRUE
    FenceAtClaim = TRUE
    AckOnAdmit = FALSE
    FenceFromAdmit = FALSE
    MaxMoves = 1
    Planners = {}
    CasWrites = TRUE
    StageMove = FALSE
    LearnerVotes = FALSE
    Resends = FALSE
    SequencesInLog = TRUE
    Cancel = FALSE
    CancelCas = TRUE
    ReportBound = "acknowledged"
    AckChecksLease = FALSE
    AckOnResponse = FALSE
    AckByFollowers = TRUE
    FenceOnPromote = TRUE
    LabelOnReceipt = FALSE
    StartRecord = TRUE
    Spares = {c}
    ReplaceOnPromote = FALSE
    SeatHoldsCopy = TRUE
    Grow = FALSE
    PromoteDestination = FALSE
    Counters = FALSE
    CounterCatchUp = FALSE
    Ballots = FALSE
    Elections = 0
    FenceEveryChange = FALSE
    Suspicions = 0
    SetCheck = FALSE
    JointFence = FALSE
    Adopt = 0
    AdoptMatch = TRUE
    Swaps = 0
    PreVote = FALSE
    Wipes = 1
    StorageIds = FALSE
    ReportFromAnswers = FALSE
    ReportFloor = FALSE

    CrashLoses <- Yes
    CrashLeader <- Yes
    GiveUpOnCrash <- Yes
    RefuseShortCopy <- Yes
    ShortCopyChecksSet <- No

SYMMETRY Symm

INVARIANTS
    TypeOK
    AckedHeldByLeader
    AckedAgree
