\* The bounds of FelixRaftStreamPurgeLearnerReform.cfg, with no change of leader, so it finishes in a CI job.
\*
\* Every rule on, with a learner, no change of leader, one restart and one
\* re-form: the carried re-form floor survives a restart. Three entries.
\*
\* Evidence: none, purging a Raft stream shard is not built yet (issue 2602).

SPECIFICATION Spec

CONSTANTS
    Members = {a, b, c, d}
    Voters = {a, b, c}
    MaxIndex = 3
    MaxTrims = 1
    MaxChanges = 0
    MaxRestarts = 1
    MaxReforms = 1
    PurgeBelowFloorRule = TRUE
    InstallRule = TRUE
    InstallFloor = "max"
    LeaderCaps = TRUE
    SnapAtApplied = FALSE
    TablesAtApplied = FALSE
    SnapFloorAtP = TRUE
    SnapCarriesHeaders = TRUE
    DropFirst = FALSE
    ReformReads = "full"
    ReformCarriesFloor = TRUE
    ReformStoresFloor = TRUE

SYMMETRY Symm

INVARIANTS
    TypeOK
    NoReadBelowFloor
    NoAckedLoss
    PurgeBelowFloor
    AppliedCoversPurge
    TablesAgree
    HeadersAgree
    OffsetNeverReused
    CatchUpPossible
