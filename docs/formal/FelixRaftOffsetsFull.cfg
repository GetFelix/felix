\* FelixRaftOffsets.cfg across a change of leader, with one client write: a
\* second blank entry and a membership entry land before or after the record.
\* About twenty minutes, so a pull request checks it only when FelixRaft.tla
\* or this file changes.
\*
\* Evidence: the raft_log adapter tests in felix-storage:
\*   `blank_and_membership_entries_are_records_clients_skip`,
\*   `a_blank_entry_must_name_its_own_generation`,
\*   `entries_read_back_with_their_term_and_kind`.

SPECIFICATION Spec

CONSTANTS
    Servers = {a, b, c}
    Nobody = Nobody
    MaxTerm = 2
    MaxWrites = 1
    MaxMembers = 1
    MaxCrashes = 0
    MaxSnapshots = 0
    Consumer = TRUE
    AckBeforeFlush = FALSE
    VoteNotDurable = FALSE
    LeaderResumes = FALSE
    TornTailKept = FALSE
    TruncateNotDurable = FALSE
    RecoveredTailUnsynced = FALSE
    SaveCommittedUnflushed = FALSE
    PurgeBeforeSnapshot = FALSE
    SnapshotTwoRenames = FALSE
    CommitPriorTerm = FALSE
    DeliverUncommitted = FALSE
    SkipsNotCounted = FALSE

SYMMETRY Symm

INVARIANTS
    TypeOK
    OneLeaderPerTerm
    LogMatching
    TermsMonotone
    LeaderCompleteness
    StateMachineSafety
    AppliedAgree
    AppliedInLog
    AckedSurvive
    PurgedCoveredBySnapshot
    OffsetsDense
    OffsetNeverReused
    DeliveredInOrder
    QuiescentServed
    AckedDelivered

PROPERTIES
    VoteNeverLowers
