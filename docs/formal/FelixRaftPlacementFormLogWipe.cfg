\* FelixRaftPlacementFormEarlyWipe.cfg where the wipe may take the log alone
\* (issue 2407). On the segment store the vote is in `store/log/` and the
\* forming mark and records beside it, so an emptied log directory keeps
\* the mark while every peer names the member. The member recorded that it
\* reached the vote before it voted, so it does not form again: it catches
\* up with a confirmed leader. A whole wipe is still possible.
\* FelixRaftPlacementFormLogWipeUnreached.cfg is this without the flag.
\*
\* Evidence: `a_member_whose_log_was_emptied_does_not_form_again`,
\*   `a_member_that_reached_the_vote_with_a_blank_log_lost_it`,
\*   `a_member_that_may_vote_has_the_reached_flag_from_its_start`.

