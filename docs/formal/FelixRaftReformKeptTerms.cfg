\* One re-form with kept copies across two terms of epoch 0, and one power
\* cut that keeps a copy's vote. The group is unmarked, so T decides which
\* copies are kept whole. Nothing acknowledged that a read copy holds is
\* lost (KeptLossBound) and no offset is given out with two records.
\*
\* Evidence: none, this models the design for #2250, which is not built.

