\* FelixShardWalkElect.cfg without the set check (`SetCheck = FALSE`): a
\* replica stands on the set it last knew, which for a follower is the set it
\* started in, and a set change opens without a fence. The walk has to find a
\* candidate opening without a record the newer set acknowledged
\* (AckedHeldByLeader).
