\* One rule dropped: in a joint configuration a majority of either half is
\* enough. A record after an uncommitted joint entry is acknowledged on a
\* majority of the new half, and the old voters that never saw the joint
\* entry elect without it. No broker loses power.
\*
\* Evidence: none, this models an alternative the implementation does not use.

