\* FelixRaftLeaseStepDown.cfg with no void on a higher term
\* (VoidOnHigherTerm off). The leader takes an append's answer naming a
\* candidate's higher term, adopts that vote and grants it at once; the
\* candidate wins while Felix's late view of the old leader still passes.
\* The lease's length does not matter here.
\*
\* Evidence: none, this models a node layer the implementation does not have.

