\* FelixShardSwapCounters.cfg with the counter mark counted on the new set
\* alone while a change is pending. The cut-over's leader b acknowledges a
\* counter update on {b, d} of the new set {a, b, d}, while the control
\* plane still records {a, b, c}, where only b holds it
\* (`CountersOnSetMajority` violated, 50K distinct states, a few seconds).
\* This is #1830 before its fix.
\*
\* Evidence: `a_pending_change_counts_counters_on_both_majorities`.

