\* FelixShardElectUnclean.cfg with the restarted process forgetting that
\* its ballot named itself (`UncleanForgetsLed`): it answers fences from a
\* copy that lost records it acknowledged as leader.
\*
\* Expected to violate AckedHeldByLeader: a candidate opens on the short
\* copy's answer without a record the crashed leader acknowledged.
\*
\* Evidence: this configuration REMOVES the refusal.
\* `a_copy_led_before_stays_led_after_it_stands` -- drop the snapshot it
\*   checks and the copy answers, which is the trace TLC finds.
\* AckedOnMajority is left out, as in the other crash configurations: the
\* crash itself takes a record off one copy of the majority.

SPECIFICATION Spec

CONSTANTS
    Brokers = {a, b, c}
    L = 4
    Margin = 0
    Eps = 0
    Drift = 0
    MaxTime = 0
    MaxWrites = 2
    CheckAtCommit = FALSE
    Quorum = TRUE
    Promotion = "log-order"
    ReportBeforeAck = FALSE
    Handoff = FALSE
    WaitForDrained = TRUE
    FenceAtClaim = TRUE
    AckOnAdmit = FALSE
    FenceFromAdmit = FALSE
    MaxMoves = 0
    Planners = {}
    CasWrites = TRUE
    StageMove = FALSE
    LearnerVotes = FALSE
    Resends = FALSE
    SequencesInLog = TRUE
    Cancel = FALSE
    CancelCas = TRUE
    ReportBound = "acknowledged"
    AckChecksLease = FALSE
    AckOnResponse = FALSE
    AckByFollowers = TRUE
    FenceOnPromote = TRUE
    LabelOnReceipt = FALSE
    StartRecord = TRUE
    ReportFromAnswers = FALSE
    ReportFloor = FALSE
    Spares = {}
    ReplaceOnPromote = FALSE
    SeatHoldsCopy = TRUE
    Grow = FALSE
    PromoteDestination = FALSE
    Counters = FALSE
    CounterCatchUp = FALSE
    Ballots = TRUE
    Elections = 2
    FenceEveryChange = FALSE

    Suspicions = 0
    SetCheck = FALSE
    JointFence = FALSE
    Adopt = 0
    AdoptMatch = TRUE
    Swaps = 0
    PreVote = FALSE
    Wipes = 0
    StorageIds = TRUE
    UncleanCrashes <- One
    UncleanLeads <- Yes
    UncleanForgetsLed <- Yes
    VouchOnGeneration <- Yes
SYMMETRY Symm

INVARIANTS
    TypeOK
    OneLeaderPerGeneration
    AckedHeldByLeader
    AckedAgree
    NoTruncationBelowHwm
