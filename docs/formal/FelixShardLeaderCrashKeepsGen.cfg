\* A leader that crashed under a relaxed fsync mode and came back before
\* placement failed it over, still leading at its generation, as before
\* #1295. It acknowledges a record on itself and one follower, crashes and
\* loses it, and serves on its lease without it. The rotation from
\* FelixShardCrashKeepsId.cfg's fix is in place: a new identity alone does
\* not stop the leader.
\*
\* Expected to violate AckedSurvive. FelixShardLeaderCrashGivesUp.cfg is the
\* same with the fix, and passes. The clock does not run: the record is
\* acknowledged and lost inside the first lease.
\*
\* Evidence: this configuration REMOVES the give-up.
\* `a_crashed_leader_gives_up_the_generation_it_led` -- drop it and the
\*   restarted broker opens the shard at its old generation from the copy
\*   that lost the record, which is the trace TLC finds.

SPECIFICATION Spec

