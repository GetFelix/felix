\* The broker as built: FelixShardRealMargins.cfg's margins, drift and
\* `Quorum` write, acknowledged on the report's answer and a valid lease, and
\* a promoted leader that fences a majority and takes the tail furthest ahead
\* before it serves (`FenceOnPromote`), with followers refusing any leader
\* older than the generation they persisted. Acknowledgements still come from
\* the report, not from the followers (`AckByFollowers = FALSE`).
\*
\* Checks that the fence and its catch-up change nothing the report and the
\* lease already keep, including that the promoted leader holds every
\* acknowledged record from the moment it opens (AckedHeldByLeader).
\*
\* 8.15M distinct states, depth 30, 55 s on sixteen cores: the fence's three
\* variables roughly treble FelixShardRealMargins.cfg.
\*
\* Evidence: the implementation behaviours this configuration asserts, beyond
\* FelixShardRealMargins.cfg's.
\* `a_promotion_waits_in_fencing_until_the_fence_is_done` -- fencing[b]: a
\*   promoted shard does not serve until the fence is done.
\* `without_a_majority_the_shard_stays_closed` -- OpenForWrites needs a
\*   majority, the leader included.
\* `a_newer_generations_log_replaces_the_leaders_own_suffix` and
\*   `a_longer_log_from_an_older_generation_is_not_taken` -- AnswerFence takes
\*   the log ahead by (last generation, length).
\* `an_older_leader_is_refused_after_the_fence` -- Ship refused below the
\*   generation a replica promised.
\* `a_moves_destination_is_not_held_for_the_fence` -- modelled on promotion
\*   only.

SPECIFICATION Spec

CONSTANTS
    Brokers = {a, b, c}
    L = 4
    Margin = 1
    Eps = 1
    Drift = 1
    MaxTime = 5
    MaxWrites = 1
    CheckAtCommit = TRUE
    Quorum = TRUE
    Promotion = "leader-report"
    ReportBeforeAck = TRUE
    Handoff = FALSE
    WaitForDrained = TRUE
    FenceAtClaim = TRUE
    AckOnAdmit = FALSE
    FenceFromAdmit = FALSE
    MaxMoves = 0
    Planners = {}
    CasWrites = TRUE
    StageMove = FALSE
    LearnerVotes = FALSE
    Resends = FALSE
    SequencesInLog = TRUE
    Cancel = FALSE
    CancelCas = TRUE
    ReportBound = "acknowledged"
    AckChecksLease = TRUE
    AckOnResponse = TRUE
    AckByFollowers = FALSE
    FenceOnPromote = TRUE
    LabelOnReceipt = FALSE
    StartRecord = FALSE

SYMMETRY Symm

INVARIANTS
    TypeOK
    AtMostOneServing
    AckedSurvive
    AckedHeldByLeader
    AckedAgree
    NoTruncationBelowHwm
    NoStaleCommit
    AckedOnMajority
    QuorumReportNamesASuccessor
