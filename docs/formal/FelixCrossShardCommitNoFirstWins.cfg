\* FelixCrossShardCommit.cfg with every decision record acting on its own,
\* so an abort for an ask that raced a proposed commit is sent too.
\* One txn, no forger, writer or leader change, so the walks reach it in budget.
\* Expected to violate Atomicity: one participant applies, another releases.
\*
\* Evidence: none, this models an alternative the design does not use.

SPECIFICATION Spec

CONSTANTS
    Parts = {p1, p2}
    NTxns = 1
    MaxTerm = 1
    MaxWrites = 0
    Forger = FALSE
    NoFirstWins = TRUE
    ReleaseOnTimeout = FALSE
    TrimUndone = FALSE
    NoFence = FALSE
    WriteCheckEarly = FALSE
    ApplyWithoutLock = FALSE
    NoTokenCheck = FALSE

INVARIANTS
    Atomicity
