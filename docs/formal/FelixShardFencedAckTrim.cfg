\* FelixShardFencedAckSeatPair.cfg without the seat: the replication factor
\* is two, below the set `{a, b, c}` the shard starts with, as after the
\* factor is lowered (`LoweredFactor`). Nothing is replaced (`MaxMoves = 0`),
\* so the seat's window (#1616) cannot open. The leader is fenced for a trim
\* (`TrimFence`), and once it reports drained a follower goes whose leaving
\* leaves the rest holding its log (`TrimSet`). A failover before the leader
\* reports again may keep the dropped copy (`SeatDropped`), which leaves the
\* set above the factor again. `L = 2`, time to 3.
\*
\* `AckedOnMajority` is checked, so a trim or a keep that leaves an
\* acknowledged record on a minority of the set shows here.
\*
\* Evidence: `a_trim_waits_for_records_acknowledged_after_its_report`,
\* `a_set_above_its_factor_drops_the_draining_copy` and
\* `a_set_above_its_factor_drops_a_dead_copy_under_steady_writes` (placement).

SPECIFICATION Spec

CONSTANTS
    Brokers = {a, b, c}
    L = 2
    Margin = 0
    Eps = 0
    Drift = 0
    MaxTime = 3
    MaxWrites = 1
    CheckAtCommit = FALSE
    Quorum = TRUE
    Promotion = "any"
    ReportBeforeAck = FALSE
    Handoff = FALSE
    WaitForDrained = TRUE
    FenceAtClaim = TRUE
    AckOnAdmit = FALSE
    FenceFromAdmit = FALSE
    MaxMoves = 0
    Planners = {}
    CasWrites = TRUE
    StageMove = FALSE
    LearnerVotes = FALSE
    Resends = FALSE
    SequencesInLog = TRUE
    Cancel = FALSE
    CancelCas = TRUE
    ReportBound = "acknowledged"
    AckChecksLease = FALSE
    AckOnResponse = FALSE
    AckByFollowers = TRUE
    FenceOnPromote = TRUE
    LabelOnReceipt = FALSE
    StartRecord = FALSE
    Spares = {}
    ReplaceOnPromote = FALSE
    SeatHoldsCopy = TRUE
    LoweredFactor <- Yes
    Grow = FALSE
    PromoteDestination = FALSE
    Counters = FALSE
    CounterCatchUp = FALSE
    Ballots = FALSE
    Elections = 0
    FenceEveryChange = FALSE
    Suspicions = 0
    SetCheck = FALSE
    JointFence = FALSE
    Adopt = 0
    AdoptMatch = TRUE
    Swaps = 0
    PreVote = FALSE
    Wipes = 0
    StorageIds = FALSE
    ReportFromAnswers = FALSE
    ReportFloor = FALSE

SYMMETRY Symm

INVARIANTS
    TypeOK
    AckedHeldByLeader
    AckedAgree
    AckedOnMajority
    NoTruncationBelowHwm
