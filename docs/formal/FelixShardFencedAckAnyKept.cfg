\* FelixShardFencedAck.cfg with a fourth broker outside the replica set and
\* a promotion that reads no report: any replica may be named, however far
\* behind, as placement may when its report is stale or missing. The
\* promotion keeps the replica set, the old leader included, so the fence
\* counts a majority of the set that acknowledged, and the spare is never
\* asked. FelixShardFencedAckAnyReplaced.cfg is this with the old leader
\* swapped for the spare in the same write. No drift, as in
\* FelixShardFencedAckTwoPromotions.cfg: nothing on this write path reads a
\* clock, and the fourth broker's clock alone multiplies the states by several.
\*
\* Evidence: `a_quorum_failover_keeps_the_dead_leader_in_the_replica_set`
\* and `a_quorum_failover_drops_a_staged_copy` (placement keeps the set), and
\* `a_failover_onto_a_spare_broker_keeps_what_the_old_set_acknowledged` (the
\* cluster keeps the record with four brokers and RF 3).

SPECIFICATION Spec

CONSTANTS
    Brokers = {a, b, c, d}
    L = 4
    Margin = 0
    Eps = 0
    Drift = 0
    MaxTime = 4
    MaxWrites = 2
    CheckAtCommit = FALSE
    Quorum = TRUE
    Promotion = "any"
    ReportBeforeAck = FALSE
    Handoff = FALSE
    WaitForDrained = TRUE
    FenceAtClaim = TRUE
    AckOnAdmit = FALSE
    FenceFromAdmit = FALSE
    MaxMoves = 0
    Planners = {}
    CasWrites = TRUE
    StageMove = FALSE
    LearnerVotes = FALSE
    Resends = FALSE
    SequencesInLog = TRUE
    Cancel = FALSE
    CancelCas = TRUE
    ReportBound = "acknowledged"
    AckChecksLease = FALSE
    AckOnResponse = FALSE
    AckByFollowers = TRUE
    FenceOnPromote = TRUE
    LabelOnReceipt = FALSE
    StartRecord = TRUE
    Spares = {d}
    ReplaceOnPromote = FALSE
    SeatHoldsCopy = TRUE
    PromoteDestination = FALSE

SYMMETRY Symm

INVARIANTS
    TypeOK
    AckedHeldByLeader
    AckedAgree
    AckedOnMajority
    NoTruncationBelowHwm
