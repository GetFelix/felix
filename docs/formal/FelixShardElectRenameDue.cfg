\* A witness for FelixShardElectRename.cfg: the same configuration, checking
\* that the control plane never has a leader to name again (NeverRenameDue).
\* TLC finds one, so the passing configuration reaches CpRename.
\*
\* Evidence: `a_refusal_at_the_elected_generation_names_the_leader_again_above_it`
\*   (services/felix-controlplane-service/src/cluster/placement/tests/refused.rs),
\*   `a_promised_generation_is_recorded_as_refused`
\*   (services/felix-broker-service/src/shards/lifecycle/tests/refused.rs) and
\*   `a_fence_a_majority_promised_away_is_refused`,
\*   `a_promise_away_with_the_other_replica_down_is_refused`
\*   (crates/server/felix-replication/src/promotion/tests.rs) and
\*   `a_promise_away_beside_another_copy_stays_pending`
\*   (crates/server/felix-replication/src/promotion/tests/identity.rs).

