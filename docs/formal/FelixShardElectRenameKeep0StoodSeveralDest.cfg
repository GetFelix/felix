\* A piece of FelixShardElectRename.cfg: the cut-overs whose new set keeps the
\* old leader, after no write was admitted, once several replicas had promised
\* a generation past the control plane's, the destination among them. The
\* pieces split every cut-over as FelixShardElectSwap{Keep,Drop}*.cfg do
\* (`CutOverPiece`), and each also checks everything before its cut-over. (not
\* yet measured)
\*
\* Evidence: as FelixShardElectRename.cfg.

SPECIFICATION Spec

CONSTANTS
    Brokers = {a, b, c, d}
    L = 2
    Margin = 0
    Eps = 0
    Drift = 0
    MaxTime = 0
    MaxWrites = 1
    CheckAtCommit = FALSE
    Quorum = TRUE
    Promotion = "any"
    ReportBeforeAck = FALSE
    Handoff = FALSE
    WaitForDrained = TRUE
    FenceAtClaim = TRUE
    AckOnAdmit = FALSE
    FenceFromAdmit = FALSE
    MaxMoves = 0
    Planners = {}
    CasWrites = TRUE
    StageMove = FALSE
    LearnerVotes = FALSE
    Resends = FALSE
    SequencesInLog = TRUE
    Cancel = FALSE
    CancelCas = TRUE
    ReportBound = "acknowledged"
    AckChecksLease = FALSE
    AckOnResponse = FALSE
    AckByFollowers = TRUE
    FenceOnPromote = TRUE
    LabelOnReceipt = FALSE
    StartRecord = TRUE
    ReportFromAnswers = FALSE
    ReportFloor = FALSE
    Spares = {d}
    ReplaceOnPromote = FALSE
    SeatHoldsCopy = TRUE
    Grow = FALSE
    PromoteDestination = FALSE
    Counters = FALSE
    CounterCatchUp = FALSE
    Ballots = TRUE
    Elections = 1
    FenceEveryChange = TRUE

    Suspicions = 0
    SetCheck = TRUE
    JointFence = TRUE
    Adopt = 3
    AdoptMatch = TRUE
    Swaps = 1
    PreVote = FALSE
    Wipes = 0
    StorageIds = FALSE
    Renames <- Yes
    SplitAtCutOver <- Yes
    PieceKeeps <- Yes
    PieceWrites <- Zero
    PieceStood <- Yes
    PieceStoodCounts <- SeveralStood
    PieceDestStood <- JustYes
SYMMETRY Symm
VIEW QuietView
CONSTRAINT CutOverPiece

INVARIANTS
    TypeOK
    OneLeaderPerGeneration
    AckedHeldByLeader
    AckedAgree
    AckedOnMajority
    NoTruncationBelowHwm
    AdoptedMatchesOpened
    SetChangesJoint
