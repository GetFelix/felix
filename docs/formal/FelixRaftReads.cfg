\* Quorum reads on a Raft shard: three brokers, two terms, one write and one
\* crash, one read confirmed by a read-index round after the term opened.
\*
\* Evidence: the read path in felix-replication:
\*   `a_read_confirmed_after_a_leader_answer_sees_the_write_or_is_refused`,
\*   `a_read_from_before_the_shard_was_opened_again_is_not_confirmed`,
\*   `a_read_is_refused_if_the_shard_closes_while_it_waits_for_the_apply`,
\*   `a_read_waits_until_the_leader_has_applied_what_is_committed`.

SPECIFICATION ReadsSpec

CONSTANTS
    Servers = {a, b, c}
    Nobody = Nobody
    MaxTerm = 2
    MaxWrites = 1
    MaxMembers = 0
    MaxCrashes = 1
    MaxSnapshots = 0
    Consumer = FALSE
    AckBeforeFlush = FALSE
    VoteNotDurable = FALSE
    LeaderResumes = FALSE
    TornTailKept = FALSE
    TruncateNotDurable = FALSE
    RecoveredTailUnsynced = FALSE
    SaveCommittedUnflushed = FALSE
    PurgeBeforeSnapshot = FALSE
    SnapshotTwoRenames = FALSE
    CommitPriorTerm = FALSE
    DeliverUncommitted = FALSE
    SkipsNotCounted = FALSE
    MaxReads = 1
    AckWritten = FALSE
    NoRound = FALSE
    NoBlankBarrier = FALSE
    SkipsAnswered = FALSE

SYMMETRY Symm

INVARIANTS
    TypeOK
    ReadsTypeOK
    OneLeaderPerTerm
    LeaderCompleteness
    StateMachineSafety
    AppliedAgree
    NoStaleRead
