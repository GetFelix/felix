\* FelixRaftPlacementStale.cfg with one lost directory, every rule on. A
\* leader that was removed has not stepped down and acts on the target the
\* control plane replaced: it makes itself a voter again after the control
\* plane told its broker to delete the copy. It acknowledges a write with a
\* second copy, that copy's disk is lost, and the deletion then takes the
\* last one. The deletion rule looks at the committed membership once, and a
\* leader on an old target can undo what it saw. Pinned as an expected
\* violation with issue 2385.
