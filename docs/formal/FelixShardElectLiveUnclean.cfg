\* Liveness of elections with the control plane down after an unclean
\* restart (#2025): FelixShardElectLive.cfg, with storage identities and one
\* broker that restarts after a crash that rotated its identity, votes
\* again under the new one, and remembers the unclean start while it runs
\* (`UncleanCrashes`). It answers fences, stands and opens like any other:
\* a ballot it wrote standing since the start is not evidence that it led
\* before the crash. With the leader's broker stopped for good, a leader is
\* elected and stays (`ElectionSettles`).
\*
\* Evidence: `a_copy_that_stood_after_an_unclean_start_takes_a_newer_fence`
\* (replica/tests/fence.rs) and `a_copy_led_before_stays_led_after_it_stands`
\* (unclean/tests.rs) in crates/server/felix-replication.
\* A batch vouches for a doubted copy only once it holds a record of the
\* shipping leader's generation (`VouchOnGeneration`, #2029).

SPECIFICATION LiveSpec

CONSTANTS
    Brokers = {a, b, c}
    L = 2
    Margin = 0
    Eps = 0
    Drift = 0
    MaxTime = 0
    MaxWrites = 0
    CheckAtCommit = FALSE
    Quorum = TRUE
    Promotion = "log-order"
    ReportBeforeAck = FALSE
    Handoff = FALSE
    WaitForDrained = TRUE
    FenceAtClaim = TRUE
    AckOnAdmit = FALSE
    FenceFromAdmit = FALSE
    MaxMoves = 0
    Planners = {}
    CasWrites = TRUE
    StageMove = FALSE
    LearnerVotes = FALSE
    Resends = FALSE
    SequencesInLog = TRUE
    Cancel = FALSE
    CancelCas = TRUE
    ReportBound = "acknowledged"
    AckChecksLease = FALSE
    AckOnResponse = FALSE
    AckByFollowers = TRUE
    FenceOnPromote = TRUE
    LabelOnReceipt = FALSE
    StartRecord = TRUE
    ReportFromAnswers = FALSE
    ReportFloor = FALSE
    Spares = {}
    ReplaceOnPromote = FALSE
    SeatHoldsCopy = TRUE
    Grow = FALSE
    PromoteDestination = FALSE
    Counters = FALSE
    CounterCatchUp = FALSE
    Ballots = TRUE
    Elections = 4
    FenceEveryChange = FALSE

    Suspicions = 0
