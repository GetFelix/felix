\* FelixShardElectWipeNonVoter.cfg with two wipes (`Forgets`): the same
\* replica again, including while its re-admission is pending, or a second one
\* after the first is re-admitted. A second wipe of the same replica empties
\* what it had caught up, and its re-admission completes only once it has
\* caught up again. Two distinct replicas wiped at once is two failures, more
\* than three replicas tolerate, so loss there is expected and not a bug:
\* `OneNonVoter` keeps one non-voter at a time, so the second
\* wipe is of the same replica or follows a re-admission. The same holds for
\* `WipeLeads` with `Forgets = 2` across distinct brokers.
\*
\* Checked here: `AckedOnMajority` and `SetChangesJoint` (with the credit for
\* the single non-voter), `AckedHeldByLeader` and `AckedAgree` for the records
\* a re-admitted replica could lose, `OneLeaderPerGeneration` for the elections.
\*
\* Evidence: none yet; the code lands in #1009 S8 (non-voting rejoin), which must cite tests here.

