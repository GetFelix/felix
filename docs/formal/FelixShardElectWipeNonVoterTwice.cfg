\* FelixShardElectWipeNonVoter.cfg with two wipes (`Forgets`): the same
\* replica again, including while its re-admission is pending, or a second one.
\* A second wipe of the same replica empties what it had caught up, and its
\* re-admission completes only once it has caught up again. Two of three wiped
\* leaves no voting majority, so nothing opens until one is re-admitted, and
\* neither can be. All the safety invariants hold.
\*
\* Evidence: none yet; the code lands in #1009 S8 (non-voting rejoin), which must cite tests here.

