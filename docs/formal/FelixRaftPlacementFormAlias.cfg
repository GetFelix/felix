\* FelixRaftPlacementFormAfterWipes.cfg with one rule dropped: an answer is
\* counted for the address it came from, whichever member gave it. One
\* member loses its volume while the holder of an acknowledged write is
\* silent. The holder's address reaches another member, or the wiped member
\* itself, so the holder is counted as empty. The wiped member forms and can
\* be elected, with its vote, without the write.
\*
\* Evidence: `two_addresses_for_one_member_do_not_form` fails when an empty answer counts for the member asked.

