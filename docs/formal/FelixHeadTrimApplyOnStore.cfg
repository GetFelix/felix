\* FelixHeadTrim.cfg with a broker applying a trim's floor when it stores the
\* record, before it commits. The leader deletes an acknowledged write below
\* its own trim while that trim is uncommitted, so a failover can cut the
\* trim and leave the write gone with no acknowledged trim asking for it.
\* This is why the floor waits for the commit offset. NeverMoreThanAsked is
\* left out so TLC reports the lost write, not the floor that runs ahead.
\*
\* Evidence: none, this models an alternative the design does not use.

SPECIFICATION Spec

CONSTANTS
    Brokers = {a, b, c}
    MaxWrites = 2
    MaxTrims = 3
    MaxGen = 3
    MaxCrashes = 0
    Local = FALSE
    FloorFromBase = FALSE
    ApplyOnStore = TRUE
    DeleteAboveCommit = FALSE
    Unconditional = FALSE
    Untagged = FALSE
    NoOpUnchecked = FALSE
    Retention = FALSE

SYMMETRY Symm

INVARIANTS
    NoReadBelowAckedTrim
    NothingLostAboveFloor
    StaleTrimRefused
