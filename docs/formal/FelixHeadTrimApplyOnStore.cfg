\* FelixHeadTrim.cfg with a broker applying a trim's floor when it stores the
\* record, before it commits. A leader deletes acknowledged writes below a
\* trim of its own, is deposed before the trim commits, loses it to the new
\* leader's log, and is later promoted without those writes. This is why the
\* floor waits for the commit offset. NeverMoreThanAsked is left out so TLC
\* reports the lost writes instead of the earlier, milder symptom.
\*
\* Evidence: none, this models an alternative the design does not use.

SPECIFICATION Spec

CONSTANTS
    Brokers = {a, b, c}
    MaxWrites = 2
    MaxTrims = 3
    MaxGen = 3
    MaxCrashes = 0
    Local = FALSE
    FloorFromBase = FALSE
    ApplyOnStore = TRUE
    DeleteAboveCommit = FALSE
    Unconditional = FALSE
    Untagged = FALSE
    NoOpUnchecked = FALSE
    Retention = FALSE

SYMMETRY Symm

INVARIANTS
    NoReadBelowAckedTrim
    NothingLostAboveFloor
    StaleTrimRefused
