\* FelixHeadTrim.cfg with a broker applying a trim's floor when it stores the
\* record, before it commits. A floor a failover can still cut is enforced.
\* This is why the floor waits for the commit offset.
\*
\* Evidence: none, this models an alternative the design does not use.

SPECIFICATION Spec

CONSTANTS
    Brokers = {a, b, c}
    MaxWrites = 2
    MaxTrims = 2
    MaxGen = 3
    Local = FALSE
    FloorFromBase = FALSE
    ApplyOnStore = TRUE
    DeleteAboveCommit = FALSE
    Unconditional = FALSE
    HiddenTrims = FALSE

SYMMETRY Symm

INVARIANTS
    NoReadBelowAckedTrim
    NothingLostAboveFloor
    NeverMoreThanAsked
    StaleTrimRefused
