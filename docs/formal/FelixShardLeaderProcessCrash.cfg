\* FelixShardLeaderCrashGivesUp.cfg with process crashes (#1367). A
\* leader whose process crashed keeps its whole log and its identity
\* (`ProcessCrashes`, `KeepIdOnSameBoot`), so it does not give its copy up
\* and comes back leading at its generation on its lease, with what it held
\* in memory gone. One whose machine crashed gives it up as before.
\*
\* The clock runs to 3, the least at which placement promotes once a lease
\* lapses (see FelixShardWipeFull.cfg), so the lease running out and a
\* promotion after the kept leader returns are explored too. One write, as
\* in FelixShardLeaderCrashGivesUp.cfg. The weight is a guess until CI
\* measures it.
\*
\* Evidence: the implementation behaviours this configuration asserts.
\* `a_crash_in_the_same_boot_keeps_the_id` -- Crash with `machine` false:
\*   no rotation, so `unclean` is false and the broker leads its copy.
\* `a_crash_in_another_boot_rotates_the_id` -- Crash with `machine` true.

SPECIFICATION Spec

CONSTANTS
    Brokers = {a, b, c}
    L = 2
    Margin = 1
    Eps = 1
    Drift = 0
    MaxTime = 3
    MaxWrites = 1
    CheckAtCommit = TRUE
    Quorum = TRUE
    Promotion = "leader-report"
    ReportBeforeAck = TRUE
    Handoff = FALSE
    WaitForDrained = TRUE
    FenceAtClaim = TRUE
    AckOnAdmit = FALSE
    FenceFromAdmit = FALSE
    MaxMoves = 0
    Planners = {}
    CasWrites = TRUE
    StageMove = FALSE
    LearnerVotes = FALSE
    Resends = FALSE
    SequencesInLog = TRUE
    Cancel = FALSE
    CancelCas = TRUE
    ReportBound = "acknowledged"
    AckChecksLease = TRUE
    AckOnResponse = TRUE
    AckByFollowers = FALSE
    FenceOnPromote = FALSE
    LabelOnReceipt = FALSE
    StartRecord = FALSE
    ReportFromAnswers = TRUE
    ReportFloor = TRUE
    PromoteDestination = FALSE
    Counters = FALSE
    CounterCatchUp = FALSE
    Ballots = FALSE
    Elections = 0
    FenceEveryChange = FALSE
    Suspicions = 0
    SetCheck = FALSE
    JointFence = FALSE
    Adopt = 0
    AdoptMatch = TRUE
    Swaps = 0
    PreVote = FALSE
    Wipes = 1
    StorageIds = TRUE
    Grow = FALSE
    Spares = {}
    ReplaceOnPromote = FALSE
    SeatHoldsCopy = TRUE
    CrashLoses <- Yes
    RotateOnCrash <- Yes
    CrashLeader <- Yes
    GiveUpOnCrash <- Yes
    ProcessCrashes <- Yes
    KeepIdOnSameBoot <- Yes

SYMMETRY Symm

INVARIANTS
    TypeOK
    AtMostOneServing
    AckedSurvive
    AckedAgree
    NoTruncationBelowHwm
    NoStaleCommit
