\* FelixRaftReformTwoRotatedOffsets.cfg with one rule dropped: when no copy
\* holds the floor's entry, every log is cut to its saved commit index, even
\* one whose last log id has the floor's epoch and term. A follower holds two
\* acknowledged records with a saved commit index that lags, the two other
\* copies lose their tails, and the base loses a record no disk lost (issue
\* 2402).
\* 
\* Evidence: none, this models an alternative the implementation must not use.

