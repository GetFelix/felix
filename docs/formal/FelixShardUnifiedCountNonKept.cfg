\* A promise counts from a copy that lost its ballots. TLC finds a wiped copy
\* making a second majority at a generation it had promised.
\* Expected to violate OneLeaderPerGeneration.

SPECIFICATION Spec

CONSTANTS
    Nodes = {a, b, c}
    First = a
    NoNode = NoNode
    MaxGen = 3
    MaxWrites = 1
    MaxStarts = 2
    MaxUnclean = 0
    MaxWipes = 1
    MaxRestores = 0
    MaxRetries = 0
    SetChoices = {{a, b, c}}
    OldPeers = {}
    CountNonKept <- Yes

INVARIANTS
    OneLeaderPerGeneration
    AckedHeldByLeader
