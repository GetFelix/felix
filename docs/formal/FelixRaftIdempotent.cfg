\* Idempotent publishes across changes of Raft leader, the table read from
\* the leader's log: three members, three terms, logs up to five entries, a
\* producer with two batches of one or two records, re-sent at will.
\*
\* Evidence: `a_batch_resent_to_the_next_leader_is_not_written_again` (a
\*   re-send to a new leader is answered from its log),
\*   `a_batch_cut_by_a_leader_change_is_finished_by_its_resend` (a cut batch
\*   is finished, not written again) and
\*   `a_resend_of_an_uncommitted_batch_waits_for_its_commit` (held is
\*   answered at the commit).

SPECIFICATION Spec

CONSTANTS
    Servers = {a, b, c}
    Nobody = Nobody
    MaxTerm = 3
    MaxLog = 5
    MaxSeq = 2
    Lens = {1, 2}
    TableFromLog = TRUE

SYMMETRY Symm

INVARIANTS
    TypeOK
    NoDuplicate
    AckedWhole
    InOrder
    MembersAgree
