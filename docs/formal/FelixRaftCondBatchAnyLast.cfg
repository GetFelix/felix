\* The skip checks only that the entry at a cut piece's last index is a kept
\* piece, not that it is a last piece of the same length. A batch of three
\* naming 2..4 is cut after its first piece, the new leader's blank takes 3,
\* and a single record naming 4 is kept there: the cut piece at 2 passes the
\* check and readers see it.
\*
\* Evidence: none, this models a weaker check than the design's.

SPECIFICATION Spec

CONSTANTS
    Servers = {a, b, c}
    Nobody = Nobody
    MaxTerm = 2
    MaxLog = 5
    MaxPlain = 0
    MaxMembers = 0
    Expected <- CutThenRecord
    CondLen <- CutThenRecordLens
    LeaderDecides = FALSE
    Hide = "kept"

SYMMETRY Symm

INVARIANTS
    WholeBatchesOnly
