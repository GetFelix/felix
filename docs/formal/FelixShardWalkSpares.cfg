\* A long random walk over set changes with spares, for TLC's simulation mode
\* (`scripts/check_tla.sh --simulate`), not for exhaustive checking. The
\* exhaustive configurations stop at one move and a promotion or two
\* (FelixShardFencedAckSeat.cfg, FelixShardFencedAckGrow.cfg); this lifts the
\* bounds so one behaviour can grow the set, replace followers, seat them and
\* fail over many times, with start records on and drifting clocks.
\*
\* Two brokers hold the shard and two are spares, so `GrowSet` tops the set up
\* to three and `Reseat` and `Seat` then swap followers in and out. Promotion
\* of any replica, as a placement reading a stale report may.
\*
\* Bounds: time to 40, `L = 2` so a lease can lapse every few ticks, six
\* writes, six moves. No SYMMETRY: simulation stores no states, so it buys
\* nothing. A pass means the walks found nothing, not that nothing is there.
\* FelixShardWalkSparesSeatEarly.cfg is this with the seat not waiting.
\*
\* Evidence: `a_quorum_replacement_waits_for_what_the_old_set_holds` and
\* `seating_a_replacement_keeps_what_the_old_set_acknowledged` (replacement),
\* `a_set_short_of_the_factor_is_topped_up` and
\* `a_quorum_restore_waits_for_what_the_old_set_holds` (growing a short set).

SPECIFICATION Spec

CONSTANTS
    Brokers = {a, b, c, d}
    L = 2
    Margin = 0
    Eps = 0
