\* One rule dropped: each record of a batch is its own message with its own
\* term and lease check (issue 2472). A lease that lapses inside the batch lets
\* any subset land. No change of leader and no purge: a batch of three lands
\* its first and last records, the table counts it whole by its last position,
\* and the re-send is acknowledged with the middle record missing.
\*
\* Evidence: none, this models an alternative the design does not use.

SPECIFICATION Spec

CONSTANTS
    Members = {a, b}
    Producers = {p}
    MaxSeq = 1
    Lens = {3}
    MaxChanges = 0
    MaxPurges = 0
    MaxLog = 6
    TermBoundBatch = FALSE
    ResendFinishes = TRUE
    AtPurge = "refuse"
    TableAtAppend = TRUE
    HeldAfterCommit = TRUE

SYMMETRY Symm

INVARIANTS
    BatchExactlyOnce
