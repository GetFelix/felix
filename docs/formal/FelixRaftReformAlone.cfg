\* A standalone broker's group of one. A relaxed crash loses part of the
\* unsynced tail and rotates the copy as a restore, with a saved commit that
\* can lag what was synced. The group re-forms itself from its kept copy and
\* keeps every acknowledged record that copy holds (KeptLossBound), with no
\* offset given out twice.
\*
\* Evidence: crates/server/felix-storage/src/raft_copy/vouch.rs, plan_reform_as
\* with alone; raft_copy/tests/alone.rs,
\* a_re_form_keeps_synced_records_past_the_saved_commit.

