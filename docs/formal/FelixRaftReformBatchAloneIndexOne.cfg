\* FelixRaftReformBatchAlone.cfg with one record per entry and the rule of
\* step 4 of the design: reservations kept in indexes, and the epoch's
\* offsets starting at its first index. While an offset is never above its
\* index that is safe, and this checks it.
\*
\* Evidence: none, batch entries are not built yet (#3359).

