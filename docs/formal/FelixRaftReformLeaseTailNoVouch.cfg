\* FelixRaftReformLeaseTail.cfg with the re-form not vouching by the
\* allowance (issue 3109): the leader answers a record on its lease, is
\* elected again in the next term and writes nothing, and the re-form keeps
\* only the saved commit, because a vote read is above every entry read. The
\* lease-answered record is dropped from a live disk.
\*
\* Evidence: none, this models the design for #3103, which is not built.

