\* The snapshot is taken at the applied entry, as a plain Raft snapshot is,
\* and the install rule kept. A snapshot at the applied entry is above the
\* trim, so above floor - 1, and every member behind the purge refuses it. The
\* leader's cap does not help: a follower purges past a slow member, then
\* leads.
\*
\* Evidence: none, purging a Raft stream shard is not built yet (issue 2602).

SPECIFICATION Spec

CONSTANTS
    Members = {a, b, c}
    Voters = {a, b, c}
    MaxIndex = 5
    MaxTrims = 2
    MaxChanges = 1
    MaxRestarts = 0
    MaxReforms = 0
    PurgeBelowFloorRule = TRUE
    InstallRule = TRUE
    InstallFloor = "max"
    LeaderCaps = TRUE
    SnapAtApplied = TRUE
    TablesAtApplied = FALSE
    SnapFloorAtP = TRUE
    SnapCarriesHeaders = TRUE
    DropFirst = FALSE
    ReformReads = "full"
    ReformCarriesFloor = TRUE
    ReformStoresFloor = TRUE

SYMMETRY Symm

INVARIANTS
    CatchUpPossible
