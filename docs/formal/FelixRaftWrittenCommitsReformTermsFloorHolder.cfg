\* FelixRaftWrittenCommitsReformTerms.cfg with the shortcut the vouch rule
\* replaces: when some copy holds the floor's entry, the base is the copy
\* with the highest last log id. a leads term 1 and writes past the floor;
\* b and c commit an entry of term 2 at the same index on a written
\* majority and a power cut takes it from both. a's log is the base, and
\* its term-1 entry is served where the term-2 one was committed.
\*
\* Evidence: none, this models an alternative the implementation must not use.

SPECIFICATION Spec

CONSTANTS
    Servers = {a, b, c}
    Nobody = Nobody
    InitVoters = {a, b, c}
    InitLearners = {}
    NewVoters = {a, b, c}
    MaxTerm = 2
    MaxWrites = 1
    MaxChanges = 0
    MaxCrashes = 1
    MaxPowerCuts = 2
    LearnerCounts = FALSE
    OtherTermCounts = FALSE
    JointOneHalf = FALSE
    WrittenCommits = TRUE
    CutRotates = TRUE
    Reserve = TRUE
    MaxReforms = 1
    MaxDead = 0
    Vouch = TRUE
    FloorHolder = TRUE
    ReplacedCopy = Nobody
    ReplacementCopy = Nobody

SYMMETRY Symm

INVARIANTS
    OffsetNeverReused
