\* An elected leader whose lease lapses. A replica elects itself past the
\* control plane's leader, acknowledges a write on itself and the third
\* replica, then steps down when its own lease runs out (`MaxTime = 2`,
\* `L = 2`). The control plane's leader is still at the older generation it
\* was named at, and it has promised the newer one to the candidate, so it can
\* acknowledge nothing. AckedHeldByLeader must not count it as the newest
\* leader: the next one fences a replica holding the write. Found by
\* FelixShardWalkElect.cfg; this keeps the scenario under exhaustive check.
\* `Margin = 2` keeps the control plane from promoting within the run, and
\* the set check is off: with it, the deposed leader steps down when it
\* answers the candidate's fence, and the case does not arise.
\*
\* Evidence: none yet, nothing in the code elects a leader.

SPECIFICATION Spec

