\* FelixHeadTrim.cfg with a follower serving a read that could start below a
\* floor from its own state, without waiting for the leader's read index. A
\* trim commits on the leader and one follower and is acknowledged; the
\* other follower, which never received the trim, serves the read from below
\* its floor. This is why a follower applies the read index first (issue
\* 2603).
\*
\* Evidence: none, this models an alternative the design does not use.

SPECIFICATION Spec

CONSTANTS
    Brokers = {a, b, c}
    MaxWrites = 2
    MaxTrims = 3
    MaxGen = 2
    MaxCrashes = 0
    Local = FALSE
    FloorFromBase = FALSE
    ApplyOnStore = FALSE
    DeleteAboveCommit = FALSE
    Unconditional = FALSE
    Untagged = FALSE
    NoOpUnchecked = FALSE
    Retention = FALSE
    FollowerNoReadIndex = TRUE

SYMMETRY Symm

INVARIANTS
    NoReadBelowAckedTrim
    NothingLostAboveFloor
    NeverMoreThanAsked
    StaleTrimRefused
