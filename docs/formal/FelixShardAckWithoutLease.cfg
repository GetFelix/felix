\* FelixShardRealMargins.cfg with the lease taken out of the acknowledgement
\* (`AckChecksLease = FALSE`): a `Quorum` write is acknowledged on the
\* report's answer and the generation alone. The code does check the lease at
\* release; this asks whether acknowledged writes survive without that check,
\* under drift and the real margins. They do. TLC reaches a leader whose lease
\* has lapsed releasing an acknowledgement, and one released by a leader the
\* control plane has already replaced, and in every such run the broker
\* serving next holds the record: a leader can only have been told of a report
\* for its own generation, and the promotion reads that generation's reports.
\*
\* Same bounds as FelixShardRealMargins.cfg. Run by hand to time 6 it passes
\* in 13.4M distinct states, about 16 minutes on four cores.
\* Evidence: none, this models a broker without the lease check at ack release
\* (`a_quorum_ack_is_withheld_when_the_lease_lapses_while_it_waits` is the
\* check it drops). Its other constants are FelixShardRealMargins.cfg's.

SPECIFICATION Spec

CONSTANTS
    Brokers = {a, b, c}
    L = 4
    Margin = 1
    Eps = 1
    Drift = 1
    MaxTime = 5
    MaxWrites = 1
    CheckAtCommit = TRUE
    Quorum = TRUE
    Promotion = "leader-report"
    ReportBeforeAck = TRUE
    Handoff = FALSE
    WaitForDrained = TRUE
    FenceAtClaim = TRUE
    AckOnAdmit = FALSE
    FenceFromAdmit = FALSE
    MaxMoves = 0
    Planners = {}
    CasWrites = TRUE
    StageMove = FALSE
    LearnerVotes = FALSE
    Resends = FALSE
    SequencesInLog = TRUE
    Cancel = FALSE
    CancelCas = TRUE
    ReportBound = "acknowledged"
    AckChecksLease = FALSE
    AckOnResponse = TRUE

SYMMETRY Symm

INVARIANTS
    TypeOK
    AtMostOneServing
    AckedSurvive
    AckedAgree
    NoTruncationBelowHwm
    NoStaleCommit
    AckedOnMajority
    QuorumReportNamesASuccessor
