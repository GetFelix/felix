\* The relaxed-crash example of step 4 in docs/raft-batch-entries-design.md,
\* small: one record per entry, and blank entries take no offset, so a base
\* ends at an index above its next offset. The epoch's offsets start at the
\* base's next offset. A record counted and acknowledged at offset 1 (index
\* 2, after the blank) is cut by the power cut, the reservation pads the
\* index to 3, and the new epoch gives out offset 1 again.
\*
\* Evidence: none, this pins why an epoch's first offset has bounds of its own.

