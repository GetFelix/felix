\* FelixShardElectWipeWaitsFloor.cfg with elections up to generation 3
\* (`Adopt = 3`). No bound the control plane holds covers what the wiped
\* replica lost: b opens at 2 on {a, b}; a stands at 3 with c's answer and
\* opens; c is wiped at the control plane's generation 1; the control plane
\* adopts b at 2, which ends the wait and sets the floor at 2; c answers b at
\* 2, stands at 3 itself, b answers it, and c opens at 3 beside a
\* (OneLeaderPerGeneration). The control plane had not heard of generation
\* 3, which c had promised away before its wipe. No write: the trace needs
\* none.
\*
\* Evidence: none yet, nothing in the code elects a leader.

SPECIFICATION Spec

