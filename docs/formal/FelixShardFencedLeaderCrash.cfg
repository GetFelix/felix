\* FelixShardLeaderCrashGivesUp.cfg on the fenced, follower-acked path. The
\* leader crashes under a relaxed fsync mode, loses part of its log, restarts
\* under a new identity and leads nothing from that copy (#1295). Placement
\* finds it registered under another identity than its report names and
\* promotes a follower the report names caught up, which fences before it
\* serves.
\*
\* The crashed leader's copy still holds the promise it made, so it can answer
\* that fence. The model has no `refuse_short_copy`, the broker's own refusal;
\* the identity check alone keeps the short copy out here, since the report
\* names the leader's own identity.
\*
\* No suspicion and no clock: every promotion is a replacement on the
\* identity. One write and one crash.
\*
\* Invariants: AckedHeldByLeader, with the newest leader holding every
\* acknowledged record once it opens. AckedOnMajority is left out because a
\* crashed copy is a lost copy.
\*
\* Evidence: the implementation behaviours this configuration asserts.
\* `a_crashed_leader_gives_up_the_generation_it_led` -- Crash under
\*   GiveUpOnCrash.
\* `a_report_names_the_leaders_own_storage_identity` -- Report.
\* `a_leader_back_on_a_new_storage_identity_is_replaced` -- LeaderReplaced.
\* `a_promotion_carries_the_reports_storage_ids` -- Promote (`expect`).
\* `a_fence_answer_from_another_storage_id_does_not_count` -- FenceCounts.
\* `a_crashed_leaders_copy_takes_no_fence_until_a_newer_leader_ships` -- the
\*   broker's own refusal, which the model leaves out.
\*
\* The crash may be the process's alone (`ProcessCrashes`), which keeps the
\* log and, as the broker does on the same boot, the identity
\* (`KeepIdOnSameBoot`, #1371); a machine crash loses a suffix and rotates.

