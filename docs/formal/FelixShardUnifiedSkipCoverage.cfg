\* A leader that is not continuing opens on its own log, as a continuing one
\* does. Expected to violate AckedHeldByLeader.

SPECIFICATION Spec

CONSTANTS
    Nodes = {a, b, c}
    First = a
    NoNode = NoNode
    MaxGen = 3
    MaxWrites = 1
    MaxStarts = 1
    MaxUnclean = 0
    MaxWipes = 0
    MaxRestores = 0
    MaxRetries = 0
    SetChoices = {{a, b, c}}
    OldPeers = {}
    SkipCoverage <- Yes

INVARIANTS
    OneLeaderPerGeneration
    AckedHeldByLeader
