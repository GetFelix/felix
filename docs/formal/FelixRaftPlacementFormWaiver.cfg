\* FelixRaftPlacementForm.cfg with slot c named by a `form-without` waiver
\* and its machine never started: a and b form without its answer and run as
\* two of three. A volume lost then leaves no quorum to confirm a leader, so
\* the wiped member never votes again.
\*
\* Evidence: `form_without_forms_once_and_is_consumed`,
\*   `form_without_never_overrides_an_answering_peer`.

SPECIFICATION Spec

CONSTANTS
    Brokers = {a, b, c}
    Nobody = Nobody
    InitBrokers = {a, b, c}
    MaxTerm = 2
    MaxWrites = 1
    MaxCalls = 0
    MaxTargets = 0
    MaxWipes = 1
    MinVoters = 3
    Rotate = FALSE
    Retain = TRUE
    StaleTargets = FALSE
    SkipJoint = FALSE
    NoWithhold = FALSE
    WithheldCounts = FALSE
    AnswerAnyId = FALSE
    DeleteOnTarget = FALSE
    PlaceDoomed = FALSE
    Forming = TRUE
    FirstBoot = TRUE
    FormMajority = FALSE
    Waived = {c}
    Absent = {c}
    EarlyWipes = FALSE

SYMMETRY Symm

INVARIANTS
    TypeOK
    OneLeaderPerTerm
    LogMatching
    LeaderCompleteness
    StateMachineSafety
    AckedSurvive
    AckedOnDisk
    DeliveredAgree

PROPERTIES
