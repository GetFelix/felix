\* The design as implemented: both lease checks, Quorum acknowledgements
\* released only after the report describing them has landed, as the leader
\* learns from the answer it got (`AckOnResponse`), and promotion from the
\* leader's last report.
\*
\* `ReportBeforeAck = FALSE` is the same design without that ordering, in
\* FelixShardNoReportOrder.cfg, and it loses an acknowledged record.
\* Evidence: the implementation behaviours this configuration asserts.
\* `a_failed_replica_report_holds_the_quorum_mark_back` -- ReportBeforeAck: the
\*   quorum mark is held when the report does not reach the control plane, so an
\*   acknowledgement can never precede the report describing it.
\* `a_broker_suspended_past_expiry_fails_the_commit_check_while_admission_still_passes`
\*   -- CheckAtCommit: the lease is checked again at commit, not only at
\*   admission.
\* `a_quorum_publish_without_a_majority_is_refused` -- Quorum: a publish is
\*   acknowledged only once a majority including the leader holds it.
\* `the_furthest_ahead_replica_is_promoted` -- Promotion: among reported
\*   replicas the one holding most wins, with score only breaking ties.
\* `a_follower_that_holds_nothing_is_not_promoted` -- and a replica outside the
\*   report is never promoted.
\* `a_quorum_follower_holding_every_acknowledged_record_can_lead` -- ReportBound:
\*   under Quorum a follower holding everything up to the mark is reported
\*   caught up though a publish landed on the leader after shipping.
\* `a_leader_stream_follower_missing_the_newest_record_cannot_lead` -- and under
\*   Leader only an exact copy is.
\* `a_quorum_acknowledged_record_survives_its_leader` -- the end-to-end
\*   property AckedSurvive states, against a real cluster.
\* Planners = {}: every decision reads and writes in one step, so CasWrites
\*   has nothing to compare. The StalePlanner and StalePromotion
\*   configurations are where a read is held across another write.

SPECIFICATION Spec

CONSTANTS
    Brokers = {a, b, c}
    L = 4
    Margin = 2
    Eps = 1
    Drift = 0
    MaxTime = 7
    MaxWrites = 2
    CheckAtCommit = TRUE
    Quorum = TRUE
    Promotion = "leader-report"
    ReportBeforeAck = TRUE
    Handoff = FALSE
    WaitForDrained = TRUE
    FenceAtClaim = TRUE
    AckOnAdmit = FALSE
    FenceFromAdmit = FALSE
    MaxMoves = 0
    Planners = {}
    CasWrites = TRUE
    StageMove = FALSE
    LearnerVotes = FALSE
    Resends = FALSE
    SequencesInLog = TRUE
    Cancel = FALSE
    CancelCas = TRUE
    ReportBound = "acknowledged"
    AckChecksLease = TRUE
    AckOnResponse = TRUE
    AckByFollowers = FALSE
    FenceOnPromote = FALSE
    LabelOnReceipt = FALSE

SYMMETRY Symm

INVARIANTS
    TypeOK
    AtMostOneServing
    AckedSurvive
    AckedAgree
    NoTruncationBelowHwm
    NoStaleCommit
    AckedOnMajority
    QuorumReportNamesASuccessor
