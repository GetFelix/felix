\* The leader's broker dies and store liveness never reports it. The audit
\* alone gets a leader elected (QuiescentLed).
\* It passes on two rules the design page does not state yet (issue 2310): a
\* heartbeat sent while a sleep proposal is open closes it, and a follower
\* refuses a sleep request from a leader it does not support or while held.
\* Evidence: none, sleep is not built yet (issue 2244).

