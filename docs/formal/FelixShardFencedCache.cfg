\* FelixShardFencedAck.cfg for a cache shard (`Counters`): the cache log is
\* the shard's log, and the counter log beside it ships, is counted and
\* fenced the same way, under the promise the cache log's fence keeps. This
\* is the broker once the fleet finalized `majority_ack` and `fenced_caches`:
\* both marks move on the followers' answers alone, and a promoted leader
\* fences both logs on a majority and takes the furthest ahead of each
\* before it serves. Promotion goes by the cache log only, as placement
\* reads nothing of the counters, so the counter log's catch-up is what
\* keeps an acknowledged counter update.
\*
\* No drift: nothing on a write's path reads the lease here, so a clock only
\* decides when the promotion comes, and the counter log already multiplies
\* the states FelixShardFencedAck.cfg has.
\*
\* FelixShardFencedCacheUnfenced.cfg is this without the fence, and
\* FelixShardFencedCacheNoCounterCatchUp.cfg without taking the counter log.
\*
\* Evidence: `the_counter_log_furthest_ahead_is_taken_too` -- the fence takes
\*   the counter log ahead by (last generation, length).
\* `a_counter_fence_older_than_the_cache_fence_is_refused` -- one promise
\*   per replica, kept on the cache log.
\* `a_cache_leader_counts_only_its_own_generation` -- the counter mark counts
\*   past a record of the leader's own generation.
\* `both_logs_get_their_record_before_the_shard_serves` -- a start record on
\*   each log at open.
\* `a_promoted_cache_shard_waits_in_fencing` -- the shard does not serve
\*   until the fence is done.
\* `cache_and_counter_acks_skip_the_lease_where_followers_decide_the_mark`
\*   -- no lease on a cache write's acknowledgement under follower acks.

