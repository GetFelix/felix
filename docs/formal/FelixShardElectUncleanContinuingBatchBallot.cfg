\* FelixShardElectUncleanContinuing.cfg without `ContinuingKeptBallot`. The
\* ballot alone is not enough: a wiped copy takes a ballot from a batch
\* (`CatchUp`, as `accept_sender` does), which is not the promise it lost.
\* TLC finds two leaders at one generation (OneLeaderPerGeneration): b
\* stands at 2, c promises it, b opens at 2; b is wiped (`WipeLeads`),
\* losing its promise, and takes a's batch at 1, so its ballot names a at 1;
\* c is wiped; a, still the control plane's leader at 1, re-admits c at 2; b
\* answers on its ballot and a opens at 2 beside b. In the model only a
\* re-admission is a continuing open beside a non-voter, hence the second
\* wipe; in the code a set change would need only b's.
\*
\* Twin: FelixShardElectUncleanContinuing.cfg (`ContinuingKeptBallot`).
\*
\* Evidence: none yet, a rejected variant (#2047).

