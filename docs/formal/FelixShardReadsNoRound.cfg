\* FelixShardReadsRound.cfg with the round skipped: a read is answered by
\* any broker that believes it leads. TLC finds the leader deposed by a
\* promotion it has not heard of answering without the write its successor
\* acknowledged (NoStaleRead).
\*
\* Evidence: `a_cut_off_leader_cannot_serve_a_quorum_read_once_a_new_leader_took_writes`,
\* which serves the stale value with the round taken out.

SPECIFICATION ReadsSpec

CONSTANTS
    Brokers = {a, b, c}
    L = 2
    Margin = 0
    Eps = 0
    Drift = 1
    MaxTime = 2
    MaxWrites = 1
    CheckAtCommit = FALSE
    Quorum = TRUE
    Promotion = "log-order"
    ReportBeforeAck = FALSE
    Handoff = FALSE
    WaitForDrained = TRUE
    FenceAtClaim = TRUE
    AckOnAdmit = FALSE
    FenceFromAdmit = FALSE
    MaxMoves = 0
    Planners = {}
    CasWrites = TRUE
    StageMove = FALSE
    LearnerVotes = FALSE
    Resends = FALSE
    SequencesInLog = TRUE
    Cancel = FALSE
    CancelCas = TRUE
    ReportBound = "acknowledged"
    AckChecksLease = FALSE
    AckOnResponse = FALSE
    AckByFollowers = TRUE
    FenceOnPromote = TRUE
    LabelOnReceipt = FALSE
    StartRecord = TRUE
    ReportFromAnswers = FALSE
    ReportFloor = FALSE
    Spares = {}
    ReplaceOnPromote = FALSE
    SeatHoldsCopy = TRUE
    Grow = FALSE
    PromoteDestination = FALSE
    Counters = FALSE
    CounterCatchUp = FALSE
    ReadConfirm = "none"
    MaxReads = 1

SYMMETRY Symm

INVARIANTS
    ReadsTypeOK
    NoStaleRead
    AckedHeldByLeader
    AckedOnMajority
