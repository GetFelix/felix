\* A piece of FelixShardElectAdoptFailover.cfg, which did not finish in six
\* hours: the behaviours whose first failover takes generation 3, where the
\* promoted broker's own set is the control plane's, one write was admitted, and
\* some replica had promised past the control plane's generation.
\* The pieces split every first failover (`SplitAtFailover`, `CutOverPiece`),
\* and each also checks everything before it, so together they reach every
\* state FelixShardElectAdoptFailover.cfg does. (not yet measured)
\*
\* Evidence: as FelixShardElectAdoptFailover.cfg.

