\* Copy identity for one Raft group, as docs/per-shard-raft.md decides it: three
\* brokers, two terms, one client write, one membership change and one fault,
\* which empties a shard directory or loses the data root. Every rule is on.
\* The copy made in the empty directory has a new id, has never voted, and is
\* swapped in by a membership change.
\*
\* Evidence: `an_emptied_directory_takes_a_new_copy_id`,
\* `a_copy_minted_under_another_storage_id_rotates` and
\* `a_wiped_copy_comes_back_under_a_new_id_that_does_not_vote`.

SPECIFICATION Spec

CONSTANTS
    Servers = {a, b, c}
    Nobody = Nobody
    MaxTerm = 2
    MaxWrites = 1
    MaxChanges = 1
    MaxFaults = 1
    MaxRestarts = 0
    Faults = {"wipe", "lose"}
    ExactMark = TRUE
    RestoreYoung = FALSE
    RootRestoreSameRun = FALSE
    WitnessLost = FALSE
    RestoreUnheard = FALSE
    WipeKeepsId = FALSE
    NoRestoreCheck = FALSE
    NoStorageIdCheck = FALSE
    NoVoteMark = FALSE
    VoteBeforeMark = FALSE
    MarkForgetsCopy = FALSE
    NoRootSequence = FALSE

SYMMETRY Symm

INVARIANTS
    TypeOK
    OneLeaderPerTerm
    LeaderCompleteness
    StateMachineSafety
    AckedSurvive
    AckedHeldByLeader
