\* FelixRaftPlacementFormAfterWipes.cfg with one rule dropped, as the
\* metadata group was before issue 2371: an empty member forms on a majority
\* of empty answers and skips a member that does not answer. One member loses
\* its volume while the holder of an acknowledged write is silent and the
\* third has an empty log. The wiped member forms on the third's empty
\* answer and can be elected, with its vote, without the write.
\*
\* Evidence: `an_empty_majority_does_not_form_past_a_silent_member` fails with the majority rule.

