\* FelixGroups.cfg with a promotion taking the dead letters from the replica
\* furthest ahead on them and putting the cursors of the one furthest ahead
\* on cursors in place of its own. With every cursor checked against the
\* dead letters it ends up with, this passes: the pair need not come from
\* one replica. Taking it from one keeps more of the groups' progress.
\*
\* Evidence: none, this models an alternative the broker does not use.

SPECIFICATION Spec

CONSTANTS
    Replicas = {a, b, c}
    G = 2
    N = 1
    MaxGen = 3
    MaxCrashes = 1
    MaxCursors = 2
    CheckCursors = TRUE
    DependencyGen = TRUE
    KeepGroups = TRUE
    SplitSources = TRUE
    SyncBeforeShip = TRUE

SYMMETRY Symmetry

INVARIANT NoSkip
