\* The offset floor (docs/per-shard-raft.md, "Offsets are not reused", issue
\* 2305). Two of three disks are lost with acknowledged records on them, two
\* writes, one term. The base ends below those records and is padded with a
\* gap up to the floor, so the new epoch gives none of their offsets out
\* again. The floor here is exact: every commit is reported at once, which the
\* design does not do (FelixRaftReformTwoRotatedOffsetsTrailing.cfg).
\* 
\* Evidence: none, re-forming is not built yet (track 4 of issue 2244).

