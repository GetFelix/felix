\* FelixRaft.cfg with batch entries, as docs/raft-batch-entries-design.md
\* decides them: one write of one or two records is one entry, and blank
\* entries take no offset. Two terms and one crash, with the subscriber
\* reading. Offsets stay dense with nothing skipped, and the batch commits
\* and is read whole.
\*
\* Evidence: none, batch entries are not built yet (#3359).

SPECIFICATION Spec

CONSTANTS
    Servers = {a, b, c}
    Nobody = Nobody
    MaxTerm = 2
    MaxWrites = 1
    MaxMembers = 0
    MaxCrashes = 1
    MaxSnapshots = 0
    Consumer = TRUE
    AckBeforeFlush = FALSE
    VoteNotDurable = FALSE
    LeaderResumes = FALSE
    TornTailKept = FALSE
    TruncateNotDurable = FALSE
    RecoveredTailUnsynced = FALSE
    SaveCommittedUnflushed = FALSE
    PurgeBeforeSnapshot = FALSE
    SnapshotTwoRenames = FALSE
    CommitPriorTerm = FALSE
    DeliverUncommitted = FALSE
    SkipsNotCounted = FALSE
    ZeroTakesOffset <- ZeroTakesOffsetOff
    MaxBatch <- MaxBatchTwo
SYMMETRY Symm

INVARIANTS
    TypeOK
    OneLeaderPerTerm
    LogMatching
    TermsMonotone
    LeaderCompleteness
    StateMachineSafety
    AppliedAgree
    AppliedInLog
    AckedSurvive
    PurgedCoveredBySnapshot
    OffsetsDense
    OffsetNeverReused
    BatchWhole
    DeliveredInOrder
    QuiescentServed
    AckedDelivered

PROPERTIES
    VoteNeverLowers
