\* FelixRaft.cfg with one rule dropped. The committed or applied index read
\* back at startup is past the recovered log. openraft commits an entry a
\* follower has not flushed, so a crash can leave the stored index above the
\* log. When the state machine reports that index as applied, openraft
\* restarts the log there, past the stored snapshot, on the assumption that
\* the state machine kept the entries. A shard's state machine is the log, so
\* they are gone from this broker.
\*
\* Evidence: none, this models an alternative the implementation does not use.

