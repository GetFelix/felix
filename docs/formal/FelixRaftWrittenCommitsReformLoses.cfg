\* Witness: under the proposal a power cut of a majority loses a committed
\* record that subscribers may have been given. The offset is not reused
\* (FelixRaftWrittenCommitsReform.cfg), but the record is gone, as an
\* acknowledged one already can be on a `Periodic` stream.
\*
\* PowerCut only cuts a copy that loses an entry, so a synced or empty copy
\* never rotates here. That is harmless at one term: such a copy loses
\* nothing a re-form could read.
\*
\* Evidence: none, this models a proposal that is not built.

