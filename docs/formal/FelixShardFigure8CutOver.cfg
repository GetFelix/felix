\* FelixShardFigure8.cfg's history one leadership further, through a move
\* rather than a promotion (SeededCutOverInit): c, promoted at 3 before the
\* fleet finalized `generation_start`, took x from a and acknowledged
\* nothing, and is stopped for a move to a with a drained report naming a.
\* From there the next leader is a by cut-over, or c again when the move is
\* cancelled, and either inherits x. With the start record it writes one at
\* its new generation, and the mark counts x only once that record is on a
\* majority, by which time any later fence prefers it to b's y.
\* FelixShardFigure8CutOverNoStartRecord.cfg is this without it.
\*
\* Evidence: `start_generation` -- a leadership that begins without a
\* promotion's fence writes the record when it opens the shard
\* (lifecycle.rs). `counted_offset` -- the mark counts only past the
\* generation's start (quorum.rs); `a_moved_shard_writes_a_generation_start_record_and_counts_from_it`.


SPECIFICATION SeededCutOverSpec

CONSTANTS
    a = a
    b = b
    c = c
    Brokers = {a, b, c}
    L = 2
    Margin = 1
    Eps = 1
    Drift = 0
