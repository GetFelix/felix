\* The same move as FelixShardHandoffAdmitAck.cfg, with a write acknowledged
\* on admission entering the fence only at its claim. The leader sees the
\* fence while the write is queued, refuses its claim, reports drained, and
\* the control plane cuts over to a successor that never received a write the
\* client was told is stored.
\*
\* Expected to violate AckedSurvive.
\* Evidence: none, this models the fence as the broker had it before a
\* publish acknowledged on enqueue held it from admission.

SPECIFICATION Spec

CONSTANTS
    Brokers = {a, b, c}
    L = 4
    Margin = 2
    Eps = 1
