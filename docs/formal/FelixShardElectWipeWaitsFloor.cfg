\* FelixShardElectWipeWaitsAll.cfg with a floor once the wait ends
\* (`WipedAboveAdopted`): until the wiped replica holds a promise at the
\* control plane's generation, read linearizably, it takes nothing below
\* that generation, only the named leader at it, and a candidate only above
\* it. With elections at most one generation past the control plane's
\* (`Adopt = 2`) the adopted generation covers whatever the replica lost,
\* and this passes. FelixShardElectWipeWaitsFloorDeep.cfg lets elections
\* run one further and it does not.
\*
\* Evidence: none yet, nothing in the code elects a leader.

