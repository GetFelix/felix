\* FelixRaftReformLeaseTail.cfg with the re-form taking the majority-held end
\* from the stores it read, counting a voter whose store is unknown (its copy
\* rotated, or its broker was not read) as holding nothing, and never
\* waiting. It shows why the re-form waits while the stores read leave the
\* end open: a voter that echoed the end loses its copy to a power cut, and
\* the end the rest hold is below a record answered on the lease.
\*
\* Evidence: none, this models the design for #3103, which is not built.

