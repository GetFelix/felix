\* FelixShardMoveGiveUp.cfg as before the fix: a fenced move ignores its
\* leader's give-up and waits for a drained report that never comes. Only
\* the fence timeout ends it, and the timeout's clock is the placement
\* instance's own, started again on every control-plane restart, so it is
\* owed nothing here. TLC finds the shard fenced for good with no leader
\* serving (`EventuallyServes`), the stall the simulator found.
\*
\* Evidence: none, this models the rule the implementation had before the fix.

SPECIFICATION LiveSpec

CONSTANTS
    Nodes = {a, b, c}
    First = a
    NoNode = NoNode
    MaxGen = 5
    MaxWrites = 1
    MaxCrashes = 1
    MaxMoves = 1
    RetakeGivenUp <- No

INVARIANTS
    OneLeaderPerGeneration
    AckedHeldByLeader
    AtMostOneServing

PROPERTY
    EventuallyServes
