\* The non-voter rule as the code runs it before elections ship: only the
\* control plane names leaders (`Elections = 0`), with time so it fails over
\* (`Promote`) and re-admits (`Readmit`). A cache shard, so the counter log
\* is fenced beside the cache log and the wipe takes both. The control
\* plane's leader may fence any member without a set (`SetlessFences`), as
\* `fence_log` does when it could not learn a replica's capabilities. All
\* the safety invariants hold, the counter ones included.
\*
\* Twins: FelixShardElectWipeNonVoterSetlessUnmarked.cfg (a fence without a
\* set answered by a copy that holds no set), and
\* FelixShardElectWipeNonVoterCountersCountLearner.cfg (the counter fence
\* judged on the counter log), FelixShardElectWipeNonVoterCountersUnchecked.cfg
\* (re-admitted with its counter log behind),
\* FelixShardElectWipeNonVoterNoCatchUpFailover.cfg and
\* FelixShardElectWipeNonVoterEvidenceOnlyFailover.cfg (the older twins'
\* faults without elections).
\*
\* Evidence: `a_replaced_copy_refuses_a_fence_without_a_set`,
\* `a_counter_fence_is_refused_while_the_cache_copy_is_a_learner` in
\* crates/server/felix-replication/src/replica/tests/non_voting.rs,
\* `a_node_registered_under_another_id_starts_replaced` in
\* services/felix-broker-service/src/node/storage/tests.rs, and
\* `a_promotion_fence_asks_a_replica_it_has_not_heard_from_whether_it_checks_sets`
\* in crates/server/felix-replication/src/promotion/tests.rs.

