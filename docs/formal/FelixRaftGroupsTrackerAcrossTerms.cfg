\* A member keeps its tracker across terms and serves from it when it leads
\* again, missing a redrive committed by the leader in between.
\*
\* Evidence: none, Raft shards refuse group operations until the design this
\* models is built (#2446).

SPECIFICATION Spec

CONSTANTS
    Members = {a, b}
    N = 2
    SeekTo = {1, 3}
    MaxChanges = 2
    MaxLog = 4
    EpochCheck = TRUE
    DeleteWatermark = TRUE
    IfNewChecksTracker = TRUE
    TermBoundTrackers = FALSE
    HydrateFromApplied = TRUE
    WaitOwnProposals = TRUE
    DeleteRetiresAll = TRUE
    DeadBeforeAdvance = TRUE
    KeepRedriven = TRUE

SYMMETRY Symm

INVARIANTS
    RedrivenOwed
