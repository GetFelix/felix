\* FelixShardCpLiveRefusals.cfg keeping the pins for good: no drop at the
\* leader's open (`PinsDropAtOpen`) or on admission (`PinsDropOnAdmit`).
\* TLC finds a shard that never serves: c's copy changes while a, still
\* pinned, fences; a opens at 2; placement re-admits c at 3, a generation b
\* promised to its own withdrawn standing, and a's joint fence counts
\* neither c, whose pin still names its old copy, nor b.
\* Evidence: none, the twin of FelixShardCpLiveRefusals.cfg.

