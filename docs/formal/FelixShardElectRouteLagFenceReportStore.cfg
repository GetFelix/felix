\* #1940's fix with the report store (`RenameSpec`):
\* FelixShardElectRouteLagFence.cfg with the refusal read from the report
\* the control plane stored (`ReportStore`). A leader still fencing runs no
\* passes, so nothing replaces its refusal. Passes `OwnBallotCaughtUp` and
\* `OwnBallotFenceCaughtUp`.
\*
\* Evidence: `a_refusal_is_carried_until_a_later_generation`
\*   (crates/server/felix-replication/src/reporter/tests.rs) -- the reporter
\*   repeats the refusal; `supersedes` in
\*   services/felix-controlplane-service/src/model/shard.rs -- the store keeps
\*   the last report at a generation.

SPECIFICATION RenameSpec

CONSTANTS
    Brokers = {a, b, c}
    L = 2
    Margin = 0
    Eps = 0
    Drift = 0
    MaxTime = 0
    MaxWrites = 0
    CheckAtCommit = FALSE
    Quorum = TRUE
    Promotion = "log-order"
    ReportBeforeAck = FALSE
    Handoff = FALSE
    WaitForDrained = TRUE
    FenceAtClaim = TRUE
    AckOnAdmit = FALSE
    FenceFromAdmit = FALSE
    MaxMoves = 0
    Planners = {}
    CasWrites = TRUE
    StageMove = FALSE
    LearnerVotes = FALSE
    Resends = FALSE
    SequencesInLog = TRUE
    Cancel = FALSE
    CancelCas = TRUE
    ReportBound = "acknowledged"
    AckChecksLease = FALSE
    AckOnResponse = FALSE
    AckByFollowers = TRUE
    FenceOnPromote = TRUE
    LabelOnReceipt = FALSE
    StartRecord = TRUE
    ReportFromAnswers = FALSE
    ReportFloor = FALSE
    Spares = {}
    ReplaceOnPromote = FALSE
    SeatHoldsCopy = TRUE
    Grow = FALSE
    PromoteDestination = FALSE
    Counters = FALSE
    CounterCatchUp = FALSE
    Ballots = TRUE
    Elections = 1
    FenceEveryChange = FALSE

    Suspicions = 1
    SetCheck = TRUE
    JointFence = TRUE
    Adopt = 3
    AdoptMatch = TRUE
    Swaps = 0
    PreVote = TRUE
    Wipes = 0
    StorageIds = FALSE
    PreVoteAsked <- Yes
    FailStops <- One
    Renames <- Yes
    RouteLags <- Yes
    NamedHereWaits <- No
    StaleFenceAnswered <- Yes
    OpenChecksOwnBallot <- Yes
    OwnBallotFenceRefused <- Yes
    ReportStore <- Yes

PROPERTIES
    OwnBallotCaughtUp
    OwnBallotFenceCaughtUp

INVARIANTS
    TypeOK
    OneLeaderPerGeneration
    AckedHeldByLeader
    AckedAgree
    AckedOnMajority
    NoTruncationBelowHwm
    AdoptedMatchesOpened
    SetChangesJoint
