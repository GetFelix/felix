\* FelixRaftReformLeaseTail.cfg with the re-form taking the lowest end among
\* the newest term's allowances the copies read (issue 3109). A copy that
\* stored an older, lower end the leader named drags the end below what a
\* majority held: the leader answers a record on its lease, is elected again
\* in the next term and writes nothing, and the re-form drops the record from
\* the leader's intact disk.
\*
\* Evidence: none, this models the design for #3103, which is not built.

