\* FelixShardElectWipeNonVoterFailover.cfg with placement writes that may
\* name no learners (`WriteDropsLearners`): a write whose read of the
\* assignment it replaces failed and was taken for none, or one from a
\* control plane that predates learners on Postgres. TLC finds a follower
\* wiped, held a learner, then a placement write that drops it while it is
\* still a non-voter (PlacementKnowsLearners). From there failover could
\* name it.
\*
\* Evidence: `an_operator_write_whose_read_fails_does_not_drop_the_learners`
\* in services/felix-controlplane-service/src/cluster/placement/tests/readmit.rs.

