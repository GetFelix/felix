\* FelixShardCpDown.cfg without `SelfSuspicion`: a broker named the shard's
\* leader never stands for it, as in the code (`follows` in
\* crates/server/felix-replication/src/election/candidate.rs). TLC finds a
\* shard with no leader for good: the control plane's leader is elected one
\* generation higher and opens, then stops and comes back with the control
\* plane down. Its open at the assignment is refused for its own newer
\* ballot, it does not stand since the route names itself, and no other
\* broker can win a pre-vote, since its log is ahead of theirs.

SPECIFICATION CpDownSpec

CONSTANTS
    Brokers = {a, b, c}
    L = 2
    Margin = 0
    Eps = 0
    Drift = 0
    MaxTime = 0
    MaxWrites = 0
    CheckAtCommit = FALSE
    Quorum = TRUE
    Promotion = "log-order"
    ReportBeforeAck = FALSE
    Handoff = FALSE
    WaitForDrained = TRUE
    FenceAtClaim = TRUE
    AckOnAdmit = FALSE
    FenceFromAdmit = FALSE
    MaxMoves = 0
    Planners = {}
    CasWrites = TRUE
    StageMove = FALSE
    LearnerVotes = FALSE
    Resends = FALSE
    SequencesInLog = TRUE
    Cancel = FALSE
    CancelCas = TRUE
    ReportBound = "acknowledged"
    AckChecksLease = FALSE
    AckOnResponse = FALSE
    AckByFollowers = TRUE
    FenceOnPromote = TRUE
    LabelOnReceipt = FALSE
    StartRecord = TRUE
    ReportFromAnswers = FALSE
    ReportFloor = FALSE
    Spares = {}
    ReplaceOnPromote = FALSE
    SeatHoldsCopy = TRUE
    Grow = FALSE
    PromoteDestination = FALSE
    Counters = FALSE
    CounterCatchUp = FALSE
    Ballots = TRUE
    Elections = 4
    FenceEveryChange = FALSE

    Suspicions = 0
    SetCheck = TRUE
    JointFence = TRUE
    Adopt = 4
    AdoptMatch = TRUE
    Swaps = 0
    PreVote = TRUE
    Wipes = 0
    StorageIds = FALSE
    FailStops <- One
    Restarts <- Yes
    Withdraws <- Yes
    Renames <- Yes
    OwnBallotRefused <- Yes
    OverlayRefused <- Yes
    HaltReported <- Yes
