\* FelixRaftWrittenJoint.cfg across a change of leader: two terms.
\*
\* Evidence: `a_majority_of_one_half_of_a_joint_membership_is_not_enough`,
\*   `a_joint_membership_needs_both_halves` -- both halves are needed.
\*   `a_learner_that_has_written_does_not_make_a_majority`,
\*   `a_learners_report_is_not_counted` -- a learner never counts.
\*   `a_report_from_another_term_does_not_make_a_majority` -- only a report
\*   at the leader's own term counts.

SPECIFICATION Spec

CONSTANTS
    Servers = {a, b, c, d}
    Nobody = Nobody
    InitVoters = {a, b, c}
    InitLearners = {d}
    NewVoters = {a, b, d}
    MaxTerm = 2
    MaxWrites = 1
    MaxChanges = 1
    MaxCrashes = 0
    MaxPowerCuts = 0
    LearnerCounts = FALSE
    OtherTermCounts = FALSE
    JointOneHalf = FALSE
    WrittenCommits = FALSE

SYMMETRY Symm

INVARIANTS
    TypeOK
    OneLeaderPerTerm
    LogMatching
    LeaderCompleteness
    StateMachineSafety
    CommittedHeld
    AckedHeld
    AckedNeverLost
