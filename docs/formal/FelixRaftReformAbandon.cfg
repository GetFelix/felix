\* A shard with one replica whose broker a is declared dead, then abandoned:
\* the next epoch starts on b with an empty base, its first index above
\* every offset given out. Before that the copy may rotate and the group
\* re-form or start by itself, and a can come back with its copy.
\* Evidence: `an_abandoned_copy_starts_at_the_first_index` and
\* `a_copy_of_an_abandoned_epoch_does_not_lead_when_it_returns`.

