\* The failover of FelixShardIdempotentFailover.cfg with the producer
\* sequences kept in the leader's memory, as the broker did before they were
\* derived from the log. TLC is expected to find the promoted broker storing
\* the re-sent write a second time (NoDuplicate).
\* Evidence: none, this models the in-memory table the broker no longer uses
\* for a durable stream. The passing configuration cites the tests showing the
\* log is what is consulted.

