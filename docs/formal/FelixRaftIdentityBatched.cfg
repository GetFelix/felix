\* FelixRaftIdentity.cfg and the relaxed-fsync crash with the batched log mark,
\* the one the broker ships. No directory or root goes back here, so the batch
\* never runs and the mark stays where the copy opened: the furthest it can
\* trail. The rules that catch a wipe, a lost root and a relaxed crash do not
\* lean on the log mark.
\*
\* Evidence: `the_shipped_log_mark_is_one_write_a_second`,
\* `a_wiped_copy_comes_back_under_a_new_id_that_does_not_vote` and
\* `a_copy_back_from_a_power_cut_does_not_vote_with_the_cut_log`.

