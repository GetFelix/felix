\* Two control-plane instances moving a shard at once: one reads and writes in
\* a single step, the other acts on a read it took earlier. Every assignment
\* write lands only at the generation its read saw, so a step decided from a
\* read the other instance has since acted on writes nothing.
\*
\* No client writes: the race is in who serves, and writes would multiply the
\* interleavings without adding to it. Time stops short of any lease lapse,
\* so no promotion; FelixShardStalePromotionCas.cfg covers promotions.
\*
\* `CasWrites = FALSE` is the same pair writing unconditionally, in
\* FelixShardStalePlanner.cfg, and it serves the shard on two brokers.
\* Evidence: the implementation behaviours this configuration asserts.
\* `a_fence_planned_before_a_cut_over_is_not_written_after_it` -- CasWrites:
\*   a move step planned before another instance's cut-over is not written.
\* `a_fence_planned_before_a_cut_over_is_refused_after_it` -- every store
\*   backend refuses that write.
\* `a_stale_conditional_assignment_write_is_answered_not_applied` -- the Raft
\*   state machine decides the comparison as the command applies.

SPECIFICATION Spec

CONSTANTS
    Brokers = {a, b, c}
    L = 4
    Margin = 2
    Eps = 1
    Drift = 0
    MaxTime = 3
    MaxWrites = 0
    CheckAtCommit = TRUE
    Quorum = TRUE
    Promotion = "leader-report"
    ReportBeforeAck = TRUE
    Handoff = TRUE
    WaitForDrained = TRUE
    FenceAtClaim = TRUE
    AckOnAdmit = FALSE
    FenceFromAdmit = FALSE
    MaxMoves = 2
    Planners = {p1}
    CasWrites = TRUE
    StageMove = FALSE
    LearnerVotes = FALSE
    Resends = FALSE
    SequencesInLog = TRUE
    Cancel = FALSE
    CancelCas = TRUE
    ReportBound = "acknowledged"
    AckChecksLease = TRUE
    AckOnResponse = FALSE
    AckByFollowers = FALSE
    FenceOnPromote = FALSE
    LabelOnReceipt = FALSE
    StartRecord = FALSE
    ReportFromAnswers = FALSE
    ReportFloor = FALSE
    Spares = {}
    ReplaceOnPromote = FALSE
    SeatHoldsCopy = TRUE

SYMMETRY Symm

INVARIANTS
    TypeOK
    AtMostOneServing
    AckedSurvive
    AckedAgree
    NoTruncationBelowHwm
    NoStaleCommit
    AckedOnMajority
