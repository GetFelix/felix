\* FelixShardElectLiveUnclean.cfg, but the broker that restarts after an
\* unclean crash may be one whose ballot names itself (`UncleanLeads`): the
\* leader, a candidate still fencing, or one that stood and gave its round
\* up. A crash between recording a candidacy and writing its ballot leaves
\* nothing on disk, so it is the follower's restart. Its new process reads
\* the ballot as the copy it led and refuses until a leader ships to it, so
\* the other two must elect: no broker stops for good (`FailStops = 0`),
\* since a stopped one beside the refusing copy is two faults (#1295).
\* A leader is elected and stays (`ElectionSettles`).
\* Detectors do not misfire here: with every broker up they let any broker
\* stand at any time, and the state space did not finish in 12 minutes
\* (5.6 million distinct states at depth 21, still growing). Without a
\* leader, every broker suspects, so the elections this config is about
\* still run.
\*
\* Evidence: `a_copy_led_before_stays_led_after_it_stands` (unclean/tests.rs)
\* and `a_copy_that_stood_after_an_unclean_start_takes_a_newer_fence`
\* (replica/tests/fence.rs) in crates/server/felix-replication.

SPECIFICATION LiveSpec

CONSTANTS
    Brokers = {a, b, c}
    L = 2
    Margin = 0
    Eps = 0
    Drift = 0
    MaxTime = 0
    MaxWrites = 0
    CheckAtCommit = FALSE
    Quorum = TRUE
    Promotion = "log-order"
    ReportBeforeAck = FALSE
    Handoff = FALSE
    WaitForDrained = TRUE
