\* #1933 without its fix (`RenameSpec`): three brokers, the control plane up,
\* no writes, no symmetry (unsound for liveness), promotion on the
\* followers' word up to generation 1 (`Suspicions = 1`), adoption up to
\* generation 3, one generation of elections, one broker allowed to stop for
\* good, renames on a refusal (`Renames`), and a promoted broker whose routes
\* lag its promotion's ballot (`RouteLags`). Neither of #1936's rules: a
\* round on the stale route stands at the generation above its own
\* leadership (`NamedHereWaits` off), and the leader left below its own
\* ballot reports nothing (`OwnBallotReported` off). It violates
\* `OwnBallotCaughtUp`: the old leader stops, the control plane names
\* another broker one generation up, that broker's round on the route naming
\* the old leader stands one generation higher and withdraws, and the new
\* leader opens below its own ballot for good. TLC checks liveness on a
\* timer, so the trace and state count vary from run to run; about a minute
\* with one worker.
\*
\* Evidence: `a_broker_named_leader_does_not_stand_before_its_routes_catch_up`
\*   -- the round #1936 stops from standing.

SPECIFICATION RenameSpec

CONSTANTS
    Brokers = {a, b, c}
    L = 2
    Margin = 0
    Eps = 0
    Drift = 0
    MaxTime = 0
    MaxWrites = 0
    CheckAtCommit = FALSE
    Quorum = TRUE
    Promotion = "log-order"
    ReportBeforeAck = FALSE
    Handoff = FALSE
    WaitForDrained = TRUE
    FenceAtClaim = TRUE
    AckOnAdmit = FALSE
    FenceFromAdmit = FALSE
    MaxMoves = 0
    Planners = {}
    CasWrites = TRUE
    StageMove = FALSE
    LearnerVotes = FALSE
    Resends = FALSE
    SequencesInLog = TRUE
    Cancel = FALSE
    CancelCas = TRUE
    ReportBound = "acknowledged"
    AckChecksLease = FALSE
    AckOnResponse = FALSE
    AckByFollowers = TRUE
    FenceOnPromote = TRUE
    LabelOnReceipt = FALSE
    StartRecord = TRUE
    ReportFromAnswers = FALSE
    ReportFloor = FALSE
    Spares = {}
    ReplaceOnPromote = FALSE
    SeatHoldsCopy = TRUE
    Grow = FALSE
    PromoteDestination = FALSE
    Counters = FALSE
    CounterCatchUp = FALSE
    Ballots = TRUE
    Elections = 1
    FenceEveryChange = FALSE

    Suspicions = 1
    SetCheck = TRUE
    JointFence = TRUE
    Adopt = 3
    AdoptMatch = TRUE
    Swaps = 0
    PreVote = TRUE
    Wipes = 0
    StorageIds = FALSE
    PreVoteAsked <- Yes
    FailStops <- One
    Renames <- Yes
    RouteLags <- Yes
    NamedHereWaits <- No
    OwnBallotReported <- No

PROPERTIES
    OwnBallotCaughtUp

INVARIANTS
    TypeOK
    OneLeaderPerGeneration
    AckedHeldByLeader
    AckedAgree
    AckedOnMajority
    NoTruncationBelowHwm
    AdoptedMatchesOpened
    SetChangesJoint
