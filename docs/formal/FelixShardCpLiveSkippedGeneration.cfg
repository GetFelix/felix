\* FelixShardCpLive.cfg cut down to the #2024 scenario: a leader adopted at
\* generation 3 whose log keeps its set from generation 1 restarts, and its
\* fence learns the set before from the snapshot's `previous` (#2024), so it
\* ends up serving (`CpLeaderServes`). The snapshot is taken to carry it
\* (`PriorMayBeUnknown` off). Adoption stops at generation 3 (`Adopt`), where
\* FelixShardCpLive.cfg goes to 4. At 2 the case is out of reach: an adopted
\* leader then keeps the set right before, and a rename or promotion hands
\* the leader the current set. Two brokers stop at most (`Stops`): one to
\* start the elections, the adopted leader for the restart.
\* Not registered: it runs past a pull request's hour. The nightly exhaustive
\* job checks it (tla-walk.yml).
\* Evidence: none, the twin of FelixShardCpLive.cfg; the code side is the
\* `set_before` tests in promotion/tests/joint.rs and the joint_fence cluster test.

