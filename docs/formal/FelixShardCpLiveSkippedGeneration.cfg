\* FelixShardCpLive.cfg cut down to the #2024 scenario so it finishes in a
\* pull request's CI: an adopted leader's set is two generations back when a
\* rename past a ballot (`RenamePastBallot`, #1951) skips a generation, and
\* the leader restarts (`Restarts`). Standings stop at generation 2 (`Elections`,
\* `Adopt`), where FelixShardCpLive.cfg goes to 4. The fence learns the set
\* before from the snapshot's `previous` (#2024), so the leader ends up
\* serving (`CpLeaderServes`); the snapshot is taken to carry it
\* (`PriorMayBeUnknown` off).
\* Evidence: none, the twin of FelixShardCpLive.cfg; the code side is the
\* `set_before` tests in promotion/tests/joint.rs and the joint_fence cluster test.

