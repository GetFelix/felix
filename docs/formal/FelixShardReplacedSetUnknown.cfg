\* FelixShardFencedAckAnyReplaced.cfg with the joint fence (`SetCheck`,
\* `JointFence`), placement promoting on suspicion up to generation 2 so the
\* old leader may still be serving, and a leader that loses the set its
\* generation leaves (`SetLossUpTo`): it learned the shard from a snapshot,
\* or restarted after it opened (#1872). It is named again one up only once
\* it opened that generation (`CpRename`), so the fence it skips there was
\* already taken. Failovers keep an unopened set (`KeepsUnopened`, #1880).
\* Without it this violates AckedHeldByLeader (16 states deep), no set lost:
\* b opens at 2 on c's answer alone, and its report names c caught up at 0,
\* as the broker's does (acknowledging by its followers, `acknowledged` in
\* driver/shard.rs has no inherited floor, so it is what a majority confirmed
\* at 2). c is promoted at 3 and does not fence {a, b, c}: the #1878 path,
\* reached under leader-report placement too.
\* A failover fences the control plane's set from the generation before
\* beside its own (`FenceRecordedSet`), as `set_before` and `logged_besides`
\* in promotion/joint.rs do. Without it this violates AckedHeldByLeader (20
\* states deep), no set lost: c never answered b's fence at 2, is promoted at
\* 3 and fences its stale {a, b, c}, not {b, c, d}, where the write sits.
\*
\* Evidence: `only_a_set_this_broker_could_not_know_is_unknown` and
\*   `an_unknown_set_before_keeps_the_fence_pending`
\*   (crates/server/felix-replication/src/promotion/tests/joint.rs).

SPECIFICATION Spec

CONSTANTS
    Renames <- Yes
    SetLossUpTo <- Two
    KeepsUnopened <- Yes
    FenceRecordedSet <- Yes
    Brokers = {a, b, c, d}
    L = 4
    Margin = 0
    Eps = 0
    Drift = 0
    MaxTime = 4
    MaxWrites = 2
    CheckAtCommit = FALSE
    Quorum = TRUE
    Promotion = "leader-report"
    ReportBeforeAck = FALSE
    Handoff = FALSE
    WaitForDrained = TRUE
    FenceAtClaim = TRUE
    AckOnAdmit = FALSE
    FenceFromAdmit = FALSE
    MaxMoves = 0
    Planners = {}
    CasWrites = TRUE
    StageMove = FALSE
    LearnerVotes = FALSE
    Resends = FALSE
    SequencesInLog = TRUE
    Cancel = FALSE
    CancelCas = TRUE
    ReportBound = "acknowledged"
    AckChecksLease = FALSE
    AckOnResponse = FALSE
    AckByFollowers = TRUE
    FenceOnPromote = TRUE
    LabelOnReceipt = FALSE
    StartRecord = TRUE
    ReportFromAnswers = FALSE
    ReportFloor = FALSE
    Spares = {d}
    ReplaceOnPromote = TRUE
    SeatHoldsCopy = TRUE
    Grow = FALSE
    PromoteDestination = FALSE
    Counters = FALSE
    CounterCatchUp = FALSE
    Ballots = FALSE
    Elections = 0
    FenceEveryChange = FALSE

    Suspicions = 2
    SetCheck = TRUE
    JointFence = TRUE
    Adopt = 0
    AdoptMatch = TRUE
    Swaps = 0
    PreVote = FALSE
    Wipes = 0
    StorageIds = FALSE
SYMMETRY Symm

INVARIANTS
    TypeOK
    AckedHeldByLeader
    AckedAgree
    NoTruncationBelowHwm
