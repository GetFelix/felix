\* FelixShardFencedAckAnyReplaced.cfg with the joint fence (`SetCheck`,
\* `JointFence`), placement promoting on suspicion up to generation 2 so the
\* old leader may still be serving, and a leader that loses the set its
\* generation leaves (`SetLossUpTo`): it learned the shard from a snapshot,
\* or restarted after it opened (#1872). It is named again one up only once
\* it opened that generation (`CpRename`), so the fence it skips there was
\* already taken.
\*
\* Evidence: `only_a_set_this_broker_could_not_know_is_unknown` and
\*   `an_unknown_set_before_keeps_the_fence_pending`
\*   (crates/server/felix-replication/src/promotion/tests/joint.rs).

SPECIFICATION Spec

CONSTANTS
    Renames <- Yes
    SetLossUpTo <- Two
    Brokers = {a, b, c, d}
    L = 4
