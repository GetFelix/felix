    Servers = {a, b, c}
    Nobody = Nobody
    MaxTerm = 2
    MaxWrites = 1
    MaxSleeps = 2
    MaxAudits = 1
    MaxDeaths = 1
    MaxRestarts = 0
    MaxAlarms = 1
    MaxLost = 1
