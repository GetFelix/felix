\* Every behaviour ends: under weak fairness the model reaches a state where
\* nothing more can happen. That is what lets QuiescentLed and QuiescentLevel,
\* which are invariants on such states, stand for liveness. A temporal check,
\* so no symmetry set. Runs with the two rules of issue 2310 on.
\* Evidence: none, sleep is not built yet (issue 2244).

SPECIFICATION FairSpec

