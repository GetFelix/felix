\* FelixRaftLeaseRestoreTransferStepDown.cfg with three terms and no
\* transfer: a leader that voided a term on a step-down restarts with its own
\* vote stored and its void wiped, and campaigns at once in a third term.
\* Dropping the transfer keeps three terms small enough for CI; the transfer
\* with a restart is in RestoreTransferStepDown. ElectionTimeoutMin is 1
\* where FelixRaftLeaseTransferStepDown.cfg has 0: a stepped-down leader
\* campaigning in the same tick is not checked with a restart.
\*
\* Evidence: none, the restart fast path (pull request 2445) is not built.

