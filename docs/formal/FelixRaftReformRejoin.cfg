\* An apply stops one copy and does not finish, and the group elects without
\* it. The stopped copy comes back under a new copy id as a learner. Two disks
\* may then be lost, and a second plan re-forms the group. The first plan no
\* longer matches what the copies hold, so nothing it read is used. One term
\* per epoch. The design does not say how a stopped copy comes back (issue
\* 2403); the model has it rotate.
\* 
\* Evidence: none, re-forming is not built yet (track 4 of issue 2244).

