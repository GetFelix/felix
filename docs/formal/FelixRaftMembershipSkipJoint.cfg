\* FelixRaftMembership.cfg with one rule dropped. A move swaps one voter for
\* the learner in a single entry. The brokers that hold the entry and the
\* ones that do not use voter sets whose majorities need not share a broker,
\* and one term gets two leaders.
\*
\* Evidence: none, this models an alternative the implementation does not use.

SPECIFICATION Spec

CONSTANTS
    Servers = {a, b, c, d}
    Nobody = Nobody
    InitVoters = {a, b, c}
    InitLearners = {d}
    MaxTerm = 2
    MaxWrites = 0
    MaxCalls = 1
    SkipJoint = TRUE
    ChangeBeforeCommit = FALSE
    LearnerCounts = FALSE
    ClaimRacesMembership = FALSE
    ReopenOnReturn = FALSE

SYMMETRY Symm

INVARIANTS
    OneLeaderPerTerm
