\* Liveness once the control plane stops (`CpDownSpec`, #1917): as
\* FelixShardCpLive.cfg, with the fixes from #1914's list of dead ends on,
\* but the control plane stops for good at some point (`CpStops`) and every
\* stopped broker comes back. A replica stands when the broker of the leader
\* it follows is down (`BrokerSuspicion`) or when that shard's leader is not
\* serving (`ShardSuspicion`), including a broker named the leader whose
\* open was refused (`SelfSuspicion`). A broker still fencing refuses a pre-vote only
\* while its fence can complete (`PreVoteBounded`). A promise to a candidate
\* holds a replica back only while that candidate still stands, and only for
\* a bound when its fence cannot complete (`StandBehindBounded`). Elections
\* alone end with a leader serving, or stop only at the model's bound on
\* generations with a broker that would stand again (`CpDownServesInBound`).
\* Evidence: none, the fixes it turns on are proposals from #1914 and #1951; no test drives a shard through them.

