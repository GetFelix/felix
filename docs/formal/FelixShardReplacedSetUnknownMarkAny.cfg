\* FelixShardReplacedSetUnknownMark.cfg trusting the mark at any generation
\* (`MarkAnyGeneration`), not only where the control plane's change log
\* holds the shard's `assigned` change. It violates AckedHeldByLeader: a
\* promoted leader that learns the shard from a snapshot while fencing reads
\* the set it leaves as empty and opens on its new set alone.
\*
\* Evidence: `only_a_set_this_broker_could_not_know_is_unknown` and
\*   `an_unknown_set_before_keeps_the_fence_pending`
\*   (crates/server/felix-replication/src/promotion/tests/joint.rs),
\*   with the check the fix requires dropped.

SPECIFICATION Spec

CONSTANTS
    Renames <- Yes
    SetLossUpTo <- Two
    KeepsUnopened <- Yes
    FenceRecordedSet <- Yes
    FirstAssignMark <- Yes
    MarkAnyGeneration <- Yes
    Brokers = {a, b, c, d}
    L = 4
    Margin = 0
    Eps = 0
    Drift = 0
    MaxTime = 4
    MaxWrites = 2
    CheckAtCommit = FALSE
    Quorum = TRUE
    Promotion = "leader-report"
    ReportBeforeAck = FALSE
    Handoff = FALSE
    WaitForDrained = TRUE
    FenceAtClaim = TRUE
    AckOnAdmit = FALSE
    FenceFromAdmit = FALSE
    MaxMoves = 0
    Planners = {}
    CasWrites = TRUE
    StageMove = FALSE
    LearnerVotes = FALSE
    Resends = FALSE
    SequencesInLog = TRUE
    Cancel = FALSE
    CancelCas = TRUE
    ReportBound = "acknowledged"
    AckChecksLease = FALSE
    AckOnResponse = FALSE
    AckByFollowers = TRUE
    FenceOnPromote = TRUE
    LabelOnReceipt = FALSE
    StartRecord = TRUE
    ReportFromAnswers = FALSE
    ReportFloor = FALSE
    Spares = {d}
    ReplaceOnPromote = TRUE
    SeatHoldsCopy = TRUE
    Grow = FALSE
    PromoteDestination = FALSE
    Counters = FALSE
    CounterCatchUp = FALSE
    Ballots = FALSE
    Elections = 0
    FenceEveryChange = FALSE

    Suspicions = 2
    SetCheck = TRUE
    JointFence = TRUE
    Adopt = 0
    AdoptMatch = TRUE
    Swaps = 0
    PreVote = FALSE
    Wipes = 0
    StorageIds = FALSE
SYMMETRY Symm

INVARIANTS
    TypeOK
    AckedHeldByLeader
    AckedAgree
    NoTruncationBelowHwm
