\* FelixShardFencedLeaderCrash.cfg without the give-up, as before #1295: the
\* crashed leader comes back still leading at its generation and serves
\* without the record it acknowledged on itself and a follower, then lost.
\* Following the followers' answers does not save it, since it never steps
\* down.
\*
\* Expected to violate AckedHeldByLeader. TLC stops at the first
\* counterexample, so this stays cheap.
\*
\* Evidence: this configuration REMOVES the give-up.
\* `a_crashed_leader_gives_up_the_generation_it_led` -- drop it and the
\*   restarted broker opens the shard at its old generation from the copy
\*   that lost the record, which is the trace TLC finds.
\*
\* The crash may be the process's alone (`ProcessCrashes`), which keeps the
\* log and, as the broker does on the same boot, the identity
\* (`KeepIdOnSameBoot`, #1371); a machine crash loses a suffix and rotates.

SPECIFICATION Spec

CONSTANTS
    Brokers = {a, b, c}
    L = 4
    Margin = 0
    Eps = 0
    Drift = 0
    MaxTime = 0
    MaxWrites = 1
    CheckAtCommit = FALSE
    Quorum = TRUE
    Promotion = "leader-report"
    ReportBeforeAck = FALSE
    Handoff = FALSE
    WaitForDrained = TRUE
    FenceAtClaim = TRUE
    AckOnAdmit = FALSE
    FenceFromAdmit = FALSE
    MaxMoves = 0
    Planners = {}
    CasWrites = TRUE
    StageMove = FALSE
    LearnerVotes = FALSE
    Resends = FALSE
    SequencesInLog = TRUE
    Cancel = FALSE
    CancelCas = TRUE
    ReportBound = "acknowledged"
    AckChecksLease = FALSE
    AckOnResponse = FALSE
    AckByFollowers = TRUE
    FenceOnPromote = TRUE
    LabelOnReceipt = FALSE
    StartRecord = TRUE
    ReportFromAnswers = TRUE
    ReportFloor = TRUE
    Spares = {}
    ReplaceOnPromote = FALSE
    SeatHoldsCopy = TRUE
    Grow = FALSE
    PromoteDestination = FALSE
    Counters = FALSE
    CounterCatchUp = FALSE
    Ballots = TRUE
    Elections = 0
    FenceEveryChange = TRUE
    Suspicions = 0
    SetCheck = FALSE
    JointFence = FALSE
    Adopt = 0
    AdoptMatch = TRUE
    Swaps = 0
    PreVote = FALSE
    Wipes = 1
    StorageIds = TRUE
    CrashLoses <- Yes
    ProcessCrashes <- Yes
    KeepIdOnSameBoot <- Yes
    RotateOnCrash <- Yes
    CrashLeader <- Yes

SYMMETRY Symm

INVARIANTS
    TypeOK
    AckedHeldByLeader
    AckedAgree
    NoTruncationBelowHwm
