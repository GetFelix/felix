\* Without the hold: {1,2,3} -> {1,2,4} -> {1,4,5} -> {4,5,6} with a
\* leader that never joins ends on brokers the group never reached, and they
\* form a second group (#2905).
\* Evidence: none. It models the code before the hold, to show why.
CONSTANTS
    Brokers = {1, 2, 3, 4, 5, 6}
    Sets = {{1, 2, 3}, {1, 2, 4}, {1, 4, 5}, {4, 5, 6}, {2, 3, 4}, {3, 4, 5}}
    Init0 = {1, 2, 3}
    Hold = FALSE
    ByCopy = TRUE
    MaxWipes = 0
INIT Init
NEXT Next
INVARIANTS TypeOK OneGroup
