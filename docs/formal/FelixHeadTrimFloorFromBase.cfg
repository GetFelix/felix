\* FelixHeadTrim.cfg with a broker's readable start taken from where its
\* segments start, with no logical floor. Deletion stops at a segment
\* boundary or the active segment, below the floor asked for, and the
\* records in between are served after the trim is acknowledged. This is why
\* the record carries the exact floor and reads check it.
\*
\* Evidence: none, this models an alternative the design does not use.

SPECIFICATION Spec

CONSTANTS
    Brokers = {a, b, c}
    MaxWrites = 2
    MaxTrims = 3
    MaxGen = 3
    MaxCrashes = 0
    Local = FALSE
    FloorFromBase = TRUE
    ApplyOnStore = FALSE
    DeleteAboveCommit = FALSE
    Unconditional = FALSE
    Untagged = FALSE
    NoOpUnchecked = FALSE
    Retention = FALSE

SYMMETRY Symm

INVARIANTS
    NoReadBelowAckedTrim
    NothingLostAboveFloor
    NeverMoreThanAsked
    StaleTrimRefused
