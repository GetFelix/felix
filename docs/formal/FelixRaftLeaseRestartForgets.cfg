\* FelixRaftLeaseRestart.cfg with no refusal window after a restart: neither
\* the node layer's hold nor openraft's renewal at a start. A follower
\* answers the leader, restarts, and votes for another candidate while the
\* leader's lease still runs. No engine Felix uses does this: openraft 0.10.0
\* renews the window for that follower (FelixRaftLeaseRestartRenews.cfg).
\* This is the twin that shows one of the two rules is needed.
\*
\* Evidence: none, this models an engine that keeps no window across a restart.

