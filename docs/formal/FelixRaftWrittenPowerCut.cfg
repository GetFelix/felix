\* Every rule on and one power cut, which rotates the broker's copy as the
\* broker does once a copy there vouched for an unsynced record (#2423): the old identity leaves the
\* voter set and cannot vote. The record is written on the leader and one
\* follower and acknowledged, and one of the two loses power before its
\* fsync. The other two cannot elect without it, so the shard waits for the
\* copy that holds it. FelixRaftWrittenPowerCutKeeps.cfg is the same with the
\* copy kept, and violates AckedNeverLost.
\*
\* Evidence: `a_copy_back_from_a_power_cut_does_not_vote_with_the_cut_log` --
\*   the copy that lost R to a power cut comes back under a new copy id and
\*   the other two elect no leader without R.

SPECIFICATION Spec

CONSTANTS
    Servers = {a, b, c}
    Nobody = Nobody
    InitVoters = {a, b, c}
    InitLearners = {}
    NewVoters = {a, b, c}
    MaxTerm = 1
    MaxWrites = 1
    MaxChanges = 0
    MaxCrashes = 0
    MaxPowerCuts = 1
    LearnerCounts = FALSE
    OtherTermCounts = FALSE
    JointOneHalf = FALSE
    WrittenCommits = FALSE
    CutRotates = TRUE

SYMMETRY Symm

INVARIANTS
    TypeOK
    OneLeaderPerTerm
    LogMatching
    LeaderCompleteness
    StateMachineSafety
    CommittedHeld
    AckedHeld
    AckedNeverLost
