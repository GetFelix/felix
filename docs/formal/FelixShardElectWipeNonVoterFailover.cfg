\* FelixShardElectWipeNonVoter.cfg with time, so the control plane's own
\* failover (`Promote`) is reachable: the lease is one tick and time runs to
\* one, so a failover can follow a wipe, a re-admission or an election.
\* Failover never names a non-voter. All the safety invariants hold.
\* FelixShardElectWipeNonVoterFailsOver.cfg shows a failover beside a
\* non-voter is reached; FelixShardElectWipeNonVoterPromotes.cfg drops the
\* guard; FelixShardElectWipeNonVoterFailoverWipesLeader.cfg wipes a leader
\* too.
\*
\* Evidence: none yet; the code lands in #1009 S8 (non-voting rejoin), which must cite tests here.

