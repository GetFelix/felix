\* FelixShardElectWipeNonVoter.cfg with time, so the control plane's own
\* failover (`Promote`) is reachable: the lease is one tick and time runs to
\* one, so a failover can follow a wipe, a re-admission or an election.
\* Adoption up to generation 2 only: at 3 the state space passed 136M
\* distinct states without finishing in 35 min.
\* Failover never names a copy placement holds as a learner. All the safety
\* invariants hold, and `PlacementKnowsLearners`: every non-voter is one.
\* FelixShardElectWipeNonVoterFailsOver.cfg shows a failover beside a
\* non-voter is reached; FelixShardElectWipeNonVoterPromotes.cfg drops the
\* guard; FelixShardElectWipeNonVoterFailoverWipesLeader.cfg wipes a leader
\* too.
\*
\* Evidence: `failover_skips_a_replaced_member_until_its_leader_shows_it_holding_the_start`
\* and `a_wiped_member_is_readmitted_then_counts_once_it_holds_the_start` in
\* services/felix-controlplane-service/src/cluster/placement/tests/readmit.rs.

