\* FelixGroupsSplitSources.cfg with the check comparing only lengths. TLC
\* finds the skip: taking the logs from two replicas is safe only with a
\* check that names the dead letters, not just counts them.
\*
\* Evidence: none, this models an alternative the broker does not use.

SPECIFICATION Spec

CONSTANTS
    Replicas = {a, b, c}
    G = 2
    N = 1
    MaxGen = 3
    MaxCrashes = 1
    MaxCursors = 2
    CheckCursors = TRUE
    DependencyGen = FALSE
    KeepGroups = TRUE
    SplitSources = TRUE
    SyncBeforeShip = TRUE

SYMMETRY Symmetry

INVARIANT NoSkip
