\* The generation 0 case with the digest covering the generation field: b and
\* c carry generation 0 on every record and a the real one. This twin costs
\* availability, not safety: no follower's digest matches, no majority ever
\* acknowledges, and `NeverSwitches` holds. The seal would be retried
\* forever. FelixRaftSwitchReachGenZero.cfg is the same copies with the rule
\* on, where the switch completes.
\*
\* Evidence: none, this models an alternative the design does not use.

