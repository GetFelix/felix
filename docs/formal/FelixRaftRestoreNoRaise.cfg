\* FelixRaftRestore.cfg where the cut only lowers the copy's saved commit.
\* The point is the leader's acknowledged mark, which runs ahead of the
\* commit and further ahead of the commit the copy saved, so a copy that
\* holds every record below the point is still refused at the point.
\*
\* Evidence: `a_point_above_the_saved_commit_plans_at_the_point` -- a copy
\*   saved as committed below the point is cut, saved at the point and
\*   planned there; it fails with the raise taken out of `restore_to`.

SPECIFICATION Spec

CONSTANTS
    MaxWrites = 4
    MaxAfter = 2
    MaxNew = 1
    Step = 2
    Gap = 0
    NoReserve = FALSE
    LeaderMoves = FALSE
    RaiseOnCut = FALSE

INVARIANT
    ReserveCovers
    BaseKept
    RestoresAtPoint
    BackedUpNeverReused
