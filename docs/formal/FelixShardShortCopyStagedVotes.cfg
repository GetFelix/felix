\* FelixShardShortCopyStaged.cfg with the staged copy voting
\* (`LearnerVotes`) and the code's fence ids, the shape #1635 found. The
\* broker leaves a staged copy out of the quorum only if the leading process
\* saw it added (`staged_learner`), so a leader restarted cleanly at that
\* generation counts it. Here the first leader counts it: a acknowledges a
\* second write on a and the staged c, crashes keeping only the first, and
\* the failover sets `{b, a}` without c. The fence ids still name c (every
\* old member is named), so a refuses b's fence and the shard stays closed
\* until `abandon`. That refusal is what keeps the write. One promotion fits
\* (time to 1), and two writes give the crashed leader a record of its own
\* generation to keep.
\*
\* A nightly walk, as the other short-copy configurations.
\*
\* Invariants: AckedHeldByLeader, AckedAgree, NoTruncationBelowHwm.
\* AckedOnMajority is left out as in FelixShardShortCopySeat.cfg.
\*
\* Evidence: `a_leader_that_never_saw_the_set_before_counts_the_successor`
\* (the vote), `a_crashed_leader_of_two_copies_takes_the_fence` (the
\* exception) and `a_quorum_failover_does_not_promote_a_move_destination`.

SPECIFICATION Spec

CONSTANTS
    Brokers = {a, b, c}
    L = 1
    Margin = 0
    Eps = 0
    Drift = 0
    MaxTime = 1
    MaxWrites = 2
    CheckAtCommit = FALSE
    Quorum = TRUE
    Promotion = "leader-report"
    ReportBeforeAck = FALSE
    Handoff = FALSE
    WaitForDrained = TRUE
    FenceAtClaim = TRUE
    AckOnAdmit = FALSE
    FenceFromAdmit = FALSE
    MaxMoves = 0
    Planners = {}
    CasWrites = TRUE
    StageMove = TRUE
    LearnerVotes = TRUE
    Resends = FALSE
    SequencesInLog = TRUE
    Cancel = FALSE
    CancelCas = TRUE
    ReportBound = "acknowledged"
    AckChecksLease = FALSE
    AckOnResponse = FALSE
    AckByFollowers = TRUE
    FenceOnPromote = TRUE
    LabelOnReceipt = FALSE
    StartRecord = TRUE
    Spares = {}
    ReplaceOnPromote = FALSE
    SeatHoldsCopy = TRUE
    Grow = FALSE
    PromoteDestination = FALSE
    Counters = FALSE
    CounterCatchUp = FALSE
    Ballots = FALSE
    Elections = 0
    FenceEveryChange = FALSE
    Suspicions = 0
    SetCheck = FALSE
    JointFence = FALSE
    Adopt = 0
    AdoptMatch = TRUE
    Swaps = 0
    PreVote = FALSE
    Wipes = 1
    StorageIds = FALSE
    ReportFromAnswers = FALSE
    ReportFloor = FALSE

    CrashLoses <- Yes
    CrashLeader <- Yes
    GiveUpOnCrash <- Yes
    RefuseShortCopy <- Yes

SYMMETRY Symm

INVARIANTS
    TypeOK
    AckedHeldByLeader
    AckedAgree
    NoTruncationBelowHwm
