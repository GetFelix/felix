\* The report as implemented: counted from the followers' answers, and never
\* naming a follower short of the log the leader inherited. The same two
\* promotions as FelixShardReportFromAnswers.cfg, which loses the record
\* without the floor.
\*
\* QuorumReportNamesASuccessor is left out: a report counted from answers
\* names nobody until somebody answers, whatever the logs hold.
\* Evidence: the implementation behaviours this configuration asserts.
\* `a_new_leader_names_no_follower_before_it_answers` -- ReportFloor: followers
\*   that have not answered holding the inherited log are not named.
\* `a_new_leader_names_a_follower_holding_what_it_inherited` -- and one that
\*   has is.
\* `a_new_cache_leader_names_no_follower_missing_inherited_counters` -- the
\*   same floor on a cache shard's counter log.

