\* FelixShardElect.cfg with a follower replacement, as in
\* FelixShardFencedAckSeat.cfg: a spare joins beside a leaving follower, and
\* the leaving one goes at the next generation. A record is then acknowledged
\* on the leader and the newcomer, a majority of the new set. The replica
\* that left never heard of either generation and still knows the set it
\* started in. It stands, fences a majority of that old set, the follower
\* that never saw the record and itself, and opens without the record
\* (AckedHeldByLeader).
\*
\* Ballots do not stop this: the old set's majority never promised the
\* generations the new set used. A fence that carries the generation of the
\* set it counts, refused by a replica that knows a newer set, is what self-
\* election still needs before it can be turned on. Nothing in the code elects
\* yet, so this pins the finding rather than a defect.
\*
\* Evidence: none, nothing in the code elects a leader yet.

