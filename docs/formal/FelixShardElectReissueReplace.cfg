\* A generation claimed twice where the elected leader's set is not the
\* control plane's: FelixShardElectReissue.cfg with a spare, promotion that
\* replaces the old leader with it (`ReplaceOnPromote`), no write, and
\* adoption up to generation 2. A candidate stands on {a, b, c} while
\* placement promotes onto {b, c, d}; the two collide, and the reissued
\* leader fences the control plane's set and, jointly, the one it was
\* elected on (`ReissueFencesElected`, `logged_besides`). A report may be
\* old, so the reissued leader may never take the generation.
\*
\* Evidence: `a_reissued_elected_leader_fences_the_set_it_was_elected_on`
\*   -- the reissued leader's fence needs a majority of the set it was
\*   elected on too; `a_generation_promised_to_another_node_is_not_led` --
\*   a leader named from an old report does not take a generation it
\*   promised away.

