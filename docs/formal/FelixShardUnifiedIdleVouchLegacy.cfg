\* FelixShardUnifiedIdleVouch with a leader that ships a follower only what
\* it lacks. The follower back from an unclean crash is level, so it is sent
\* nothing and stays untrusted while the shard is idle. Expected to violate
\* FollowerTrusted.
\*
\* Evidence: none, this models the leader before idle followers were sent
\* the mark, to show why they are.

SPECIFICATION ShipSpec

CONSTANTS
    Nodes = {a, b, c}
    First = a
    NoNode = NoNode
    MaxGen = 3
    MaxWrites = 0
    MaxStarts = 1
    MaxUnclean = 2
    MaxWipes = 0
    MaxRestores = 0
    MaxRetries = 0
    SetChoices = {{a, b, c}}
    OldPeers = {}
    IdleVouch <- No

PROPERTY
    FollowerTrusted

INVARIANTS
    OneLeaderPerGeneration
    AckedHeldByLeader
