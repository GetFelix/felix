\* FelixShardFencedAckSeatPair.cfg where placement may also give the
\* replacement up (`Undoes`). c joins `{a, b}`, and two of the three
\* acknowledge, so a record can be on a and c alone after any report. An
\* undo fences a first (`UndoFence`) and drops c only once a's drained report
\* has b holding its whole log (`Undo`, #1628). The fenced leader may also
\* seat c instead, as `seat_after_fence` does for an undo that is not a
\* cancel. One move, one write, `L = 2`, time to 3.
\*
\* Evidence: `an_undo_beside_an_even_set_fences_first`,
\* `a_fenced_seat_whose_newcomer_halted_waits_for_the_rest_to_hold_the_log`,
\* `a_fenced_restore_whose_lost_copy_came_back_waits_for_it_to_hold_the_log`
\* (placement).

SPECIFICATION Spec

CONSTANTS
    Brokers = {a, b, c}
    L = 2
    Margin = 0
    Eps = 0
    Drift = 0
    MaxTime = 3
    MaxWrites = 1
    CheckAtCommit = FALSE
    Quorum = TRUE
    Promotion = "any"
    ReportBeforeAck = FALSE
    Handoff = FALSE
    WaitForDrained = TRUE
    FenceAtClaim = TRUE
    AckOnAdmit = FALSE
    FenceFromAdmit = FALSE
    MaxMoves = 1
    Planners = {}
    CasWrites = TRUE
    StageMove = FALSE
    LearnerVotes = FALSE
    Resends = FALSE
    SequencesInLog = TRUE
    Cancel = FALSE
    CancelCas = TRUE
    ReportBound = "acknowledged"
    AckChecksLease = FALSE
    AckOnResponse = FALSE
    AckByFollowers = TRUE
    FenceOnPromote = TRUE
    LabelOnReceipt = FALSE
    StartRecord = FALSE
    Spares = {c}
    ReplaceOnPromote = FALSE
    SeatHoldsCopy = TRUE
    Grow = FALSE
    PromoteDestination = FALSE
    Counters = FALSE
    CounterCatchUp = FALSE
    Ballots = FALSE
    Elections = 0
    FenceEveryChange = FALSE
    Suspicions = 0
    SetCheck = FALSE
    JointFence = FALSE
    Adopt = 0
    AdoptMatch = TRUE
    Swaps = 0
    PreVote = FALSE
    Wipes = 0
    StorageIds = FALSE
    ReportFromAnswers = FALSE
    ReportFloor = FALSE
    Undoes <- Yes

SYMMETRY Symm

INVARIANTS
    TypeOK
    AckedHeldByLeader
    AckedAgree
    AckedOnMajority
    NoTruncationBelowHwm
