\* FelixRaftLeaseSuspend.cfg with no wake check (SuspendCheck off). The
\* leader is suspended, its followers elect another, and it wakes with its
\* lease intact. This is also a VM pause, which stops both clocks, and a
\* platform with no clock that counts suspended time.
\*
\* Evidence: none, this models a check the implementation does not skip.

