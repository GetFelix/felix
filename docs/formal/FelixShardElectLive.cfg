\* Liveness of elections with the control plane down (`LiveSpec`, #1331):
\* three brokers, no writes, no symmetry (unsound for liveness), one broker
\* may stop for good (`FailStops`), a candidate's own detector may be wrong
\* (`DetectorMisfires`), the open leader refuses a pre-vote
\* (`PreVoteAsked`; the code does not yet, #1815), and backoff (`Backoff`)
\* with up to two rounds where a candidate stood beside another. A leader is elected and stays
\* (`ElectionSettles`), and nobody stands against a leader a majority hears
\* (`NoStandAgainstHeardLeader`). 3,000 distinct states, 1 s locally.
\*
\* Evidence: nothing in the code elects a leader yet (#1009).

SPECIFICATION LiveSpec

CONSTANTS
    Brokers = {a, b, c}
    L = 2
    Margin = 0
    Eps = 0
    Drift = 0
    MaxTime = 0
    MaxWrites = 0
    CheckAtCommit = FALSE
    Quorum = TRUE
    Promotion = "log-order"
    ReportBeforeAck = FALSE
    Handoff = FALSE
    WaitForDrained = TRUE
    FenceAtClaim = TRUE
    AckOnAdmit = FALSE
    FenceFromAdmit = FALSE
    MaxMoves = 0
    Planners = {}
    CasWrites = TRUE
    StageMove = FALSE
    LearnerVotes = FALSE
    Resends = FALSE
    SequencesInLog = TRUE
    Cancel = FALSE
    CancelCas = TRUE
    ReportBound = "acknowledged"
    AckChecksLease = FALSE
    AckOnResponse = FALSE
    AckByFollowers = TRUE
    FenceOnPromote = TRUE
    LabelOnReceipt = FALSE
    StartRecord = TRUE
    ReportFromAnswers = FALSE
    ReportFloor = FALSE
    Spares = {}
    ReplaceOnPromote = FALSE
    SeatHoldsCopy = TRUE
    Grow = FALSE
    PromoteDestination = FALSE
    Counters = FALSE
    CounterCatchUp = FALSE
    Ballots = TRUE
    Elections = 4
    FenceEveryChange = FALSE

    Suspicions = 0
    SetCheck = TRUE
    JointFence = TRUE
    Adopt = 0
    AdoptMatch = TRUE
    Swaps = 0
    PreVote = TRUE
    Wipes = 0
    StorageIds = FALSE
    CpDown <- Yes
    DetectorMisfires <- Yes
    FailStops <- One
    PreVoteAsked <- Yes
    Backoff <- Yes
    Splits <- Two

PROPERTIES
    ElectionSettles
    NoStandAgainstHeardLeader

INVARIANTS
    TypeOK
    OneLeaderPerGeneration
    AckedHeldByLeader
    AckedAgree
    AckedOnMajority
    NoTruncationBelowHwm
    AdoptedMatchesOpened
    SetChangesJoint
