\* FelixShardReadsRound.cfg with the lease in place of the round, the
\* opt-in fast path (`FELIX_QUORUM_READS=lease`). With no margin and a
\* slow clock, the deposed leader's lease is still good by its own clock
\* after its successor acknowledged a write, and TLC finds the stale read
\* (NoStaleRead). The lease read is only as safe as the clocks and the
\* margins; FelixShardRealMarginsLease.cfg is the argument for those.
\*
\* Evidence: `without_the_fleet_feature_a_quorum_read_follows_the_lease`
\* shows reads stay on the lease until the finalize; the clock half is
\* `FelixShardRealMarginsLease.cfg`'s.

SPECIFICATION ReadsSpec

CONSTANTS
    Brokers = {a, b, c}
    L = 2
    Margin = 0
    Eps = 0
    Drift = 1
    MaxTime = 2
    MaxWrites = 1
    CheckAtCommit = FALSE
    Quorum = TRUE
    Promotion = "log-order"
    ReportBeforeAck = FALSE
    Handoff = FALSE
    WaitForDrained = TRUE
    FenceAtClaim = TRUE
    AckOnAdmit = FALSE
    FenceFromAdmit = FALSE
    MaxMoves = 0
    Planners = {}
    CasWrites = TRUE
    StageMove = FALSE
    LearnerVotes = FALSE
    Resends = FALSE
    SequencesInLog = TRUE
    Cancel = FALSE
    CancelCas = TRUE
    ReportBound = "acknowledged"
    AckChecksLease = FALSE
    AckOnResponse = FALSE
    AckByFollowers = TRUE
    FenceOnPromote = TRUE
    LabelOnReceipt = FALSE
    StartRecord = TRUE
    ReportFromAnswers = FALSE
    ReportFloor = FALSE
    Spares = {}
    ReplaceOnPromote = FALSE
    SeatHoldsCopy = TRUE
    Grow = FALSE
    PromoteDestination = FALSE
    Counters = FALSE
    CounterCatchUp = FALSE
    Ballots = FALSE
    Elections = 0
    FenceEveryChange = FALSE
    ReadConfirm = "lease"
    MaxReads = 1

SYMMETRY Symm

INVARIANTS
    ReadsTypeOK
    NoStaleRead
    AckedHeldByLeader
    AckedOnMajority
