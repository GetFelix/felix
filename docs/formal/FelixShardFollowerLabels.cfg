\* FelixShardFencedAckTwoPromotions.cfg with a follower that labels what it
\* is shipped by the sender's generation (`LabelOnReceipt`), as a follower
\* does with a batch that carries no labels: it takes the sender's
\* generation to start where the batch appended. TLC finds an acknowledged record lost in twenty
\* steps: a leads at 1 and acknowledges x1 and x2 on a and b. b is promoted at
\* 2 and fences c; a is promoted at 3 while b, deposed, ships x1 to c. c now
\* holds x1 labelled 2, so when it answers a's fence its log looks ahead of
\* a's, and a takes it in place of its own, x2 included. The code test plays
\* it the other way round: c is promoted at 3, and its fence does not take
\* x2 from a.
\*
\* About 3.5M distinct states to the violation, 20 s on eight cores.
\*
\* Evidence: `a_follower_keeps_the_generation_a_record_was_written_at` and
\* `a_labelled_batch_keeps_the_generations_that_wrote_it` -- a follower
\* records the generations the leader's batches name, so the knob is off in
\* every other configuration.

SPECIFICATION Spec

CONSTANTS
    Brokers = {a, b, c}
    L = 2
    Margin = 0
    Eps = 0
    Drift = 0
    MaxTime = 4
    MaxWrites = 2
    CheckAtCommit = FALSE
    Quorum = TRUE
    Promotion = "log-order"
    ReportBeforeAck = FALSE
    Handoff = FALSE
    WaitForDrained = TRUE
    FenceAtClaim = TRUE
    AckOnAdmit = FALSE
    FenceFromAdmit = FALSE
    MaxMoves = 0
    Planners = {}
    CasWrites = TRUE
    StageMove = FALSE
    LearnerVotes = FALSE
    Resends = FALSE
    SequencesInLog = TRUE
    Cancel = FALSE
    CancelCas = TRUE
    ReportBound = "acknowledged"
    AckChecksLease = FALSE
    AckOnResponse = FALSE
    AckByFollowers = TRUE
    FenceOnPromote = TRUE
    LabelOnReceipt = TRUE
    StartRecord = FALSE
    Spares = {}
    ReplaceOnPromote = FALSE
    SeatHoldsCopy = TRUE
    Grow = FALSE
    PromoteDestination = FALSE

SYMMETRY Symm

INVARIANTS
    TypeOK
    AckedHeldByLeader
    AckedAgree
    AckedOnMajority
    NoTruncationBelowHwm
