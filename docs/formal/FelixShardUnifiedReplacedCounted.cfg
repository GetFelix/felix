\* FelixShardUnifiedReplacedBlocking.cfg with the replaced seat's new copy
\* counted as one of the half (`ReplacedCounted`). Two fences at one
\* generation then open apart. Expected to violate OneLeaderPerGeneration.
\*

SPECIFICATION Spec

CONSTANTS
    Nodes = {a, b, c}
    First = a
    NoNode = NoNode
    MaxGen = 4
    MaxWrites = 1
    MaxStarts = 3
    MaxUnclean = 1
    MaxWipes = 2
    MaxRestores = 0
    MaxRetries = 1
    SetChoices = {{a, b}, {b, c}, {a, b, c}}
    OldPeers = {}
    ReplacedBlocking <- Yes
    ReplacedCounted <- Yes

INVARIANTS
    OneLeaderPerGeneration
    AckedHeldByLeader
