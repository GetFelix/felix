\* FelixShardUnifiedReplacedBlocking.cfg with the replaced seat's new copy
\* counted as one of the half (`ReplacedCounted`), one lost directory: two
\* fences at one generation then open apart. Expected to violate
\* OneLeaderPerGeneration.

SPECIFICATION Spec

CONSTANTS
    Nodes = {a, b, c}
    First = a
    NoNode = NoNode
    MaxGen = 3
    MaxWrites = 0
    MaxStarts = 3
    MaxUnclean = 0
    MaxWipes = 1
    MaxRestores = 0
    MaxRetries = 1
    SetChoices = {{a}, {c}, {a, b}, {a, b, c}}
    OldPeers = {}
    ReplacedBlocking <- Yes
    ReplacedCounted <- Yes

INVARIANTS
    OneLeaderPerGeneration
    AckedHeldByLeader
