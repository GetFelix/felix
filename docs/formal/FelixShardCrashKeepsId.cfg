\* FelixShardCrash.cfg without the new identity, as before #1284: a follower
\* that crashed under a relaxed fsync mode keeps its identity and stays
\* counted on the suffix it lost. The leader acknowledges records on itself
\* and one follower, the follower crashes and loses some, the leader's lease
\* lapses, and placement promotes the follower from the leader's last
\* report, whose identity still matches. Two writes, the clock to 2 and no
\* margin, as in FelixShardCrash.cfg.
\*
\* Expected to violate AckedSurvive. FelixShardCrash.cfg is the fix.
\*
\* Evidence: this configuration REMOVES the rotation.
\* `a_crash_under_a_relaxed_fsync_mode_rotates_the_id` -- drop it and the
\*   follower comes back under the identity the report names, which is the
\*   trace TLC finds.
\* AckedOnLiveMajority is left out, as in FelixShardWipeNoIds.cfg: the
\* crashed follower's answers vouch for a copy it no longer has.

SPECIFICATION Spec

CONSTANTS
    Brokers = {a, b, c}
    L = 2
    Margin = 0
    Eps = 1
    Drift = 0
    MaxTime = 2
    MaxWrites = 2
    CheckAtCommit = TRUE
    Quorum = TRUE
    Promotion = "leader-report"
    ReportBeforeAck = TRUE
    Handoff = FALSE
    WaitForDrained = TRUE
    FenceAtClaim = TRUE
    AckOnAdmit = FALSE
    FenceFromAdmit = FALSE
    MaxMoves = 0
    Planners = {}
    CasWrites = TRUE
    StageMove = FALSE
    LearnerVotes = FALSE
    Resends = FALSE
    SequencesInLog = TRUE
    Cancel = FALSE
    CancelCas = TRUE
    ReportBound = "acknowledged"
    AckChecksLease = TRUE
    AckOnResponse = TRUE
    AckByFollowers = FALSE
    FenceOnPromote = FALSE
    LabelOnReceipt = FALSE
    StartRecord = FALSE
    ReportFromAnswers = TRUE
    ReportFloor = TRUE
    PromoteDestination = FALSE
    Counters = FALSE
    CounterCatchUp = FALSE
    Ballots = FALSE
    Elections = 0
    FenceEveryChange = FALSE
    Suspicions = 0
    SetCheck = FALSE
    JointFence = FALSE
    Adopt = 0
    AdoptMatch = TRUE
    Swaps = 0
    PreVote = FALSE
    Wipes = 1
    StorageIds = TRUE
    Grow = FALSE
    Spares = {}
    ReplaceOnPromote = FALSE
    SeatHoldsCopy = TRUE
    CrashLoses <- Yes

SYMMETRY Symm

INVARIANTS
    TypeOK
    AtMostOneServing
    AckedSurvive
    AckedAgree
    NoTruncationBelowHwm
    NoStaleCommit
