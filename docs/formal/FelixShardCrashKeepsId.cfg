\* A follower that crashed under a relaxed fsync mode and kept its storage
\* identity, as before #1284: it stays counted on the records it lost. The
\* leader acknowledges a record on itself and one follower, the follower
\* crashes and loses it, the leader's lease lapses, and placement promotes
\* the follower from the leader's last report, whose identity still matches.
\*
\* Expected to violate AckedSurvive: the identity has to change after such a
\* crash. TLC stops at the first counterexample, so this stays cheap.
\*
\* What is not model-checked in CI: the passing case, the same crash with
\* `RotateOnCrash`. With one write a crash can only empty the log, which is
\* FelixShardWipeFull.cfg again. With two writes, so that a crash keeps the
\* first record and loses the second, the state space ran past the 60-minute
\* CI job unfinished (clock to 2, no margin). The `Crash` action and
\* `RotateOnCrash` stay in the spec for a longer run by name.
\*
\* Evidence: this configuration REMOVES the rotation.
\* `a_crash_under_a_relaxed_fsync_mode_rotates_the_id` -- drop it and the
\*   follower comes back under the identity the report names, which is the
\*   trace TLC finds.
\* AckedOnLiveMajority is left out, as in FelixShardWipeNoIds.cfg: the
\* crashed follower's answers vouch for a copy it no longer has.

