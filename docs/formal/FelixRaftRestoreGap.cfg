\* The restore offset gap: epoch 1 starts at least Gap past the point, and
\* fewer than Gap + 1 offsets are acknowledged after the point
\* (MaxAfter = Gap). Nothing epoch 0 acknowledged is given out again, also
\* when the copied copy stopped leading.
\*
\* Evidence: `a_restore_starts_its_epoch_past_the_point_plus_the_gap` and
\*   `a_leader_that_moved_after_the_point_needs_the_gap` -- the first index
\*   is at least the point plus the gap;
\*   `a_restore_writes_its_epoch_past_the_point_plus_the_gap` -- the control
\*   plane writes it in the epoch's base before any copy opens it.

SPECIFICATION Spec

CONSTANTS
    MaxWrites = 4
    MaxAfter = 2
    MaxNew = 1
    Step = 2
    Gap = 2
    Rate = 10
    TimeRate = 0
    MaxTime = 0
    MaxRestores = 1
    NoReserve = FALSE
    LeaderMoves = TRUE

INVARIANT
    ReserveCovers
    BaseKept
    BackedUpNeverReused OffsetNeverReused
