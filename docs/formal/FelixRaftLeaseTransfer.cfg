\* FelixRaftLease.cfg with the role read late (RoleSync off) and one
\* transfer: the leader stops heartbeats and sends TransferLeader, followers
\* that take it clear their window, and the target campaigns at once and its
\* voters grant inside their window. A transfer may expire at any time, and
\* the leader then steps down and campaigns. Felix voids the lease for the
\* term before the message leaves.
\* No drift (clocks gain 1 a tick), so a lease of 2 against an election
\* timeout of 2 meets the inequality and spans two ticks; drift is in the
\* Drift version.
\*
\* Evidence: none, `admit_local_ack` always refuses until issue 2249 builds this rule.

