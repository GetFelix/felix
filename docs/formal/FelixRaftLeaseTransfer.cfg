\* FelixRaftLease.cfg with one leadership transfer, the role read late, and
\* openraft's grant to the leader a voter follows. The leader stops
\* heartbeats; a follower that takes the transfer clears its window; the
\* target campaigns at once and its voters grant inside their window. A
\* transfer may expire at any time, and the leader then steps down and
\* campaigns. Felix voids the lease for the term before the message leaves.
\* Lease 1 against an election timeout of 2, to keep the run short.
\*
\* Evidence: none, `admit_local_ack` always refuses until issue 2249 builds this rule.

