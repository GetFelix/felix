\* FelixShardElectWipeNonVoterIdlessCreation.cfg with a set-less copy taking
\* any generation-1 set as a voter (`GenOneExempt`), as `replaced_copy_of`
\* did. TLC is expected to find an acknowledged record the next leader does
\* not hold (AckedHeldByLeader): it is acknowledged on {a, c}; c is wiped
\* while the shard is at generation 1 and learns the id-less creation set
\* as a voter; a failover's leader b, which lags, opens on {b, c}.
\*
\* Evidence: `a_replaced_copy_is_a_learner_in_an_idless_creation_set` in
\* crates/server/felix-replication/src/replica/tests/non_voting.rs and
\* `a_setless_replaced_copy_leads_creation_only_under_its_own_id` in
\* crates/server/felix-replication/src/promotion/tests/joint.rs.

