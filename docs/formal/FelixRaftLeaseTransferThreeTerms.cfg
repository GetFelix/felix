\* FelixRaftLeaseTransfer.cfg with three terms. A broker that voided term 1
\* for a transfer is elected again in term 2 and then votes for term 3: the
\* void must still cover term 1, so it only grows.
\*
\* Evidence: none, `admit_local_ack` always refuses until issue 2249 builds this rule.

