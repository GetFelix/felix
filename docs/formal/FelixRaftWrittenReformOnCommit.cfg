\* The design as built, for comparison: the commit index counts fsynced
\* copies only. After a power cut of two of three copies and a re-form, no
\* committed record is lost and no offset is reused, with no reservation and
\* the trailing floor alone (docs/per-shard-raft.md, "Offsets are not
\* reused").
\*
\* Evidence: none, re-forming is not built yet.

