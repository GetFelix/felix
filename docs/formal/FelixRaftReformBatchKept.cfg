\* Batch entries in a group of three with kept copies: one term, one write of
\* one or two records, one late append and one power cut, then one re-form.
\* A follower counts an entry toward a commit only once its reservation
\* covers it in offsets (ReservedCovers, the followers' half), and the
\* re-form starts above every reservation it reads.
\*
\* Evidence: none, batch entries are not built yet (#3359).

