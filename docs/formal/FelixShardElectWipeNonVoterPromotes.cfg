\* FelixShardElectWipeNonVoterFailover.cfg, follower wipes only, with
\* failover free to name a non-voter (`PromoteNonVoter`). TLC finds two
\* leaders at one generation: a's lease lapses; b stands at 2 and c answers;
\* c is wiped and forgets that promise; the control plane, which has not heard
\* of 2, promotes c at 2; b opens at 2 on {b, c}, and c opens at 2 on {c, a}
\* (OneLeaderPerGeneration). The non-voter's lost promise is why failover must
\* not name it, as much as its lost log.

SPECIFICATION Spec

CONSTANTS
    Brokers = {a, b, c}
    L = 1
    Margin = 0
    Eps = 0
    Drift = 0
    MaxTime = 1
    MaxWrites = 1
    CheckAtCommit = FALSE
    Quorum = TRUE
    Promotion = "log-order"
    ReportBeforeAck = FALSE
    Handoff = FALSE
    WaitForDrained = TRUE
    FenceAtClaim = TRUE
    AckOnAdmit = FALSE
    FenceFromAdmit = FALSE
    MaxMoves = 0
    Planners = {}
    CasWrites = TRUE
    StageMove = FALSE
    LearnerVotes = FALSE
    Resends = FALSE
    SequencesInLog = TRUE
    Cancel = FALSE
    CancelCas = TRUE
    ReportBound = "acknowledged"
    AckChecksLease = FALSE
    AckOnResponse = FALSE
    AckByFollowers = TRUE
    FenceOnPromote = TRUE
    LabelOnReceipt = FALSE
    StartRecord = TRUE
    ReportFromAnswers = FALSE
    ReportFloor = FALSE
    Spares = {}
    ReplaceOnPromote = FALSE
    SeatHoldsCopy = TRUE
    Grow = FALSE
    PromoteDestination = FALSE
    Counters = FALSE
    CounterCatchUp = FALSE
    Ballots = TRUE
    Elections = 2
    FenceEveryChange = FALSE

    Suspicions = 0
    SetCheck = TRUE
    JointFence = TRUE
    Adopt = 3
    AdoptMatch = TRUE
    Swaps = 0
    PreVote = FALSE
    Wipes = 0
    StorageIds = FALSE
    LosePromises <- Yes
    WipedNonVoter <- Yes
    WipedLearnsSet <- Yes
    PromoteNonVoter <- Yes
SYMMETRY Symm

INVARIANTS
    TypeOK
    OneLeaderPerGeneration
    AckedHeldByLeader
    AckedAgree
    AckedOnMajority
    NoTruncationBelowHwm
    AdoptedMatchesOpened
    SetChangesJoint
