\* FelixShardFencedAck.cfg with two promotions: L = 2 and time to 4, without
\* drift, which is what keeps it finite in reasonable time. It checks the
\* follower labels at a depth where a fence can meet a record shipped by a
\* leader that inherited it; FelixShardFollowerLabels.cfg is the same with
\* the labels wrong.
\*
\* Two promotions are not enough to show the own-generation check in
\* HeldAtGen is needed: Raft's Figure 8 takes a third leadership, which
\* FelixShardFigure8.tla reaches from a seeded history.
\*
\* Before acks counted follower answers (`confirmed`), and not re-run since:
\* 14.3M distinct states, depth 35, 80 s on ten cores and eight and a half
\* minutes on a CI runner, which would put the job near its hour: run by
\* hand, not in scripts/check_tla.sh. FelixShardFollowerLabels.cfg, at the
\* same bounds, stops at its violation in about a minute and a half.
\*
\* Evidence: as FelixShardFencedAck.cfg, and
\* `a_follower_keeps_the_generation_a_record_was_written_at` for the labels
\* the fence answers carry.

SPECIFICATION Spec

CONSTANTS
    Brokers = {a, b, c}
    L = 2
    Margin = 0
    Eps = 0
    Drift = 0
    MaxTime = 4
    MaxWrites = 2
    CheckAtCommit = FALSE
    Quorum = TRUE
    Promotion = "log-order"
    ReportBeforeAck = FALSE
    Handoff = FALSE
    WaitForDrained = TRUE
    FenceAtClaim = TRUE
    AckOnAdmit = FALSE
    FenceFromAdmit = FALSE
    MaxMoves = 0
    Planners = {}
    CasWrites = TRUE
    StageMove = FALSE
    LearnerVotes = FALSE
    Resends = FALSE
    SequencesInLog = TRUE
    Cancel = FALSE
    CancelCas = TRUE
    ReportBound = "acknowledged"
    AckChecksLease = FALSE
    AckOnResponse = FALSE
    AckByFollowers = TRUE
    FenceOnPromote = TRUE
    LabelOnReceipt = FALSE
    StartRecord = FALSE
    Spares = {}
    ReplaceOnPromote = FALSE

SYMMETRY Symm

INVARIANTS
    TypeOK
    AckedHeldByLeader
    AckedAgree
    AckedOnMajority
    NoTruncationBelowHwm
