\* A snapshot install taken as the code takes it, in two durable steps, with
\* one crash between the save and the drop: the open finds the pending-rewind
\* marker and finishes the reset from what the save kept. One producer with
\* two batches of two or three records, two changes of leader, two purges.
\*
\* Evidence: disk_log::tests::producers::a_reset_cut_short_at_the_snapshot_base_is_finished_at_open
\*   and disk_log::tests::truncation::a_reset_cut_short_at_any_step_reopens_whole.

