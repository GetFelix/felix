\* leader's own log stays pending on its own newer ballot (`OwnBallotRefused`
\* off, `keep_own_set` in promotion.rs, #1919). TLC finds a shard that never
\* serves with the control plane up.
\* Evidence: none, the twin of FelixShardCpLive.cfg.

