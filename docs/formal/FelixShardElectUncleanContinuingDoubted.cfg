\* FelixShardElectUncleanContinuingRetrySafe.cfg with a broker that restarts
\* uncleanly (`UncleanCrashes`, `UncleanLeads`, `VouchOnGeneration`), checked
\* exhaustively against every safety invariant the two checks keep. A copy
\* its restart doubts (`Unvouched`) still answers a continuing open's fence,
\* as `ReplicaHandler::fence` does when its kept ballot names the leader
\* (`ContinuingTrusts`). Adoption runs one generation further than the
\* retry-safe configuration so a continuing open can follow the restart.
\* No two leaders open at one generation and the leader keeps every
\* acknowledged record. One wipe, not two, keeps it to a size CI can check.
\*
\* Evidence: `a_learner_whose_ballot_names_the_leader_promises_its_next_generation`
\* (felix-replication, `replica::tests::non_voting`).

SPECIFICATION Spec

CONSTANTS
    Brokers = {a, b, c}
    L = 4
