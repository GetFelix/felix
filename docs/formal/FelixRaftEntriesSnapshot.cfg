\* FelixRaftEntries.cfg with a snapshot and two one-record writes, no
\* crash. A follower that installs the snapshot starts its log at the
\* offset the snapshot carries, which is below the index once a blank entry
\* takes none. It derives the next stamps from there, as a follower and as
\* the next leader.
\*
\* Evidence: none, batch entries are not built yet (#3359).

SPECIFICATION Spec

CONSTANTS
    Servers = {a, b, c}
    Nobody = Nobody
    MaxTerm = 2
    MaxWrites = 2
    MaxMembers = 0
    MaxCrashes = 0
    MaxSnapshots = 1
    Consumer = TRUE
    AckBeforeFlush = FALSE
    VoteNotDurable = FALSE
    LeaderResumes = FALSE
    TornTailKept = FALSE
    TruncateNotDurable = FALSE
    RecoveredTailUnsynced = FALSE
    SaveCommittedUnflushed = FALSE
    PurgeBeforeSnapshot = FALSE
    SnapshotTwoRenames = FALSE
    CommitPriorTerm = FALSE
    DeliverUncommitted = FALSE
    SkipsNotCounted = FALSE
    ZeroTakesOffset <- ZeroTakesOffsetOff

SYMMETRY Symm

INVARIANTS
    TypeOK
    OneLeaderPerTerm
    LogMatching
    TermsMonotone
    LeaderCompleteness
    StateMachineSafety
    AppliedAgree
    AppliedInLog
    AckedSurvive
    PurgedCoveredBySnapshot
    OffsetsDense
    OffsetNeverReused
    BatchWhole
    DeliveredInOrder
    QuiescentServed
    AckedDelivered

PROPERTIES
    VoteNeverLowers
