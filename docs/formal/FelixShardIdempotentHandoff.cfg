\* An idempotent producer re-sending across a planned move: the write lands on
\* the old leader, the shard is fenced, drained and cut over, and the write is
\* sent again to the new leader, which answers from the log it was shipped.
\*
\* `SequencesInLog = FALSE` is FelixShardIdempotentHandoffMemory.cfg, and
\* the new leader stores the write twice.
\* Evidence: the implementation behaviours this configuration asserts.
\* `a_replica_answers_a_re_send_of_what_it_was_shipped` -- SequencesInLog: the
\*   destination knows every batch it was shipped.
\* `a_re_sent_batch_lands_once` -- Resend: a batch already held is answered
\*   without appending.
\* `a_producer_keeps_its_sequence_across_a_planned_move` -- NoDuplicate across
\*   a move, against a real cluster.
\* `a_draining_shard_reports_drained_once_its_fence_is_quiet` -- the drained
\*   report waits for every claimed write, so the cut-over follows them.
\* Planners = {}: every decision reads and writes in one step, so CasWrites
\*   has nothing to compare.

SPECIFICATION Spec

CONSTANTS
    Brokers = {a, b, c}
    L = 4
    Margin = 2
    Eps = 1
    Drift = 0
    MaxTime = 5
    MaxWrites = 1
    CheckAtCommit = TRUE
    Quorum = TRUE
    Promotion = "leader-report"
    ReportBeforeAck = TRUE
    Handoff = TRUE
    WaitForDrained = TRUE
    FenceAtClaim = TRUE
    AckOnAdmit = FALSE
    FenceFromAdmit = TRUE
    MaxMoves = 1
    Planners = {}
    CasWrites = TRUE
    StageMove = FALSE
    LearnerVotes = FALSE
    Resends = TRUE
    SequencesInLog = TRUE
    Cancel = FALSE
    CancelCas = TRUE
    ReportBound = "acknowledged"
    AckChecksLease = TRUE
    AckOnResponse = FALSE
    AckByFollowers = FALSE
    FenceOnPromote = FALSE
    LabelOnReceipt = FALSE
    StartRecord = FALSE
    ReportFromAnswers = FALSE
    ReportFloor = FALSE
    Spares = {}
    ReplaceOnPromote = FALSE
    SeatHoldsCopy = TRUE
    Grow = FALSE
    PromoteDestination = FALSE

SYMMETRY Symm

INVARIANTS
    TypeOK
    AtMostOneServing
    AckedSurvive
    AckedAgree
    NoTruncationBelowHwm
    NoStaleCommit
    AckedOnMajority
    NoDuplicate
