\* FelixHeadTrim.cfg with the floor kept as the leader's own state instead of
\* a record. A promoted follower never learns it and serves below an
\* acknowledged trim. This is why the trim is a replicated record.
\*
\* Evidence: none, this models an alternative the design does not use.

SPECIFICATION Spec

CONSTANTS
    Brokers = {a, b, c}
    MaxWrites = 2
    MaxTrims = 2
    MaxGen = 3
    Local = TRUE
    FloorFromBase = FALSE
    ApplyOnStore = FALSE
    DeleteAboveCommit = FALSE
    Unconditional = FALSE
    HiddenTrims = FALSE

SYMMETRY Symm

INVARIANTS
    NoReadBelowAckedTrim
    NothingLostAboveFloor
    NeverMoreThanAsked
    StaleTrimRefused
