\* A generation claimed twice, with the control plane up (`ReissueSpec`):
\* FelixShardElectLive.cfg with placement promoting on the followers' word
\* up to generation 2 (`Suspicions = 1`), adoption up to generation 3, two
\* generations of elections, no broker stopping, and the control plane
\* moving past a generation it named one leader at while another was elected
\* and opened there (`Reissues`, CpReissue). Adoption and the reissue are
\* taken once they stay possible (`ReportFairness`). The control plane does
\* not stay at a generation whose leader can never open while the leader
\* elected there leads (`CollisionSuperseded`). 503K distinct states, 4 min
\* locally.
\*
\* Evidence: `an_elected_leader_reporting_a_collided_generation_moves_the_shard_on`
\*   -- the elected leader's report moves the shard to the next generation.

