\* FelixRaftTerms.cfg with four terms: three changes of leader, which is what
\* it takes for a leader to be tempted to commit an earlier term's entry by
\* counting copies (Figure 8 of the Raft paper). FelixRaftCommitPriorTerm.cfg
\* has the same bounds without the rule and fails.
\*
\* Evidence: the raft_log adapter tests in felix-storage:
\*   `entries_read_back_with_their_term_and_kind`. The rule against committing
\*   an earlier term's entry by counting is openraft's, so no adapter test
\*   covers it.

SPECIFICATION Spec

CONSTANTS
    Servers = {a, b, c}
    Nobody = Nobody
    MaxTerm = 4
    MaxWrites = 0
    MaxMembers = 0
    MaxCrashes = 0
    MaxSnapshots = 0
    Consumer = FALSE
    AckBeforeFlush = FALSE
    VoteNotDurable = FALSE
    LeaderResumes = FALSE
    TornTailKept = FALSE
    TruncateNotDurable = FALSE
    RecoveredTailUnsynced = FALSE
    SaveCommittedUnflushed = FALSE
    PurgeBeforeSnapshot = FALSE
    SnapshotTwoRenames = FALSE
    CommitPriorTerm = FALSE
    DeliverUncommitted = FALSE
    SkipsNotCounted = FALSE

SYMMETRY Symm

INVARIANTS
    TypeOK
    OneLeaderPerTerm
    LogMatching
    TermsMonotone
    LeaderCompleteness
    StateMachineSafety
    AppliedAgree
    AppliedInLog
    AckedSurvive
    PurgedCoveredBySnapshot
    OffsetsDense
    OffsetNeverReused
    DeliveredInOrder
    QuiescentServed

PROPERTIES
    VoteNeverLowers
