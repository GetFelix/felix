\* A cut-over on a cache shard (`Counters`): FelixShardElectSwapFlip.cfg with
\* the counter log beside the cache log, one write, and no elections. The
\* cut-over waits for the destination to hold the counter log too
\* (`drain_ready`), the counter log ships to both sets while the change is
\* pending, and its mark needs a majority of each (`CountersJoint`). The
\* control plane takes the new set only once the counter log's start record
\* is held as well as the cache log's (`FlipChecksCounters`). Every
\* acknowledged counter update stays on a majority of the set the control
\* plane records (`CountersOnSetMajority`). Not yet measured: over 4M
\* distinct states after 4 min locally.
\* FelixShardSwapCountersFlipUnchecked.cfg flips on the cache log alone, and
\* FelixShardSwapCountersNewSetOnly.cfg counts the counter log on the new set
\* alone.
\*
\* Evidence: `a_flip_waits_for_the_counter_log_on_both_majorities` -- no
\*   joint start until the counter log's start is held on both sets;
\*   `a_pending_change_counts_counters_on_both_majorities` -- the counter mark
\*   needs both majorities; `a_flip_follows_the_counter_log_on_both_majorities`
\*   (crates/server/felix-replication/src/driver/tests/joint_acks.rs).

