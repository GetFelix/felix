\* A fenced move whose leader crashes uncleanly before it reports drained,
\* with the give-up at the move's generation taken as the end of the move
\* (`RetakeGivenUp`). The leader is named again at once; it leads only when
\* its probe found no follower ahead, and otherwise gives that generation up
\* too, and placement promotes the follower its probe names furthest. One
\* write, one move, one unclean crash at any point, any suffix lost.
\*
\* TLC finds every leader that opens holding every acknowledged record, and
\* the leader placement names serving in the end.
\*
\* Evidence: the implementation behaviours this configuration asserts.
\* `a_fenced_leader_that_gave_up_is_named_again_at_once` -- CpRetakeGivenUp.
\* `a_give_up_from_before_the_fence_does_not_end_the_move` -- only a give-up
\*   at the move's generation.
\* `a_given_up_copy_no_follower_is_ahead_of_is_reclaimed` -- MayLead: the
\*   broker leads its given-up copy again only then.
\* `a_crashed_leaders_copy_takes_no_fence_until_a_newer_leader_ships` -- a
\*   given-up copy answers no fence.
\* `a_follower_level_with_a_leader_that_gave_up_is_promoted` -- CpFailover.
\* `a_leader_that_gave_up_with_every_follower_behind_is_reclaimed` --
\*   CpReclaim.
\* `a_quorum_failover_does_not_promote_a_move_destination` -- no failover
\*   while the move is fenced.

SPECIFICATION LiveSpec

CONSTANTS
    Nodes = {a, b, c}
    First = a
    NoNode = NoNode
    MaxGen = 5
    MaxWrites = 1
    MaxCrashes = 1
    MaxMoves = 1

INVARIANTS
    OneLeaderPerGeneration
    AckedHeldByLeader
    AtMostOneServing

PROPERTY
    EventuallyServes
