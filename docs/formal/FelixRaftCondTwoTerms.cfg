\* FelixRaftCond.cfg with two terms instead of three, so a pull request can
\* check it: one change of leader, which can still cut a deposed leader's
\* conditional entry and rewrite its index.
\*
\* Evidence: none, conditional publishes on a Raft shard are not built yet
\*   (issue 2446).

SPECIFICATION Spec

CONSTANTS
    Servers = {a, b, c}
    Nobody = Nobody
    MaxTerm = 2
    MaxLog = 5
    MaxPlain = 1
    MaxMembers = 1
    Expected <- TwoAtTwo
    LeaderDecides = FALSE

SYMMETRY Symm

INVARIANTS
    TypeOK
    CondKeptAtExpected
    OneKeptPerOffset
    MembersAgree
    AnswersHold
