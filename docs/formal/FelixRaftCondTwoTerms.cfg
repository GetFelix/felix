\* FelixRaftCond.cfg with two terms instead of three, a faster check of the
\* same rules: one change of leader, which can still cut a deposed leader's
\* conditional entry and rewrite its index.
\*
\* Evidence: `a_conditional_publish_off_its_offset_is_a_blank_on_every_member`
\*   and `a_publish_if_to_a_raft_shard_is_written_only_at_its_offset`, as for
\*   FelixRaftCond.cfg.

SPECIFICATION Spec

CONSTANTS
    Servers = {a, b, c}
    Nobody = Nobody
    MaxTerm = 2
    MaxLog = 5
    MaxPlain = 1
    MaxMembers = 1
    Expected <- TwoAtTwo
    LeaderDecides = FALSE

SYMMETRY Symm

INVARIANTS
    TypeOK
    CondKeptAtExpected
    OneKeptPerOffset
    MembersAgree
    AnswersHold
