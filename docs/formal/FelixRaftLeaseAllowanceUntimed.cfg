\* The lease allowance of issue 3103 with no clock: a leader answers on its
\* lease whenever a majority holds an allowance past the write, and votes
\* and campaigns skip the window, the hold and the leader's own refusal. That
\* is every behaviour of FelixRaftLeaseAllowance.cfg and more, so
\* LeaseAckedSurvive passing here rests on the allowance and the vote rule
\* alone. Three allowances (raise, lower, raise, or spread over both terms)
\* and one restart. The Part 1 checks need the clock and are not run.
\*
\* Evidence: none, this models the design for #3103, which is not built.

