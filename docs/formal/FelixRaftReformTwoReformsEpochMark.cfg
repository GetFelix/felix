\* Witness for the epoch-scoped mark. In epoch 0 a broker is declared dead and
\* another restores an older copy. Epoch 1 commits a record, and a power cut
\* closes it. The second re-form is unmarked, since every broker placed in
\* epoch 1 had its epoch-1 vote read, and keeps the record. A mark over the
\* whole group would cut it.
\*
\* Evidence: none, this models the design for #2250, which is not built.

