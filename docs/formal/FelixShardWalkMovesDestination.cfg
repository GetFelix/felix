\* FelixShardWalkMoves.cfg with a failover free to name a move's destination
\* (`PromoteDestination`), as FelixShardFencedAckMoveDestination.cfg does
\* exhaustively. The destination opens without the fence, and the walk must
\* find a record the old leader acknowledged missing from it within its
\* budget (AckedHeldByLeader). Only that invariant is checked, so the first
\* violation a walk finds is the one this expects.
\*
\* Evidence: none, this models the placement before
\* `a_quorum_failover_does_not_promote_a_move_destination`.

