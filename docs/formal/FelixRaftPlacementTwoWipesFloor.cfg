\* Three members with the floor, and two lost volumes: past what three
\* survive. Each wiped member is told the other is withheld and takes its
\* floor from the third alone, which may not hold the term the pair
\* promised, so OneLeaderPerTerm is not listed. AckedHeldSurvive is: a
\* record the third still holds is not lost to a wiped member that catches
\* up.
\*
\* Evidence: `two_wiped_members_of_five_do_not_wait_on_each_other`,
\*   `a_member_that_says_it_is_withheld_answers_with_no_term`.

