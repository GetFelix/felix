\* Three members with the floor, two lost volumes, and an operator who
\* waives the block: past what three survive. Each wiped member is told
\* the other is withheld and, under the waiver, takes its floor from the
\* third alone, which may not hold the term the pair promised. Only
\* AckedHeldSurvive is checked: a record the third still holds is not lost
\* to a wiped member that catches up. An acked write only the pair held is
\* gone, which is what the waiver accepts.
\*
\* Evidence: `past_the_failure_tolerance_the_floor_blocks_until_waived`.
\* FelixRaftPlacementTwoWipesFloorBlock.cfg is the same group with no waiver.

