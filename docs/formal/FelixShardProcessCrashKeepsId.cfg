\* FelixShardCrashKeepsId.cfg with the rule the broker follows (#1367). A
\* crash is either the process's, which keeps the page cache and so the
\* whole log, or the machine's, which may lose the unsynced suffix
\* (`ProcessCrashes`). The identity rotates only after a machine crash
\* (`RotateOnCrash`, `KeepIdOnSameBoot`): a follower whose process crashed
\* keeps its identity and its count, and one whose machine crashed starts
\* over, as after a wipe. A follower back from a process crash may later
\* stop cleanly and lose power while it is down (`CleanStops`); the start
\* that kept its identity had synced the filesystem first (`SyncOnKeep`), so
\* the clean stop vouches only for what is on the device.
\*
\* One write, so a machine crash empties the log or loses nothing. The
\* clock runs to 3 so that a promotion follows the crash, as in
\* FelixShardWipeFull.cfg. The weight is a guess until CI measures it.
\*
\* Evidence: the implementation behaviours this configuration asserts.
\* `a_crash_in_the_same_boot_keeps_the_id` -- Crash with `machine` false:
\*   the identity stays.
\* `a_crash_in_another_boot_rotates_the_id` -- Crash with `machine` true:
\*   a new identity.
\* `a_crash_with_an_unknown_boot_rotates_the_id` -- a boot nobody recorded
\*   is a machine crash.
\* `keeping_the_id_after_a_crash_syncs_the_filesystem_first` -- SyncOnKeep.
\* `a_failed_sync_after_a_crash_rotates_the_id` -- a sync that fails rotates.

