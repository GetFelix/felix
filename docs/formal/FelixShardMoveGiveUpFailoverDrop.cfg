\* A set of three at replication factor 2, with the leader crashed and taken
\* for dead, and the failover dropping a follower (`FailoverDrops`), as
\* `keep_replicas` in plan.rs once did with a staged destination. TLC finds
\* no acknowledged record lost: the promoted follower's fence needs a
\* majority of the set it is given, and with the destination gone that is
\* the dead leader too, whose given-up copy answers no fence. So the drop
\* stalls the shard instead (FelixShardMoveGiveUpFailoverStall.cfg).
\*
\* Evidence: none, this models the rule the implementation had before the fix.

SPECIFICATION Spec

CONSTANTS
    Nodes = {a, b, c}
    First = a
    NoNode = NoNode
    MaxGen = 4
    MaxWrites = 2
    MaxCrashes = 1
    MaxMoves = 1
    Replication <- Two
    DeadFailover <- Yes
    FailoverDrops <- Yes

INVARIANTS
    OneLeaderPerGeneration
    AckedHeldByLeader
    AtMostOneServing

CHECK_DEADLOCK FALSE
