\* FelixShardLease.cfg with the heartbeat renewed the way the code renewed it
\* before #1955: per broker, whether or not the control plane still names it
\* leader. A leader whose lease lapsed and whose shard was promoted away
\* heartbeats again, the control plane accepts it, and the broker renews at
\* the generation it still believes it leads beside its successor
\* (AtMostOneServing).
\*
\* Evidence: none, this models the renewal before it waited on the routes.

SPECIFICATION Spec

CONSTANTS
    Brokers = {a, b, c}
    L = 4
    Margin = 2
    Eps = 1
    Drift = 1
    MaxTime = 8
    MaxWrites = 0
    CheckAtCommit = TRUE
    Quorum = TRUE
    Promotion = "log-order"
    ReportBeforeAck = TRUE
    Handoff = FALSE
    WaitForDrained = TRUE
    FenceAtClaim = TRUE
    AckOnAdmit = FALSE
    FenceFromAdmit = FALSE
    MaxMoves = 0
    Planners = {}
    CasWrites = TRUE
    StageMove = FALSE
    LearnerVotes = FALSE
    Resends = FALSE
    SequencesInLog = TRUE
    Cancel = FALSE
    CancelCas = TRUE
    ReportBound = "acknowledged"
    AckChecksLease = TRUE
    AckOnResponse = FALSE
    AckByFollowers = FALSE
    FenceOnPromote = FALSE
    LabelOnReceipt = FALSE
    StartRecord = FALSE
    ReportFromAnswers = FALSE
    ReportFloor = TRUE
    Spares = {}
    ReplaceOnPromote = FALSE
    SeatHoldsCopy = TRUE
    Grow = FALSE
    PromoteDestination = FALSE
    Counters = FALSE
    CounterCatchUp = FALSE
    Ballots = FALSE
    Elections = 0
    FenceEveryChange = FALSE

    Suspicions = 0
    SetCheck = FALSE
    JointFence = FALSE
    Adopt = 0
    AdoptMatch = TRUE
    Swaps = 0
    PreVote = FALSE
    Wipes = 0
    StorageIds = FALSE
    AcceptHeartbeat <- AcceptAnyHeartbeat
SYMMETRY Symm

INVARIANTS
    TypeOK
    AtMostOneServing
    NoStaleCommit
