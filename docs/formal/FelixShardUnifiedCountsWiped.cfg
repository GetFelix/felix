\* #1331: the readmission counts the wiped seat in the majority of the set it
\* leaves too. Expected to violate OneLeaderPerGeneration.
\*
\* Evidence: none, this models a shortcut the rule does not take, to show why.

SPECIFICATION Spec

CONSTANTS
    Nodes = {a, b, c}
    First = a
    NoNode = NoNode
    MaxGen = 3
    MaxWrites = 1
    MaxStarts = 2
    MaxUnclean = 0
    MaxWipes = 1
    MaxRestores = 0
    MaxRetries = 0
    SetChoices = {{a, b, c}}
    OldPeers = {}
    CountsWiped <- Yes

INVARIANTS
    OneLeaderPerGeneration
    AckedHeldByLeader
