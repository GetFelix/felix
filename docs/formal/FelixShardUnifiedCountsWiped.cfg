\* #1331: a fence counts a wiped seat's promise in its own new set. b opens
\* generation 2 with c, b is wiped and forgets that ballot, and a set change by
\* a at generation 2 counts b's fresh promise: a second leader at 2.
\* Expected to violate OneLeaderPerGeneration.
\*
\* Evidence: none, this models a shortcut the rule does not take, to show why.

SPECIFICATION Spec

CONSTANTS
    Nodes = {a, b, c}
    First = a
    NoNode = NoNode
    MaxGen = 3
    MaxWrites = 1
    MaxStarts = 2
    MaxUnclean = 0
    MaxWipes = 1
    MaxRestores = 0
    MaxRetries = 0
    SetChoices = {{a, b, c}}
    OldPeers = {}
    CountsWiped <- Yes

INVARIANTS
    OneLeaderPerGeneration
    AckedHeldByLeader
