\* The state bound with a snapshot that holds live records only: a bound
\* of one, an expiring put and an add, three proposals, no expiry delete,
\* clocks 0..1, one leader change, one crash, one snapshot. A member that
\* restored the snapshot, which left the expired record out, and one that
\* replayed the log and still holds it judge the add the same. Every rule on.
\* Evidence: `a_write_past_the_bound_answers_full_on_every_member_alike`,
\* `members_agree_on_full_answers_under_random_writes` (raft/cache/tests.rs).

