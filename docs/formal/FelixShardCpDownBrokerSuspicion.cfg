\* FelixShardCpDown.cfg with suspicion per broker only, as the code has it:
\* a replica stands only when the broker of the leader it follows is down, and
\* a broker still fencing refuses every pre-vote. A live leader's broker that
\* cannot serve the shard is never stood against, so TLC finds a shard that
\* never gets a leader once the control plane is gone.

SPECIFICATION CpDownSpec

CONSTANTS
    Brokers = {a, b, c}
    L = 2
    Margin = 0
    Eps = 0
    Drift = 0
    MaxTime = 0
    MaxWrites = 0
    CheckAtCommit = FALSE
    Quorum = TRUE
    Promotion = "log-order"
    ReportBeforeAck = FALSE
    Handoff = FALSE
    WaitForDrained = TRUE
    FenceAtClaim = TRUE
    AckOnAdmit = FALSE
    FenceFromAdmit = FALSE
    MaxMoves = 0
    Planners = {}
    CasWrites = TRUE
    StageMove = FALSE
    LearnerVotes = FALSE
    Resends = FALSE
    SequencesInLog = TRUE
    Cancel = FALSE
    CancelCas = TRUE
    ReportBound = "acknowledged"
    AckChecksLease = FALSE
    AckOnResponse = FALSE
    AckByFollowers = TRUE
    FenceOnPromote = TRUE
    LabelOnReceipt = FALSE
    StartRecord = TRUE
    ReportFromAnswers = FALSE
    ReportFloor = FALSE
    Spares = {}
    ReplaceOnPromote = FALSE
    SeatHoldsCopy = TRUE
    Grow = FALSE
    PromoteDestination = FALSE
    Counters = FALSE
    CounterCatchUp = FALSE
    Ballots = TRUE
    Elections = 4
    FenceEveryChange = FALSE

    Suspicions = 0
    SetCheck = TRUE
    JointFence = TRUE
    Adopt = 4
    AdoptMatch = TRUE
    Swaps = 0
    PreVote = TRUE
    Wipes = 0
    StorageIds = FALSE
    FailStops <- One
    Restarts <- Yes
    Withdraws <- Yes
    Renames <- Yes
    OwnBallotRefused <- Yes
    OverlayRefused <- Yes
    HaltReported <- Yes
    DeposeOnAssigned <- Yes
    StandBehindBallot <- Yes
    PreVoteAsked <- Yes
    CpStops <- Yes
    WithdrawsStuck <- Yes
    BrokerSuspicion <- Yes

PROPERTIES
    CpDownServes

INVARIANTS
    TypeOK
    OneLeaderPerGeneration
    AckedHeldByLeader
    AckedAgree
    AckedOnMajority
    NoTruncationBelowHwm
    AdoptedMatchesOpened
    SetChangesJoint
