\* Safety of elections when a broker restarts after an unclean crash
\* (#2025): FelixShardElect.cfg with storage identities and one restart
\* that rotates an identity (`UncleanCrashes`), which may hit the leader, a
\* candidate or a follower (`UncleanLeads`). One whose ballot names itself
\* may lose any suffix of its log, and its new process refuses to answer,
\* stand or open from that copy until a leader ships to it. Every
\* acknowledged record survives every election, given that a batch vouches
\* for the copy only once it holds a record of its leader's generation
\* (`VouchOnGeneration`). FelixShardElectUncleanVouchOnShip.cfg is the code
\* today, which vouches on any batch.
\* FelixShardElectUncleanForgetsLed.cfg is this without the refusal.
\*
\* Evidence: `a_copy_led_before_stays_led_after_it_stands` (unclean/tests.rs)
\* and `a_crashed_leaders_copy_takes_no_fence_until_a_newer_leader_ships`
\* (replica/tests/fence.rs) in crates/server/felix-replication.
\* AckedOnMajority is left out, as in the other crash configurations: the
\* crash itself takes a record off one copy of the majority.

SPECIFICATION Spec

CONSTANTS
    Brokers = {a, b, c}
    L = 4
    Margin = 0
    Eps = 0
    Drift = 0
    MaxTime = 0
    MaxWrites = 2
    CheckAtCommit = FALSE
    Quorum = TRUE
    Promotion = "log-order"
    ReportBeforeAck = FALSE
    Handoff = FALSE
    WaitForDrained = TRUE
    FenceAtClaim = TRUE
    AckOnAdmit = FALSE
    FenceFromAdmit = FALSE
    MaxMoves = 0
    Planners = {}
    CasWrites = TRUE
    StageMove = FALSE
    LearnerVotes = FALSE
    Resends = FALSE
    SequencesInLog = TRUE
    Cancel = FALSE
    CancelCas = TRUE
    ReportBound = "acknowledged"
    AckChecksLease = FALSE
    AckOnResponse = FALSE
    AckByFollowers = TRUE
    FenceOnPromote = TRUE
    LabelOnReceipt = FALSE
    StartRecord = TRUE
    ReportFromAnswers = FALSE
    ReportFloor = FALSE
    Spares = {}
    ReplaceOnPromote = FALSE
    SeatHoldsCopy = TRUE
    Grow = FALSE
    PromoteDestination = FALSE
    Counters = FALSE
    CounterCatchUp = FALSE
    Ballots = TRUE
    Elections = 2
    FenceEveryChange = FALSE

    Suspicions = 0
    SetCheck = FALSE
    JointFence = FALSE
    Adopt = 0
    AdoptMatch = TRUE
    Swaps = 0
    PreVote = FALSE
    Wipes = 0
    StorageIds = TRUE
    UncleanCrashes <- One
    UncleanLeads <- Yes
    VouchOnGeneration <- Yes
SYMMETRY Symm

INVARIANTS
    TypeOK
    OneLeaderPerGeneration
    AckedHeldByLeader
    AckedAgree
    NoTruncationBelowHwm
