\* One rule dropped: a re-form reads a copy's last entry only, so a copy
\* whose log is empty above its purge reads as nothing, and the new epoch
\* gives out offsets that copy purged. Only a copy that has just installed a
\* snapshot has such a log, so the leader purges past a member's match.
\*
\* Evidence: none, purging a Raft stream shard is not built yet (issue 2602).

SPECIFICATION Spec

CONSTANTS
    Members = {a, b, c}
    Voters = {a, b, c}
    MaxIndex = 5
    MaxTrims = 2
    MaxChanges = 0
    MaxRestarts = 0
    MaxReforms = 1
    PurgeBelowFloorRule = TRUE
    InstallRule = TRUE
    LeaderCaps = FALSE
    SnapAtApplied = FALSE
    TablesAtApplied = FALSE
    ReformReads = "entries"
    ReformCarriesFloor = TRUE

SYMMETRY Symm

INVARIANTS
    OffsetNeverReused
