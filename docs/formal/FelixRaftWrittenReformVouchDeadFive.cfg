\* The vouch rule with five voters, two of them declared dead and two terms
\* (#2661). The dead are a minority of the one voter set, so T stands and
\* the re-form keeps every committed entry.
\*
\* Evidence: none, this models the design for #2250, which is not built.

SPECIFICATION Spec

CONSTANTS
    Servers = {a, b, c, d, e}
    Nobody = Nobody
    InitVoters = {a, b, c, d, e}
    InitLearners = {}
    NewVoters = {a, b, c, d, e}
    MaxTerm = 2
    MaxWrites = 1
    MaxChanges = 0
    MaxCrashes = 0
    MaxPowerCuts = 1
    LearnerCounts = FALSE
    OtherTermCounts = FALSE
    JointOneHalf = FALSE
    WrittenCommits = FALSE
    CutRotates = TRUE
    Reserve = TRUE
    MaxReforms = 1
    MaxDead = 2
    Vouch = TRUE
    FloorHolder = FALSE

SYMMETRY Symm

INVARIANTS
    TypeOK
    OneLeaderPerTerm
    LogMatching
    StateMachineSafety
    OffsetNeverReused NeverLosesCommitted BaseAgrees
