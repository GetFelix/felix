\* The vouch rule with five voters, two of them declared dead and two terms
\* (#2661). The dead are a minority of the one voter set, so T stands, but
\* the gate does not stop the cut by a vote (#3023): a commits a term-1 entry
\* on {a, c, d}, a and c die, e loses power, and b campaigns for term 2 and
\* wins nothing. T is 2, so d, whose log ends in term 1 and whose saved
\* commit is 0, vouches for nothing, and the committed entry is lost. The
\* planner reports this as cut_by_vote (raft_copy/vouch.rs) and a start
\* refuses it without --accept-loss, which this model does not have.
\* MaxWrites is 0: the leader's blank is the entry lost, and with a record
\* the same trace took 3 h 56 min to reach.
\*
\* Evidence: none, this models the design for #2250, which is not built.

