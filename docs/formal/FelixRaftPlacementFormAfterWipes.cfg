\* A group that exists, three terms, one write and one lost volume: a wiped
\* member takes the first-start step again. It forms only when every other
\* member answers empty, so it does not form over a member that holds the
\* log, whether or not that member answers. The volume is lost after the
\* group has committed an entry, so two members hold the log and the step is
\* never taken: the member votes again only by catching up.
\*
\* Evidence: `first_boot_waits_for_every_peer`,
\*   `wiped_members_do_not_form_over_a_down_data_holder`.

