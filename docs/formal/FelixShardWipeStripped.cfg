\* FelixShardWipe.cfg with the wiped follower registering again without an
\* identity, as through a control plane that dropped it (a Raft group with a
\* member below the level, or a Postgres instance that predates the column),
\* in a step of its own that nothing orders against the leader's passes.
\*
\* Expected to violate AckedSurvive: the leader, still on the follower's old
\* connection, reports it under its old identity after it registered again,
\* and with no identity registered placement counts it on the stamp. The
\* code has the same window, bounded by QUIC's idle timeout and only for a
\* registration that lost its identity (#1281, docs/replication-design.md,
\* "Who may be promoted"). FelixShardWipeStrippedRedial.cfg rules it out.
\*
\* Evidence: the implementation behaviours this configuration asserts.
\* `an_unverified_follower_that_restarted_since_the_report_is_not_counted`
\*   -- ByLeaderReport's unverified branch: a report stamped at an earlier
\*   incarnation does not count the follower.
\* `a_report_is_stamped_with_its_leader_and_the_registered_incarnations` --
\*   DeliverReport: the control plane stamps the incarnations as it takes
\*   the report, and a later registration does not move the stamp.
\* `identities_are_kept_past_a_peer_that_never_answered` -- a Raft group
\*   strips identities only when a member says it cannot store them.

