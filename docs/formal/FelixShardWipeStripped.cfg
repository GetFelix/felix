\* FelixShardWipe.cfg with the clock to 3 and the wiped follower registering
\* again without an identity, as through a control plane that dropped it (a
\* Raft group with a member below the level, or a Postgres instance that
\* predates the column), in a step of its own that nothing orders against
\* the leader's passes. 3 is the least at which a promotion follows a wipe
\* (FelixShardWipeFull.cfg).
\*
\* The leader, still on the follower's old connection, reports it under its
\* old identity after it registered again. The report names the incarnation
\* the leader learned in that connection's handshake, which is not the one
\* the follower registered at now, so placement does not count it.
\* FelixShardWipeStrippedOnArrival.cfg stamps the incarnation as the report
\* arrives instead, and loses a record. AckedOnLiveMajority is
\* FelixShardWipe.cfg's.
\*
\* Evidence: the implementation behaviours this configuration asserts.
\* `an_unverified_follower_that_restarted_since_the_report_is_not_counted`
\*   -- ByLeaderReport's unverified branch: a report naming an earlier
\*   incarnation does not count the follower.
\* `a_follower_measured_at_another_incarnation_is_not_counted` and
\*   `a_follower_measured_at_no_incarnation_is_not_counted` -- DeliverReport:
\*   the leader's measured incarnation replaces the stamp, and a missing one
\*   never counts.
\* `a_new_incarnation_on_the_same_storage_starts_the_copy_over` -- Probe:
\*   a change of incarnation alone starts the leader's count over.
\* `the_incarnation_travels_only_to_a_caller_that_offered_it` -- the
\*   incarnation comes from the peer handshake.
\* `identities_are_kept_past_a_peer_that_never_answered` -- a Raft group
\*   strips identities only when a member says it cannot store them.

