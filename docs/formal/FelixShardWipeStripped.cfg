\* FelixShardWipe.cfg with the wiped follower registering again without an
\* identity, as through a control plane that dropped it (a Raft group
\* with a member below the level, or a Postgres instance that predates the
\* column). The follower is then unverified, and placement counts it only
\* from a report the control plane took at its current registration.
\* FelixShardWipeStrippedNoStamp.cfg is the same without that check, and
\* loses a record.
\*
\* The registration waits for the leader's pass that heard the follower
\* before the wipe to end and for any report in flight to land, and every
\* broker has learned the new identity by then. That leaves out the two cases
\* the stamp cannot tell apart, a report measured before the restart and
\* stamped after it, and a leader still on a crashed follower's old
\* connection (docs/replication-design.md, "Who may be promoted"). Without
\* the last assumption TLC finds the second.
\* AckedOnLiveMajority is FelixShardWipe.cfg's: registration does not change
\* what a leader acknowledges.
\*
\* Evidence: the implementation behaviours this configuration asserts.
\* `an_unverified_follower_that_restarted_since_the_report_is_not_counted`
\*   -- ByLeaderReport's unverified branch: a report stamped at an earlier
\*   incarnation does not count the follower.
\* `a_report_is_stamped_with_its_leader_and_the_registered_incarnations` --
\*   DeliverReport: the control plane stamps the incarnations as it takes
\*   the report.
\* `identities_are_kept_past_a_peer_that_never_answered` -- a Raft group
\*   strips identities only when a member says it cannot store them.

SPECIFICATION Spec

