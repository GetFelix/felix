\* Liveness for a leader that released its shard to a candidate that then
\* withdrew (`AboveReported` with `RenamePastBallot`): FelixShardCpLive.cfg
\* with two stands and two adoptions instead of four. One adoption
\* finishes in 10 minutes but never reaches the release, so it runs on main.
\* `SetCheck` is on, so answering the candidate's fence takes the leader's
\* `bgen` to 0, which is the release (`note_released` in
\* crates/server/felix-replication/src/driver/shards.rs). The leader the
\* control plane names ends up serving (`CpLeaderServes`).
\* Evidence: driver/tests/reports.rs
\* a_leader_released_to_a_candidate_that_never_opened_reports_the_refusal.

SPECIFICATION CpLiveSpec

