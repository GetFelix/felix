\* Liveness for a leader that released its shard to a candidate that then
\* withdrew (`AboveReported` with `RenamePastBallot`): FelixShardCpLive.cfg
\* cut down to that case. The first leader stops, placement names another,
\* the first comes back and stands one generation up, the named leader opens,
\* answers that fence (`bgen` 0 under `SetCheck`, the release, `note_released`
\* in crates/server/felix-replication/src/driver/shards.rs), and the candidate
\* withdraws. Two generations past the control plane's (`Elections`), adoption
\* up to 3, one broker stops (`Stops`), and the first leader is a fixed broker
\* (`FirstLeaderFixed`). The leader the control plane names ends up serving
\* (`CpLeaderServes`). FelixShardCpLiveReleasedFull.cfg is the larger bound.
\* Evidence: `a_leader_released_to_a_candidate_that_never_opened_reports_the_refusal`

SPECIFICATION CpLiveSpec

