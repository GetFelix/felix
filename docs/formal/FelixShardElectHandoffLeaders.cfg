\* FelixShardElectHandoff.cfg without the write, sized for every pull
\* request. A move and a cancel under one generation of elections, every
\* change fenced: the cut-over and the hand-back are refused at a generation a
\* candidate already took, so one leader opens per generation. With no write
\* the record invariants hold trivially; FelixShardElectHandoff.cfg checks
\* them with one write and runs nightly (an hour on a CI runner).
\* FelixShardElectHandoffUnfenced.cfg is this cut-over without the fence.
\*
\* Evidence: `after_a_cut_over_the_drained_leader_is_refused`,
\* `after_a_hand_back_an_older_leader_is_refused` and
\* `after_a_failover_to_the_destination_the_old_leader_is_refused`
\* (services/felix-broker-service/src/shards/lifecycle/tests/every_change.rs).

SPECIFICATION Spec

