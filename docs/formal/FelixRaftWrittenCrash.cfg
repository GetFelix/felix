\* FelixRaftWritten.cfg with a process crash in place of the power cut: a
\* broker that dies and starts again keeps what it wrote, and no
\* acknowledged record is ever missing from a broker that could win an
\* election.
\*
\* Evidence: none, EVIDENCE_TBD

SPECIFICATION Spec

CONSTANTS
    Servers = {a, b, c}
    Nobody = Nobody
    InitVoters = {a, b, c}
    InitLearners = {}
    NewVoters = {a, b, c}
    MaxTerm = 2
    MaxWrites = 1
    MaxChanges = 0
    MaxCrashes = 1
    MaxPowerCuts = 0
    LearnerCounts = FALSE
    OtherTermCounts = FALSE
    JointOneHalf = FALSE
    WrittenCommits = FALSE

SYMMETRY Symm

INVARIANTS
    TypeOK
    OneLeaderPerTerm
    LogMatching
    LeaderCompleteness
    StateMachineSafety
    CommittedHeld
    AckedHeld
    AckedNeverLost
