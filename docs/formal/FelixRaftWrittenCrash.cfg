\* FelixRaftWritten.cfg with two process crashes and no power cut: a broker
\* that dies and starts again keeps what it wrote, and no acknowledged
\* record is ever missing from a broker that could win an election.
\*
\* Evidence: none, EVIDENCE_TBD

SPECIFICATION Spec

CONSTANTS
    Servers = {a, b, c}
    Nobody = Nobody
    InitVoters = {a, b, c}
    InitLearners = {}
    NewVoters = {a, b, c}
    MaxTerm = 1
    MaxWrites = 2
    MaxChanges = 0
    MaxCrashes = 2
    MaxPowerCuts = 0
    LearnerCounts = FALSE
    OtherTermCounts = FALSE
    JointOneHalf = FALSE
    WrittenCommits = FALSE

SYMMETRY Symm

INVARIANTS
    TypeOK
    OneLeaderPerTerm
    LogMatching
    LeaderCompleteness
    StateMachineSafety
    CommittedHeld
    AckedHeld
    AckedNeverLost
