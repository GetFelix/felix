\* FelixRaftWritten.cfg with two process crashes and no power cut: a broker
\* that dies and starts again keeps what it wrote, and no acknowledged
\* record is ever missing from a broker that could win an election.
\*
\* Evidence: `a_quorum_write_is_acknowledged_once_a_majority_has_written_it` -- the
\*   acknowledgement rests on written copies, which a process crash keeps.
\*   `a_majority_is_the_leader_and_the_voters_that_said_so` -- the count.

SPECIFICATION Spec

CONSTANTS
    Servers = {a, b, c}
    Nobody = Nobody
    InitVoters = {a, b, c}
    InitLearners = {}
    NewVoters = {a, b, c}
    MaxTerm = 1
    MaxWrites = 2
    MaxChanges = 0
    MaxCrashes = 2
    MaxPowerCuts = 0
    LearnerCounts = FALSE
    OtherTermCounts = FALSE
    JointOneHalf = FALSE
    WrittenCommits = FALSE

SYMMETRY Symm

INVARIANTS
    TypeOK
    OneLeaderPerTerm
    LogMatching
    LeaderCompleteness
    StateMachineSafety
    CommittedHeld
    AckedHeld
    AckedNeverLost
