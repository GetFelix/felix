\* FelixRaftElectLive.cfg without the randomised timeout (Staggered off) and
\* no faults: timeouts fire whenever, so every member passes its pre-vote
\* before any stands, all three stand in the same term, and they do it again
\* until no term is left. Expected to violate ElectionSettles.

SPECIFICATION LiveSpec

CONSTANTS
    Servers = {a, b, c}
    Nobody = Nobody
    MaxTerm = 3
    MaxFaults = 0
    Splits = 0
    Staggered = FALSE

INVARIANTS
    TypeOK
    OneLeaderPerTerm

PROPERTIES
    ElectionSettles
