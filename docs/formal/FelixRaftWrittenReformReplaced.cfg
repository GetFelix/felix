\* A disk replacement and a deposed leader (#2671). Voters a1, b1, c1, and
\* b2 (the copy b1's broker gets when its disk is replaced) is a learner of
\* the seed. a1 leads term 1 and writes x at index 2 alone; c1 wins term 2
\* with b1's vote and commits f at index 2. b1's disk is replaced with
\* nothing kept, c1 is declared dead, and a1, still leading term 1, appends
\* to b2, which saves term 1 as its vote and x. Voters are keyed by copy id:
\* b1 is neither in place nor a rotated copy, so its vote is unknown, the
\* unknown votes {b1, c1} are a majority and the group is marked. The base
\* never holds x over f.
\*
\* Evidence: none, this models the design for #2250, which is not built.

SPECIFICATION Spec

CONSTANTS
    Servers = {a1, b1, c1, b2}
    Nobody = Nobody
    InitVoters = {a1, b1, c1}
    InitLearners = {b2}
    NewVoters = {a1, b1, c1}
    MaxTerm = 2
    MaxWrites = 2
    MaxChanges = 0
    MaxCrashes = 1
    MaxPowerCuts = 0
    LearnerCounts = FALSE
    OtherTermCounts = FALSE
    JointOneHalf = FALSE
    WrittenCommits = FALSE
    CutRotates = TRUE
    Reserve = TRUE
    MaxReforms = 1
    MaxDead = 1
    Vouch = TRUE
    FloorHolder = FALSE
    ReplacedCopy = b1
    ReplacementCopy = b2

INVARIANTS
    TypeOK
    OneLeaderPerTerm
    LogMatching
    StateMachineSafety
    BaseAgrees
