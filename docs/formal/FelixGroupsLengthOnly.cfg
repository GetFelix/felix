\* FelixGroups.cfg with the check comparing only the dead-letter log's
\* length. A replica loses a dead letter in a crash, and the next leader's
\* dead letter for another group lands at the same offset: the log is as
\* long as the cursor needs again. TLC finds the skip. This is why the
\* dependency carries the generation at its end.
\*
\* Evidence: none, this models a dependency without its generation.

SPECIFICATION Spec

CONSTANTS
    Replicas = {a, b, c}
    G = 2
    N = 1
    MaxGen = 3
    MaxCrashes = 1
    MaxCursors = 2
    CheckCursors = TRUE
    DependencyGen = FALSE
    KeepGroups = TRUE
    SplitSources = FALSE
    SyncBeforeShip = TRUE

SYMMETRY Symmetry

INVARIANT NoSkip
