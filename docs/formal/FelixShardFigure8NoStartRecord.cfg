\* FelixShardFigure8.cfg without the generation start record: the broker as
\* built before it, from the same seeded history and bounds. a wrote x at 1
\* and shipped it nowhere; b, promoted at 2, fenced c, wrote y and shipped it
\* nowhere, and has stepped down; its last report names a and c. TLC finds
\* the record lost in twelve steps (AckedOnMajority): c is promoted at 3 from
\* that report, takes x from a in its fence, opens, and acknowledges x once a
\* and c hold it -- a record it inherited, counted by the report and the
\* lease as any other. Its lease lapses, a is promoted at 4 from c's report,
\* and a's fence finds b's log ahead by generation, so a takes y in place of
\* x.
\*
\* This is Raft's Figure 8. Counting only records of the leader's own
\* generation closes it: HeldAtGen under FelixShardFencedAck.cfg, and the
\* start record with the clamped mark in FelixShardFigure8.cfg.
\*
\* About 56K distinct states to the violation, 1 s on sixteen cores.
\*
\* Evidence: none, this models the mark counting inherited records, which
\* the broker no longer does.


