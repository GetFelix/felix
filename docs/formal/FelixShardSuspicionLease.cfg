\* Why the followers' word waits for `generation_start`, `majority_ack` and
\* `lease_free_reads`: without any one of them brokers still acknowledge or
\* read on the lease, as in
\* FelixShardFencedPromotion.cfg, the fence with acknowledgements on the
\* report and the lease, with placement promoting before the lease lapses.
\*
\* Time stops at 4, before the control plane's margin has passed, so every
\* promotion is one the lease would not have allowed. TLC finds the old
\* leader still serving on its lease after the new one has opened
\* (AtMostOneServing): with the lease deciding who serves, replacing a
\* leader before it runs out is two leaders.
\*
\* Placement therefore acts on suspicions only for shards that serve without
\* the lease, judged per leader by its report as well as by the fleet.
\*
\* Evidence: none, this models a promotion the implementation refuses:
\* `a_suspicion_counts_only_with_all_three_features`,
\* `a_suspicion_counts_only_against_a_leader_off_its_lease`,
\* `a_finalize_waits_for_the_leader_to_report_by_round` and
\* `without_lease_free_reads_the_leader_is_not_moved_on_its_followers_word`.

