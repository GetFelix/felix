\* The state bound (issue 2460): a bound of one, an add, a delete and a put
\* that never expires, four proposals (retries included), one leader
\* change, one crash, one snapshot, no clock. The key and the counter
\* cannot both be held, so whichever write comes second answers "full",
\* and a retry after the delete empties the group gets the same answer.
\* Every rule on.
\* Evidence: `a_retry_gets_its_first_answer_whether_applied_or_full`,
\* `a_full_group_takes_deletes_and_expiries` (raft/cache/tests.rs).

