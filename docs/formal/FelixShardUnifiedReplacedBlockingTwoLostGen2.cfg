\* `FelixShardUnifiedReplacedBlockingTwoLost` cut to two starts and generation 2.
\* VIOLATES OneLeaderPerGeneration (948,649 distinct states): a starts {a, b}
\* at 2 and c starts {c} at 2, both leaving {a, b, c, d}. b promises a and d
\* promises c. b loses its directory and its new copy answers c, so c counts
\* {c, d}, half of the four without b, and opens. Then c loses its directory
\* and its new copy answers a, so a counts {a, b}, half without c, and opens
\* at 2 too. A copy replaced after it promised one fence is taken for gone by
\* the other, so the halves need not meet, lost ballots or kept.

SPECIFICATION Spec

CONSTANTS
    Nodes = {a, b, c, d}
    First = a
    NoNode = NoNode
    MaxGen = 2
    MaxWrites = 0
    MaxStarts = 2
    MaxUnclean = 0
    MaxWipes = 2
    MaxRestores = 0
    MaxRetries = 0
    SetChoices = {{c}, {d}, {a, b}}
    OldPeers = {}
    ReplacedBlocking <- Yes

INVARIANTS
    OneLeaderPerGeneration
    AckedHeldByLeader
