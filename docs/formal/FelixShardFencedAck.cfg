\* Quorum safety without the clock. A write is acknowledged once a majority
\* holds it and still holds the leader's generation as the highest it
\* accepted (`AckByFollowers`): no lease and no report in the condition. A
\* promoted leader fences a majority, itself included, and takes any tail
\* ahead of its own before it serves (`FenceOnPromote`).
\*
\* The clocks are given everything. The lease has no margin on either side,
\* as in FelixShardThinMargin.cfg, clocks drift, and the commit does not check
\* the lease, so a deposed leader keeps admitting, committing and shipping
\* after its successor is named. Two brokers do serve at once here, which is
\* why AtMostOneServing, AckedSurvive and NoStaleCommit are not checked. What
\* is: every acknowledged record is on a majority, and the current leader
\* holds it from the moment it opens for writes. FelixShardUnfencedAck.cfg is
\* this without the fence, and TLC finds the record lost.
\*
\* Bounds: two writes and time to 4, one promotion per run (L = 4, and with
\* no margin the first lapse is at 4). That covers a write acknowledged by the
\* old leader after the promotion, and the fence catching up a tail, in 2.62M
\* distinct states, depth 28, 15 s on sixteen cores. Two promotions (L = 2)
\* ran past 18M states without finishing; with Drift = 0 as well they pass by
\* hand in 14.3M states, depth 35, and about six minutes on sixteen cores:
\* as long as the rest of the suite together, so not in CI.
\*
\* Evidence: `a_fence_is_on_disk_before_it_is_answered` and
\* `an_older_leader_is_refused_after_the_fence` -- AnswerFence, the replica's
\* half: the generation is persisted before the answer, and every older
\* leader is refused from then on, restarts included. The leader does not
\* fence on promotion yet, and acknowledgements do not count followers.

SPECIFICATION Spec

CONSTANTS
    Brokers = {a, b, c}
    L = 4
    Margin = 0
    Eps = 0
    Drift = 1
    MaxTime = 4
    MaxWrites = 2
    CheckAtCommit = FALSE
    Quorum = TRUE
    Promotion = "log-order"
    ReportBeforeAck = FALSE
    Handoff = FALSE
    WaitForDrained = TRUE
    FenceAtClaim = TRUE
    AckOnAdmit = FALSE
    FenceFromAdmit = FALSE
    MaxMoves = 0
    Planners = {}
    CasWrites = TRUE
    StageMove = FALSE
    LearnerVotes = FALSE
    Resends = FALSE
    SequencesInLog = TRUE
    Cancel = FALSE
    CancelCas = TRUE
    ReportBound = "acknowledged"
    AckChecksLease = FALSE
    AckOnResponse = FALSE
    AckByFollowers = TRUE
    FenceOnPromote = TRUE

SYMMETRY Symm

INVARIANTS
    TypeOK
    AckedHeldByLeader
    AckedAgree
    AckedOnMajority
    NoTruncationBelowHwm
