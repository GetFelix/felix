\* Quorum safety without the clock, as the broker runs it once the fleet has
\* finalized `majority_ack`. A write is acknowledged once a majority has
\* answered that it holds it at the leader's generation (`AckByFollowers`):
\* no report and no lease anywhere on the write's path, not at admission,
\* not at the commit, not at the acknowledgement. A promoted leader fences a
\* majority, itself included, and takes any tail ahead of its own before it
\* serves (`FenceOnPromote`), then writes its generation-start record, and
\* the mark counts only past a record of its own generation (`StartRecord`).
\*
\* The clocks are given everything. The lease has no margin on either side,
\* as in FelixShardThinMargin.cfg, and clocks drift, but no write checks
\* the lease, so a deposed leader keeps admitting, committing and shipping
\* until it hears of its successor. Two brokers do serve at once here, which
\* is why AtMostOneServing, AckedSurvive and NoStaleCommit are not checked.
\* What is: every acknowledged record is on a majority, and the current
\* leader holds it from the moment it opens for writes.
\* FelixShardUnfencedAck.cfg is this without the fence, and
\* FelixShardFigure8FollowerAcksNoStartRecord.cfg without the start record;
\* TLC finds the record lost in both.
\*
\* Bounds: two writes and time to 4, one promotion per run (L = 4, and with
\* no margin the first lapse is at 4). That covers a write acknowledged by the
\* old leader after the promotion, and the fence catching up a tail.
\* Figure 8 needs two more leaderships than that:
\* FelixShardFigure8FollowerAcks.cfg.
\*
\* Evidence: `held_at_generation` -- a follower counts from its own answer at
\* the leader's generation, the leader only while it has taken no newer
\* fence (quorum.rs); `a_deposed_leader_does_not_count_itself` and
\* `an_answer_from_before_a_newer_fence_still_counts`. `await_quorum` skips
\* the lease for a follower-decided mark, and `ShardFence::admit` for a
\* shard that acknowledges by its followers.

SPECIFICATION Spec

CONSTANTS
    Brokers = {a, b, c}
    L = 4
