\* FelixRaft.cfg with two crashes and no subscriber: a broker that crashes
\* twice, or two brokers that crash once each, around one change of leader.
\*
\* Evidence: the raft_log adapter tests in felix-storage:
\*   `a_cut_before_the_flush_keeps_what_was_flushed`,
\*   `a_cut_inside_an_append_is_repaired`,
\*   `a_cut_after_the_callback_keeps_the_entries`.

SPECIFICATION Spec

CONSTANTS
    Servers = {a, b, c}
    Nobody = Nobody
    MaxTerm = 2
    MaxWrites = 1
    MaxMembers = 0
    MaxCrashes = 2
    MaxSnapshots = 0
    Consumer = FALSE
    AckBeforeFlush = FALSE
    VoteNotDurable = FALSE
    LeaderResumes = FALSE
    TornTailKept = FALSE
    TruncateNotDurable = FALSE
    RecoveredTailUnsynced = FALSE
    SaveCommittedUnflushed = FALSE
    PurgeBeforeSnapshot = FALSE
    SnapshotTwoRenames = FALSE
    CommitPriorTerm = FALSE
    DeliverUncommitted = FALSE
    SkipsNotCounted = FALSE

SYMMETRY Symm

INVARIANTS
    TypeOK
    OneLeaderPerTerm
