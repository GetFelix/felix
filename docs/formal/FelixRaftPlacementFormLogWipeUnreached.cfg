\* FelixRaftPlacementFormLogWipe.cfg without the reached flag: a member whose
\* log alone was lost holds its mark and every peer's record, so it forms
\* again, having forgotten a vote it gave. Must violate AckedHeldSurvive
\* (issue 2407).
\*
\* Evidence: `a_member_whose_log_was_emptied_does_not_form_again` fails
\*   without the flag.

SPECIFICATION Spec

CONSTANTS
    Brokers = {a, b, c}
    Nobody = Nobody
    InitBrokers = {a, b, c}
    MaxTerm = 2
    MaxWrites = 1
    MaxCalls = 0
    MaxTargets = 0
    MaxWipes = 1
    MinVoters = 3
    Rotate = FALSE
    Retain = TRUE
    StaleTargets = FALSE
    SkipJoint = FALSE
    NoWithhold = FALSE
    WithheldCounts = FALSE
    AnswerAnyId = FALSE
    DeleteOnTarget = FALSE
    PlaceDoomed = FALSE
    Forming = TRUE
    FormRecord = TRUE
    FormReached = FALSE
    FirstBoot = FALSE
    FormMajority = FALSE
    FormAlias = FALSE
    Waived = {}
    Absent = {}
    EarlyWipes = TRUE
    LogWipes = TRUE
    Direct = FALSE
    NoBarrier = FALSE
    NoVersion = FALSE
    NoStamp = FALSE
    SelfRemove = FALSE
    DoomAnyVersion = FALSE
    MaxRewinds = 0
    RewindSameInc = FALSE
    NoIncAck = FALSE
    WaiverExcusesAnswer = FALSE
    WaiverAnyNumber = FALSE
    DoomOnCommitted = FALSE

SYMMETRY Symm

INVARIANTS
    AckedHeldSurvive
