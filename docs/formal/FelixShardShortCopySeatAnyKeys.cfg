\* FelixShardShortCopySeat.cfg with only the fence ids' comparison dropped
\* (`ShortCopyChecksKeys <- No`): the exception still wants the fencer's set
\* to be the two and the generations to line up, but not the ids to name
\* exactly them. It passes: no failover in the model shrinks the voting set,
\* so a fencer with a set of two at the generation after the one the crashed
\* leader led has the two it led. The comparison stays in the code against
\* placement that would shrink a set at a failover.
\*
\* Evidence: `a_crashed_leader_of_two_copies_takes_the_fence` (the exception).
SPECIFICATION Spec

CONSTANTS
    Brokers = {a, b, c}
    L = 1
    Margin = 0
    Eps = 0
    Drift = 0
    MaxTime = 1
    MaxWrites = 1
    CheckAtCommit = FALSE
    Quorum = TRUE
    Promotion = "any"
    ReportBeforeAck = FALSE
    Handoff = FALSE
    WaitForDrained = TRUE
    FenceAtClaim = TRUE
    AckOnAdmit = FALSE
    FenceFromAdmit = FALSE
    MaxMoves = 1
    Planners = {}
    CasWrites = TRUE
    StageMove = FALSE
    LearnerVotes = FALSE
    Resends = FALSE
    SequencesInLog = TRUE
    Cancel = FALSE
    CancelCas = TRUE
    ReportBound = "acknowledged"
    AckChecksLease = FALSE
    AckOnResponse = FALSE
    AckByFollowers = TRUE
    FenceOnPromote = TRUE
    LabelOnReceipt = FALSE
    StartRecord = TRUE
    Spares = {c}
    ReplaceOnPromote = FALSE
    SeatHoldsCopy = TRUE
    Grow = FALSE
    PromoteDestination = FALSE
    Counters = FALSE
    CounterCatchUp = FALSE
    Ballots = FALSE
    Elections = 0
    FenceEveryChange = FALSE
    Suspicions = 0
    SetCheck = FALSE
    JointFence = FALSE
    Adopt = 0
    AdoptMatch = TRUE
    Swaps = 0
    PreVote = FALSE
    Wipes = 1
    StorageIds = FALSE
    ReportFromAnswers = FALSE
    ReportFloor = FALSE

    CrashLoses <- Yes
    CrashLeader <- Yes
    GiveUpOnCrash <- Yes
    RefuseShortCopy <- Yes
    ShortCopyChecksKeys <- No

SYMMETRY Symm

INVARIANTS
    TypeOK
    AckedHeldByLeader
    AckedAgree
    NoTruncationBelowHwm
