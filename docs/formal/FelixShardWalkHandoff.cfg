\* A long random walk over planned moves under the lease, for TLC's
\* simulation mode (`scripts/check_tla.sh --simulate`). FelixShardHandoff.cfg
\* checks one move with time to 5, short of any promotion; this lifts the
\* bounds so one behaviour can move the shard, lose its lease, fail over and
\* move it again many times, with drifting clocks.
\*
\* The knobs are the broker as built, FelixShardFencedPromotion.cfg with the
\* start record (FelixShardFigure8.cfg), plus FelixShardHandoff.cfg's move:
\* `Quorum` writes acknowledged on the report and a valid lease, both lease
\* checks, the promotion fence, writes holding the fence from admission, and
\* the cut-over waiting for the drained report. The margins are
\* FelixShardRealMargins.cfg's, a quarter of the lease each side. Writes are
\* acknowledged on commit, not on admission: a leader whose lease lapses drops
\* what it acknowledged on admission whether or not anything moves, which
\* is that trade-off, not the handoff's (see FelixShardCancel.cfg).
\*
\* Ballots and fencing every change of leader stay off, as in the bounded
\* configs these extend; FelixShardElectHandoff.cfg checks them.
\*
\* Bounds: time to 40, six writes, six moves. No SYMMETRY: simulation stores
\* no states. A pass means the walks found nothing, not that nothing is there.
\* FelixShardWalkHandoffNoWait.cfg is this cutting over without the wait.
\*
\* Evidence: `a_fenced_shard_waits_for_the_leader_to_report_drained` and
\* `a_drained_report_cuts_over_to_the_successor` (the cut-over),
\* `a_draining_shard_reports_drained_once_its_fence_is_quiet` (the drained
\* report), and `a_durable_publish_claimed_after_the_fence_is_refused` (the
\* fence at the claim).

SPECIFICATION Spec

CONSTANTS
