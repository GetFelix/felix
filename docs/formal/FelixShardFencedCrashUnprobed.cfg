\* FelixShardFencedCrash.cfg with the first leader not yet knowing either
\* follower's identity (`UnprobedStart`), so a report can name none for a
\* follower. Placement names such a member with an empty identity, which no
\* fence answer matches. The passing twin of
\* FelixShardFencedCrashCountsUnnamed.cfg and
\* FelixShardFencedCrashNamesByRegistration.cfg, kept off later PR checks by
\* weight: the extra probes multiply the interleavings.
\*
\* Evidence: the implementation behaviours this configuration asserts.
\* `a_replica_named_without_an_identity_does_not_count` -- FenceCounts: a
\*   member named with no identity does not count.
\* `an_unvouched_member_of_the_old_set_is_named_with_no_identity` --
\*   placement names it so.

