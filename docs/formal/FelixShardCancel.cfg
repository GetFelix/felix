\* An operator cancels a fenced move: the leader that stopped serves again at
\* a new generation. Writes are acknowledged when admitted, the broker's
\* default, and hold the fence from there, so a write admitted before the
\* fence and still queued when the cancel lands is claimed and committed by
\* the same leader. A second move may follow the cancel. TLC finds no
\* acknowledged write missing from whoever serves.
\*
\* Time stops short of any lease lapse. A leader whose lease lapses drops
\* what it acknowledged on admission whether or not a move is cancelled, and
\* that is the acknowledge-on-admission trade-off, not the cancel's.
\*
\* FelixShardCancelStalePlannerCas.cfg covers a cancel decided from a held
\* read, and FelixShardCancelStalePlanner.cfg the same without the check.
\* Evidence: the implementation behaviours this configuration asserts.
\* `cancelling_a_fenced_move_hands_the_shard_back_to_its_leader` -- the
\*   cancel of a fenced move names the leader that was fenced, at a new
\*   generation, without the destination the move added.
\* `a_fenced_move_is_taken_back_and_then_there_is_nothing_to_cancel` -- the
\*   same through the API.
\* `cancelling_a_fenced_move_loses_no_acknowledged_write` -- against real
\*   brokers, with a publisher and a subscriber running through the cancel.

