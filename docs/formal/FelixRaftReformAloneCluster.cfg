\* FelixRaftReformAlone.cfg for a cluster, where a second broker can be placed
\* while the group of one re-forms itself. The control plane writes the epoch
\* only if, in the same step as the epoch compare and swap, the group is
\* alone on the broker (`one`). A broker placed after the plan makes the
\* command refuse, and the group is re-formed from every placed broker's
\* copy instead. The group keeps every acknowledged record its copies hold
\* (KeptLossBound) and gives no offset out twice.
\*
\* Evidence: `a_group_of_one_starts_its_next_epoch`,
\* `another_placed_broker_is_refused`, `a_set_change_or_move_in_flight_is_refused`
\* and `a_group_of_three_with_two_lost_is_refused` (the apply's checks),
\* `satisfies_the_reform_epoch_contract` (a group of one through the store).
\* Dropping the placed check fails `another_placed_broker_is_refused`.

SPECIFICATION Spec

