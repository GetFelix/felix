\* No shard delete watermark: a delete forgets the group, and a late advance
\* from the deleted group's tracker recreates it past records nobody read.
\*
\* Evidence: none, Raft shards refuse group operations until the design this
\* models is built (#2446).

SPECIFICATION Spec

CONSTANTS
    Members = {a, b}
    N = 2
    SeekTo = {1, 3}
    MaxChanges = 1
    MaxLog = 4
    EpochCheck = TRUE
    DeleteWatermark = FALSE
    IfNewChecksTracker = TRUE
    TermBoundTrackers = TRUE
    HydrateFromApplied = TRUE
    WaitOwnProposals = TRUE
    DeleteRetiresAll = TRUE
    DeadBeforeAdvance = TRUE
    KeepRedriven = TRUE

SYMMETRY Symm

INVARIANTS
    NoSkip
