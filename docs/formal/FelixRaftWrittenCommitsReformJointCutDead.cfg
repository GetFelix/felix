\* Five voters move to {a, b, c} through a joint configuration committed on
\* c's unsynced, reserved write; c is cut and rotated, a and b die (#2661).
\* The target is a voter set even when no copy read holds its entry, and the
\* dead are a majority of it, so the group is marked: no offset is reused.
\*
\* Evidence: none, this models the design for #2250, which is not built.

