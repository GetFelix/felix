    Servers = {a, b, c, d, e}
    Nobody = Nobody
    InitVoters = {a, b, c, d, e}
    InitLearners = {}
    NewVoters = {a, b, c}
    MaxTerm = 1
    MaxWrites = 0
    MaxChanges = 1
    MaxCrashes = 0
    MaxPowerCuts = 1
    LearnerCounts = FALSE
    OtherTermCounts = FALSE
    JointOneHalf = FALSE
    WrittenCommits = TRUE
    CutRotates = TRUE
    Reserve = TRUE
    MaxReforms = 1
    MaxDead = 2
    Vouch = TRUE
    FloorHolder = FALSE

SYMMETRY Symm

INVARIANTS
    TypeOK
    OneLeaderPerTerm
    LogMatching
