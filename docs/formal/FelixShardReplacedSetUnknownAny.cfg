\* FelixShardReplacedSetUnknown.cfg renaming a leader whenever the set it
\* leaves is unknown (`UnknownRenamesAny`). It violates AckedHeldByLeader
\* (13 states deep): a leads at 1 on {a, b, c}; c is promoted at 2 on
\* {b, c, d} and loses the set it leaves; it is named again at 3, where the
\* fence leaves {b, c, d} alone, and opens with d, without the write a and b
\* acknowledged at 1.
\*
\* Evidence: as FelixShardReplacedSetUnknown.cfg, with the rule the fix
\*   replaced.

SPECIFICATION Spec

CONSTANTS
    Renames <- Yes
    SetLossUpTo <- Two
    KeepsUnopened <- Yes
    FenceRecordedSet <- Yes
    UnknownRenamesAny <- Yes
    Brokers = {a, b, c, d}
