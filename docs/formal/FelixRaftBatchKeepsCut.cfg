\* FelixRaftBatch.cfg with a purge that keeps a cut batch's count in the table
\* snapshot, so a member that purged or installed past the held pieces can
\* still finish the batch.
\*
\* Evidence: none, idempotent batches of several records on a Raft shard are not
\*   built yet (issue 2524).

SPECIFICATION Spec

CONSTANTS
    Members = {a, b}
    Producers = {p, q}
    MaxSeq = 2
    Lens = {2, 3}
    MaxChanges = 2
    MaxPurges = 2
    MaxLog = 12
    TermBoundBatch = TRUE
    ResendFinishes = TRUE
    AtPurge = "keep"
    TableAtAppend = TRUE
    HeldAfterCommit = TRUE

SYMMETRY Symm

INVARIANTS
    TypeOK
    BatchExactlyOnce
    BatchInOrder
    ProducerPlaceAgrees
