\* FelixShardFencedAck.cfg without the fence: the promoted leader serves at
\* once. `check_tla.sh` expects TLC to lose an acknowledged record.
\*
\* The trace: the old leader, which checks no lease, is still admitting when
\* the control plane promotes a follower. The old leader commits, ships the
\* record to the other follower, which has never heard of the new
\* generation, and acknowledges it on that majority. The new leader never
\* sees it (AckedHeldByLeader). Counting followers is not enough by itself;
\* without the lease it is the fence that keeps the old leader from finding
\* a majority.
\*
\* Evidence: none, this removes the fence FelixShardFencedAck.cfg has, and
\* the broker acknowledges by its followers only when every broker fences.

SPECIFICATION Spec

CONSTANTS
    Brokers = {a, b, c}
    L = 4
    Margin = 0
    Eps = 0
    Drift = 1
    MaxTime = 4
    MaxWrites = 2
    CheckAtCommit = FALSE
    Quorum = TRUE
    Promotion = "log-order"
    ReportBeforeAck = FALSE
    Handoff = FALSE
    WaitForDrained = TRUE
    FenceAtClaim = TRUE
    AckOnAdmit = FALSE
    FenceFromAdmit = FALSE
    MaxMoves = 0
    Planners = {}
    CasWrites = TRUE
    StageMove = FALSE
    LearnerVotes = FALSE
    Resends = FALSE
    SequencesInLog = TRUE
    Cancel = FALSE
    CancelCas = TRUE
    ReportBound = "acknowledged"
    AckChecksLease = FALSE
    AckOnResponse = FALSE
    AckByFollowers = TRUE
    FenceOnPromote = FALSE
    LabelOnReceipt = FALSE
    StartRecord = TRUE
    ReportFromAnswers = FALSE
    ReportFloor = FALSE
    Spares = {}
    ReplaceOnPromote = FALSE
    SeatHoldsCopy = TRUE
    Grow = FALSE
    PromoteDestination = FALSE

SYMMETRY Symm

INVARIANTS
    TypeOK
    AckedHeldByLeader
    AckedAgree
    AckedOnMajority
    NoTruncationBelowHwm
