\* The lease alone, with clock drift: no writes, so the state space is the
\* heartbeats, lapses and promotions, and every interleaving of drifting
\* clocks is affordable. This is where the safety interval is checked.
\* Evidence: the lease behaviours this configuration asserts.
\* `a_broker_that_cannot_renew_its_lease_stops_serving` -- a broker stops
\*   serving when its own lease lapses, rather than waiting to be told.
\* `a_quarter_of_the_lease_is_surrendered_as_margin` -- Eps: a broker stops
\*   serving before its own expiry, not at it.
\* `a_pause_between_sending_and_handling_does_not_extend_the_lease` -- the lease
\*   is anchored at the instant the heartbeat was sent.
\* Planners = {}: every decision reads and writes in one step, so CasWrites
\*   has nothing to compare. The StalePlanner and StalePromotion
\*   configurations are where a read is held across another write.

SPECIFICATION Spec

CONSTANTS
    Brokers = {a, b, c}
    L = 4
    Margin = 2
    Eps = 1
    Drift = 1
    MaxTime = 8
    MaxWrites = 0
    CheckAtCommit = TRUE
    Quorum = TRUE
    Promotion = "log-order"
    ReportBeforeAck = TRUE
    Handoff = FALSE
    WaitForDrained = TRUE
    FenceAtClaim = TRUE
    AckOnAdmit = FALSE
    FenceFromAdmit = FALSE
    MaxMoves = 0
    Planners = {}
    CasWrites = TRUE
    StageMove = FALSE
    LearnerVotes = FALSE
    Resends = FALSE
    SequencesInLog = TRUE
    Cancel = FALSE
    CancelCas = TRUE
    ReportBound = "acknowledged"
    AckChecksLease = TRUE
    AckOnResponse = FALSE
    AckByFollowers = FALSE
    FenceOnPromote = FALSE
    LabelOnReceipt = FALSE

SYMMETRY Symm

INVARIANTS
    TypeOK
    AtMostOneServing
    NoStaleCommit
