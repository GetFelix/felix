\* FelixRaftSleepAuditLost with a follower that ticks at once after its audit
\* fires, as the first design had it. Its pre-vote wakes the leader and the
\* other follower, the vote hold drops it, and nobody is deposed: the ask
\* saves a pre-vote round, the hold keeps the leader.
\* Evidence: none, this models an alternative the implementation does not use.

