\* FelixShardElectLiveReissue.cfg without the reissue: the control plane
\* promotes one broker while another is elected at the same generation and
\* opens, and it keeps naming the one that cannot open
\* (`CollisionSuperseded` violated within a minute locally).
\*
\* Evidence: none, the twin of FelixShardElectLiveReissue.cfg.

SPECIFICATION ReissueSpec

CONSTANTS
    Brokers = {a, b, c}
    L = 2
    Margin = 0
    Eps = 0
    Drift = 0
    MaxTime = 0
    MaxWrites = 0
    CheckAtCommit = FALSE
    Quorum = TRUE
    Promotion = "log-order"
    ReportBeforeAck = FALSE
    Handoff = FALSE
    WaitForDrained = TRUE
    FenceAtClaim = TRUE
    AckOnAdmit = FALSE
    FenceFromAdmit = FALSE
    MaxMoves = 0
    Planners = {}
    CasWrites = TRUE
    StageMove = FALSE
    LearnerVotes = FALSE
    Resends = FALSE
    SequencesInLog = TRUE
    Cancel = FALSE
    CancelCas = TRUE
    ReportBound = "acknowledged"
    AckChecksLease = FALSE
    AckOnResponse = FALSE
    AckByFollowers = TRUE
    FenceOnPromote = TRUE
    LabelOnReceipt = FALSE
    StartRecord = TRUE
    ReportFromAnswers = FALSE
    ReportFloor = FALSE
    Spares = {}
    ReplaceOnPromote = FALSE
    SeatHoldsCopy = TRUE
    Grow = FALSE
    PromoteDestination = FALSE
    Counters = FALSE
    CounterCatchUp = FALSE
    Ballots = TRUE
    Elections = 2
    FenceEveryChange = FALSE

    Suspicions = 1
    SetCheck = TRUE
    JointFence = TRUE
    Adopt = 3
    AdoptMatch = TRUE
    Swaps = 0
    PreVote = TRUE
    Wipes = 0
    StorageIds = FALSE
    DetectorMisfires <- Yes
    PreVoteAsked <- Yes
    Backoff <- Yes
    Splits <- Two

PROPERTIES
    CollisionSuperseded

INVARIANTS
    TypeOK
    OneLeaderPerGeneration
    AckedHeldByLeader
    AckedAgree
    AckedOnMajority
    NoTruncationBelowHwm
    AdoptedMatchesOpened
    SetChangesJoint
