\* FelixRaftLeaseStoreStall.cfg with a stalled broker that keeps sending
\* liveness heartbeats. It cannot write, yet it keeps the lease and no other
\* broker can be elected. The harm is to availability, not to a record.
\*
\* Evidence: none, this models an alternative the implementation does not use.

