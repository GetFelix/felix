\* FelixRaftPlacementSameId.cfg without the floor: a leader counts the
\* appends of a member whose vote is withheld, whatever the leader's term.
\* The member forgot the term it voted in, so the leader of an older term
\* commits an entry with it that the newer leader, elected on its vote, does
\* not hold, and the write it acknowledged is lost (issue 2365).
\*
\* Evidence: `a_wiped_member_is_counted_by_no_leader_until_every_peer_reports_its_term`
\*   -- the wiped member answers no leader before every peer gives its term, and none
\*   below the highest. `the_floor_waits_for_every_member_and_takes_the_highest_term`
\*   -- the floor is the highest term, and a member that gives none leaves it unknown.

