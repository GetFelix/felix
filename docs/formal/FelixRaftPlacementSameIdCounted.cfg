\* FelixRaftPlacementSameId.cfg as the code is today: a leader counts the
\* appends of a member whose vote is withheld. The member forgot the term it
\* voted in, so the leader of an older term commits an entry with it that the
\* newer leader, elected on its vote, does not hold. Pinned as an expected
\* violation until issue 2365 is fixed.
\*
\* Evidence: services/felix-controlplane-service/src/raft/http.rs refuses only the vote request of a withheld member.

SPECIFICATION Spec

CONSTANTS
    Brokers = {a, b, c}
    Nobody = Nobody
    InitBrokers = {a, b, c}
    MaxTerm = 2
    MaxWrites = 0
    MaxCalls = 0
    MaxTargets = 0
    MaxWipes = 1
    MinVoters = 3
    Rotate = FALSE
    Retain = TRUE
    StaleTargets = FALSE
    SkipJoint = FALSE
    NoWithhold = FALSE
    WithheldCounts = TRUE
    AnswerAnyId = FALSE
    DeleteOnTarget = FALSE

SYMMETRY Symm

INVARIANTS
    LeaderCompleteness
