\* FelixRaftPlacementSameId.cfg as the code is today: a leader counts the
\* appends of a member whose vote is withheld. The member forgot the term it
\* voted in, so the leader of an older term commits an entry with it that the
\* newer leader, elected on its vote, does not hold, and the write it
\* acknowledged is lost. Pinned as an expected
\* violation until issue 2365 is fixed.
\*
\* Evidence: `a_wiped_member_does_not_vote_a_lagging_member_into_leadership` -- a
\*   wiped member withholds its vote. `a_withheld_vote_is_unreachable_and_keeps_the_reason`
\*   -- only the vote request is refused; appends are answered and counted.

SPECIFICATION Spec

CONSTANTS
    Brokers = {a, b, c}
    Nobody = Nobody
    InitBrokers = {a, b, c}
    MaxTerm = 2
    MaxWrites = 1
    MaxCalls = 0
    MaxTargets = 0
    MaxWipes = 1
    MinVoters = 3
    Rotate = FALSE
    Retain = TRUE
    StaleTargets = FALSE
    SkipJoint = FALSE
    NoWithhold = FALSE
    WithheldCounts = TRUE
    AnswerAnyId = FALSE
    DeleteOnTarget = FALSE
    PlaceDoomed = FALSE

SYMMETRY Symm

INVARIANTS
    AckedSurvive
