\* FelixRaft.cfg with one rule dropped. A leader commits an entry of an
\* earlier term by counting copies, as in Figure 8 of the Raft paper. A later
\* leader that never saw the entry is elected and writes over it.
\*
\* Evidence: none, this models an alternative the implementation does not use.

