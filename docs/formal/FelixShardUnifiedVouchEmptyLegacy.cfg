\* FelixShardUnifiedIdleVouch with a leader that vouches only through a mark
\* above zero, which takes a client record. No write is made, so the
\* follower back from an unclean crash stays untrusted while the shard is
\* idle. Expected to violate FollowerTrusted.
\*
\* Evidence: none, this models the leader before an empty shard's followers
\* were vouched for, to show why they are.

SPECIFICATION ShipSpec

CONSTANTS
    Nodes = {a, b, c}
    First = a
    NoNode = NoNode
    MaxGen = 3
    MaxWrites = 0
    MaxStarts = 1
    MaxUnclean = 2
    MaxWipes = 0
    MaxRestores = 0
    MaxRetries = 0
    SetChoices = {{a, b, c}}
    OldPeers = {}
    VouchEmpty <- No

PROPERTY
    FollowerTrusted

INVARIANTS
    OneLeaderPerGeneration
    AckedHeldByLeader
