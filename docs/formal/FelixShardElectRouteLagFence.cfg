\* #1940 with its fix (`RenameSpec`): FelixShardElectRouteLagFenceNoFix.cfg
\* with a fencing leader whose own copy promised a newer generation
\* reporting its generation refused (`OwnBallotFenceRefused`). Passes
\* `OwnBallotCaughtUp` and `OwnBallotFenceCaughtUp`: the control plane names
\* it again one generation up, where its own promise and any member's
\* promise to the stale round both name it.
\*
\* Evidence: `a_fence_below_its_own_ballot_reports_the_refusal`
\*   -- the fencing leader reports the generation it cannot open at.

SPECIFICATION RenameSpec

CONSTANTS
    Brokers = {a, b, c}
    L = 2
    Margin = 0
    Eps = 0
    Drift = 0
    MaxTime = 0
    MaxWrites = 0
    CheckAtCommit = FALSE
    Quorum = TRUE
    Promotion = "log-order"
    ReportBeforeAck = FALSE
    Handoff = FALSE
    WaitForDrained = TRUE
    FenceAtClaim = TRUE
    AckOnAdmit = FALSE
    FenceFromAdmit = FALSE
    MaxMoves = 0
    Planners = {}
    CasWrites = TRUE
    StageMove = FALSE
    LearnerVotes = FALSE
    Resends = FALSE
    SequencesInLog = TRUE
    Cancel = FALSE
    CancelCas = TRUE
    ReportBound = "acknowledged"
    AckChecksLease = FALSE
    AckOnResponse = FALSE
    AckByFollowers = TRUE
    FenceOnPromote = TRUE
    LabelOnReceipt = FALSE
    StartRecord = TRUE
    ReportFromAnswers = FALSE
    ReportFloor = FALSE
    Spares = {}
    ReplaceOnPromote = FALSE
    SeatHoldsCopy = TRUE
    Grow = FALSE
    PromoteDestination = FALSE
    Counters = FALSE
    CounterCatchUp = FALSE
    Ballots = TRUE
    Elections = 1
    FenceEveryChange = FALSE

    Suspicions = 1
    SetCheck = TRUE
    JointFence = TRUE
    Adopt = 3
    AdoptMatch = TRUE
    Swaps = 0
    PreVote = TRUE
    Wipes = 0
    StorageIds = FALSE
    PreVoteAsked <- Yes
    FailStops <- One
    Renames <- Yes
    RouteLags <- Yes
    NamedHereWaits <- No
    StaleFenceAnswered <- Yes
    OpenChecksOwnBallot <- Yes
    OwnBallotFenceRefused <- Yes

PROPERTIES
    OwnBallotCaughtUp
    OwnBallotFenceCaughtUp

INVARIANTS
    TypeOK
    OneLeaderPerGeneration
    AckedHeldByLeader
    AckedAgree
    AckedOnMajority
    NoTruncationBelowHwm
    AdoptedMatchesOpened
    SetChangesJoint
