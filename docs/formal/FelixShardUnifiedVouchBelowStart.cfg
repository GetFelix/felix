\* B1: a batch vouches when the copy is level through the mark it carries,
\* which right after an open can sit below the leader's start record. A copy
\* that lost an acknowledged record is vouched without it.
\* Expected to violate AckedHeldByLeader.

SPECIFICATION Spec

CONSTANTS
    Nodes = {a, b, c}
    First = a
    NoNode = NoNode
    MaxGen = 3
    MaxWrites = 1
    MaxStarts = 2
    MaxUnclean = 1
    MaxWipes = 0
    MaxRestores = 0
    MaxRetries = 0
    SetChoices = {{a, b, c}}
    OldPeers = {}
    VouchBelowStart <- Yes

INVARIANTS
    OneLeaderPerGeneration
    AckedHeldByLeader
