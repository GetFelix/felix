\* A witness for FelixRaft.cfg, to show its checks do not pass for want of
\* behaviour. `NeverLosesTail` says this never happens, and TLC must find
\* that it does: a crash loses entries that were appended and not flushed.
\*
\* Evidence: the raft_log adapter tests in felix-storage:
\*   `a_cut_before_the_flush_keeps_what_was_flushed`,
\*   `a_cut_inside_an_append_is_repaired`.

SPECIFICATION Spec

CONSTANTS
    Servers = {a, b, c}
    Nobody = Nobody
    MaxTerm = 2
    MaxWrites = 1
    MaxMembers = 0
    MaxCrashes = 1
    MaxSnapshots = 0
    Consumer = FALSE
    AckBeforeFlush = FALSE
    VoteNotDurable = FALSE
    LeaderResumes = FALSE
    TornTailKept = FALSE
    TruncateNotDurable = FALSE
    RecoveredTailUnsynced = FALSE
    SaveCommittedUnflushed = FALSE
    PurgeBeforeSnapshot = FALSE
    SnapshotTwoRenames = FALSE
    CommitPriorTerm = FALSE
    DeliverUncommitted = FALSE
    SkipsNotCounted = FALSE

SYMMETRY Symm

PROPERTIES
    NeverLosesTail
