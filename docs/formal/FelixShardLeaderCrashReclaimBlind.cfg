\* FelixShardLeaderCrashReclaim.cfg with placement reclaiming without
\* measuring the followers (`ReclaimBlind`): the leader acknowledged a
\* record on itself and a follower, lost it in the crash, and leads again
\* without it.
\*
\* Expected to violate AckedSurvive.
\*
\* Evidence: this configuration REMOVES the measurement.
\* `a_reclaim_needs_every_follower_measured_since_the_crash` -- drop the
\*   check that every follower is at or behind the leader and placement
\*   reclaims on this trace.

SPECIFICATION Spec

CONSTANTS
    Brokers = {a, b, c}
    L = 2
    Margin = 1
    Eps = 1
    Drift = 0
    MaxTime = 0
    MaxWrites = 1
    CheckAtCommit = TRUE
    Quorum = TRUE
    Promotion = "leader-report"
    ReportBeforeAck = TRUE
    Handoff = FALSE
    WaitForDrained = TRUE
    FenceAtClaim = TRUE
    AckOnAdmit = FALSE
    FenceFromAdmit = FALSE
    MaxMoves = 0
    Planners = {}
    CasWrites = TRUE
    StageMove = FALSE
    LearnerVotes = FALSE
    Resends = FALSE
    SequencesInLog = TRUE
    Cancel = FALSE
    CancelCas = TRUE
    ReportBound = "acknowledged"
    AckChecksLease = TRUE
    AckOnResponse = TRUE
    AckByFollowers = FALSE
    FenceOnPromote = FALSE
    LabelOnReceipt = FALSE
    StartRecord = FALSE
    ReportFromAnswers = TRUE
    ReportFloor = TRUE
    PromoteDestination = FALSE
    Counters = FALSE
    CounterCatchUp = FALSE
    Ballots = FALSE
    Elections = 0
    FenceEveryChange = FALSE
    Suspicions = 0
    SetCheck = FALSE
    JointFence = FALSE
    Adopt = 0
    AdoptMatch = TRUE
    Swaps = 0
    PreVote = FALSE
    Wipes = 1
    StorageIds = TRUE
    Grow = FALSE
    Spares = {}
    ReplaceOnPromote = FALSE
    SeatHoldsCopy = TRUE
    CrashLoses <- Yes
    RotateOnCrash <- Yes
    CrashLeader <- Yes
    GiveUpOnCrash <- Yes
    Reclaims <- Yes
    ReclaimBlind <- Yes

SYMMETRY Symm

INVARIANTS
    TypeOK
    AtMostOneServing
    AckedSurvive
    AckedAgree
    NoTruncationBelowHwm
    NoStaleCommit
