\* The later design, not in the first version: store-liveness leases. The
\* group sends nothing (every member asleep); brokers exchange liveness
\* heartbeats, three in all. Lease 1 against support of 2, one restart, store
\* epochs up to 3. Every rule is on.
\*
\* Evidence: none, store-liveness leases are the later design and are not built.

