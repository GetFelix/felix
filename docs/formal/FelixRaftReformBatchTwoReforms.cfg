\* FelixRaftReformTwoReformsTrailingFloor.cfg with batch entries: each
\* election appends a blank entry that takes no offset, so offsets fall
\* below indexes. The record a written majority counted and a power cut
\* took is covered by the follower's reservation in offsets, and epoch 2
\* starts its offsets above it. The two members that start an epoch derive
\* the same offsets from its base.
\*
\* Evidence: none, batch entries are not built yet (#3359).

SPECIFICATION Spec

CONSTANTS
    Brokers = {a, b, c}
    InitBrokers = {a, b, c}
    None = None
    MaxEpoch = 2
    MaxTerm = 1
    MaxWrites = 2
    MaxChangeSteps = 0
    ChangeOut = None
    ChangeIn = None
    MaxPlace = 0
    MaxRotations = 0
    MaxRejoins = 0
    MaxRestarts = 0
    MaxMsgs = 0
    MaxPlans = 2
    MaxDead = 1
    DeadRuns = FALSE
    WaitPlaced = TRUE
    Floor = "trailing"
    ReformBeforeAll = FALSE
    EpochNotChecked = FALSE
    ReportNotPromise = FALSE
    PlanNotRechecked = FALSE
    RotatedNotWaited = FALSE
    RetireNotDurable = FALSE
    VoteByBroker = FALSE
    BaseNotHighest = FALSE
    NoCas = FALSE
    SoloPlacedTwo = FALSE
    StopNotRechecked = FALSE
    PlacedForgotten = FALSE
    FloorIndexOnly = FALSE
    CutToCommit = FALSE
    Kept = TRUE
    Alone = "off"
    Reserve = "every"
    MaxCuts = 2
    MaxReturns = 0
    Abandon = "off"
    Batch <- BatchOn

SYMMETRY Symm

INVARIANTS
    TypeOK
    BootIsRecorded
    PlacedIsRecorded
    OneLeaderPerTerm
    AckedSurvive
    StateMachineSafety
    OffsetNeverReused
    LossReported

PROPERTIES
    KeptLossBound
    ReservedCovers

ACTION_CONSTRAINT
    TwoReformsShape
