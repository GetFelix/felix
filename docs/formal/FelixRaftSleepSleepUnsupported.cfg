\* FelixRaftSleepLeaderDies without a rule the model needs: a follower accepts
\* a sleep request from a leader whose broker it no longer supports. The leader
\* dies after sending the requests, the followers withdraw support while still
\* awake, then the requests arrive and both sleep. Liveness has nothing left to
\* report, so only the audit elects a leader.
\* Evidence: none, sleep is not built yet (issue 2244). The design page does not
\* state this rule yet.

