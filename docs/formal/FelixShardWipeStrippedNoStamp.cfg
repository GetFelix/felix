\* FelixShardWipeStrippedRedial.cfg without the incarnation stamp: a follower
\* registered without an identity counts from any report, as before. The
\* leader acknowledges a record on itself and one follower and reports it,
\* the follower is wiped and registers again without an identity, the
\* leader's lease lapses, and placement promotes the empty follower from the
\* report taken before the wipe.
\*
\* Expected to violate AckedSurvive. FelixShardWipeStrippedRedial.cfg is the
\* fix.
\*
\* Evidence: this configuration REMOVES the incarnation check.
\* `an_unverified_follower_that_restarted_since_the_report_is_not_counted`
\*   -- drop the check and that test promotes the restarted follower, which
\*   is the trace TLC finds.

SPECIFICATION Spec

CONSTANTS
    Brokers = {a, b, c}
    L = 2
    Margin = 1
    Eps = 1
    Drift = 0
    MaxTime = 4
    MaxWrites = 1
    CheckAtCommit = TRUE
    Quorum = TRUE
    Promotion = "leader-report"
    ReportBeforeAck = TRUE
    Handoff = FALSE
    WaitForDrained = TRUE
    FenceAtClaim = TRUE
    AckOnAdmit = FALSE
    FenceFromAdmit = FALSE
    MaxMoves = 0
    Planners = {}
    CasWrites = TRUE
    StageMove = FALSE
    LearnerVotes = FALSE
    Resends = FALSE
    SequencesInLog = TRUE
    Cancel = FALSE
    CancelCas = TRUE
    ReportBound = "acknowledged"
    AckChecksLease = TRUE
    AckOnResponse = TRUE
    AckByFollowers = FALSE
    FenceOnPromote = FALSE
    LabelOnReceipt = FALSE
    StartRecord = FALSE
    ReportFromAnswers = TRUE
    ReportFloor = TRUE
    PromoteDestination = FALSE
    Counters = FALSE
    CounterCatchUp = FALSE
    Ballots = FALSE
    Elections = 0
    FenceEveryChange = FALSE
    Suspicions = 0
    SetCheck = FALSE
    JointFence = FALSE
    Adopt = 0
    AdoptMatch = TRUE
    Swaps = 0
    PreVote = FALSE
    Wipes = 1
    StorageIds = TRUE
    Grow = FALSE
    Spares = {}
    ReplaceOnPromote = FALSE
    SeatHoldsCopy = TRUE
    StripIds <- Yes
    RedialBeforeRegister <- Yes
    StampIncarnations <- No

SYMMETRY Symm

INVARIANTS
    TypeOK
    AtMostOneServing
    AckedSurvive
    AckedAgree
    NoTruncationBelowHwm
    NoStaleCommit
