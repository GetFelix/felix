\* FelixShardFencedLeaderCrash.cfg with each leader blind to its followers'
\* identities until it asks, its reports carrying the identity its own
\* promotion named each replica by (`NameByInheritance`, #1574), and a second
\* promotion on suspicion.
\*
\* Invariants as FelixShardFencedLeaderCrash.cfg.
\*
\* Too large to finish exhaustively: sampled by the nightly walks
\* (tla-walk.yml). FelixShardFencedLeaderCrashTwiceNamesByInheritance.cfg is
\* the inherited-name configuration checked exhaustively.
\*
\* Evidence: the implementation behaviours this configuration asserts.
\* `a_follower_not_reached_yet_is_named_by_the_promotions_identity` --
\*   Report: `inh`, only for a follower with no identity.
\* `a_member_the_report_never_reached_is_named_by_the_inherited_identity` --
\*   Named under NameByInheritance.
\* `a_leader_back_on_a_new_storage_identity_is_replaced` -- LeaderReplaced.

