\* FelixRaftReformTwoReformsTrailingFloor.cfg with batch entries of one or
\* two records: three brokers with kept copies, two power cuts and two
\* re-forms, one write in each of epochs 1 and 2. The second re-form starts
\* above every reservation it reads, the floor's offset and epoch 1's first
\* index and first offset, so no offset is given out with two records.
\*
\* Evidence: none, batch entries are not built yet (#3359).

SPECIFICATION Spec

CONSTANTS
    Brokers = {a, b, c}
    InitBrokers = {a, b, c}
    None = None
    MaxEpoch = 2
    MaxTerm = 1
    MaxWrites = 2
    MaxChangeSteps = 0
    ChangeOut = None
    ChangeIn = None
    MaxPlace = 0
    MaxRotations = 0
    MaxRejoins = 0
    MaxRestarts = 0
    MaxMsgs = 0
    MaxPlans = 2
    MaxDead = 1
    DeadRuns = FALSE
    WaitPlaced = TRUE
    Floor = "trailing"
    ReformBeforeAll = FALSE
    EpochNotChecked = FALSE
    ReportNotPromise = FALSE
    PlanNotRechecked = FALSE
    RotatedNotWaited = FALSE
    RetireNotDurable = FALSE
    VoteByBroker = FALSE
    BaseNotHighest = FALSE
    NoCas = FALSE
    SoloPlacedTwo = FALSE
    StopNotRechecked = FALSE
    PlacedForgotten = FALSE
    FloorIndexOnly = FALSE
    CutToCommit = FALSE
    Kept = TRUE
    Alone = "off"
    Reserve = "every"
    MaxCuts = 2
    MaxReturns = 0
    Abandon = "off"
    Batch <- BatchOn
    MaxBatch <- MaxBatchTwo

SYMMETRY Symm

INVARIANTS
    TypeOK
    BootIsRecorded
    PlacedIsRecorded
    OneLeaderPerTerm
    AckedSurvive
    StateMachineSafety
    OffsetNeverReused
    LossReported

PROPERTIES
    KeptLossBound
    ReservedCovers

ACTION_CONSTRAINT
    TwoReformsShape
