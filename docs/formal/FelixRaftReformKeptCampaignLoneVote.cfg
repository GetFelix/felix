\* FelixRaftReformKeptCampaign.cfg with every vote read counted toward T
\* (LoneVoteCounts). A follower that holds an acknowledged record
\* above its saved commit stands for election alone; its vote is the
\* highest key, so no copy is kept whole and the record is cut. Must
\* violate KeptLossBound.
\*
\* Evidence: none, this models a rule the implementation does not use.

SPECIFICATION Spec

CONSTANTS
    Campaigns <- CampaignsOn
    LoneVoteCounts <- LoneVoteCountsOn
    Brokers = {a, b, c}
    InitBrokers = {a, b, c}
    None = None
    MaxEpoch = 1
    MaxTerm = 2
    MaxWrites = 1
    MaxChangeSteps = 0
    ChangeOut = None
    ChangeIn = None
    MaxPlace = 0
    MaxRotations = 0
    MaxRejoins = 0
    MaxRestarts = 0
    MaxMsgs = 0
    MaxPlans = 1
    MaxDead = 0
    DeadRuns = FALSE
    WaitPlaced = TRUE
    Floor = "trailing"
    ReformBeforeAll = FALSE
    EpochNotChecked = FALSE
    ReportNotPromise = FALSE
    PlanNotRechecked = FALSE
    RotatedNotWaited = FALSE
    RetireNotDurable = FALSE
    VoteByBroker = FALSE
    BaseNotHighest = FALSE
    NoCas = FALSE
    SoloPlacedTwo = FALSE
    StopNotRechecked = FALSE
    PlacedForgotten = FALSE
    FloorIndexOnly = FALSE
    CutToCommit = FALSE
    Kept = TRUE
    Alone = "off"
    Reserve = "every"
    MaxCuts = 1
    MaxReturns = 0
    Abandon = "off"


SYMMETRY Symm

PROPERTIES
    KeptLossBound
