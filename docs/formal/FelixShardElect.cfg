\* Replicas elect themselves, with no control-plane step. Any replica may
\* stand at any time, at the generation after the one it promised, up to two
\* past the control plane's, so two can stand at the same generation. A
\* candidate persists its own ballot, fences a majority, takes the answer
\* furthest ahead, and opens with a start record, as a promoted leader does.
\* With `Ballots` a replica answers a fence or a batch at a generation it
\* already promised only from the leader it promised, so one leader opens per
\* generation, and every acknowledged record survives every election.
\*
\* The first leader starts with its set's promise, as an elected one would.
\* Time does not move (`MaxTime = 0`): nothing on this path reads a clock, and
\* the control plane never finds a lease lapsed, so it never promotes.
\* FelixShardElectNoBallot.cfg is this without the ballot.
\*
\* Evidence: `accept_generation` in felix-storage's disk_log.rs refuses a
\* second leader at an accepted generation (`a_second_leader_at_an_accepted_generation_is_refused`),
\* and `accept_sender` and `ReplicaHandler::fence` in replica.rs apply it to
\* every batch and fence (`a_fence_from_a_second_leader_at_the_same_generation_is_refused`).

