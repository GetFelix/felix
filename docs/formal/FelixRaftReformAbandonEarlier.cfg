\* FelixRaftReformAbandon.cfg with three writes and every start held at or
\* above every earlier epoch's first index, as raft_copy/vouch.rs plans it
\* and the control plane's start_reformed_epoch requires (#3410). The abandon
\* already starts above them (AbandonFirst).
\* Evidence: `the_first_index_never_goes_below_an_earlier_epochs` and
\* `a_re_form_write_refuses_what_it_cannot_vouch_for`.

SPECIFICATION Spec

CONSTANTS
    Brokers = {a, b}
    InitBrokers = {a}
    None = None
    MaxEpoch = 2
    MaxTerm = 2
    MaxWrites = 3
    MaxChangeSteps = 0
    ChangeOut = None
    ChangeIn = None
    MaxPlace = 0
    MaxRotations = 1
    MaxRejoins = 0
    MaxRestarts = 0
    MaxMsgs = 0
    MaxPlans = 1
    MaxDead = 1
    DeadRuns = FALSE
    WaitPlaced = TRUE
    Floor = "exact"
    ReformBeforeAll = FALSE
    EpochNotChecked = FALSE
    ReportNotPromise = FALSE
    PlanNotRechecked = FALSE
    RotatedNotWaited = FALSE
    RetireNotDurable = FALSE
    VoteByBroker = FALSE
    BaseNotHighest = FALSE
    NoCas = FALSE
    SoloPlacedTwo = FALSE
    StopNotRechecked = FALSE
    PlacedForgotten = FALSE
    FloorIndexOnly = FALSE
    CutToCommit = FALSE
    Kept = FALSE
    Alone = "off"
    Reserve = "none"
    MaxCuts = 0
    MaxReturns = 1
    Abandon = "on"
    EarlierBound <- EarlierBoundOn

SYMMETRY Symm

INVARIANTS
    TypeOK
    BootIsRecorded
    PlacedIsRecorded
    OneLeaderPerTerm
    AbandonedNotLed
    AckedSurvive
    StateMachineSafety
    OffsetNeverReused
