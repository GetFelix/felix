\* The control plane naming its leader again after an election it recorded
\* and did not adopt (`Renames`, CpRename). FelixShardElectSwap.cfg with one
\* write and generation 3 in reach (`Adopt = 3`): after a cut-over that
\* changes the set, a replica that never heard of the change stands on the
\* old set and opens above the control plane's generation. The control plane
\* records that generation only, since the set is not the pending one, and
\* still names the destination, which cannot serve it. Named again one
\* generation up, it fences on the pending set and jointly on the old one,
\* and the elected leader is deposed. The leader is named again too when it
\* took the generation and its fence is refused, on either set of a joint
\* fence. FelixShardElectRenameDue.cfg and
\* FelixShardElectRenameFencingDue.cfg show both are reached;
\* FelixShardWalkElectRenameUnfenced.cfg opens the renamed leader without
\* its fence. `QuietView` merges states that differ only in what no step
\* reads again.
\*
\* Too big for one run, so it is checked in pieces split at the cut-over
\* (FelixShardElectRename{Keep,Drop}{0,1}{,Stood...}.cfg). The pieces where
\* only the destination had stood run nightly: the cut-over overwrites
\* everything that stand wrote, so they reach the same states as the pieces
\* where nobody stood.
\*
\* Evidence: `a_refusal_at_the_elected_generation_names_the_leader_again_above_it`
\*   and the other tests in services/felix-controlplane-service/src/cluster/
\*   placement/tests/refused.rs (the step, and when it is skipped);
\*   `a_promised_generation_is_recorded_as_refused`
\*   (services/felix-broker-service/src/shards/lifecycle/tests/refused.rs)
\*   and `a_fence_a_majority_promised_away_is_refused` and
\*   `a_promise_away_with_the_other_replica_down_is_refused`
\*   (crates/server/felix-replication/src/promotion/tests.rs) for the ways
\*   the leader cannot serve; `a_promise_away_beside_another_copy_stays_pending`
\*   (crates/server/felix-replication/src/promotion/tests/identity.rs) for
\*   when a promise away is not one.

