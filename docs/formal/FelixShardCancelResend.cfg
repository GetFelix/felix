\* A cancelled move with a producer re-sending through it: the leader is
\* fenced, the move is cancelled, and a write it already holds is sent again.
\* The retaken leader kept its log, so it answers the re-send from there, and
\* a write it had queued inside the fence still lands once. Otherwise as
\* FelixShardCancel.cfg: acknowledged on admission, no lease lapse, a second
\* move may follow.
\* Evidence: the implementation behaviours this configuration asserts.
\* `cancelling_a_fenced_move_hands_the_shard_back_to_its_leader` -- Retake:
\*   the fenced leader serves again at a new generation.
\* `a_restarted_leader_answers_a_re_send_from_its_log` -- SequencesInLog: a
\*   broker opening its log at a new generation knows what it holds.
\* `a_re_sent_batch_lands_once` -- Resend: a batch already held is answered
\*   without appending.
\* Planners = {}: every decision reads and writes in one step, so CasWrites
\*   has nothing to compare.

SPECIFICATION Spec

CONSTANTS
    Brokers = {a, b, c}
    L = 4
    Margin = 2
    Eps = 1
    Drift = 0
    MaxTime = 2
    MaxWrites = 2
    CheckAtCommit = TRUE
    Quorum = FALSE
    Promotion = "leader-report"
    ReportBeforeAck = TRUE
    Handoff = TRUE
    WaitForDrained = TRUE
    FenceAtClaim = TRUE
    AckOnAdmit = TRUE
    FenceFromAdmit = TRUE
    MaxMoves = 2
    Planners = {}
    CasWrites = TRUE
    StageMove = FALSE
    LearnerVotes = FALSE
    Cancel = TRUE
    CancelCas = TRUE
    ReportBound = "acknowledged"
    AckChecksLease = TRUE
    AckOnResponse = FALSE
    AckByFollowers = FALSE
    FenceOnPromote = FALSE
    LabelOnReceipt = FALSE
    StartRecord = FALSE
    ReportFromAnswers = FALSE
    ReportFloor = FALSE
    Spares = {}
    ReplaceOnPromote = FALSE
    SeatHoldsCopy = TRUE
    Grow = FALSE
    PromoteDestination = FALSE
    Counters = FALSE
    CounterCatchUp = FALSE
    Ballots = FALSE
    Elections = 0
    FenceEveryChange = FALSE
    Suspicions = 0
