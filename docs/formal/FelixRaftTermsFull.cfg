\* FelixRaftTerms.cfg with one client write. About an hour, so a pull request
\* checks it only when FelixRaft.tla or this file changes.
\*
\* Evidence: the raft_log adapter tests in felix-storage:
\*   `entries_read_back_with_their_term_and_kind`,
\*   `a_cut_tail_never_returns_under_a_committed_id`,
\*   `a_committed_id_never_reads_back_past_the_log`.

SPECIFICATION Spec

CONSTANTS
    Servers = {a, b, c}
    Nobody = Nobody
    MaxTerm = 3
    MaxWrites = 1
    MaxMembers = 0
    MaxCrashes = 0
    MaxSnapshots = 0
    Consumer = FALSE
    AckBeforeFlush = FALSE
    VoteNotDurable = FALSE
    LeaderResumes = FALSE
    TornTailKept = FALSE
    TruncateNotDurable = FALSE
    RecoveredTailUnsynced = FALSE
    SaveCommittedUnflushed = FALSE
    PurgeBeforeSnapshot = FALSE
    SnapshotTwoRenames = FALSE
    CommitPriorTerm = FALSE
    DeliverUncommitted = FALSE
    SkipsNotCounted = FALSE

SYMMETRY Symm

INVARIANTS
    TypeOK
    OneLeaderPerTerm
    LogMatching
    TermsMonotone
    LeaderCompleteness
    StateMachineSafety
    AppliedAgree
    AppliedInLog
    AckedSurvive
    PurgedCoveredBySnapshot
    OffsetsDense
    OffsetNeverReused
    DeliveredInOrder
    QuiescentServed

PROPERTIES
    VoteNeverLowers
