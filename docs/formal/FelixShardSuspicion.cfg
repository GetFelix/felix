\* Failover on the followers' word: FelixShardFencedAck.cfg, with placement
\* free to promote at the first generation before the lease lapses, on any
\* read, as a failure detector that is sometimes wrong would let it. The old
\* leader may be alive, serving and renewing its lease when it happens.
\*
\* Time does not move (`MaxTime = 0`), so no lease ever lapses and every
\* promotion is one the lease alone would not have allowed. Nothing on this
\* path reads a clock: admission, commit and acknowledgement go by the
\* followers' answers, and the promotion by the suspicion. What stopping time
\* gives up is the old leader stepping down on a lapse of its own, which only
\* takes it out of the run sooner. Promotion reads the leader's report, as
\* placement does.
\*
\* Checks what FelixShardFencedAck.cfg checks: the old leader may go on
\* writing, and finds no majority to acknowledge on once its successor has
\* fenced one, and the successor holds every acknowledged record from the
\* moment it opens. FelixShardSuspicionLease.cfg is the same promotion where
\* acknowledgements and reads still rest on the lease, and fails.
\*
\* Evidence: `deposed_by_followers` in placement/plan.rs promotes a live
\*   leader's reported follower once a majority of the set names the leader,
\*   keeping the set; `with_suspicions` acts only with both fleet features.
\* `a_leader_a_majority_cannot_reach_is_replaced_while_it_heartbeats` --
\*   Promote while the old leader is live.
\* `a_suspicion_counts_only_with_both_features` -- only on the follower-acked
\*   path (`AckByFollowers`).

SPECIFICATION Spec

