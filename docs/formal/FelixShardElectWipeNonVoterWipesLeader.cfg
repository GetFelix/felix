\* FelixShardElectWipeNonVoter.cfg where the wipe can hit a leader or a
\* candidate as well as a follower (`WipeLeads`): it restarts leading nothing
\* and as a non-voter. With no time the control plane gets a new leader only by
\* adopting an elected one, which it then re-admits the wiped one through.
\* All the safety invariants hold.
\*
\* Evidence: none yet; the code lands in #1009 S8 (non-voting rejoin), which must cite tests here.

