\* FelixRaftReformAbandonEarlier.cfg without the earlier-epochs bound. a
\* writes two records that do not commit, the group re-forms with both in
\* the base and serves them, a's copy rotates to just the first, and the
\* group starts by itself from it at the floor. The next write gets the
\* index the second record was served at (#3410).
\* Evidence: none, this pins why a start is held above earlier epochs.

SPECIFICATION Spec

