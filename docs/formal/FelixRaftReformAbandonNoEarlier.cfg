    Brokers = {a, b}
    InitBrokers = {a}
    None = None
    MaxEpoch = 2
    MaxTerm = 2
    MaxWrites = 3
    MaxChangeSteps = 0
    ChangeOut = None
    ChangeIn = None
    MaxPlace = 0
    MaxRotations = 1
    MaxRejoins = 0
    MaxRestarts = 0
    MaxMsgs = 0
    MaxPlans = 1
    MaxDead = 1
    DeadRuns = FALSE
    WaitPlaced = TRUE
    Floor = "exact"
    ReformBeforeAll = FALSE
    EpochNotChecked = FALSE
    ReportNotPromise = FALSE
    PlanNotRechecked = FALSE
    RotatedNotWaited = FALSE
    RetireNotDurable = FALSE
    VoteByBroker = FALSE
    BaseNotHighest = FALSE
    NoCas = FALSE
    SoloPlacedTwo = FALSE
    StopNotRechecked = FALSE
    PlacedForgotten = FALSE
    FloorIndexOnly = FALSE
    CutToCommit = FALSE
    Kept = FALSE
    Alone = "off"
    Reserve = "none"
    MaxCuts = 0
    MaxReturns = 1
    Abandon = "on"

SYMMETRY Symm

INVARIANTS
    TypeOK
