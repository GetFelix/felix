\* FelixShardElectWipeNonVoterSetless.cfg with re-admission judged on the
\* cache log alone (`ReadmitChecksCounters` off). TLC is expected to find an
\* acknowledged counter update the new leader does not hold
\* (CountersHeldByLeader): the copy is re-admitted once its cache log holds
\* the start record, its counter log still behind, and the next leader's
\* counter fence counts it. CountersOnMajority is left out, as it breaks at
\* the re-admission itself.
\*
\* Evidence: `a_copy_is_readmitted_only_once_its_counter_log_caught_up` in
\* crates/server/felix-replication/src/replica/tests/non_voting.rs.

