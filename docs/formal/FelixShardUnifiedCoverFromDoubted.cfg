SPECIFICATION Spec

CONSTANTS
    Nodes = {a, b, c}
    First = a
    NoNode = NoNode
    MaxGen = 3
    MaxWrites = 1
    MaxStarts = 2
    MaxUnclean = 1
    MaxWipes = 0
    MaxRestores = 0
    MaxRetries = 0
    SetChoices = {{a, b, c}}
