\* #1335 on an election: a wiped copy is counted as the copy it replaced, as
\* naming a member by its registered storage id would. Expected to violate
\* OneLeaderPerGeneration.
\*
\* Evidence: none, this models a shortcut the rule does not take, to show why.

SPECIFICATION Spec

CONSTANTS
    Nodes = {a, b, c}
    First = a
    NoNode = NoNode
    MaxGen = 3
    MaxWrites = 1
    MaxStarts = 2
    MaxUnclean = 0
    MaxWipes = 1
    MaxRestores = 0
    MaxRetries = 0
    SetChoices = {{a, b, c}}
    OldPeers = {}
    NamesByRegistration <- Yes

INVARIANTS
    OneLeaderPerGeneration
    AckedHeldByLeader
