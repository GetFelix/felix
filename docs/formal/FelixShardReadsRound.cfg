\* Reads without the lease, as the broker serves a `Quorum` read once the
\* fleet finalized `lease_free_reads`: the value is taken, then a round of
\* fences at the leader's own generation must be answered by a majority,
\* the leader counting itself only while its log has taken no newer fence.
\* Writes as in FelixShardFencedAck.cfg: follower acks, the promotion fence,
\* the start record, no lease anywhere on the write's path.
\*
\* The clocks are given everything: no margin on either side of the lease
\* and drifting clocks, so a deposed leader goes on believing it leads,
\* and serving, until it hears of its successor. What keeps its reads
\* honest is that its successor fenced a majority before it acknowledged
\* anything, and that majority shares a replica with any the round reaches.
\* FelixShardReadsNoRound.cfg is this without the round, and
\* FelixShardReadsLease.cfg with the lease in its place; TLC finds the stale
\* read in both.
\*
\* Bounds: one write, one read, time to 2 with L = 2, so one promotion.
\*
\* Evidence: `ReadIndex` (leadership.rs) and its tests;
\* `await_cache_quorum` and `await_counter_quorum` confirm a read after its
\* value (quorum.rs).

SPECIFICATION ReadsSpec

CONSTANTS
    Brokers = {a, b, c}
    L = 2
    Margin = 0
    Eps = 0
    Drift = 1
    MaxTime = 2
    MaxWrites = 1
    CheckAtCommit = FALSE
    Quorum = TRUE
    Promotion = "log-order"
    ReportBeforeAck = FALSE
    Handoff = FALSE
    WaitForDrained = TRUE
    FenceAtClaim = TRUE
    AckOnAdmit = FALSE
    FenceFromAdmit = FALSE
    MaxMoves = 0
    Planners = {}
    CasWrites = TRUE
    StageMove = FALSE
    LearnerVotes = FALSE
    Resends = FALSE
    SequencesInLog = TRUE
    Cancel = FALSE
    CancelCas = TRUE
    ReportBound = "acknowledged"
    AckChecksLease = FALSE
    AckOnResponse = FALSE
    AckByFollowers = TRUE
    FenceOnPromote = TRUE
    LabelOnReceipt = FALSE
    StartRecord = TRUE
    ReportFromAnswers = FALSE
    ReportFloor = FALSE
    Spares = {}
    ReplaceOnPromote = FALSE
    SeatHoldsCopy = TRUE
    Grow = FALSE
    PromoteDestination = FALSE
    Counters = FALSE
    CounterCatchUp = FALSE
    Ballots = FALSE
    Elections = 0
    ReadConfirm = "round"
    MaxReads = 1

SYMMETRY Symm

INVARIANTS
    ReadsTypeOK
    NoStaleRead
    AckedHeldByLeader
    AckedOnMajority
