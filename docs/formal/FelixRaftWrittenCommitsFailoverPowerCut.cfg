\* FelixRaftWrittenCommitsPowerCut.cfg at failover bounds: two terms, one
\* write, one process crash and two power cuts, each of which rotates the cut
\* broker's copy. Reserve is off: with no re-form, a reservation only holds
\* back a count or a report, so without it TLC checks more behaviours, not
\* fewer, in a state space small enough to finish.
\*
\* With MaxPowerCuts = 2 and CutRotates, two cuts leave one voter of three:
\* no leader is elected after that, so the acked invariants check nothing
\* past the second rotation.
\*
\* Evidence: none, this models a proposal that is not built.

