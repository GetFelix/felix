\* FelixRaftPlacementSameIdFive.cfg with the metadata group's rule: leaders
\* count a withheld member, and it answers no leader below the floor its
\* peers gave it. The candidate that holds the forgotten vote gives its
\* term, so the member never follows the older leader and never votes in
\* that term again.
\*
\* Evidence: `a_wiped_member_is_counted_by_no_leader_until_every_peer_reports_its_term`
\*   -- the wiped member answers no leader before every peer gives its term, and none
\*   below the highest. `the_floor_waits_for_every_member_and_takes_the_highest_term`
\*   -- the floor is the highest term, and a member that gives none leaves it unknown.

SPECIFICATION Spec

CONSTANTS
    Brokers = {a, b, c, d, e}
    Nobody = Nobody
    InitBrokers = {a, b, c, d, e}
    MaxTerm = 2
    MaxWrites = 0
    MaxCalls = 0
    MaxTargets = 0
    MaxWipes = 1
    MinVoters = 3
    Rotate = FALSE
    Retain = TRUE
    StaleTargets = FALSE
    SkipJoint = FALSE
    NoWithhold = FALSE
    WithheldCounts = TRUE
    Floor = TRUE
    FloorWaiver = FALSE
    AnswerAnyId = FALSE
    DeleteOnTarget = FALSE
    PlaceDoomed = FALSE
    Forming = FALSE
    FormRecord = FALSE
    FormReached = FALSE
    FirstBoot = FALSE
    FormMajority = FALSE
    FormAlias = FALSE
    Waived = {}
    Absent = {}
    EarlyWipes = TRUE
    Direct = FALSE
    NoBarrier = FALSE
    NoVersion = FALSE
    NoStamp = FALSE
    SelfRemove = FALSE
    DoomAnyVersion = FALSE
    MaxRewinds = 0
    RewindSameInc = FALSE
    NoIncAck = FALSE
    LogWipes = FALSE
    WaiverExcusesAnswer = FALSE
    WaiverAnyNumber = FALSE
    DoomOnCommitted = FALSE
    PlacedLeaders = FALSE

SYMMETRY Symm

INVARIANTS
    TypeOK
    OneLeaderPerTerm
