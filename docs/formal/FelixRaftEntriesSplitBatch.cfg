\* FelixRaftEntries.cfg with a batch appended as one entry per record, as
\* the code does today, and no crash. The first entry of a two-record batch
\* commits before the second: a committed log holds a proper prefix of it.
\*
\* Evidence: none, this pins the reason a batch is one entry.

SPECIFICATION Spec

CONSTANTS
    Servers = {a, b, c}
    Nobody = Nobody
    MaxTerm = 2
    MaxWrites = 1
    MaxMembers = 0
    MaxCrashes = 0
    MaxSnapshots = 0
    Consumer = TRUE
    AckBeforeFlush = FALSE
    VoteNotDurable = FALSE
    LeaderResumes = FALSE
    TornTailKept = FALSE
    TruncateNotDurable = FALSE
    RecoveredTailUnsynced = FALSE
    SaveCommittedUnflushed = FALSE
    PurgeBeforeSnapshot = FALSE
    SnapshotTwoRenames = FALSE
    CommitPriorTerm = FALSE
    DeliverUncommitted = FALSE
    SkipsNotCounted = FALSE
    ZeroTakesOffset <- ZeroTakesOffsetOff
    MaxBatch <- MaxBatchTwo
    SplitBatch <- Yes
SYMMETRY Symm

INVARIANTS
    TypeOK
    OneLeaderPerTerm
    LogMatching
    TermsMonotone
    LeaderCompleteness
    StateMachineSafety
    AppliedAgree
    AppliedInLog
    AckedSurvive
    PurgedCoveredBySnapshot
    OffsetsDense
    OffsetNeverReused
    BatchWhole
    DeliveredInOrder
    QuiescentServed
    AckedDelivered

PROPERTIES
    VoteNeverLowers
