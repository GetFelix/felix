\* The group goes from {a, b, c} to {a, b, d} through a joint
\* configuration while the control plane's record may still say {a, b, c}.
\* One directory may be lost or restored to any prefix, which covers a
\* relaxed fsync crash. A report that names d makes the control plane wait
\* for d. No client write: the acknowledged entries are the membership
\* entries. 23.2M distinct states, 40 minutes in CI.
\* 
\* It passes on two rules the design page does not have yet (issue 2304): a
\* rotated voter still sends a retire report, and a new copy announces itself
\* so that its old report is dropped. It does not show the design as written
\* is safe.
\* It is also one directory short of issue 2311: with two lost,
\* FelixRaftReformStaleMembershipTwoRotated.cfg violates AckedSurvive.
\* 
\* Evidence: none, re-forming is not built yet (track 4 of issue 2244).

