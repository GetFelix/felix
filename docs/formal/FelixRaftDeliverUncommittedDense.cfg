\* FelixRaft.cfg with one rule dropped. A subscriber is given entries above
\* the commit index, with two client writes. A deposed leader delivers a
\* record the next leader writes a blank entry over. The next leader counts
\* the offsets below its own record from its own log, and the subscriber's
\* drop check fires: the count covers the offset the subscriber already holds
\* a record at.
\*
\* Evidence: none, this models an alternative the implementation does not use.

