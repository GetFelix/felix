    Forger = TRUE
    NoFirstWins = FALSE
    ReleaseOnTimeout = FALSE
    TrimUndone = TRUE
    NoFence = FALSE
    WriteCheckEarly = FALSE
    ApplyWithoutLock = FALSE
    NoTokenCheck = FALSE

INVARIANTS
    Atomicity
