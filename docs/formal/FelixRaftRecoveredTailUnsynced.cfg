\* FelixRaft.cfg with one rule dropped. Entries found at startup are reported
\* as flushed without an fsync. openraft takes everything `get_log_state`
\* returns at startup as durable, so a record that survived a process crash
\* in the page cache is acknowledged while a power loss can still take it.
\*
\* Evidence: none, this models an alternative the implementation does not use.

SPECIFICATION Spec

CONSTANTS
    Servers = {a, b, c}
    Nobody = Nobody
    MaxTerm = 2
    MaxWrites = 1
    MaxMembers = 0
    MaxCrashes = 1
    MaxSnapshots = 0
    Consumer = FALSE
    AckBeforeFlush = FALSE
    VoteNotDurable = FALSE
    LeaderResumes = FALSE
    TornTailKept = FALSE
    TruncateNotDurable = FALSE
    RecoveredTailUnsynced = TRUE
    SaveCommittedUnflushed = FALSE
    PurgeBeforeSnapshot = FALSE
    SnapshotTwoRenames = FALSE
    CommitPriorTerm = FALSE
    DeliverUncommitted = FALSE
    SkipsNotCounted = FALSE

SYMMETRY Symm

INVARIANTS
    AckedSurvive
