\* FelixShardMoveGiveUp.cfg at replication factor 2, with the set one above
\* it from a staged destination, and the fence timeout's retake dropping the
\* destination as `Abandon` and `FenceTimedOut` once did
\* (`DropsDestination`). TLC finds a record acknowledged on the leader and
\* the destination gone (AckedHeldByLeader): the leader crashes and loses it,
\* the retake drops the destination, the probe finds the one follower left
\* behind the leader, and the leader is reclaimed without it.
\*
\* The dropped set can also stall, with the follower named unable to fence
\* the given-up leader, so deadlock is not checked.
\*
\* Evidence: none, this models the rule the implementation had before the fix.

SPECIFICATION Spec

CONSTANTS
    Nodes = {a, b, c}
    First = a
    NoNode = NoNode
    MaxGen = 5
    MaxWrites = 2
    MaxCrashes = 1
    MaxMoves = 1
    Replication <- Two
    DropsDestination <- Yes

INVARIANTS
    OneLeaderPerGeneration
    AckedHeldByLeader
    AtMostOneServing

CHECK_DEADLOCK FALSE
