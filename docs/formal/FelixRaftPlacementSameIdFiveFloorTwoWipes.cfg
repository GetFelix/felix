\* FelixRaftPlacementSameIdFiveFloor.cfg with a write and two lost
\* volumes, the most five members survive. A wiped member that asks the
\* other wiped one for its term is told it is withheld and does not wait
\* for a term: the terms the asking member promised are held by the rest
\* of the quorum it promised them with.
\*
\* Evidence: `two_wiped_members_of_five_do_not_wait_on_each_other`,
\*   `a_member_that_says_it_is_withheld_answers_with_no_term`.

SPECIFICATION Spec

CONSTANTS
    Brokers = {a, b, c, d, e}
    Nobody = Nobody
    InitBrokers = {a, b, c, d, e}
    MaxTerm = 2
    MaxWrites = 1
    MaxCalls = 0
    MaxTargets = 0
    MaxWipes = 2
    MinVoters = 3
    Rotate = FALSE
    Retain = TRUE
    StaleTargets = FALSE
    SkipJoint = FALSE
    NoWithhold = FALSE
    WithheldCounts = TRUE
    Floor = TRUE
    FloorWaiver = FALSE
    AnswerAnyId = FALSE
    DeleteOnTarget = FALSE
    PlaceDoomed = FALSE
    Forming = FALSE
    FormRecord = FALSE
    FormReached = FALSE
    FirstBoot = FALSE
    FormMajority = FALSE
    FormAlias = FALSE
    Waived = {}
    Absent = {}
    EarlyWipes = TRUE
    Direct = FALSE
    NoBarrier = FALSE
    NoVersion = FALSE
    NoStamp = FALSE
    SelfRemove = FALSE
    DoomAnyVersion = FALSE
    MaxRewinds = 0
    RewindSameInc = FALSE
    NoIncAck = FALSE
    LogWipes = FALSE
    WaiverExcusesAnswer = FALSE
    WaiverAnyNumber = FALSE
    DoomOnCommitted = FALSE
    PlacedLeaders = FALSE

SYMMETRY Symm

INVARIANTS
    TypeOK
    OneLeaderPerTerm
    AckedSurvive
