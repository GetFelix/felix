\* FelixRaftElectLiveFaults.cfg with nine terms and TermsLeft: no member ever
\* reaches the ninth, so the bound never holds a step back and the verdict
\* for two faults holds with terms unbounded.
\* Evidence: the tests FelixRaftElectLive.cfg names,
\*   `members_told_together_elect_one_leader`,
\*   `a_leader_that_loses_its_appends_does_not_stall_the_next_election`.

SPECIFICATION LiveSpec

CONSTANTS
    Servers = {a, b, c}
    Nobody = Nobody
    MaxTerm = 9
    MaxFaults = 2
    Splits = 1
    Staggered = TRUE

INVARIANTS
    TypeOK
    OneLeaderPerTerm
    TermsLeft

PROPERTIES
    ElectionSettles
    EventuallyServes
