\* Without the hold: a broker with a stale view forms the old set while
\* another forms the new one, and both win term 1 (#2794).
\* Evidence: none. It models the code before the hold, to show why.
CONSTANTS
    Brokers = {1, 2, 3, 4}
    Sets = {{1, 2, 3}, {2, 3, 4}}
    Hold = FALSE
    PerEpoch = TRUE
    MaxEpoch = 0
INIT Init
NEXT Next
INVARIANTS TypeOK OneGroup
