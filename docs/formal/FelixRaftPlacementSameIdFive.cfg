\* FelixRaftPlacementSameId.cfg with five members, two terms and no write.
\* Not counting a withheld member is not enough here. A candidate holds the
\* wiped member's vote and is one vote short. The member catches up with the
\* older leader, votes again, and grants a second vote in the term it forgot.
\* Pinned as an expected violation with issue 2365.
\*
\* Evidence: none, the rule that no leader counts a withheld member is not built yet, and this shows it is not enough (issue 2365).

