\* Five members, two terms and no write, with the rule the metadata group
\* does not use: a leader does not count a withheld member, and there is no
\* floor. A candidate holds the wiped member's vote and is one vote short.
\* The member catches up with the older leader, votes again, and grants a
\* second vote in the term it forgot. Kept to show why the floor takes every
\* member's term (FelixRaftPlacementSameIdFiveFloor.cfg).
\*
\* Evidence: none, this is a rule the code does not have.

