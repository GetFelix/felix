\* Five members on a first start, with the floor the metadata group has.
\* Members form one at a time, so some are still withheld, empty and late
\* when a formed member loses its volume. Each withheld member counts the
\* others' word that they are withheld and takes its floor from the ones
\* that vote.
\*
\* Evidence: `two_wiped_members_of_five_do_not_wait_on_each_other`,
\*   `a_member_that_says_it_is_withheld_answers_with_no_term`.

