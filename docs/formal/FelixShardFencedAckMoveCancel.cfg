\* FelixShardFencedAckMove.cfg with the operator's cancel on: the fenced
\* leader takes the shard back at a new generation, without the promotion
\* fence, keeping what its fence let in. Unfinished past 54M distinct states
\* after 25 min on a four-core CI runner: run by hand, not in
\* scripts/check_tla.sh; FelixShardFencedAckMoveCancelShort.cfg is the
\* CI-sized run.
\*
\* Evidence: as FelixShardFencedAckMove.cfg, and
\* `cancelling_a_fenced_move_loses_no_acknowledged_write`.

