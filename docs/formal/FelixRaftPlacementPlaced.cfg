\* FelixRaftPlacement.cfg with leaders that follow placement and no target
\* change: a settled leader with an entry of its term committed may hand its
\* leadership to any caught-up voter, and the transfer may land in a second
\* term. Every safety invariant holds. With the target change as well the
\* space passed 4.5M distinct states in 4 minutes and was still growing.
\*
\* Evidence: `a_placement_change_moves_the_leader`, which runs `placed_step` (crates/server/felix-replication/src/raft/group/placed.rs).

