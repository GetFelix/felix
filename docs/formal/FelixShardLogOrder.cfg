\* The same model with promotion by log order: the live replica whose
\* (last generation, length) is greatest, which is Raft's election restriction.
\* Evidence: none. Promotion = "log-order" is Raft's election restriction, an
\* alternative the implementation does not use -- it promotes from the leader's
\* report, preferring the replica furthest ahead. Kept because it is the rule to
\* compare against if the reporting direction is ever revisited (#527), and
\* because a configuration that passes under a different rule shows the other
\* invariants do not depend on which rule is chosen.
\* Planners = {}: every decision reads and writes in one step, so CasWrites
\*   has nothing to compare. The StalePlanner and StalePromotion
\*   configurations are where a read is held across another write.

SPECIFICATION Spec

CONSTANTS
    Brokers = {a, b, c}
    L = 4
    Margin = 2
    Eps = 1
    Drift = 0
    MaxTime = 7
    MaxWrites = 2
    CheckAtCommit = TRUE
    Quorum = TRUE
    Promotion = "log-order"
    ReportBeforeAck = TRUE
    Handoff = FALSE
    WaitForDrained = TRUE
    FenceAtClaim = TRUE
    AckOnAdmit = FALSE
    FenceFromAdmit = FALSE
    MaxMoves = 0
    Planners = {}
    CasWrites = TRUE
    StageMove = FALSE
    LearnerVotes = FALSE
    Resends = FALSE
    SequencesInLog = TRUE
    Cancel = FALSE
    CancelCas = TRUE
    ReportBound = "acknowledged"
    AckChecksLease = TRUE
    AckOnResponse = FALSE
    AckByFollowers = FALSE
    FenceOnPromote = FALSE
    LabelOnReceipt = FALSE
    StartRecord = FALSE

SYMMETRY Symm

INVARIANTS
    TypeOK
    AtMostOneServing
    AckedSurvive
    AckedAgree
    NoTruncationBelowHwm
    NoStaleCommit
    AckedOnMajority
