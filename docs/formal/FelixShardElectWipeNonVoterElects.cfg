\* A witness, not a safety check: under FelixShardElectWipeNonVoter.cfg's
\* rules TLC finds a leader opened above generation 1 on a majority without
\* the wiped replica while it is still a non-voter (NoLeaderBesideNonVoter).
\* So with a majority not wiped the shard can still get a leader. That it
\* eventually does needs fairness the model does not have.
\*
\* Evidence: none yet, nothing in the code elects a leader.

