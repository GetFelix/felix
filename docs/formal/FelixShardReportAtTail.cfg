\* The design with a follower reported caught up only when it holds the
\* leader's whole log, under Quorum as under Leader. A publish landing between
\* shipping and the report leaves every follower one record short of it, so
\* the report names nobody while a majority holds every acknowledged record,
\* and a leader that dies then cannot be replaced.
\*
\* Expected to violate QuorumReportNamesASuccessor.
\* Evidence: this configuration REMOVES a bound the implementation has.
\* `a_quorum_follower_holding_every_acknowledged_record_can_lead` -- the broker
\*   measures a Quorum follower against the mark, not the tail.
\* Planners = {}: every decision reads and writes in one step, so CasWrites
\*   has nothing to compare. The StalePlanner and StalePromotion
\*   configurations are where a read is held across another write.

SPECIFICATION Spec

CONSTANTS
    Brokers = {a, b, c}
    L = 4
    Margin = 2
    Eps = 1
    Drift = 0
    MaxTime = 7
    MaxWrites = 2
    CheckAtCommit = TRUE
    Quorum = TRUE
    Promotion = "leader-report"
    ReportBeforeAck = TRUE
    Handoff = FALSE
    WaitForDrained = TRUE
    FenceAtClaim = TRUE
    AckOnAdmit = FALSE
    FenceFromAdmit = FALSE
    MaxMoves = 0
    Planners = {}
    CasWrites = TRUE
    StageMove = FALSE
    LearnerVotes = FALSE
    Resends = FALSE
    SequencesInLog = TRUE
    Cancel = FALSE
    CancelCas = TRUE
    ReportBound = "tail"
    AckChecksLease = TRUE
    AckOnResponse = FALSE

SYMMETRY Symm

INVARIANTS
    TypeOK
    AtMostOneServing
    AckedSurvive
    AckedAgree
    NoTruncationBelowHwm
    NoStaleCommit
    AckedOnMajority
    QuorumReportNamesASuccessor
