\* FelixRaftReformSnapshotMembership.cfg with the re-form reading
\* memberships only from log entries (SnapshotNotRead). A purge drops the
\* entries of {a, b, d} from the copy that holds them, the voter set is then
\* only in that copy's snapshot metadata, and a lost majority of it (b
\* restored, d dead) leaves the plan unmarked. Violates OffsetNeverReused.
\*
\* Evidence: none, this models the defect #2763 fixed in
\* crates/server/felix-storage/src/raft_copy/report.rs.

SPECIFICATION Spec

CONSTANTS
    MaxPurges <- OnePurge
    OrderedNotRead <- On
    SnapshotNotRead <- On
    Brokers = {a, b, c, d}
    InitBrokers = {a, b, c}
    None = None
    MaxEpoch = 1
    MaxTerm = 2
    MaxWrites = 2
    MaxChangeSteps = 2
    ChangeOut = c
    ChangeIn = d
    MaxPlace = 1
    MaxRotations = 1
