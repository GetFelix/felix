\* FelixRaftLease.cfg with one restart. A restarted broker
\* refuses votes for one election timeout from its start, because it may have
\* answered the leader just before it stopped.
\*
\* It passes on that rule, which neither the design page nor openraft 0.10.0
\* has (issue 2307). openraft starts with a zero lease on the stored vote,
\* and FelixRaftLeaseRestartForgets.cfg, the engine as it is, violates
\* LeaseExclusive. So this passing does not yet gate the pull request that
\* turns on `admit_local_ack`.
\*
\* Evidence: none, `admit_local_ack` always refuses until these configs pass
\* and the restart rule of issue 2307 is built.

