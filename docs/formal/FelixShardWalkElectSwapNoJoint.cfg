\* FelixShardWalkElectSwap.cfg without the joint configuration: a cut-over
\* fences, ships and acknowledges on the new set alone. The
\* walk has to find a replica left on the old set standing at the new
\* leader's generation, opening on a majority of the old set the new leader
\* never fenced, and acknowledging a record the new leader does not hold
\* (AckedHeldByLeader). Promotion on suspicion and adoption are off, so the
\* walks spend their steps on cut-overs and elections: with them on, a walk
\* took up to 17 minutes to find the trace and once ran out its 25.
\*
\* Evidence: none yet, nothing in the code elects a leader.

SPECIFICATION Spec

CONSTANTS
    Brokers = {a, b, c, d}
    L = 2
    Margin = 0
    Eps = 0
    Drift = 1
    MaxTime = 40
    MaxWrites = 6
    CheckAtCommit = FALSE
    Quorum = TRUE
    Promotion = "any"
    ReportBeforeAck = FALSE
    Handoff = FALSE
    WaitForDrained = TRUE
    FenceAtClaim = TRUE
    AckOnAdmit = FALSE
    FenceFromAdmit = FALSE
    MaxMoves = 0
    Planners = {p}
    CasWrites = TRUE
    StageMove = FALSE
    LearnerVotes = FALSE
    Resends = FALSE
    SequencesInLog = TRUE
    Cancel = FALSE
    CancelCas = TRUE
    ReportBound = "acknowledged"
    AckChecksLease = FALSE
    AckOnResponse = FALSE
    AckByFollowers = TRUE
    FenceOnPromote = TRUE
    LabelOnReceipt = FALSE
    StartRecord = TRUE
    ReportFromAnswers = FALSE
    ReportFloor = FALSE
    Spares = {d}
    ReplaceOnPromote = FALSE
    SeatHoldsCopy = TRUE
    Grow = FALSE
    PromoteDestination = FALSE
    Counters = FALSE
    CounterCatchUp = FALSE
    Ballots = TRUE
    Elections = 2
    FenceEveryChange = TRUE

    Suspicions = 0
    SetCheck = TRUE
    JointFence = FALSE
    Adopt = 0
    AdoptMatch = TRUE
    Swaps = 6
    PreVote = FALSE
    Wipes = 0
    StorageIds = FALSE

INVARIANTS
    TypeOK
    AckedHeldByLeader
