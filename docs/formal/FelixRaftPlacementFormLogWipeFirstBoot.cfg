\* FelixRaftPlacementFormLogWipe.cfg from a first start: a member may lose
\* its log alone at any point of forming. One that stopped before its vote
\* keeps its mark and goes on forming; one that reached the vote catches up.
\*
\* Evidence: `a_member_interrupted_after_its_mark_resumes_forming`,
\*   `a_member_that_reached_the_vote_with_a_blank_log_lost_it`.

SPECIFICATION Spec

CONSTANTS
    Brokers = {a, b, c}
    Nobody = Nobody
    InitBrokers = {a, b, c}
    MaxTerm = 2
    MaxWrites = 1
    MaxCalls = 0
    MaxTargets = 0
    MaxWipes = 1
    MinVoters = 3
    Rotate = FALSE
    Retain = TRUE
    StaleTargets = FALSE
    SkipJoint = FALSE
    NoWithhold = FALSE
    WithheldCounts = FALSE
    AnswerAnyId = FALSE
    DeleteOnTarget = FALSE
    PlaceDoomed = FALSE
    Forming = TRUE
    FormRecord = TRUE
    FormReached = TRUE
    FirstBoot = TRUE
    FormMajority = FALSE
    FormAlias = FALSE
    Waived = {}
    Absent = {}
    EarlyWipes = TRUE
    LogWipes = TRUE
    Direct = FALSE
    NoBarrier = FALSE
    NoVersion = FALSE
    NoStamp = FALSE
    SelfRemove = FALSE
    DoomAnyVersion = FALSE
    MaxRewinds = 0
    RewindSameInc = FALSE
    NoIncAck = FALSE
    WaiverExcusesAnswer = FALSE
    WaiverAnyNumber = FALSE
    DoomOnCommitted = FALSE

SYMMETRY Symm

INVARIANTS
    TypeOK
    OneLeaderPerTerm
    LogMatching
    LeaderCompleteness
    StateMachineSafety
    AckedSurvive
    AckedOnDisk
    DeliveredAgree

