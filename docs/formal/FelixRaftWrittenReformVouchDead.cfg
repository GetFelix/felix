\* The vouch rule with the commit counting fsynced copies and one broker
\* declared dead (#2661). The dead broker is a minority of the voters, so
\* every election took a vote the re-form read and T is the top term: a
\* copy whose last entry has term T still vouches for its whole log, and
\* the re-form keeps a committed entry a read copy holds.
\*
\* Evidence: none, this models the design for #2250, which is not built.

SPECIFICATION Spec

CONSTANTS
    Servers = {a, b, c}
    Nobody = Nobody
    InitVoters = {a, b, c}
    InitLearners = {}
    NewVoters = {a, b, c}
    MaxTerm = 1
    MaxWrites = 1
    MaxChanges = 0
    MaxCrashes = 1
    MaxPowerCuts = 2
    LearnerCounts = FALSE
    OtherTermCounts = FALSE
    JointOneHalf = FALSE
    WrittenCommits = FALSE
    CutRotates = TRUE
    Reserve = TRUE
    MaxReforms = 1
    MaxDead = 1
    Vouch = TRUE
    FloorHolder = FALSE

SYMMETRY Symm

INVARIANTS
    TypeOK
    OneLeaderPerTerm
    LogMatching
    StateMachineSafety
    OffsetNeverReused
    NeverLosesCommitted
