\* The vouch rule with the commit counting fsynced copies and one broker
\* declared dead. The rule loses a committed entry that a read copy holds
\* fsynced and reserved: with a broker dead, no copy vouches for its whole
\* log, and a follower's saved commit is 0. #2661 fixes the rule.
\*
\* Evidence: none, this models the design for #2250, which is not built.

