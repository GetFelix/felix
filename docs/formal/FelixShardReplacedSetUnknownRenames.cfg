\* A witness for FelixShardReplacedSetUnknown.cfg: the same configuration,
\* checking that the control plane never has a leader to name again that
\* lost the set it leaves after it opened a generation past the first
\* (NeverRenameUnknownSet). TLC finds one, so the passing configuration
\* reaches the rename the fix allows.
\*
\* Evidence: as FelixShardReplacedSetUnknown.cfg.

SPECIFICATION Spec

CONSTANTS
    Renames <- Yes
    SetLossUpTo <- Two
    KeepsUnopened <- Yes
    FenceRecordedSet <- Yes
    Brokers = {a, b, c, d}
    L = 4
    Margin = 0
    Eps = 0
    Drift = 0
    MaxTime = 4
    MaxWrites = 2
    CheckAtCommit = FALSE
    Quorum = TRUE
    Promotion = "leader-report"
    ReportBeforeAck = FALSE
    Handoff = FALSE
    WaitForDrained = TRUE
    FenceAtClaim = TRUE
    AckOnAdmit = FALSE
    FenceFromAdmit = FALSE
    MaxMoves = 0
    Planners = {}
    CasWrites = TRUE
    StageMove = FALSE
    LearnerVotes = FALSE
    Resends = FALSE
    SequencesInLog = TRUE
    Cancel = FALSE
    CancelCas = TRUE
    ReportBound = "acknowledged"
    AckChecksLease = FALSE
    AckOnResponse = FALSE
    AckByFollowers = TRUE
    FenceOnPromote = TRUE
    LabelOnReceipt = FALSE
    StartRecord = TRUE
    ReportFromAnswers = FALSE
    ReportFloor = FALSE
    Spares = {d}
    ReplaceOnPromote = TRUE
    SeatHoldsCopy = TRUE
    Grow = FALSE
    PromoteDestination = FALSE
    Counters = FALSE
    CounterCatchUp = FALSE
    Ballots = FALSE
    Elections = 0
    FenceEveryChange = FALSE

    Suspicions = 2
    SetCheck = TRUE
    JointFence = TRUE
    Adopt = 0
    AdoptMatch = TRUE
    Swaps = 0
    PreVote = FALSE
    Wipes = 0
    StorageIds = FALSE
SYMMETRY Symm

INVARIANTS
    NeverRenameUnknownSet
