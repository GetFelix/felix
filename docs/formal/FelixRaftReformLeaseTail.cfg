\* The kept-leader re-form of issue 3103. A `Leader` leader answers records
\* on its lease, two writes, then a power cut rotates its copy and keeps any
\* prefix at or past what it synced. The followers do not elect past a
\* lease-answered record still on a disk (the allowance, as
\* FelixRaftLease.tla models it), so when the kept log is ahead of every
\* follower only the operator's re-form moves the group on, and it reads the
\* kept copy and keeps what it holds.
\*
\* Evidence: none, this models the design for #3103, which is not built.

SPECIFICATION Spec

