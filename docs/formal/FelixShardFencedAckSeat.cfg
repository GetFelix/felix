\* FelixShardFencedAckAnyKept.cfg with one follower replacement
\* (`MaxMoves = 1`): a spare joins beside a leaving follower at one
\* generation, counting toward the quorum, and the leaving one goes at the
\* next, each written while the leader serves. The seat waits until the
\* newcomer holds what a majority of the set held when it joined
\* (`SeatHoldsCopy`), so a record acknowledged on the leader and the leaving
\* follower is on the newcomer too, and any later promotion, of any replica,
\* fences it. One write, a lease of two ticks in three, and no start records
\* keep it to CI's budget: the leader never changes at a replacement, so
\* Raft's Figure 8, which the start record is for, needs more leaderships
\* than this has, as in FelixShardFencedAckTwoPromotions.cfg.
\* FelixShardFencedAckSeatLonger.cfg is the longer run, start records on.
\* FelixShardFencedAckSeatEarly.cfg is this with the seat not waiting.
\*
\* Evidence: `a_quorum_replacement_waits_for_what_the_old_set_holds`
\* (placement) and `seating_a_replacement_keeps_what_the_old_set_acknowledged`
\* (the cluster keeps the record through a drain and a failover).

