\* Witness on FelixRaftLeaseRestoreTransferThreeTerms.cfg: a transfer's
\* target leads a third term on the grant of a voter inside its hold, while
\* the leader that started the transfer still leads the first.
\* SecondTermByTransfer keeps only behaviours where the second term is won on
\* the transfer, so the trace is that one and not a plain timeout.
\*
\* Evidence: none, the restart fast path (pull request 2445) is not built.

