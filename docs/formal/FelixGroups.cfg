\* The broker as built: every cursor record carries the dead-letter log it
\* needs (its length and the generation at that length), dead letters are
\* synced before a cursor that needs them, cursors are checked before a
\* shard is served, and a group with nothing standing goes to its origin.
\* Across a crash with independently flushed logs and two promotions, no
\* group's cursor passes a record that is neither finished nor dead.
\*
\* Bounds: three replicas, two groups, one record, generations to 3, one
\* crash, two commits per cursor log.
\*
\* Evidence: `a_cursor_left_without_its_dead_letter_falls_back`,
\* `a_refilled_dead_letter_log_does_not_restore_a_cursor` and
\* `the_latest_cursor_that_still_stands_is_kept` (the check);
\* `a_commit_records_the_dead_letters_beneath_it` (the dependency);
\* `an_if_new_seek_finds_a_group_that_fell_back` (no group dropped);
\* `a_replaced_dead_letter_leaves_its_cursor_unserved` and
\* `a_rebuilt_dead_letter_log_leaves_its_cursor_unserved` (a replica's logs
\* replaced); `the_group_logs_furthest_ahead_are_taken_too`,
\* `an_own_further_cursor_is_kept_while_it_stands` and
\* `a_replica_counts_once_it_took_both_group_fences` (the promotion);
\* `the_dead_letter_reaches_a_follower_before_the_cursor_that_passed_it`
\* (shipping order).

SPECIFICATION Spec

CONSTANTS
    Replicas = {a, b, c}
    G = 2
    N = 1
    MaxGen = 3
    MaxCrashes = 1
    MaxCursors = 2
    CheckCursors = TRUE
    DependencyGen = TRUE
    KeepGroups = TRUE
    SplitSources = FALSE
    SyncBeforeShip = TRUE

SYMMETRY Symmetry

INVARIANT NoSkip
