\* FelixShardMoveGiveUp.cfg with a broker that leads a given-up copy as
\* soon as placement names it, without its probe's word (`LeadsGivenUp`).
\* The retake then opens on the short copy and a follower behind it, and TLC
\* finds a record acknowledged on the leader and the successor gone
\* (AckedHeldByLeader). So a retake after an unclean crash is safe only
\* because the broker refuses a copy some follower is ahead of; the fence
\* timeout's retake rests on the same refusal.
\*
\* Evidence: none, this models an alternative the implementation does not use.

SPECIFICATION Spec

CONSTANTS
    Nodes = {a, b, c}
    First = a
    NoNode = NoNode
    MaxGen = 5
    MaxWrites = 1
    MaxCrashes = 1
    MaxMoves = 1
    LeadsGivenUp <- Yes

INVARIANTS
    OneLeaderPerGeneration
    AckedHeldByLeader
    AtMostOneServing
