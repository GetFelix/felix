\* A move whose destination was added to the replica set and is still
\* copying, with the leader leaving it out of the quorum. Two replicas the
\* stream asked for and the destination: safety holds through the copy, the
\* fence, the cut-over and a failover, and no `Quorum` write waits for the
\* copy.
\* Evidence: `a_destination_still_copying_does_not_hold_the_quorum_mark` --
\*   the staged destination is left out of the quorum mark.
\* `a_successor_that_was_already_a_replica_still_counts` -- only a node the
\*   leader saw added is left out.
\* `a_drained_report_cuts_over_to_the_successor` -- the cut-over waits for the
\*   destination to be caught up.
\* `records_acknowledged_during_a_move_survive_it` -- AckedSurvive across a
\*   move, against a real cluster.

SPECIFICATION Spec

CONSTANTS
    Brokers = {a, b, c}
    L = 4
    Margin = 2
    Eps = 1
    Drift = 0
    MaxTime = 5
    MaxWrites = 1
    CheckAtCommit = TRUE
    Quorum = TRUE
    Promotion = "leader-report"
    ReportBeforeAck = TRUE
    Handoff = TRUE
    WaitForDrained = TRUE
    FenceAtClaim = TRUE
    AckOnAdmit = FALSE
    FenceFromAdmit = TRUE
    MaxMoves = 1
    Planners = {}
    CasWrites = TRUE
    StageMove = TRUE
    LearnerVotes = FALSE
    Resends = FALSE
    SequencesInLog = TRUE
    Cancel = FALSE
    CancelCas = TRUE
    ReportBound = "acknowledged"
    AckChecksLease = TRUE
    AckOnResponse = FALSE
    AckByFollowers = FALSE
    FenceOnPromote = FALSE
    LabelOnReceipt = FALSE
    StartRecord = FALSE

SYMMETRY Symm

INVARIANTS
    TypeOK
    AtMostOneServing
    AckedSurvive
    AckedAgree
    NoTruncationBelowHwm
    NoStaleCommit
    AckedOnMajority
    StagedCopyNeverDelaysAck
