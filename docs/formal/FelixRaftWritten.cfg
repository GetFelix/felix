\* The written-majority acknowledgement of a `Quorum` write on a `Periodic`
\* stream: three voters, one leader, two writes, one process crash and one
\* power cut. Every rule is on. The checks ask which brokers could win the
\* next election, so no second term is needed to see a loss. An acknowledged
\* record can go missing only after a power cut took it from a copy before
\* its fsync.
\*
\* Evidence: `a_quorum_write_is_acknowledged_once_a_majority_has_written_it` -- the
\*   acknowledgement comes while no follower has fsynced, and moves neither
\*   the commit index nor the read bound.
\*   `a_majority_is_the_leader_and_the_voters_that_said_so` -- the count.

SPECIFICATION Spec

CONSTANTS
    Servers = {a, b, c}
    Nobody = Nobody
    InitVoters = {a, b, c}
    InitLearners = {}
    NewVoters = {a, b, c}
    MaxTerm = 1
    MaxWrites = 2
    MaxChanges = 0
    MaxCrashes = 1
    MaxPowerCuts = 1
    LearnerCounts = FALSE
    OtherTermCounts = FALSE
    JointOneHalf = FALSE
    WrittenCommits = FALSE

SYMMETRY Symm

INVARIANTS
    TypeOK
    OneLeaderPerTerm
    LogMatching
    LeaderCompleteness
    StateMachineSafety
    CommittedHeld
    AckedHeld
