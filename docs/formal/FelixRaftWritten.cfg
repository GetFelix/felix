    Servers = {a, b, c}
    Nobody = Nobody
    InitVoters = {a, b, c}
    InitLearners = {}
    NewVoters = {a, b, c}
    MaxTerm = 1
    MaxWrites = 2
    MaxChanges = 0
    MaxCrashes = 1
    MaxPowerCuts = 1
    LearnerCounts = FALSE
    OtherTermCounts = FALSE
    JointOneHalf = FALSE
    WrittenCommits = FALSE

SYMMETRY Symm

INVARIANTS
    TypeOK
    OneLeaderPerTerm
    LogMatching
    LeaderCompleteness
    StateMachineSafety
    CommittedHeld
    AckedHeld
