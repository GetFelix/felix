\* The Round 5 rule alone: a group with nothing committed whose tracker
\* hydrated before another group's delete has every entry dropped, and the
\* leader keeps serving from that tracker for the rest of the term.
\*
\* Evidence: none, Raft shards refuse group operations until the design this
\* models is built (#2446).

