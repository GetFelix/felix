\* The design as written, with a false alarm at the leader about a follower's
\* broker. A write arrives during a handshake; the leader commits it with the
\* other member, leaves the suspected one out and proposes again. The member
\* left out still matches the first request, accepts it and sleeps. Every
\* live member is asleep and one is behind. An expected violation: the design
\* has no rule for it.
\* Evidence: none, sleep is not built yet (issue 2244).

