\* A long random walk over self-election, for TLC's simulation mode
\* (`scripts/check_tla.sh --simulate`): FelixShardWalkSpares.cfg with replicas
\* electing themselves up to two generations past the control plane's, the
\* set check and the joint fence on a set change, and the control plane
\* adopting elected leaders up to generation 10. The exhaustive
\* configurations stop at one replacement (FelixShardElectSet.cfg,
\* FelixShardElectAdopt.cfg); this grows the set, replaces followers, fails
\* over on suspicion and elects within one behaviour.
\*
\* Its first run found an elected leader stepping down on its own lease and
\* AckedHeldByLeader then holding the deposed leader below it to the record,
\* which is why `Newest` counts promises; FelixShardElectStepDown.cfg keeps
\* that case under exhaustive check.
\*
\* No SYMMETRY: simulation stores no states. A pass means the walks found
\* nothing. FelixShardWalkElectStaleSet.cfg is this without the set check.
\*
\* Evidence: none yet, nothing in the code elects a leader.

SPECIFICATION Spec

CONSTANTS
    Brokers = {a, b, c, d}
    L = 2
    Margin = 0
    Eps = 0
    Drift = 1
    MaxTime = 40
    MaxWrites = 6
    CheckAtCommit = FALSE
    Quorum = TRUE
    Promotion = "any"
    ReportBeforeAck = FALSE
    Handoff = FALSE
    WaitForDrained = TRUE
    FenceAtClaim = TRUE
    AckOnAdmit = FALSE
    FenceFromAdmit = FALSE
    MaxMoves = 6
    Planners = {}
    CasWrites = TRUE
    StageMove = FALSE
    LearnerVotes = FALSE
    Resends = FALSE
    SequencesInLog = TRUE
    Cancel = FALSE
    CancelCas = TRUE
    ReportBound = "acknowledged"
    AckChecksLease = FALSE
    AckOnResponse = FALSE
    AckByFollowers = TRUE
    FenceOnPromote = TRUE
    LabelOnReceipt = FALSE
    StartRecord = TRUE
    ReportFromAnswers = FALSE
    ReportFloor = FALSE
    Spares = {c, d}
    ReplaceOnPromote = FALSE
    SeatHoldsCopy = TRUE
    Grow = TRUE
    PromoteDestination = FALSE
    Counters = FALSE
    CounterCatchUp = FALSE
    Ballots = TRUE
    Elections = 2
    FenceEveryChange = TRUE

    Suspicions = 10
