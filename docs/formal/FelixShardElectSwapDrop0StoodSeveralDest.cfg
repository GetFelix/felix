\* A piece of FelixShardElectSwap.cfg: the cut-overs whose new set drops the
\* old leader, after no write was admitted, once two or more replicas had promised a
\* generation past the control plane's, the destination among them. As one piece those
\* cut-overs did not finish in six hours, so the four
\* FelixShardElectSwapDrop0Stood{One,Several}{Dest,Other}.cfg split them by
\* the two (`PieceStoodCounts`, `PieceDestStood`). Each also checks everything
\* before its cut-over, so with the other eleven pieces they reach every
\* state FelixShardElectSwap.cfg does (`CutOverPiece`).
\* `QuietView` leaves out what no step reads again here.
\* 84.0M distinct states, depth 43, 2 h 37 min on a four-core CI runner.
\*
\* Evidence: `a_cut_over_swapping_two_members_waits_for_the_old_majority`
\* and `a_joint_fence_never_counts_a_learner`
\* (crates/server/felix-replication/src/promotion/tests/joint.rs), and
\* `a_two_member_swap_waits_for_the_old_majority`
\* (crates/testing/felix-cluster/tests/failures/joint_fence.rs). Nothing in
\* the code elects a leader yet.

