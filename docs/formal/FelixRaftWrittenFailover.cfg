\* FelixRaftWritten.cfg across a change of leader: two terms, one write and
\* one power cut. CutRotates is FALSE: the kept copy still votes, which is
\* the wider case for the invariants listed, and AckedNeverLost is not one of
\* them. FelixRaftWrittenFailoverPowerCut.cfg has the rotation at two terms.
\*
\* Evidence: `a_report_from_another_term_does_not_make_a_majority` -- only a
\*   report at the leader's own term counts.
\*   `a_deposed_leader_acknowledges_nothing_on_reports` -- a member that no
\*   longer leads the record's term acknowledges nothing on the count.

