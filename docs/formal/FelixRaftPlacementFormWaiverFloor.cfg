\* FelixRaftPlacementFormWaiver.cfg with the floor the metadata group
\* has. The waived slot never starts, and its silence is not an answer, so
\* a wiped member never learns a floor and never votes again.
\*
\* Evidence: `the_floor_waits_for_every_member_and_takes_the_highest_term`.

