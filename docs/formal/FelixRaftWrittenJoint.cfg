\* Three voters and a learner, and one change that swaps a voter for the
\* learner through a joint configuration, with a write at any point of it.
\* A learner's report never counts and a joint configuration needs a
\* majority of both halves.
\*
\* Evidence: `a_majority_of_one_half_of_a_joint_membership_is_not_enough`,
\*   `a_joint_membership_needs_both_halves` -- both halves are needed.
\*   `a_learner_that_has_written_does_not_make_a_majority`,
\*   `a_learners_report_is_not_counted` -- a learner never counts.

SPECIFICATION Spec

CONSTANTS
    Servers = {a, b, c, d}
    Nobody = Nobody
    InitVoters = {a, b, c}
    InitLearners = {d}
    NewVoters = {a, b, d}
    MaxTerm = 1
    MaxWrites = 1
    MaxChanges = 1
    MaxCrashes = 0
    MaxPowerCuts = 0
    LearnerCounts = FALSE
    OtherTermCounts = FALSE
    JointOneHalf = FALSE
    WrittenCommits = FALSE

SYMMETRY Symm

INVARIANTS
    TypeOK
    OneLeaderPerTerm
    LogMatching
    LeaderCompleteness
    StateMachineSafety
    CommittedHeld
    AckedHeld
    AckedNeverLost
