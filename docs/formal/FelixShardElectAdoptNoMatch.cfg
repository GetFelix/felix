\* FelixShardElectAdopt.cfg with the set check on and only the control
\* plane's set comparison dropped (`AdoptMatch = FALSE`): it adopts an
\* elected leader whatever set that leader has. Generation 3 is in reach
\* (`Adopt = 3`), so a replica can elect itself on the set it had before a
\* replacement the control plane already wrote; at `Adopt = 2` no adoption
\* can mismatch. Checks the record invariants only: whether the comparison
\* is needed for safety, or only for the control plane's bookkeeping.
\*
\* Evidence: none yet, nothing in the code elects a leader.

