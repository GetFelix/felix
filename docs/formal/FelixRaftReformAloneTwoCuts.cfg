\* FelixRaftReformAlone.cfg with room for a second relaxed crash: two power
\* cuts, two re-forms and three plans. A cut can fall between the plan, the
\* stop, the epoch write and the start, or after a finished re-form, and the
\* group of one re-forms again with every acknowledged record its copies
\* hold (KeptLossBound) and no offset given out twice.
\*
\* Evidence: `a_second_periodic_crash_re_forms_above_the_first_epochs_reservation`
\* (a standalone broker), `a_crash_at_every_step_resumes_without_reusing_an_offset`
\* and `a_second_crash_mid_start_plans_again` (raft_copy, `reform_alone`).

