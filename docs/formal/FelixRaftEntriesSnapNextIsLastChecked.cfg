\* FelixRaftEntriesSnapNextIsLast.cfg with the follower's check on. The
\* broker that installed the wrong snapshot leads, and every follower
\* refuses its appends: the bug stops the group instead of reusing an
\* offset, so the leader never commits its record.
\*
\* Evidence: none, this pins what the follower's check turns the bug into.

SPECIFICATION Spec

CONSTANTS
    Servers = {a, b, c}
    Nobody = Nobody
    MaxTerm = 2
    MaxWrites = 2
    MaxMembers = 0
    MaxCrashes = 0
    MaxSnapshots = 1
    Consumer = FALSE
    AckBeforeFlush = FALSE
    VoteNotDurable = FALSE
    LeaderResumes = FALSE
    TornTailKept = FALSE
    TruncateNotDurable = FALSE
    RecoveredTailUnsynced = FALSE
    SaveCommittedUnflushed = FALSE
    PurgeBeforeSnapshot = FALSE
    SnapshotTwoRenames = FALSE
    CommitPriorTerm = FALSE
    DeliverUncommitted = FALSE
    SkipsNotCounted = FALSE
    ZeroTakesOffset <- ZeroTakesOffsetOff
    SnapNextIsLast <- Yes
SYMMETRY Symm

INVARIANTS
    TypeOK
    OneLeaderPerTerm
    LogMatching
    TermsMonotone
    LeaderCompleteness
    StateMachineSafety
    AppliedAgree
    AppliedInLog
    AckedSurvive
    PurgedCoveredBySnapshot
    OffsetsDense
    OffsetNeverReused
    BatchWhole
    DeliveredInOrder
    QuiescentServed
    AckedDelivered

PROPERTIES
    VoteNeverLowers
