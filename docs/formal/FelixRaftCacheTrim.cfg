\* The applied-id table trimmed by entries: an add (sequence 1) and a put
\* (sequence 5) from one producer, each entry carrying the producer's
\* floor, one retire entry, four proposals (retries and late copies
\* included), one leader change, one crash, two snapshots, no read, no
\* clock. A late copy of the add lands below the floor or after the
\* retire; a retry of the put lands at or above it. Every rule on.
\* Evidence: none, cache groups on Raft are not built yet (issue 2238).

