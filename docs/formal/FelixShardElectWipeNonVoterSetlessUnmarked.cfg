\* FelixShardElectWipeNonVoterSetless.cfg with a fence without a set refused
\* only on a learner mark kept in a set file (`SetlessSeesMarker` off), as
\* the code did before the replaced-storage marker. TLC is expected to find
\* an acknowledged write lost (AckedHeldByLeader): b leads and the write is
\* acknowledged by {b, c}; c is wiped and holds no set; the control plane
\* fails over to a, whose fence reaches c without a set; c answers with an
\* empty log and a opens on {a, c} without the write.
\*
\* Evidence: `a_replaced_copy_refuses_a_fence_without_a_set` in
\* crates/server/felix-replication/src/replica/tests/non_voting.rs.

