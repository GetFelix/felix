\* FelixShardLeaderCrashKeepsGen.cfg with the fix (#1295). The leader comes
\* back from the crash under a new identity and leads nothing from the copy
\* it led. Its last report names the identity it reported from, and
\* placement, finding the leader registered under another, promotes a
\* follower the report names caught up without waiting for the lease.
\*
\* The clock does not run: with the replacement on the identity, a promotion
\* follows the crash inside the first lease. One write, so the crash loses
\* the leader's whole log; a partial suffix needs two, which is the size
\* FelixShardCrashKeepsId.cfg found too large for the CI job.
\*
\* Evidence: the implementation behaviours this configuration asserts.
\* `a_crashed_leader_gives_up_the_generation_it_led` -- Crash under
\*   GiveUpOnCrash: the restarted broker does not lead from the copy it led,
\*   at its old generation or the next.
\* `a_given_up_copy_is_not_led_after_a_clean_restart_either` -- the give-up
\*   is on disk.
\* `a_withheld_shard_ships_reports_and_marks_nothing` -- it ships, reports
\*   and counts nothing for the shard meanwhile.
\* `a_report_names_the_leaders_own_storage_identity` -- Report: the leader
\*   names its own identity.
\* `a_leader_back_on_a_new_storage_identity_is_replaced` -- LeaderReplaced:
\*   placement promotes a caught-up follower though the leader is live.
\* `a_replaced_leader_with_nobody_caught_up_waits` -- and with nobody to
\*   promote, writes nothing.

