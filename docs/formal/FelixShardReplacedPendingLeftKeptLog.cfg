\* FelixShardReplacedPendingLeftKept.cfg with each member keeping the sets it leaves as the
\* broker's log does (`LogDropsSets`, #1881): a fence or a batch raising
\* its set carries the sets it sent (a batch sends none) plus, unless the
\* log holds a record of its own set's generation, that set and the ones
\* kept with it; a set at the same generation changes nothing.
\* A failover fences the control plane's set from the generation before
\* beside its own (`FenceRecordedSet`), as `set_before` and `logged_besides`
\* in promotion/joint.rs do; under Promotion "any" the two can differ.
\*
\* Evidence: none yet (#1881).

