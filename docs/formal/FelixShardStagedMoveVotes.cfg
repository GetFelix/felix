\* The destination counted toward the quorum while it copies, as the broker
\* did before it left a staged destination out.
\*
\* Expected to violate StagedCopyNeverDelaysAck: the leader holds a `Quorum`
\* write that the stream's one replica, itself, already holds and has
\* reported, and cannot acknowledge it until the destination has copied it.
\* Not a safety violation -- FelixShardStagedMoveSingle shows the safety
\* invariants hold either way -- but the wait is the whole copy.
\* Evidence: this configuration REMOVES a check the implementation has, so the
\* citations are what prove the check is there to remove.
\* `a_destination_still_copying_does_not_hold_the_quorum_mark` -- the leader
\*   leaves the staged destination out of the quorum.

