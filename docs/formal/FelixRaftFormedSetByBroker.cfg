\* The hold counting brokers instead of copies: two voters wiped and reopened
\* empty still count, so {2,3,4} gets a target with no copy that holds the
\* group's log, and forms a second group.
\* Evidence: none. It models counting brokers, to show why the code counts
\* copies (`a_voter_that_reopened_empty_does_not_count`).
CONSTANTS
    Brokers = {1, 2, 3, 4}
    Sets = {{1, 2, 3}, {2, 3, 4}}
    Init0 = {1, 2, 3}
    Blank0 = {}
    Hold = TRUE
    Rule = "half"
    ByCopy = FALSE
    MaxWipes = 2
INIT Init
NEXT Next
INVARIANTS TypeOK OneGroup
