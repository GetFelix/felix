\* FelixRaftReformAbandon.cfg with the dead check in a step before the
\* write: a comes back with an acknowledged record between the two, and the
\* abandon gives it up although a re-form could keep it.

SPECIFICATION Spec

CONSTANTS
    Brokers = {a, b}
    InitBrokers = {a}
    None = None
    MaxEpoch = 1
    MaxTerm = 2
    MaxWrites = 2
    MaxChangeSteps = 0
    ChangeOut = None
    ChangeIn = None
    MaxPlace = 0
    MaxRotations = 0
    MaxRejoins = 0
    MaxRestarts = 0
    MaxMsgs = 0
    MaxPlans = 1
    MaxDead = 1
    DeadRuns = FALSE
    WaitPlaced = TRUE
    Floor = "trailing"
    ReformBeforeAll = FALSE
    EpochNotChecked = FALSE
    ReportNotPromise = FALSE
    PlanNotRechecked = FALSE
    RotatedNotWaited = FALSE
    RetireNotDurable = FALSE
    VoteByBroker = FALSE
    BaseNotHighest = FALSE
    NoCas = FALSE
    SoloPlacedTwo = FALSE
    StopNotRechecked = FALSE
    PlacedForgotten = FALSE
    FloorIndexOnly = FALSE
    CutToCommit = FALSE
    Kept = FALSE
    Alone = "off"
    Reserve = "none"
    MaxCuts = 0
    MaxReturns = 1
    Abandon = "outside"

SYMMETRY Symm

INVARIANTS
    TypeOK
    BootIsRecorded
    PlacedIsRecorded
    OneLeaderPerTerm
    AbandonedNotLed
    AckedSurvive
    StateMachineSafety
    OffsetNeverReused
