\* A follower loses its disk on the fenced, follower-acked path the broker
\* ships: FelixShardSuspicion.cfg with one write and one wipe, reports counted
\* from the followers' answers with the floor (FelixShardReportFloor.cfg),
\* and storage identities. The wiped follower keeps the promise it made, which
\* the routing view stands in for in the broker
\* (FelixShardSuspicionWipeRoutes.cfg).
\*
\* The promoted leader counts a fence answer only from the identity the report
\* its promotion was decided on named for that replica (`FenceCounts`). The
\* wiped copy answers under a new one, so the fence needs another replica,
\* and the old leader's answer carries what it acknowledged.
\* FelixShardFencedWipeCountsWiped.cfg counts it, and loses a record.
\*
\* Bounds: one write, one wipe, one promotion on suspicion, and no clock, so
\* every promotion is the suspicion's. Start records give each log at most one
\* record per generation that opened.
\*
\* Invariants: AckedHeldByLeader is the one that matters, with the leader
\* that opens fenced at every promotion. AckedOnMajority is left out because
\* a wiped or crashed copy is a lost copy. AckedSurvive and AtMostOneServing
\* are left out as in FelixShardSuspicion.cfg: the old leader serves until it
\* hears of its successor, by design.
\*
\* Evidence: the implementation behaviours this configuration asserts.
\* `a_promotion_carries_the_reports_storage_ids` -- Promote: the assignment
\*   carries the identities the report named (`expect`).
\* `a_fence_answer_from_another_storage_id_does_not_count` -- FenceCounts:
\*   an answer from another identity is not counted or taken from.
\* `a_fence_answer_without_a_storage_id_does_not_count` -- nor one whose
\*   handshake gave none.
\* `a_fence_answer_from_the_reported_storage_id_counts` -- the identity the
\*   report named counts.
\* `a_replica_named_without_an_identity_does_not_count` -- FenceCounts: a
\*   replica the report named no identity for does not count (`Unnamed`).
\* `a_wiped_follower_on_an_idle_shard_is_not_reported_caught_up` -- Probe.

