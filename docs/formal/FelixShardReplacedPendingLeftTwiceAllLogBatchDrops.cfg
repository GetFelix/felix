\* FelixShardReplacedPendingLeftTwiceAllLog.cfg with a batch raising the set keeping none
\* (`BatchDropsSets`), the rule #1882 had before review. Dispatch
\* 41786406508 checked this rule (as the Log cfg on 426c1d5fc).
\* A failover fences the control plane's set from the generation before
\* beside its own (`FenceRecordedSet`), as `set_before` and `logged_besides`
\* in promotion/joint.rs do; under Promotion "any" the two can differ.
\*
\* Time stands still (`MaxTime = 0`): every promotion here is on suspicion,
\* so none waits for a lease to lapse, and dropping time keeps the check small.
\*
\* Violates AckedHeldByLeader, which shows the batch rule matters.
\*
\* Evidence: none yet (#1881).

