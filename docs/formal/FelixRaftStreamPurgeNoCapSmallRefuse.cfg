\* NoCapSmall.cfg with the install refusing a snapshot that carries a floor below the
\* member's own (InstallFloor = "refuse"). Safety only: CatchUpPossible is
\* left out because the refusal breaks it (InstallRefusesLowerFloor.cfg).
\*
\* The bounds of FelixRaftStreamPurgeNoCap.cfg, with three entries, so it finishes in a CI job.
\*
\* The design without the leader's cap: it purges past a member's match, so
\* that member is sent the snapshot. Expected to pass: the snapshot is below
\* the floor it carries, so the cap only saves sending it.
\*
\* Evidence: none, purging a Raft stream shard is not built yet (issue 2602).

