\* Repeated restores with batch entries (docs/raft-batch-entries-design.md):
\* an entry holds one or two offsets, a token bucket of capacity two filled
\* one per tick caps them at propose, one power cut takes what was not
\* synced and the shard re-forms at its reservation, and one leader change
\* starts a new bucket. Two backups, two restores ten ticks apart, each
\* planned on a clock off by up to a tick. No offset is given out twice and
\* every offset is below the synced reservation.
\*
\* Evidence: none, batch entries are not built yet (#3359).

