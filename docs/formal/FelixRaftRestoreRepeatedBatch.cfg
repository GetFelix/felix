\* Repeated restores with batch entries (docs/raft-batch-entries-design.md):
\* an entry holds one or two offsets, a token bucket of capacity one filled
\* one per tick caps them at propose, and one power cut takes what was not
\* synced, so the shard re-forms at its reservation under a new leader. One
\* backup, two restores eight ticks apart, each planned on a clock off by up
\* to a tick. No offset is given out twice and every offset is below the
\* synced reservation.
\*
\* Evidence: none, batch entries are not built yet (#3359).

