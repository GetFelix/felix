\* FelixRaftCondBatch.cfg with three terms: two changes of leader, so a batch
\* can be cut and the index after it rewritten again. Not registered, run by
\* dispatch.
\*
\* Evidence: none yet. The code that follows this design (a mark per piece
\*   with its position and the batch length, readers that skip a cut batch,
\*   and a read bound that stops before an unfinished one) lands in later
\*   changes for #2751.

SPECIFICATION Spec

CONSTANTS
    Servers = {a, b, c}
    Nobody = Nobody
    MaxTerm = 3
    MaxLog = 5
    MaxPlain = 0
    MaxMembers = 1
    Expected <- TwoAtTwo
    CondLen <- BatchLens
    LeaderDecides = FALSE
    Hide = "whole"

SYMMETRY Symm

INVARIANTS
    TypeOK
    CondKeptAtExpected
    OneKeptPerOffset
    MembersAgree
    AnswersHold
    WholeBatchesOnly

PROPERTY
    ReadsStable
