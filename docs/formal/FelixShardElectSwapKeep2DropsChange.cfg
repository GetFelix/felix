\* FelixShardElectSwapKeep2.cfg with `DropsChange`: placement may drop the pending
\* change at any time, writing its own set again at the next generation
\* (`PendingSetTimedOut` and `PendingSetMemberReplaced` in placement/moves.rs).
\* The leader fences there on the control plane's set and the pending one.
\* Evidence: `a_pending_set_is_dropped_when_a_member_comes_back_on_new_storage`
\* and `a_pending_set_that_is_never_reported_is_dropped_after_the_timeout`
\* (services/felix-controlplane-service/src/cluster/placement/tests/pending_set.rs).

