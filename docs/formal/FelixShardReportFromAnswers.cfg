\* The design as implemented before the report floor: the report counts a
\* follower by what it answered at the leader's generation, as the broker
\* does, and a new leader that has heard from nobody names every follower.
\* The lease is short so two promotions fit: a leader acknowledges a record
\* on one follower and dies, that follower is promoted, reports before the
\* other follower answers, and dies too. The other is promoted without the
\* record.
\*
\* Expected to violate AckedSurvive. FelixShardReportFloor.cfg is the fix.
\* QuorumReportNamesASuccessor is left out: a report counted from answers
\* names nobody until somebody answers, whatever the logs hold.
\* Evidence: this configuration REMOVES the floor the implementation has.
\* `a_new_leader_names_no_follower_before_it_answers` -- the broker names no
\*   follower short of the log it inherited. Drop that and the report names
\*   followers that never answered, which is the trace TLC finds here.

SPECIFICATION Spec

CONSTANTS
    Brokers = {a, b, c}
    L = 2
    Margin = 1
    Eps = 1
    Drift = 0
    MaxTime = 6
    MaxWrites = 1
    CheckAtCommit = TRUE
    Quorum = TRUE
    Promotion = "leader-report"
    ReportBeforeAck = TRUE
    Handoff = FALSE
    WaitForDrained = TRUE
    FenceAtClaim = TRUE
    AckOnAdmit = FALSE
    FenceFromAdmit = FALSE
    MaxMoves = 0
    Planners = {}
    CasWrites = TRUE
    StageMove = FALSE
    LearnerVotes = FALSE
    Resends = FALSE
    SequencesInLog = TRUE
    Cancel = FALSE
    CancelCas = TRUE
    ReportBound = "acknowledged"
    AckChecksLease = TRUE
    AckOnResponse = TRUE
    AckByFollowers = FALSE
    FenceOnPromote = FALSE
    LabelOnReceipt = FALSE
    StartRecord = FALSE
    ReportFromAnswers = TRUE
    ReportFloor = FALSE
    PromoteDestination = FALSE
    Spares = {}
    ReplaceOnPromote = FALSE
    SeatHoldsCopy = TRUE

SYMMETRY Symm

INVARIANTS
    TypeOK
    AtMostOneServing
    AckedSurvive
    AckedAgree
    NoTruncationBelowHwm
    NoStaleCommit
    AckedOnMajority
