\* The proposal across two terms, with the re-form's vouch rule: a copy
\* vouches for its saved commit, for the floor's entry if it holds it, and
\* for its whole log only if its last entry has the highest term of any
\* vote the re-form read. Two power cuts (each keeps the copy's vote) and
\* one broker declared dead, whose copy is not read; one dead voter of three
\* is a minority, so the group stays unmarked. No committed offset is given out again with another record.
\* Records can be lost (FelixRaftWrittenCommitsReformLoses.cfg).
\*
\* Evidence: none, this models the design for #2250, which is not built.

