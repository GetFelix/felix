\* FelixShardFencedAck.cfg with a planned move: placement fences the leader
\* toward a follower, the leader stops taking writes and keeps shipping, and
\* the cut-over names the follower once a drained report says it holds the
\* whole log. The destination opens without the promotion fence, as the
\* broker opens a cut-over, persisting its generation and writing its start
\* record. A failover while the move is under way never names the
\* destination (`PromoteDestination = FALSE`); any other replica it names
\* fences as usual. Placement fences only on a report from the generation it
\* read, which a leader still in its own promotion fence never sends.
\* One write, `L = 2`, time to 2: one promotion, before or after the move.
\* FelixShardFencedAckMoveDestination.cfg lets the failover name the
\* destination, and TLC finds the record lost.
\* 66.0M distinct states, depth 44, 58 min on a four-core CI runner: run by hand, not in
\* scripts/check_tla.sh; FelixShardFencedAckMoveShort.cfg is the CI-sized run.
\*
\* Evidence: `a_quorum_failover_does_not_promote_a_move_destination`
\* (placement), `a_cancelled_move_is_not_held_for_the_fence` (a cut-over and
\* a cancel open without the fence), and
\* `a_new_generation_while_fencing_keeps_the_promotion_pending` (a new
\* generation during the fence fences again).

SPECIFICATION Spec

CONSTANTS
    Brokers = {a, b, c}
    L = 2
    Margin = 0
    Eps = 0
    Drift = 0
    MaxTime = 2
    MaxWrites = 1
    CheckAtCommit = FALSE
    Quorum = TRUE
    Promotion = "leader-report"
    ReportBeforeAck = FALSE
    Handoff = TRUE
    WaitForDrained = TRUE
    FenceAtClaim = TRUE
    AckOnAdmit = FALSE
    FenceFromAdmit = TRUE
    MaxMoves = 1
    Planners = {}
    CasWrites = TRUE
    StageMove = FALSE
    LearnerVotes = FALSE
    Resends = FALSE
    SequencesInLog = TRUE
    Cancel = FALSE
    CancelCas = TRUE
    ReportBound = "acknowledged"
    AckChecksLease = FALSE
    AckOnResponse = FALSE
    AckByFollowers = TRUE
    FenceOnPromote = TRUE
    LabelOnReceipt = FALSE
    StartRecord = TRUE
    Spares = {}
    ReplaceOnPromote = FALSE
    SeatHoldsCopy = TRUE
    PromoteDestination = FALSE

SYMMETRY Symm

INVARIANTS
    TypeOK
    AckedHeldByLeader
    AckedAgree
    AckedOnMajority
    NoTruncationBelowHwm
