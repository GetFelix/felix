\* FelixShardFencedAck.cfg with a planned move: placement fences the leader
\* toward a follower, the leader stops taking writes and keeps shipping, and
\* the cut-over names the follower once a drained report says it holds the
\* whole log. The destination opens without the fence, persisting its
\* generation and writing its start record, as the broker did before it
\* fenced every change of leader (`FenceEveryChange = FALSE`); without
\* elections that is safe. A failover while the move is under way never
\* names the destination (`PromoteDestination = FALSE`); any other replica
\* it names fences as usual. Placement fences only on a report from the generation it
\* read, which a leader still in its own promotion fence never sends.
\* One write, `L = 2`, time to 2: one promotion, before or after the move.
\* FelixShardFencedAckMoveDestination.cfg lets the failover name the
\* destination, and TLC finds the record lost.
\* 66.0M distinct states, depth 44, 58 min on a four-core CI runner: run nightly (tla-walk.yml), not in
\* scripts/check_tla.sh; FelixShardFencedAckMoveShort.cfg is the CI-sized run.
\*
\* Evidence: `a_quorum_failover_does_not_promote_a_move_destination`
\* (placement), and
\* `a_new_generation_while_fencing_keeps_the_promotion_pending` (a new
\* generation during the fence fences again).

