\* FelixRaftEntriesSnapshot.cfg with one crash and one write of one or two
\* records. A broker whose snapshot is past its log restarts from the
\* snapshot's next offset, and derives its stamps from there as a follower
\* and as the next leader.
\*
\* Evidence: none, batch entries are not built yet (#3359).

