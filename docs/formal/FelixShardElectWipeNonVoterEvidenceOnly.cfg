\* FelixShardElectWipeNonVoterFailover.cfg with only the evidence the code
\* sees in a set (`FreshIdLearner` off): a copy is a learner only once a set
\* names its old storage id. TLC finds a write lost: a follower is wiped
\* before it hears any set naming its old id, the control plane fails over
\* naming its new one, and it answers the fence with an empty log
\* (AckedHeldByLeader). This is why a storage id minted at this start makes
\* the copy a learner for every shard it held before.
\*
\* Evidence: `a_fresh_storage_id_is_a_learner` in
\* crates/server/felix-replication/src/replica/tests/non_voting.rs.

SPECIFICATION Spec

