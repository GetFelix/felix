\* FelixShardElectWipeNonVoterFailover.cfg with only the evidence the code
\* sees in a set (`ReplacedIdLearner` off): a copy is a learner only once a
\* set names its old storage id. TLC finds two leaders at one generation: a
\* promises 2 to candidate b; a is wiped before it hears any set naming its
\* old id, and forgets the promise; the control plane, which has not heard of
\* 2, fails over to c at 2 naming a's new id; b opens on {a, b}, and a
\* answers c's fence with no promise and an empty log, so c opens on {a, c}
\* (OneLeaderPerGeneration). This is why a broker the control plane last
\* registered under another storage id is a learner for every shard it held.
\*
\* Evidence: `a_replaced_storage_id_is_a_learner` in
\* crates/server/felix-replication/src/replica/tests/non_voting.rs, and
\* `a_node_registered_under_another_id_starts_replaced` and
\* `a_new_node_does_not_start_replaced` in
\* services/felix-broker-service/src/node/storage/tests.rs.

SPECIFICATION Spec

CONSTANTS
    Brokers = {a, b, c}
    L = 1
