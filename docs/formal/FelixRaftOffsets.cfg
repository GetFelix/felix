\* FelixRaft.cfg for the offsets a subscriber sees: two client writes and a
\* membership entry under one leader, so the membership entry lands before,
\* between or after the records. One term, no crash.
\* FelixRaftOffsetsFailover.cfg has a change of leader.
\*
\* Evidence: the raft_log adapter tests in felix-storage:
\*   `blank_and_membership_entries_are_records_clients_skip`,
\*   `a_blank_entry_must_name_its_own_generation`.

SPECIFICATION Spec

CONSTANTS
    Servers = {a, b, c}
    Nobody = Nobody
    MaxTerm = 1
    MaxWrites = 2
    MaxMembers = 1
    MaxCrashes = 0
    MaxSnapshots = 0
    Consumer = TRUE
    AckBeforeFlush = FALSE
    VoteNotDurable = FALSE
    LeaderResumes = FALSE
    TornTailKept = FALSE
    TruncateNotDurable = FALSE
    RecoveredTailUnsynced = FALSE
    SaveCommittedUnflushed = FALSE
    PurgeBeforeSnapshot = FALSE
    SnapshotTwoRenames = FALSE
    CommitPriorTerm = FALSE
    DeliverUncommitted = FALSE
    SkipsNotCounted = FALSE

SYMMETRY Symm

INVARIANTS
    TypeOK
    OneLeaderPerTerm
    LogMatching
    TermsMonotone
    LeaderCompleteness
    StateMachineSafety
    AppliedAgree
    AppliedInLog
    AckedSurvive
    PurgedCoveredBySnapshot
    OffsetsDense
    OffsetNeverReused
    DeliveredInOrder
    QuiescentServed
    AckedDelivered

PROPERTIES
    VoteNeverLowers
