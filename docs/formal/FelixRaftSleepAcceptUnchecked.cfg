\* FelixRaftSleep with one rule dropped. A member accepts a sleep request
\* without comparing vote, last log id and commit index. A deposed leader's old
\* request puts the new leader to sleep while it holds a write it has not
\* replicated, and the whole group is asleep with members behind.
\* Evidence: none, this models an alternative the implementation does not use.

