\* FelixShardFencedCache.cfg without the fence: the promoted leader serves
\* its cache shard at once, as FelixShardUnfencedAck.cfg does a stream
\* shard. `check_tla.sh` expects TLC to lose an acknowledged put: the old
\* leader, which checks no lease, ships it to a follower the new leader
\* never fenced and acknowledges it there. Only AckedHeldByLeader is checked,
\* so the trace TLC reports is the cache log's.
\*
\* Evidence: none, this removes the fence the broker requires of every
\* cache shard once the fleet finalized `fenced_caches`.

