\* FelixAtomicCommit.cfg with the views applying a committed record one part
\* at a time. The record is whole in every log, but a reader lands between
\* two parts and sees the event without the state. TLC finds it.
\*
\* Evidence: none. It models a design the code does not use, to show why.

SPECIFICATION Spec

CONSTANTS
    Brokers = {a, b, c}
    MaxCommits = 2
    MaxGen = 3
    SplitRecords = FALSE
    PartialApply = TRUE

INVARIANTS
    NoPartialCommit
    CommitSurvives
