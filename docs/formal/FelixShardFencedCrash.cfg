\* A follower crashes under `FsyncMode::Periodic` on the fenced,
\* follower-acked path, losing part of its log, and restarts under a new
\* storage identity (`RotateOnCrash`, #1294). The passing case
\* FelixShardCrashKeepsId.cfg could not afford on the report path: here a
\* promoted leader's start record is a second record, so one write is enough
\* for a crash to keep part of a log and lose the rest.
\*
\* The promoted leader counts a fence answer only from the identity the report
\* its promotion was decided on named for that replica (#1335). Under
\* `Periodic` with three replicas, a record acknowledged on the leader and the
\* follower that then lost it would otherwise be gone once the leader is
\* replaced: FelixShardFencedCrashCountsRotated.cfg.
\*
\* Bounds as FelixShardFencedWipe.cfg.
\*
\* Invariants: AckedHeldByLeader is the one that matters, with the leader
\* that opens fenced at every promotion. AckedOnMajority is left out because
\* a wiped or crashed copy is a lost copy. AckedSurvive and AtMostOneServing
\* are left out as in FelixShardSuspicion.cfg: the old leader serves until it
\* hears of its successor, by design.
\*
\* Evidence: the implementation behaviours this configuration asserts.
\* `a_crash_under_a_relaxed_fsync_mode_rotates_the_id` -- Crash under
\*   RotateOnCrash.
\* `a_promotion_carries_the_reports_storage_ids` -- Promote: the assignment
\*   carries the identities the report named (`expect`).
\* `a_fence_answer_from_another_storage_id_does_not_count` -- FenceCounts.
\* `a_fence_answer_from_the_reported_storage_id_counts` -- the identity the
\*   report named counts.
\* `a_replica_the_report_did_not_name_does_not_count` -- FenceCounts: a
\*   replica the report named no identity for does not count (`Unnamed`).

