\* FelixRaftWrittenCommitsPowerCut.cfg with the cut copy kept: the commit
\* counts a written copy, the copy loses the entry to a power cut and comes
\* back as the same voter, and it and the third voter can elect without a
\* record that was committed and acknowledged. Committing on a written
\* majority is safe only on a root where a power cut rotates every copy.
\* FelixRaftWrittenCommits.cfg finds the same run as a CommittedHeld
\* violation.
\*
\* Evidence: none, this models an alternative the implementation must not use.

