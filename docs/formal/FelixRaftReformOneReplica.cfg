\* A shard with one replica. Its copy's disk is restored and the copy rotates.
\* If it kept records it starts by itself as the single voter of the next
\* epoch; if it is empty the command re-forms it. Twice, with a restart and a
\* late append.
\* 
\* Evidence: none, re-forming is not built yet (track 4 of issue 2244).

