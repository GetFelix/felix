\* The two-fence probe with unclean crashes (ballots kept, id rotated) in place
\* of lost directories. VIOLATES OneLeaderPerGeneration (412,079 distinct
\* states): b promises a, crashes uncleanly and refuses c from its rotated id,
\* so c counts half without b and opens; c crashes uncleanly and refuses a, so
\* a counts half without c and opens at the same generation. A refusal takes
\* no ballot, but the code hears it as a replaced copy.

SPECIFICATION Spec

CONSTANTS
    Nodes = {a, b, c, d}
    First = a
    NoNode = NoNode
    MaxGen = 2
    MaxWrites = 0
    MaxStarts = 2
    MaxUnclean = 2
    MaxWipes = 0
    MaxRestores = 0
    MaxRetries = 0
    SetChoices = {{c}, {d}, {a, b}}
    OldPeers = {}
    ReplacedBlocking <- Yes

INVARIANTS
    OneLeaderPerGeneration
    AckedHeldByLeader
