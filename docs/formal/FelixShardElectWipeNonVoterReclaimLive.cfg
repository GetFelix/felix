\* FelixShardElectWipeNonVoterReclaim.cfg's rules for liveness, with no
\* client write: the generation's start record is the record the learner
\* must hold, and the stall needs no other. TLC finds the learner admitted
\* whenever its copy holds the start record (LearnerAdmitted), with
\* placement's admission and failover owed (AdmitSpec). Liveness, so no
\* SYMMETRY: the first leader is fixed instead.
\*
\* Evidence: `the_probe_names_a_follower_holding_the_generation_it_gave_up`
\* and `a_given_up_leaders_probe_admits_a_learner_holding_the_start`, as in
\* FelixShardElectWipeNonVoterReclaim.cfg.

