\* FelixShardElectLiveUnclean.cfg with the rule before #2025: a ballot
\* naming this broker that this process did not open at counts as one it led
\* before the crash, its own candidacy's included (`OwnBallotLedBefore`).
\* The restarted broker stands and wins, its open is refused and it gives the
\* copy up, after which it refuses the third broker's fence. With the
\* leader's broker stopped nobody is elected.
\*
\* Expected to violate liveness (`ElectionSettles`).
\*
\* Evidence: this configuration REMOVES the fix tested by
\* `a_copy_that_stood_after_an_unclean_start_takes_a_newer_fence`
\* (replica/tests/fence.rs) and `a_copy_led_before_stays_led_after_it_stands`
\* (unclean/tests.rs) in crates/server/felix-replication.

SPECIFICATION LiveSpec

CONSTANTS
    Brokers = {a, b, c}
    L = 2
    Margin = 0
    Eps = 0
    Drift = 0
    MaxTime = 0
    MaxWrites = 0
    CheckAtCommit = FALSE
    Quorum = TRUE
    Promotion = "log-order"
    ReportBeforeAck = FALSE
    Handoff = FALSE
    WaitForDrained = TRUE
    FenceAtClaim = TRUE
    AckOnAdmit = FALSE
    FenceFromAdmit = FALSE
    MaxMoves = 0
    Planners = {}
    CasWrites = TRUE
    StageMove = FALSE
    LearnerVotes = FALSE
    Resends = FALSE
    SequencesInLog = TRUE
    Cancel = FALSE
    CancelCas = TRUE
    ReportBound = "acknowledged"
    AckChecksLease = FALSE
    AckOnResponse = FALSE
    AckByFollowers = TRUE
    FenceOnPromote = TRUE
    LabelOnReceipt = FALSE
    StartRecord = TRUE
    ReportFromAnswers = FALSE
    ReportFloor = FALSE
    Spares = {}
    ReplaceOnPromote = FALSE
    SeatHoldsCopy = TRUE
    Grow = FALSE
    PromoteDestination = FALSE
    Counters = FALSE
    CounterCatchUp = FALSE
    Ballots = TRUE
    Elections = 4
    FenceEveryChange = FALSE

    Suspicions = 0
    SetCheck = TRUE
    JointFence = TRUE
    Adopt = 0
    AdoptMatch = TRUE
    Swaps = 0
    PreVote = TRUE
    Wipes = 0
    StorageIds = TRUE
    CpDown <- Yes
    DetectorMisfires <- Yes
    FailStops <- One
    PreVoteAsked <- Yes
    Backoff <- Yes
    Splits <- Two
    UncleanCrashes <- One
    OwnBallotLedBefore <- Yes

PROPERTIES
    ElectionSettles
    NoStandAgainstHeardLeader

INVARIANTS
    TypeOK
    OneLeaderPerGeneration
    AckedHeldByLeader
    AckedAgree
    AckedOnMajority
    NoTruncationBelowHwm
    AdoptedMatchesOpened
    SetChangesJoint
