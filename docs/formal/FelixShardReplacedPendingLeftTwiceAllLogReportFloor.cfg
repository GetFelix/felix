\* FelixShardReplacedPendingLeftTwiceAllLogReport.cfg with the report
\* floored at the log the leader inherited under follower acks too
\* (`ReportFloor`), as `acknowledged` in driver/shard.rs does since #1922.
\* Without it a leader names followers caught up at offset 0 before they
\* answer, and placement promotes one that never held write 1.
\*
\* FelixShardReplacedPendingLeftTwiceAllLog.cfg with placement promoting
\* only a replica the leader's last report lists as caught up
\* (Promotion "leader-report"), as `promote` in placement/rendezvous.rs does.
\*
\* FelixShardReplacedPendingLeftTwiceAll.cfg with each member keeping the sets it leaves as the
\* broker's log does (`LogDropsSets`, #1881): a fence or a batch raising
\* its set carries the sets it sent (a batch, the control plane's set before
\* its generation, `BatchLeaving`) plus, unless the
\* log holds a record of its own set's generation, that set and the ones
\* kept with it; a set at the same generation changes nothing.
\* A failover fences the control plane's set from the generation before
\* beside its own (`FenceRecordedSet`), as `set_before` and `logged_besides`
\* in promotion/joint.rs do; under Promotion "any" the two can differ.
\*
\* Time stands still (`MaxTime = 0`): every promotion here is on suspicion,
\* so none waits for a lease to lapse, and dropping time keeps the check small.
\*
\* Evidence: none yet (#1881).

SPECIFICATION Spec

CONSTANTS
    KeepsUnopened <- Yes
    FenceRecordedSet <- Yes
    LogDropsSets <- Yes
    Brokers = {a, b, c, d}
    L = 4
    Margin = 0
    Eps = 0
    Drift = 0
    MaxTime = 0
    MaxWrites = 2
    CheckAtCommit = FALSE
    Quorum = TRUE
    Promotion = "leader-report"
    ReportBeforeAck = FALSE
    Handoff = FALSE
    WaitForDrained = TRUE
    FenceAtClaim = TRUE
    AckOnAdmit = FALSE
    FenceFromAdmit = FALSE
    MaxMoves = 0
    Planners = {}
    CasWrites = TRUE
    StageMove = FALSE
    LearnerVotes = FALSE
    Resends = FALSE
    SequencesInLog = TRUE
    Cancel = FALSE
    CancelCas = TRUE
    ReportBound = "acknowledged"
    AckChecksLease = FALSE
    AckOnResponse = FALSE
    AckByFollowers = TRUE
    FenceOnPromote = TRUE
    LabelOnReceipt = FALSE
    StartRecord = TRUE
    ReportFromAnswers = FALSE
    ReportFloor = TRUE
    Spares = {d}
    ReplaceOnPromote = TRUE
    SeatHoldsCopy = TRUE
    Grow = FALSE
    PromoteDestination = FALSE
    Counters = FALSE
    CounterCatchUp = FALSE
    Ballots = FALSE
    Elections = 0
    FenceEveryChange = FALSE

    Suspicions = 3
    SetCheck = TRUE
    JointFence = TRUE
    Adopt = 0
    AdoptMatch = TRUE
    Swaps = 0
    PreVote = FALSE
    Wipes = 0
    StorageIds = FALSE
SYMMETRY Symm

INVARIANTS
    TypeOK
    AckedHeldByLeader
    LeftRecorded
    AckedAgree
    NoTruncationBelowHwm
