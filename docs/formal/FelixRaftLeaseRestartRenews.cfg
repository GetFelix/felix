\* FelixRaftLeaseRestartForgets.cfg with what openraft 0.10.0 does at a
\* start (`Engine::startup`): it renews the refusal window for one election
\* timeout when the stored vote is committed and another broker's, which is
\* a follower that took its leader's message. A vote given to a candidate
\* gets no window, and a restarted leader's own vote is demoted with none.
\* The node layer's hold is off, so this is the engine alone. It passes: a
\* member the lease counts on has taken the leader's message, so its stored
\* vote is the kind that is renewed. Two differences from openraft remain: a
\* just-started member does not campaign at once, and no vote is granted
\* under openraft's leased-leader exemption. A run without both still passed.
\*
\* Evidence: none, the Raft engine is not built.

