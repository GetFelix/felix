\* The proposal after a majority power cut. Two of three copies lose the
\* unsynced tail and rotate, the group cannot elect, and the operator
\* re-forms it. The re-form pads up to the highest reservation any copy
\* synced, which is at or past every entry a copy counted, so no committed
\* offset, and so nothing a subscriber was given, is given out again
\* with another record. FelixRaftWrittenCommitsReformLoses.cfg shows that
\* the records themselves can be lost.
\*
\* Evidence: none, this models a proposal that is not built.

