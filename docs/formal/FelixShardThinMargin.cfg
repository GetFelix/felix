\* The lease with no safety interval at all: the broker serves until its own
\* expiry and the control plane grants again the moment its copy lapses. With
\* drifting clocks TLC is expected to find two brokers serving at once; this
\* configuration exists to show the interval is load-bearing, and
\* `task tla:check` expects it to fail.
\* Evidence: this configuration REMOVES a check the implementation has, so the
\* citation is what proves the check is there to remove.
\* `a_quarter_of_the_lease_is_surrendered_as_margin` -- the margin this sets to
\*   zero is real in the code; without it TLC finds two brokers serving at once.
\* Planners = {}: every decision reads and writes in one step, so CasWrites
\*   has nothing to compare. The StalePlanner and StalePromotion
\*   configurations are where a read is held across another write.

SPECIFICATION Spec

CONSTANTS
    Brokers = {a, b, c}
    L = 4
    Margin = 0
    Eps = 0
    Drift = 1
    MaxTime = 8
    MaxWrites = 0
    CheckAtCommit = TRUE
    Quorum = TRUE
    Promotion = "log-order"
    ReportBeforeAck = TRUE
    Handoff = FALSE
    WaitForDrained = TRUE
    FenceAtClaim = TRUE
    AckOnAdmit = FALSE
    FenceFromAdmit = FALSE
    MaxMoves = 0
    Planners = {}
    CasWrites = TRUE
    StageMove = FALSE
    LearnerVotes = FALSE
    Resends = FALSE
    SequencesInLog = TRUE
    Cancel = FALSE
    CancelCas = TRUE
    ReportBound = "acknowledged"
    AckChecksLease = TRUE
    AckOnResponse = FALSE
    AckByFollowers = FALSE
    FenceOnPromote = FALSE

SYMMETRY Symm

INVARIANTS
    AtMostOneServing
