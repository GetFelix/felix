\* A first start of the metadata group (docs/metadata-raft-design.md,
\* "Rejoining after a lost volume"): three empty members, each withholding its vote until
\* every other member has answered empty and recorded it. Two terms, one write, and one
\* volume lost after the group has committed an entry. With one write
\* OffsetNeverReused has nothing to compare and is not listed.
\*
\* Evidence: `three_empty_members_form_one_group`.

