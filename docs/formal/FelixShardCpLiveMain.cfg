\* Liveness with the control plane up (`CpLiveSpec`, #1917): three brokers,
\* no writes, no symmetry (unsound for liveness). A standing may be withdrawn
\* and keeps its ballot (`Withdraws`), placement may name a leader below a
\* ballot and renames it on the refusal (`Renames`, #1916, with
\* `OwnBallotRefused`, #1919), and one broker at a time may stop and come
\* back with what it persisted (`Restarts`). The leader the control plane
\* names ends up serving (`CpLeaderServes`). This one is main's code: the
\* fixes from #1914's list of dead ends are off, and TLC finds a shard that
\* never serves.

SPECIFICATION CpLiveSpec

CONSTANTS
    Brokers = {a, b, c}
    L = 2
    Margin = 0
    Eps = 0
    Drift = 0
    MaxTime = 0
    MaxWrites = 0
    CheckAtCommit = FALSE
    Quorum = TRUE
    Promotion = "log-order"
    ReportBeforeAck = FALSE
    Handoff = FALSE
    WaitForDrained = TRUE
    FenceAtClaim = TRUE
    AckOnAdmit = FALSE
    FenceFromAdmit = FALSE
    MaxMoves = 0
    Planners = {}
    CasWrites = TRUE
    StageMove = FALSE
    LearnerVotes = FALSE
    Resends = FALSE
    SequencesInLog = TRUE
    Cancel = FALSE
    CancelCas = TRUE
    ReportBound = "acknowledged"
    AckChecksLease = FALSE
    AckOnResponse = FALSE
    AckByFollowers = TRUE
    FenceOnPromote = TRUE
    LabelOnReceipt = FALSE
    StartRecord = TRUE
    ReportFromAnswers = FALSE
    ReportFloor = FALSE
    Spares = {}
    ReplaceOnPromote = FALSE
    SeatHoldsCopy = TRUE
    Grow = FALSE
    PromoteDestination = FALSE
    Counters = FALSE
    CounterCatchUp = FALSE
    Ballots = TRUE
    Elections = 4
    FenceEveryChange = FALSE

    Suspicions = 0
    SetCheck = TRUE
    JointFence = TRUE
    Adopt = 4
    AdoptMatch = TRUE
    Swaps = 0
    PreVote = TRUE
    Wipes = 0
    StorageIds = FALSE
    FailStops <- One
    Restarts <- Yes
    Withdraws <- Yes
    Renames <- Yes
    PreVoteAsked <- Yes

PROPERTIES
    CpLeaderServes

INVARIANTS
    TypeOK
    OneLeaderPerGeneration
    AckedHeldByLeader
    AckedAgree
    AckedOnMajority
    NoTruncationBelowHwm
    AdoptedMatchesOpened
    SetChangesJoint
