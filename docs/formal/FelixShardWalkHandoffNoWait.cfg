\* FelixShardWalkHandoff.cfg cutting over as soon as the fence is written
\* (`WaitForDrained = FALSE`), as FelixShardHandoffNoWait.cfg does
\* exhaustively. The walk must find the old leader still serving beside its
\* successor within its budget (AtMostOneServing). Only that invariant is
\* checked, so the first violation a walk finds is the one this expects.
\*
\* Evidence: none, this models a cut-over the implementation does not make.

