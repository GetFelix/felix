\* FelixShardFencedLeaderCrash.cfg with the promoted leader counting every
\* fence answer whatever identity it came from. The crashed leader's copy
\* still holds its promise, answers the successor's fence and is counted
\* without the record it acknowledged on itself and a follower, then lost.
\*
\* Expected to violate AckedHeldByLeader. The broker also refuses that fence
\* itself (`refuse_short_copy`), which the model leaves out, so this shows the
\* identity check holds on its own.
\*
\* Evidence: this configuration REMOVES the identity check.
\* `a_fence_answer_from_another_storage_id_does_not_count` -- drop the check
\*   and the crashed leader's answer counts, which is the trace TLC finds.
\*
\* Every crash is the machine's, which may lose a suffix and rotates the
\* identity: a process crash keeps both and only adds states.

SPECIFICATION Spec

CONSTANTS
    Brokers = {a, b, c}
    L = 4
    Margin = 0
    Eps = 0
    Drift = 0
    MaxTime = 0
    MaxWrites = 1
    CheckAtCommit = FALSE
