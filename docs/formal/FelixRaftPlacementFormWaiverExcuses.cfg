\* FelixRaftPlacementFormWaiverAnswers.cfg with one rule dropped: a waived
\* member's answer is skipped like its silence. A write is acknowledged by a
\* and the waived c, a loses its volume and forms on b's empty answer, and it
\* can be elected without the write.
\*
\* Evidence: none, this models an alternative the implementation does not use.

SPECIFICATION Spec

CONSTANTS
    Brokers = {a, b, c}
    Nobody = Nobody
    InitBrokers = {a, b, c}
    MaxTerm = 2
    MaxWrites = 1
    MaxCalls = 0
    MaxTargets = 0
    MaxWipes = 1
    MinVoters = 3
    Rotate = FALSE
    Retain = TRUE
    StaleTargets = FALSE
    SkipJoint = FALSE
    NoWithhold = FALSE
    WithheldCounts = FALSE
    AnswerAnyId = FALSE
    DeleteOnTarget = FALSE
    PlaceDoomed = FALSE
    Forming = TRUE
    FormRecord = FALSE
    FormReached = FALSE
    FirstBoot = FALSE
    FormMajority = FALSE
    FormAlias = FALSE
    Waived = {c}
    Absent = {}
    EarlyWipes = FALSE
    LogWipes = FALSE
    WaiverExcusesAnswer = TRUE
    WaiverAnyNumber = FALSE

SYMMETRY Symm

INVARIANTS
    AckedHeldSurvive
