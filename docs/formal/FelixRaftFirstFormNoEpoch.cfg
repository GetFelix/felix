\* A formed mark not keyed on the epoch: the mark an epoch-0 leader left
\* releases the first target of the group a re-form starts, and two sets form
\* in epoch 1.
\* Evidence: none. It models a mark that ignores the epoch, to show why the
\* code keys it on one (`a_reform_holds_the_new_epochs_first_target`).
CONSTANTS
    Brokers = {1, 2, 3, 4}
    Sets = {{1, 2, 3}, {2, 3, 4}}
    Hold = TRUE
    PerEpoch = FALSE
    MaxEpoch = 1
INIT Init
NEXT Next
INVARIANTS TypeOK OneGroup
