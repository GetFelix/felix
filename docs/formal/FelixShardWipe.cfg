\* A follower loses its disk and comes back empty, on the report as
\* implemented (FelixShardReportFloor.cfg). With storage identities the
\* leader starts a follower's count over when its identity changes, and its
\* report names the identity each follower was counted under, so placement
\* never promotes the empty copy on a count it earned before the wipe.
\* FelixShardWipeNoIds.cfg is the same without identities, and loses a record.
\* The clock stops inside the first lease, which keeps this under a minute, so
\* no promotion happens here: this configuration checks the acknowledgement
\* (AckedOnLiveMajority), which happens inside one lease. Promotion after a
\* wipe is FelixShardWipeFull.cfg's, with the clock to 3, and
\* FelixShardWipeNoIds.cfg's.
\*
\* AckedOnMajority is left out: a wiped copy is a lost copy, and a record
\* acknowledged on two of three is on one after it.
\* AckedOnLiveMajority checks the acknowledgement instead, at the step that
\* makes it: the leader counts a follower toward its mark only once it has
\* answered that pass from the copy the leader knows (Answer, MarkCounts),
\* and acknowledges by that count rather than by logs it cannot see.
\*
\* Evidence: the implementation behaviours this configuration asserts.
\* `a_wiped_follower_on_an_idle_shard_is_not_reported_caught_up` -- Probe: the
\*   leader learns the new identity on an idle shard and stops counting the
\*   follower.
\* `a_restarted_follower_still_counts` -- the same identity keeps the count.
\* `a_wiped_followers_old_position_does_not_move_the_mark` -- MarkCounts:
\*   a follower's old answer does not count toward the mark.
\* `a_stale_connections_identity_does_not_count_a_wiped_follower` -- Answer:
\*   only an answer from the copy the leader knows counts, not the identity
\*   a pooled connection's handshake gave.
\* `a_current_broker_learns_the_storage_identity_it_dialled` -- the identity
\*   comes from the peer handshake.
\* `a_follower_whose_storage_changed_is_not_promoted_inside_the_ttl` --
\*   ByLeaderReport's identity check: placement never counts a follower
\*   from a report naming another identity.
\* `a_restarted_follower_counts_past_the_ttl_of_a_dead_leader` -- the same
\*   identity still counts.
\* A report never expires in the model, so promotion from a dead leader's
\* report held past its TTL (#1250) is inside what this checks. The model
\* compares with the identity a follower registered, and here the wipe
\* registers the new one at once. Placement can read the old registration
\* until a restarted broker registers again (docs/replication-design.md,
\* "Who may be promoted"); FelixShardWipeStripped.cfg separates the two steps.

