\* A follower loses its disk and comes back empty, on the report as
\* implemented (FelixShardReportFloor.cfg). With storage identities the
\* leader starts a follower's count over when its identity changes, and its
\* report names the identity each follower was counted under, so placement
\* never promotes the empty copy on a count it earned before the wipe.
\* FelixShardWipeNoIds.cfg is the same without identities, and loses a record.
\*
\* AckedOnMajority is left out: a wiped copy is a lost copy, and a record
\* acknowledged on two of three is on one after it.
\*
\* Evidence: the implementation behaviours this configuration asserts.
\* `a_wiped_follower_on_an_idle_shard_is_not_reported_caught_up` -- Probe: the
\*   leader learns the new identity on an idle shard and stops counting the
\*   follower.
\* `a_restarted_follower_still_counts` -- the same identity keeps the count.
\* `a_wiped_followers_old_position_does_not_move_the_mark` -- ReportCounts:
\*   a follower counts only under the identity it has now, so one wiped and
\*   not yet probed releases no record.
\* `a_current_broker_learns_the_storage_identity_it_dialled` -- the identity
\*   comes from the peer handshake.
\* ByLeaderReport's identity check is placement's, which lands with the
\* control-plane part of #1266; until then the report carries the identities
\* and nothing reads them.

