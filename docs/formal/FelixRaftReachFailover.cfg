\* A witness for FelixRaft.cfg, to show its checks do not pass for want of
\* behaviour. `NeverFailover` says this never happens, and TLC must find that
\* it does: a record acknowledged under one leader is held, committed, by the
\* leader of a later term after a crash.
\*
\* Evidence: the raft_log adapter tests in felix-storage:
\*   `a_cut_after_the_callback_keeps_the_entries`,
\*   `entries_read_back_with_their_term_and_kind`.

SPECIFICATION Spec

CONSTANTS
    Servers = {a, b, c}
    Nobody = Nobody
    MaxTerm = 2
    MaxWrites = 1
    MaxMembers = 0
    MaxCrashes = 1
    MaxSnapshots = 0
    Consumer = FALSE
    AckBeforeFlush = FALSE
    VoteNotDurable = FALSE
    LeaderResumes = FALSE
    TornTailKept = FALSE
    TruncateNotDurable = FALSE
    RecoveredTailUnsynced = FALSE
    SaveCommittedUnflushed = FALSE
    PurgeBeforeSnapshot = FALSE
    SnapshotTwoRenames = FALSE
    CommitPriorTerm = FALSE
    DeliverUncommitted = FALSE
    SkipsNotCounted = FALSE

SYMMETRY Symm

INVARIANTS
    NeverFailover
