\* FelixGroups.cfg with cursors served as they stand, unchecked. A replica
\* whose dead-letter log was replaced by a newer leader's, or lost its tail
\* in a crash, keeps a cursor past a record whose dead letter is gone;
\* promoted, it serves it. TLC finds the skip. This is why a cursor is
\* checked before the shard is served.
\*
\* Evidence: none, this models the broker without the check.

SPECIFICATION Spec

CONSTANTS
    Replicas = {a, b, c}
    G = 2
    N = 1
    MaxGen = 3
    MaxCrashes = 1
    MaxCursors = 2
    CheckCursors = FALSE
    DependencyGen = TRUE
    KeepGroups = TRUE
    SplitSources = FALSE
    SyncBeforeShip = TRUE

SYMMETRY Symmetry

INVARIANT NoSkip
