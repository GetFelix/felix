\* Two control-plane instances failing a shard over at once: one reads and
\* writes in a single step, the other acts on a read it took earlier. Every
\* assignment write lands only at the generation its read saw. No planned
\* moves and no client writes, so time can run past a lapse and a promotion.
\*
\* `CasWrites = FALSE` is the same pair writing unconditionally, in
\* FelixShardStalePromotion.cfg, and it promotes two followers.
\* Evidence: the implementation behaviours this configuration asserts.
\* `a_promotion_planned_from_an_old_read_is_not_written_later` -- CasWrites:
\*   a promotion decided from a read that predates another promotion is not
\*   written.
\* `a_placement_planned_against_no_assignment_does_not_overwrite_one` -- nor is
\*   a placement decided against no assignment, once there is one.

