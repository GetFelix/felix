\* The design WITHOUT report-before-mark: a leader may acknowledge under
\* Quorum before the control plane has been told which replica holds the
\* record. This is what the broker did before #268, and TLC finds the trace:
\* the leader ships to one follower, acknowledges, dies before reporting, and
\* the control plane promotes the other follower from a report that predates
\* the acknowledgement.
\*
\* Expected to violate AckedSurvive. That is what makes the ordering in
\* `publish_mark` demonstrably load-bearing rather than merely present.
\* Evidence: this configuration REMOVES an ordering the implementation has, so
\* the citation is what proves the ordering is there to remove.
\* `a_failed_replica_report_holds_the_quorum_mark_back` -- the broker holds the
\*   mark when the report does not land. Drop that and an acknowledgement can
\*   precede the report describing it, which is the trace TLC finds here.
\* Planners = {}: every decision reads and writes in one step, so CasWrites
\*   has nothing to compare. The StalePlanner and StalePromotion
\*   configurations are where a read is held across another write.

SPECIFICATION Spec

