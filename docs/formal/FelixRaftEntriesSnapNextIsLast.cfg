\* FelixRaftEntriesSnapshot.cfg with the snapshot carrying the offset of its
\* last record instead of the one after it, and followers that store the
\* leader's stamp without deriving their own. A broker that installed the
\* snapshot is elected and stamps its record at an offset a committed one
\* holds: the two members derive the base differently, and an offset is
\* given out twice. Only that check is listed: with a subscriber,
\* DeliveredInOrder catches the same bug first (depth 29).
\*
\* Evidence: none, this pins the reason a snapshot carries its next offset.

SPECIFICATION Spec

CONSTANTS
    Servers = {a, b, c}
    Nobody = Nobody
    MaxTerm = 2
    MaxWrites = 2
    MaxMembers = 0
    MaxCrashes = 0
    MaxSnapshots = 1
    Consumer = FALSE
    AckBeforeFlush = FALSE
    VoteNotDurable = FALSE
    LeaderResumes = FALSE
    TornTailKept = FALSE
    TruncateNotDurable = FALSE
    RecoveredTailUnsynced = FALSE
    SaveCommittedUnflushed = FALSE
    PurgeBeforeSnapshot = FALSE
    SnapshotTwoRenames = FALSE
    CommitPriorTerm = FALSE
    DeliverUncommitted = FALSE
    SkipsNotCounted = FALSE
    ZeroTakesOffset <- ZeroTakesOffsetOff
    SnapNextIsLast <- Yes
    StampNotChecked <- Yes
SYMMETRY Symm

INVARIANTS
    TypeOK
    OffsetNeverReused
