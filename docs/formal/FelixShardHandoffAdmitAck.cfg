\* A planned handoff under `Leader` consistency with the write acknowledged
\* when it is admitted, which is the broker's default: the ack goes out when
\* the publish is queued. The write holds the fence from admission, so its
\* claim is not refused and the drained report waits for it, and TLC finds no
\* acknowledged write the successor lacks. FelixShardHandoffAdmitAckClaimFence.cfg
\* is the same move with the fence taken at the claim.
\* Evidence: the implementation behaviours this configuration asserts.
\* `a_publish_acked_on_enqueue_is_written_across_a_move` -- AckOnAdmit with
\*   FenceFromAdmit: a publish acknowledged when queued, then fenced, is
\*   still written; `a_batch_acked_on_enqueue_is_written_across_a_move` on
\*   the batch path the binary frame takes.
\* `a_durable_publish_claimed_after_the_fence_is_refused` -- a publish
\*   acknowledged only once written keeps the check at the claim.
\* `a_draining_shard_reports_drained_once_its_fence_is_quiet` -- the drained
\*   report counts what is inside the fence, which now includes the queue.

SPECIFICATION Spec

CONSTANTS
    Brokers = {a, b, c}
    L = 4
    Margin = 2
    Eps = 1
    Drift = 0
    MaxTime = 5
    MaxWrites = 1
    CheckAtCommit = TRUE
    Quorum = FALSE
    Promotion = "leader-report"
    ReportBeforeAck = TRUE
    Handoff = TRUE
    WaitForDrained = TRUE
    FenceAtClaim = TRUE
    AckOnAdmit = TRUE
    FenceFromAdmit = TRUE
    MaxMoves = 1
    Planners = {}
    CasWrites = TRUE
    StageMove = FALSE
    LearnerVotes = FALSE
    Resends = FALSE
    SequencesInLog = TRUE
    Cancel = FALSE
    CancelCas = TRUE
    ReportBound = "acknowledged"
    AckChecksLease = TRUE
    AckOnResponse = FALSE
    AckByFollowers = FALSE
    FenceOnPromote = FALSE

SYMMETRY Symm

INVARIANTS
    TypeOK
    AtMostOneServing
    AckedSurvive
    AckedAgree
    NoTruncationBelowHwm
    NoStaleCommit
    AckedOnMajority
