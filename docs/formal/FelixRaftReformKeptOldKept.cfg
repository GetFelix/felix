\* Two re-forms with kept copies, epoch 0 not empty. Epoch 0 commits two
\* records and its leader is declared dead with the longer log. The first
\* re-form, marked, keeps what the others vouch for. In epoch 1 the dead
\* broker returns with its epoch-0 copy, which the second re-form reads
\* although epoch 1 never placed it. The epoch-1 cap keeps that copy from
\* vouching above the epoch-1 base, so no offset is given out with two
\* records, and Return and the plan's unlisted-broker clause are exercised.
\*
\* Evidence: none, this models the design for #2250, which is not built.

