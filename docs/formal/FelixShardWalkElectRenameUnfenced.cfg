\* FelixShardWalkElectRename.cfg with the renamed leader opening at once
\* instead of fencing (`RenameUnfenced`). The elected leader acknowledged a
\* record on a majority of the set being left, and the renamed leader, which
\* never fenced that set, opens without it. The broker reopens a shard whose
\* open failed as a new term, fenced, which is what prevents this.
\* Only AckedHeldByLeader is checked, as in the other walks' twins: without
\* the fence a candidate can also win an election at the renamed leader's
\* generation, and a walk may find that two-leader trace first.
\*
\* Evidence: `a_refusal_at_the_elected_generation_names_the_leader_again_above_it`
\*   (services/felix-controlplane-service/src/cluster/placement/tests/refused.rs),
\*   `a_promised_generation_is_recorded_as_refused`
\*   (services/felix-broker-service/src/shards/lifecycle/tests/refused.rs) and
\*   `a_fence_a_majority_promised_away_is_refused`
\*   (crates/server/felix-replication/src/promotion/tests.rs).

SPECIFICATION Spec

