\* FelixShardFencedCrashUnprobed.cfg with two promotions, each leader blind
\* to its followers' identities until it asks, and its reports carrying the
\* identity its own promotion named each replica by (`NameByInheritance`,
\* #1574). A crash may be the process's, which keeps the identity, or the
\* machine's, which rotates it (`ProcessCrashes`, `KeepIdOnSameBoot`).
\*
\* A leader promoted at the first failover reports before it has reached a
\* follower, the second failover names that follower by the identity the
\* first held it to, and its fence answer counts. TLC finds no acknowledged
\* record lost: the follower gave every acknowledgement it ever gave from that
\* copy or one before it, and a copy that lost any comes back under another
\* identity. FelixShardFencedCrashInheritedCounts.cfg shows the count happens.
\*
\* Invariants as FelixShardFencedCrash.cfg. AckedSurvive is left out with it:
\* both promotions are on suspicion, and the old leader serves until it hears
\* of its successor, by design.
\*
\* Too large to finish exhaustively: sampled by the nightly walks
\* (tla-walk.yml). FelixShardFencedLeaderCrashTwiceNamesByInheritance.cfg is
\* the inherited-name configuration checked exhaustively.
\*
\* Evidence: the implementation behaviours this configuration asserts.
\* `a_follower_not_reached_yet_is_named_by_the_promotions_identity` --
\*   Report: `inh`, only for a follower with no identity.
\* `a_leader_still_fencing_reports_no_identity_from_its_fence_answers` --
\*   a leader reports only once open, naming one it has not reached by `inh`.
\* `a_later_generation_inherits_no_names` -- `inh` is the promotion's own.
\* `a_member_the_report_never_reached_is_named_by_the_inherited_identity` --
\*   Named under NameByInheritance.
\* `inherited_storage_waits_for_every_member` -- the field reaches every
\*   control-plane member or none.
\* `a_crash_in_the_same_boot_keeps_the_id` -- Crash with `machine` false.
\* `a_crash_in_another_boot_rotates_the_id` -- Crash with `machine` true.

