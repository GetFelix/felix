\* FelixShardElectWipeNonVoterGroups.cfg with the promoted leader's set write
\* dropping its own wiped mark (`KeepSetDropsMark`), as `keep_own_set` did.
\* TLC is expected to find an acknowledged group record the new leader does
\* not hold (CountersHeldByLeader): it is acknowledged on {a, c}; c is wiped
\* and re-admitted with its group log behind; promoted, c keeps its set,
\* which drops the mark, and opens on the group answers of b, which lags.
\*
\* Evidence: `a_wiped_leader_keeps_its_mark_through_a_failed_group_take` in
\* crates/server/felix-replication/src/promotion/tests/groups.rs and
\* `a_newer_set_keeps_the_wiped_mark` in
\* crates/server/felix-storage/src/disk_log/tests/replica_set.rs.

