\* A planned handoff under `Leader` consistency, where the leader's own commit
\* is the acknowledgement: the case in which a write landing after the
\* drained report is an acknowledged write the successor does not hold.
\* The claim checks the fence, as the broker's does, and TLC finds no such
\* write. FelixShardHandoffNoClaimFence.cfg is the same move without that
\* check.
\* Evidence: the implementation behaviours this configuration asserts.
\* `the_fence_is_open_only_while_active` -- ObserveFence closes the write
\*   fence, however the move arrives.
\* `a_durable_publish_claimed_after_the_fence_is_refused` -- FenceAtClaim, on
\*   the publish path; `cache_writes_after_the_fence_are_refused`,
\*   `a_counter_add_after_the_fence_is_refused`,
\*   `an_ack_after_the_fence_is_refused` and
\*   `a_forwarded_publish_after_the_fence_is_refused` on the others.
\* `a_draining_shard_reports_drained_once_its_fence_is_quiet` -- the drained
\*   report counts what is inside the fence.
\* `a_drained_report_cuts_over_to_the_successor` -- CutOver: the successor is
\*   named only from a drained report that lists it caught up.

SPECIFICATION Spec

