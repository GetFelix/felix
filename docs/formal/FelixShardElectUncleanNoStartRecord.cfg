\* FelixShardElectUnclean.cfg with no generation-start record, as on a
\* fleet that has not finalized `generation_start`. A batch still vouches
\* for a copy once it is level with the leader up to where the leader's
\* generation starts (#2029), and every acknowledged record survives.
\*
\* Evidence: `a_leader_without_a_start_record_vouches_for_the_copy_on_an_idle_shard`
\* and `a_partly_reshipped_copy_is_not_vouched_for_until_it_holds_the_leaders_generation`
\* (replica/tests/fence.rs) in crates/server/felix-replication.
\* AckedOnMajority is left out, as in the other crash configurations.

SPECIFICATION Spec

