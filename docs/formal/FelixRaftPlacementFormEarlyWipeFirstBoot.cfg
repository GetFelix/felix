\* FelixRaftPlacementFormEarlyWipe.cfg from a first start: the volume may be
\* lost at any point of forming, between a member's mark, the other
\* members' records and its first vote. A member that keeps its mark goes on
\* forming although the others name it, and a member that starts late forms
\* beside members that already vote.
\*
\* Evidence: `a_member_interrupted_after_its_mark_resumes_forming`,
\*   `no_vote_before_every_peer_records_the_member`,
\*   `a_late_first_boot_member_forms_against_formed_leaderless_peers`.

