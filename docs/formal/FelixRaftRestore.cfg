\* A restore from a backup point as built: the re-form starts above the point,
\* the restored floor and the copied reservation, with no offset gap. The
\* copied directory is the leader's when it is copied.
\*
\* Evidence: `an_append_past_the_reservation_raises_it_and_one_below_does_not` --
\*   a write past the reservation raises it first;
\* `a_rotation_carries_the_highest_reservation_into_the_new_copy` -- the
\*   restored copy carries it; `the_reservation_pads_above_an_entry_nothing_vouches_for`
\*   -- the first index is above it.

SPECIFICATION Spec

CONSTANTS
    MaxWrites = 4
    MaxAfter = 2
    MaxNew = 1
    Step = 2
    Gap = 0
    NoReserve = FALSE
    LeaderMoves = FALSE

INVARIANT
    ReserveCovers
    BaseKept
    BackedUpNeverReused
