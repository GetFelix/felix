\* Kept, four brokers, {a, b, c} to {a, b, d} through a joint configuration,
\* two terms, one rotation, one broker declared dead, and one snapshot that
\* can purge membership entries (Purge, issue 2689). The re-form reads each
\* copy's membership entries above its purge and its snapshot's membership.
\* The ordered targets are left out (OrderedNotRead), so the copies' own
\* memberships are the only source of every voter set after the seed.
\*
\* Evidence: `a_membership_purged_from_the_log_is_read_from_the_snapshot` --
\*   the report reads the membership in a copy's snapshot metadata as well
\*   as its log entries (raft_copy/report.rs); and
\*   `a_purge_past_the_snapshot_fails_the_report` -- a log purged past its
\*   snapshot fails the answer, so the model's purge stays at or below it.

SPECIFICATION Spec

CONSTANTS
    MaxPurges <- OnePurge
    OrderedNotRead <- On
    Brokers = {a, b, c, d}
    InitBrokers = {a, b, c}
    None = None
    MaxEpoch = 1
    MaxTerm = 2
    MaxWrites = 2
    MaxChangeSteps = 2
    ChangeOut = c
    ChangeIn = d
    MaxPlace = 1
    MaxRotations = 1
    MaxRejoins = 0
    MaxRestarts = 0
    MaxMsgs = 0
    MaxPlans = 1
    MaxDead = 1
    DeadRuns = FALSE
    WaitPlaced = TRUE
    Floor = "trailing"
    ReformBeforeAll = FALSE
    EpochNotChecked = FALSE
    ReportNotPromise = FALSE
    PlanNotRechecked = FALSE
    RotatedNotWaited = FALSE
    RetireNotDurable = FALSE
    VoteByBroker = FALSE
    BaseNotHighest = FALSE
    NoCas = FALSE
    SoloPlacedTwo = FALSE
    StopNotRechecked = FALSE
    PlacedForgotten = FALSE
    FloorIndexOnly = FALSE
    CutToCommit = FALSE
    Kept = TRUE
    Alone = "off"
    Reserve = "every"
    MaxCuts = 0
    MaxReturns = 0

SYMMETRY Symm

INVARIANTS
    TypeOK
    BootIsRecorded
    PlacedIsRecorded
    PurgeBelowSnapshot
    OneLeaderPerTerm
    AckedSurvive
    StateMachineSafety
    OffsetNeverReused

PROPERTIES
    KeptLossBound
