\* FelixShardElectWipeNonVoterCreates.cfg where a copy with no set file votes,
\* wiped or not (`CreateCountsEmpty`), as if an empty set could only mean a new
\* shard. TLC finds two leaders at one generation before any write: a fences
\* at 1 and b and c answer; b stands at 2, c promises it, and b opens on
\* {b, c}; c is wiped and loses that promise with its set file; a, still
\* fencing, stands at 2, c promises 2 again, and a opens on {a, c}
\* (OneLeaderPerGeneration). So the broker tells a new copy from a wiped one
\* by its storage id, not by the set file being empty.
\*
\* Evidence: none, the twin is the rule weakened.

SPECIFICATION Spec

CONSTANTS
    Brokers = {a, b, c}
    L = 4
    Margin = 0
    Eps = 0
    Drift = 0
    MaxTime = 0
    MaxWrites = 1
    CheckAtCommit = FALSE
    Quorum = TRUE
    Promotion = "log-order"
    ReportBeforeAck = FALSE
    Handoff = FALSE
    WaitForDrained = TRUE
    FenceAtClaim = TRUE
    AckOnAdmit = FALSE
    FenceFromAdmit = FALSE
    MaxMoves = 0
    Planners = {}
    CasWrites = TRUE
    StageMove = FALSE
    LearnerVotes = FALSE
    Resends = FALSE
    SequencesInLog = TRUE
    Cancel = FALSE
    CancelCas = TRUE
    ReportBound = "acknowledged"
    AckChecksLease = FALSE
    AckOnResponse = FALSE
    AckByFollowers = TRUE
    FenceOnPromote = TRUE
    LabelOnReceipt = FALSE
    StartRecord = TRUE
    ReportFromAnswers = FALSE
    ReportFloor = FALSE
    Spares = {}
    ReplaceOnPromote = FALSE
    SeatHoldsCopy = TRUE
    Grow = FALSE
    PromoteDestination = FALSE
    Counters = FALSE
    CounterCatchUp = FALSE
    Ballots = TRUE
    Elections = 2
    FenceEveryChange = FALSE

    Suspicions = 0
    SetCheck = TRUE
    JointFence = TRUE
    Adopt = 3
    AdoptMatch = TRUE
    Swaps = 0
    PreVote = FALSE
    Wipes = 0
    StorageIds = FALSE
    LosePromises <- Yes
    WipedNonVoter <- Yes
    WipedLearnsSet <- Yes
    Creates <- Yes
    CreateCountsEmpty <- Yes
SYMMETRY Symm

INVARIANTS
    TypeOK
    OneLeaderPerGeneration
    AckedHeldByLeader
    AckedAgree
    AckedOnMajority
    NoTruncationBelowHwm
    AdoptedMatchesOpened
    SetChangesJoint
