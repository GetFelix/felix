\* FelixShardElectWipeNonVoterCreates.cfg where a copy with no set file votes,
\* wiped or not (`CreateCountsEmpty`), as if an empty set could only mean a new
\* shard. TLC finds a lost write: a opens at 1 on {a, b, c}; write 1 is
\* acknowledged on {a, b}; b is wiped, losing its set file with its log; c
\* stands at 2, b answers, and c opens without write 1 (AckedHeldByLeader).
\* So the broker tells a new copy from a wiped one by its storage id, not by
\* the set file being empty.
\*
\* Evidence: none, the twin is the rule weakened.

SPECIFICATION Spec

CONSTANTS
    Brokers = {a, b, c}
    L = 4
    Margin = 0
    Eps = 0
    Drift = 0
    MaxTime = 0
    MaxWrites = 1
    CheckAtCommit = FALSE
    Quorum = TRUE
    Promotion = "log-order"
    ReportBeforeAck = FALSE
