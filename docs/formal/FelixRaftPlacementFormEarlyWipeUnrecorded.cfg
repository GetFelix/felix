\* FelixRaftPlacementFormEarlyWipe.cfg without the record: every answer is
\* empty, so the wiped member forms again under its id, having forgotten a
\* vote it gave in a newer term. It votes for a candidate of an older term,
\* both lead, and the older leader acknowledges a write the newer one lacks.
\* Must violate AckedHeldSurvive (issue 2374).
