\* FelixShardWalkElectSwap.cfg with the control plane naming its leader again
\* after an election it recorded and did not adopt (`Renames`, CpRename), for
\* TLC's simulation mode. Cut-overs, elections on the set being left,
\* records that adopt only the generation, renames, promotions and a planner
\* acting on a held read, in one behaviour.
\* FelixShardWalkElectRenameUnfenced.cfg opens the renamed leader without
\* its fence.
\*
\* No SYMMETRY: simulation stores no states. A pass means the walks found
\* nothing.
\*
\* Evidence: `a_refusal_at_the_elected_generation_names_the_leader_again_above_it`
\*   (services/felix-controlplane-service/src/cluster/placement/tests/refused.rs),
\*   `a_promised_generation_is_recorded_as_refused`
\*   (services/felix-broker-service/src/shards/lifecycle/tests/refused.rs) and
\*   `a_fence_a_majority_promised_away_is_refused`,
\*   `a_promise_away_with_the_other_replica_down_is_refused`
\*   (crates/server/felix-replication/src/promotion/tests.rs) and
\*   `a_promise_away_beside_another_refusal_stays_pending`
\*   (crates/server/felix-replication/src/promotion/tests/identity.rs).
\*
\* The control plane's own leader elected on another set is reissued on it
\* (`ReissueOwnOnOtherSet`, #1929): without it the walk reaches
\* AdoptedMatchesOpened's violation (FelixShardElectAdoptAboveKeptSet.cfg).

