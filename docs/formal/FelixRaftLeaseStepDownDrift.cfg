\* FelixRaftLeaseStepDownWrite.cfg with drift and no write: clocks gain 1
\* or 2 a tick, a lease of 1 against an election timeout of 2, the smallest
\* pair the inequality allows with drift. The write properties are checked
\* without drift in FelixRaftLeaseStepDownWrite.cfg
\* and with drift in FelixRaftLeaseAck.cfg.
\*
\* Evidence: none, `admit_local_ack` always refuses until issue 2249 builds this rule.

