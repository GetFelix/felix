\* An idempotent producer re-sending across a failover: its write lands, the
\* leader's lease lapses, a replica is promoted, and the write is sent again.
\* The promoted broker answers from its log, so the write is never stored
\* twice. One write, because acknowledgement here is per write rather than
\* per record: with two, a stale copy on a deposed leader reads as a second
\* acknowledged record at its offset (AckedAgree) until it is truncated.
\*
\* `SequencesInLog = FALSE` is the leader keeping sequences in memory, in
\* FelixShardIdempotentFailoverMemory.cfg, and it stores the write twice.
\* Evidence: the implementation behaviours this configuration asserts.
\* `a_replica_answers_a_re_send_of_what_it_was_shipped` -- SequencesInLog: a
\*   replica knows every batch it was shipped, from the records alone.
\* `a_restarted_leader_answers_a_re_send_from_its_log` -- and so does a broker
\*   that reopens its log.
\* `a_re_sent_batch_lands_once` -- Resend: a producer's batches are serialised,
\*   and one already held is answered without appending.
\* `a_producer_keeps_its_sequence_when_its_leader_dies` -- NoDuplicate across
\*   a failover, against a real cluster.
\* Planners = {}: every decision reads and writes in one step, so CasWrites
\*   has nothing to compare.

SPECIFICATION Spec

CONSTANTS
    Brokers = {a, b, c}
    L = 4
    Margin = 2
    Eps = 1
    Drift = 0
    MaxTime = 7
    MaxWrites = 1
    CheckAtCommit = TRUE
    Quorum = TRUE
    Promotion = "leader-report"
    ReportBeforeAck = TRUE
    Handoff = FALSE
    WaitForDrained = TRUE
    FenceAtClaim = TRUE
    AckOnAdmit = FALSE
    FenceFromAdmit = FALSE
    MaxMoves = 0
    Planners = {}
    CasWrites = TRUE
    StageMove = FALSE
    LearnerVotes = FALSE
    Resends = TRUE
    SequencesInLog = TRUE
    Cancel = FALSE
    CancelCas = TRUE
    ReportBound = "acknowledged"
    AckChecksLease = TRUE
    AckOnResponse = FALSE
    AckByFollowers = FALSE
    FenceOnPromote = FALSE
    LabelOnReceipt = FALSE
    StartRecord = FALSE
    ReportFromAnswers = FALSE
    ReportFloor = FALSE
    Spares = {}
    ReplaceOnPromote = FALSE
    SeatHoldsCopy = TRUE
    PromoteDestination = FALSE

SYMMETRY Symm

INVARIANTS
    TypeOK
    AtMostOneServing
    AckedSurvive
    AckedAgree
    NoTruncationBelowHwm
    NoStaleCommit
    AckedOnMajority
    NoDuplicate
