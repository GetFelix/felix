\* A piece of FelixShardElectAdoptFailover.cfg, which did not finish in six
\* hours: the behaviours whose first failover takes generation 3, where the
\* promoted broker's own set is not the control plane's, one write was admitted, and
\* no replica had promised past the control plane's generation.
\* The pieces split every first failover (`SplitAtFailover`, `CutOverPiece`),
\* and each also checks everything before it, so together they reach every
\* state FelixShardElectAdoptFailover.cfg does.
\* Not checked: it did not finish in six hours (156M distinct states, no
\* violation), so it needs splitting again.
\*
\* Evidence: as FelixShardElectAdoptFailover.cfg, `a_failover_fences_both_the_recorded_set_and_the_logs`
\*   and `a_log_set_naming_another_copy_is_fenced_beside_the_one_before`
\*   (crates/server/felix-replication/src/promotion/tests/joint.rs).

