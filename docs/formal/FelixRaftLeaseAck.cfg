\* FelixRaftLease.cfg with one write, for the acknowledgement rule. To afford
\* the write, time is coarser: lease 1 against an election timeout of 2.
\*
\* No broker restarts here, as in FelixRaftLease.cfg: see the note there on
\* issue 2307.
\*
\* Evidence: none, `admit_local_ack` always refuses until these configs pass
\* and the restart rule of issue 2307 is built.

