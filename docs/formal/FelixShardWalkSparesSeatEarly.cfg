\* FelixShardWalkSpares.cfg with the seat going ahead however little the
\* newcomer holds (`SeatHoldsCopy = FALSE`), as FelixShardFencedAckSeatEarly.cfg
\* does exhaustively. The walk must find the record lost within its budget
\* (AckedHeldByLeader): that is what shows the walks are long and varied
\* enough to reach a lost record at all. Only that invariant is checked, so
\* the first violation a walk finds is the one this expects.
\*
\* Evidence: none, this models the seat rule placement had before
\* `seating_a_replacement_keeps_what_the_old_set_acknowledged`.

