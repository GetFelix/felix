\* A group that exists while a waiver still names slot c, and c is up and
\* answers. A waiver excuses silence only, so a wiped member does not form
\* past c's answer when c holds the log. As in
\* FelixRaftPlacementFormAfterWipes.cfg the step is never taken; the twin
\* FelixRaftPlacementFormWaiverExcuses.cfg shows what the rule stops.
\*
\* Evidence: `form_without_never_overrides_an_answering_peer`,
\*   `a_waiver_excuses_only_silence`.

SPECIFICATION Spec

CONSTANTS
    Brokers = {a, b, c}
    Nobody = Nobody
    InitBrokers = {a, b, c}
    MaxTerm = 2
    MaxWrites = 1
    MaxCalls = 0
    MaxTargets = 0
    MaxWipes = 1
    MinVoters = 3
    Rotate = FALSE
    Retain = TRUE
    StaleTargets = FALSE
    SkipJoint = FALSE
    NoWithhold = FALSE
    WithheldCounts = FALSE
    AnswerAnyId = FALSE
    DeleteOnTarget = FALSE
    PlaceDoomed = FALSE
    Forming = TRUE
    FirstBoot = FALSE
    FormMajority = FALSE
    Waived = {c}
    Absent = {}
    EarlyWipes = FALSE
    WaiverExcusesAnswer = FALSE
    WaiverAnyNumber = FALSE

SYMMETRY Symm

INVARIANTS
    TypeOK
    OneLeaderPerTerm
    LogMatching
    LeaderCompleteness
    StateMachineSafety
    AckedSurvive
    AckedOnDisk
    DeliveredAgree

PROPERTIES
    CommitNeverLowers
