\* FelixRaftRestoreRepeated.cfg with the gap added past the backup's end as
\* well as past the line. A backup taken from a restored epoch ends above
\* the line, its restore starts a further gap above it, and the lead decays
\* only at the line's slope less the shard's rate: an older backup restored
\* soon after starts below offsets that epoch gave out.
\*
\* Evidence: none, this pins the rejected design.

SPECIFICATION Spec

CONSTANTS
    Rate = 1
    TimeRate = 2
    Gap = 10
    Skew = 1
    MinApart = 5
    MaxTime = 15
    MaxBackups = 2
    MaxRestores = 3
    Line = TRUE
    EndGap = TRUE
    Batch = FALSE
    MaxBatch = 1
    Capacity = 1
    Step = 0
    MaxCuts = 0
    MaxLeaders = 0
    NoBucket = FALSE
    BucketStartsFull = FALSE
    RaiseFromNext = FALSE

INVARIANT
    OffsetNeverReused
