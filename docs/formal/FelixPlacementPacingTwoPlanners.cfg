\* Two instances starting copies under a limit of one. Either may hold the
\* lease, and lose it with a read in hand; `p2` also reads without it, as an
\* operator's request does. Every start is fenced by the placement token its
\* planner read.
\*
\* Expected to pass.
\* Evidence: `two_instances_cannot_both_take_the_last_move_slot` -- a start
\*   decided from a read taken before another placement write is fenced, in
\*   memory, Postgres and Raft.
\* `a_pass_planned_before_an_operators_move_starts_nothing_beside_it` -- an
\*   operator's move fences a pass planned before it.
\* `an_ex_holders_pass_is_fenced_after_a_takeover` -- taking the lease
\*   advances the token.
\* `a_placement_write_is_fenced_by_any_placement_write_since_its_read` -- a
\*   planner's own writes do not fence it.

SPECIFICATION Spec

CONSTANTS
    Shards = {s1, s2, s3}
    Nodes = {n1, n2, n3}
    MaxConcurrent = 1
    MaxPerNode = 1
    CountReplacements = TRUE
    Planners = {p1, p2}
    Operators = {p2}
    Fenced = TRUE

SYMMETRY Symm

INVARIANTS
    TypeOK
    CopiesWithinLimit
    FencedOnlyInAMove
