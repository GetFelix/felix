\* FelixShardMoveGiveUpTwoDrop.cfg with the destination kept. TLC still
\* finds a record gone (AckedHeldByLeader): the trim takes the set back to one
\* copy, and its unclean crash loses it.
\*
\* Evidence: none, this models the factor's limit, not a rule.

SPECIFICATION Spec

CONSTANTS
    Nodes = {a, b}
    First = a
    NoNode = NoNode
    MaxGen = 5
    MaxWrites = 2
    MaxCrashes = 1
    MaxMoves = 1
    Replication <- One

INVARIANTS
    OneLeaderPerGeneration
    AckedHeldByLeader
    AtMostOneServing

CHECK_DEADLOCK FALSE
