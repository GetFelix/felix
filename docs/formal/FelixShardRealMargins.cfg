\* The code's margins with a write: the broker gives up a quarter of the lease
\* (`Eps = L/4`), the control plane marks a silent broker down a quarter past
\* its expiry (`Margin = L/4`), clocks drift by a quarter, and a `Quorum`
\* write is replicated, acknowledged and carried across a promotion. The
\* acknowledgement is released as the code releases it: on the answer the
\* leader got for its report (`AckOnResponse`), which stays true for it after
\* the control plane has moved on, and only while its lease is valid.
\*
\* One write and time to 5 keep this to a few minutes. That still reaches a
\* promotion after a lapse (the earliest is at 5) and a leader acknowledging
\* after it was deposed. Run by hand to time 6 it passes too, in 13.4M
\* distinct states and about 17 minutes on four cores.
\* Evidence: the implementation behaviours this configuration asserts.
\* `a_quarter_of_the_lease_is_surrendered_as_margin` -- Eps.
\* `a_silent_broker_outlives_the_timeout_by_the_regrant_margin` -- Margin.
\* `the_regrant_margin_defaults_to_a_quarter_and_cannot_go_below_it` -- the
\*   margin cannot be configured below what this checks.
\* `a_failed_replica_report_holds_the_quorum_mark_back` -- ReportBeforeAck and
\*   AckOnResponse: the mark moves on the report's answer, and is held when
\*   the report does not land.
\* `a_quorum_ack_is_withheld_when_the_lease_lapses_while_it_waits` --
\*   AckChecksLease: the acknowledgement is released only on a valid lease.
\* `a_broker_suspended_past_expiry_fails_the_commit_check_while_admission_still_passes`
\*   -- CheckAtCommit.
\* `the_furthest_ahead_replica_is_promoted` -- Promotion from the report.
\* Planners = {}: every decision reads and writes in one step, so CasWrites
\*   has nothing to compare.

SPECIFICATION Spec

CONSTANTS
    Brokers = {a, b, c}
    L = 4
    Margin = 1
    Eps = 1
    Drift = 1
    MaxTime = 5
    MaxWrites = 1
    CheckAtCommit = TRUE
    Quorum = TRUE
    Promotion = "leader-report"
    ReportBeforeAck = TRUE
    Handoff = FALSE
    WaitForDrained = TRUE
    FenceAtClaim = TRUE
    AckOnAdmit = FALSE
    FenceFromAdmit = FALSE
    MaxMoves = 0
    Planners = {}
    CasWrites = TRUE
    StageMove = FALSE
    LearnerVotes = FALSE
    Resends = FALSE
    SequencesInLog = TRUE
    Cancel = FALSE
    CancelCas = TRUE
    ReportBound = "acknowledged"
    AckChecksLease = TRUE
    AckOnResponse = TRUE

SYMMETRY Symm

INVARIANTS
    TypeOK
    AtMostOneServing
    AckedSurvive
    AckedAgree
    NoTruncationBelowHwm
    NoStaleCommit
    AckedOnMajority
    QuorumReportNamesASuccessor
