\* The lease with the margins the code actually runs: the broker gives up a
\* quarter of the lease (`Eps = L/4`), and the control plane regrants the
\* moment its own copy of the lease lapses (`Margin = 0`) -- placement adds no
\* regrant wait. With drifting clocks TLC finds two brokers serving at once,
\* so the broker's quarter alone is not a safety interval. This pins that
\* finding until the control plane waits out a margin of its own;
\* `task tla:check` expects it to fail.
\* Evidence: the margin this keeps is real in the code.
\* `a_quarter_of_the_lease_is_surrendered_as_margin` -- Eps: a broker stops
\*   serving before its own expiry, not at it.
\* Planners = {}: every decision reads and writes in one step, so CasWrites
\*   has nothing to compare.

SPECIFICATION Spec

CONSTANTS
    Brokers = {a, b, c}
    L = 4
    Margin = 0
    Eps = 1
    Drift = 1
    MaxTime = 8
    MaxWrites = 0
    CheckAtCommit = TRUE
    Quorum = TRUE
    Promotion = "log-order"
    ReportBeforeAck = TRUE
    Handoff = FALSE
    WaitForDrained = TRUE
    FenceAtClaim = TRUE
    AckOnAdmit = FALSE
    FenceFromAdmit = FALSE
    MaxMoves = 0
    Planners = {}
    CasWrites = TRUE
    StageMove = FALSE
    LearnerVotes = FALSE
    Resends = FALSE
    SequencesInLog = TRUE
    Cancel = FALSE
    CancelCas = TRUE
    ReportBound = "acknowledged"

SYMMETRY Symm

INVARIANTS
    TypeOK
    AtMostOneServing
    NoStaleCommit
