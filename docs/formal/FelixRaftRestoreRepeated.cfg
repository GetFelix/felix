\* Two restores from one backup, on a clock: the shard acknowledges at most
\* Rate = 1 offset per tick, and the first index adds TimeRate = 2 offsets
\* per tick since the point. The second restore reads exactly what the
\* first read; only the clock differs, and it starts past every offset the
\* first restored epoch gave out. The copied copy may stop leading.
\*
\* Evidence: `a_second_restore_from_the_same_backup_starts_past_the_first`
\*   and `a_restore_from_an_older_backup_starts_past_a_newer_ones_epoch`
\*   -- the time term is added past the point and the gap;
\*   `a_restore_writes_its_epoch_past_the_point_plus_the_gap` -- the
\*   control plane stamps the plan's time once and writes the first index
\*   in the epoch's base.

SPECIFICATION Spec

CONSTANTS
    MaxWrites = 3
    MaxAfter = 2
    MaxNew = 2
    Step = 1
    Gap = 1
    Rate = 1
    TimeRate = 2
    MaxTime = 3
    MaxRestores = 2
    NoReserve = FALSE
    LeaderMoves = TRUE

INVARIANT
    ReserveCovers
    BaseKept
    BackedUpNeverReused OffsetNeverReused
