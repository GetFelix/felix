\* Repeated restores on the time line: the shard gives out at most one
\* offset per tick, the line rises two per tick, each planning node's clock
\* is off by up to a tick, restores are five ticks apart. Two backups, three
\* restores, a backup can be taken from a restored epoch and an older one
\* restored after a newer one. No offset is given out twice.
\*
\* Evidence: `an_older_backup_restored_after_a_newer_one_starts_past_it`,
\*   `two_drills_of_one_backup_never_share_an_offset`,
\*   `a_slower_leader_clock_within_the_bound_starts_past_the_first` -- the
\*   first index takes the time line at the plan's time;
\*   `a_restore_writes_its_epoch_past_the_time_line_plus_the_gap` -- the
\*   control plane stamps its own clock once per plan.

SPECIFICATION Spec

CONSTANTS
    Rate = 1
    TimeRate = 2
    Gap = 10
    Skew = 1
    MinApart = 5
    MaxTime = 15
    MaxBackups = 2
    MaxRestores = 3
    Line = TRUE
    EndGap = FALSE
    Batch = FALSE
    MaxBatch = 1
    Capacity = 1
    Step = 0
    MaxCuts = 0
    MaxLeaders = 0
    NoBucket = FALSE
    BucketStartsFull = FALSE
    RaiseFromNext = FALSE
    BucketStartsEmpty = FALSE
    IssueBeforeRaise = FALSE
    Apart = 0

INVARIANT
    OffsetNeverReused
