\* FelixShardElectWipeNonVoterEvidenceOnly.cfg's fault with only the control
\* plane naming leaders (`Elections = 0`): a copy is a learner only once a
\* set names its old storage id (`ReplacedIdLearner` off). TLC is expected
\* to find an acknowledged write the next leader does not hold
\* (AckedHeldByLeader): the copy is wiped before it hears any set, the
\* failover's set names its new id, and it answers with an empty log.
\*
\* Evidence: `a_replaced_storage_id_is_a_learner` in
\* crates/server/felix-replication/src/replica/tests/non_voting.rs, and
\* `a_node_registered_under_another_id_starts_replaced` in
\* services/felix-broker-service/src/node/storage/tests.rs.

