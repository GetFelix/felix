\* NoCap's bounds with the install storing the leader's snapshot as it is.
\* A member installs a snapshot carrying floor 4, then the next leader's
\* carrying floor 3; a restart lowers its floor to 3 and a re-form that
\* reads only it gives out offset 4 again. Expected to violate
\* OffsetNeverReused. Steered by FloorDropPath to that history, so it fits
\* a PR shard; InstallFloor = "max" or "refuse" closes it.
\*
\* Evidence: none, purging a Raft stream shard is not built yet (issue 2602).

SPECIFICATION Spec

CONSTANTS
    Members = {a, b, c}
    Voters = {a, b, c}
    MaxIndex = 4
    MaxTrims = 2
    MaxChanges = 1
    MaxRestarts = 1
    MaxReforms = 1
    PurgeBelowFloorRule = TRUE
    InstallRule = TRUE
    InstallFloor = "replace"
    LeaderCaps = FALSE
    SnapAtApplied = FALSE
    TablesAtApplied = FALSE
    SnapFloorAtP = TRUE
    SnapCarriesHeaders = TRUE
    DropFirst = FALSE
    ReformReads = "full"
    ReformCarriesFloor = TRUE
    ReformStoresFloor = TRUE

CONSTRAINT FloorDropPath
SYMMETRY Symm

INVARIANTS
    OffsetNeverReused
