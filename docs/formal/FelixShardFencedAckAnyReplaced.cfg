\* FelixShardFencedAckAnyKept.cfg with the promotion swapping the old leader
\* for the spare, as failover's `choose_replicas` would. The new leader fences
\* a majority of the new set, which the spare and the new leader make on
\* their own, and opens without the record the old leader and the third
\* replica acknowledged: AckedHeldByLeader. AckedOnMajority is left out,
\* because it fails at the swap itself, before anything is lost.
\*
\* Evidence: `a_failover_onto_a_spare_broker_keeps_what_the_old_set_acknowledged`
\* loses the record this way with the old placement rule.

SPECIFICATION Spec

CONSTANTS
    Brokers = {a, b, c, d}
    L = 4
    Margin = 0
    Eps = 0
    Drift = 0
    MaxTime = 4
    MaxWrites = 2
    CheckAtCommit = FALSE
    Quorum = TRUE
    Promotion = "any"
    ReportBeforeAck = FALSE
    Handoff = FALSE
    WaitForDrained = TRUE
    FenceAtClaim = TRUE
    AckOnAdmit = FALSE
    FenceFromAdmit = FALSE
    MaxMoves = 0
    Planners = {}
    CasWrites = TRUE
    StageMove = FALSE
    LearnerVotes = FALSE
    Resends = FALSE
    SequencesInLog = TRUE
    Cancel = FALSE
    CancelCas = TRUE
    ReportBound = "acknowledged"
    AckChecksLease = FALSE
    AckOnResponse = FALSE
    AckByFollowers = TRUE
    FenceOnPromote = TRUE
    LabelOnReceipt = FALSE
    StartRecord = TRUE
    Spares = {d}
    ReplaceOnPromote = TRUE
    SeatHoldsCopy = TRUE
    PromoteDestination = FALSE

SYMMETRY Symm

INVARIANTS
    TypeOK
    AckedHeldByLeader
    AckedAgree
    NoTruncationBelowHwm
