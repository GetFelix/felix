\* A long random walk over planned moves under follower acks, for TLC's
\* simulation mode (`scripts/check_tla.sh --simulate`). The exhaustive move
\* configurations stop at one move and time to 1
\* (FelixShardFencedAckMoveShort.cfg and its staged and cancel twins); this
\* lifts the bounds so one behaviour can fence, cut over, cancel and fail over
\* many times, with drifting clocks.
\*
\* The run starts with a destination staged and copying (`StageMove`), so the
\* first move is a staged one and the later ones are not, and an operator may
\* cancel any fenced move (`Cancel`). Spares are left out: the spec checks them
\* only without handoff and cancel, in FelixShardWalkSpares.cfg.
\*
\* Ballots and the fence on every change of leader are on, as the broker
\* ships them (`FELIX_INTERNAL_FENCE`, on by default). The broker never elects
\* itself, so `Elections = 0` and no ballot ever meets a second leader at its
\* generation; FelixShardElectHandoff.cfg checks ballots against elections.
\*
\* Placement promotes on its followers' word, as it does once the fleet
\* acknowledges by its followers: at any generation up to `Suspicions`, on
\* any read, the old leader possibly alive and serving. Past that only a
\* lapsed lease promotes, so the later part of a walk still reaches the moves
\* a promotion would otherwise keep ending.
\*
\* Bounds: time to 40, `L = 2`, six writes, six moves. No SYMMETRY:
\* simulation stores no states. A pass means the walks found nothing, not
\* that nothing is there. FelixShardWalkMovesDestination.cfg is this with a
\* failover free to name the destination.
\*
\* Evidence: `a_quorum_failover_does_not_promote_a_move_destination`,
\* `a_drained_report_cuts_over_to_the_successor` (the cut-over),
\* `cancelling_a_fenced_move_hands_the_shard_back_to_its_leader` (the cancel),
\* and `a_leader_a_majority_cannot_reach_is_replaced_while_it_heartbeats`
\* (promotion on suspicion).

SPECIFICATION Spec

CONSTANTS
    Brokers = {a, b, c}
    L = 2
    Margin = 0
    Eps = 0
    Drift = 1
    MaxTime = 40
    MaxWrites = 6
    CheckAtCommit = FALSE
    Quorum = TRUE
    Promotion = "leader-report"
    ReportBeforeAck = FALSE
    Handoff = TRUE
    WaitForDrained = TRUE
    FenceAtClaim = TRUE
    AckOnAdmit = FALSE
    FenceFromAdmit = TRUE
    MaxMoves = 6
    Planners = {}
    CasWrites = TRUE
    StageMove = TRUE
    LearnerVotes = FALSE
    Resends = FALSE
    SequencesInLog = TRUE
    Cancel = TRUE
    CancelCas = TRUE
    ReportBound = "acknowledged"
    AckChecksLease = FALSE
    AckOnResponse = FALSE
    AckByFollowers = TRUE
    FenceOnPromote = TRUE
    LabelOnReceipt = FALSE
    StartRecord = TRUE
    ReportFromAnswers = FALSE
    ReportFloor = FALSE
    Spares = {}
    ReplaceOnPromote = FALSE
    SeatHoldsCopy = TRUE
    Grow = FALSE
    PromoteDestination = FALSE
    Counters = FALSE
    CounterCatchUp = FALSE
    Ballots = TRUE
    Elections = 0
    FenceEveryChange = TRUE

    Suspicions = 10
INVARIANTS
    TypeOK
    OneLeaderPerGeneration
    AckedHeldByLeader
    AckedAgree
    AckedOnMajority
    NoTruncationBelowHwm
