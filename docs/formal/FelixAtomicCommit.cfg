\* The broker as built: a commit is one log record holding every part, and
\* each view applies a committed record whole. Across a failover and a
\* second promotion no view on any broker shows part of a commit, and a
\* commit any view shows is still in the leader's log.
\* FelixAtomicCommitSplitRecords.cfg writes the parts as separate records;
\* FelixAtomicCommitPartialApply.cfg applies them one at a time. TLC finds
\* the partial commit in both.
\*
\* Bounds: two commits, generations to 3 (two promotions).
\*
\* Evidence: `a_commit_record_round_trips_and_is_one_kind_only` and
\* `a_commit_is_one_offset_seen_by_every_reader` (one record per commit);
\* `a_held_commit_releases_its_state_with_its_event` and
\* `a_rebuild_waits_for_the_mark_to_cover_the_log` (the state view takes
\* only committed records, and takes each whole).

SPECIFICATION Spec

CONSTANTS
    Brokers = {a, b, c}
    MaxCommits = 2
    MaxGen = 3
    SplitRecords = FALSE
    PartialApply = FALSE

INVARIANTS
    NoPartialCommit
    CommitSurvives
