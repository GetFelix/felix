\* FelixRaftLease.cfg with one suspend: a broker's monotonic clock stops
\* while real time runs, and it takes no step. On waking, Felix sees the jump
\* against boottime and refuses local acks until its clock has run one more
\* lease.
\*
\* Evidence: none, `admit_local_ack` always refuses until issue 2249 builds this rule.

