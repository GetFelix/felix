\* FelixRaftLease.cfg with one suspend: a broker's monotonic clock stops
\* while real time runs, and it takes no step. Felix compares the monotonic
\* clock with boottime inside the check, so the first check after waking sees
\* the jump, and it refuses local acks until its clock has run one more lease.
\* No drift (clocks gain 1 a tick), so a lease of 2 against an election
\* timeout of 2 meets the inequality and spans two ticks; drift is in the
\* Drift version.
\*
\* Evidence: none, `admit_local_ack` always refuses until issue 2249 builds this rule.

