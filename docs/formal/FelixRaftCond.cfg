\* Conditional publishes on a Raft shard, every member deciding `kept` from
\* the entry and its index: three members, three terms, logs up to five
\* entries, one plain publish, one membership entry and three conditional
\* publishes, two of them naming offset 2.
\*
\* Evidence: `a_conditional_publish_off_its_offset_is_a_blank_on_every_member`
\*   (each member stores the record or a blank from the entry's index) and
\*   `a_publish_if_to_a_raft_shard_is_written_only_at_its_offset` (the
\*   answers, given at the commit).

SPECIFICATION Spec

CONSTANTS
    Servers = {a, b, c}
    Nobody = Nobody
    MaxTerm = 3
    MaxLog = 5
    MaxPlain = 1
    MaxMembers = 1
    Expected <- TwoAtTwo
    LeaderDecides = FALSE

SYMMETRY Symm

INVARIANTS
    TypeOK
    CondKeptAtExpected
    OneKeptPerOffset
    MembersAgree
    AnswersHold
