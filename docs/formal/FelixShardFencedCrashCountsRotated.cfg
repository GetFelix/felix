\* FelixShardFencedCrash.cfg with the promoted leader counting a replica
\* whose storage identity rotated, as before #1335. The leader acknowledges a
\* record on itself and a follower, the follower crashes and loses it,
\* placement promotes the third replica, and its fence counts the short copy.
\*
\* Expected to violate AckedHeldByLeader. TLC stops at the first
\* counterexample, so this stays cheap.
\*
\* Evidence: this configuration REMOVES the identity check.
\* `a_fence_answer_from_another_storage_id_does_not_count` -- drop the check
\*   and the rotated copy's answer counts, which is the trace TLC finds.

SPECIFICATION Spec

CONSTANTS
    Brokers = {a, b, c}
    L = 4
    Margin = 0
    Eps = 0
    Drift = 0
    MaxTime = 0
    MaxWrites = 1
    CheckAtCommit = FALSE
    Quorum = TRUE
    Promotion = "leader-report"
    ReportBeforeAck = FALSE
    Handoff = FALSE
    WaitForDrained = TRUE
    FenceAtClaim = TRUE
    AckOnAdmit = FALSE
    FenceFromAdmit = FALSE
    MaxMoves = 0
    Planners = {}
    CasWrites = TRUE
    StageMove = FALSE
    LearnerVotes = FALSE
    Resends = FALSE
    SequencesInLog = TRUE
    Cancel = FALSE
    CancelCas = TRUE
    ReportBound = "acknowledged"
    AckChecksLease = FALSE
    AckOnResponse = FALSE
    AckByFollowers = TRUE
    FenceOnPromote = TRUE
    LabelOnReceipt = FALSE
    StartRecord = TRUE
    ReportFromAnswers = TRUE
    ReportFloor = TRUE
    Spares = {}
    ReplaceOnPromote = FALSE
    SeatHoldsCopy = TRUE
    Grow = FALSE
    PromoteDestination = FALSE
    Counters = FALSE
    CounterCatchUp = FALSE
    Ballots = TRUE
    Elections = 0
    FenceEveryChange = TRUE
    Suspicions = 1
    SetCheck = FALSE
    JointFence = FALSE
    Adopt = 0
    AdoptMatch = TRUE
    Swaps = 0
    PreVote = FALSE
    Wipes = 1
    StorageIds = TRUE
    CrashLoses <- Yes
    RotateOnCrash <- Yes
    FenceChecksIds <- No

SYMMETRY Symm

INVARIANTS
    TypeOK
    OneLeaderPerGeneration
    AckedHeldByLeader
    AckedAgree
    NoTruncationBelowHwm
