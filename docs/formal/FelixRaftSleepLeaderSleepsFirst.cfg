\* FelixRaftSleep with one rule dropped. The leader sleeps as soon as it has
\* sent the requests. A follower whose request is still on its way is awake
\* with a silent leader, times out and deposes it. The harm is availability,
\* not safety.
\* Evidence: none, this models an alternative the implementation does not use.

