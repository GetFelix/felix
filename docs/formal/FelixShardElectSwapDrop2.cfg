\* A piece of FelixShardElectSwap.cfg, which does not finish in one run: the
\* cut-overs whose new set drops the old leader, after both writes were admitted
\* and before any replica stood for a generation past the control plane's.
\* The twelve FelixShardElectSwap{Keep,Drop}{0,1,2}{,Stood}.cfg split every
\* cut-over by those three (`CutOverPiece`), and each also checks everything
\* before its cut-over, so together they reach every state the whole
\* configuration does.
\* `QuietView` leaves out what no step reads again here.
\*
\* Evidence: `a_cut_over_swapping_two_members_waits_for_the_old_majority`
\* and `a_joint_fence_never_counts_a_learner`
\* (crates/server/felix-replication/src/promotion/tests/joint.rs), and
\* `a_two_member_swap_waits_for_the_old_majority`
\* (crates/testing/felix-cluster/tests/failures/joint_fence.rs). Nothing in
\* the code elects a leader yet.

