\* A continuing fence counts every answer, a lost copy's included.
\* Expected to violate OneLeaderPerGeneration.

SPECIFICATION Spec

CONSTANTS
    Nodes = {a, b, c}
    First = a
    NoNode = NoNode
    MaxGen = 3
    MaxWrites = 1
    MaxStarts = 3
    MaxUnclean = 0
    MaxWipes = 1
    MaxRestores = 0
    MaxRetries = 0
    SetChoices = {{a, b, c}}
    OldPeers = {}
    AnyCopy <- Yes

INVARIANTS
    OneLeaderPerGeneration
    AckedHeldByLeader
