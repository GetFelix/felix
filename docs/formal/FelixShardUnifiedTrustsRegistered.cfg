\* #1335 on an election, coverage alone: the leader's copy loses its
\* suffix in an unclean crash and a follower is wiped. The wiped copy's promise
\* does not count, but its empty log counts as the copy the set named.
\* Expected to violate AckedHeldByLeader.

SPECIFICATION Spec

CONSTANTS
    Nodes = {a, b, c}
    First = a
    NoNode = NoNode
    MaxGen = 3
    MaxWrites = 1
    MaxStarts = 2
    MaxUnclean = 1
    MaxWipes = 1
    MaxRestores = 0
    MaxRetries = 0
    SetChoices = {{a, b, c}}
    OldPeers = {}
    TrustsRegistered <- Yes

INVARIANTS
    OneLeaderPerGeneration
    AckedHeldByLeader
