\* FelixShardFencedAckSeatPair.cfg with the leader's crash and its refusal
\* (`RefuseShortCopy`, #1636). A leader that crashed under a relaxed fsync
\* mode and gave its copy up answers no promotion fence from it, unless the
\* set of two it led acknowledged what it may have lost (`AckedByTwo`): its
\* last record is from the generation it led, the fencer leads the next one,
\* and the fencer's set is the two, with the fence ids naming exactly them.
\*
\* The shape from #1486: c joins `{a, b}`, a's report at the joining
\* generation names a, b and c, the fenced seat leaves `{a, c}`, and a
\* crashes before it reports at the seat's generation. The failover to c
\* names only the old set and the new one (#1633), so its fence ids are a and
\* c and a answers. TLC reaches that open (a temporary invariant saying no
\* leader opens on such an answer fails at depth 17). A lease of one tick and
\* time to 1 keep it small: the seat needs no ticks, the failover one.
\*
\* Identities are left out (`StorageIds = FALSE`): every answer counts as from
\* the copy the fence ids name. A rotated copy named by its old identity is
\* never counted, so the exception matters only where the ids name the copy
\* the crashed leader answers from, as after its own given-up report. The
\* crash does not rotate (`RotateOnCrash` off) for the same reason.
\*
\* Invariants: AckedHeldByLeader, AckedAgree, NoTruncationBelowHwm.
\* AckedOnMajority is left out because a crashed copy is a lost copy: a
\* record the two acknowledged is on one of them until the new leader ships it.
\*
\* Evidence: `a_crashed_leaders_copy_takes_no_fence_until_a_newer_leader_ships`
\* and `a_crashed_leader_of_two_copies_takes_the_fence` (the refusal and the
\* exception), `a_crashed_leader_of_a_set_that_shrank_to_two_refuses_the_fence`
\* and `a_crashed_leader_that_lost_its_start_record_refuses_the_fence` (its
\* checks), `a_promotion_after_a_seat_names_only_the_set` and
\* `a_copy_outside_both_sets_is_not_named` (FenceIds),
\* `an_rf2_seat_waits_for_the_drained_leaders_whole_log` (the seat).

SPECIFICATION Spec

CONSTANTS
    Brokers = {a, b, c}
