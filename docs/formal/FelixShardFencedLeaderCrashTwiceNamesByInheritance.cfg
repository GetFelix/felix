\* FelixShardFencedLeaderCrash.cfg with two leader crashes, each leader
\* blind to its followers' identities until it asks, and its reports
\* carrying the identity its own promotion named each replica by
\* (`NameByInheritance`, #1574). Every promotion replaces a leader that gave
\* its copy up, so no deposed leader is still serving.
\*
\* The first crash puts a blind leader in; the second replaces it from a
\* report that may name a follower only by inheritance, and that follower's
\* fence answer counts.
\* FelixShardFencedLeaderCrashTwiceInheritedCounts.cfg shows the count
\* happens. This is the inherited-name configuration that finishes: with
\* promotions on suspicion (FelixShardFencedCrashNamesByInheritance.cfg and
\* its siblings) a deposed leader serves on beside each new one, and the
\* state space outgrows a CI runner's disk, so those only run as walks.
\*
\* Invariants as FelixShardFencedLeaderCrash.cfg.
\*
\* Evidence: the implementation behaviours this configuration asserts.
\* `a_follower_not_reached_yet_is_named_by_the_promotions_identity` --
\*   Report: `inh`, only for a follower with no identity.
\* `a_member_the_report_never_reached_is_named_by_the_inherited_identity` --
\*   Named under NameByInheritance.
\* `a_leader_back_on_a_new_storage_identity_is_replaced` -- LeaderReplaced.
\* `a_crashed_leader_gives_up_the_generation_it_led` -- Crash under
\*   GiveUpOnCrash.

