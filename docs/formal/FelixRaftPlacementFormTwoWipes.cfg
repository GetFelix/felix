\* FelixRaftPlacementFormAfterWipes.cfg with two terms and two lost
\* volumes. Two wiped members do not form over a third that holds the log,
\* whether or not it answers; when all three are empty they do form. Two
\* lost volumes of three is past what the group survives, so only
\* AckedHeldSurvive is checked: a record some directory still holds is not
\* lost to a member that formed. OneLeaderPerTerm is not listed: with every
\* log empty again a member forms having forgotten its vote, as in
\* FelixRaftPlacementFormEarlyWipeUnrecorded.cfg.
\*
\* Evidence: `wiped_members_do_not_form_over_a_down_data_holder`.

