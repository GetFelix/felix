\* FelixRaftRestoreRepeated.cfg without the time line: the first index is the
\* backup's end plus the gap. A second restore from one backup starts where
\* the first did and gives out an offset the first restored epoch gave out.
\*
\* Evidence: none, this pins the twin without the fix.

SPECIFICATION Spec

CONSTANTS
    Rate = 1
    TimeRate = 2
    Gap = 10
    Skew = 1
    MinApart = 5
    MaxTime = 15
    MaxBackups = 2
    MaxRestores = 3
    Line = FALSE
    EndGap = TRUE

INVARIANT
    OffsetNeverReused
