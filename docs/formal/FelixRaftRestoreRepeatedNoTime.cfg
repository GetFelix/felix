\* FelixRaftRestoreRepeated.cfg without the time term (TimeRate = 0): the
\* second restore from the same backup starts where the first did, and
\* gives out an offset the first restored epoch already acknowledged.
\*
\* Evidence: none, this pins the twin without the fix.

SPECIFICATION Spec

CONSTANTS
    MaxWrites = 3
    MaxAfter = 2
    MaxNew = 2
    Step = 1
    Gap = 1
    Rate = 1
    TimeRate = 0
    MaxTime = 3
    MaxRestores = 2
    NoReserve = FALSE
    LeaderMoves = TRUE

INVARIANT
    ReserveCovers
    BaseKept
    OffsetNeverReused
