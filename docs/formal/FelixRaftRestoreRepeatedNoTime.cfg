\* Pins the old rule, not a one-change twin: it flips Line off and EndGap on
\* against FelixRaftRestoreRepeated.cfg, so the first index is the backup's
\* end plus the gap. A second restore from one backup starts where the first
\* did and gives out an offset the first restored epoch gave out.
\* FelixRaftRestoreRepeatedEndGap.cfg is the one-change twin (EndGap only).
\*
\* Evidence: none, this pins the rule the time line replaced.

SPECIFICATION Spec

CONSTANTS
    Rate = 1
    TimeRate = 2
    Gap = 10
    Skew = 1
    MinApart = 5
    MaxTime = 15
    MaxBackups = 2
    MaxRestores = 3
    Line = FALSE
    EndGap = TRUE
    Batch = FALSE
    MaxBatch = 1
    Capacity = 1
    Step = 0
    MaxCuts = 0
    MaxLeaders = 0
    NoBucket = FALSE
    BucketStartsFull = FALSE
    RaiseFromNext = FALSE

INVARIANT
    OffsetNeverReused
