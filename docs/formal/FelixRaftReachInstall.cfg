\* A witness for FelixRaft.cfg, to show its checks do not pass for want of
\* behaviour. `NeverInstallsSnapshot` says this never happens, and TLC must
\* find that it does: a leader that purged its log brings a follower up by
\* snapshot.
\*
\* Evidence: the raft_log adapter tests in felix-storage:
\*   `a_received_snapshot_becomes_the_stored_one`,
\*   `a_cut_at_each_step_of_a_snapshot_install_opens`.

