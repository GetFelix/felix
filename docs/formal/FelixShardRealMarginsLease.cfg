\* The lease with the margins the code actually runs: the broker gives up a
\* quarter of the lease (`Eps = L/4`), and the control plane marks a silent
\* broker down only a quarter past its expiry (`Margin = L/4`), so its shards
\* are not handed on before then. Against clocks that drift by a quarter of
\* the lease, TLC finds no two brokers serving at once. With `Margin = 0` it
\* does, which is why the control plane's margin has a floor. No writes, so
\* time runs to 8 and every interleaving of the clocks is affordable;
\* FelixShardRealMargins.cfg is the same margins with a write.
\* Evidence: the margins this keeps are real in the code.
\* `a_quarter_of_the_lease_is_surrendered_as_margin` -- Eps: a broker stops
\*   serving before its own expiry, not at it.
\* `a_silent_broker_outlives_the_timeout_by_the_regrant_margin` -- Margin: a
\*   node is marked down only after the timeout plus a quarter of it.
\* `the_regrant_margin_defaults_to_a_quarter_and_cannot_go_below_it` -- the
\*   margin cannot be configured below what this checks.
\* `a_store_clock_step_does_not_expire_a_broker_heard_from_recently` -- the
\*   control plane measures the silence on its own monotonic clock, as `now`
\*   is here, not only on a wall clock that can step.
\* Planners = {}: every decision reads and writes in one step, so CasWrites
\*   has nothing to compare.

SPECIFICATION Spec

CONSTANTS
    Brokers = {a, b, c}
    L = 4
    Margin = 1
    Eps = 1
    Drift = 1
    MaxTime = 8
    MaxWrites = 0
    CheckAtCommit = TRUE
    Quorum = TRUE
    Promotion = "log-order"
    ReportBeforeAck = TRUE
    Handoff = FALSE
    WaitForDrained = TRUE
    FenceAtClaim = TRUE
    AckOnAdmit = FALSE
    FenceFromAdmit = FALSE
    MaxMoves = 0
    Planners = {}
    CasWrites = TRUE
    StageMove = FALSE
    LearnerVotes = FALSE
    Resends = FALSE
    SequencesInLog = TRUE
    Cancel = FALSE
    CancelCas = TRUE
    ReportBound = "acknowledged"
    AckChecksLease = TRUE
    AckOnResponse = FALSE
    AckByFollowers = FALSE
    FenceOnPromote = FALSE
    LabelOnReceipt = FALSE
    StartRecord = FALSE
    Spares = {}
    ReplaceOnPromote = FALSE
    SeatHoldsCopy = TRUE

SYMMETRY Symm

INVARIANTS
    TypeOK
    AtMostOneServing
    NoStaleCommit
