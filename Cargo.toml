[workspace]
resolver = "2"
# Grouped by role; see the README in each directory under crates/. The binding
# crates (crates/sdk/felix-python, crates/sdk/felix-typescript) and the demos
# with their own [workspace] are deliberately not members.
members = [
  # How peers talk: the frame codec and the QUIC layer under it.
  "crates/protocol/felix-wire",
  "crates/protocol/felix-transport",
  # The libraries the services are built from.
  "crates/server/felix-common",
  "crates/server/felix-authz",
  "crates/server/felix-router",
  "crates/server/felix-storage",
  "crates/server/felix-broker",
  "crates/server/felix-kafka",
  # What applications link.
  "crates/sdk/felix-client",
  # Harnesses, kits and load tools.
  "crates/testing/felix-cluster",
  "crates/testing/felix-conformance",
  "crates/testing/felix-loadgen",
  # The deployables.
  "services/felix-broker-service",
  "services/felix-controlplane-service",
]

[profile.dev]
# Debug builds dominate disk here: a single clean `cargo test --workspace --no-run`
# produced 6.1 GB, and the accumulated target directory reached 41 GB because cargo
# keys artifacts by feature set and never garbage-collects the old ones.
#
# On macOS `split-debuginfo` defaults to `unpacked`, so DWARF stays in the per-CGU
# object files rather than being folded into the binary — 17.6 GB of `.o` files at
# the peak, against only 4.2 GB of actual executables. `line-tables-only` keeps what
# panics and backtraces need (file, line, symbol) and drops the rest: variable
# layouts, types, lexical scopes. Step-debugging locals in a debugger is what this
# gives up; if you need that, raise it back to `debug = true` for the session.
debug = "line-tables-only"

# Third-party code is the bulk of those object files and is almost never stepped
# through. Symbols still appear in backtraces; only line numbers inside
# dependencies are lost. Workspace crates keep their line tables from the setting
# above, because those are the frames that matter when a test fails.
[profile.dev.package."*"]
debug = false

[profile.release]
# The hot path spans crate boundaries — felix-wire encode/decode, felix-broker
# fanout, and the broker service's QUIC handlers are separate crates — so
# cross-crate inlining is where the wins are. `codegen-units = 1` costs build
# time but is what lets LTO see the whole picture.
#
# Deliberately NOT `panic = "abort"`. Tokio contains a panicking task by
# unwinding it; aborting would turn any single request-triggered panic into a
# whole-broker outage, which is the opposite of what docs/security/panic-audit.md
# concluded the panic surface should do.
lto = "fat"
codegen-units = 1

[workspace.package]
edition = "2024"
# Single source of truth for member crate versions. Members opt in with
# `version.workspace = true`.
#
# This line is not the whole bump: intra-workspace path dependencies also pin a
# `version`, which Cargo requires to match, so they move with it. The standalone
# demos under demos/ keep their own literal version and are independent.
version = "0.6.0-preview"
# Fail-closed default: a new crate inherits the *restrictive* licence unless it
# deliberately opts into Apache-2.0. The permissive crates (felix-wire,
# felix-common, felix-transport, felix-client, felix-conformance) set
# `license = "Apache-2.0"` explicitly. See LICENSING.md for the authoritative
# table; `task publish:check` fails CI if a crate drifts from it.
license = "AGPL-3.0-only"
rust-version = "1.97"
repository = "https://github.com/gabloe/felix"
homepage = "https://github.com/gabloe/felix"
readme = "README.md"

[workspace.lints.rust]
# `pub` that is not actually reachable from outside the crate reads as public
# API and makes the real surface hard to see. Use `pub(crate)`.
unreachable_pub = "warn"

[workspace.lints.clippy]
# One module style: `foo.rs` + `foo/`, never `foo/mod.rs`. `task lint` runs
# clippy with -D warnings, so this fails CI on a new mod.rs.
mod_module_files = "warn"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
utoipa = "5.4.0"
serde_yaml_ng = "0.10"
bytes = "1"
uuid = { version = "1", features = ["v4", "serde"] }
# `test-util` (paused time) is a dev-dependency feature, added per member.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ahash = "0.8"
arc-swap = "1"
async-trait = "0.1"
axum = "0.8"
base64 = "0.23"
casbin = { version = "2.20.0", default-features = false, features = ["runtime-tokio", "logging", "incremental"] }
crc32fast = "1.5"
dashmap = "6"
ed25519-dalek = { version = "3", features = ["alloc", "pkcs8"] }
hashbrown = { version = "0.17", features = ["equivalent"] }
# The Kafka wire codecs. Default features off: compression codecs are added by
# whoever needs to decode a producer's batches.
kafka-protocol = { version = "0.18", default-features = false }
jsonwebtoken = { version = "11", default-features = false, features = ["aws_lc_rs"] }
libc = "0.2"
# Linux-only, and only for the broker's storage layer: device flushes go
# through IORING_OP_FSYNC rather than a blocking thread (#548).
io-uring = "0.7"
metrics = "0.24"
metrics-exporter-prometheus = "0.18"
opentelemetry = "0.32.0"
opentelemetry-otlp = { version = "0.32.0", features = ["grpc-tonic"] }
opentelemetry_sdk = { version = "0.32.1", features = ["rt-tokio"] }
parking_lot = "0.12"
quinn = "0.11"
quinn-proto = "0.11"
rcgen = "0.14"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rustls = "0.23"
rustls-webpki = "0.103"
serial_test = "4"
sqlx = { version = "0.9", features = ["runtime-tokio", "postgres", "macros", "migrate", "chrono", "json"] }
tempfile = "3"
tokio-util = { version = "0.7", features = ["rt"] }
tokio-rustls = { version = "0.26", default-features = false }
tracing-opentelemetry = "0.33.0"

# kafka-protocol 0.18 reserves Vec capacity from a client-supplied array count
# before reading any element, so a tiny frame can ask for tens of gigabytes.
# The vendored copy caps each reservation at the bytes left in the buffer.
# Drop this once upstream ships the same bound.
[patch.crates-io]
kafka-protocol = { path = "vendor/kafka-protocol" }
