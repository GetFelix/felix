# Generates include/felix.h. Regenerate with `task capi:header`; the header
# test fails while the checked-in copy differs from what this produces.
language = "C"
include_guard = "FELIX_H"
cpp_compat = true
usize_is_size_t = true
documentation_style = "c99"
autogen_warning = "/* Generated by cbindgen from crates/sdk/felix-capi. Do not edit; run `task capi:header`. */"
sys_includes = ["stdbool.h", "stddef.h", "stdint.h"]
no_includes = true

[export]
include = ["FelixStatus", "FelixAckMode", "FelixStartKind"]

[parse]
parse_deps = false
