# Deliberately outside the workspace, like the crates under demos/.
#
# A PyO3 extension is built with `pyo3/extension-module`, which leaves the
# Python symbols to be resolved by the interpreter at import time. That is
# correct for an extension and fatal for a test binary, so a crate carrying
# that feature cannot be linked by `cargo test --workspace --all-features`.
# Its own workspace keeps the main one buildable; `task python:check` is what
# builds and tests this.
[workspace]

[package]
name = "felix-python"
version = "0.6.0-preview.5"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
repository = "https://github.com/GetFelix/felix"
homepage = "https://github.com/GetFelix/felix"
readme = "README.md"
description = "Python bindings for the Felix client, over the Rust client rather than a reimplementation of it"
keywords = ["felix", "python", "quic", "pubsub", "bindings"]
categories = ["api-bindings", "network-programming"]

[lib]
# `felix._felix` is the extension module; the Python package `felix/` wraps it.
name = "_felix"
crate-type = ["cdylib", "rlib"]

[dependencies]
felix-client = { path = "../felix-client", version = "0.6.0-preview.5" }
felix-wire = { path = "../../protocol/felix-wire", version = "0.6.0-preview.5" }
bytes = "1"
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py39"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
anyhow = "1"
quinn = { version = "0.11", default-features = false, features = ["bloom", "log", "platform-verifier", "runtime-tokio", "rustls-aws-lc-rs"] }
rustls = "0.23"
rustls-pemfile = "2"
pyo3-async-runtimes = { version = "0.29", features = ["tokio-runtime"] }
