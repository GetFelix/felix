# Deliberately outside the workspace, like the crates under demos/.
#
# pyo3's `extension-module` feature is not enabled here: it leaves the Python
# symbols to the interpreter, which is right for the wheel and fatal for a
# test binary. maturin turns it on from pyproject.toml, so the wheel is
# unchanged, and `cargo test` links libpython. `task python:unit` runs the
# tests; its own workspace keeps the main one from needing a Python.
[workspace]

[package]
name = "felix-python"
version = "0.7.0-preview.2"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
repository = "https://github.com/GetFelix/felix"
homepage = "https://github.com/GetFelix/felix"
readme = "README.md"
description = "Python bindings for the Felix client, over the Rust client rather than a reimplementation of it"
keywords = ["felix", "python", "quic", "pubsub", "bindings"]
categories = ["api-bindings", "network-programming"]

[lib]
# `felix._felix` is the extension module; the Python package `felix/` wraps it.
name = "_felix"
crate-type = ["cdylib", "rlib"]

[build-dependencies]
pyo3-build-config = "0.29"

[dependencies]
felix-client = { path = "../felix-client", version = "0.7.0-preview.2" }
felix-wire = { path = "../../protocol/felix-wire", version = "0.7.0-preview.2" }
bytes = "1"
pyo3 = { version = "0.29", features = ["abi3-py39"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
anyhow = "1"
tokio-util = "0.7"
quinn = { version = "0.11", default-features = false, features = ["bloom", "log", "platform-verifier", "runtime-tokio", "rustls-aws-lc-rs"] }
rustls = "0.23"
pyo3-async-runtimes = { version = "0.29", features = ["tokio-runtime"] }
