# Deliberately outside the workspace, like `felix-python` and the crates under
# demos/.
#
# A Node addon is a `cdylib` whose Node symbols are resolved by the host
# process at load time. That is correct for an addon and fatal for a test
# binary, so a crate carrying it cannot be linked by
# `cargo test --workspace --all-features`. Its own workspace keeps the main one
# buildable; `task ts:check` is what builds and tests this.
[workspace]

[package]
name = "felix-typescript"
version = "0.6.0-preview"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
repository = "https://github.com/GetFelix/felix"
homepage = "https://github.com/GetFelix/felix"
readme = "README.md"
description = "Node.js/TypeScript bindings for the Felix client, over the Rust client rather than a reimplementation of it"
keywords = ["felix", "nodejs", "typescript", "quic", "bindings"]
categories = ["api-bindings", "network-programming"]

[lib]
# Loaded by Node as `felix.node`; the TypeScript package wraps it.
crate-type = ["cdylib"]

[dependencies]
felix-client = { path = "../felix-client", version = "0.6.0-preview" }
felix-wire = { path = "../../protocol/felix-wire", version = "0.6.0-preview" }
bytes = "1"
napi = { version = "2", default-features = false, features = ["napi6", "tokio_rt"] }
napi-derive = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
anyhow = "1"
serde_json = "1"
quinn = { version = "0.11", default-features = false, features = ["bloom", "log", "platform-verifier", "runtime-tokio", "rustls-aws-lc-rs"] }
rustls = "0.23"
rustls-pemfile = "2"

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
