[package]
name = "felix-client"
version.workspace = true
edition.workspace = true
license = "Apache-2.0"
rust-version.workspace = true
description = "Rust client SDK for the Felix pub/sub and cache broker"
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["felix", "client", "pubsub", "messaging", "quic"]
categories = ["network-programming", "api-bindings"]

[dependencies]
thiserror = { workspace = true }
anyhow = { workspace = true }
bytes = { workspace = true }
ahash = { workspace = true }
hashbrown = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
metrics = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }
serde-saphyr = { workspace = true, features = ["deserialize"] }
felix-transport = { path = "../../protocol/felix-transport", version = "0.7.0-preview.1" }
felix-wire = { path = "../../protocol/felix-wire", version = "0.7.0-preview.1" }
quinn = { workspace = true }
rustls = { workspace = true }
rustls-platform-verifier = { workspace = true }

[features]
default = []
telemetry = []

[dev-dependencies]
rcgen = { workspace = true }
# The token example in docs-site/.../clients/rust.md, compiled by tests/docs_examples.rs.
reqwest = { workspace = true }
serial_test = { workspace = true }
tempfile = { workspace = true }
# `fs` is for the token provider in the resilience guide, compiled by tests/docs_examples.rs.
tokio = { workspace = true, features = ["test-util", "fs"] }
tracing-subscriber = { workspace = true }

[package.metadata.docs.rs]
# `telemetry` is off by default; document it anyway.
all-features = true

[lints]
workspace = true
