# Writes tests/vectors/rumqttc.txt: `cargo run -q > ../rumqttc.txt` from this directory.
# Not a workspace member, so rumqttc stays out of the build and the lockfile.
[package]
name = "rumqttc-gen"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
bytes = "1"
rumqttc = { version = "=0.25.1", default-features = false }

[workspace]
