[package]
name = "felix-sim"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Deterministic simulation of Felix Raft groups on virtual time"
repository.workspace = true
homepage.workspace = true
readme = "README.md"
# A test harness, not a library anyone consumes from a registry.
publish = false

[features]
# The Raft group simulation (`src/raft.rs`). It compiles the per-shard Raft
# engine, which no release enables, so it stays behind a feature.
# It opens members with no copy checks and seeds openraft's draws, which
# only `testing` exposes.
raft = ["felix-replication/testing"]

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
bytes = { workspace = true }
felix-broker = { path = "../../server/felix-broker" }
felix-cluster = { path = "../felix-cluster" }
felix-common = { path = "../../server/felix-common", features = ["sim"] }
felix-replication = { path = "../../server/felix-replication" }
felix-storage = { path = "../../server/felix-storage", features = ["sim"] }
parking_lot = { workspace = true }
# `test-util` for the paused clock a run is built on.
tokio = { workspace = true, features = ["test-util"] }
tokio-util = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# Turns `raft` on for this crate's own tests, so `cargo test` runs the Raft
# seeds.
felix-sim = { path = ".", features = ["raft"] }
tracing-subscriber = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
