[package]
name = "felix-sim"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Deterministic simulation of a Felix cluster on virtual time"
repository.workspace = true
homepage.workspace = true
readme.workspace = true
# A test harness, not a library anyone consumes from a registry.
publish = false

[dependencies]
anyhow = { workspace = true }
axum = { workspace = true }
felix-common = { path = "../../server/felix-common" }
felix-controlplane-service = { path = "../../../services/felix-controlplane-service" }
felix-replication = { path = "../../server/felix-replication" }
felix-wire = { path = "../../protocol/felix-wire" }
parking_lot = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tower = { version = "0.5", features = ["util"] }

[dev-dependencies]
async-trait = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
