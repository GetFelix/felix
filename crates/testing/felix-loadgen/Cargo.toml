[package]
name = "felix-loadgen"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Load generator that drives a remote Felix cluster for the real-network performance suite"
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["felix", "benchmark", "load-testing", "pubsub", "quic"]
categories = ["development-tools::profiling", "network-programming"]

# The measuring instrument for the real-network perf suite
# (docs/perf-real-network.md). Drives a *remote* Felix cluster — every other
# load driver in the repo is loopback-bound — and emits both the stdout shape
# scripts/perf expects and one machine-readable JSON line per case.
#
# Publishable because felixctl, which is, links its scenarios for `felixctl
# bench`. AGPL like the rest of the server side (LICENSING.md).

# A library too, so `felixctl bench` runs the same scenarios.
[lib]
path = "src/lib.rs"

[[bin]]
name = "felix-loadgen"
path = "src/main.rs"

[dependencies]
anyhow = "1"
bytes = "1"
felix-client = { path = "../../sdk/felix-client", version = "0.6.0-preview.2" }
felix-wire = { path = "../../protocol/felix-wire", version = "0.6.0-preview.2" }
quinn = { workspace = true }
rustls = { workspace = true }
serde_json = "1"
tokio = { workspace = true, features = ["fs", "io-std", "io-util", "process"] }

[lints]
workspace = true
