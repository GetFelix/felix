# The semantics a Felix client must implement, as a catalogue every language
# can be checked against.
#
# This file is the contract. A client binding — Rust, Python, or the third and
# fourth languages after them — runs its own test suite against the fixture
# from `felix-conformance client-fixture`, tags each test with a scenario `id`
# from this file, and emits a results document. `felix-conformance verify`
# then answers one question: does this client implement the semantics, or has
# it quietly skipped some?
#
# Why a catalogue rather than a shared test binary: the tests have to be
# written in the client's own language to exercise its own API, so what can be
# shared is the *specification*, not the code. Divergence shows up here as a
# `required` scenario with no passing result, rather than as a subtle
# behavioural difference nobody notices until production.
#
# `required = true` means a client claiming conformance must implement it.
# `required = false` marks semantics that are optional for a client to expose
# (a binding may legitimately not wrap every surface yet) but must behave as
# described if it does.

version = 1

# ---------------------------------------------------------------------------
# Publish and subscribe
# ---------------------------------------------------------------------------

[[scenario]]
id = "pubsub.roundtrip"
required = true
title = "A published record reaches a subscriber"
detail = """
Subscribe, publish one record, receive it. The payload must arrive byte for
byte — a client that re-encodes payloads (text coercion, JSON wrapping) fails
here, which is the point.
"""

[[scenario]]
id = "pubsub.order"
required = true
title = "Records arrive in publish order"
detail = """
Publish N records to one stream and receive them in the order they were
published. Ordering is per shard; a client that fans one stream across shards
without merging must not claim this.
"""

[[scenario]]
id = "pubsub.offsets_are_contiguous"
required = true
title = "Delivered offsets increase by one on a durable stream"
detail = """
Each event on a durable stream carries its log offset. Consecutive events
differ by exactly one; a gap means the subscriber queue dropped records, and a
client must surface the offset so an application can detect that.
"""

[[scenario]]
id = "pubsub.resume_from_offset"
required = true
title = "A subscription resumes at a requested offset"
detail = """
Publish, note an offset, disconnect, resubscribe starting at that offset, and
receive from there with no gap and no duplicate. This is what makes a
reconnecting consumer correct rather than approximately correct.
"""

[[scenario]]
id = "pubsub.start_earliest"
required = true
title = "A subscription can start at the oldest retained record"
detail = """
`earliest` means as far back as the broker still holds, which is not
necessarily offset 0 — a trimmed log has no offset 0 to start from, and asking
for it is an error while `earliest` succeeds.
"""

# ---------------------------------------------------------------------------
# Cache
# ---------------------------------------------------------------------------

[[scenario]]
id = "cache.put_get"
required = true
title = "A cached value reads back"
detail = "Put a value, get it back byte for byte."

[[scenario]]
id = "cache.miss_is_absent"
required = true
title = "A missing key reads as absent, not as an error"
detail = """
A key that was never written reads as the language's absent value (None, nil,
null) rather than raising. A client that raises on a miss forces callers to
use exceptions for control flow over the most common cache outcome.
"""

[[scenario]]
id = "cache.delete_returns_previous"
required = true
title = "Delete reports the value it removed"
detail = """
Deleting a present key returns what it held; deleting an absent key returns
absent. The second is an answer, not an error.
"""

[[scenario]]
id = "cache.ttl_expires"
required = true
title = "A value with a TTL stops being readable after it"
detail = """
Expiry is lazy — the record is reclaimed at compaction, not at the deadline —
so what a client must show is that the value reads as absent once the TTL has
passed, not that storage shrank.
"""

# ---------------------------------------------------------------------------
# Counters
# ---------------------------------------------------------------------------

[[scenario]]
id = "counter.add_returns_sum"
required = true
title = "Adding to a counter returns the sum including the delta"
detail = """
One round trip applies the delta and reports where the counter now stands. A
client that adds and then reads separately is not implementing this: the two
calls can interleave with another writer's.
"""

[[scenario]]
id = "counter.get_absent_is_none"
required = true
title = "An unwritten counter reads as absent, not zero"
detail = """
Absent and zero are different: a counter that was decremented to zero has been
written, and one that never existed has not.
"""

# ---------------------------------------------------------------------------
# Reconnection
#
# The semantics a second client is most likely to approximate rather than
# implement. Each one is a place where "looks correct" and "is correct" differ
# only under a fault nobody runs by hand.
# ---------------------------------------------------------------------------

[[scenario]]
id = "reconnect.survives_broker_loss"
required = true
title = "A client outlives the broker it was using"
detail = """
Kill the broker a client is connected to while other brokers remain. The next
call must succeed against another broker rather than failing permanently. A
client that holds one connection and surfaces its death to the application has
not implemented this — it has moved the problem to every caller.
"""

[[scenario]]
id = "reconnect.discovers_brokers_from_one_seed"
required = true
title = "One seed address is enough"
detail = """
Given a single reachable broker, a client learns the others from the cluster
and will use them after the seed goes away. A client that can only ever talk to
the addresses it was configured with is a single point of failure wearing a
cluster's clothes.
"""

[[scenario]]
id = "reconnect.subscription_resumes_at_the_next_offset"
required = true
title = "A resumed subscription continues at offset + 1, with no gap and no duplicate"
detail = """
Consume to a known offset, lose the connection, resubscribe. Delivery resumes
at the next unseen record: nothing between the last handled offset and the
resumption is skipped, and nothing already handled arrives twice. Off-by-one
here is the single most expensive client bug — one direction loses records
silently, the other duplicates them.
"""

# ---------------------------------------------------------------------------
# Redirects
#
# A shard has one owner, and the broker a client happens to reach may not be
# it. Getting this wrong looks like a broker bug from the outside, which is
# why it is specified here rather than left to each client to infer.
# ---------------------------------------------------------------------------

[[scenario]]
id = "redirect.follows_to_the_shard_owner"
required = true
title = "A request to a non-owner reaches the owner"
detail = """
Subscribe through a broker that does not own the shard. The client follows the
redirect and receives records. A client that treats the redirect as an error
makes correctness depend on which broker the application happened to name.
"""

[[scenario]]
id = "redirect.carries_the_start_offset_through_every_hop"
required = true
title = "A redirected subscription keeps its requested start offset"
detail = """
Subscribe from an explicit offset through a non-owner, so the request is
redirected at least once. The subscription must begin at the offset the caller
asked for, not at the tail.

This is the subtle one. A client that reconstructs the subscribe request on
redirect, rather than carrying the original, silently drops the start position
and begins at the live tail — every record between the requested offset and
now is lost, the call reports success, and the loss surfaces later as missing
data with no error anywhere near it. A multi-hop redirect must preserve it at
every hop, not just the first.
"""

[[scenario]]
id = "redirect.is_not_reported_as_a_failure"
required = true
title = "A redirect is routing, not an error"
detail = """
`NotLeader` tells a client where to go. It must not reach the application as a
failure, and it must not be counted against a retry budget — a client that
spends its attempts on redirects fails calls that were always going to succeed
one hop away.
"""

# ---------------------------------------------------------------------------
# Retry classification
#
# What may be retried, what may not, and what is ambiguous. A client that gets
# this wrong either duplicates records or gives up on calls that would have
# succeeded.
# ---------------------------------------------------------------------------

[[scenario]]
id = "retry.terminal_failures_are_not_retried"
required = true
title = "A failure that cannot succeed is not retried"
detail = """
A publish refused for want of permission fails the same way on every broker and
after every backoff. A client must report it immediately rather than spending a
retry budget — and must not reclassify it as a transport failure on the way
out.
"""

[[scenario]]
id = "retry.ambiguous_outcomes_are_not_silently_retried"
required = true
title = "A publish that may already have been applied is not re-sent by default"
detail = """
When a publish fails after the broker may have written the record, re-sending
it duplicates it and nothing downstream can tell the copies apart. The default
must be to report the failure. Re-sending is opt-in — see
`ack.at_least_once_may_duplicate` — and a client that retries ambiguous
publishes silently has changed the delivery guarantee without saying so.
"""

[[scenario]]
id = "retry.idempotent_producers_re_send_ambiguous_outcomes"
required = false
title = "An idempotent producer re-sends an ambiguous publish, and it lands once"
detail = """
With a producer id and a sequence (`producer_init`, `publish_idempotent`) the
ambiguous outcome above stops being ambiguous: the broker answers a re-send of
a batch it already holds without appending it again. A client's producer must
re-send under the *same* sequence after a lost acknowledgement, advance the
sequence only on an acknowledgement, and stop on a `publish_refused` — a gap or
an unknown producer is not something a re-send can mend.
"""

[[scenario]]
id = "retry.transport_failures_are_retried_against_another_broker"
required = false
title = "A connection failure is retried elsewhere, not against the dead broker"
detail = """
A client that retries the same failed endpoint burns its budget on the one
broker known not to be answering.
"""

# ---------------------------------------------------------------------------
# Acknowledgement modes
#
# Each mode is a different promise. A client that treats them as a performance
# dial rather than a semantic one will misreport durability.
# ---------------------------------------------------------------------------

[[scenario]]
id = "ack.none_does_not_wait_for_the_broker"
required = true
title = "An unacknowledged publish returns without a broker round trip"
detail = """
`none` promises nothing about whether the record was accepted, and must not
block waiting to find out. A client that waits anyway has turned the cheapest
mode into the most expensive one.
"""

[[scenario]]
id = "ack.per_message_means_the_broker_accepted_it"
required = true
title = "An acknowledged publish returns only after the broker acknowledged it"
detail = """
Returning before the acknowledgement arrives reports success for a record the
broker may have rejected. The acknowledgement is the whole value of the mode.
"""

[[scenario]]
id = "ack.at_least_once_may_duplicate_and_says_so"
required = false
title = "Opt-in re-send is documented as duplicating"
detail = """
A client offering an at-least-once publish must make the duplication explicit
at the call site and in its documentation. The guarantee is the caller's to
choose, not the client's to assume.
"""

# ---------------------------------------------------------------------------
# Errors and failure behaviour
# ---------------------------------------------------------------------------

[[scenario]]
id = "error.unknown_stream_is_typed"
required = true
title = "Publishing to an unknown stream fails distinguishably"
detail = """
A client must let an application tell 'this stream does not exist' from 'the
broker is unreachable' without parsing message text. Message wording changes;
error identity must not.
"""

[[scenario]]
id = "error.unauthorized_is_typed"
required = true
title = "An operation outside the token's permissions fails distinguishably"
detail = """
Authorization failure is not retryable and must not be reported as a transport
failure — an application that retries it burns its budget on a call that
cannot succeed.
"""

[[scenario]]
id = "error.bad_offset_is_typed"
required = false
title = "Resuming from a discarded offset fails distinguishably"
detail = """
Retention discards history. A client asking for an offset that is gone must
receive an identifiable error, because the recovery is specific: restart from
`earliest` and accept the gap.
"""

[[scenario]]
id = "error.shard_unavailable_is_retryable"
required = true
title = "A shard refusing during a move is reported as retryable"
detail = """
While a shard moves, its old owner is fenced and nobody serves it for a moment.
A publish refused then was not applied, and the error must say so: typed as an
unavailable shard (`shard_unavailable` or `not_leader`) with a retry class that
allows sending it again. Reporting it as fatal makes an application drop a
write it could have made; reporting it as outcome-unknown makes a careful one
treat a clean refusal as a possible duplicate. The fixture's control endpoint
holds a shard fenced with `POST /fence`.
"""

[[scenario]]
id = "error.quorum_timeout_is_outcome_unknown"
required = true
title = "A write no majority confirmed is reported as outcome unknown"
detail = """
A leader that wrote a batch and could not get a majority to confirm it in time
does not know whether the write will survive. The error must say that
(`quorum_timeout`, retry class `outcome_unknown`) and must not look like a
refusal: an application that resends a non-idempotent publish after it may
write the record twice. The fixture's control endpoint cuts a quorum stream's
leader off from its followers with `POST /partition`.
"""

# ---------------------------------------------------------------------------
# Concurrency and lifecycle
# ---------------------------------------------------------------------------

[[scenario]]
id = "client.concurrent_calls"
required = true
title = "One client serves concurrent callers"
detail = """
A client is shared by an application's tasks or threads. Concurrent publishes
through one client must all succeed and must not interleave into corruption —
a binding that serialises everything behind one lock passes this but should
say so, and one that shares mutable state unsafely fails it.
"""

[[scenario]]
id = "client.close_is_idempotent"
required = true
title = "Closing a client or subscription twice is safe"
detail = """
Cleanup runs on paths that may already have cleaned up — a context manager
inside an exception handler, a finaliser after an explicit close. The second
close does nothing rather than raising.
"""

[[scenario]]
id = "client.subscription_ends_cleanly"
required = true
title = "A closed subscription reports the end rather than hanging"
detail = """
When the broker closes the event stream, iteration ends. A client that blocks
forever instead turns a routine shutdown into a hung consumer.
"""

# ---------------------------------------------------------------------------
# Connection faults
#
# Each of these carries a `step`: the client's connection is broken partway
# through a publish or a subscribe, and the client has to either carry on or
# say that it could not. The fixture puts an interposer in front of the broker
# that owns `link_stream` and serves it at `link_addr`; a suite connects a
# client with `link_addr` as its only seed and asks for the fault with
# `POST /link {"fault": ..., "hold_ms": ...}` once `after_records` records
# have been handled.
#
#   drop   every datagram, both ways, is discarded for `hold_ms`
#   reset  every connection open through the interposer dies for good; a new
#          one gets through at once
#   stall  every datagram is held for `hold_ms`, then delivered in order
#
# QUIC gives a middlebox nothing to forge, so a client learns of a drop or a
# reset from its idle timeout (6 s by default). The drop holds past it on
# purpose; the stall stays well under it, and a client must ride it out.
#
# `during = "publish"`: publish `records` records one at a time, each
# acknowledged, through the interposed client. Every call must return, with an
# acknowledgement or an error, and none may hang. Once the fault is over a
# publish must succeed again (retrying until then is fine), and every record
# that was acknowledged must be readable afterwards.
#
# `during = "subscribe"`: subscribe through the interposed client, then publish
# `records` records through an ordinary one. After `after_records` have
# arrived, inject the fault. From there the subscription must either deliver
# the rest with contiguous offsets, no gap and no duplicate, or fail with an
# error. Ending as though the broker had closed the stream (`None`, `null`,
# `StopIteration`) fails the scenario: that is a consumer loop exiting quietly
# on a dead connection, with nothing to tell it records were missed.
#
# A stall is shorter than the idle timeout, so the connection never dies, and
# an error during one fails the scenario too: every publish is acknowledged
# and every record arrives.
# ---------------------------------------------------------------------------

[[scenario]]
id = "fault.publish_through_a_dropped_link"
required = true
title = "A publish interrupted by a dropped link returns, and the client recovers"
detail = """
The link goes silent mid-publish. The publish in flight must end, with an
acknowledgement or an error, rather than hang; a record the client said was
acknowledged must not be lost; and the client must publish again once the link
is back.
"""
step = { during = "publish", fault = "drop", after_records = 3, records = 10, hold_ms = 8000 }

[[scenario]]
id = "fault.publish_through_a_reset_link"
required = true
title = "A publish interrupted by a reset connection returns, and the client recovers"
detail = """
The connection dies for good mid-publish while a new one would get through at
once. The client must not keep writing into the dead connection: the publish
ends, and the next one goes out on a new connection.
"""
step = { during = "publish", fault = "reset", after_records = 3, records = 10, hold_ms = 0 }

[[scenario]]
id = "fault.publish_through_a_stalled_link"
required = true
title = "A publish rides out a stall shorter than the idle timeout"
detail = """
Every packet is late and none is lost. Publishes during the stall are slow,
not failed, and every acknowledged record is readable afterwards.
"""
step = { during = "publish", fault = "stall", after_records = 3, records = 10, hold_ms = 2000 }

[[scenario]]
id = "fault.subscription_through_a_dropped_link"
required = true
title = "A subscription on a dropped link resumes or reports the loss, and never just ends"
detail = """
The subscription's connection goes silent past the idle timeout. A client that
resumes must continue at the next offset with no gap and no duplicate; one that
cannot must raise. Returning end-of-stream instead is the failure this exists
to catch.
"""
step = { during = "subscribe", fault = "drop", after_records = 3, records = 10, hold_ms = 8000 }

[[scenario]]
id = "fault.subscription_through_a_reset_link"
required = true
title = "A subscription on a reset connection resumes or reports the loss, and never just ends"
detail = """
The subscription's connection dies for good while a new one would get through.
Same bar as the dropped link: resume exactly, or raise.
"""
step = { during = "subscribe", fault = "reset", after_records = 3, records = 10, hold_ms = 0 }

[[scenario]]
id = "fault.subscription_through_a_stalled_link"
required = true
title = "A subscription rides out a stall shorter than the idle timeout"
detail = """
Every packet is late and none is lost. The records published during the stall
arrive after it, in order, with contiguous offsets.
"""
step = { during = "subscribe", fault = "stall", after_records = 3, records = 10, hold_ms = 2000 }

# ---------------------------------------------------------------------------
# Queues (consumer groups)
#
# A queue is a different shape from a stream: records are pulled, claimed by
# one consumer at a time, and settled explicitly. A client that models it as a
# subscription with extra steps gets the settle semantics wrong.
# ---------------------------------------------------------------------------

[[scenario]]
id = "queue.poll_returns_claimed_records"
required = true
title = "A poll claims records, and an empty poll is an answer"
detail = """
Polling a group hands back up to the requested count, each with the offset to
settle and how many times it has been delivered. An empty result means the log
has nothing unclaimed for this group right now — it is an answer, not an error,
and a client that raises on it forces exception handling around the ordinary
case.
"""

[[scenario]]
id = "queue.acknowledged_records_are_not_redelivered"
required = true
title = "An acknowledged record does not come back"
detail = """
Settling a record finishes it. A client whose acknowledgement does not reach
the broker — wrong offset, wrong group, fire-and-forget — produces a queue that
redelivers everything forever, and the symptom appears in the consumer rather
than the client.
"""

[[scenario]]
id = "queue.unacknowledged_records_are_redelivered"
required = true
title = "A record handed back is delivered again"
detail = """
Handing a record back (nack) returns it to the queue for immediate
redelivery rather than waiting out the visibility timeout. The redelivered
record must carry a higher attempt count than the first delivery, because that
count is how a consumer tells a retry from a first attempt.
"""

[[scenario]]
id = "queue.dead_letters_are_listable_and_redrivable"
required = false
title = "Records that kept failing can be listed, redriven, or discarded"
detail = """
Past the attempt bound a record is set aside rather than retried forever. A
client exposing queues should be able to list those offsets, put one back with
its attempts reset once the cause is fixed, and drop one that is not worth
reprocessing. Optional because a binding may reasonably ship polling and
settling before the administrative half.
"""

# ---------------------------------------------------------------------------
# Cache watches
#
# The semantics that make a watch usable as a state-synchronisation primitive
# rather than a notification: resume by offset, and loss that is loud.
# ---------------------------------------------------------------------------

[[scenario]]
id = "watch.delivers_changes_for_the_filter"
required = true
title = "A watch delivers matching changes and ignores the rest"
detail = """
A key watch sees that key; a prefix watch sees every key under it. Writes to
other keys must not arrive — a client that over-delivers makes every watcher
filter again, and one that under-delivers loses changes silently.
"""

[[scenario]]
id = "watch.deletes_arrive_as_changes_without_values"
required = true
title = "A delete is a change carrying no value"
detail = """
A watcher mirroring the cache has to distinguish 'set to empty' from 'removed'.
A client that reports a delete as an absent event, or as an empty value, makes
the two indistinguishable.
"""

[[scenario]]
id = "watch.resumes_from_an_offset"
required = true
title = "A watch resumes at a requested offset with no gap"
detail = """
Every change carries its cache-log offset; re-watching from `offset + 1`
replays what was missed and then joins live delivery. Without this, a watcher
that reconnects has to re-read the whole cache and hope nothing changed while
it did.
"""

[[scenario]]
id = "watch.lag_is_reported_rather_than_silent"
required = true
title = "A watch that falls behind says so"
detail = """
Offsets on a filtered watch are sparse by construction — other keys' changes
consume them — so a gap between delivered offsets is *not* a drop signal, and a
client cannot infer loss the way a stream subscriber can. The broker ends a
lagging watch with an explicit signal carrying the offset to resume from, and a
client must surface it as something the application can act on rather than as
an ordinary end of iteration.
"""

[[scenario]]
id = "watch.retained_delivers_state_before_changes"
required = false
title = "A retained watch delivers current state, then live changes"
detail = """
Join and immediately hold the roster. The client must report how many retained
values to expect, so an application knows the exact moment its state is
complete; zero is a definite answer (the prefix is empty), not a silence to
wait through.
"""

# ---------------------------------------------------------------------------
# Multi-shard streams
#
# A subscription reads one shard. Consuming a whole stream means one per shard,
# each following its own owner — which is why this is a client concern and not
# something the broker can do on the caller's behalf.
# ---------------------------------------------------------------------------

[[scenario]]
id = "sharded.delivers_every_shard"
required = true
title = "A sharded subscription receives records from every shard"
detail = """
Publish with keys that hash to different shards and receive all of them
through one subscription. A client that opens shard 0 and calls it the stream
silently drops the rest, which looks like missing data with no error anywhere.
"""

[[scenario]]
id = "sharded.reports_the_shard_count"
required = true
title = "A client can ask how many shards a stream has"
detail = """
A consumer cannot open one subscription per shard without knowing how many
there are, and guessing is not available.

A stream the broker does not know answers zero, not one. That distinction is
what a sharded subscription refuses on: told "one shard" for a stream that does
not exist, a client opens one subscription, reports success, and reads nothing
— reading shard 0 and calling it the stream. The caller discovers it later, as
missing data, with no error anywhere to point at.
"""

[[scenario]]
id = "sharded.resumes_per_shard"
required = false
title = "A sharded subscription resumes each shard at its own offset"
detail = """
Offsets are per shard, so resuming is a map rather than a number. A client that
carries a single offset across shards either replays or skips on every shard
but one.
"""

[[scenario]]
id = "sharded.a_lost_shard_is_surfaced"
required = false
title = "Losing one shard is reported, not swallowed"
detail = """
The remaining shards keep delivering, so a consumer that is not told has no way
to know it is now reading part of the stream while believing it reads all of
it.
"""

# ---------------------------------------------------------------------------
# Atomic commits
#
# An event and the state it changes, written as one record on the shard an
# entity key routes to. See docs/atomic-commit.md.
# ---------------------------------------------------------------------------

[[scenario]]
id = "commit.returns_the_offset"
required = true
title = "A commit is answered with the offset its event sits at"
detail = """
Commit one event and a state change on the durable stream, keyed by an
entity. The answer carries an offset, and a subscriber or a group reading the
entity's shard sees the event, byte for byte, at that offset.
"""

[[scenario]]
id = "commit.state_get_returns_the_version"
required = true
title = "A state read returns the value and the version that wrote it"
detail = """
After a commit that puts a key, a state read of that key through the same
entity returns the value, a version equal to the commit's offset, and an as_of
at or past it. A deleted or never-written key reads as absent, not empty.
"""

[[scenario]]
id = "commit.another_stream_is_refused"
required = true
title = "An operation on another stream is refused before anything is sent"
detail = """
A commit whose operations name two streams spans two logs. The client refuses
it with a typed error naming the offending operation (NotOnOwningShard), and
nothing is written. A client that splits the commit into two writes fails.
"""

[[scenario]]
id = "commit.exactly_one_event"
required = true
title = "A commit with no event, or two, is refused with a typed error"
detail = """
A commit is one record with one offset, so it carries exactly one publish or
enqueue. Zero or two is refused on the client (EventCount) before anything is
sent.
"""

[[scenario]]
id = "commit.negotiated"
required = true
title = "Commits are sent only to a broker that advertised them"
detail = """
The broker advertises FEATURE_ATOMIC_COMMIT in auth_ok. A client uses commit
and state_get only when it saw the bit, and a peer that offers no capabilities
gets the same plain ok, byte for byte, that it always did.
"""
