[package]
name = "felix-router"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Request routing and placement logic for multi-node Felix deployments"
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["felix", "routing"]
categories = ["network-programming"]
# Built into the services, not consumed from a registry.
publish = false

[dependencies]
felix-common = { path = "../felix-common", version = "0.6.0-preview" }
# The key-to-shard mapping is protocol, shared with clients.
felix-wire = { path = "../../protocol/felix-wire", version = "0.6.0-preview" }
# Routes are read on every publish and replaced wholesale; a swap keeps readers
# off any lock a writer can hold.
arc-swap = { workspace = true }

[lints]
workspace = true
