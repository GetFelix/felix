[package]
name = "felix-storage"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Storage backends and ephemeral cache implementation for the Felix broker"
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["felix", "storage", "cache"]
categories = ["network-programming", "caching"]
# Built into the services, not consumed from a registry.
publish = false

[dependencies]
bytes = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
async-trait = "0.1.89"
crc32fast = { workspace = true }
metrics = { workspace = true }
parking_lot = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

# The broker is a Linux-only artifact; this is the path it actually runs.
# Everything else keeps the portable blocking-pool fallback.
[target.'cfg(target_os = "linux")'.dependencies]
io-uring = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tempfile = { workspace = true }

[target.'cfg(unix)'.dev-dependencies]
libc = { workspace = true }

[lints]
workspace = true
