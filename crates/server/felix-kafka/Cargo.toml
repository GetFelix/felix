[package]
name = "felix-kafka"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Kafka wire protocol over a Felix broker"
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["felix", "kafka"]
categories = ["network-programming", "asynchronous"]
# Built into the broker service, not consumed from a registry.
publish = false

[features]
# Entry points for the libFuzzer targets in `fuzz/`. Not an API.
fuzzing = []

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
bytes = { workspace = true }
# The CRC of a record batch built by hand; kafka-protocol uses the same crate.
crc32c = "0.6"
felix-authz = { path = "../felix-authz", version = "0.6.0-preview.5" }
felix-broker = { path = "../felix-broker", version = "0.6.0-preview.5" }
felix-storage = { path = "../felix-storage", version = "0.6.0-preview.5" }
# The producer codecs, used directly so decompression can be bounded. The
# same versions kafka-protocol's codec features pull in.
flate2 = "1.1"
futures = "0.3"
# `broker` is the half that decodes requests and encodes responses.
kafka-protocol = { workspace = true, features = ["broker"] }
lz4 = "1.28"
metrics = { workspace = true }
snap = "1.1"
tokio = { workspace = true, features = ["io-util"] }
tokio-util = { workspace = true }
tracing = { workspace = true }
zstd = "0.14"

[dev-dependencies]
# `client` encodes requests and decodes responses; the codec features let a
# test compress the batches a producer would.
kafka-protocol = { workspace = true, features = ["broker", "client", "gzip", "snappy", "lz4", "zstd"] }
# Replication's wire marks, to seed a log with a producer near the sequence wrap.
felix-wire = { path = "../../protocol/felix-wire", version = "0.6.0-preview.5" }
tempfile = { workspace = true }

[lints]
workspace = true
