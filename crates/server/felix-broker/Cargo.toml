[package]
name = "felix-broker"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Broker core: stream registry, fanout, and per-subscriber queues for Felix"
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["felix", "broker", "pubsub", "messaging"]
categories = ["network-programming", "asynchronous"]
# Built into the services, not consumed from a registry.
publish = false

[dependencies]
bytes = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
metrics = { workspace = true }
felix-storage = { path = "../felix-storage", version = "0.6.0-preview.2" }
felix-wire = { path = "../../protocol/felix-wire", version = "0.6.0-preview.2" }
arc-swap = "1.8"
ahash = { workspace = true }
hashbrown = { workspace = true }
parking_lot = { workspace = true }

[features]
default = []
telemetry = []
perf_debug = []

[dev-dependencies]
tempfile = { workspace = true }
serial_test = { workspace = true }

[lints]
workspace = true
