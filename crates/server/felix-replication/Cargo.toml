[package]
name = "felix-replication"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Broker-to-broker transport and log replication for Felix"
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["felix", "replication"]
categories = ["network-programming"]
# Built into the broker service, not consumed from a registry.
publish = false

[dependencies]
ahash = { workspace = true }
arc-swap = { workspace = true }
anyhow = { workspace = true }
# `PeerRequestHandler` is a trait object with async methods.
async-trait = { workspace = true }
bytes = { workspace = true }
felix-broker = { path = "../felix-broker", version = "0.8.0-preview.0" }
felix-common = { path = "../felix-common", version = "0.8.0-preview.0", features = ["blocking", "hasher", "tls"] }
felix-router = { path = "../felix-router", version = "0.8.0-preview.0" }
felix-storage = { path = "../felix-storage", version = "0.8.0-preview.0" }
felix-transport = { path = "../../protocol/felix-transport", version = "0.8.0-preview.0" }
felix-wire = { path = "../../protocol/felix-wire", version = "0.8.0-preview.0" }
futures = "0.3"
metrics = { workspace = true }
parking_lot = { workspace = true }
quinn = { workspace = true }
rcgen = { workspace = true }
reqwest = { workspace = true }
rustls = { workspace = true }
rustls-webpki = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }

[features]
# Per-shard Raft (`docs/per-shard-raft.md`). No release enables it. Today it
# compiles store liveness, which runs only when a broker also asks for it.
raft = ["felix-storage/raft"]

[dev-dependencies]
# Turns `raft` on for this crate's own tests, so `cargo test` runs them.
felix-replication = { path = ".", features = ["raft"] }
felix-broker = { path = "../felix-broker", version = "0.8.0-preview.0", features = ["fault-injection"] }
axum = { workspace = true }
metrics-exporter-prometheus = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
tracing-subscriber = { workspace = true }

[lints]
workspace = true
