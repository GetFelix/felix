[package]
name = "felix-replication"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Broker-to-broker transport and log replication for Felix"
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["felix", "replication"]
categories = ["network-programming"]
# Built into the broker service, not consumed from a registry.
publish = false

[features]
# The per-shard Raft runtime (`src/raft.rs`): many openraft groups on one
# broker, driven by one ticker. No release enables it, and nothing in the
# broker calls it yet. See docs/per-shard-raft.md.
raft = ["dep:openraft", "dep:openraft-multi", "dep:openraft-rt-tokio", "dep:rand", "felix-storage/raft", "bytes/serde", "serde/rc"]
# Entry points for the libFuzzer targets in `fuzz/`. Not an API.
fuzzing = ["raft"]
# Test-only entry points, such as opening a Raft member with no copy
# checks. Not an API.
testing = ["raft"]

[dependencies]
ahash = { workspace = true }
arc-swap = { workspace = true }
anyhow = { workspace = true }
# `PeerRequestHandler` is a trait object with async methods.
async-trait = { workspace = true }
bytes = { workspace = true }
felix-broker = { path = "../felix-broker", version = "0.8.0-preview.0" }
felix-common = { path = "../felix-common", version = "0.8.0-preview.0", features = ["blocking", "hasher", "tls"] }
felix-router = { path = "../felix-router", version = "0.8.0-preview.0" }
felix-storage = { path = "../felix-storage", version = "0.8.0-preview.0" }
felix-transport = { path = "../../protocol/felix-transport", version = "0.8.0-preview.0" }
felix-wire = { path = "../../protocol/felix-wire", version = "0.8.0-preview.0" }
futures = "0.3"
metrics = { workspace = true }
openraft = { workspace = true, optional = true, features = ["tokio-rt", "serde"] }
openraft-multi = { workspace = true, optional = true }
openraft-rt-tokio = { workspace = true, optional = true }
parking_lot = { workspace = true }
quinn = { workspace = true }
# openraft's draws (`src/raft/draws.rs`); the major version openraft uses.
rand = { version = "0.10", default-features = false, features = ["std", "thread_rng"], optional = true }
rcgen = { workspace = true }
reqwest = { workspace = true }
rustls = { workspace = true }
rustls-webpki = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }

[[test]]
name = "raft_memory"
required-features = ["raft"]

[[test]]
name = "raft_idle_cpu"
required-features = ["raft"]

[[test]]
name = "raft_open_files"
required-features = ["raft"]

[dev-dependencies]
# Turns `raft` on for this crate's own tests, so `cargo test` runs the
# runtime's without a feature flag.
felix-replication = { path = ".", features = ["raft", "testing"] }
felix-broker = { path = "../felix-broker", version = "0.8.0-preview.0", features = ["fault-injection"] }
# `DiskLog::fail_next_flush`, for the failed-flush identity test.
felix-storage = { path = "../felix-storage", version = "0.8.0-preview.0", features = ["fault-injection"] }
axum = { workspace = true }
metrics-exporter-prometheus = { workspace = true }
tempfile = { workspace = true }
libc = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
tracing-subscriber = { workspace = true }

[lints]
workspace = true
