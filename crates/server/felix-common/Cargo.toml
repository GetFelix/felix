[package]
name = "felix-common"
version.workspace = true
edition.workspace = true
license = "Apache-2.0"
rust-version.workspace = true
description = "Membership shapes, env-var registry, and process lifecycle shared by Felix crates"
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["felix", "messaging", "config"]
categories = ["network-programming"]
# Built into the services, not consumed from a registry.
publish = false

[dependencies]
serde = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
# Only needed by the `lifecycle` module; optional so pure-library consumers of this
# crate do not inherit an async runtime.
tokio = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
metrics = { version = "0.24", optional = true }
# Only needed to publish the membership shapes in the control plane's OpenAPI.
# Optional so the broker, which sends them, takes no utoipa dependency.
utoipa = { workspace = true, optional = true }
# Only needed by the `tls` module.
rustls = { workspace = true, optional = true }
arc-swap = { workspace = true, optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
# `CLOCK_BOOTTIME`, which the lease clock reads.
libc = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
rcgen = { workspace = true }
tempfile = { workspace = true }
serde_json = { workspace = true }
# For the deployment-docs YAML check in `tests/deployment_yaml.rs`.
serde_yaml_ng = { workspace = true }

[features]
default = []
# Signal handling, readiness gating, and bounded drain for service binaries.
lifecycle = ["dep:tokio", "dep:tracing", "dep:metrics"]
# `ToSchema` on the membership shapes, for the control plane's OpenAPI.
openapi = ["dep:utoipa"]
# Certificate files re-read on rotation, for the services' TLS listeners.
tls = ["dep:rustls", "dep:arc-swap", "dep:tokio", "dep:tracing"]
# The test-only clock faults in `clock::fault`. Debug builds have them
# regardless; this puts them in an optimised build for a fault-testing run.
fault-injection = []

[package.metadata.docs.rs]
# `lifecycle` is off by default so library consumers do not inherit tokio;
# docs.rs should still show it.
all-features = true

[lints]
workspace = true
