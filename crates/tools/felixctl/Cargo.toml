[package]
name = "felixctl"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Command-line tool for Felix: publish, subscribe, read caches, inspect the control plane and run benchmarks"
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["felix", "cli", "pubsub", "messaging", "quic"]
categories = ["command-line-utilities", "network-programming"]

[[bin]]
name = "felixctl"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
base64 = { workspace = true }
bytes = { workspace = true }
# `string` for the generated man page names.
clap = { workspace = true, features = ["string"] }
clap_complete = { workspace = true }
clap_mangen = { workspace = true }
felix-client = { path = "../../sdk/felix-client", version = "0.6.0-preview.2" }
felix-loadgen = { path = "../../testing/felix-loadgen", version = "0.6.0-preview.2" }
quinn = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-std", "io-util"] }
toml = { workspace = true }

[dev-dependencies]
# No version: a path-only dev-dependency is dropped on publish.
felix-cluster = { path = "../../testing/felix-cluster" }
serial_test = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["process"] }

[lints]
workspace = true
