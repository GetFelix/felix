# A control plane, one broker and development credentials, for trying Felix.
#
#   docker compose up
#   docker compose run --rm felixctl sub orders
#   docker compose run --rm felixctl pub orders 'hello'
#
# With Podman, use the docker-compose provider (2.20 or later), not
# podman-compose, which lacks `run` of a profiled service and starts the broker
# even when felix-dev-auth fails:
#
#   PODMAN_COMPOSE_PROVIDER=docker-compose podman compose up
#
# FELIX_VERSION overrides the image tag. Releases bump the default here.
#
# DEVELOPMENT ONLY. The credentials below are fixed, minted without an identity
# provider, and live for a day. Every host port is bound to 127.0.0.1, so
# nothing here is reachable from another machine. Never deploy this file; see
# https://docs.getfelix.dev/deployment/docker-compose/ for a real setup.
#
# The control plane's metadata is in memory, and the broker's streams and caches
# are on disk in the felix-dev volume. `docker compose down -v` throws it all
# away, and the next `up` mints fresh credentials. Run it before `up` again:
# without -v the broker keeps data the new control plane has never heard of.

name: felix-dev

services:
  felix-controlplane:
    image: ghcr.io/getfelix/felix-controlplane:${FELIX_VERSION:-0.6.0}
    environment:
      FELIX_CONTROLPLANE_STORAGE_BACKEND: memory
      # Dev tokens let the bootstrap token mint a token for any principal. The
      # control plane refuses them unless bootstrap listens on loopback, and
      # nothing publishes 9095, so only felix-dev-auth (which shares this
      # container's network namespace) can reach it.
      FELIX_BOOTSTRAP_ENABLED: "true"
      FELIX_BOOTSTRAP_BIND_ADDR: 127.0.0.1:9095
      FELIX_BOOTSTRAP_TOKEN: felix-dev-only-bootstrap-token
      FELIX_BOOTSTRAP_DEV_TOKENS: "true"
      # A day, so a felixctl token copied to the host does not expire mid-session.
      FELIX_EXCHANGE_TOKEN_TTL_SECONDS: "86400"
      RUST_LOG: info
    ports:
      - "127.0.0.1:8443:8443"  # REST API
      - "127.0.0.1:8081:8080"  # metrics, /ready
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/ready"]
      interval: 2s
      timeout: 2s
      retries: 30

  # Initializes tenant `dev`, creates namespace `default`, stream `orders` and
  # caches `config` and `stats`, and writes the broker's and felixctl's tokens
  # to the felix-dev volume.
  felix-dev-auth:
    image: ghcr.io/getfelix/felix-controlplane:${FELIX_VERSION:-0.6.0}
    network_mode: "service:felix-controlplane"
    depends_on:
      felix-controlplane:
        condition: service_healthy
    volumes:
      - felix-dev:/var/lib/felix
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        BT=felix-dev-only-bootstrap-token
        BOOT=http://127.0.0.1:9095/internal/bootstrap/tenants/dev
        CP=http://127.0.0.1:8443/v1/tenants/dev
        OUT=/var/lib/felix
        # The broker opens its storage dir but does not create it.
        mkdir -p $$OUT/data

        # POST $$2 to $$1 with header $$3. Sets $$status; the body is in /tmp/body.
        post() {
          status=$$(wget -q -S --content-on-error -O /tmp/body \
            --header 'Content-Type: application/json' --header "$$3" \
            --post-data "$$2" "$$1" 2>&1 \
            | sed -n 's/^ *HTTP\/[0-9.]* \([0-9]*\).*/\1/p' | tail -n 1)
        }
        field() { sed -n "s/.*\"$$1\":\"\([^\"]*\)\".*/\1/p" /tmp/body; }
        fail() { echo "felix-dev-auth: $$1 (HTTP $${status:-none})"; cat /tmp/body 2>/dev/null; exit 1; }

        # 409 is a tenant this control plane already initialized.
        for _ in $$(seq 1 30); do
          post "$$BOOT/initialize" '{"display_name":"dev","idp_issuers":[],
            "initial_admin_principals":["p:admin"],
            "policies":[
              {"subject":"role:broker","object":"cluster:*","action":"node.view"},
              {"subject":"role:dev","object":"namespace:dev/*","action":"ns.manage"}],
            "groupings":[{"user":"p:broker","role":"role:broker"},{"user":"p:dev","role":"role:dev"}]}' \
            "X-Felix-Bootstrap-Token: $$BT"
          [ -n "$$status" ] && break
          sleep 1
        done
        case "$$status" in 200|409) ;; *) fail "initializing tenant dev failed" ;; esac

        mint() {
          post "$$BOOT/dev-token" "$$1" "X-Felix-Bootstrap-Token: $$BT"
          [ "$$status" = 200 ] && [ -n "$$(field felix_token)" ] || fail "minting a token failed"
        }
        umask 077
        mint '{"principal":"p:broker","audience":"felix-controlplane"}'
        field felix_token > "$$OUT/node.jwt"
        field refresh_token > "$$OUT/node-refresh.jwt"
        umask 022
        mint '{"principal":"p:dev","audience":"felix-controlplane","requested":["ns.manage","stream.manage","cache.manage"]}'
        field felix_token > "$$OUT/controlplane.jwt"
        # A broker refuses a token carrying actions it does not know.
        # stream.manage is what lets felixctl create and seek consumer groups.
        mint '{"principal":"p:dev","audience":"felix-broker","requested":["stream.publish","stream.subscribe","stream.manage","cache.read","cache.write"]}'
        field felix_token > "$$OUT/client.jwt"

        admin="Authorization: Bearer $$(cat "$$OUT/controlplane.jwt")"
        post "$$CP/namespaces" '{"namespace":"default","display_name":"default"}' "$$admin"
        case "$$status" in 2??|409) ;; *) fail "creating namespace default failed" ;; esac
        post "$$CP/namespaces/default/streams" '{"stream":"orders","kind":"Stream","shards":1,
          "replication_factor":1,"retention":{"max_age_seconds":null,"max_size_bytes":null},
          "consistency":"Leader","delivery":"AtLeastOnce","durable":true}' "$$admin"
        case "$$status" in 2??|409) ;; *) fail "creating stream orders failed" ;; esac
        for cache in config stats; do
          post "$$CP/namespaces/default/caches" "{\"cache\":\"$$cache\",\"display_name\":\"$$cache\"}" "$$admin"
          case "$$status" in 2??|409) ;; *) fail "creating cache $$cache failed" ;; esac
        done
        echo "felix-dev-auth: tenant dev, namespace default, stream orders, caches config and stats; tokens written"

  felix-broker:
    image: ghcr.io/getfelix/felix-broker:${FELIX_VERSION:-0.6.0}
    depends_on:
      felix-dev-auth:
        condition: service_completed_successfully
    environment:
      FELIX_CONTROLPLANE_URL: http://felix-controlplane:8443
      FELIX_NODE_TOKEN_FILE: /var/lib/felix/node.jwt
      FELIX_NODE_REFRESH_TOKEN_FILE: /var/lib/felix/node-refresh.jwt
      # No certificate given, so the broker makes a self-signed one for
      # `localhost` and writes it here for felixctl to trust.
      FELIX_TLS_CERT_EXPORT: /var/lib/felix/broker-cert.pem
      # Durable streams, consumer groups and cache watches need a log on disk.
      FELIX_DURABLE_STORAGE_DIR: /var/lib/felix/data
      RUST_LOG: info
    ports:
      - "127.0.0.1:5000-5003:5000-5003/udp"  # client QUIC, one port per listener
      - "127.0.0.1:8080:8080"                # metrics, /live, /ready
    volumes:
      - felix-dev:/var/lib/felix
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/ready"]
      interval: 2s
      timeout: 2s
      retries: 30

  # Prints how to connect once the broker is ready.
  felix-dev-ready:
    image: ghcr.io/getfelix/felixctl:${FELIX_VERSION:-0.6.0}
    depends_on:
      felix-broker:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        cat <<'EOF'
        Felix is up (development credentials only).
          tenant dev, namespace default, stream orders, caches config and stats
          brokers 127.0.0.1:5000 (QUIC), control plane http://127.0.0.1:8443

        From this directory:
          docker compose run --rm felixctl sub orders
          docker compose run --rm felixctl pub orders 'hello'

        With felixctl installed on this machine:
          docker compose exec -T felix-broker cat /var/lib/felix/client.jwt > felix-dev.jwt
          docker compose exec -T felix-broker cat /var/lib/felix/controlplane.jwt > felix-dev-cp.jwt
          docker compose exec -T felix-broker cat /var/lib/felix/broker-cert.pem > felix-dev.pem
          felixctl context add felix-dev --brokers 127.0.0.1:5000 --tenant dev \
            --token-file felix-dev.jwt --ca-file felix-dev.pem \
            --controlplane-url http://127.0.0.1:8443 --controlplane-token-file felix-dev-cp.jwt --use
          felixctl sub orders
        EOF

  # `docker compose run --rm felixctl <args>` runs felixctl inside the stack.
  felixctl:
    image: ghcr.io/getfelix/felixctl:${FELIX_VERSION:-0.6.0}
    profiles: ["cli"]
    depends_on:
      felix-broker:
        condition: service_healthy
    environment:
      FELIX_BROKERS: felix-broker:5000
      # The broker's generated certificate names `localhost`.
      FELIX_SERVER_NAME: localhost
      FELIX_AUTH_TENANT: dev
      FELIX_AUTH_TOKEN_FILE: /var/lib/felix/client.jwt
      FELIX_CA_FILE: /var/lib/felix/broker-cert.pem
      FELIX_CONTROLPLANE_URL: http://felix-controlplane:8443
      FELIX_CONTROLPLANE_TOKEN_FILE: /var/lib/felix/controlplane.jwt
    volumes:
      - felix-dev:/var/lib/felix:ro

volumes:
  felix-dev:
