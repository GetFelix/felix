name: TLA+ walks

# Long random walks over replica-set changes, in TLC's simulation mode. The
# per-push `formal` job in ci.yml checks every behaviour up to small bounds.
# These configurations are too big to check exhaustively, so they are sampled
# instead: sampling, not proof, so a pass means nothing was found. Each walked
# negative twin must still find its violation within the budget, the same
# expectation model as ci.yml. A pull request that changes the walks runs
# them too. See
# docs/formal/README.md, "Long random walks".
#
# The same nightly run also checks, exhaustively, the configurations too big
# for the per-push `formal` job's hour (the `exhaustive` job below), so they
# run somewhere other than by hand. See docs/formal/README.md, "Which
# configurations run where".

on:
  schedule:
    # 05:23 UTC nightly, a slot no other scheduled workflow uses.
    - cron: "23 5 * * *"
  workflow_dispatch:
    inputs:
      minutes:
        description: "Budget per configuration, in minutes"
        required: false
        default: "25"
      depth:
        description: "Steps per trace"
        required: false
        default: "300"
      seed:
        description: "TLC seed (empty for a random one, printed in the log)"
        required: false
        default: ""
  # A change to the walks themselves gets a real run before it merges;
  # nothing else runs this per push.
  pull_request:
    paths:
      - .github/workflows/tla-walk.yml
      - docs/formal/FelixCrossShardCommit*

permissions:
  contents: read

concurrency:
  group: tla-walk-${{ github.ref }}
  # A superseded pull request run is dropped; nightly and dispatch runs finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  walk:
    name: Walk ${{ matrix.family }}
    runs-on: ubuntu-latest
    # A pass configuration spends its whole budget; its twin usually stops
    # well short of it.
    timeout-minutes: 60
    continue-on-error: ${{ matrix.report-only == true }}
    strategy:
      # One family finding something says nothing about the others.
      fail-fast: false
      matrix:
        include:
          # The cross-shard commit design (docs/cross-shard-commit.md), not
          # built yet. Each twin drops one rule and must find its violation.
          - family: cross-shard
            configs: FelixCrossShardCommit FelixCrossShardCommitLive
          - family: cross-shard-twins-a
            configs: FelixCrossShardCommitNoFirstWins FelixCrossShardCommitReleaseOnTimeout FelixCrossShardCommitTrimUndone FelixCrossShardCommitNoFence
          - family: cross-shard-twins-b
            configs: FelixCrossShardCommitWriteCheckEarly FelixCrossShardCommitApplyWithoutLock FelixCrossShardCommitNoTokenCheck
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      # The runner's /tmp can be a small tmpfs, and TLC queues states in its
      # scratch directory; keep that on the runner's disk.
      - name: Scratch disk for TLC
        run: |
          mkdir -p "$RUNNER_TEMP/tlc"
          echo "TLC_SCRATCH_DIR=$RUNNER_TEMP/tlc" >> "$GITHUB_ENV"

      - name: Walk
        env:
          TLA_SIM_MINUTES: ${{ inputs.minutes || '25' }}
          TLA_DEPTH: ${{ inputs.depth || '300' }}
          TLA_SEED: ${{ inputs.seed }}
          CONFIGS: ${{ matrix.configs }}
        # Word splitting is wanted: the matrix entry is a list of names. An
        # empty TLA_SEED is unset so the script draws one.
        run: |
          if [ -z "$TLA_SEED" ]; then unset TLA_SEED; fi
          scripts/check_tla.sh --simulate $CONFIGS

      # TLC's whole output for each walk, the trace and the seed with it.
      - name: Upload the traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: tla-walk-${{ matrix.family }}
          path: target/tla/walk/
          retention-days: 14

  # The two re-form configurations that ran six hours on a runner with no
  # violation (run 45097934400, #2729). The directed twin
  # (FelixRaftWrittenCommitsReformJointDeadOneSetDirected) is what shows the
  # gate is needed; these only widen the search, so they are reported, not
  # required, and never run on a pull request.
  exhaustive-open:
    name: Check ${{ matrix.config }}
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        config:
          - FelixRaftWrittenCommitsReformJointDead
          - FelixRaftWrittenCommitsReformJointDeadOneSet
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Free disk
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL

      - name: Scratch disk for TLC
        run: |
          mkdir -p "$RUNNER_TEMP/tlc"
          echo "TLC_SCRATCH_DIR=$RUNNER_TEMP/tlc" >> "$GITHUB_ENV"

      # Not registered in check_tla.sh, so each is held to a pass. A red
      # JointDeadOneSet is a trace it found, the one the directed twin pins.
      - name: Model-check
        env:
          CONFIG: ${{ matrix.config }}
        run: scripts/check_tla.sh "$CONFIG"

  # Exhaustive checks of the configurations the per-push job cannot fit, each
  # in its own job: the longest take hours on a four-core runner.
  # Not on pull requests: hours of runner time for a change to the walks.
  exhaustive:
    name: Check ${{ matrix.config }}
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # The limit is the most a hosted runner allows.
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        config:
          - FelixRaftPlacementFull
          - FelixRaftPlacementRewindSpare
          - FelixRaftPlacementDirectTerms
          - FelixRaftWrittenFailover
          - FelixRaftReformTwoReformsOldRestore
          - FelixRaftReformKeptTerms
          # The pass that checks OffsetNeverReused across a joint change. It
          # did not finish in six hours on a runner (#2729); two siblings
          # filled the runner's disk, hence the cleanup.
          - FelixRaftWrittenCommitsReformJointCutDead
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      # TLC's queue of a 400M-state run filled a runner's disk; drop what the
      # image carries and this job never uses.
      - name: Free disk
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL

      # The runner's /tmp can be a small tmpfs, and TLC queues states in its
      # scratch directory; keep that on the runner's disk.
      - name: Scratch disk for TLC
        run: |
          mkdir -p "$RUNNER_TEMP/tlc"
          echo "TLC_SCRATCH_DIR=$RUNNER_TEMP/tlc" >> "$GITHUB_ENV"

      # Not registered in check_tla.sh, so each must pass.
      - name: Model-check
        env:
          CONFIG: ${{ matrix.config }}
        run: scripts/check_tla.sh "$CONFIG"
