name: Performance Regression Check

# Advisory-only performance gate: builds and benchmarks both the PR's
# merge-base (baseline) and the PR head (candidate) back-to-back on the same
# runner instance in this job, then compares them with a Welch's t-test.
# Running both sides on the same runner controls for GitHub Actions' shared/
# virtualized runner noise far better than comparing against a historical
# stored baseline captured on a different runner at a different time.
#
# This does NOT fail the check on a regression: it's advisory only. A single
# CI runner's noise floor isn't (yet) trusted enough to block merges on --
# see the PR comment this workflow posts for the full caveat.

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths-ignore:
      - "docs/**"
      - "docs-site/**"
      - "**/*.md"

concurrency:
  group: perf-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Stated rather than inherited, so it is clear what the comment step needs.
# `issues: write` is what posting the report costs; GitHub withholds it on
# Dependabot and fork pull requests regardless of what is asked for here, which
# is why the step treats it as optional.
permissions:
  contents: read
  issues: write
  pull-requests: write

env:
  CARGO_TERM_COLOR: always
  # NOTE: core shards are intentionally left disabled here. `FELIX_CORE_SHARDS=N`
  # does not simply place work on N cores -- it also *replaces* the publish worker
  # count (`worker_count = shards.len()` in serving/quic/handlers/publish/worker.rs), so N=2 halves
  # publish parallelism from the default of 4. And nothing caps the main runtime,
  # which still spawns num_cpus=4 worker threads, so 2 pinned shard threads land on
  # cores 0-1 alongside them: 6 threads on 4 CPUs, with two cores double-booked.
  # Measured net effect on these runners was a regression. Thread-per-core is worth
  # evaluating on dedicated many-core hardware, not a shared 4-vCPU runner.
  # One target directory per checkout, and NOT a shared one.
  #
  # Sharing looks like an easy win -- third-party dependencies compile once
  # instead of twice -- but the baseline worktree and the PR checkout are two
  # copies of the *same* workspace, and cargo derives a path dependency's
  # metadata hash from its name and version, not from which checkout it came
  # from. Both copies of `felix-router` therefore claim the same unit in the
  # target dir, and whichever built last wins.
  #
  # The failure mode that matters is not the loud one. A PR that adds a
  # cross-crate API fails to compile, which is at least obvious. A PR that only
  # changes a function body compiles fine -- against the baseline's code -- and
  # the job then benchmarks the merge-base twice and reports no change.
  CARGO_TARGET_DIR_BASELINE: /tmp/felix-perf-target-baseline
  CARGO_TARGET_DIR_CANDIDATE: /tmp/felix-perf-target-candidate

jobs:
  perf-compare:
    # Both sides run in this one job, so the runner never skews the comparison.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 240
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: "1.97.1"
          components: rustfmt

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> /tmp/felix-perf-target-baseline
            . -> /tmp/felix-perf-target-candidate

      - name: Determine merge-base
        id: mergebase
        run: |
          set -euo pipefail
          MERGE_BASE=$(git merge-base "${{ github.event.pull_request.base.sha }}" HEAD)
          echo "sha=$MERGE_BASE" >> "$GITHUB_OUTPUT"
          echo "Merge-base: $MERGE_BASE"

      - name: Add baseline worktree
        run: git worktree add /tmp/felix-baseline "${{ steps.mergebase.outputs.sha }}"

      # Every step from here through "Compare" is `continue-on-error: true` and
      # has an `id:` so the comment step can report exactly what happened
      # instead of the whole job going red. This isn't just belt-and-braces:
      # the merge-base for THIS repo's very first perf-pr.yml PR predates
      # scripts/perf/ci_subset_*.yml existing at all, so "config file missing
      # on an older baseline commit" is a real, expected case, not just a
      # hypothetical one -- and the whole point of this check being advisory
      # is that infra hiccups here must never block a PR.
      - name: Run baseline benchmarks
        id: baseline
        continue-on-error: true
        working-directory: /tmp/felix-baseline
        env:
          CARGO_TARGET_DIR: ${{ env.CARGO_TARGET_DIR_BASELINE }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/felix-perf-results
          if [ ! -f scripts/perf/ci_subset_latency.yml ]; then
            echo "::warning::scripts/perf/ci_subset_latency.yml doesn't exist at the merge-base (${{ steps.mergebase.outputs.sha }}) -- likely a commit predating this benchmarking pipeline. Skipping baseline."
            echo "reason=config_missing_at_baseline" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          # Drive both revisions with the PR's harness and workload definitions.
          # The merge-base's parser may not understand its own current output, and
          # a workload added by the PR may intentionally exercise a baseline bug.
          cp "$GITHUB_WORKSPACE/scripts/perf/run_latency_matrix.py" scripts/perf/run_latency_matrix.py
          cp "$GITHUB_WORKSPACE/scripts/perf/ci_subset_latency.yml" scripts/perf/ci_subset_latency.yml
          cp "$GITHUB_WORKSPACE/scripts/perf/ci_subset_throughput.yml" scripts/perf/ci_subset_throughput.yml
          cp "$GITHUB_WORKSPACE/scripts/perf/ci_subset_large_payload.yml" scripts/perf/ci_subset_large_payload.yml
          python3 scripts/perf/run_latency_matrix.py --config scripts/perf/ci_subset_latency.yml
          python3 scripts/perf/run_latency_matrix.py --config scripts/perf/ci_subset_throughput.yml
          python3 scripts/perf/run_latency_matrix.py --config scripts/perf/ci_subset_large_payload.yml
          cp data/raw/latency_demo_runs.jsonl /tmp/felix-perf-results/baseline.jsonl

      - name: Run candidate benchmarks
        id: candidate
        continue-on-error: true
        env:
          CARGO_TARGET_DIR: ${{ env.CARGO_TARGET_DIR_CANDIDATE }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/felix-perf-results
          rm -f data/raw/latency_demo_runs.jsonl
          rm -rf data/raw/stdout
          python3 scripts/perf/run_latency_matrix.py --config scripts/perf/ci_subset_latency.yml
          python3 scripts/perf/run_latency_matrix.py --config scripts/perf/ci_subset_throughput.yml
          # The subsets above send 1 KiB or less, which never reaches the
          # subscriber byte bound. This one cell does.
          python3 scripts/perf/run_latency_matrix.py --config scripts/perf/ci_subset_large_payload.yml
          cp data/raw/latency_demo_runs.jsonl /tmp/felix-perf-results/candidate.jsonl

      - name: Compare baseline vs candidate
        id: compare
        if: steps.baseline.outcome == 'success' && steps.candidate.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          python3 scripts/perf/compare_benchmarks.py \
            --baseline /tmp/felix-perf-results/baseline.jsonl \
            --candidate /tmp/felix-perf-results/candidate.jsonl \
            --output-markdown /tmp/felix-perf-results/comment.md \
            --output-json /tmp/felix-perf-results/result.json

      - name: Post or update PR comment
        if: always()
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- felix-perf-pr-comment -->';

            let body;
            const commentPath = '/tmp/felix-perf-results/comment.md';
            if (fs.existsSync(commentPath)) {
              body = fs.readFileSync(commentPath, 'utf8');
            } else {
              const baselineOk = '${{ steps.baseline.outcome }}' === 'success';
              const candidateOk = '${{ steps.candidate.outcome }}' === 'success';
              const baselineReason = '${{ steps.baseline.outputs.reason }}';
              let why;
              if (!baselineOk && baselineReason === 'config_missing_at_baseline') {
                why = 'the benchmark config didn\'t exist yet at this PR\'s merge-base ' +
                      '(likely comparing against a commit that predates this pipeline).';
              } else if (!baselineOk) {
                why = 'the baseline benchmark run failed (see the "Run baseline benchmarks" job step).';
              } else if (!candidateOk) {
                why = 'the candidate benchmark run failed (see the "Run candidate benchmarks" job step).';
              } else {
                why = 'the comparison step failed to produce output (see the "Compare baseline vs candidate" job step).';
              }
              body = `:construction: Performance comparison unavailable this run: ${why}\n\n` +
                     'This does not block merging.';
            }
            const fullBody = `${marker}\n## Performance comparison (fast subset)\n\n${body}`;

            // The report goes to the job summary unconditionally. Posting it as
            // a comment is a convenience on top of that, and is allowed to fail:
            // Dependabot pull requests run with a read-only GITHUB_TOKEN, as do
            // pull requests from forks, so `issues: write` is simply not
            // available there. This workflow is advisory and must never fail a
            // check -- losing the comment costs nothing when the same content is
            // one click away in the summary.
            await core.summary.addRaw(fullBody).write();

            try {
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
              });
              const existing = comments.find((c) => c.body && c.body.includes(marker));

              if (existing) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existing.id,
                  body: fullBody,
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  body: fullBody,
                });
              }
            } catch (error) {
              core.warning(
                `Could not post the performance comment (${error.message}). ` +
                'The report is in this job\'s summary. This is expected on ' +
                'Dependabot and fork pull requests, which get a read-only token.'
              );
            }

      - name: Upload raw results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: perf-pr-results
          path: /tmp/felix-perf-results/
          if-no-files-found: warn

      - name: Remove baseline worktree
        if: always()
        run: git worktree remove /tmp/felix-baseline --force || true
