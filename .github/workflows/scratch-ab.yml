name: Scratch A/B wiped

on:
  push:
    branches: ["scratch/1942-ab-*"]

jobs:
  ab:
    runs-on: ${{ vars.FELIX_LARGE_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        build: [instrumented]
    env:
      CARGO_TERM_COLOR: never
      FELIX_TEST_TIMEOUT_SCALE: "5"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: rustup update stable
      - uses: taiki-e/install-action@32e16a23c68a001a1621efca19f131f965d4d122 # cargo-llvm-cov
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: A/B
        shell: bash
        env:
          RUST_LOG: info,felix_controlplane_service=debug
        run: |
          set -o pipefail
          if [ "${{ matrix.build }}" = instrumented ]; then
            source <(cargo llvm-cov show-env --export-prefix)
          fi
          cargo build --all-features -p felix-broker-service --bin felix-broker
          cargo test --all-features -p felix-cluster --test failures --no-run
          mkdir -p "$RUNNER_TEMP/logs"
          FELIX_TEST_CLUSTER_LOG_DIR="$RUNNER_TEMP/logs" cargo test --all-features -p felix-cluster --test failures \
            > "$RUNNER_TEMP/logs/out.txt" 2>&1 && ok=1 || ok=0
          grep -E "^test .*FAILED|test result" "$RUNNER_TEMP/logs/out.txt" || true
          [ "$ok" = 1 ]
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ab-logs-${{ matrix.build }}
          path: ${{ runner.temp }}/logs
          retention-days: 3
