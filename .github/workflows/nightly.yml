name: Nightly

# A build of main to try before cutting a release. It builds through
# release.yml, so a nightly is the same binaries, wheels, addons and images a
# release would ship, and it publishes only to GitHub: images under the
# `nightly` tags on GHCR and a rolling `nightly` pre-release. Nothing goes to
# crates.io, npm or PyPI, where a version is permanent.
#
# A pull request that changes this file or release.yml runs everything as a
# dry run: every artifact is built and the smoke test runs against images
# built in the runner, and nothing is published.

on:
  schedule:
    - cron: "41 4 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Build even if the nightly already points at the newest green commit
        type: boolean
        default: false
      dry_run:
        description: Build and smoke-test, publish nothing
        type: boolean
        default: false
  pull_request:
    paths:
      - .github/workflows/nightly.yml
      - .github/workflows/release.yml
      - scripts/ci/nightly_smoke.sh

concurrency:
  group: nightly-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  plan:
    name: Pick the commit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      build: ${{ steps.pick.outputs.build }}
      dry_run: ${{ steps.pick.outputs.dry_run }}
      sha: ${{ steps.pick.outputs.sha }}
      date: ${{ steps.pick.outputs.date }}
      tag: ${{ steps.pick.outputs.tag }}
      version: ${{ steps.pick.outputs.version }}
      ci_url: ${{ steps.pick.outputs.ci_url }}
    steps:
      # The newest main commit whose CI passed, not main's head: a nightly that
      # waits for a green head can go days without building anything, and one
      # that ignores CI ships whatever broke it. Docs-only commits skip CI, so
      # they ride along with the next code change.
      #
      # Walk main's commits rather than asking for the newest green run: the
      # runs API does not reliably order filtered results.
      - name: Pick the commit
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
          FORCE: ${{ inputs.force || false }}
          DRY_RUN: ${{ inputs.dry_run || false }}
        run: |
          set -euo pipefail
          dry_run=false
          if [ "$EVENT" = pull_request ]; then
            sha="$PR_SHA"
            ci_url="${GITHUB_SERVER_URL}/${REPO}/pull/${{ github.event.pull_request.number }}/checks"
            dry_run=true
          else
            run=
            for candidate in $(gh api "repos/${REPO}/commits?sha=main&per_page=50" --jq '.[].sha'); do
              run=$(gh api "repos/${REPO}/actions/workflows/ci.yml/runs?head_sha=${candidate}&event=push&status=success&per_page=1" \
                --jq '.workflow_runs[0] // empty | {headSha: .head_sha, url: .html_url}')
              [ -n "$run" ] && break
            done
            if [ -z "$run" ]; then
              echo "::error::none of main's last 50 commits has a successful CI run to build from"
              exit 1
            fi
            sha=$(jq -r .headSha <<< "$run")
            ci_url=$(jq -r .url <<< "$run")
            [ "$DRY_RUN" = true ] && dry_run=true
            # Only main publishes. A dispatch from a branch is a rehearsal.
            [ "$GITHUB_REF" = refs/heads/main ] || dry_run=true
          fi

          current=$(gh api "repos/${REPO}/git/ref/tags/nightly" --jq .object.sha 2>/dev/null || true)
          build=true
          if [ "$EVENT" != pull_request ] && [ "$dry_run" = false ] \
             && [ "$FORCE" != true ] && [ "$current" = "$sha" ]; then
            echo "nightly already points at ${sha}; nothing new to build"
            build=false
          fi

          date=$(date -u +%Y%m%d)
          short=${sha:0:7}
          base=$(gh api "repos/${REPO}/contents/Cargo.toml?ref=${sha}" -H 'Accept: application/vnd.github.raw' \
            | sed -n 's/^version = "\(.*\)"/\1/p' | head -1)
          {
            echo "build=${build}"
            echo "dry_run=${dry_run}"
            echo "sha=${sha}"
            echo "date=${date}"
            echo "tag=nightly-${date}"
            echo "version=${base}-nightly.${date}+${short}"
            echo "ci_url=${ci_url}"
          } | tee -a "$GITHUB_OUTPUT"

  build:
    name: Build
    needs: plan
    if: needs.plan.outputs.build == 'true'
    uses: ./.github/workflows/release.yml
    permissions:
      contents: write
      packages: write
      id-token: write
    with:
      tag: ${{ needs.plan.outputs.tag }}
      ref: ${{ needs.plan.outputs.sha }}
      dry_run: ${{ needs.plan.outputs.dry_run == 'true' }}
      nightly: ${{ needs.plan.outputs.date }}

  smoke:
    name: Smoke test the images
    needs: [plan, build]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      DRY_RUN: ${{ needs.plan.outputs.dry_run }}
      TAG: ${{ needs.plan.outputs.tag }}
    steps:
      # The smoke script comes from this workflow's commit, not the built one:
      # the nightly builds the newest main commit with green CI, which can
      # predate the script.
      - uses: actions/checkout@v7

      - name: Registry owner
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Pull the published images
        if: env.DRY_RUN != 'true'
        run: |
          set -euo pipefail
          for image in felix-broker felix-controlplane felixctl; do
            docker pull "ghcr.io/${OWNER}/${image}:${TAG}"
          done

      # A dry run pushed nothing, so build the same images here instead. The
      # cache scopes are release.yml's, which built them earlier in this run.
      - uses: docker/setup-buildx-action@v4
        if: env.DRY_RUN == 'true'
      - name: Build felix-broker
        if: env.DRY_RUN == 'true'
        uses: docker/build-push-action@v7
        with:
          # Base images from the mirror, not Docker Hub (see the Dockerfile).
          build-args: BASE_REGISTRY=public.ecr.aws/docker/library
          context: .
          file: docker/broker.Dockerfile
          load: true
          tags: ghcr.io/${{ env.OWNER }}/felix-broker:${{ env.TAG }}
          cache-from: type=gha,scope=felix-broker-amd64
      - name: Build felix-controlplane
        if: env.DRY_RUN == 'true'
        uses: docker/build-push-action@v7
        with:
          # Base images from the mirror, not Docker Hub (see the Dockerfile).
          build-args: BASE_REGISTRY=public.ecr.aws/docker/library
          context: .
          file: docker/controlplane.Dockerfile
          load: true
          tags: ghcr.io/${{ env.OWNER }}/felix-controlplane:${{ env.TAG }}
          cache-from: type=gha,scope=felix-controlplane-amd64
      - name: Build felixctl
        if: env.DRY_RUN == 'true'
        uses: docker/build-push-action@v7
        with:
          # Base images from the mirror, not Docker Hub (see the Dockerfile).
          build-args: BASE_REGISTRY=public.ecr.aws/docker/library
          context: .
          file: docker/felixctl.Dockerfile
          load: true
          tags: ghcr.io/${{ env.OWNER }}/felixctl:${{ env.TAG }}
          cache-from: type=gha,scope=felixctl-amd64

      - name: Publish and subscribe through the images
        run: scripts/ci/nightly_smoke.sh "ghcr.io/${OWNER}" "${TAG}"

  # After the smoke test, so a nightly whose images cannot carry one message
  # never becomes the release people download.
  publish:
    name: Move the nightly release
    needs: [plan, build, smoke]
    if: needs.plan.outputs.dry_run != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      SHA: ${{ needs.plan.outputs.sha }}
      TAG: ${{ needs.plan.outputs.tag }}
      VERSION: ${{ needs.plan.outputs.version }}
      CI_URL: ${{ needs.plan.outputs.ci_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.sha }}

      # What release.yml would attach to a release, from its workflow artifacts.
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
          pattern: felix*-${{ needs.plan.outputs.tag }}-*
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
          pattern: wheels-*
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
          pattern: napi-*

      - name: Checksums
        working-directory: dist
        run: |
          set -euo pipefail
          rm -f SHA256SUMS ./*.sha256
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS

      - name: Release notes
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          {
            echo "Nightly build \`${VERSION}\` of [\`${SHA:0:7}\`](${GITHUB_SERVER_URL}/${REPO}/commit/${SHA}), built $(date -u +%Y-%m-%d)."
            echo
            echo "Built from the newest commit on main whose [CI run](${CI_URL}) passed, then smoke-tested. That is all the testing it has had: do not run it in production."
            echo
            echo '```bash'
            echo "docker pull ghcr.io/${owner}/felix-broker:${TAG}"
            echo "docker pull ghcr.io/${owner}/felix-controlplane:${TAG}"
            echo "docker pull ghcr.io/${owner}/felixctl:${TAG}"
            echo '```'
            echo
            echo "The binaries report the version of the last release, not this build's."
            echo
            echo "## Unreleased changes"
            echo
            python3 scripts/changelog_section.py Unreleased
          } > notes.md
          cat notes.md

      # The tag moves first, so the release is recreated on the new commit.
      # Deleting and recreating rather than editing drops the previous night's
      # assets without having to list them.
      - name: Move the nightly tag and release
        run: |
          set -euo pipefail
          if gh api "repos/${REPO}/git/ref/tags/nightly" > /dev/null 2>&1; then
            gh api -X PATCH "repos/${REPO}/git/refs/tags/nightly" -f sha="$SHA" -F force=true > /dev/null
          else
            gh api "repos/${REPO}/git/refs" -f ref=refs/tags/nightly -f sha="$SHA" > /dev/null
          fi
          gh release delete nightly -R "$REPO" --yes 2>/dev/null || true
          gh release create nightly -R "$REPO" --verify-tag --prerelease --latest=false \
            --title "Nightly ${VERSION}" --notes-file notes.md dist/*

  # Dated image tags past two weeks. Only the tagged manifest list goes; the
  # platform manifests and signatures under it are left untagged.
  prune:
    name: Prune old nightly images
    needs: [plan, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Delete nightly-YYYYMMDD tags older than 14 days
        # The token can only delete versions of packages that grant this
        # repository admin access. A failure here is not worth failing the
        # nightly over.
        continue-on-error: true
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          cutoff=$(date -u -d '14 days ago' +%Y%m%d)
          for image in felix-broker felix-controlplane felixctl; do
            gh api --paginate "orgs/${owner}/packages/container/${image}/versions" \
              --jq '.[] | select(.metadata.container.tags | length > 0)
                         | select(all(.metadata.container.tags[]; test("^nightly-[0-9]{8}$")))
                         | "\(.id) \(.metadata.container.tags[0])"' |
            while read -r id tag; do
              if [ "${tag#nightly-}" -lt "$cutoff" ]; then
                echo "deleting ${image}:${tag}"
                gh api -X DELETE "orgs/${owner}/packages/container/${image}/versions/${id}"
              fi
            done
          done
