name: Perf scratch (#1830 counter log flip)

# Temporary: RF 3 cluster A/B for #1830. a = main (56150009c),
# f = this branch's parent commit (the #1830 change). Deleted with the branch.

on:
  push:
    branches: [scratch/perf-1830b]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  A_SHA: 56150009c6e89fb002564d96a3e4f982b4d200fb
  BENCH_STEADY_SECS: "60"

jobs:
  build:
    runs-on: ${{ vars.FELIX_LARGE_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.99.1"
      - name: Rust cache
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build two sides
        run: |
          set -euo pipefail
          out=/tmp/perf-bin; mkdir -p $out
          exe() {
            cargo test --release -p "$1" --test "$2" --no-run --message-format=json \
              | jq -r 'select(.profile.test == true and .executable != null) | .executable' | tail -1
          }
          cp "$(exe felix-cluster replicated_bench)" $out/replicated_bench
          f_sha=$(git rev-parse HEAD~1)
          for side in a f; do
            case $side in a) sha=$A_SHA;; f) sha=$f_sha;; esac
            git checkout --detach -q "$sha"
            cargo build --release -p felix-broker-service --bin felix-broker
            cp target/release/felix-broker $out/felix-broker-$side
          done
          sha256sum $out/*
      - uses: actions/upload-artifact@v7
        with:
          name: perf-bin
          path: /tmp/perf-bin/
          retention-days: 3

  run:
    needs: build
    runs-on: ${{ vars.FELIX_LARGE_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      ROUNDS: "6"
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: perf-bin
          path: /tmp/perf-bin
      - name: Machine
        run: nproc; free -g; uname -a; chmod +x /tmp/perf-bin/*
      - name: Cluster rounds, alternating sides
        run: |
          set -uo pipefail
          p=/tmp/perf; mkdir -p $p/out $p/bin; cd $p
          cp /tmp/perf-bin/replicated_bench $p/bin/replicated_bench
          cp /tmp/perf-bin/felix-broker-f $p/bin/felix-broker
          for side in a f; do
            printf '#!/bin/bash\nshift\nexec /tmp/perf-bin/felix-broker-%s "$@"\n' "$side" > $p/wrap-$side.sh
            chmod +x $p/wrap-$side.sh
          done
          for round in $(seq 1 "$ROUNDS"); do
            if [ $(( (round + ${{ matrix.shard }}) % 2 )) = 0 ]; then order="a f"; else order="f a"; fi
            for side in $order; do
              r=${{ matrix.shard }}-$round
              echo "::group::round $r side $side"
              FELIX_BROKER_WRAPPER=$p/wrap-$side.sh BENCH_SIDE=$side BENCH_ROUND=$r \
                timeout 1500 $p/bin/replicated_bench --ignored --nocapture --test-threads=1 2>&1 \
                | tee $p/out/cluster-$r-$side.log || echo "::warning::round $r side $side failed"
              grep -h 'BENCH_JSON ' $p/out/cluster-$r-$side.log | sed 's/^.*BENCH_JSON //' >> $p/out/cluster.jsonl || true
              echo "::endgroup::"
            done
          done
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: perf-out-${{ matrix.shard }}
          path: /tmp/perf/out/
