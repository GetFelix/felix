name: Perf scratch (#1796 listener)

# Temporary: control-path microbench and RF 3 cluster A/B for the #1796
# follow-up. Sides: p = main before #1800, m = main after #1800, f = META_CAP 2, g = FENCE_INLINE,
# f/g = #1800 with fences that may write capped at 2/8 per broker. Deleted with the branch.

on:
  push:
    branches: [scratch/perf-1796]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  P_SHA: 3e81b94ef04fb13709eb8e1a5ab3b53fdbbfc34b
  M_SHA: 15004f5354ecec6b160a6f4b22237486df26d80a
  BENCH_STEADY_SECS: "40"

jobs:
  build:
    runs-on: ${{ vars.FELIX_LARGE_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.99.1"
      - name: Rust cache
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build three sides
        run: |
          set -euo pipefail
          out=/tmp/perf-bin; mkdir -p $out
          f_sha=$(git rev-parse HEAD)
          cp crates/server/felix-replication/tests/control_path_bench.rs /tmp/control_path_bench.rs
          exe() {
            cargo test --release -p "$1" --test "$2" --no-run --message-format=json \
              | jq -r 'select(.profile.test == true and .executable != null) | .executable' | tail -1
          }
          for side in p m f; do
            case $side in p) sha=$P_SHA;; m) sha=$M_SHA;; f) sha=$f_sha;; esac
            git checkout --detach -q "$sha"
            mkdir -p crates/server/felix-replication/tests
            cp /tmp/control_path_bench.rs crates/server/felix-replication/tests/control_path_bench.rs
            cargo build --release -p felix-broker-service --bin felix-broker
            cp target/release/felix-broker $out/felix-broker-$side
            cp "$(exe felix-replication control_path_bench)" $out/control_path_bench-$side
            if [ $side = f ]; then cp "$(exe felix-cluster replicated_bench)" $out/replicated_bench; fi
            git checkout -q -- . ; git clean -fdq crates/server/felix-replication/tests
          done
          git checkout --detach -q "$f_sha"
          sha256sum $out/*
      - uses: actions/upload-artifact@v7
        with:
          name: perf-bin
          path: /tmp/perf-bin/
          retention-days: 3

  run:
    needs: build
    runs-on: ${{ vars.FELIX_LARGE_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      ROUNDS: "6"
      MICRO_ROUNDS: "0"
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: perf-bin
          path: /tmp/perf-bin
      - name: Machine
        run: nproc; free -g; uname -a; chmod +x /tmp/perf-bin/*
      - name: Control-path microbench, rotating sides
        run: |
          set -uo pipefail
          p=/tmp/perf; mkdir -p $p/out; cd $p
          for round in $(seq 1 "$MICRO_ROUNDS"); do
            sides=(p m f); k=$(( (round + ${{ matrix.shard }}) % 3 ))
            for i in 0 1 2; do
              side=${sides[$(( (i + k) % 3 ))]}
              BENCH_SIDE=$side BENCH_ROUND=${{ matrix.shard }}-$round \
                /tmp/perf-bin/control_path_bench-$side --ignored --nocapture --test-threads=1 2>&1 \
                | tee -a $p/out/micro.log | grep BENCH_JSON | sed 's/^.*BENCH_JSON //' >> $p/out/micro.jsonl || true
            done
          done
      - name: Cluster rounds, rotating sides
        run: |
          set -uo pipefail
          p=/tmp/perf; cd $p
          mkdir -p $p/bin
          cp /tmp/perf-bin/replicated_bench $p/bin/replicated_bench
          cp /tmp/perf-bin/felix-broker-f $p/bin/felix-broker
          for side in p m; do
            printf '#!/bin/bash\nshift\nexec /tmp/perf-bin/felix-broker-%s "$@"\n' "$side" > $p/wrap-$side.sh
            chmod +x $p/wrap-$side.sh
          done
          printf '#!/bin/bash\nshift\nFELIX_SCRATCH_META_CAP=2 exec /tmp/perf-bin/felix-broker-f "$@"\n' > $p/wrap-f.sh
          printf '#!/bin/bash\nshift\nFELIX_SCRATCH_FENCE_INLINE=1 exec /tmp/perf-bin/felix-broker-f "$@"\n' > $p/wrap-g.sh
          chmod +x $p/wrap-f.sh $p/wrap-g.sh
          for round in $(seq 1 "$ROUNDS"); do
            sides=(p m f g); k=$(( (round + ${{ matrix.shard }}) % 4 ))
            for i in 0 1 2 3; do
              side=${sides[$(( (i + k) % 4 ))]}
              r=${{ matrix.shard }}-$round
              echo "::group::round $r side $side"
              FELIX_BROKER_WRAPPER=$p/wrap-$side.sh BENCH_SIDE=$side BENCH_ROUND=$r \
                timeout 1500 $p/bin/replicated_bench --ignored --nocapture --test-threads=1 2>&1 \
                | tee $p/out/cluster-$r-$side.log || echo "::warning::round $r side $side failed"
              grep -h 'BENCH_JSON ' $p/out/cluster-$r-$side.log | sed 's/^.*BENCH_JSON //' >> $p/out/cluster.jsonl || true
              echo "::endgroup::"
            done
          done
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: perf-out-${{ matrix.shard }}
          path: /tmp/perf/out/
