name: Perf scratch (#1796 listener)

# Temporary: A/B of the peer listener change against its main parent. Deleted
# with the branch.

on:
  push:
    branches: [scratch/perf-1796]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  A_SHA: f8f023bded359963b9b61c3990492c10ea1cd00c
  ROUNDS: "6"
  STORAGE_RUNS: "3"

jobs:
  ab:
    runs-on: ${{ vars.FELIX_LARGE_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.99.1"
          components: rustfmt

      - name: Rust cache
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Machine
        run: |
          nproc; free -g; df -h /tmp; uname -a
          echo "B = $(git rev-parse HEAD)  A = $A_SHA"
          git diff --stat "$A_SHA" HEAD -- crates services

      - name: Build side B and the measurement binaries
        run: |
          set -euo pipefail
          p=/tmp/perf; mkdir -p $p/a $p/b $p/bin $p/out
          cargo build --release -p felix-broker-service --bin felix-broker
          cp target/release/felix-broker $p/b/felix-broker
          exe() {
            cargo test --release -p "$1" --test "$2" --no-run --message-format=json \
              | jq -r 'select(.profile.test == true and .executable != null) | .executable' | tail -1
          }
          cp "$(exe felix-cluster replicated_bench)" $p/bin/replicated_bench
          cp "$(exe felix-storage ballot_fsync_contention)" $p/bin/ballot_fsync_contention
          # The harness looks for felix-broker beside its own executable; the
          # wrapper decides which side actually runs.
          cp $p/b/felix-broker $p/bin/felix-broker

      - name: Build side A (main)
        run: |
          set -euo pipefail
          p=/tmp/perf
          branch_sha=$(git rev-parse HEAD)
          git checkout --detach "$A_SHA"
          cargo build --release -p felix-broker-service --bin felix-broker
          cp target/release/felix-broker $p/a/felix-broker
          git checkout --detach "$branch_sha"
          sha256sum $p/a/felix-broker $p/b/felix-broker
          if cmp -s $p/a/felix-broker $p/b/felix-broker; then
            echo "::error::A and B brokers are identical"; exit 1
          fi
          for side in a b; do
            printf '#!/bin/bash\nshift\nexec %s/%s/felix-broker "$@"\n' "$p" "$side" > $p/wrap-$side.sh
            chmod +x $p/wrap-$side.sh
          done

      - name: Storage microbench (ballot raises vs commits)
        run: |
          set -uo pipefail
          p=/tmp/perf
          cd $p
          for run in $(seq 1 "$STORAGE_RUNS"); do
            echo "::group::storage run $run"
            $p/bin/ballot_fsync_contention --ignored --nocapture --test-threads=1 2>&1 | tee $p/out/storage-$run.log \
              || echo "::warning::storage run $run failed"
            echo "::endgroup::"
          done

      - name: Cluster rounds, alternating
        run: |
          set -uo pipefail
          p=/tmp/perf
          cd $p
          run_side() {
            local side="$1" round="$2"
            echo "::group::round $round side $side"
            FELIX_BROKER_WRAPPER=$p/wrap-$side.sh BENCH_SIDE=$side BENCH_ROUND=$round \
              timeout 1500 $p/bin/replicated_bench --ignored --nocapture --test-threads=1 2>&1 \
              | tee $p/out/cluster-$round-$side.log || echo "::warning::round $round side $side failed"
            grep -h '^BENCH_JSON ' $p/out/cluster-$round-$side.log | sed 's/^BENCH_JSON //' >> $p/out/cluster.jsonl || true
            echo "::endgroup::"
          }
          for round in $(seq 1 "$ROUNDS"); do
            if [ $((round % 2)) -eq 1 ]; then run_side a $round; run_side b $round
            else run_side b $round; run_side a $round; fi
          done

      - name: Summarize
        if: always()
        run: |
          set -euo pipefail
          python3 - <<'EOF' | tee /tmp/perf/out/summary.md
          import glob, json, statistics
          def med(v):
              v = [x for x in v if x is not None]
              return statistics.median(v) if v else None
          def fmt(v):
              v = [x for x in v if x is not None]
              if not v: return "-"
              return f"{statistics.median(v):.3f} ({min(v):.3f}-{max(v):.3f})"
          rows = [json.loads(l) for l in open('/tmp/perf/out/cluster.jsonl')] if glob.glob('/tmp/perf/out/cluster.jsonl') else []
          def derived(r):
              out = dict((k, v) for k, v in r.items() if isinstance(v, (int, float)) and not isinstance(v, bool))
              for label, m in r.get('metrics', {}).items():
                  cnt = sum(n['count'] for n in m.values())
                  tot = sum(n['count'] * n['mean_ms'] for n in m.values() if n['mean_ms'] is not None)
                  out[f'{label}.count'] = cnt
                  out[f'{label}.mean_ms'] = tot / cnt if cnt else None
                  for q in ('0.5', '0.99', '0.999', '1'):
                      vals = [n['window'].get(f'q{q}_ms') for n in m.values()]
                      vals = [x for x in vals if x is not None]
                      out[f'{label}.max_node_q{q}_ms'] = max(vals) if vals else None
              return out
          print("## Cluster A/B (A = main, B = PR); median (min-max) across rounds\n")
          for phase in ('steady', 'burst'):
              by = {s: [derived(r) for r in rows if r['phase'] == phase and r['side'] == s] for s in 'ab'}
              print(f"### {phase} (rounds: A={len(by['a'])}, B={len(by['b'])})\n")
              print("| metric | A | B | B/A (median) | A rounds | B rounds |")
              print("|---|---|---|---|---|---|")
              keys = []
              for s in 'ab':
                  for d in by[s]:
                      for k in d:
                          if k not in keys and k not in ('publishers', 'shards', 'streams'): keys.append(k)
              for k in keys:
                  a = [d.get(k) for d in by['a']]; b = [d.get(k) for d in by['b']]
                  ma, mb = med(a), med(b)
                  ratio = f"{mb/ma:.3f}" if ma and mb is not None else "-"
                  ra = " ".join("-" if x is None else f"{x:.5g}" for x in a)
                  rb = " ".join("-" if x is None else f"{x:.5g}" for x in b)
                  print(f"| {k} | {fmt(a)} | {fmt(b)} | {ratio} | {ra} | {rb} |")
              print()
          print("## Storage microbench (same code both sides); median (min-max) across runs\n")
          cells = {}
          for f in sorted(glob.glob('/tmp/perf/out/storage-*.log')):
              for l in open(f):
                  if l.startswith('BENCH_JSON '):
                      r = json.loads(l[len('BENCH_JSON '):])
                      cells.setdefault((r['appenders'], r['k']), []).append(r)
          cols = ['commits_per_s', 'commit_p50_us', 'commit_p99_us', 'commit_p999_us', 'raise_p50_us', 'raise_p99_us', 'raises_per_s']
          print("| appenders | K | " + " | ".join(cols) + " |")
          print("|---|---|" + "---|" * len(cols))
          for (ap, k), rs in sorted(cells.items()):
              print(f"| {ap} | {k} | " + " | ".join(fmt([r[c] for r in rs]) for c in cols) + " |")
          EOF
          cat /tmp/perf/out/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: perf-1796
          path: /tmp/perf/out/
          if-no-files-found: warn
