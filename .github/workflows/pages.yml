name: Deploy Documentation to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'docs-site/**'
      - '.github/workflows/pages.yml'
  workflow_run:
    workflows:
      - Performance Data Publish
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'docs-site/package-lock.json'

      - name: Install dependencies
        run: npm ci --prefix docs-site

      - name: Build documentation
        run: npm run build --prefix docs-site

      - name: Checkout benchmark dashboards
        uses: actions/checkout@v7
        with:
          ref: benchmark-data
          path: benchmark-data
          sparse-checkout: |
            latency
            latency-v2
            throughput
            throughput-v2
          sparse-checkout-cone-mode: false

      - name: Add benchmark dashboards to Pages
        run: |
          set -euo pipefail
          mkdir -p docs-site/dist/benchmarks
          latency_dir=latency-v2
          throughput_dir=throughput-v2
          [ -d "benchmark-data/$latency_dir" ] || latency_dir=latency
          [ -d "benchmark-data/$throughput_dir" ] || throughput_dir=throughput
          cp -R "benchmark-data/$latency_dir" docs-site/dist/benchmarks/latency
          cp -R "benchmark-data/$throughput_dir" docs-site/dist/benchmarks/throughput
          npm pack chart.js@2.9.2 --silent --pack-destination /tmp
          mkdir -p /tmp/chartjs
          tar -xzf /tmp/chart.js-2.9.2.tgz -C /tmp/chartjs
          cp /tmp/chartjs/package/dist/Chart.min.js docs-site/dist/benchmarks/chart.min.js
          cp scripts/perf/benchmark-chart-enhancements.js docs-site/dist/benchmarks/chart-enhancements.js
          for dashboard in latency throughput; do
            index="docs-site/dist/benchmarks/$dashboard/index.html"
            sed -i \
              's#https://cdn.jsdelivr.net/npm/chart.js@2.9.2/dist/Chart.min.js#../chart.min.js#' \
              "$index"
            # Load Felix's enhancements after Chart.js but before the generated
            # chart-creating script.
            sed -i \
              's#<script src="../chart.min.js"></script>#<script src="../chart.min.js"></script>\n    <script src="../chart-enhancements.js"></script>#' \
              "$index"
            grep -q 'chart-enhancements.js' "$index" \
              || { echo "::error::failed to inject chart enhancements into $index"; exit 1; }
          done

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./docs-site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
