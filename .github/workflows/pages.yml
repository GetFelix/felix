name: Deploy Documentation to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'docs-site/**'
      - 'CHANGELOG.md'
      - 'scripts/gen-release-notes.mjs'
      - 'scripts/build-docs-versions.sh'
      - 'scripts/latest-stable-tag.sh'
      - '.github/workflows/pages.yml'
  workflow_run:
    workflows:
      - Performance Data Publish
    types:
      - completed
  # A new stable release becomes the root of the site.
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # A release event checks out the tag; /next/ is always main.
          ref: main
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'docs-site/package-lock.json'

      # The root serves the newest stable release's docs, built from its tag;
      # main is built under /next/. A failure here fails the deploy.
      - name: Pick the stable release tag
        id: stable
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(scripts/latest-stable-tag.sh)
          echo "Stable release: $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Build documentation (stable at /, main at /next/)
        env:
          STABLE_TAG: ${{ steps.stable.outputs.tag }}
        run: scripts/build-docs-versions.sh "$STABLE_TAG" site

      - name: Checkout benchmark dashboards
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: benchmark-data
          path: benchmark-data
          sparse-checkout: |
            latency
            latency-v2
            throughput
            throughput-v2
          sparse-checkout-cone-mode: false

      - name: Add benchmark dashboards to Pages
        run: |
          set -euo pipefail
          mkdir -p site/benchmarks
          latency_dir=latency-v2
          throughput_dir=throughput-v2
          [ -d "benchmark-data/$latency_dir" ] || latency_dir=latency
          [ -d "benchmark-data/$throughput_dir" ] || throughput_dir=throughput
          cp -R "benchmark-data/$latency_dir" site/benchmarks/latency
          cp -R "benchmark-data/$throughput_dir" site/benchmarks/throughput
          npm pack chart.js@2.9.2 --silent --pack-destination /tmp
          mkdir -p /tmp/chartjs
          tar -xzf /tmp/chart.js-2.9.2.tgz -C /tmp/chartjs
          cp /tmp/chartjs/package/dist/Chart.min.js site/benchmarks/chart.min.js
          cp scripts/perf/benchmark-chart-enhancements.js site/benchmarks/chart-enhancements.js
          for dashboard in latency throughput; do
            index="site/benchmarks/$dashboard/index.html"
            sed -i \
              's#https://cdn.jsdelivr.net/npm/chart.js@2.9.2/dist/Chart.min.js#../chart.min.js#' \
              "$index"
            # Load Felix's enhancements after Chart.js but before the generated
            # chart-creating script.
            sed -i \
              's#<script src="../chart.min.js"></script>#<script src="../chart.min.js"></script>\n    <script src="../chart-enhancements.js"></script>#' \
              "$index"
            grep -q 'chart-enhancements.js' "$index" \
              || { echo "::error::failed to inject chart enhancements into $index"; exit 1; }
          done
          # /next/ pages link to the dashboards relatively, so it carries a copy.
          cp -R site/benchmarks site/next/benchmarks

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
