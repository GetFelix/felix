name: Gate - failover and control plane down

# Criteria 4 and 5 of the no-regression gate (docs/replication-engine.md, "The
# no-regression gate").
#
# 4. Failover time no worse than the baseline: the failover-heal scale test
#    (a broker that leads many RF 3 shards is killed, appenders keep going) on
#    the last v0.7.x release and on this commit, same runner, sides alternating.
#    The figure is the longest time any shard of the dead leader took to take a
#    publish again.
# 5. Control plane down: the replica-election failure tests, which kill or
#    restart a leader while the control plane is stopped or paused and need the
#    shard to keep serving. Run on this commit only; the criterion is absolute.
#
# `engine: raft` ends in a skip until the Raft engine exists.

on:
  workflow_dispatch:
    inputs:
      engine:
        description: "Replication engine under test"
        type: choice
        options: [hybrid, raft]
        default: hybrid
      baseline_ref:
        description: "Baseline tag or commit (the last v0.7.x release)"
        type: string
        default: "v0.7.1"
      rounds:
        description: "Rounds; each runs both failover variants once per side"
        type: string
        default: "3"
      streams:
        description: "RF 3 streams the killed broker leads, spread over three brokers"
        type: string
        default: "300"
      failover_slack:
        description: "How much slower than the baseline the failover may be, as a fraction (0 is the gate's 'no worse')"
        type: string
        default: "0"
  workflow_call:
    inputs:
      engine: { type: string, default: hybrid }
      baseline_ref: { type: string, default: "v0.7.1" }
      rounds: { type: string, default: "3" }
      streams: { type: string, default: "300" }
      failover_slack: { type: string, default: "0" }

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_TARGET_DIR_BASELINE: /tmp/felix-gate-target-baseline
  CARGO_TARGET_DIR_HEAD: /tmp/felix-gate-target-head
  FELIX_DURABLE_PREALLOCATE: "false"
  FELIX_TEST_TIMEOUT_SCALE: "3"

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.plan.outputs.run }}
    steps:
      - name: Plan
        id: plan
        env:
          ENGINE: ${{ inputs.engine }}
          BASELINE: ${{ inputs.baseline_ref }}
          ROUNDS: ${{ inputs.rounds }}
          STREAMS: ${{ inputs.streams }}
          SLACK: ${{ inputs.failover_slack }}
        run: |
          set -euo pipefail
          case "$ENGINE" in
            hybrid) echo "run=true" >> "$GITHUB_OUTPUT" ;;
            raft)
              echo "run=false" >> "$GITHUB_OUTPUT"
              echo "The Raft engine is not available yet; no failover runs." >> "$GITHUB_STEP_SUMMARY" ;;
            *) echo "engine must be hybrid or raft"; exit 1 ;;
          esac
          [[ "$BASELINE" =~ ^[A-Za-z0-9._/-]{1,100}$ ]] || { echo "bad baseline ref"; exit 1; }
          [[ "$ROUNDS" =~ ^[1-9][0-9]?$ ]] || { echo "rounds must be 1 to 99"; exit 1; }
          [[ "$STREAMS" =~ ^[1-9][0-9]{0,4}$ ]] || { echo "streams must be a count"; exit 1; }
          [[ "$SLACK" =~ ^[0-9]+(\.[0-9]+)?$ ]] || { echo "slack must be a number"; exit 1; }

  failover:
    needs: plan
    if: needs.plan.outputs.run == 'true'
    runs-on: ${{ vars.FELIX_LARGE_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 180
    steps:
      - name: Checkout head
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.99.1"

      - name: Rust cache
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            . -> /tmp/felix-gate-target-baseline
            . -> /tmp/felix-gate-target-head

      - name: Add the baseline worktree
        env:
          BASELINE: ${{ inputs.baseline_ref }}
        run: |
          set -euo pipefail
          git fetch --tags --quiet origin
          git worktree add /tmp/felix-gate-baseline "$BASELINE"
          echo "Baseline $BASELINE is $(git -C /tmp/felix-gate-baseline rev-parse --short HEAD); head is $(git rev-parse --short HEAD)." | tee -a "$GITHUB_STEP_SUMMARY"

      # The harness runs the felix-broker beside the test binary, which
      # `cargo test` does not rebuild, so each side builds both.
      - name: Build both sides
        run: |
          set -euo pipefail
          mkdir -p /tmp/felix-gate
          build() {
            local dir="$1" target="$2" name="$3"
            (
              cd "$dir"
              export CARGO_TARGET_DIR="$target"
              cargo build --release -p felix-broker-service --bin felix-broker
              cargo test --release -p felix-cluster --test scale --no-run --message-format=json |
                jq -r 'select(.profile.test == true and .target.name == "scale") | .executable' |
                tail -1 > "/tmp/felix-gate/$name.scale"
              if [ "$name" = head ]; then
                cargo test --release -p felix-cluster --test failures --no-run --message-format=json |
                  jq -r 'select(.profile.test == true and .target.name == "failures") | .executable' |
                  tail -1 > "/tmp/felix-gate/$name.failures"
              fi
            )
          }
          build /tmp/felix-gate-baseline "$CARGO_TARGET_DIR_BASELINE" baseline
          build "$GITHUB_WORKSPACE" "$CARGO_TARGET_DIR_HEAD" head

      - name: Failover time, alternating sides
        id: ab
        env:
          ROUNDS: ${{ inputs.rounds }}
          FELIX_SCALE_STREAMS: ${{ inputs.streams }}
          FELIX_TEST_CLUSTER_LOG_DIR: ${{ runner.temp }}/cluster-logs
        run: |
          set -euo pipefail
          results=/tmp/felix-gate/failover.jsonl
          : > "$results"
          for round in $(seq 1 "$ROUNDS"); do
            echo "::group::Round $round of $ROUNDS"
            if [ $((round % 2)) -eq 1 ]; then sides="baseline head"; else sides="head baseline"; fi
            for variant in without_election with_election; do
              for side in $sides; do
                exe=$(cat "/tmp/felix-gate/$side.scale")
                out="/tmp/felix-gate/$side-$variant-$round.txt"
                # A failed run still leaves its figure when it measured one.
                "$exe" --include-ignored --nocapture --test-threads 1 "failover_heal::$variant" >"$out" 2>&1 \
                  || echo "::warning::$side $variant round $round failed"
                if ms=$(python3 scripts/ci/gate_perf.py failover-max "$out"); then
                  jq -cn --arg side "$side" --arg cell "failover" --argjson round "$round" \
                    --arg variant "$variant" --argjson ms "$ms" \
                    '{side: $side, cell: "failover", variant: $variant, round: $round, outage_max_ms: $ms}' >> "$results"
                else
                  echo "::warning::$side $variant round $round has no failover figure"
                fi
              done
            done
            echo "::endgroup::"
          done

      - name: Judge failover
        id: judge
        if: always() && steps.ab.outcome != 'skipped'
        env:
          SLACK: ${{ inputs.failover_slack }}
        run: |
          set -o pipefail
          # One cell per variant, so with and without election are each held to
          # the gate.
          for variant in without_election with_election; do
            jq -c --arg v "$variant" 'select(.variant == $v) | .cell = "failover-" + $v' \
              /tmp/felix-gate/failover.jsonl
          done > /tmp/felix-gate/failover-cells.jsonl
          python3 scripts/ci/gate_perf.py compare /tmp/felix-gate/failover-cells.jsonl \
            --failover-slack "$SLACK" --md /tmp/felix-gate/failover.md --json /tmp/felix-gate/failover-verdict.json

      # Criterion 5. The control plane is stopped or paused while a leader is
      # killed or restarted; the shard must keep serving.
      - name: Control plane down
        id: cpdown
        env:
          FELIX_TEST_CLUSTER_LOG_DIR: ${{ runner.temp }}/cluster-logs
        run: |
          set -o pipefail
          exe=$(cat /tmp/felix-gate/head.failures)
          "$exe" --nocapture "replica_election::" 2>&1 | tee /tmp/felix-gate/cpdown.txt
          grep -E '^test result:' /tmp/felix-gate/cpdown.txt

      - name: Upload the outputs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gate-failover-outputs
          path: |
            /tmp/felix-gate/*.txt
            /tmp/felix-gate/*.jsonl
            /tmp/felix-gate/*.md
            /tmp/felix-gate/*-verdict.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload the broker logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: gate-failover-logs
          path: ${{ runner.temp }}/cluster-logs
          if-no-files-found: ignore
          retention-days: 7

  result:
    needs: [plan, failover]
    if: ${{ always() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: gate-failover-outputs
          path: outputs
        continue-on-error: true

      - name: Write the result
        env:
          ENGINE: ${{ inputs.engine }}
          RUN: ${{ needs.plan.outputs.run }}
          BASELINE: ${{ inputs.baseline_ref }}
        run: |
          set -euo pipefail
          out=gate-failover
          mkdir -p "$out"
          if [ "$RUN" != true ]; then
            jq -cn --arg e "$ENGINE" '{part: "failover", engine: $e, status: "unavailable", summary: "engine not available yet"}' > "$out/result.json"
            echo "### 4, 5. Failover and control plane down: not run, the $ENGINE engine is not available yet." > "$out/section.md"
            exit 0
          fi
          status=pass; summary=""
          if [ -f outputs/failover-verdict.json ]; then
            [ "$(jq -r .status outputs/failover-verdict.json)" = pass ] || status=fail
            summary="failover: $(jq -r .status outputs/failover-verdict.json)"
          else
            status=fail; summary="failover: no verdict"
          fi
          # The cargo harness prints one `test result:` line per run.
          if [ -f outputs/cpdown.txt ] && grep -q '^test result: ok\.' outputs/cpdown.txt && ! grep -q 'FAILED' outputs/cpdown.txt; then
            summary="$summary; control plane down: pass ($(grep -m1 '^test result:' outputs/cpdown.txt | sed 's/test result: ok. //; s/;.*//'))"
          else
            status=fail; summary="$summary; control plane down: fail or not run"
          fi
          jq -cn --arg e "$ENGINE" --arg s "$status" --arg m "$summary" \
            '{part: "failover", engine: $e, status: $s, summary: $m}' > "$out/result.json"
          {
            echo "### 4, 5. Failover and control plane down ($ENGINE against $BASELINE)"
            echo
            echo "Failover is the longest time a shard of the killed leader took to take a publish again, median over the rounds."
            echo
            if [ -f outputs/failover.md ]; then cat outputs/failover.md; else echo "No failover table."; fi
            echo
            echo "Control plane down: \`replica_election::\` tests on this commit."
            if [ -f outputs/cpdown.txt ]; then echo; echo '```'; grep -E '^test .* \.\.\. |^test result' outputs/cpdown.txt | head -40; echo '```'; fi
          } > "$out/section.md"
          cat "$out/section.md" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: gate-result-failover-${{ inputs.engine }}
          path: gate-failover
          retention-days: 30
