name: Raft idle groups

# Scratch branch: cache read-path before/after for PR #2482. Not for merge.

on:
  workflow_dispatch:
    inputs:
      groups:
        required: false
        default: "5000"
      transport_groups:
        required: false
        default: "1700"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  idle:
    name: Cache read path
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.99.1"
      - name: Base tree
        run: |
          set -euo pipefail
          git worktree add "$RUNNER_TEMP/base" f8422f87f
          f=crates/server/felix-replication/src/raft/cache
          cp "$f/measure.rs" "$RUNNER_TEMP/base/$f/measure.rs"
          printf '#[cfg(test)]\nmod measure;\n' >> "$RUNNER_TEMP/base/$f.rs"
      - name: Build
        run: |
          set -euo pipefail
          for d in "$GITHUB_WORKSPACE" "$RUNNER_TEMP/base"; do
            (cd "$d" && cargo test --locked --release -p felix-replication --features raft,felix-common/sim --lib --no-run)
          done
      - name: Measure
        run: |
          set -euo pipefail
          nproc; free -m
          run() {
            (cd "$1" && MEASURE_KEYS=$3 MEASURE_LABEL=$2 cargo test --locked --release -q -p felix-replication \
              --features raft,felix-common/sim --lib raft::cache::measure -- --ignored --nocapture --test-threads 1 2>&1 | grep '^cache_')
          }
          for round in 1 2 3 4; do
            for keys in 1000 1000000; do
              if [ $((round % 2)) = 1 ]; then
                run "$RUNNER_TEMP/base" before $keys; run "$GITHUB_WORKSPACE" after $keys
              else
                run "$GITHUB_WORKSPACE" after $keys; run "$RUNNER_TEMP/base" before $keys
              fi
            done
          done | tee measure.log
