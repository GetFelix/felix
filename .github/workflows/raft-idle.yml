name: Raft idle groups

# Also the home of the Raft publish latency report (the `publish-latency` job
# below), which runs only when a dispatch asks for it.
#
# What idle per-shard Raft groups cost one broker in CPU and memory
# (crates/server/felix-replication/tests/raft_idle_cpu.rs). Two idle runs:
# 5,000 groups led by one runtime whose peers are stubs, the worst case for one
# broker, and three runtimes in one process joined by the real peer transport
# on loopback. A third run adds a write burst and reports resident memory at
# its end and after a settle delay. A report, not a gate: nothing waits on it,
# and until idle groups sleep it shows the cost of ticking every group.

on:
  schedule:
    # Every night at 06:23 UTC, after the scale run.
    - cron: "23 6 * * *"
  workflow_dispatch:
    inputs:
      groups:
        description: "Groups in the stub-peer run"
        required: false
        default: "5000"
      transport_groups:
        description: "Groups in the transport run, each with a member on all three runtimes"
        required: false
        default: "1700"
      report:
        description: "idle, sizing (one run at `groups` that prints key=value lines for the sizing fit), publish-latency (RF 3 Leader and Quorum publish p50/p99 with the lease on and off), or storm (many groups electing at once)"
        required: false
        default: "idle"
      rounds:
        description: "Rounds of the publish latency report"
        required: false
        default: "3"
      burst_groups:
        description: "Groups in the write-burst run"
        required: false
        default: "300"
      peers:
        description: "sizing only: stub, real, transport, or none (the logs alone, the base to subtract)"
        required: false
        default: "transport"
      dead:
        description: "sizing only, with peers=real: stop broker c before the burst (memory under load with a broker lost)"
        required: false
        default: "0"
      heartbeat_ms:
        description: "sizing only: idle heartbeat in milliseconds, empty for the default"
        required: false
        default: ""
      burst_secs:
        description: "sizing only: seconds of write burst after the idle window, 0 for none"
        required: false
        default: "0"
      storm_rows:
        description: "Storm report rows: all, pr (2000 leader lost, formed at once, +20 ms and the slow disks), or slow (the 2000 +20 ms row and the 200 x1 row)"
        required: false
        default: "all"

permissions:
  contents: read

concurrency:
  group: raft-idle-${{ github.ref }}-${{ inputs.transport_groups || inputs.groups || 'nightly' }}-${{ inputs.report || 'idle' }}-${{ inputs.peers }}-${{ inputs.dead }}-${{ inputs.burst_secs }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  idle:
    name: Raft idle groups
    if: github.event_name != 'workflow_dispatch' || inputs.report == 'idle'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.100.0"
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: raft-idle
      - name: Build
        run: cargo test --locked --release -p felix-replication --features raft --test raft_idle_cpu --no-run
      - name: Stub peers
        env:
          RAFT_IDLE_GROUPS: ${{ inputs.groups || '5000' }}
        run: |
          set -o pipefail
          ulimit -n "$(ulimit -Hn)"
          cargo test --locked --release -p felix-replication --features raft --test raft_idle_cpu \
            -- --ignored --nocapture 2>&1 | tee raft-idle-stub.log
      - name: Real peer transport
        if: always()
        env:
          RAFT_IDLE_GROUPS: ${{ inputs.transport_groups || '1700' }}
          RAFT_IDLE_PEERS: transport
        run: |
          set -o pipefail
          ulimit -n "$(ulimit -Hn)"
          cargo test --locked --release -p felix-replication --features raft --test raft_idle_cpu \
            -- --ignored --nocapture 2>&1 | tee raft-idle-transport.log
      # What members keep resident after they were busy (#2415), as RSS, not
      # live heap. Fewer groups: every log holds its newest records in memory
      # after a burst.
      - name: Write burst
        if: always()
        timeout-minutes: 15
        env:
          RAFT_IDLE_GROUPS: ${{ inputs.burst_groups || '300' }}
          RAFT_IDLE_PEERS: transport
          RAFT_IDLE_WINDOW_SECS: "10"
          RAFT_IDLE_BURST_SECS: "120"
        run: |
          set -o pipefail
          ulimit -n "$(ulimit -Hn)"
          cargo test --locked --release -p felix-replication --features raft --test raft_idle_cpu \
            -- --ignored --nocapture 2>&1 | tee raft-idle-burst.log
      - name: Summary
        if: always()
        run: |
          {
            echo "### Raft idle groups"
            echo
            grep -hE 'idle groups|groups after|test result' raft-idle-stub.log raft-idle-transport.log raft-idle-burst.log || echo "no result"
          } >> "$GITHUB_STEP_SUMMARY"

  # One run at `groups`, for fitting a base cost plus a cost per group from a
  # ladder of dispatches. Prints `sizing key=value` lines.
  sizing:
    name: Raft sizing run
    if: github.event_name == 'workflow_dispatch' && inputs.report == 'sizing'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.100.0"
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: raft-idle
      - name: Measure
        env:
          RAFT_IDLE_GROUPS: ${{ inputs.groups }}
          RAFT_IDLE_PEERS: ${{ inputs.peers == 'stub' && '' || inputs.peers }}
          RAFT_IDLE_DEAD: ${{ inputs.dead }}
          RAFT_IDLE_HEARTBEAT_MS: ${{ inputs.heartbeat_ms }}
          RAFT_IDLE_BURST_SECS: ${{ inputs.burst_secs != '0' && inputs.burst_secs || '' }}
          RAFT_IDLE_WINDOW_SECS: "30"
        run: |
          set -o pipefail
          ulimit -n "$(ulimit -Hn)"
          cargo test --locked --release -p felix-replication --features raft --test raft_idle_cpu \
            -- --ignored --nocapture 2>&1 | tee raft-sizing.log
      - name: Summary
        if: always()
        run: |
          { echo "### Raft sizing run"; echo; echo '```'; grep -h '^sizing ' raft-sizing.log || echo "no result"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  # What a publisher waits for on a three-broker Raft shard, at each level,
  # with the leader lease on (the default) and off (FELIX_SHARD_RAFT_LEASE_MS=0,
  # every publish answered at its commit). Real broker processes on loopback
  # on one shared runner: read the ratio between cells, not the absolute
  # numbers. The cell that goes first flips each round so drift lands on both.
  publish-latency:
    name: Raft publish latency
    if: github.event_name == 'workflow_dispatch' && inputs.report == 'publish-latency'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.100.0"
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: raft-publish-latency
      - name: Build
        run: |
          cargo build --locked --release -p felix-broker-service --bin felix-broker --features raft
          cargo test --locked --release -p felix-cluster --test raft_shards --no-run
      - name: Measure
        env:
          FELIX_TEST_RAFT_SHARDS: "1"
          ROUNDS: ${{ inputs.rounds || '3' }}
        run: |
          set -o pipefail
          ulimit -n "$(ulimit -Hn)"
          for round in $(seq 1 "$ROUNDS"); do
            if [ $((round % 2)) -eq 1 ]; then leases="0 1500"; else leases="1500 0"; fi
            for level in Leader Quorum; do
              for lease in $leases; do
                RAFT_LATENCY_LEVEL="$level" RAFT_LATENCY_LEASE_MS="$lease" \
                  cargo test --locked --release -p felix-cluster --test raft_shards \
                  report_publish_latency -- --ignored --nocapture 2>&1 | tee -a raft-publish-latency.log
              done
            done
          done
      - name: Summary
        if: always()
        run: |
          {
            echo "### Raft publish latency (RF 3, one publisher, 256-byte records)"
            echo
            echo '```'
            grep -h 'raft publish latency:' raft-publish-latency.log || echo "no result"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  storm:
    name: Raft election storm
    if: github.event_name == 'workflow_dispatch' && inputs.report == 'storm'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.100.0"
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: raft-idle
      - name: Build
        run: cargo test --locked --release -p felix-replication --features raft --test raft_election_storm --no-run
      - name: Measure
        env:
          STORM_ROWS: ${{ inputs.storm_rows || 'all' }}
        run: |
          ulimit -n "$(ulimit -Hn)"
          run() {
            env RAFT_STORM_SETTLE_SECS=180 "$@" cargo test --locked --release -p felix-replication \
              --features raft --test raft_election_storm -- --ignored --nocapture 2>&1 \
              | grep -E 'groups,|no leader|panicked|election load' | tee -a storm.log || true
          }
          if [ "$STORM_ROWS" = slow ]; then
            run RAFT_STORM_GROUPS=2000 RAFT_STORM_FSYNC_MS=20
            run RAFT_STORM_GROUPS=200 RAFT_STORM_FSYNC_MS=10 RAFT_STORM_DISK_WIDTH=1
            exit 0
          fi
          if [ "$STORM_ROWS" = pr ]; then
            run RAFT_STORM_GROUPS=2000
          else
            for groups in 1 100 300 1000 2000 5000; do run RAFT_STORM_GROUPS=$groups; done
            for groups in 300 2000; do run RAFT_STORM_GROUPS=$groups; done
          fi
          run RAFT_STORM_GROUPS=2000 RAFT_STORM_QUIET_SECS=8
          run RAFT_STORM_GROUPS=2000 RAFT_STORM_MODE=form
          [ "$STORM_ROWS" = pr ] || run RAFT_STORM_GROUPS=1000 RAFT_STORM_IDLE=1
          run RAFT_STORM_GROUPS=2000 RAFT_STORM_FSYNC_MS=20
          run RAFT_STORM_GROUPS=2000 RAFT_STORM_FSYNC_MS=5 RAFT_STORM_DISK_WIDTH=16
          run RAFT_STORM_GROUPS=2000 RAFT_STORM_FSYNC_MS=5 RAFT_STORM_DISK_WIDTH=4
          run RAFT_STORM_GROUPS=200 RAFT_STORM_FSYNC_MS=10 RAFT_STORM_DISK_WIDTH=1
      - name: Summary
        if: always()
        run: |
          { echo "### Raft election storm"; echo; echo '```'; cat storm.log || echo "no result"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  told-at-once:
    name: Groups told at once
    if: github.event_name == 'workflow_dispatch' && inputs.report == 'storm'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.100.0"
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: raft-told-at-once
      - name: Build
        run: cargo test --locked -p felix-replication --features raft --lib --no-run
      - name: Alone, 40 runs
        run: |
          ulimit -n "$(ulimit -Hn)"
          for i in $(seq 1 40); do
            cargo test --locked -p felix-replication --features raft --lib \
              raft::tests::many_groups_told_at_once_all_elect -- --nocapture 2>&1 \
              | grep -E 'told at once|test result' | tee -a told.log || true
          done
      - name: In the raft suite, 6 runs at 4 threads
        if: always()
        run: |
          ulimit -n "$(ulimit -Hn)"
          for i in $(seq 1 6); do
            cargo test --locked -p felix-replication --features raft --lib raft:: -- --test-threads=4 --nocapture 2>&1 \
              | grep -E 'told at once|test result|FAILED|failed' | tee -a suite.log || true
          done
      - name: Summary
        if: always()
        run: |
          {
            echo "### many_groups_told_at_once_all_elect"; echo; echo '```'
            sort told.log | uniq -c | sort -rn | head -5 || true
            grep 'told at once' told.log suite.log || true
            grep -E 'FAILED|failed' suite.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
