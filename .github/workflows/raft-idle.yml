name: Raft idle groups

# Throwaway measurement branch: the same raft_idle_cpu run at two commits,
# alternating on one runner. Never merges.

on:
  workflow_dispatch:
    inputs:
      rounds:
        description: "Rounds per commit"
        required: false
        default: "5"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never
  OLD: 408a9120a
  NEW: f756093af

jobs:
  pair:
    name: Idle pair
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Worktrees
        run: |
          git worktree add "$RUNNER_TEMP/old" "$OLD"
          git worktree add "$RUNNER_TEMP/new" "$NEW"
          git -C "$RUNNER_TEMP/old" log -1 --oneline
          git -C "$RUNNER_TEMP/new" log -1 --oneline
          grep -n '^openraft = ' "$RUNNER_TEMP/old/Cargo.toml" "$RUNNER_TEMP/new/Cargo.toml"
          cmp "$RUNNER_TEMP/old/crates/server/felix-replication/tests/raft_idle_cpu.rs" \
              "$RUNNER_TEMP/new/crates/server/felix-replication/tests/raft_idle_cpu.rs" && echo "harness identical"
      - name: Runner
        run: |
          lscpu | grep -E 'Model name|^CPU\(s\)|Thread|Core|Socket'
          nproc
          uname -a
          free -m
          uptime
      - name: Build both
        run: |
          for side in old new; do
            (cd "$RUNNER_TEMP/$side" && rustup show active-toolchain && \
             cargo test --locked --release -p felix-replication --features raft --test raft_idle_cpu --no-run)
          done
      - name: Measure
        env:
          ROUNDS: ${{ inputs.rounds || '5' }}
        run: |
          ulimit -n "$(ulimit -Hn)"
          out="$GITHUB_WORKSPACE/pair.log"
          run() {
            side="$1"; peers="$2"
            echo "### round=$round side=$side peers=$peers load=$(cut -d' ' -f1-3 /proc/loadavg)" | tee -a "$out"
            (cd "$RUNNER_TEMP/$side" && RAFT_IDLE_GROUPS=2000 RAFT_IDLE_PEERS="$peers" \
              cargo test --locked --release -p felix-replication --features raft --test raft_idle_cpu \
              -- --ignored --nocapture 2>&1) | grep -E 'idle groups|test result|panicked' | tee -a "$out" || true
            echo "### after load=$(cut -d' ' -f1-3 /proc/loadavg)" | tee -a "$out"
          }
          for round in $(seq 1 "$ROUNDS"); do
            if [ $((round % 2)) -eq 1 ]; then order="old new"; else order="new old"; fi
            for side in $order; do run "$side" transport; done
          done
          for round in 1 2 3; do
            if [ $((round % 2)) -eq 1 ]; then order="old new"; else order="new old"; fi
            for side in $order; do run "$side" real; done
          done
          lscpu | grep 'Model name' | tee -a "$out"
          nproc | tee -a "$out"
      - name: Summary
        if: always()
        run: |
          { echo '```'; cat pair.log || echo "no result"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: idle-pair
          path: pair.log
