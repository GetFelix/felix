name: Raft idle groups

# Scratch branch: cache read-path before/after for PR #2482. Not for merge.

on:
  workflow_dispatch:
    inputs:
      groups:
        required: false
        default: "5000"
      transport_groups:
        required: false
        default: "1700"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  idle:
    name: Cache read path
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.99.1"
      - name: Build
        run: cargo test --locked --release -p felix-replication --features raft,felix-common/sim --lib --no-run
      - name: Measure
        run: |
          set -euo pipefail
          nproc; free -m
          for round in 1 2; do
            for keys in 1000000; do
              MEASURE_KEYS=$keys MEASURE_LABEL=diag cargo test --locked --release -q -p felix-replication \
                --features raft,felix-common/sim --lib raft::cache::measure::cache_back_to_back -- --ignored --nocapture --test-threads 1 2>&1 | grep -o 'cache_[a-z_]* label=.*'
            done
          done | tee measure.log
