name: Raft idle groups

# What idle per-shard Raft groups cost one broker in CPU and memory
# (crates/server/felix-replication/tests/raft_idle_cpu.rs). Two runs:
# 5,000 groups led by one runtime whose peers are stubs, the worst case for one
# broker, and three runtimes in one process joined by the real peer transport
# on loopback. A report, not a gate: nothing waits on it, and until idle groups
# sleep it shows the cost of ticking every group.

on:
  schedule:
    # Every night at 06:23 UTC, after the scale run.
    - cron: "23 6 * * *"
  workflow_dispatch:
    inputs:
      groups:
        description: "Groups in the stub-peer run"
        required: false
        default: "5000"
      transport_groups:
        description: "Groups in the transport run, each with a member on all three runtimes"
        required: false
        default: "1700"
      burst_groups:
        description: "Groups in the write-burst run"
        required: false
        default: "300"

permissions:
  contents: read

concurrency:
  group: raft-idle-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  idle:
    name: Raft idle groups
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.99.1"
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: raft-idle
      - name: Build
        run: cargo test --locked --release -p felix-replication --features raft --test raft_idle_cpu --no-run
      - name: Stub peers
        env:
          RAFT_IDLE_GROUPS: ${{ inputs.groups || '5000' }}
        run: |
          set -o pipefail
          ulimit -n "$(ulimit -Hn)"
          cargo test --locked --release -p felix-replication --features raft --test raft_idle_cpu \
            -- --ignored --nocapture 2>&1 | tee raft-idle-stub.log
      - name: Real peer transport
        if: always()
        env:
          RAFT_IDLE_GROUPS: ${{ inputs.transport_groups || '1700' }}
          RAFT_IDLE_PEERS: transport
        run: |
          set -o pipefail
          ulimit -n "$(ulimit -Hn)"
          cargo test --locked --release -p felix-replication --features raft --test raft_idle_cpu \
            -- --ignored --nocapture 2>&1 | tee raft-idle-transport.log
      # What members keep resident after they were busy (#2415). Fewer
      # groups: every log holds its newest records in memory after a burst.
      - name: Write burst
        if: always()
        env:
          RAFT_IDLE_GROUPS: ${{ inputs.burst_groups || '300' }}
          RAFT_IDLE_PEERS: transport
          RAFT_IDLE_WINDOW_SECS: "10"
          RAFT_IDLE_BURST_SECS: "120"
        run: |
          set -o pipefail
          ulimit -n "$(ulimit -Hn)"
          cargo test --locked --release -p felix-replication --features raft --test raft_idle_cpu \
            -- --ignored --nocapture 2>&1 | tee raft-idle-burst.log
      - name: Summary
        if: always()
        run: |
          {
            echo "### Raft idle groups"
            echo
            grep -hE 'idle groups|groups after|test result' raft-idle-stub.log raft-idle-transport.log raft-idle-burst.log || echo "no result"
          } >> "$GITHUB_STEP_SUMMARY"
