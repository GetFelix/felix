name: openraft-scale
on:
  push:
    branches: [scratch/openraft-scale]
jobs:
  scale:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/bin-target
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: build
        working-directory: scratch/openraft-scale
        run: cargo build --release
      - name: run
        working-directory: scratch/openraft-scale
        run: |
          ulimit -n 1048576 || true
          nproc; free -m
          for t in on off; do for n in 1000 5000 10000; do
            ${{ github.workspace }}/bin-target/release/openraft-scale $n $t 30 | tee -a ../../results.txt
          done; done
          { echo '```'; cat ../../results.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
