name: openraft-scale
on:
  push:
    branches: [scratch/openraft-scale]
jobs:
  scale:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        timers: [on, off]
        groups: [1000, 5000, 10000]
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/bin-target
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: build
        working-directory: scratch/openraft-scale
        run: cargo build --release
      - name: run
        working-directory: scratch/openraft-scale
        run: |
          free -m
          timeout 900 ${{ github.workspace }}/bin-target/release/openraft-scale ${{ matrix.groups }} ${{ matrix.timers }} 30 2>&1 | tail -5 | tee out.txt || echo "FAILED/timeout rc=$?" | tee -a out.txt
          { echo '```'; cat out.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
