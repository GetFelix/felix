name: History checker (nightly)

# The list-append history campaign (docs/history-checker.md), run for much
# longer than the per-PR test and with a new seed each night. A bug that needs
# an unlucky interleaving needs many interleavings to turn up, and the per-PR
# run has a fixed seed and under a minute.
#
# The seed and mode are printed before the run and in the job summary, so a red
# night can be replayed with FELIX_HISTORY_SEED and FELIX_HISTORY_MODE.
#
# The mode picks the replication path. `lease-free` (the default) finalizes the
# generation_start, majority_ack and lease_free_reads fleet features once the
# cluster is up; `lease` finalizes none.
#
# The nemesis picks the faults. `all` injects every single fault kind, one at a
# time, on three brokers; `adversarial` injects the compound ones (overlapping
# faults, a partition that forces a failover, moves cut short, restart loops,
# torn writes, drains that change replica sets) on four. The nightly run does
# both, as two jobs with their own seeds.

on:
  schedule:
    # Every night at 03:17 UTC.
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      seed:
        description: "Seed (a number, or empty for a random one)"
        required: false
        default: ""
      duration_secs:
        description: "How long the nemesis runs"
        required: false
        default: "1200"
      mode:
        description: "Replication path"
        required: false
        type: choice
        options:
          - lease-free
          - lease
        default: lease-free
      nemesis:
        description: "Which faults"
        required: false
        type: choice
        options:
          - both
          - all
          - adversarial
        default: both

permissions:
  contents: read

concurrency:
  # Keyed on the inputs too, so two dispatches on one branch (a lease and a
  # lease-free run, or a seed replay beside a fresh seed) do not cancel each other.
  group: history-${{ github.ref }}-${{ inputs.mode }}-${{ inputs.nemesis }}-${{ inputs.seed }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Brokers would otherwise reserve full segments up front, and three of them
  # restarting all night add up on a hosted runner's disk.
  FELIX_DURABLE_PREALLOCATE: "false"
  FELIX_TEST_TIMEOUT_SCALE: "3"

jobs:
  campaign:
    name: campaign (${{ matrix.nemesis }})
    # Only schedule and dispatch trigger this, so it always lands on the
    # self-hosted runners; the expression is the same as ci.yml's for one rule.
    runs-on: ${{ github.event_name != 'pull_request' && vars.FELIX_SELF_HOSTED_RUNNERS != 'false' && fromJSON('["self-hosted","felix-azure"]') || 'ubuntu-latest' }}
    # 20 minutes of faults, plus a build that may be cold and the start-up.
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        nemesis: ${{ fromJSON((inputs.nemesis || 'both') == 'both' && '["all","adversarial"]' || format('["{0}"]', inputs.nemesis)) }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: "1.97.1"

      - name: Rust cache
        if: runner.environment == 'github-hosted'
        uses: swatinem/rust-cache@v2

      - name: Warm target dir
        if: runner.environment == 'self-hosted'
        uses: ./.github/actions/warm-target
        with:
          slot: history

      - name: Build the broker the harness runs
        run: cargo build -p felix-broker-service --bin felix-broker

      - name: Choose a seed
        id: seed
        # Inputs reach the script through the environment, never pasted into it.
        env:
          SEED_INPUT: ${{ inputs.seed }}
          MODE_INPUT: ${{ inputs.mode }}
          NEMESIS: ${{ matrix.nemesis }}
        run: |
          seed="$SEED_INPUT"
          if [ -z "$seed" ]; then
            seed=$(od -An -N8 -tu8 /dev/urandom | tr -d ' ')
          fi
          mode="${MODE_INPUT:-lease-free}"
          case "$mode" in
            lease|lease-free) ;;
            *) echo "unknown mode: $mode"; exit 1 ;;
          esac
          echo "seed=$seed" >> "$GITHUB_OUTPUT"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "history campaign seed: $seed, mode: $mode, nemesis: $NEMESIS"
          echo "History campaign seed: \`$seed\`, mode: \`$mode\`, nemesis: \`$NEMESIS\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Run the campaign
        env:
          FELIX_HISTORY_SEED: ${{ steps.seed.outputs.seed }}
          FELIX_HISTORY_MODE: ${{ steps.seed.outputs.mode }}
          FELIX_HISTORY_NEMESIS: ${{ matrix.nemesis }}
          FELIX_HISTORY_DURATION_SECS: ${{ inputs.duration_secs || '1200' }}
        run: |
          set -o pipefail
          cargo test -p felix-cluster --test history -- --nocapture --include-ignored 2>&1 | tee ${{ runner.temp }}/history-output.txt

      - name: Report the seed
        if: failure()
        env:
          SEED: ${{ steps.seed.outputs.seed }}
          MODE: ${{ steps.seed.outputs.mode }}
          NEMESIS: ${{ matrix.nemesis }}
          DURATION: ${{ inputs.duration_secs || '1200' }}
        run: |
          {
            echo "## History campaign failed"
            echo
            echo "Seed: \`$SEED\`, mode: \`$MODE\`, nemesis: \`$NEMESIS\`. Replay with:"
            echo
            echo '```'
            echo "FELIX_HISTORY_SEED=$SEED FELIX_HISTORY_MODE=$MODE FELIX_HISTORY_NEMESIS=$NEMESIS FELIX_HISTORY_DURATION_SECS=$DURATION cargo test -p felix-cluster --test history -- --nocapture --include-ignored"
            echo '```'
            echo
            echo '```'
            sed -n '/violation(s)\|could not finish\|panicked/,/^test /p' ${{ runner.temp }}/history-output.txt | head -150
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "history campaign seed: $SEED, mode: $MODE, nemesis: $NEMESIS"

      - name: Upload the output
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: history-output-${{ matrix.nemesis }}
          path: ${{ runner.temp }}/history-output.txt
          retention-days: 30
