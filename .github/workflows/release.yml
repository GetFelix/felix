name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and publish
        required: true
        type: string
      npm_stage:
        description: >-
          Stage the npm packages for a maintainer to promote, instead of
          publishing them. Needs a stage-only NPM_TOKEN. Only works for
          packages that already exist -- a name's first publish is
          scripts/npm_first_publish.sh, run by hand.
        required: false
        default: false
        type: boolean
      dry_run:
        description: >-
          Build everything -- binaries, archives, images, crate packages --
          and publish nothing: no GitHub release, no image push, no registry
          upload. The rehearsal before a real tag.
        required: false
        default: false
        type: boolean
      ref:
        description: >-
          Branch, tag or commit to build instead of `tag`, so a dry run can
          rehearse a tag that does not exist yet. Dry runs only.
        required: false
        default: ""
        type: string

  # nightly.yml builds through this workflow rather than keeping a second
  # copy of every build job. `nightly` (a YYYYMMDD date) means: publish no
  # release and no registry package, and push images only under the nightly
  # tags, and only when this is not also a dry run.
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
      dry_run:
        type: boolean
        default: false
      ref:
        type: string
        default: ""
      nightly:
        type: string
        default: ""

permissions:
  contents: write

env:
  # What every job checks out. `ref` only ever applies to a dry run or a
  # nightly; the first job refuses it otherwise, so no release is published
  # from an untagged commit.
  SOURCE_REF: ${{ inputs.ref || inputs.tag || github.ref_name }}

jobs:
  linux-x86_64:
    name: Linux x86_64 binaries
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - name: A ref other than the tag is only for a dry run
        if: ${{ inputs.ref != '' && !inputs.dry_run && !inputs.nightly }}
        env:
          REF: ${{ inputs.ref }}
        run: |
          echo "::error::ref=${REF} without dry_run would publish ${RELEASE_TAG} from a commit that is not the tag."
          exit 1

      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ env.SOURCE_REF }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: "1.97.1"

      - name: Rust cache
        uses: swatinem/rust-cache@v2

      - name: Build release binaries
        run: |
          cargo build --release --locked \
            -p felix-broker-service --bin felix-broker \
            -p felix-controlplane-service --bin felix-controlplane

      - name: Package release archive
        run: |
          set -euxo pipefail

          archive_root="felix-${RELEASE_TAG}-linux-x86_64"
          mkdir -p "dist/${archive_root}"

          cp target/release/felix-broker "dist/${archive_root}/"
          cp target/release/felix-controlplane "dist/${archive_root}/"
          cp README.md LICENSE "dist/${archive_root}/"

          tar -C dist -czf "dist/${archive_root}.tar.gz" "${archive_root}"
          rm -rf "dist/${archive_root}"

          (
            cd dist
            sha256sum "${archive_root}.tar.gz" > SHA256SUMS
          )

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: felix-${{ env.RELEASE_TAG }}-linux-x86_64
          path: |
            dist/*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error

      # A tag and a version that disagree ship artifacts labelled with neither,
      # and nothing else notices: the archive is named from the tag, each crate
      # is built from its own manifest, and both succeed. The wheel, the npm
      # package and the Helm chart each carry a version of their own, so this
      # checks all of them rather than only the workspace. Before anything is
      # published, because after that the tag is permanent.
      - name: The tag matches every version in the tree
        if: ${{ !inputs.nightly }}
        run: python3 scripts/check_release_version.py "${RELEASE_TAG}"

      # The changelog entry, not auto-generated notes. A release spanning months
      # generates a list that is mostly dependency bumps: accurate about commits,
      # poor about what changed. Fails closed if the entry is missing.
      - name: Extract release notes from CHANGELOG.md
        if: ${{ !inputs.nightly }}
        run: |
          python3 scripts/changelog_section.py "${RELEASE_TAG}" > release-notes.md
          echo "--- release notes ---"
          cat release-notes.md

      - name: Publish GitHub prerelease
        if: ${{ !inputs.dry_run && !inputs.nightly }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Felix ${{ env.RELEASE_TAG }}
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
          body_path: release-notes.md
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS

  # --- felixctl ------------------------------------------------------------
  #
  # One binary per platform, then one job that packages them all. Packaging in
  # one place means the completions and man pages are generated once, by the
  # Linux x86_64 binary, rather than by a cross-compiled macOS binary that its
  # runner cannot execute.
  felixctl-binaries:
    name: felixctl (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04, not latest, for the older glibc: a CLI gets copied onto
          # older machines than a broker does.
          - { runner: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { runner: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu }
          - { runner: macos-latest, target: aarch64-apple-darwin }
          # Cross-compiled from Apple Silicon; see python-wheels for why not
          # macos-13.
          - { runner: macos-latest, target: x86_64-apple-darwin }
          - { runner: windows-latest, target: x86_64-pc-windows-msvc }

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ env.SOURCE_REF }}

      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: "1.97.1"
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          key: felixctl-${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked -p felixctl --bin felixctl --target ${{ matrix.target }}

      - name: Upload the binary
        uses: actions/upload-artifact@v7
        with:
          name: felixctl-bin-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/felixctl
            target/${{ matrix.target }}/release/felixctl.exe
          if-no-files-found: error

  # Needs linux-x86_64 so the release already exists with its notes and
  # prerelease flag; this only adds files to it.
  felixctl-release-assets:
    name: Package felixctl and attach it to the release
    needs: [felixctl-binaries, linux-x86_64]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ env.SOURCE_REF }}

      # One directory per artifact, because every binary has the same name.
      - uses: actions/download-artifact@v8
        with:
          pattern: felixctl-bin-*
          path: bin

      - name: Generate completions and man pages
        run: |
          set -euo pipefail
          # upload-artifact drops the executable bit.
          chmod +x bin/felixctl-bin-*/felixctl
          felixctl=bin/felixctl-bin-x86_64-unknown-linux-gnu/felixctl
          mkdir -p extras/completions extras/man
          "$felixctl" completions bash > extras/completions/felixctl.bash
          "$felixctl" completions zsh > extras/completions/_felixctl
          "$felixctl" completions fish > extras/completions/felixctl.fish
          "$felixctl" completions powershell > extras/completions/_felixctl.ps1
          "$felixctl" completions elvish > extras/completions/felixctl.elv
          "$felixctl" man --out-dir extras/man

      - name: Package
        run: |
          set -euo pipefail
          mkdir -p dist
          for dir in bin/felixctl-bin-*/; do
            target="$(basename "$dir")"
            target="${target#felixctl-bin-}"
            root="felixctl-${RELEASE_TAG}-${target}"
            mkdir -p "stage/${root}"
            cp "$dir"/felixctl* "stage/${root}/"
            cp crates/tools/felixctl/README.md crates/tools/felixctl/LICENSE "stage/${root}/"
            cp -r extras/completions extras/man "stage/${root}/"
            case "$target" in
              *windows*) archive="${root}.zip"
                         ( cd stage && zip -qr "../dist/${archive}" "${root}" ) ;;
              *)         archive="${root}.tar.gz"
                         tar -C stage -czf "dist/${archive}" "${root}" ;;
            esac
            ( cd dist && sha256sum "${archive}" > "${archive}.sha256" )
          done
          ls -la dist

      # Kept on the run as well, so a dry run has something to download.
      - uses: actions/upload-artifact@v7
        with:
          name: felixctl-${{ env.RELEASE_TAG }}-archives
          path: dist/*
          if-no-files-found: error

      - name: Attach to the GitHub release
        if: ${{ !inputs.dry_run && !inputs.nightly }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: dist/*
          append_body: false

  # ---------------------------------------------------------------------------
  # Python wheels
  #
  # Gated on conformance, deliberately. A wheel that publishes without passing
  # the client conformance suite is a wheel that might diverge from the Rust
  # client on resume, redirects, or retry classification — the divergences that
  # get debugged as broker bugs. The gate is what makes "the Python client
  # behaves like the Rust one" a checked claim rather than an intention.
  # ---------------------------------------------------------------------------
  # --- Container images ----------------------------------------------------
  #
  # Built on every tag so a release is proof the Dockerfiles still work, and
  # pushed when `vars.PUBLISH_IMAGES` says the registry should have them and
  # this is not a dry run. That
  # switch is on: 0.4.1 published `felix-broker` and `felix-controlplane`, and
  # they pull without credentials. The gate stays so a fork building this
  # workflow does not push to a registry it did not mean to.
  #
  # Registry: GHCR under the repository owner. It needs no credential beyond
  # the workflow's own token, the namespace follows the repository rather than
  # being claimed separately, and it is what the docs already referenced.
  #
  # Each platform builds on a runner of its own architecture and is pushed by
  # digest alone; `images-merge` then tags one manifest list over both and signs
  # it. Compiling the arm64 half under QEMU instead took up to 92 minutes.
  images:
    name: Container image ${{ matrix.image.name }} (${{ matrix.platform.arch }})
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 90
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      REGISTRY: ghcr.io
      PUSH: ${{ vars.PUBLISH_IMAGES == 'true' && !inputs.dry_run }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: felix-broker
            dockerfile: docker/broker.Dockerfile
          - name: felix-controlplane
            dockerfile: docker/controlplane.Dockerfile
          - name: felixctl
            dockerfile: docker/felixctl.Dockerfile
        platform:
          - name: linux/amd64
            arch: amd64
            runner: ubuntu-latest
          - name: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      # GHCR names must be lowercase and the owner is GetFelix.
      - name: Registry owner
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ env.SOURCE_REF }}

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: env.PUSH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Same tag rules as the merge job, so the version label baked into each
      # platform's image matches the tags the manifest list gets.
      - name: Labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.image.name }}
          tags: |
            type=semver,pattern={{version}},value=${{ env.RELEASE_TAG }},enable=${{ !inputs.nightly }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.RELEASE_TAG }},enable=${{ !inputs.nightly }}
            type=raw,value=latest,enable=${{ !inputs.nightly && !contains(env.RELEASE_TAG, '-') }}
            type=raw,value=nightly-${{ inputs.nightly }},enable=${{ inputs.nightly != '' }}
            type=raw,value=nightly,enable=${{ inputs.nightly != '' }}

      - name: Build${{ env.PUSH == 'true' && ' and push by digest' || ' (not pushed)' }}
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.image.dockerfile }}
          platforms: ${{ matrix.platform.name }}
          # Untagged: a tag here would point at one platform until the merge
          # job moved it, and a pull in that window gets the wrong image.
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.image.name }},push-by-digest=true,name-canonical=true,push=${{ env.PUSH == 'true' }}
          labels: ${{ steps.meta.outputs.labels }}
          # Provenance and SBOM travel with the image rather than beside it, so
          # a puller can ask what is in it without trusting a separate file.
          # The merge job carries them into the manifest list.
          provenance: mode=max
          sbom: true
          # Scoped by platform too, or the two runners evict each other's cache.
          cache-from: type=gha,scope=${{ matrix.image.name }}-${{ matrix.platform.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}-${{ matrix.platform.arch }}

      - name: Record the digest
        if: env.PUSH == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"

      - name: Upload the digest
        if: env.PUSH == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.image.name }}-${{ matrix.platform.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # A dry run pushed nothing, so there are no digests to merge.
  images-merge:
    name: Container image ${{ matrix.image }} (manifest list)
    needs: images
    if: ${{ vars.PUBLISH_IMAGES == 'true' && !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      REGISTRY: ghcr.io
    permissions:
      contents: read
      packages: write
      # Signing below is keyless: cosign gets a short-lived certificate from
      # this token's OIDC identity, so there is no private key to store or
      # rotate, and the signature names the workflow that produced the image.
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        image: [felix-broker, felix-controlplane, felixctl]
    steps:
      # GHCR names must be lowercase and the owner is GetFelix.
      - name: Registry owner
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Download the platform digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ matrix.image }}-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.image }}
          # `latest` only on a tag with no pre-release suffix, so a v0.4.0-preview
          # never becomes what `docker pull` gives someone by default.
          tags: |
            type=semver,pattern={{version}},value=${{ env.RELEASE_TAG }},enable=${{ !inputs.nightly }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.RELEASE_TAG }},enable=${{ !inputs.nightly }}
            type=raw,value=latest,enable=${{ !inputs.nightly && !contains(env.RELEASE_TAG, '-') }}
            type=raw,value=nightly-${{ inputs.nightly }},enable=${{ inputs.nightly != '' }}
            type=raw,value=nightly,enable=${{ inputs.nightly != '' }}

      - name: Create the manifest list
        id: merge
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.image }}
        working-directory: ${{ runner.temp }}/digests
        run: |
          count=$(ls | wc -l)
          if [ "$count" -ne 2 ]; then
            echo "::error::expected 2 platform digests for ${IMAGE}, found ${count}"
            exit 1
          fi
          # shellcheck disable=SC2046
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${IMAGE}@sha256:%s " *)
          tag=$(jq -r '.tags[0]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          digest=$(docker buildx imagetools inspect "$tag" --format '{{json .Manifest}}' | jq -r .digest)
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Sign the image
        env:
          DIGEST: ${{ steps.merge.outputs.digest }}
          IMAGE: ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.image }}
        run: |
          # Signed by digest, never by tag: a tag can be moved to point at
          # something else, and a signature over a tag would follow it.
          cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: What was published
        run: |
          echo "### Images" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo "digest: ${{ steps.merge.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  python-conformance:
    name: Python client conformance
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ env.SOURCE_REF }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: "1.97.1"

      - name: Rust cache
        uses: swatinem/rust-cache@v2

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # The suite drives real brokers over real QUIC; these are what it starts.
      - name: Build the broker and cluster harness
        run: |
          cargo build --locked -p felix-broker-service --bin felix-broker
          cargo build --locked -p felix-cluster --bin felix-cluster

      # `maturin develop` installs into an *active* virtualenv and refuses to
      # run without one; `actions/setup-python` provides an interpreter, not a
      # venv, so it could never have worked here. `pip install` builds the
      # binding through maturin as the PEP 517 backend and installs it into the
      # interpreter that is actually on PATH -- which is also what a user does.
      - name: Install the binding
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pip install ./crates/sdk/felix-python
          python -c "import felix; print('felix binding imported OK')"

      - name: Run the conformance suite
        env:
          FELIX_CONFORMANCE_RESULTS: ${{ github.workspace }}/python-conformance.json
        run: cd crates/sdk/felix-python && pytest -q

      # The verdict, not the test exit code: a suite that passed while skipping
      # a required scenario is not conformance, and this is what says so.
      - name: Verify against the catalogue
        run: cargo run --locked -q -p felix-conformance -- verify python-conformance.json

      - name: Upload the conformance report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: python-conformance-${{ env.RELEASE_TAG }}
          path: python-conformance.json
          if-no-files-found: warn

  python-wheels:
    name: Python wheels (${{ matrix.target }})
    needs: python-conformance
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest, target: x86_64-unknown-linux-gnu, maturin: x86_64 }
          - { runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, maturin: aarch64 }
          - { runner: macos-latest, target: aarch64-apple-darwin, maturin: aarch64 }
          # Cross-compiled from Apple Silicon rather than built on an Intel
          # runner. `macos-13` is the Intel image, which GitHub is retiring: a
          # job asking for it can sit queued with no agent forever, and because
          # the attach and publish jobs need *every* wheel target, one stuck
          # matrix leg holds back all five. That is what happened on the v0.4.1
          # tag. maturin-action installs the rust target, and the wheel is
          # abi3-py39 so nothing here is interpreter-specific.
          - { runner: macos-latest, target: x86_64-apple-darwin, maturin: x86_64 }
          - { runner: windows-latest, target: x86_64-pc-windows-msvc, maturin: x64 }

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ env.SOURCE_REF }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # abi3-py39, so one wheel per platform covers every Python from 3.9 up
      # rather than one per interpreter version.
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.maturin }}
          args: --release --out dist --manifest-path crates/sdk/felix-python/Cargo.toml
          manylinux: auto

      - name: Upload wheel
        uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error

  python-sdist:
    name: Python source distribution
    needs: python-conformance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ env.SOURCE_REF }}

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist --manifest-path crates/sdk/felix-python/Cargo.toml

      - uses: actions/upload-artifact@v7
        with:
          name: wheels-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  # Wheels ride the GitHub release; PyPI comes later.
  #
  # `pip install felix-client` is a public commitment: the name is claimed, the
  # version is permanent, and anyone can depend on it. Until Felix is ready for
  # that, the wheels are attached to the release so they can be installed from
  # a URL by anyone who wants them — and the PyPI step below stays behind an
  # explicit switch.
  #
  # To turn it on: set the repository variable PUBLISH_PYPI to "true", and
  # configure a PyPI trusted publisher for this repository and workflow (no
  # long-lived token, nothing to rotate or leak). Check the `felix-client` name
  # is actually available first — it is unrelated to the crate name.
  python-release-assets:
    name: Attach wheels to the release
    needs: [python-wheels, python-sdist]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist

      - name: What was built
        run: ls -la dist

      - name: Attach to the GitHub release
        if: ${{ !inputs.dry_run && !inputs.nightly }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: dist/*
          # The binaries job owns the release body; this only adds files to it.
          append_body: false

  # --- Node / TypeScript addon --------------------------------------------
  #
  # Same shape as the Python half above: conformance first, then one artifact
  # per platform, then an attach job that needs every leg.
  typescript-conformance:
    name: Node client conformance
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ env.SOURCE_REF }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: "1.97.1"

      - name: Rust cache
        uses: swatinem/rust-cache@v2

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      # The suite drives real brokers over real QUIC; these are what it starts.
      - name: Build the broker and cluster harness
        run: |
          cargo build --locked -p felix-broker-service --bin felix-broker
          cargo build --locked -p felix-cluster --bin felix-cluster

      # No napi CLI here: `napi build` is mostly a rename of this cdylib, and
      # the package loads it from the target directory either way. Keeping the
      # gate off the CLI keeps it off a registry too.
      - name: Build the addon
        working-directory: crates/sdk/felix-typescript
        run: cargo build --locked

      - name: Run the conformance suite
        env:
          FELIX_CONFORMANCE_RESULTS: ${{ github.workspace }}/ts-conformance.json
        run: cd crates/sdk/felix-typescript && node --test test/conformance.test.mjs

      # The verdict, not the test exit code: a suite that passed while skipping
      # a required scenario is not conformance, and this is what says so.
      - name: Verify against the catalogue
        run: cargo run --locked -q -p felix-conformance -- verify ts-conformance.json

      - name: Upload the conformance report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ts-conformance-${{ env.RELEASE_TAG }}
          path: ts-conformance.json
          if-no-files-found: warn

  # Gated on conformance for the same reason the wheels are: an addon that
  # ships without passing the suite is an addon that might diverge from the
  # Rust client on resume, redirects, or retry classification — the divergences
  # that get debugged as broker bugs.
  #
  # A napi addon is a native `cdylib`, so the matrix mirrors `python-wheels`
  # target for target, including cross-compiling the Intel macOS artifact from
  # Apple Silicon rather than asking for a `macos-13` runner that may never get
  # an agent (#545).
  typescript-addon:
    name: Node addon (${{ matrix.target }})
    needs: typescript-conformance
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { runner: macos-latest, target: aarch64-apple-darwin }
          - { runner: macos-latest, target: x86_64-apple-darwin }
          - { runner: windows-latest, target: x86_64-pc-windows-msvc }

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ env.SOURCE_REF }}

      # Pinned, like every other Rust job here. `@stable` installs the target
      # on *stable*, and then rust-toolchain.toml switches cargo to 1.97.1,
      # which does not have it -- invisible on four legs whose target is the
      # runner's own, and fatal on the one that cross-compiles.
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: "1.97.1"
          targets: ${{ matrix.target }}

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install the napi CLI
        run: npm install -g @napi-rs/cli@2

      # A Linux addon links against the glibc it is built with, and the
      # runners' is new enough that bookworm, RHEL 8 and Amazon Linux could
      # not load it. zig links against glibc 2.28's symbols instead.
      # napi's --zig runs `zig` itself, and the ziglang wheel does not put it
      # on PATH.
      - name: Install zig
        if: contains(matrix.target, 'linux-gnu')
        run: |
          pip install cargo-zigbuild ziglang
          python3 -c 'import ziglang, os; print(os.path.dirname(ziglang.__file__))' >> "$GITHUB_PATH"

      - name: Build the addon
        working-directory: crates/sdk/felix-typescript
        env:
          ZIG: ${{ contains(matrix.target, 'linux-gnu') && '--zig --zig-abi-suffix 2.28' || '' }}
          # Names the toolchain so rustup does not also install the rustfmt and
          # clippy that rust-toolchain.toml lists, which a build does not need
          # and which failed with "detected conflict: 'bin/cargo-fmt'".
          RUSTUP_TOOLCHAIN: "1.97.1"
        run: napi build --platform --release --target ${{ matrix.target }} $ZIG

      - name: The addon needs no glibc newer than 2.28
        if: contains(matrix.target, 'linux-gnu')
        working-directory: crates/sdk/felix-typescript
        run: |
          newest=$(objdump -T *.node | grep -o 'GLIBC_[0-9.]*' | sed 's/GLIBC_//' | sort -Vu | tail -1)
          echo "newest glibc symbol: $newest"
          if [ "$(printf '%s\n2.28\n' "$newest" | sort -V | tail -1)" != "2.28" ]; then
            echo "the addon needs glibc $newest, newer than 2.28" >&2
            exit 1
          fi

      # The addon is named by platform (felix.darwin-arm64.node and so on), so
      # every leg's artifact can merge into one directory without colliding.
      - name: Upload the addon
        uses: actions/upload-artifact@v7
        with:
          name: napi-${{ matrix.target }}
          path: crates/sdk/felix-typescript/*.node
          if-no-files-found: error

  typescript-release-assets:
    name: Attach the Node addons to the release
    needs: typescript-addon
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: napi-*
          merge-multiple: true
          path: addons

      - name: What was built
        run: ls -la addons

      - name: Attach to the GitHub release
        if: ${{ !inputs.dry_run && !inputs.nightly }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: addons/*
          # The binaries job owns the release body; this only adds files to it.
          append_body: false

  # Same reasoning as the PyPI job below: `npm install felix-client` is a
  # public commitment — the name is permanent and anyone can depend on it.
  # Until Felix is ready for that, the addons ride the GitHub release and this
  # stays behind an explicit switch.
  #
  # Unscoped, and matching the PyPI name deliberately: `@felix` was taken, and
  # one name across both registries is worth more than a namespace here. Six
  # names go up per release — `felix-client` and one per platform.
  #
  # Steady state is trusted publishing: npm exchanges this workflow's OIDC
  # identity for a short-lived credential, so there is no token to store,
  # rotate or leak. That is npm's own guidance over a token that bypasses 2FA,
  # and such tokens stop being able to publish in January 2027 anyway.
  #
  # **CI cannot create an npm package that does not exist yet.** A trusted
  # publisher is configured on an existing package. `npm stage publish` stages
  # a new version of an existing package and answers 404 for a name it has
  # never seen:
  #
  #   POST /-/stage/package/felix-client-darwin-arm64
  #   404 Package "felix-client-darwin-arm64" not found
  #
  # npm's docs require the package to exist before a trusted publisher can be
  # configured, and npm/cli#8544 tracks lifting that. Until it is, a new name
  # has to be published directly, which needs either a token that bypasses 2FA
  # -- restricted, and losing the ability to publish around January 2027 -- or
  # a person answering the 2FA prompt. So the first publish of any new package
  # name is `scripts/npm_first_publish.sh`, run by a maintainer, once.
  # It publishes the binaries from the GitHub release, so what reaches npm is
  # what CI built. Afterwards, configure trusted publishers on the packages now
  # that they exist, delete NPM_TOKEN, and this job handles every later version
  # with no credential at all.
  #
  # `npm_stage` remains for staging a version of a package that already exists.
  typescript-publish:
    name: Publish to npm
    needs: typescript-release-assets
    if: vars.PUBLISH_NPM == 'true' && !inputs.dry_run && !inputs.nightly
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: npm
    permissions:
      # Trusted publishing, like the PyPI job: npm trades this workflow's OIDC
      # identity for a short-lived credential. No token to store, rotate or
      # leak, and nothing that has to bypass 2FA to work.
      id-token: write
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ env.SOURCE_REF }}

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      # Trusted publishing needs npm 11.5.1 or later; Node 22 ships an older
      # one. Without this the publish falls back to looking for a token and
      # fails as if none was set.
      - name: An npm that speaks OIDC
        run: npm install -g npm@latest

      # Into `artifacts/`, which is where `napi artifacts` looks. Downloading
      # them beside the manifest instead leaves every platform package empty
      # and `prepublish` publishing nothing, which it reports as success.
      - uses: actions/download-artifact@v8
        with:
          pattern: napi-*
          merge-multiple: true
          path: crates/sdk/felix-typescript/artifacts

      - name: Install the napi CLI
        run: npm install -g @napi-rs/cli@2

      - name: Move each binary into its platform package
        working-directory: crates/sdk/felix-typescript
        run: napi artifacts

      - name: What is about to be published
        working-directory: crates/sdk/felix-typescript
        run: ls -la npm/*/

      # `npm publish` per package rather than `napi prepublish`. What that
      # command still did for us was sync the versions -- which are committed
      # and asserted by check_npm_packages.py -- and upload the binaries to the
      # GitHub release, which the release-assets job already did. What it did
      # besides was swallow "this package has no binary" and exit 0, which is
      # how a publish job went green having uploaded nothing.
      #
      # Platform packages first: the main package declares them as optional
      # dependencies, so publishing it first leaves a window where an install
      # resolves to nothing.
      - name: ${{ inputs.npm_stage && 'Stage, platform packages first' || 'Publish, platform packages first' }}
        working-directory: crates/sdk/felix-typescript
        env:
          # Only in staging mode, and only then: trusted publishing is the
          # normal path and a token present alongside it is a second way in
          # that nobody meant to leave open.
          NODE_AUTH_TOKEN: ${{ inputs.npm_stage && secrets.NPM_TOKEN || '' }}
          STAGE: ${{ inputs.npm_stage }}
        run: |
          set -euo pipefail
          # A stage-only token cannot publish directly; it uploads a version
          # that a maintainer with 2FA then promotes. Direct publish with a
          # bypass-2fa token is deprecated and removed in January 2027, so this
          # is the token path that still exists afterwards.
          if [ "$STAGE" = "true" ]; then publish=(stage publish); else publish=(publish); fi
          # npm refuses a prerelease without --tag, so that `latest` stays on
          # the last stable version. Tag it with its prerelease id instead
          # (0.6.0-preview -> preview, 0.7.0-rc.1 -> rc).
          version=$(node -p "require('./package.json').version")
          if [[ "$version" == *-* ]]; then
            pre=${version#*-}
            publish+=(--tag "${pre%%.*}")
          fi
          for dir in npm/*/; do
            echo "== ${dir}"
            ( cd "$dir" && npm "${publish[@]}" )
          done
          echo "== felix-client"
          npm "${publish[@]}"

      # Because the job reported success while publishing nothing at all, and
      # the only way to know a publish happened is to go and look. Staged
      # versions are deliberately not on the registry yet, so this asks the
      # question only when something was actually published.
      - name: The registry must actually have them
        if: ${{ !inputs.npm_stage }}
        working-directory: crates/sdk/felix-typescript
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          # The registry lags a publish by seconds to minutes, so a version
          # missing on the first look is not yet a failed publish.
          pending=(felix-client $(node -p "Object.keys(require('./package.json').optionalDependencies).join(' ')"))
          for try in $(seq 1 20); do
            still=()
            for pkg in "${pending[@]}"; do
              if npm view "${pkg}@${version}" version >/dev/null 2>&1; then
                echo "ok      ${pkg}@${version} (try ${try})"
              else
                still+=("$pkg")
              fi
            done
            pending=(${still[@]+"${still[@]}"})
            [ "${#pending[@]}" -eq 0 ] && exit 0
            [ "$try" -lt 20 ] && sleep 15
          done
          for pkg in "${pending[@]}"; do
            echo "MISSING ${pkg}@${version} after 20 tries"
          done
          exit 1

      - name: What a maintainer needs to promote
        if: ${{ inputs.npm_stage }}
        working-directory: crates/sdk/felix-typescript
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          echo "Staged, awaiting promotion by a maintainer with 2FA:"
          for pkg in $(node -p "Object.keys(require('./package.json').optionalDependencies).join(' ')") felix-client; do
            echo "  ${pkg}@${version}"
          done
          echo
          echo "Promote the platform packages before felix-client: it declares"
          echo "them as optional dependencies, so the other order leaves a"
          echo "window where an install resolves to nothing."

  python-publish:
    name: Publish to PyPI
    needs: python-release-assets
    # Off until Felix is meant to be publicly installable. See the note above.
    if: vars.PUBLISH_PYPI == 'true' && !inputs.dry_run && !inputs.nightly
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist

      - name: What is about to be published
        run: ls -la dist

      # A rerun must not fail on what a previous attempt already uploaded.
      # PyPI refuses a duplicate file outright, and this release is reruns all
      # the way down: the other two registries publish at different rates, so
      # the run that finishes them will always find PyPI already done.
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          skip-existing: true

  # --- crates.io -----------------------------------------------------------
  #
  # The Rust client is what the Python and Node bindings wrap, so this is the
  # publish the other two sit on top of. felixctl and felix-loadgen, which it
  # links, go up after it.
  #
  # Order is not cosmetic. crates.io resolves a dependency against the registry
  # at publish time, so a crate cannot go up before the crates it depends on.
  # The list below is a topological sort of the workspace's internal edges and
  # must stay one; `check_publish_metadata.py` reads it out of this file and
  # checks that, and that it names every publishable crate.
  #
  # Credentials: a CARGO_REGISTRY_TOKEN secret if one is set, otherwise
  # trusted publishing. Trusted publishing is the steady state -- no stored
  # credential -- but crates.io only lets it be configured on a crate that
  # exists, so a release that introduces a crate name needs a token once.
  # The checklist is in docs-site's development/building page.
  crates-publish:
    name: ${{ inputs.dry_run && 'Package crates (dry run, nothing published)' || 'Publish to crates.io' }}
    needs: [linux-x86_64, python-conformance, typescript-conformance]
    if: ${{ !inputs.nightly && (vars.PUBLISH_CRATES == 'true' || inputs.dry_run) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    env:
      CARGO_TERM_COLOR: always
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      HAS_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN != '' }}

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ env.SOURCE_REF }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: "1.97.1"

      - name: Rust cache
        uses: swatinem/rust-cache@v2

      # A crates.io version is permanent, so the tag and the manifests agreeing
      # is checked before anything is uploaded rather than after.
      - name: The tag and the manifests must agree
        run: python3 scripts/check_release_version.py "${RELEASE_TAG}"

      # Every crate packaged and built from its .crate before the first one is
      # uploaded. cargo resolves the set's internal dependencies against the
      # packages it just made, so this works before any of them are on the
      # registry, and a crate that cannot package fails the release while
      # nothing is permanent yet.
      - name: Package, in dependency order
        run: |
          set -euo pipefail
          crates=()
          for crate in felix-transport felix-wire felix-client felix-loadgen felixctl; do
            crates+=("$crate")
          done
          echo "CRATES=${crates[*]}" >> "$GITHUB_ENV"
          args=()
          for crate in "${crates[@]}"; do args+=(-p "$crate"); done
          cargo package --locked "${args[@]}"

      # cargo package leaves extracted sources under target/package, and
      # rust-cache's post step trips over their test fixture directories
      # (ENOENT annotations). They are not worth caching anyway.
      - name: Drop the packaged sources
        if: always()
        run: rm -rf target/package

      - name: Trusted publishing
        id: auth
        if: ${{ !inputs.dry_run && env.HAS_TOKEN != 'true' }}
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish
        if: ${{ !inputs.dry_run }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN || steps.auth.outputs.token }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          echo "credential: $([ "$HAS_TOKEN" = true ] && echo CARGO_REGISTRY_TOKEN || echo trusted publishing)"

          # Re-running a release must not fail on the crates that already
          # landed: a publish that dies halfway leaves the earlier tiers up,
          # and crates.io answers a repeat with an error rather than a no-op.
          for crate in $CRATES; do
            status=$(curl -sS -o /dev/null -w '%{http_code}' \
              -A "felix-release/${version}" \
              "https://crates.io/api/v1/crates/${crate}/${version}")
            if [ "$status" = "200" ]; then
              echo "== ${crate} ${version} is already on crates.io, skipping"
              continue
            fi
            # crates.io allows a short burst of *new* crate names and then one
            # per ten minutes. It is a queue, not an error, so this waits
            # rather than failing a release nobody can retry cheaply.
            published=false
            for attempt in 1 2 3 4 5; do
              echo "== publishing ${crate} ${version} (attempt ${attempt})"
              if cargo publish -p "$crate" --locked 2>&1 | tee /tmp/publish.log; then
                published=true
                break
              fi
              if ! grep -q "429 Too Many Requests" /tmp/publish.log; then
                echo "not a rate limit; giving up on ${crate}"
                exit 1
              fi
              # The server names the time it will accept the next one.
              until_ts=$(sed -n 's/.*try again after \(.*\) and see.*/\1/p' /tmp/publish.log | head -1)
              now=$(date -u +%s)
              wait=$(( $(date -u -d "$until_ts" +%s 2>/dev/null || echo $((now + 660))) - now + 15 ))
              [ "$wait" -lt 15 ] && wait=15
              [ "$wait" -gt 1800 ] && wait=1800
              echo "rate limited; waiting ${wait}s"
              sleep "$wait"
            done
            if [ "$published" != true ]; then
              echo "::error::${crate} ${version} was still rate limited after five attempts; rerun this job."
              exit 1
            fi
          done
