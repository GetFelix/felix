name: Perf scratch (S9 election driver)

# Temporary: RF 3 cluster A/B for the S9 election driver, election off.
# a = main, b = feat/1009-s9-election-driver with FELIX_INTERNAL_ELECTION=false, c = b with the variable unset (now on by default).
# The test harness comes from this branch; only the broker binary differs by side.
# Deleted with the branch.

on:
  push:
    branches: [scratch/perf-s9-open]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  A_SHA: 15004f5354ecec6b160a6f4b22237486df26d80a
  B_SHA: aa8c0e4baf3010a89b5e026906f3e5792e0dd2b0
  BENCH_STEADY_SECS: "20"
  BUILD_SIDES: "b"

jobs:
  build:
    runs-on: ${{ vars.FELIX_LARGE_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.99.1"
      - name: Rust cache
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build harness and both brokers
        run: |
          set -euo pipefail
          out=/tmp/perf-bin; mkdir -p $out
          h_sha=$(git rev-parse HEAD)
          cargo test --release -p felix-cluster --test replicated_bench --no-run --message-format=json \
            | jq -r 'select(.profile.test == true and .executable != null) | .executable' | tail -1 > /tmp/exe
          cp "$(cat /tmp/exe)" $out/replicated_bench
          for side in ${BUILD_SIDES:-a b}; do
            case $side in a) sha=$A_SHA;; b) sha=$B_SHA;; esac
            git checkout --detach -q "$sha"
            cargo build --release -p felix-broker-service --bin felix-broker
            cp target/release/felix-broker $out/felix-broker-$side
            git checkout -q -- .
          done
          git checkout --detach -q "$h_sha"
          sha256sum $out/*
      - uses: actions/upload-artifact@v7
        with:
          name: perf-bin
          path: /tmp/perf-bin/
          retention-days: 3

  run:
    needs: build
    runs-on: ${{ vars.FELIX_LARGE_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      ROUNDS: "3"
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: perf-bin
          path: /tmp/perf-bin
      - name: Machine
        run: nproc; free -g; uname -a; chmod +x /tmp/perf-bin/*
      - name: Cluster rounds, rotating sides
        run: |
          set -uo pipefail
          p=/tmp/perf; mkdir -p $p/out; cd $p
          mkdir -p $p/bin
          cp /tmp/perf-bin/replicated_bench $p/bin/replicated_bench
          cp /tmp/perf-bin/felix-broker-b $p/bin/felix-broker
          printf '#!/bin/bash\nshift\nexec /tmp/perf-bin/felix-broker-a "$@"\n' > $p/wrap-a.sh
          printf '#!/bin/bash\nshift\nexport FELIX_INTERNAL_ELECTION=false\nexec /tmp/perf-bin/felix-broker-b "$@"\n' > $p/wrap-b.sh
          printf '#!/bin/bash\nshift\nexec /tmp/perf-bin/felix-broker-b "$@"\n' > $p/wrap-c.sh
          chmod +x $p/wrap-*.sh
          for round in $(seq 1 "$ROUNDS"); do
            sides=(b c); k=$(( (round + ${{ matrix.shard }}) % 2 ))
            for i in 0 1; do
              side=${sides[$(( (i + k) % 2 ))]}
              r=${{ matrix.shard }}-$round
              echo "::group::round $r side $side"
              FELIX_BROKER_WRAPPER=$p/wrap-$side.sh BENCH_SIDE=$side BENCH_ROUND=$r \
                timeout 1500 $p/bin/replicated_bench --ignored --nocapture --test-threads=1 2>&1 \
                | tee $p/out/cluster-$r-$side.log || echo "::warning::round $r side $side failed"
              grep -h 'BENCH_JSON ' $p/out/cluster-$r-$side.log | sed 's/^.*BENCH_JSON //' >> $p/out/cluster.jsonl || true
              echo "::endgroup::"
            done
          done
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: perf-out-${{ matrix.shard }}
          path: /tmp/perf/out/
