name: Coverage

on:
  push:
    branches: [ main ]
  # No path filter here: the changes job skips coverage for docs or the badge
  # alone, so the run still reports `Coverage ok`.
  # ready_for_review: a draft PR skips the coverage run (see `changes`).
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  # A new push cancels that PR's older run. Each main commit keeps its own
  # group so back-to-back merges all finish and publish their badge.
  group: coverage-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ github.event.pull_request.draft != true && steps.code.outputs.code || 'false' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: .github/actions
      - id: code
        uses: ./.github/actions/code-changed
        with:
          ignore: '^docs/|^docs-site/|\.md$|(^|/)coverage\.svg$'
          # Tests read the client pages and tutorials and the felixctl reference; see ci.yml.
          keep: '^docs-site/src/content/docs/(clients/|tutorials/|reference/felixctl\.md$)'

  # Self-hosted for pushes to main, GitHub-hosted for PRs; see ci.yml's test
  # job.
  # Main publishes the badge and its line percentage; a pull request runs the
  # same job and fails if it drops coverage by more than the gate allows.
  # On a pull request this is also the workspace test run of record: ci.yml's
  # `test` job runs only what this skips (Taskfile.yml, test:residual).
  coverage:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ github.event_name != 'pull_request' && vars.FELIX_SELF_HOSTED_RUNNERS != 'false' && fromJSON('["self-hosted","felix-azure"]') || vars.FELIX_LARGE_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 150
    permissions:
      contents: write
    env:
      CARGO_TERM_COLOR: always
      FELIX_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:55432/postgres
    services:
      postgres:
        # The official image through Google's Docker Hub mirror. Docker Hub and AWS's
        # mirror both throttle anonymous pulls from shared runner addresses.
        image: mirror.gcr.io/library/postgres:16-alpine
        ports:
          - 55432:5432
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        run: rustup update stable

      - name: Install Task
        uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          # Pinned: a new tag can be published before its binaries are.
          version: 3.53.1
          # Authenticated, so this reads the repo's 1000/hr budget rather than
          # the 60/hr GitHub allows an unauthenticated IP. Runners share their
          # IP, so the anonymous budget is routinely spent by other jobs and the
          # install fails with "API rate limit exceeded" before any code runs.
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # The binding's Rust unit tests link libpython (scripts/ci/coverage-python.sh).
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@32e16a23c68a001a1621efca19f131f965d4d122 # cargo-llvm-cov
        env:
          # Same reason as above: this resolves a release through the API.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Warm target dir
        if: runner.environment == 'self-hosted'
        uses: ./.github/actions/warm-target
        with:
          slot: coverage

      # task coverage runs llvm-cov with --no-clean, so on a warm target dir the
      # last run's profiles would be merged into this one. This drops those and
      # the workspace's own artifacts, and keeps the dependencies.
      - name: Drop stale coverage profiles
        if: runner.environment == 'self-hosted'
        run: cargo llvm-cov clean --workspace

      - name: Wait for Postgres service
        run: |
          set -euxo pipefail
          for _ in $(seq 1 30); do
            if pg_isready -h 127.0.0.1 -p 55432 -U postgres; then
              exit 0
            fi
            sleep 2
          done
          echo "Postgres did not become ready in time" >&2
          exit 1

      # Larger than the test job's: coverage instrumentation slows everything
      # it measures, and this is the job where the failover suite's replication
      # waits were seen to expire with nothing wrong.
      - name: Generate code coverage (lcov)
        env:
          FELIX_TEST_TIMEOUT_SCALE: "5"
        run: |
          set -euxo pipefail
          task coverage 2>&1 | tee "$RUNNER_TEMP/coverage.log"

      # The tests run inside the coverage build, so a failure is a test
      # failure first. Name the failing tests in the annotations and summary.
      - name: Summarize failed tests
        if: failure()
        run: |
          # The log is coloured (CARGO_TERM_COLOR), which splits "FAILED".
          sed 's/\x1b\[[0-9;]*m//g' "$RUNNER_TEMP/coverage.log" |
            grep -E '^test .* \.\.\. FAILED$|^error: test failed|^error: [0-9]+ targets? failed|panicked at' > "$RUNNER_TEMP/failed.txt" || true
          # No test lines: the gate or the build failed, and its own step says why.
          [ -s "$RUNNER_TEMP/failed.txt" ] || exit 0
          grep -E '^test .* \.\.\. FAILED$' "$RUNNER_TEMP/failed.txt" | sed 's/^test //; s/ \.\.\. FAILED$//' | sort -u | while read -r name; do
            echo "::error title=Test failed::$name"
          done
          {
            echo "### Failed tests"
            echo '```'
            head -100 "$RUNNER_TEMP/failed.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Before the gate, and even when coverage failed, so a drop can be
      # inspected from the artifact.
      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lcov-info
          path: lcov.info
          if-no-files-found: warn

      # The C harness's cluster runs make line coverage vary by up to about 0.2
      # points between runs of the same tree, hence 0.3. No baseline yet passes.
      - name: Gate on main's line coverage
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          # The baseline is main's; another base would be compared to the wrong numbers.
          if [ "$BASE_REF" != main ]; then
            echo "::notice::base is $BASE_REF, not main; skipping the coverage gate"
            python3 scripts/ci/coverage_gate.py percent lcov.info
          elif git fetch --quiet --depth=1 origin badges &&
            git show FETCH_HEAD:coverage-lines.txt > "$RUNNER_TEMP/baseline.txt"; then
            # The per-file summary is newer than the badge; absent, the gate
            # just skips the breakdown.
            # A failed redirect leaves an empty file behind; remove it.
            if ! git show FETCH_HEAD:coverage-files.json > "$RUNNER_TEMP/baseline-files.json" 2>/dev/null; then
              rm -f "$RUNNER_TEMP/baseline-files.json"
            fi
            python3 scripts/ci/coverage_gate.py check lcov.info "$RUNNER_TEMP/baseline.txt" \
              --tolerance 0.3 --baseline-files "$RUNNER_TEMP/baseline-files.json"
          else
            echo "::notice::no coverage baseline on the badges branch yet; skipping the gate"
            python3 scripts/ci/coverage_gate.py percent lcov.info
          fi

      - name: Generate coverage badge (coverage.svg)
        uses: ImBIOS/lcov-coverage-badge@da3d9b94a6e70935409f4e021384216a80dd0762 # v1.0.1
        with:
          file: ./lcov.info

      - name: Prepare publish dir (hard fail if badge missing)
        run: |
          set -euxo pipefail
          mkdir -p publish

          echo "Workspace files:"
          ls -la

          echo "Searching for coverage.svg:"
          find . -maxdepth 6 -name 'coverage.svg' -print || true

          # Most common output location:
          if [ -f ./coverage.svg ]; then
            cp ./coverage.svg publish/coverage.svg
          else
            # Fall back to first match anywhere in repo
            SVG_PATH="$(find . -maxdepth 6 -name 'coverage.svg' -print -quit || true)"
            if [ -n "$SVG_PATH" ]; then
              cp "$SVG_PATH" publish/coverage.svg
            fi
          fi

          python3 scripts/ci/coverage_gate.py percent lcov.info > publish/coverage-lines.txt
          python3 scripts/ci/coverage_gate.py files lcov.info > publish/coverage-files.json

          echo "Publish dir contents:"
          ls -la publish

          # Fail loudly if we didn't produce a non-empty file
          test -s publish/coverage.svg

      - name: Publish badge to badges branch (orphan)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: badges
          publish_dir: ./publish
          force_orphan: true
          commit_message: "chore(ci): update coverage badge"
          enable_jekyll: false

  # The required check; see ci.yml's `CI ok`.
  coverage-ok:
    name: Coverage ok
    if: always()
    needs: [changes, coverage]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ toJSON(needs.*.result) }}
          DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          echo "$RESULTS"
          # A draft skips the heavy jobs, so a pass here would sit on the SHA
          # until the ready run replaces it. Fail instead; a draft cannot merge.
          if [ "$DRAFT" = true ]; then echo "draft: mark the PR ready to run the jobs"; exit 1; fi
          if grep -qE '"(failure|cancelled)"' <<< "$RESULTS"; then exit 1; fi
