name: CI

on:
  push:
    branches: ["main"]
    # Docs alone skip CI, but the TLA+ specs live under docs/formal and must be
    # model-checked when they change. The last matching pattern wins.
    paths:
      - "**"
      - "!docs/**"
      - "!**/*.md"
      - "docs/formal/**"
  pull_request:
    # Docs alone skip CI, but the TLA+ specs live under docs/formal and must be
    # model-checked when they change. The last matching pattern wins.
    paths:
      - "**"
      - "!docs/**"
      - "!**/*.md"
      - "docs/formal/**"
  # Model-check chosen TLA+ configurations on a branch, including the ones too
  # big for the per-PR budget. Only the formal job runs.
  workflow_dispatch:
    inputs:
      tla_configs:
        description: "Configurations to check, space-separated, split across the jobs; empty checks the registered set"
        required: false
        default: ""
      tla_timeout_minutes:
        description: "Per-job timeout, in minutes (at most 360)"
        default: "60"

concurrency:
  # A manual model-check run stands alone, so a second one does not cancel it.
  # Each main commit gets its own group: a group keeps one pending run and
  # cancels it when the next queues, whatever cancel-in-progress says, so
  # back-to-back merges lost their runs (#906).
  group: ci-${{ github.ref }}${{ github.ref == 'refs/heads/main' && format('-{0}', github.sha) || '' }}${{ github.event_name == 'workflow_dispatch' && format('-{0}', github.run_id) || '' }}
  # Every commit on main finishes its run. Cancelling them left merges with no
  # completed test run and kept the README badge on an old pass.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

# Every job has a timeout-minutes ceiling, set well above its normal run: a
# hung test or a wedged broker would otherwise hold the runner for GitHub's
# six-hour default before anyone hears about it.
jobs:
  # The Dockerfiles, built on every change that could break them.
  #
  # The release workflow builds these too, but only on a tag — which would mean
  # discovering a broken Dockerfile at the moment of a release. amd64 only here:
  # what a PR needs to know is whether the file still describes a working build,
  # and a second architecture would double the cost of finding out. The
  # multi-arch build stays on the tag.
  images:
    name: Container images build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Changing a comment in the broker should not rebuild two container images,
    # but changing anything either binary compiles from should.
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' && github.event.pull_request.draft == false)
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: felix-broker
            dockerfile: docker/broker.Dockerfile
            # The broker needs a control plane for auth — it fetches the keys
            # that verify client tokens — so it refuses to start without a URL
            # even standalone. It tolerates that URL being unreachable, warning
            # on each poll and carrying on, which is what makes this a usable
            # smoke test without standing a control plane up beside it.
            env: "-e FELIX_CONTROLPLANE_URL=http://127.0.0.1:19999"
          - image: felix-controlplane
            dockerfile: docker/controlplane.Dockerfile
            env: "-e FELIX_CONTROLPLANE_STORAGE_BACKEND=memory"
          - image: felixctl
            dockerfile: docker/felixctl.Dockerfile
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build ${{ matrix.image }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: false
          # Loaded into the local daemon so the smoke test below can run it.
          load: true
          tags: ${{ matrix.image }}:ci
          cache-from: type=gha,scope=ci-${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=ci-${{ matrix.image }}

      - name: It runs, serves /ready, and is not root
        if: matrix.image != 'felixctl'
        run: |
          set -euo pipefail
          # A build that succeeds and an image that runs are different claims,
          # and neither binary takes --help — both are env-driven — so the only
          # honest check is to start one and look.
          #
          # What each needs to come up is in the matrix above.
          docker run -d --name smoke ${{ matrix.env }} ${{ matrix.image }}:ci

          # Still up after a moment. This is what catches a missing shared
          # library, a bad entrypoint, or a binary that exits on startup —
          # each of which a successful build says nothing about.
          sleep 5
          running="$(docker inspect -f '{{.State.Running}}' smoke)"
          if [ "$running" != "true" ]; then
            echo "::error::${{ matrix.image }} exited instead of running"
            docker logs smoke
            exit 1
          fi

          # The metrics server is up, which is what the HEALTHCHECK and every
          # Kubernetes probe in the deployment docs depend on.
          docker exec smoke wget -qO- http://127.0.0.1:8080/ready > /dev/null

          # Non-root, at the uid the deployment docs tell operators to set.
          uid="$(docker exec smoke id -u)"
          test "$uid" = "65532" || {
            echo "::error::image runs as uid $uid, not 65532"
            exit 1
          }

          docker logs smoke
          docker rm -f smoke

      - name: It runs, and is not root
        if: matrix.image == 'felixctl'
        run: |
          set -euo pipefail
          docker run --rm felixctl:ci --version
          uid="$(docker run --rm --entrypoint id felixctl:ci -u)"
          test "$uid" = "65532" || {
            echo "::error::image runs as uid $uid, not 65532"
            exit 1
          }

  # Heavy, so pushes to main run it on the self-hosted Azure runners. Every PR
  # runs on GitHub-hosted: that keeps PRs out of the Azure queue, and fork code
  # never reaches a persistent machine. See docs-site development/building.md.
  test:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ${{ github.event_name != 'pull_request' && vars.FELIX_SELF_HOSTED_RUNNERS != 'false' && fromJSON('["self-hosted","felix-azure"]') || 'ubuntu-latest' }}
    timeout-minutes: 120
    env:
      CARGO_TERM_COLOR: always
      FELIX_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:55432/postgres
    services:
      postgres:
        image: postgres:16-alpine
        ports:
          - 55432:5432
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: "1.97.1"
          components: rustfmt, clippy

      - name: Rust Cache
        if: runner.environment == 'github-hosted'
        uses: swatinem/rust-cache@v2

      - name: Warm target dir
        if: runner.environment == 'self-hosted'
        uses: ./.github/actions/warm-target
        with:
          slot: ci-test

      - name: Install Task
        uses: arduino/setup-task@v3
        with:
          # Pinned: a new tag can be published before its binaries are.
          version: 3.53.1
          # Authenticated, so this reads the repo's 1000/hr budget rather than
          # the 60/hr GitHub allows an unauthenticated IP. Runners share their
          # IP, so the anonymous budget is routinely spent by other jobs and the
          # install fails with "API rate limit exceeded" before any code runs.
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint
        run: task lint

      # Setup waits in the cluster and chaos suites are wall-clock constants
      # chosen against a developer machine. A shared runner takes longer to
      # elect a leader or bring an instance up for reasons that say nothing
      # about the code, and the failure then reports as the semantic having
      # broken -- which has cost real investigation more than once. Scaled here
      # rather than raised in the source, so a developer's run still fails fast
      # on a genuine hang.
      - name: Test
        env:
          FELIX_TEST_TIMEOUT_SCALE: "3"
        run: task test

      # Failed 74 times in 640 under load, and never alone, before cache puts
      # staged on a task of their own.
      - name: Cancelled put under load
        run: task test:stress

      - name: cargo-deny
        run: task deny

      - name: Publish-readiness and licence split
        run: task publish:check

      - name: Workflow toolchains match the pin
        run: task ci:toolchains

      - name: Every workflow job has a timeout
        run: task ci:timeouts

      # A doc citing a test is broken by renaming the *test*, which is a Rust
      # change on a Rust pull request -- so it is checked here rather than only
      # in the docs-site build, which runs on pushes to main that touch
      # docs-site/ and would never see it.
      - name: Documentation evidence
        run: task docs:evidence

      # Without a tag this only asserts the version fields agree with each
      # other. That is the half a pull request can be wrong about: a bump that
      # misses the npm package or the chart looks fine until the release job
      # refuses the tag, by which point the branch is already cut.
      - name: Version fields agree
        run: python3 scripts/check_release_version.py

      # Demos under demos/ that declare their own [workspace] are excluded from the
      # repository workspace, so `task lint` and `task test` never reach them and
      # they can break silently. Build all three, and run the slow-consumer demo's
      # tests: its isolation assertion is a behavioural regression test for the
      # property Felix's one-line description rests on.
      - name: Standalone demo crates
        run: task demo:check

      # Each of those crates owns a Cargo.lock the repository workspace does not
      # touch, so a version bump or a new dependency never reaches it and the
      # step above silently rewrites it on every run. Both demo locks sat at
      # 0.4.0-preview through two releases, and had not heard of `io-uring`,
      # because nothing ever looked at what the build changed. This looks.
      - name: The demo lockfiles were already up to date
        run: |
          if ! git diff --quiet -- '**/Cargo.lock'; then
            echo "::error::a build updated a lockfile the commit did not include."
            echo "Run 'task demo:check' (and 'task lock:refresh') and commit the result."
            git diff --stat -- '**/Cargo.lock'
            exit 1
          fi

      - name: RSA dependency check (non-controlplane crates)
        run: task deny:rsa:default

  # The Helm chart, rendered every way its ci/ value sets describe and checked
  # against what it promises: budgets that keep a quorum, drains that fit their
  # grace period, an internal port on no Service, secrets referenced and never
  # rendered, and the value combinations it is meant to refuse. No cluster:
  # what a pull request needs to know is that the chart still says what the
  # docs say it does.
  chart:
    if: github.event_name != 'workflow_dispatch'
    name: Helm chart
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.16.3

      - name: PyYAML
        run: python3 -m pip install --user pyyaml

      - name: Lint, render, and check
        run: python3 scripts/check_chart.py

  # The Python binding, built and run against real brokers the way the release
  # does. It lives here and not only in release.yml because a job whose first
  # execution in its life was the v0.4.0 tag build is a job that fails at the
  # tag: `maturin develop` needs an active virtualenv, `actions/setup-python`
  # provides none, and nothing caught it until the wheels did not ship (#534).
  #
  # Unconditional, despite driving real QUIC and costing a broker build: the
  # lesson of #534 is that a job which does not run is a job that breaks
  # silently, and a filter on `crates/sdk/felix-python/**` would have missed it
  # anyway -- the binding wraps the Rust client, so a change anywhere under
  # `crates/sdk/felix-client` can break it just as surely.
  python:
    if: github.event_name != 'workflow_dispatch'
    name: Python client conformance
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: "1.97.1"

      - name: Rust cache
        uses: swatinem/rust-cache@v2

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # The suite starts these.
      - name: Build the broker and cluster harness
        run: |
          cargo build --locked -p felix-broker-service --bin felix-broker
          cargo build --locked -p felix-cluster --bin felix-cluster

      # Same installation the release job uses, so the two cannot drift.
      - name: Install the binding
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pip install ./crates/sdk/felix-python
          python -c "import felix; print('felix binding imported OK')"

      - name: Run the conformance suite
        env:
          FELIX_CONFORMANCE_RESULTS: ${{ github.workspace }}/python-conformance.json
        run: cd crates/sdk/felix-python && pytest -q

      # The verdict, not the exit code: a suite that passed while skipping a
      # required scenario is not conformance.
      - name: Verify against the catalogue
        run: cargo run --locked -q -p felix-conformance -- verify python-conformance.json

      # The C ABI the Go and C# SDKs will bind to, compiled with the system cc
      # against the checked-in header, linked both ways, and run against its
      # own fixture. Here because this job already builds the broker and the
      # harness. Whether the header matches the source is the felix-capi
      # `header` test, which `task test` runs.
      - name: C ABI against the fixture
        run: crates/sdk/felix-capi/tests/c/run.sh fixture

  # Same reasoning as the Python job above, and the same shape: the binding
  # wraps the Rust client, so a change anywhere under `crates/sdk/felix-client` can
  # break it. Unconditional for the same reason too -- a job behind a path
  # filter is a job that breaks silently.
  typescript:
    if: github.event_name != 'workflow_dispatch'
    name: Node client conformance
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: "1.97.1"

      - name: Rust cache
        uses: swatinem/rust-cache@v2

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      # The suite starts these.
      - name: Build the broker and cluster harness
        run: |
          cargo build --locked -p felix-broker-service --bin felix-broker
          cargo build --locked -p felix-cluster --bin felix-cluster

      # No napi CLI: `napi build` is mostly a rename of this cdylib, and the
      # package loads it from the target directory either way. Keeping the gate
      # off the CLI keeps it off a registry too.
      # Cheap, and the failure it catches is expensive: a platform package that
      # does not match what the release builds publishes fine and breaks at
      # `npm install` on someone else's machine, against a permanent version.
      # Called directly: this job has no `task` binary, and setting one up to
      # run one Python script would be the more surprising choice.
      - name: Platform packages match the release matrix
        run: python3 scripts/check_npm_packages.py

      - name: Build the addon
        working-directory: crates/sdk/felix-typescript
        run: cargo build --locked

      - name: Error mapping
        run: cd crates/sdk/felix-typescript && node --test test/errors.test.mjs

      - name: Run the conformance suite
        env:
          FELIX_CONFORMANCE_RESULTS: ${{ github.workspace }}/ts-conformance.json
        run: cd crates/sdk/felix-typescript && node --test test/conformance.test.mjs

      # The verdict, not the exit code: a suite that passed while skipping a
      # required scenario is not conformance.
      - name: Verify against the catalogue
        run: cargo run --locked -q -p felix-conformance -- verify ts-conformance.json

  # The formal model of one shard's lease, replication and promotion, checked
  # with TLC. Bounded, so it finishes in minutes; each configuration says
  # whether it must pass or which invariant it must violate, so the trace
  # that shows a check is load-bearing stays a trace.
  formal:
    name: TLA+ model (${{ matrix.shard }}/7)
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(inputs.tla_timeout_minutes || '60') }}
    # Seven shards, filled by each configuration's measured time
    # (scripts/check_tla.sh), keep every job near forty minutes, well under
    # the hour.
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The pairing check diffs against the PR's base.
          fetch-depth: 0

      # Model-checking proves the spec is self-consistent, not that it still
      # describes the code. A change to the code it models has to touch the
      # spec or say why not (#598).
      - name: Modelled code and the spec change together
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python3 scripts/check_spec_pairing.py --base "${{ github.event.pull_request.base.sha }}"

      - name: Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Model-check
        env:
          TLA_SHARD: ${{ matrix.shard }}/7
          TLA_CONFIGS: ${{ inputs.tla_configs }}
        # Word splitting is wanted: the input is a list of names.
        run: scripts/check_tla.sh $TLA_CONFIGS

  # The decoders that parse input from outside the process, on a time budget.
  #
  # Separate from `test` because it needs nightly (libFuzzer links a runtime the
  # stable toolchain does not ship) and because it is time-boxed rather than
  # pass/fail on a fixed set — a job that sometimes takes longer does not belong
  # in front of the suite everything else waits on.
  #
  # A budget rather than exhaustion: this is a regression gate, not a campaign.
  # The deep runs are fuzz-nightly.yml's; what a pull request needs to know is that the committed seeds and everything a minute of
  # mutation reaches still decode or refuse cleanly.
  fuzz:
    if: github.event_name != 'workflow_dispatch'
    name: Fuzz the decoders
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
      # Twelve targets; keep the whole job inside a few minutes.
      FUZZ_SECONDS: "30"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # toolchain-exempt: cargo-fuzz needs nightly, so this job is the one
      # place that deliberately does not use the pinned toolchain.
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: nightly

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          # The fuzz crates are outside the workspace and build with their own
          # flags, so they would otherwise miss the cache the other jobs share.
          workspaces: |
            .
            crates/protocol/felix-wire/fuzz
            crates/server/felix-storage/fuzz
            crates/server/felix-kafka/fuzz

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: Install Task
        uses: arduino/setup-task@v3
        with:
          # Pinned: a new tag can be published before its binaries are.
          version: 3.53.1
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fuzz
        run: task fuzz

      # A crash leaves the input that caused it, which is the only thing needed
      # to reproduce it. Without this the run says a target died and the bytes
      # that killed it are gone with the runner.
      - name: Upload crash inputs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-artifacts
          path: |
            crates/protocol/felix-wire/fuzz/artifacts/
            crates/server/felix-storage/fuzz/artifacts/
            crates/server/felix-kafka/fuzz/artifacts/
          if-no-files-found: ignore
