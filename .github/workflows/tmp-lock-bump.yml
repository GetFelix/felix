name: tmp lock bump
on: pull_request
permissions:
  contents: write
jobs:
  bump:
    if: github.head_ref == 'deps/dompurify-3.4.17'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: |
          cd docs-site
          npm update dompurify --package-lock-only --ignore-scripts
          grep -A3 '"node_modules/dompurify"' package-lock.json
          git config user.name "Gabriel Loewen"
          git config user.email gabrielloewen@outlook.com
          git rm -q ../.github/workflows/tmp-lock-bump.yml
          git commit -am "docs-site: bump dompurify to 3.4.17 (GHSA alerts 48-50)"
          git push
