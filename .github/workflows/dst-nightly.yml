name: Simulation sweep (nightly)

# Runs 2000 simulator seeds (crates/testing/felix-sim, docs/simulation.md) a
# night. Pull requests run four seeds as part of the workspace tests; that
# catches a regression that shows on most seeds, not one that needs a rare
# fault schedule. A seed takes minutes of real time, so the sweep is split into
# shards that each run a range of seeds, two at a time.
#
# A failing seed is listed in the job summary with how often it failed on
# replay and the command that replays it, and its log is uploaded. A failed
# scheduled run opens an issue labelled `dst-nightly`, or comments on the open
# one; a green one closes it. The seeds are the same every night (1 to 2000),
# so a red night replays as is.

on:
  schedule:
    # Every night at 05:13 UTC, after the power-loss sweep.
    - cron: "13 5 * * *"
  workflow_dispatch:
    inputs:
      first:
        description: "First seed"
        required: false
        default: "1"
      seeds:
        description: "How many seeds"
        required: false
        default: "2000"
      shards:
        description: "How many jobs to split them across"
        required: false
        default: "50"

permissions:
  contents: read

# A dispatched sweep gets a group of its own, so it never cancels the night's.
concurrency:
  group: dst-nightly-${{ github.ref }}-${{ github.event_name == 'schedule' && 'schedule' || github.run_id }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Plan the shards
        id: plan
        # Inputs reach the script through the environment, never pasted into it.
        env:
          FIRST: ${{ inputs.first || '1' }}
          SEEDS: ${{ inputs.seeds || '2000' }}
          SHARDS: ${{ inputs.shards || '50' }}
        run: |
          for value in "$FIRST" "$SEEDS" "$SHARDS"; do
            if ! [[ "$value" =~ ^[1-9][0-9]{0,6}$ ]]; then
              echo "not a positive number: $value"; exit 1
            fi
          done
          if [ "$SHARDS" -gt 256 ] || [ "$SHARDS" -gt "$SEEDS" ]; then
            echo "shards must be at most 256 and at most the seed count"; exit 1
          fi
          # Seeds split as evenly as they go; the first shards take one more.
          shards=$(jq -cn --argjson first "$FIRST" --argjson seeds "$SEEDS" --argjson n "$SHARDS" '
            [range($n) as $i
              | ($seeds / $n | floor) as $base
              | ($seeds % $n) as $extra
              | { index: $i,
                  first: ($first + $i * $base + ([$i, $extra] | min)),
                  count: ($base + (if $i < $extra then 1 else 0 end)) }]')
          echo "shards=$shards" >> "$GITHUB_OUTPUT"
          echo "Seeds \`$FIRST\` to \`$((FIRST + SEEDS - 1))\` across $SHARDS jobs" >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.99.1"

      - name: Rust cache
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      # Built once and handed to every shard, so fifty jobs do not each
      # compile the workspace.
      - name: Build the seeds test
        run: |
          bin=$(cargo test -p felix-sim --test seeds --no-run --message-format=json |
            jq -r 'select(.profile.test == true and .target.name == "seeds") | .executable' |
            tail -1)
          mkdir -p sim-bin
          cp "$bin" sim-bin/seeds

      - uses: actions/upload-artifact@v7
        with:
          name: sim-seeds-bin
          path: sim-bin/seeds
          retention-days: 2

  sweep:
    needs: build
    runs-on: ubuntu-latest
    # About 40 seeds two at a time, at three to five minutes a seed, plus
    # replays of the ones that fail.
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.build.outputs.shards) }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: sim-seeds-bin
          path: sim-bin

      - name: Run the seeds
        env:
          FELIX_SIM_BIN: ${{ github.workspace }}/sim-bin/seeds
          FELIX_SIM_JOBS: "2"
          FIRST: ${{ matrix.shard.first }}
          COUNT: ${{ matrix.shard.count }}
        run: |
          chmod +x "$FELIX_SIM_BIN"
          scripts/sim-sweep.sh "$FIRST" "$COUNT" sweep-out

      - name: Report the failing seeds
        if: failure()
        env:
          FIRST: ${{ matrix.shard.first }}
          COUNT: ${{ matrix.shard.count }}
        run: |
          {
            echo "## Seeds $FIRST to $((FIRST + COUNT - 1)): failures"
            echo
            if [ -f sweep-out/failed.txt ]; then
              echo "Each line says how many of its runs failed and how to replay it."
              echo "Logs are in the \`sim-sweep-$FIRST\` artifact."
              echo
              echo '```'
              cat sweep-out/failed.txt
              echo '```'
            else
              echo "The job failed before the sweep wrote its results; see the job log."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the failing seeds' logs
        if: failure() && hashFiles('sweep-out/failed.txt') != ''
        uses: actions/upload-artifact@v7
        with:
          name: sim-sweep-${{ matrix.shard.first }}
          path: sweep-out
          retention-days: 30

  report:
    needs: [build, sweep]
    if: ${{ always() && github.event_name == 'schedule' && needs.sweep.result != 'cancelled' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      actions: read
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: sim-sweep-*
          path: sweeps
        continue-on-error: true

      - name: Open, update or close the issue
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ needs.sweep.result }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          gh label create dst-nightly --repo "$REPO" --color d93f0b \
            --description "The nightly simulator sweep failed" 2>/dev/null || true
          open=$(gh issue list --repo "$REPO" --label dst-nightly --state open --json number --jq '.[0].number // empty')
          if [ "$RESULT" = success ]; then
            if [ -n "$open" ]; then
              gh issue comment "$open" --repo "$REPO" --body "Green again at $SHA: $RUN_URL"
              gh issue close "$open" --repo "$REPO"
            fi
            exit 0
          fi
          failed=$(cat sweeps/*/failed.txt 2>/dev/null | sort -t' ' -k2,2n | head -100 || true)
          [ -n "$failed" ] || failed="(no seed results; a job failed before its sweep finished)"
          body=$(printf 'Run: %s\nCommit: %s\n\n```\n%s\n```\n\nThe logs of each failing seed are in the run artifacts named sim-sweep-<first seed>. docs/simulation.md ("The nightly sweep") says how to replay one. This issue closes itself when a nightly run passes.\n' \
            "$RUN_URL" "$SHA" "$failed")
          if [ -n "$open" ]; then
            gh issue comment "$open" --repo "$REPO" --body "$body"
          else
            gh issue create --repo "$REPO" --label dst-nightly \
              --title "Nightly simulator sweep fails" --body "$body"
          fi
