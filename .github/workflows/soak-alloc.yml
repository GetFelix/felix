name: Soak allocator variants (scratch)
on:
  push:
    branches: ["scratch/soak-alloc-2152"]
permissions:
  contents: read
env:
  FELIX_DISABLE_TIMINGS: "1"
  FELIX_CORE_SHARDS: "2"
  CARGO_PROFILE_RELEASE_DEBUG: "line-tables-only"
  CARGO_PROFILE_RELEASE_STRIP: "none"
jobs:
  prof:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.99.1"
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build
        run: cargo build --release -p felix-broker-service --bin soak --features soak-jemalloc-prof
      - name: Run
        run: |
          set -uo pipefail
          sudo apt-get install -y libjemalloc-dev binutils >/dev/null 2>&1 || true
          ulimit -n 65536
          mkdir -p prof
          export SOAK_PROF_DIR=$PWD/prof
          export _RJEM_MALLOC_CONF=prof:true,prof_active:true,lg_prof_sample:16,prof_prefix:$PWD/prof/auto
          ./target/release/soak --duration-secs 60 --quiesce-secs 30 --churn-cycles 500 \
            --load-cycles 13 --restart-cycles 0 2>&1 | tee out.txt || true
          ls -la prof
          JP=$(command -v jeprof || command -v jeprof.sh || true)
          echo "jeprof=$JP"
          {
            echo "## growth between cycle 2 and cycle 11 (inuse_space)"
            $JP --text --inuse_space --lines --base=prof/heap.2.prof ./target/release/soak prof/heap.11.prof 2>&1 | head -45
            echo "## by function"
            $JP --text --inuse_space --base=prof/heap.2.prof ./target/release/soak prof/heap.11.prof 2>&1 | head -30
          } | tee -a "$GITHUB_STEP_SUMMARY"
          grep -E "cycle " out.txt | tee -a "$GITHUB_STEP_SUMMARY"
