name: CLA Assistant

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  CLAAssistant:
    runs-on: ubuntu-latest
    steps:
      - name: "CLA Assistant"
        if: |
          (github.event.comment.body == 'recheck' ||
           github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') ||
          github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Only needed if signatures are stored in a different repo than the one
          # being signed for. We store them in this repo, so GITHUB_TOKEN (with the
          # `contents: write` permission above) should suffice. If the bot fails to
          # commit the updated signatures file, add a PERSONAL_ACCESS_TOKEN secret
          # (a classic PAT with `repo` scope) and reference it here instead.
          # PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        with:
          path-to-signatures: ".github/cla-signatures/cla.json"
          path-to-document: "https://github.com/gabloe/felix/blob/main/CLA.md"
          # NOT `main`: the bot commits the updated signatures file directly
          # (no PR), which GitHub's own branch-protection rules on `main`
          # correctly reject ("Repository rule violations found... Changes
          # must be made through a pull request"). Store signatures on a
          # dedicated, unprotected branch instead -- same pattern already
          # used for `badges` (coverage) and `benchmark-data` (perf
          # history). This branch doesn't need to exist ahead of time; the
          # action creates it on first signature.
          branch: "cla-signatures"
          # Automated/mechanical bots that don't need a CLA signature (version bumps,
          # coverage badge commits). The GitHub Copilot coding agent is deliberately
          # NOT allowlisted here: PRs it opens should be signed off by the human
          # maintainer directing/merging them, since the agent itself can't hold or
          # assign copyright. Revisit if that turns out to be too strict in practice.
          allowlist: dependabot[bot],GCOV Github Badge,Claude
