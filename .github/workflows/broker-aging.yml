name: Broker aging

# Diagnostic for #3203: does a native broker slow down or grow in memory over
# a long run of one-record publishes? Runs crates/testing/felix-cluster/tests/broker_aging.rs
# and uploads the per-minute series and /metrics scrapes.

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: "Minutes of load per job"
        default: "240"
  push:
    branches: [diag/broker-aging-3203]

concurrency:
  group: broker-aging-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Four-hour soak: is the creep after the tail cache fills live heap or
  # allocator retention, per record, per connection or per second? Runs once
  # on the system allocator (RSS and anonymous memory) and once with
  # jemalloc preloaded, which prints allocated/active/resident totals.
  soak:
    name: Soak ${{ matrix.arch }} ${{ matrix.allocator }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
        allocator: [glibc, jemalloc]
        include:
          - runner: ubuntu-latest
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Four hours of records need room.
      - name: Free disk
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL || true
          df -h "$RUNNER_TEMP"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.100.0"

      - name: Rust cache
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-on-failure: true

      - name: Install jemalloc
        if: matrix.allocator == 'jemalloc'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libjemalloc2
          ls /usr/lib/*-linux-gnu/libjemalloc.so.2

      - name: Build
        run: |
          cargo build --locked --release -p felix-broker-service --bin felix-broker
          cargo build --locked --release -p felix-loadgen
          cargo test --locked --release -p felix-cluster --test broker_aging --no-run

      - name: Run
        run: |
          mkdir -p "$RUNNER_TEMP/aging"
          export FELIX_AGING_DIR="$RUNNER_TEMP/aging"
          export FELIX_AGING_MINUTES="${{ inputs.minutes || '240' }}"
          if [ "${{ matrix.allocator }}" = "jemalloc" ]; then
            # The test hands these to the broker only. Stats every 1 GiB
            # allocated, totals and merged arenas only.
            export FELIX_SOAK_BROKER_LD_PRELOAD="$(ls /usr/lib/*-linux-gnu/libjemalloc.so.2)"
            export FELIX_SOAK_BROKER_MALLOC_CONF="stats_interval:1073741824,stats_interval_opts:gdablxe"
          fi
          cargo test --locked --release -p felix-cluster --test broker_aging \
            broker_soak_one_record_publishes -- --ignored --nocapture 2>&1 \
            | tee "$RUNNER_TEMP/aging/log.txt" | grep --line-buffered '^SOAK\|panicked\|error'

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: soak-${{ matrix.arch }}-${{ matrix.allocator }}
          path: ${{ runner.temp }}/aging
          if-no-files-found: warn
