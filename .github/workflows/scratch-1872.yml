name: scratch 1872 revert check
on:
  push:
    branches: ["scratch/1872-revert-2"]
jobs:
  revert:
    runs-on: ${{ vars.FELIX_LARGE_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.99.1"
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Test
        env:
          FELIX_TEST_TIMEOUT_SCALE: "3"
        shell: bash
        run: |
          cargo build -p felix-broker-service --bin felix-broker
          for t in a_rolling_restart_after_joint_fence_is_finalized_serves_every_shard a_shard_learned_only_from_a_snapshot_serves; do
            cargo test -p felix-cluster --test failures "joint_fence::$t" -- --exact 2>&1 | tail -30 && echo "RESULT $t: passed" || echo "RESULT $t: FAILED"
          done
