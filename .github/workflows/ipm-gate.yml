name: Instructions per message

# Counts the CPU instructions the broker retires per acknowledged message and
# fails when that is more than the tolerance above scripts/perf/ipm-baseline.toml.
# Instruction counts barely move with runner noise, unlike throughput, so a
# per-message cost of a few percent shows up on the PR that adds it. See CONTRIBUTING.md.
#
# Not part of `CI ok`: whether it blocks merges is a repository setting.
# A pull request runs it only when it touches the broker's hot-path code.
# Otherwise it runs on workflow_dispatch only; there is no main or schedule run.

on:
  pull_request:
    paths:
      - "crates/server/**"
      - "crates/protocol/**"
      - "crates/sdk/felix-client/**"
      - "crates/testing/felix-cluster/**"
      - "crates/testing/felix-loadgen/**"
      - "services/felix-broker-service/**"
      - "scripts/perf/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/config.toml"
      - "rust-toolchain.toml"
      - ".github/workflows/ipm-gate.yml"
  workflow_dispatch:
    inputs:
      restart_probe:
        description: "Diagnostic: after each cell, restart the broker on its data and time one more rep"
        type: boolean
        default: false
      native:
        description: "Diagnostic: measure the uninstrumented broker at light load instead"
        type: boolean
        default: false
      cells:
        description: "Diagnostic: comma-separated cells to measure (empty = all)"
        type: string
        default: ""
      reps:
        description: "Diagnostic: reps per cell"
        type: string
        default: "6"

concurrency:
  group: ipm-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Diagnostic: line tables give callgrind_annotate inlined call sites.
  CARGO_PROFILE_RELEASE_DEBUG: line-tables-only

jobs:
  ipm:
    name: Broker instructions per message (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.100.0"

      - name: Rust cache
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-on-failure: true

      # Hosted runners expose no hardware performance counters (perf stat
      # reports instructions as unsupported), so the broker runs under callgrind.
      - name: Install valgrind
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq valgrind
          valgrind --version

      # Release profile, as shipped: LTO and one codegen unit change the count.
      - name: Build
        run: |
          cargo build --locked --release -p felix-broker-service --bin felix-broker
          cargo build --locked --release -p felix-loadgen
          cargo test --locked --release -p felix-cluster --test instructions_per_message --no-run

      - name: Measure natively
        if: inputs.native
        run: |
          sudo apt-get install -y -qq linux-tools-common "linux-tools-$(uname -r)" || sudo apt-get install -y -qq linux-tools-azure || true
          sudo sysctl -w kernel.perf_event_paranoid=-1 || true
          perf stat -e instructions,task-clock -- true || true
          FELIX_IPM_OUT="$RUNNER_TEMP/ipm-result.json" \
            cargo test --locked --release -p felix-cluster --test instructions_per_message \
            broker_light_load_cpu -- --ignored --nocapture --exact
          cp "$RUNNER_TEMP/ipm-result.json" ipm-result.json

      - name: Measure
        if: ${{ !inputs.native }}
        run: |
          mkdir -p "$RUNNER_TEMP/cg"
          # Callgrind runs the broker tens of times slower than native, and the
          # harness's start-up waits are sized for native speed.
          export FELIX_TEST_TIMEOUT_SCALE=10
          export FELIX_IPM_REPS="${{ inputs.reps || '6' }}"
          if [ -n "${{ inputs.cells }}" ]; then export FELIX_IPM_CELLS="${{ inputs.cells }}"; fi
          export FELIX_IPM_RESTART_PROBE="${{ inputs.restart_probe && '1' || '0' }}"
          FELIX_BROKER_WRAPPER="valgrind --tool=callgrind --fair-sched=yes --callgrind-out-file=$RUNNER_TEMP/cg/cg.%p" \
            FELIX_IPM_DIR="$RUNNER_TEMP/cg" \
            FELIX_IPM_COMMIT="${{ github.event.pull_request.head.sha || github.sha }}" \
            FELIX_IPM_TOOLCHAIN="$(rustc --version)" \
            FELIX_IPM_OUT="$RUNNER_TEMP/ipm-result.json" \
            cargo test --locked --release -p felix-cluster --test instructions_per_message \
            -- --ignored --nocapture
          cp "$RUNNER_TEMP/ipm-result.json" ipm-result.json

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ipm-result-${{ matrix.arch }}
          path: ipm-result.json
          if-no-files-found: warn

      # Diagnostic: per-function cost of every callgrind part (one per rep).
      - name: Annotate profiles
        if: always()
        run: |
          mkdir -p prof
          for f in "$RUNNER_TEMP"/cg/cg.*; do
            b=$(basename "$f")
            head -c 2000 "$f" | grep -E "^(cmd|part|desc|summary|totals):" > "prof/$b.head" || true
            callgrind_annotate --inclusive=yes --threshold=99.9 "$f" 2>/dev/null | head -400 > "prof/$b.incl.txt" || true
            callgrind_annotate --threshold=99.9 "$f" 2>/dev/null | head -300 > "prof/$b.self.txt" || true
          done
          tar czf prof/raw.tgz -C "$RUNNER_TEMP/cg" . || true

      - name: Upload profiles
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ipm-prof-${{ matrix.arch }}
          path: prof

      - name: Compare with the baseline
        if: ${{ !inputs.native }}
        run: python3 scripts/perf/ipm_gate.py check ipm-result.json
