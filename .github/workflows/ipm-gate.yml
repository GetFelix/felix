name: Instructions per message

# Counts the CPU instructions the broker retires per acknowledged message and
# fails when that is more than the tolerance above scripts/perf/ipm-baseline.toml.
# Instruction counts barely move with runner noise, unlike throughput, so a
# per-message cost of a few percent shows up on the PR that adds it. See CONTRIBUTING.md.
#
# Not part of `CI ok`: whether it blocks merges is a repository setting.
# A pull request runs it only when it touches the broker's hot-path code.
# Otherwise it runs on workflow_dispatch only; there is no main or schedule run.

on:
  pull_request:
    paths:
      - "crates/server/**"
      - "crates/protocol/**"
      - "crates/sdk/felix-client/**"
      - "crates/testing/felix-cluster/**"
      - "crates/testing/felix-loadgen/**"
      - "services/felix-broker-service/**"
      - "scripts/perf/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/config.toml"
      - "rust-toolchain.toml"
      - ".github/workflows/ipm-gate.yml"
  workflow_dispatch:
    inputs:
      restart_probe:
        description: "Diagnostic: after each cell, restart the broker on its data and time one more rep"
        type: boolean
        default: false
      ab:
        description: "Diagnostic: Raft against the hybrid, interleaved, native, plus a hybrid perf record"
        type: boolean
        default: false
      profile:
        description: "Diagnostic: perf stat and perf record of the native broker at light load"
        type: boolean
        default: false
      native:
        description: "Diagnostic: measure the uninstrumented broker at light load instead"
        type: boolean
        default: false
      cells:
        description: "Diagnostic: comma-separated cells to measure (empty = all)"
        type: string
        default: ""
      reps:
        description: "Diagnostic: reps per cell"
        type: string
        default: "6"
      arms:
        description: "Diagnostic A/B: space-separated ref:engine arms, interleaved (e.g. main:raft main:hybrid)"
        type: string
        default: ""
      record_arms:
        description: "Diagnostic: ref:engine arms to perf record on a no-LTO frame-pointer build; the first is diffed against the rest"
        type: string
        default: ""
      passes:
        description: "Diagnostic: interleaved passes over the arms"
        type: string
        default: "2"
      arch:
        description: "Diagnostic: runner architecture (both, aarch64, x86_64)"
        type: string
        default: "both"

concurrency:
  group: ipm-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Diagnostic: line tables give callgrind_annotate inlined call sites.
  CARGO_PROFILE_RELEASE_DEBUG: line-tables-only

jobs:
  ipm:
    name: Broker instructions per message (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.arch == 'aarch64' && '[{"arch":"aarch64","runner":"ubuntu-24.04-arm"}]' || inputs.arch == 'x86_64' && '[{"arch":"x86_64","runner":"ubuntu-latest"}]' || '[{"arch":"x86_64","runner":"ubuntu-latest"},{"arch":"aarch64","runner":"ubuntu-24.04-arm"}]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          # Diagnostic arms check out other refs of this repository.
          fetch-depth: ${{ (inputs.arms != '' || inputs.record_arms != '') && '0' || '1' }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.100.0"

      - name: Rust cache
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-on-failure: true

      # Hosted runners expose no hardware performance counters (perf stat
      # reports instructions as unsupported), so the broker runs under callgrind.
      - name: Install valgrind
        if: ${{ !inputs.profile && !inputs.ab && inputs.arms == '' && inputs.record_arms == '' }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq valgrind
          valgrind --version

      # Release profile, as shipped: LTO and one codegen unit change the count.
      - name: Build
        run: |
          if [ -z "${{ inputs.arms }}${{ inputs.record_arms }}" ]; then
            cargo build --locked --release -p felix-broker-service --bin felix-broker
          fi
          cargo build --locked --release -p felix-loadgen
          cargo test --locked --release -p felix-cluster --test instructions_per_message --no-run

      # Diagnostic: each arm's broker is built from its own ref and swapped in
      # under the test binary; the harness, loadgen and test are this branch's.
      - name: Profile arms natively
        if: inputs.arms != '' || inputs.record_arms != ''
        env:
          ARMS: ${{ inputs.arms }}
          RECORD_ARMS: ${{ inputs.record_arms }}
          PASSES: ${{ inputs.passes || '2' }}
          CELLS: ${{ inputs.cells }}
        run: |
          sudo apt-get install -y -qq linux-tools-common "linux-tools-$(uname -r)" || sudo apt-get install -y -qq linux-tools-azure || true
          sudo sysctl -w kernel.perf_event_paranoid=-1
          sudo sysctl -w kernel.kptr_restrict=0
          mkdir -p prof/ab prof/rec "$RUNNER_TEMP/perf-rel" "$RUNNER_TEMP/perf-rec" "$RUNNER_TEMP/bin"
          if [ -n "$CELLS" ]; then export FELIX_IPM_CELLS="$CELLS"; fi
          slug() { echo "$1" | tr '/:' '__'; }
          build_arm() {
            local ref=$1 kind=$2 s dir out
            s=$(slug "$ref"); dir="$RUNNER_TEMP/src/$s"; out="$RUNNER_TEMP/bin/$kind-$s"
            [ -f "$out" ] && return 0
            if [ ! -d "$dir" ]; then
              local rev
              rev=$(git rev-parse --verify -q "origin/$ref^{commit}" || git rev-parse --verify "$ref^{commit}")
              echo "arm $ref -> $rev"
              git worktree add -q --detach "$dir" "$rev"
            fi
            if [ "$kind" = diag ]; then
              (cd "$dir" && CARGO_PROFILE_RELEASE_LTO=false CARGO_PROFILE_RELEASE_CODEGEN_UNITS=16 \
                RUSTFLAGS="-C force-frame-pointers=yes" \
                cargo build --locked --release -p felix-broker-service --bin felix-broker --target-dir "$RUNNER_TEMP/tgt-diag")
              cp "$RUNNER_TEMP/tgt-diag/release/felix-broker" "$out"
            else
              (cd "$dir" && cargo build --locked --release -p felix-broker-service --bin felix-broker --target-dir "$RUNNER_TEMP/tgt-rel")
              cp "$RUNNER_TEMP/tgt-rel/release/felix-broker" "$out"
            fi
          }
          use_arm() { cp "$RUNNER_TEMP/bin/$1-$(slug "${2%%:*}")" target/release/felix-broker; }
          run_test() {
            cargo test --locked --release -p felix-cluster --test instructions_per_message \
              broker_light_load_profile -- --ignored --nocapture --exact 2>&1
          }
          for arm in $ARMS; do build_arm "${arm%%:*}" release; done
          for arm in $RECORD_ARMS; do build_arm "${arm%%:*}" diag; done
          for pass in $(seq 1 "$PASSES"); do
            for arm in $ARMS; do
              use_arm release "$arm"
              FELIX_TEST_SHARD_ENGINE="${arm##*:}" FELIX_PROF_RECORD=0 FELIX_PROF_DIR="$RUNNER_TEMP/perf-rel" \
                FELIX_IPM_OUT="$PWD/prof/ab/$pass-$(slug "$arm").json" run_test | tee "prof/ab/$pass-$(slug "$arm").log" | grep -E "^profile " || true
            done
          done
          if [ -n "$ARMS" ]; then python3 scripts/perf/ab_table.py prof/ab $ARMS | tee prof/ab-table.txt; fi
          if [ -n "$RECORD_ARMS" ]; then
            # Sample by instructions where the runner counts them, so a sample is a fixed cost.
            if sudo perf stat -e instructions -x, -- true 2>&1 | grep -qE '^[0-9]+,'; then
              export FELIX_PERF_RECORD_EVENT="-e instructions -c 500000" PROF_UNIT=instructions
            else
              export FELIX_PERF_RECORD_EVENT="-e cpu-clock -c 100000" PROF_UNIT=ns
            fi
            first=""
            for arm in $RECORD_ARMS; do
              s=$(slug "$arm"); first=${first:-$s}
              use_arm diag "$arm"
              sudo rm -f "$RUNNER_TEMP"/perf-rec/*.data
              FELIX_TEST_SHARD_ENGINE="${arm##*:}" FELIX_PROF_ARM="$s" FELIX_PROF_RECORD=1 FELIX_PROF_DIR="$RUNNER_TEMP/perf-rec" \
                FELIX_IPM_OUT="$PWD/prof/rec/$s.json" run_test | tee "prof/rec/$s.log" | grep -E "^profile " || true
              # Symbolised now, while this arm's binary is the one in place.
              for f in "$RUNNER_TEMP"/perf-rec/*.data; do
                [ -e "$f" ] || continue
                sudo perf script -i "$f" -F comm,tid,period,ip,sym --no-inline 2>/dev/null > "prof/rec/$(basename "$f" .data).txt" || true
              done
            done
            for arm in $RECORD_ARMS; do
              s=$(slug "$arm"); [ "$s" = "$first" ] && continue
              python3 scripts/perf/prof_diff.py prof/rec "$first" "$s" | tee "prof/diff-$first-vs-$s.txt"
            done
            gzip -q prof/rec/*.txt || true
          fi
          echo '[]' > ipm-result.json

      - name: Profile natively
        if: (inputs.profile || inputs.ab) && inputs.arms == '' && inputs.record_arms == ''
        run: |
          sudo apt-get install -y -qq linux-tools-common "linux-tools-$(uname -r)" || sudo apt-get install -y -qq linux-tools-azure || true
          sudo sysctl -w kernel.perf_event_paranoid=-1
          sudo sysctl -w kernel.kptr_restrict=0
          perf --version
          ev=""
          for n in futex write writev pwrite64 pwritev pwritev2 fsync fdatasync sync_file_range sendmsg sendmmsg sendto recvmsg recvmmsg recvfrom read pread64 epoll_wait epoll_pwait epoll_pwait2 clock_gettime io_uring_enter sched_yield nanosleep clock_nanosleep; do
            if sudo test -d "/sys/kernel/tracing/events/syscalls/sys_enter_$n" || sudo test -d "/sys/kernel/debug/tracing/events/syscalls/sys_enter_$n"; then ev="$ev,syscalls:sys_enter_$n"; fi
          done
          ev="raw_syscalls:sys_enter$ev"
          echo "syscall events: $ev"
          export FELIX_PERF_SYSCALLS="$ev"
          mkdir -p prof "$RUNNER_TEMP/perf-rel" "$RUNNER_TEMP/perf-diag"
          if [ "${{ inputs.ab }}" = true ]; then
            # A then B then A then B on the shipped release build, so runner drift cancels.
            n=0
            for side in raft hybrid raft hybrid; do
              n=$((n+1))
              FELIX_TEST_SHARD_ENGINE=$side FELIX_PROF_RECORD=0 FELIX_PROF_DIR="$RUNNER_TEMP/perf-rel" FELIX_IPM_OUT="$PWD/prof/ab-$n-$side.json" \
                cargo test --locked --release -p felix-cluster --test instructions_per_message \
                broker_light_load_profile -- --ignored --nocapture --exact 2>&1 | tee "prof/ab-$n-$side.log" || true
            done
            SIDE=hybrid
          else
            # Stats only, on the shipped release build, for the overhead comparison.
            FELIX_PROF_RECORD=0 FELIX_PROF_DIR="$RUNNER_TEMP/perf-rel" FELIX_IPM_OUT="$PWD/prof/release.json" \
              cargo test --locked --release -p felix-cluster --test instructions_per_message \
              broker_light_load_profile -- --ignored --nocapture --exact 2>&1 | tee prof/release.log || true
            SIDE=raft
          fi
          export RUSTFLAGS="-C force-frame-pointers=yes"
          cargo build --locked --profile diag -p felix-broker-service --bin felix-broker
          cargo build --locked --profile diag -p felix-loadgen
          FELIX_TEST_SHARD_ENGINE=$SIDE FELIX_PROF_RECORD=1 FELIX_PROF_DIR="$RUNNER_TEMP/perf-diag" FELIX_IPM_OUT="$PWD/prof/diag.json" \
            cargo test --locked --profile diag -p felix-cluster --test instructions_per_message \
            broker_light_load_profile -- --ignored --nocapture --exact 2>&1 | tee prof/diag.log || true
          for f in "$RUNNER_TEMP"/perf-diag/*.data; do
            b=$(basename "$f" .data)
            sudo perf report -i "$f" --stdio --no-children --sort dso,symbol -g none --percent-limit 0.4 2>/dev/null | head -120 > "prof/$b.self.txt" || true
            sudo perf report -i "$f" --stdio --children --sort symbol -g none --percent-limit 1.5 2>/dev/null | head -160 > "prof/$b.incl.txt" || true
            sudo perf report -i "$f" --stdio --no-children --sort comm -g none 2>/dev/null | head -60 > "prof/$b.comm.txt" || true
            sudo perf report -i "$f" --stdio --no-children --sort symbol -g caller,0.5,callee,function,percent --percent-limit 3 2>/dev/null | head -900 > "prof/$b.paths.txt" || true
          done
          echo '[]' > ipm-result.json

      - name: Measure natively
        if: inputs.native
        run: |
          sudo apt-get install -y -qq linux-tools-common "linux-tools-$(uname -r)" || sudo apt-get install -y -qq linux-tools-azure || true
          sudo sysctl -w kernel.perf_event_paranoid=-1 || true
          perf stat -e instructions,task-clock -- true || true
          FELIX_IPM_OUT="$RUNNER_TEMP/ipm-result.json" \
            cargo test --locked --release -p felix-cluster --test instructions_per_message \
            broker_light_load_cpu -- --ignored --nocapture --exact
          cp "$RUNNER_TEMP/ipm-result.json" ipm-result.json

      - name: Measure
        if: ${{ !inputs.native && !inputs.profile && !inputs.ab && inputs.arms == '' && inputs.record_arms == '' }}
        run: |
          mkdir -p "$RUNNER_TEMP/cg"
          # Callgrind runs the broker tens of times slower than native, and the
          # harness's start-up waits are sized for native speed.
          export FELIX_TEST_TIMEOUT_SCALE=10
          export FELIX_IPM_REPS="${{ inputs.reps || '6' }}"
          if [ -n "${{ inputs.cells }}" ]; then export FELIX_IPM_CELLS="${{ inputs.cells }}"; fi
          export FELIX_IPM_RESTART_PROBE="${{ inputs.restart_probe && '1' || '0' }}"
          FELIX_BROKER_WRAPPER="valgrind --tool=callgrind --fair-sched=yes --callgrind-out-file=$RUNNER_TEMP/cg/cg.%p" \
            FELIX_IPM_DIR="$RUNNER_TEMP/cg" \
            FELIX_IPM_COMMIT="${{ github.event.pull_request.head.sha || github.sha }}" \
            FELIX_IPM_TOOLCHAIN="$(rustc --version)" \
            FELIX_IPM_OUT="$RUNNER_TEMP/ipm-result.json" \
            cargo test --locked --release -p felix-cluster --test instructions_per_message \
            -- --ignored --nocapture
          cp "$RUNNER_TEMP/ipm-result.json" ipm-result.json

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ipm-result-${{ matrix.arch }}
          path: ipm-result.json
          if-no-files-found: warn

      # Diagnostic: per-function cost of every callgrind part (one per rep).
      - name: Annotate profiles
        if: always()
        run: |
          mkdir -p prof
          for f in "$RUNNER_TEMP"/cg/cg.*; do
            [ -e "$f" ] || continue
            b=$(basename "$f")
            head -c 2000 "$f" | grep -E "^(cmd|part|desc|summary|totals):" > "prof/$b.head" || true
            callgrind_annotate --inclusive=yes --threshold=99.9 "$f" 2>/dev/null | head -400 > "prof/$b.incl.txt" || true
            callgrind_annotate --threshold=99.9 "$f" 2>/dev/null | head -300 > "prof/$b.self.txt" || true
          done
          tar czf "$RUNNER_TEMP/raw.tgz" -C "$RUNNER_TEMP/cg" . && mv "$RUNNER_TEMP/raw.tgz" prof/ || true

      - name: Upload profiles
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ipm-prof-${{ matrix.arch }}
          path: prof

      - name: Compare with the baseline
        if: ${{ !inputs.native && !inputs.profile && !inputs.ab && inputs.arms == '' && inputs.record_arms == '' }}
        run: python3 scripts/perf/ipm_gate.py check ipm-result.json
