name: tmp repro 2733
on:
  push:
    branches: ["fix/handoff-move-2733"]
permissions:
  contents: read
jobs:
  repro:
    name: repro (${{ matrix.variant }})
    runs-on: ${{ vars.FELIX_LARGE_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        variant: [main, fixed]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.99.1"
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Use main's test
        if: matrix.variant == 'main'
        run: git checkout origin/main -- crates/testing/felix-cluster/tests/routing/shutdown_handoff.rs
      - name: Build
        run: |
          cargo build -p felix-broker-service --bin felix-broker
          cargo test -p felix-cluster --test routing --no-run
      - name: Run 10 times
        env:
          FELIX_TEST_TIMEOUT_SCALE: "3"
        shell: bash
        run: |
          fail=0
          for i in $(seq 1 10); do
            if cargo test -p felix-cluster --test routing -- --exact shutdown_handoff::a_handoff_that_times_out_loses_no_acknowledged_record > "run-$i.log" 2>&1; then
              echo "run $i: pass"
            else
              echo "run $i: FAIL"; fail=$((fail+1)); grep -E "panicked|opened for a move|moving" "run-$i.log" | head -20
            fi
          done
          echo "RESULT ${{ matrix.variant }}: $fail/10 failed"
