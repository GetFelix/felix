# Dependency updates for felix.
# Docs: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2

updates:
  # --- Rust: the workspace ------------------------------------------------
  # Root Cargo.toml + Cargo.lock. Covers every member listed in
  # [workspace.members]; the crates excluded from it are handled below.
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "build"
      include: "scope"
    labels: ["dependencies", "rust"]
    cooldown:
      default-days: 7
    groups:
      cargo-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # --- Rust: crates outside the workspace ---------------------------------
  # felix-python, the storage fuzz target, and the four demo crates each carry
  # their own Cargo.lock and are invisible to a workspace-scoped update.
  # `task lint` / `task test` do not build these — `task demo:check` does.
  - package-ecosystem: "cargo"
    directories:
      - "/crates/sdk/felix-python"
      - "/crates/server/felix-storage/fuzz"
      - "/demos/cross_tenant_isolation"
      - "/demos/rbac-live"
      - "/demos/slow-consumer"
      - "/demos/state-divergence"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 4
    commit-message:
      prefix: "build"
      include: "scope"
    labels: ["dependencies", "rust"]
    # The demos depend on workspace crates by path, and those take
    # opentelemetry from [workspace.dependencies], so bumping it here edits
    # the root Cargo.toml without its Cargo.lock or tracing-opentelemetry.
    # #640 did exactly that and the workspace stopped compiling. It moves with
    # the workspace group instead.
    ignore:
      - dependency-name: "opentelemetry*"
      - dependency-name: "tracing-opentelemetry"
    groups:
      out-of-workspace-crates:
        patterns: ["*"]

  # --- GitHub Actions -----------------------------------------------------
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:30"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
      include: "scope"
    labels: ["dependencies", "ci"]
    groups:
      actions-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # --- docs-site (Astro / Starlight) --------------------------------------
  # astro, @astrojs/starlight, astro-mermaid and mermaid are pinned exactly and
  # move together; a split bump breaks `npm run build` at check:mermaid.
  #
  # Grouping alone cannot keep that promise. A group moves the packages that
  # have an update, not the ones that do not: #630 took mermaid to 12 while
  # astro-mermaid stayed at 2.1.0, whose peer range is `^10 || ^11`, and
  # `npm ci` then failed to resolve at all -- so the docs deploy broke on
  # main until it was reverted. mermaid's major is therefore held back until
  # astro-mermaid accepts it; drop the ignore in the same change that raises
  # astro-mermaid.
  - package-ecosystem: "npm"
    directory: "/docs-site"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    versioning-strategy: "increase"
    commit-message:
      prefix: "docs"
      include: "scope"
    labels: ["dependencies", "docs"]
    cooldown:
      default-days: 7
    ignore:
      # Capped by astro-mermaid's peer range, not by preference.
      - dependency-name: "mermaid"
        update-types: ["version-update:semver-major"]
    groups:
      astro:
        patterns: ["astro", "@astrojs/*", "astro-mermaid", "mermaid"]
      docs-site-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # --- Python -------------------------------------------------------------
  # scripts/perf/requirements.txt (matplotlib/pandas/pyarrow) and the maturin
  # build-system pin in crates/sdk/felix-python/pyproject.toml.
  - package-ecosystem: "pip"
    directories:
      - "/scripts/perf"
      - "/crates/sdk/felix-python"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "build"
      include: "scope"
    labels: ["dependencies", "python"]
    groups:
      python-tooling:
        patterns: ["*"]

  # --- Container base images ----------------------------------------------
  # The `rust` builder image tracks rust-toolchain.toml (1.99.1); bumping it
  # here alone would silently diverge the CI toolchain from the image toolchain,
  # so that one stays a manual, paired change.
  - package-ecosystem: "docker"
    directory: "/docker"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "06:30"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build"
      include: "scope"
    labels: ["dependencies", "docker"]
    ignore:
      - dependency-name: "rust"
    groups:
      base-images:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # --- Control-plane compose stack ----------------------------------------
  # Postgres major is pinned deliberately (coverage/test containers run 15).
  - package-ecosystem: "docker-compose"
    directory: "/services/felix-controlplane-service"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    commit-message:
      prefix: "build"
      include: "scope"
    labels: ["dependencies", "docker"]
    ignore:
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]

  # --- Dev container ------------------------------------------------------
  - package-ecosystem: "devcontainers"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    commit-message:
      prefix: "build"
      include: "scope"
    labels: ["dependencies"]
