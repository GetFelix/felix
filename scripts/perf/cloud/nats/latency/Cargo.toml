[package]
name = "nats-latency"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "felix-loadgen's pubsub latency scenario, against NATS"
publish = false

# Not a member of the repository workspace: it has nothing to do with Felix's
# build, and its dependency tree should not enter cargo-deny's scope.
[workspace]

[dependencies]
anyhow = "1"
# Pinned exactly so every run uses the same client.
async-nats = "=0.50.0"
bytes = "1"
futures = "0.3"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }

# The same release profile as the Felix workspace, so neither client gets a
# better build.
[profile.release]
lto = "fat"
codegen-units = 1
