#cloud-config
# One parity box: build tools, Java (Kafka's own perf tools), and one ext4 volume at
# /mnt/build (local NVMe or a managed data disk), where run.sh and node.sh keep everything.
# azure.sh renders this file: __SSH_PORT_STANZA__ becomes extra sshd Port lines.
package_update: true
packages:
  - build-essential
  - pkg-config
  - libssl-dev
  - cmake
  - clang
  - protobuf-compiler
  - git
  - curl
  - mdadm
  - fio
  - jq
  - sysstat
  - openjdk-17-jre-headless
  - python3
write_files:
  - path: /etc/sysctl.d/99-felix-parity.conf
    content: |
      net.core.rmem_max = 26214400
      net.core.wmem_max = 26214400
      net.core.rmem_default = 8388608
      net.core.wmem_default = 8388608
      net.core.netdev_max_backlog = 250000
  - path: /etc/ssh/sshd_config.d/10-parity.conf
    content: |
      Port 22
      __SSH_PORT_STANZA__
  - path: /usr/local/sbin/parity-mount.sh
    permissions: "0755"
    content: |
      #!/bin/sh
      # One volume at /mnt/build, from the local NVMe disks (L series) or the one managed data
      # disk (DATA_DISK=premiumv2). Never the OS disk. azure.sh fills in the mode and size.
      set -e
      MODE=__DATA_DISK__
      umount /mnt 2>/dev/null || true
      LOCAL=""
      if [ "$MODE" = local ]; then
        for l in /dev/disk/azure/local/by-index/*; do
          [ -e "$l" ] && LOCAL="$LOCAL $(readlink -f "$l")"
        done
      else
        # The agent's udev rules name the data disk by LUN; without them, take the one whole
        # disk of the expected size that nothing is mounted on.
        for i in $(seq 1 30); do
          for l in /dev/disk/azure/data/by-lun/0; do
            [ -e "$l" ] && LOCAL="$(readlink -f "$l")"
          done
          [ -n "$LOCAL" ] && break
          want=$((__DISK_GIB__ * 1073741824))
          LOCAL=$(lsblk -bdnpo NAME,SIZE,TYPE,MOUNTPOINTS | awk -v w="$want" '$3 == "disk" && $2 == w && $4 == "" {print $1; exit}')
          [ -n "$LOCAL" ] && break
          sleep 2
        done
      fi
      if [ -z "$LOCAL" ]; then
        echo "no $MODE data disk found" > /var/lib/parity-failed
        exit 1
      fi
      set -- $LOCAL
      if [ "$#" -gt 1 ]; then
        mdadm --create /dev/md0 --level=0 --raid-devices=$# $LOCAL --run --force
        DEV=/dev/md0
      else
        DEV="$1"
      fi
      wipefs -a "$DEV"
      mkfs.ext4 -F -m 0 "$DEV"
      mkdir -p /mnt/build
      UUID=$(blkid -s UUID -o value "$DEV")
      grep -q ' /mnt/build ' /etc/fstab || echo "UUID=$UUID /mnt/build ext4 defaults,nofail,noatime 0 2" >> /etc/fstab
      mount /mnt/build
      chown felix:felix /mnt/build
      echo "$DEV $LOCAL" > /var/lib/parity-disk
runcmd:
  # A VM that lives for hours must not restart services under a measurement.
  - systemctl disable --now apt-daily.timer apt-daily-upgrade.timer || true
  - systemctl mask apt-daily.service apt-daily-upgrade.service unattended-upgrades.service || true
  - /usr/local/sbin/parity-mount.sh
  - sysctl --system
  # rustup only; cargo fetches the toolchain the tree's rust-toolchain.toml names on first use.
  - su - felix -c "curl --proto '=https' --tlsv1.2 -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none"
  - systemctl disable --now ssh.socket || true
  - systemctl enable ssh || true
  - systemctl restart ssh
  - touch /var/lib/parity-ready
