#cloud-config
# The load generator — the measuring instrument, not the measured system.
# main.bicep substitutes the felix-loadgen spec (name@sha), the broker specs
# to build (space-separated, may be empty), the frame-pointer specs, and
# provision-loadgen.sh base64-encoded, in that order.
#
# Built here, once, during provisioning: the instrument's build does not
# contaminate a measurement, and building it before any run is what keeps the
# machines quiet while one is underway. Generator 0 also builds the broker refs
# under test and serves them to the VNet; the brokers never build anything.
# No braces in this file outside the placeholders: format() would read them.
package_update: true
packages:
  - build-essential
  - pkg-config
  - jq
write_files:
  # The instrument is a QUIC endpoint too: Linux clamps its SO_RCVBUF/SO_SNDBUF
  # to net.core.rmem_max/wmem_max, so an untuned loadgen would throttle at ~208 KB
  # and cap the numbers it reports. Same values as the brokers.
  - path: /etc/sysctl.d/99-felix-quic.conf
    content: |
      net.core.rmem_max = 26214400
      net.core.wmem_max = 26214400
      net.core.rmem_default = 8388608
      net.core.wmem_default = 8388608
      net.core.netdev_max_backlog = 250000
      net.core.netdev_budget = 600
  - path: /usr/local/sbin/felix-provision-loadgen.sh
    permissions: "0755"
    encoding: b64
    content: {3}
runcmd:
  # The daily apt upgrade restarts services whose libraries changed. A
  # restarted control plane forgets the session (its store is in memory), so
  # every token goes invalid mid-run. A session VM lives for hours; no updates.
  - systemctl disable --now apt-daily.timer apt-daily-upgrade.timer || true
  - systemctl mask apt-daily.service apt-daily-upgrade.service unattended-upgrades.service || true
  - sysctl --system
  - /usr/local/sbin/felix-provision-loadgen.sh provision "{0}" "{1}" "{2}" > /var/log/felix-provision.log 2>&1
