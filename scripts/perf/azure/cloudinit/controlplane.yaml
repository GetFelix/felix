#cloud-config
# The control plane for one perf session. {0} is the release tarball URL and
# {1} the bootstrap token, substituted by main.bicep. With an empty URL the
# session builds its own refs: seed.sh installs one and starts the service.
#
# Runs the release binary (RELEASE_TAG must be >= v0.3.1): the real-IdP fixes
# this suite depends on — accepting alg-less Entra JWKS keys, and a configurable
# exchange-token TTL — shipped in v0.3.1. (v0.3.0 could not validate an Entra
# token at all, and briefly this template built the control plane from source to
# get the fix before v0.3.1 existed; the release binary is the right artifact
# now, and it is what the suite is supposed to measure.)
#
# Memory-backed store, deliberately: this suite measures the data plane, and
# a session's metadata fits in memory and dies with the session. The
# control-plane-HA story has its own Postgres-backed tests.
package_update: true
write_files:
  # The control plane is REST/TCP, not QUIC, so it does not need the UDP-buffer
  # relief the brokers do — but net.core.rmem_max/wmem_max also caps TCP socket
  # buffers, and keeping every Linux node tuned the same way removes it as a
  # variable when reading a session's numbers. Harmless where it does not help.
  - path: /etc/sysctl.d/99-felix-quic.conf
    content: |
      net.core.rmem_max = 26214400
      net.core.wmem_max = 26214400
      net.core.rmem_default = 8388608
      net.core.wmem_default = 8388608
  - path: /usr/local/sbin/felix-controlplane-env.sh
    permissions: "0755"
    content: |
      #!/usr/bin/env bash
      set -euo pipefail
      ip=$(curl -s -H Metadata:true \
        "http://169.254.169.254/metadata/instance/network/interface/0/ipv4/ipAddress/0/privateIpAddress?api-version=2021-02-01&format=text")
      mkdir -p /etc/felix
      cat > /etc/felix/controlplane.env <<ENV
      FELIX_CONTROLPLANE_BIND=$ip:8080
      FELIX_CONTROLPLANE_METRICS_BIND=$ip:9200
      FELIX_REGION_ID=azure
      FELIX_BOOTSTRAP_ENABLED=true
      FELIX_BOOTSTRAP_BIND_ADDR=$ip:8081
      FELIX_BOOTSTRAP_TOKEN={1}
      # Entra ID signs its JWTs with RS256 (occasionally PS256); the exchange
      # allowlist defaults to ES256 only and would 401 the real IdP token as
      # "invalid token". Allow the RSA families the app actually uses, keeping
      # ES256 too. This is the real-IdP hot path the suite exists to measure.
      FELIX_CONTROLPLANE_OIDC_ALLOWED_ALGORITHMS=ES256,RS256,PS256
      # A broker holds its node token statically for its whole lifetime (it is
      # read once, with no refresh), so the exchange's default 900s TTL drops
      # every broker out of the cluster 15 minutes in. Mint tokens that outlast
      # a full provision+seed+matrix session.
      FELIX_EXCHANGE_TOKEN_TTL_SECONDS=28800
      ENV
  - path: /etc/systemd/system/felix-controlplane.service
    content: |
      [Unit]
      Description=Felix control plane (perf session)
      After=network-online.target
      Wants=network-online.target

      [Service]
      # Generate the env file from instance metadata before every start: the
      # private IP is not known when the template renders, so the unit writes
      # it at boot (the broker unit does the same). Without this the service
      # fails "Failed to load environment files" on a fresh VM.
      ExecStartPre=/usr/local/sbin/felix-controlplane-env.sh
      EnvironmentFile=/etc/felix/controlplane.env
      ExecStart=/usr/local/bin/felix-controlplane
      Restart=on-failure

      [Install]
      WantedBy=multi-user.target
runcmd:
  # The daily apt upgrade restarts services whose libraries changed. A
  # restarted control plane forgets the session (its store is in memory), so
  # every token goes invalid mid-run. A session VM lives for hours; no updates.
  - systemctl disable --now apt-daily.timer apt-daily-upgrade.timer || true
  - systemctl mask apt-daily.service apt-daily-upgrade.service unattended-upgrades.service || true
  - sysctl --system
  - |
    if [ -n "{0}" ]; then
      set -e
      curl -fsSL "{0}" -o /var/tmp/felix.tar.gz
      mkdir -p /opt/felix/release
      tar -xzf /var/tmp/felix.tar.gz -C /opt/felix/release --strip-components=1
      echo "release {0}" > /opt/felix/release/REF
      ln -sfn /opt/felix/release/felix-controlplane /usr/local/bin/felix-controlplane
    fi
  # Pre-generate the env file before the first start. systemd validates a
  # (dashless) EnvironmentFile *before* it runs ExecStartPre, so the ExecStartPre
  # that writes this file cannot satisfy the first start — the service would fail
  # "Failed to load environment files" and give up. Writing it here in runcmd
  # breaks that chicken-and-egg; ExecStartPre still regenerates it on reboots.
  - /usr/local/sbin/felix-controlplane-env.sh
  - systemctl daemon-reload
  - if [ -x /usr/local/bin/felix-controlplane ]; then systemctl enable --now felix-controlplane; fi
  - touch /var/lib/cloud/instance/felix-provisioned
