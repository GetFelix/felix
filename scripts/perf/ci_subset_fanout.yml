{
  "defaults": {
    "trials": 5
  },
  "workload": {
    "_comment": "One acked publisher and N subscribers, each on its own connection: what each subscriber adds to the publisher's round trip and to delivery. p50/p99 are the first subscriber's; throughput is the publisher's acked rate.",
    "fanout": [1, 100],
    "batch": [1],
    "payload_bytes": [256],
    "warmup": 500,
    "total": 3000,
    "binary": false
  },
  "profiles": {
    "balanced": {
      "env": {
        "FELIX_EVENT_BATCH_MAX_DELAY_US": "250",
        "FELIX_PUBLISH_CHUNK_BYTES": "16384"
      }
    },
    "drop_new": {
      "_comment": "The production default policy. The demo otherwise forces Block. 500 warmup + 3000 measured stays under the 4096-deep subscriber queue, so nothing is dropped.",
      "env": {
        "FELIX_EVENT_BATCH_MAX_DELAY_US": "250",
        "FELIX_PUBLISH_CHUNK_BYTES": "16384",
        "FELIX_SUB_QUEUE_POLICY": "drop_new"
      }
    }
  },
  "presets": {
    "P1_conn_per_sub": {
      "args": [
        "--pub-conns", "1", "--pub-streams-per-conn", "1", "--pub-sharding", "hash_stream",
        "--sub-conns", "100", "--idle-ms", "10000"
      ]
    }
  },
  "preset_order": ["P1_conn_per_sub"]
}
